-가=(一部の名詞の後ろに付いて) 「それを専門的にする人」または「それを専攻する人」の意を添える接頭辞。／(一部の名詞の後ろに付いて) 「そのことを職業とする人」の意を添える接頭辞。／(一部の名詞の後ろに付いて) 「そのことに長けているか、気質がある人」の意を添える接頭辞.
-간=(時間を表す名詞の後ろに付き)「の間」の意味を添える接尾辞。／(場所を表す一部の名詞の後ろに付き)「場所」の意味を添える接尾辞。
-감=(一部の名詞の後ろに付いて)「感じ」の意味を添える接尾辞。心の中で感じる気分や情緒、または外部の刺激から受ける印象を表す時に使う。
-객=(一部の名詞の後ろに付き) 「その物事や行動をする人」の意を添える接頭辞。／(一部の名詞の後ろに付き) 「その場所を訪れた人」または「客」の意を添える接頭辞。
-관=(一部の名詞の後に付き)「公共機関」や「建物」、「施設」の意味を添える接尾辞。／(一部の名詞の後に付き)「特定の目的のために建てられた展示室」や「商店」の意味を添える接尾辞。／(一部の名詞の後に付き)「それに対する見解や考え、態度」の意を添える接尾辞。
-권=(権利や資格の意を表す接辞) あることができる法的な権利や資格であることを表す。／(範囲や領域の意を表す接辞) 特定の地理的範囲や勢力、環境的な影響が及ぶ領域であることを表す。
-기=(名詞形語尾のように使われ) 動詞や形容詞の語幹の後につき、その言葉を名詞のように機能させる。主に事柄の性質や状態を表す時に使われる。／一部の動詞の語幹の後につき、その動作をする機械や道具の意味を添える。
-님=(人を表す一部の名詞や人名の後に付いて) その人を高めて呼んだり言ったりする言葉。尊称の意味を添える。／(物を表す一部の名詞の後に付いて) その対象を擬人化して高めて呼んだり言ったりする言葉。
-당=(数量を表す名詞の後に付いて) 「その数量や単位ごとに」という意味を添える接尾辞。
-력=一部の名詞の後ろに付き、「力」の意味を添える接尾辞。
-료=使用料や手数料などのように、あるサービス、施設、品物などを利用したり借りたりした対価として支払う費用を表す。
-률=(一部の名詞の後ろに付き) 「比率」の意味を添える接尾辞。(ただし、母音やパッチム「ㄴ」の後では「-율」と書き、それ以外の類の子音パッチムの後では「-률」と書く。)
-문=一部の名詞の後ろに付き、「特定の形式や内容を備えた文」を表す時に使われる言葉。
-물=一部の名詞の後ろに付き、「物」や「物体」、または「生産物」の意味を添える接尾辞。特に農業、水産業など特定の分野で生産された産物を表す時によく使われる。
-법=(一部の名詞の後ろに付き)「方法」、「方式」または「道理」の意を添える接尾辞。／(一部の名詞や語根の後ろに付き)「法則」または「規則」の意を添える接尾辞。／(一部の名詞の後ろに付き)「文法的な範疇」の意を添える接尾辞.
-별=(一部の名詞の後に付き)「それによる」または「それによって分けた」という意味を添える接尾辞。
-비=一定の目的のために使われる金銭や費用の意味を添える接尾辞。主に名詞の後ろに付き、その事に費やされる資金を表す。
-사=「専門的な技術や資格を持つ人」の意味を添える接尾辞。／「職業的に特定の仕事に従事する人」の意味を添える接尾辞。／一部の名詞の後ろに付き、「その仕事に専門的な知識と技術を持って従事する人」の意味を添える接尾辞。特に料理や技術職など、専門的な役割を果たす人を指す時に使われる。／一部の名詞に付き、「新聞発行を専門とする機関や団体」の意味を添える接尾辞。
-생=(一部の名詞の後ろに付いて)「その年に生まれたこと」の意を添える接尾辞。主に生まれた年度を表す数字や干支の後ろに使われる。／(一部の名詞の後ろに付いて)「その分野の技術や知識を学ぶ学生」の意を添える接尾辞。／(一部の名詞の後ろに付いて)「その学校に通う学生」の意を添える接尾辞。
-성=一部の名詞の後ろに付き、「性質」、「傾向」、「状態」、または「程度の意味」を添える接尾辞。対象が持っている固有の特性や素地を表す時に使われる。
-소=(一部の名詞の後に付き)「それに関連する仕事を行ったり、事務を処理したりする場所」の意味を添える接頭辞。
-심=一部の名詞の後に付き、「それを持つ心」または「そのような性質の心」の意味を添える接尾辞。
-씩=数量を表す言葉の後につき、「その数量で分けられたり、繰り返されたりすること」の意味を添える接尾辞。
-어=末音節の母音が「ㅏ, ㅗ」ではない用言の語幹の後ろに付き、後に来る補助用言とつなぐ連結語尾。／末音節の母音が「ㅏ, ㅗ」ではない用言の語幹の後ろに付き、ある動作や状態が他の動作や状態の手段、方法、原因、時間的な前後関係であることを表す連結語尾。／「ヘラ体（ため口）」で文章を結ぶ終結語尾。親しい間柄で、質問、命令、感嘆、叙述の意味で広く使われる。
-여=数量を表す言葉の後に付き、「その数を超える」という意味を添える接尾辞。通常、十、百、千、万のような単位名詞や数字を表す言葉の後に使われる。
-용=(一部の名詞の後ろに付いて)「それを対象にしたり、それに使われたりすること」の意を添える接尾辞。
-원=「公共機関や施設」または「一定の目的のために建てられた建物」の意味を添える接尾辞。主に学問、教育、医療、福祉などに関連する機関名の後に付く。／(一部の名詞の後ろに付き)「その機関や団体に属して働く人」、または「その職責や身分に属する人」の意を添える接頭辞。
-율=(一部の名詞の後に付き)「比率」の意味を加える接尾辞。前の言葉にパッチムがあるか、「ㄴ」パッチムで終わる場合には「-률」と書き、それ以外の場合は「-율」と書く。
-이=(一部の形容詞に付き) 状態や程度が激しいことを表し、副詞を作る接尾辞。／(一部の名詞に付き) 「それを特性として持つ人」または「そのような人」の意味を添える接尾辞。／(一部の動詞の語幹に付き) 名詞を作る接尾辞。
-자=(一部の名詞の後ろに付き) 「そのことをする人」または「その仕事に従事する人」の意味を添える接尾辞。
-장=一部の名詞の後ろに付き、「場所」の意味を添える接尾辞。主に運動、作業、または特定の用途の施設が備わった場所を表す。
-적=一部の名詞の後ろに付き、その名詞の持つ性質や状態を表す言葉を作る接尾辞。
-점=「店」または「商店」の意味を加える接尾辞。主に特定の物を売ったりサービスを提供したりする場所を表す名詞の後に付く。
-제=「接辞」(一部の名詞の後について)「薬」の意味を添える接尾辞。／「接辞」(一部の名詞の後について)「制度」の意味を添える接尾辞。／「接辞」(一部の名詞の後について)「製品」や「品物」の意味を添える接尾辞。／「祭祀」の意味を加える接尾辞。主に歴史的な人物を称えたり、宗教的な儀式を表したりする時に使われる。／「祝祭（まつり）」の意味を加える接尾辞。学校や団体などで行われる催しや行事を表す時に使われる。
-질=道具を使ってする仕事を表す接尾辞。／身体部位を利用した反復的な行動を表す接尾辞。／良くない行為や卑下する性格の仕事を表す接尾辞.／特定の職業や身分に従事することを低めて言う接尾辞。
-째=(数量を表す言葉の後ろに付き) 「その数量の分すべて」または「その状態のまま」という意味を添える接尾辞。／(順序を表す言葉の後ろに付き) 「その順番」という意味を添える接尾辞。／(期間を表す名詞の後ろに付き) 「その期間中ずっと継続していること」という意味を添える接尾辞。
-쯤=(数量を表す名詞や名詞句に付き) 「程度」の意を添える接尾辞。／(時を表す名詞に付き) 「～ごろ」の意を添える接尾辞。
-품=(一部の名詞の後に付いて)「品物」、「製品」、「作品」の意味を添える接辞。主に製造されたり加工された物品、または芸術的な創作物を表す時に使われる。
-학=一部の名詞の後ろに付き、「それを研究対象とする学問」という意味を添える接尾辞。
-행=(一部の名詞の後に付いて)「その場所へ行くこと」または「その場所へ行く輸送手段」の意味を添える接尾辞。主に目的地を表す時に使われる。
-형=(一部の名詞の後について)「その形を持つもの」の意を添える接尾辞。／(一部の名詞の後について)「その類型や形態に属すること」の意を添える接尾辞。／(一部の名詞の後について)「それを標準とした規格」の意を添える接尾辞。
-화=一部の名詞の後ろに付き、「そのようになること」または「そのようにすること」の意味を添える接尾辞。ある状態や性質に変化する過程を表す。
가령=仮に。もし。（主に「-더라도（～だとしても）」、「-라면（～なら）」などと共に使われ、前の事実を仮定することを表す。）／例えば。（説明を助けるために具体的な例を挙げる時に使う。）
가로=左から右へ続く方向。またはその長さ。（「たて（세로）」と反対の概念）／平面や物体で横に渡った長さ。／左から右へ、または右から左へ置かれた方向。（反対語：縦（たて））／物体の横の長さ。／何かを横断したり横切ったりする方向。
가르침=知識、技能、道理などを悟らせたり習得させたりすること。また、その内容。／聖人や師匠が与える訓戒や道徳的な指導。／宗教的な教理や信仰の指導。
가만=動かずに、あるいは何も言わずに状態を維持する様子。／物事に口出ししたり干渉したりせず、そのままにしておく様子。／対象を詳しく観察したり、深く考えたりする様子。／音が聞こえないほど非常に静かに。
가상=実際にはない事実を、事実であるかのように仮定して考えること。／コンピュータネットワークなどを通じて、実際と類似した環境や状況を人工的に作り出すこと。
가하다=力、圧力、影響などをある対象に及ぼす。／ある数に別の数を足す。／ある状態や条件に何かを加えたり加味したりする。／行為や措置を取る。
각기=複数のものがある中で、それぞれ。または、人ごとに別々に。
간부=ある組織や団体で中心となり、中心的な業務を担って率いていく人(幹部)。
간접=中間に他の物や人を介してつながること。（↔ 直接）／ある事の影響が直接及ばず、他の媒体を通じて伝わること。
감소하다=量や数値が減って少なくなると。
감시=人や現象などを注意深く見守ること。特に過ちや否定的な行為が起きないように取り締まったり見張ったりすることを意味する。
강남=川の南側の地域を指す言葉。／韓国の首都、ソウル特別市を横切る漢江（ハンガン）の南側の地域。特に江南区、瑞草区、松坡区の一帯を総称する。／中国の揚子江下流の南側の地方。
강력하다=力や影響力、勢いなどが非常に強い。／考えや態度、意志などが非常に断固としていて強い。
강력히=力や勢いが非常に強く、堂々としているさま。／意志や態度が非常に断호（だんこ）としていて、強いさま。
강렬하다=力や勢いが非常に強く、激しい。／色、光、香りなどが際立って鮮やかで濃い。／感情、印象、意志などが非常に強く、心の中に深く残るほどだ。
강요=ある事を強制的に要求すること。または無理やりさせること。／親や権力者など、相手より優位に立つ人が自分の意思を他人に無理やり受け入れさせる行為。
강요하다=無理に、または威圧的な手段である物事をさせたり要求したりすること（強要する / 強いる）。
강화하다=勢力や力をより強くすること。／水準や程度を高めて、より丈夫にしたり厳しくしたりすること。
같이하다=他人と何かを共にする。／互いに何かを同じにしたり、同じ状態にしたりする。／経験、生死、運命などを共に経験する。／志や意見などを互いに一致させる。
개국=국가를 세는 단위. 주로 숫자 뒤에 쓰여 국가의 수를 나타냄(ヶ国)。
개념=ある物事や現象に対する一般的な知識や考え。／様々な観念の中から共通の要素を抜き出し、総合した観念。／(日常的用法) 物事や状況に対する態度や常識。
개발=知識や才能、新再生エネルギーなどを発達させたり、有用なものにすること。／土地や天然資源などを開拓して、有用なものにすること。／新しい産業、技術、製品などを研究して作り出すこと。
개발되다=土地や天然資源などが有用なものにされる。（産業や経済発展のために国土を切り拓いたり、資源を得られる状態になる。）／新しい技術、製品、方法などが作られる。（知識や才能を発揮して新しいものを考案したり、進歩した状態になる。）／知能、才能、能力などが啓発されたり向上したりする。（個人の能力や素質が発展した状態に至る。）
개방하다=自由に出入りしたり利用したりできるように、門や空間を開放する。／禁止していたことを解き、自由に交流したり活動したりできるようにする。／（考えや態度などが）形式にこだわらず、進取的で自由だ。
개선되다=欠点や不足している点、悪い状態などが改められて良くなる。（主に制度、環境、関係、性能などに使われる。）
개선하다=不備な点や足りない点を改めて、より良くする（改善する）。
개최=集会、行事、大会などを組織的に計画して開くこと（開催）。
개혁=制度や機構、団体などを新しく改めること。／合法的な手続きを通じて社会の漸進的な変化を図ること。
거대=形や大きさ、規模が非常に大きいこと。
거대하다=形や規模がものすごく大きい（巨大だ）。
거듭=同じ状態や出来事が二度以上、何度も繰り返して。／行っていたことを一度休んでから、再び始めて。
거래=品物や金銭などが行き来し、売買が行われること（取引 / 売買）。／人や機関、国家の間である事柄が行われたり、関係を結んだりすること（取引 / 交渉）。／親しく付き合い、行き来すること（交流 / 行き来）。
거미=[動物] クモ綱クモ目に属する節足動物を総称する言葉。体は頭胸部と腹部の二つの部分に分かれ、脚は8本で目は通常8個である。肛門付近の糸疣から出る糸で網を張り、虫を捕らえて食べる。／(比喩的) 外見が醜悪であったり、他人の血と汗を搾り取って利益を得る人を比喩的にいう言葉。
거부하다=要求、提案、交渉などを受け入れずに拒絶する。／ある対象や現象を認めなかったり、逆らったりする。／(法律) 特定の議決や決定を承認せずに差し戻す。
거액=非常に多額のお金（巨額）。
거절하다=相手の要求、提案、贈り物、頼みなどを受け入れずに退けること（拒絶する / 断る）。
거지=他人に乞い願って食べていく人。経済的に非常に貧しく、自ら生計を維持できない人を卑俗に、または見下げて言う言葉(乞食)。／(比喩的に) 持っているものが何もないか、非常にひどい状態に置かれている人。／(接辞のように使われ) ある行動や状態がひどく激しい、または品位のない人を卑下して言う言葉。
걱정되다=安心できず、気が気でなかったり、はらはらしたりする状態になる。／物事がうまくいかないのではないかと恐れたり、気にかけたりするようになる。
건=事件や案件を数える単位。または、書類や文書の数量を表す単位。
건설하다=建物、施設、橋、道路などを新しく作って建てる。／国家、組織、社会、体制などを新しく作ったり立てたりする。
건전하다=思想や態度、行動などが正しくて健全だ。／状態が正常で、問題がない。／経済的基盤や組織の体系が堅実で安定している。
걸레=汚れた場所を拭いたり拭き取ったりするのに使う布（雑巾）。／(比喩的) ひどくほつれたり、ボロボロになったりした物を指す言葉。／(俗語) 素行が汚かったり不良だったりする人を卑しめて言う言葉。
검색=本やコンピュータのデータベースなどで、必要な情報を探し出すこと。／（主にインターネット環境で）ポータルサイトやエンジンを利用して、特定のキーワードに関する資料を探す行為。
겉옷=体の上に切る服の中で、一番外側に着る服（コート、ジャンパー、ジャケットなど）。／下着の上に切る服をひっくるめて言う言葉。
게시=人々に知らせるために掲げたり貼ったりして公開すること。／インターネットのホームページやSNSなどのオンライン空間に文章、絵、映像などをアップロードすること。
격려=勇気や意欲が湧くように元気づけること（激励 / 励まし）。
견학=実際に見て学식이나 경험을広げること。主に学校や機関で教育的な目的のために博物館、工場、遺跡などを訪問し、直接観察することを意味する(見学)。
결과적=ある原因や行為によって現れる結果に関すること。／(主に「結果的に」という形で使われ) 最終的な状況や締めくくられた状態から見てそうであること。
결근=仕事を休んで職場に出ないこと（欠勤）。
결제=証券や代金をやり取りし、売買当事者間の取引関係を終了させること（決済）。
결합=二つ以上の物や要素が互いに合わさって一つになること。／[化学] 原子、分子、イオンなどが化学的な力によって互いに連結され、化合物を形成すること。
겸손=他人を尊重し、自分を控えめにする態度があること。また、そのような言葉や行動（謙遜）。
계기=ある出来事が起きたり変化したりする決定的な原因や機会（きっかけ / 契機）。／[哲学] 物事の関連の中で、その成立に必ず必要な決定的要素（モーメント / 契機）。
고국=先祖代々住んできた国。または、自分の国（故国 / 母国 / 故郷）。
고궁=昔の宮殿。特に今日まで保存状態が良好で、歴史的価値を持つ旧王朝の宮殿を指す。
고대=古代。非常に昔。歴史的な時期区分で中世以前の時代を指す。／切望。非常に待ちわびること。
고독=世の中に一人取り残されているようで、非常に寂しく心細いこと。周りに誰もいないか、関係が絶たれて感じる寂しい状態。
고등=水準や段階が高いこと。／物事の発達段階や組織の水準が高く、複雑であること。／人類の知的活動や学問的深まりが深化した状態。
고래=哺乳類クジラ目に属する動物を総称する言葉。肺で呼吸し、子を産んで母乳で育てる。体が非常に大きく海で生活し、頭の上の噴気孔から水を吹き出す（クジラ）。
고려=物事を行うにあたって、様々な状況や事情を慎重に考えること(考慮)。／(主に「-を考慮する」の形で使われ) 前もって生じた状況や条件を問題解決の要素として含めること。／918年に太祖王建が建国し、1392年まで朝鮮半島に存在した国家。仏教文化が隆盛し、世界的に「Korea」という名を広めた時期である。／高句麗を継承するという意味で使われた高句麗の別称。
고무=ゴムの木の乳液や石油化学原料を加工して作った弾力性のある物質。伸縮性が良く、水が染み込まない特徴がある。／ゴムを材料にして作った品物や道具。
고백=心の中で思っていることや隠しておいた事実を、ありのままに話すこと。／[宗教] 自分が犯した罪を神や仏、または神父や僧侶に告げること。／愛する気持ちを相手に表現して伝えること。
고요=何の音もなく、ひっそりとしていること。または、そのような状態(静寂 / 静けさ)。／心が揺らぐことなく、安らかで穏やかな状態(平静)。
고요하다=音もなく静まり返っていて、非常に静かだ。／動きや騒がしさがなく、平穏で平和だ。／心の動揺がなく、安らかで落ち着いている。
고유=本来から持っている特有のもの。／ある物事や集団などが他と混ざらず、それだけが持っている状態。
고작=期待や予想に及ばないことを表す言葉。「やっと」、「せいぜい」の意を表す。／数量が非常に少ないことを表す言葉。
고정=一度決まった状態が変更されないこと。／物体が動かないように付けたり打ち込んだりすること。／[経済] 一定期間、変わらずに入ってきたり出ていったりする状態。（例：固定収入、固定費用）
고집하다=自分の意見や主張を曲げずに、かたくなに突き通す。／ある状態や態度を変えずに、そのまま守り通す。
고춧가루=乾燥させた唐辛子を挽いて粉にしたもの。主に料理に辛味を加えたり、赤い色をつけたりする調味料として使われる。／(比喩的意味) 物事が順調に進んでいる最中に邪魔をしたり、雰囲気を台無しにしたりする要素を指す言葉。
고층=何層にも高く積み重なった層。または、そのような建物。／高い空の層（気象学などで主に使われる）。
고함=口を大きく開けて、大きく強く張り上げる声（叫び声 / 大声）。
곤란=事情が非常に厳しく、立場が苦しいこと。／暮らしが貧しくて生活が苦しいこと。／処理するのが難しかったり、困惑したりすること。
곤란하다=事情が非常に気の毒だったり、状況が苦しくて処置しにくい。／状況が面食らったり困惑したりして、どう行動すべきか分からない。／貧しくて生活が苦しい。
곧이어=あることが終わった直後に、続いて。
골다=眠りながら息をするとき、鼻と喉の間でいびきをかく音を出す（いびきをかく）。／（比喩的に）機械などが回転しながら、大きく一定の騒音を出す。
골짜기=山と山の間のくぼんだ所(谷 / 渓谷)。／(比喩的に) 非常に深く辺鄙な場所や、険しい地形を指す言葉。
공감=他人の感情、意見、主張などに対して、自分もその通りだと感じること。または、そのように感じる気持ち(共感)。／[心理] 他人の状況や気分を自分のことのように受け入れ、理解する心理的状態(共感)。
공개하다=ある事実や物、内容などを一般の人々に広く知らせたり、出したりすること。／秘密にしていたことを明らかにし、誰もが見たり知ったりできるようにすること。
공격하다=敵を打ちに行ったり、直接的に打撃を加えたりする(攻撃する)。／運動競技などで相手チームに勝つために積極的に出る(攻撃する / 攻める)。／言葉や文章などで他人を非難したり、苛酷に扱ったりする(攻撃する / 攻めたてる)。
공군=主に空中での戦闘を遂行できるように編成された軍隊。航空機、ミサイル、レーダー施設などを備え、領空を防衛する任務を担う。
공식적=国家や社会が認めた公的な方式や手続きに従うこと。／表立って正式に行うこと。
공적=国家や社会の構成員全体に関係すること。個人的な私情がなく、公共の利益のためのこと。国家や公共団体の制度や組織によること（公的）。／国家や社会の構成員全体に関係する公共の性格を帯びたもの。／国家や公共団体で公式に扱うもの。
공중=地表面の上に高く浮いている何もない空間(空中)。／어느一方に偏らない一般社会や大衆の間。（主に「公衆道徳」や「公衆保健」などの形で使われる）。
공지=多くの人に広く知らせること。または、その知らせ。／世間に知れ渡っていること。
과로=体の状態や能力に対して過度に仕事をすること。または、それによって体がひどく疲れること（過労）。
과속=自動車や列車などが決められた速度よりあまりにも速く走ること。またはその速度(スピード違反 / 過速度)。
과식=食べ物を適量より過剰に多く食べること。また、その食べ物（過食）。
관계되다=二つ以上の対象が互いに関わりを持つようになる。／ある事柄に参加したり、影響を受けたりするようになる。／ある問題や事件に巻き込まれる。
관념=ある対象に対して持っている考えや見解。／現実とはかけ離れ、頭の中にだけ存在する抽象的な考え。／[心理] ある物事に対する心象や表象が意識の中に現れたもの。／[哲学] 主観的な意識の内容。客観的な実在と対立する精神的現象を指す。
관람=遺物、遺跡、芸術作品、公演、映画などを見物すること（観람 / 観賞）。
관리하다=人を統制したり、指揮し監督すること（管理する / 監督する）。／物、施設、組織などを維持し、世話をすること（管理する / 手入れする）。／自身の健康、成績、外見などを一定の状態に維持するために努めること（管理する / ケアする）。
관습=ある社会で長い間繰り返されて伝わり、 그 社会の構成員たちが正当なものとして認めて従う行動様式（慣습 / しきたり）。
광장=多くの人が集まれるように広く作られた空き地(広場)。／多くの人が集まって意見を交わしたり、自由に活動したりする開かれた空間を比喩的に言う言葉。
굉장하다=規模や程度が非常に大きく、立派だ。／普通よりはるかに優れている、またはすごい。
교시=学校で授業時間を分ける単位。通常、数字が前に付いて該当する授業時間の順序を表す。（例：1時間目、2時間目）
교외=都市の周辺や城郭の外の近隣地域。市街地に接していながら田園風景が残っている場所を指す。／学校の垣根の外。
교육비=教育をするのにかかる費用。授業料、教材費、塾の費用などをすべて含む。
교직=教えることを職業とすること。またはその職業。通常、小学校、中学校、高校などの学校で学生を教える職分を指す。
교환하다=互いにやり取りする（交換する）。／ある物を別の物に取り替える。
구매=品物を買い入れること。(商品やサービスに対価を支払って手に入れる行為)
구별하다=性質や種類によって違いがあるものを分ける。／対象の良し悪しや、偽物と本物などを判断して分ける。
구분하다=一定の基準に従って全体をいくつかの部分や系統に分ける（区分する / 分類する）。／性質や特徴に従って対象の違いを分ける。
구석구석=あちこちの隅々。または、すべての場所。／見えない深いところや細かな部分まで、すべてを指す言葉。
구성되다=いくつかの部分や要素が集まって、一つの全体をなすようになること。／ある団体や組織が作られること。
구성하다=いくつかの部分や要素を集めて、一つの全体を形づくる（構成する）。／文章や文、芸術作品などの内容を体系立てて組み立てる（構成する）。
구속되다=行動や意思が自由でないように制限を受けること（拘束される）。／法律により、被疑者や被告人の身体の自由が一時的に制限されること（検察や警察によって物理的に収監される）。
구속하다=人の身体的自由を制限したり、束縛したりすること。／法律的手続きに従って被疑者や被告人の身体の自由を強制的に制限し、一定の場所に拘禁すること。／考え、行動、関係などにおいて自由な活動ができないように縛り付けること。
구입하다=品物などを買い入れる（購入する）。
국립=国家が設立して運営すること（国立）。
국왕=一国を治める君主。称号や地位に関係なく、国家の最高統治者を指す言葉。
국외=国の外。または外国。／自国の法権や統治権が及ばない領域。
국화=キク科に属する多年草。秋に黄色、白、赤など多様な色の花が咲き、香りが良い。観賞用に栽培したり、お茶の材料として使われたりもする。
굴=山や地中の下に掘られた長く大きな穴（トンネル、または天然の洞窟）。／動物が住むために地中や岩の隙間に掘った穴。
굽=靴の底の後の部分についている底の破片。主に高さを調節したり、足を保護するために取り付ける。／(比喩的な意味) 馬や牛のような獣の足先にある硬い部分（ひづめ）。
궁극적=ある過程の最後になる、またはそれ以上はないほど最後まで到達した状態の（究極的）。
권력=他人を服従させたり支配したりできる公認された威力。特に国家や政府が国民に対して強制力を行使できる力を指す(権力)。／ある分野で大きな影響力を行使できる力。
권유=あることをするように切に勧めたり、そそのかしたりすること（勧誘）。／相手に特定の行動をするように誘導したり提案したりすること。
귀하=（代名詞）手紙や公式文書で、相手を敬って呼ぶ二人称代名詞。主に姓名や役職名の後に付けて用いる。／手紙や公文書などで相手を敬って呼んだり、名前の後ろに付けたりする言葉。主に格調高い書信で受信人を指す時に用いる（貴下 / 殿）。
그네=二つの紐を高い木の枝や横木に吊るし、その下に足場をかけて人が乗り、前後に行ったり来たりして遊ぶ遊具（ブランコ）。
그놈=「その男」を低めて言ったり、丁寧ではない言い方で指す言葉。（主に男性を指す）／（親しい仲で）「その人」を気兼ねなく呼ぶ言葉。／人間ではない物や動物を、親しみを込めて、あるいは俗っぽく指す言葉。
그래야=「그리하여야(そうしなければ)」の縮約形。前に述べた内容や状態のようにしなければならないという条件を表す時に使われる。
그리하여=前の内容が後ろの内容の理由、原因、条件になることを表す時に使う接続副사。「그렇게 하여서（そうして）」が短くなった言葉。
그이=前に既に話した、または聞き手が知っている人を指す言葉。「その人」を少し敬って言う言葉。／主に妻が他人の前で自分の夫を敬って言う言葉。
그제=今日から二日前。／「그제야（その時になってようやく）」の略語。（あることが終わった後で、初めてという意味）／一昨日（おととい）。今日の二日前。／「그저께（一昨日）」の略語。
그제서야=前の状況や条件がすべて整った後で、ようやく。 (「그제야」を強調していう言葉)
극=舞台の上で俳優が身振りと台詞である事件や人物の状態を演出して観客に見せる芸術形態（演劇、戯曲など）。／映画、ドラマ、小説などで展開される緊張感あふれる事件や状況。／（比喩的に）実際に起きた出来事や状況が、まるで演劇のように劇的で驚くべき場合。
극복하다=悪条件や苦しい状態を乗り越える。／ある対象の水準や範囲を越える。
근거하다=ある事柄や意見、理論などの根拠とする。または、あることに基づく。
근대=中世と現代の間の時代で、封建的な社会秩序を脱し、資本主義と民主主義が発達し始めた時期。通常、西洋では市民革命と産業革命以降を指す(近代)。／伝統的な慣習や迷信から脱却し、合理的で科学的な考え方を備えた状態やそのような傾向。
근로=勤勉に働くこと。／体を動かして働くこと。または、その仕事。
근심=解決されない事柄や将来への心配により、心が穏やかでない状態（不安 / 憂い / 心配）。／体や心に生じる病気や苦しみ（煩い / 苦痛）。
근원=水脈が流れ出始める場所(根源 / 源)。／物事の土台や原因となる根っこ(根源 / 根底)。
금세=「今時に」が縮まった言葉で、今すぐ、あるいはついさっき。非常に短い時間内にある出来事が起こる様子を表す。
금융=융통(融通)すること。つまり、お金が余っている人や機関から、お金が必要な人이나機関へ資金が移動する経済活動を意味する。／預金、融資、保険、証券など、お金の流れに関連するすべての経済分野および産業。
급증=数量や程度が短い期間の間に急激に増えること。
기=万物を生成する根源となるエネルギーや力。／人の体に流れる躍動する気運。／気分や感情の状態、または表面に表れる勢い。／ある状態や条件が漂っている現象。／布や紙に絵、文字、色などを入れ、ある団体、機関、国家を象徴したり、合図や標識として使うもの（旗）。／スポーツ競技や行事などで、特定の合図を送ったり位置を表示したりするために使用する道具。
기기=器具、機械、道具などを総称する言葉。主に精密な装置や電気・電子関連の装備を指す際によく使われる。
기록되다=主に文章や写真、映像などで残される。／公式的な数値や成績、歴史的事実などとして記され、伝えられる。／コンピュータなどの情報機器でデータの形で保存される。
기반=基礎となる土台。または、物事の土台。／ある活動や事業が行われるように準備された根拠地や下地（肥やし）。
기법=芸術作品を作ったり、ある物事を処理したりする際の技術的な方法や手段。
기부=慈善や公共の目的のために、見返りなしに金銭や物品を出すこと（寄付）。
기여하다=助けになるように尽くす。ある事や目的を成し遂げるために力を貸して役に立つようにする(寄与する / 貢献する)。
기원전=西暦紀元を基準として、その元年以前の時代をいう言葉。英語の「B.C.(Before Christ)」と同じ。
기존=すでに存在すること。または、すでに成り立っていること。
기초하다=物事を根拠や土台にすること。（主に「～に基づき」、「～に基づいた」の形で使われる。）
긴팔=袖が手首まで届くほど長い服。または、そのような袖（長袖）。
까다=（皮や殻を）むく、剥がす。／（卵を）かえす、孵化させる。／（金を）前借りする、差し引く。／（俗語）他人をけなす、批判する、ディスる。
까먹다=皮のある果物やナッツ類、または皮に包まれた食べ物などをむいて食べる。／（比喩的に）忘れてしまう。（主に記憶や約束などを忘れた時に使用）／財産やお金などをむやみに使ってなくす（使い果たす）。
깜빡=灯火や星の光などが一瞬現れて消えたり、急に暗くなった後また明るくなったりする様子。／目を一瞬閉じてから開ける様子。／記憶や意識などが一時的に遠のく様子。
깨=ゴマやエゴマなど、ゴマ目に属する植物の種子。食用として使われ、主に炒めて薬味にしたり、油を搾ったりして利用する。／(比喩的表現) 非常に仲睦まじかったり、楽しかったりする状態を指す言葉。
깨달음=物事の道理や真理を明確に悟ること。／誤っていた点や、それまで気づかなかった点に気づいて知ること。／(宗教) 修行を通じて煩悩から脱し、真理を体得すること。
꼬마=子供を可愛く呼ぶ言葉（ちび / 子供）。／背がとりわけ低い人を比喩的にいう言葉（ちび）。／（一部の名詞の前に付き）サイズが非常に小さいことを表す言葉（ミニ / 小型）。
꼴=物の外見や様子、なりふり。（主に人の外見や状況を低めて言ったり、否定的な状況で使われる。）／ある境遇や立場。（皮肉ったり嘆いたりする意味で使われる。）／ある出来事の結果や状態。
꼽다=数や日付を数えるために、指を一本ずつ折る。／複数の中から選んで指名したり、第一のものとして認めたりする。
꾸준하다=休まず、一途で勤勉だ。／態度や勢いなどが変わらず、粘り強い。
꿇다=膝を曲げて床につく。／(比喩的に) 相手に屈服したり降伏したりする。
나침반=磁針が南北を指す性質を利用して方位を知ることができるように作られた器具。主に航海や登山などに使われる(羅針盤 / コンパス)。／(比喩的な意味) 進むべき正しい方向や指針のこと。
난로=火を焚き、その熱を利用して室内の温度を上げる暖房器具。燃料によって練炭ストーブ、電気ストーブ、石油ストーブ、ガスストーブなどに分けられる。
난방=建物や部屋の中の温度を上げて暖かくすること。または、そのための施設。
남미=「南アメリカ」を略していう言葉。西半球の南側に位置する大陸で、ブラジル、アルゼンチン、チリなどの国が含まれる。／アメリカ大陸の南部を指す言葉。西半球の南側にあり、太平洋と大西洋の間に位置する。ブラジル、アルゼンチン、チリなど多くの国が属している。（同意語：南アメリカ）
낱말=意味を持って自立して使われる言葉の最小単位。「単語」と同じ意味で使われる。
내려지다=上から下へ移動させられたり、落ちたりする。（例：幕、カーテンなど）／命令、判決、決定、処分などが公布されたり、施行されたりする。／霧、暗闇、静寂などが周囲に立ち込める。／品物などが高い所から低い所へ移される。
내쉬다=吸い込んだ息を外に出す(吐き出す)。／溜まっていた感情やため息などを外に表す(吐く)。
냉수=冷たく冷やした水。または冷たい水。／(比喩的に) ある事に対する興味や熱意を急激に冷めさせることを指す言葉。
널다=日光に当てたり風を通したりして乾かすために、物を広げて置く。（主に洗濯物や穀物などに使われる）
넓이=一定の平面にわたっている空間や範囲の大きさ。面積と同じ意味で使われる。／ある物の横や縦の長さ、または幅を指す言葉。
네모=四つの角や曲がり角をなす形。普通、四角形を指す言葉。
년생=生まれた年を表す言葉。主に数字の後につき、その年に生まれたことを意味する。
노랑=ひよこやレンギョウの花の色のような、明るくて鮮やかな黄色。
녹화=放送や映画などの場面を後で再び見ることができるように、装置や媒体に記録すること。または、ビデオ信号をデジタルデータやテープなどの保存媒体に収める過程(録画)。
논=水を張り、稲を植えて育てる土地（田 / 水田）。
논의=ある問題について互いに意見を交わし、検討したり協議したりすること。
논하다=ある主題や問題について意見を交わしながら、論じたり説明したりする。／物事の価値、人物、正義や不正などについて評価したり判断したりする.／(主に「～を論じるまでもなく」の形で使われ) ある対象を問題にしたり考慮したりする。
놈=(人を低めて言ったり卑俗に言ったりする言葉で) 男や人を指す言葉。／(主に数量や程度を表す言葉の後に使われ) ある物や対象を指す言葉。／親しい仲で男の子を可愛がって呼ぶ言葉。
누님=男性が同じ行列（同世代）の親族や、年上の姉を敬って呼ぶ言葉。／他人同士の間で、男性より年上の女性を敬って呼ぶ言葉。
눈치=他人の心や態度を状況を通じて察する力（空気を読む力 / 勘）。／他人の機嫌を伺ったり、状況がどのように回っているかを把握する態度。／外に表れる気配や態度。
뉴욕=米国北東部に位置するアメリカ最大の都市。商業、金融、メディア、芸術、ファッション、研究、技術、教育、エンターテインメントなど、多様な分野で全世界に絶大な影響力を及ぼす世界的なメトロポリス。／米国の州の一つであるニューヨーク州。
늑대=イヌ科に属し、イヌに似ているが尾が太く口元が長く、目が鋭い野生動物。主に群れをなして生活し、夜に活動する（オオカミ）。／（比喩的に）性格が陰険で本心をあまり表に出さなかったり、女性に対して下心を抱いている男性を指す言葉。
늘어지다=物体の長さや幅が下に垂れたり、長く伸びたりする。／人の体や態度が緊張が解けて力なく垂れたり、のろくなったりする。／音や声が長く引き延ばされる。／現象や物事が予想より長く続いたり、遅滞したりする (長引く)。
늦가을=晩秋。季節的に秋が終わり、冬が始まろうとする頃の時期。／晩秋の天気。
늦봄=春の終わり頃。通常、陽暦の5月頃を指す(晩春)。
늦잠=朝、他人より遅くまで寝ること。適時に起きられず、寝るべき時間を過ぎて過度に多く寝ること（寝坊）。
님=（人の名前や職名の後に付いて）その人を高めて呼んだり言ったりする言葉。対象に対する尊敬と礼儀を表す。／（一部の名詞の後に付いて）その対象を擬人化して高めて言う言葉。
다정=情が深いこと。または情愛が厚いこと。心が温かく親切で、他人を思いやる態度があること(多情 / 思いやりがある / 優しい)。
다정하다=情が深い。／温かくて親切だ。
다짐=心や志を固く決めること。また、その内容（決意 / 覚悟）。／他人に物事を破らないと固く約束すること。また、その内容（誓約）。／(法律) すでに行った確認を再確認したり強調したりすること。
다짐하다=心や意志を固める。／他人に、あることを間違いなく行うと約束したり、確認したりする。
닥치다=ある時や事が間近に迫る。（時間や状況の切迫）／ある対象や場所に急に現れたり、押し寄せたりする。／（俗っぽい表現で）口を閉じる、黙る。
단골=いつも決まって行く店や食堂など（行きつけ / 常連の店）。／いつも決まって取引する人。または、いつも決まってやって来る客（常連客 / お得意様）。／[歴史] かつて、クッ（巫術儀式）をするたびにいつも決まって呼んでいた巫女。
단기=短い期間。／[教育] 一定の目的のために短期間実施される教育や訓練課程。
단맛=砂糖や蜂蜜のように舌で感じる甘い味（甘味）。／（比喩的な意味）心地よく楽しい気分、または実質的な利益（甘い汁）。
단속=注意を払って引き締めたり、世話をしたりすること。／規則や法令などに違反しないよう統制し、禁止すること（取り締まり）。／散らばったものを一箇所に集めたり、こぎれいに整理したりすること。
단편=分量が短い小説や映画、またはその他の芸術作品（短編）。／（比喩的に）物事の全体像の中の、ごく小さな一部分（断片）。
달리하다=互いに異なるようにする。（比較される対象と性質、形、状態などを変えること。）／基準や前の状況と差が出るようにする。／（慣用表現で）「生を異にする（世を去る）」のように使われ、他界したり死を迎えたりする。
달성=目的や目標としたことを最後までやり遂げること(達成)。
닳다=物が長く使われたり擦れたりして、その物の本体が減ったり薄くなったりする。／(比喩的に) ある事に経験が豊富になったり慣れたりして、悪賢くなったり図々しくなったりする。／(俗語/慣用句) 心や真心などが非常に焦がれたり、至極であったりする。
담요=体を掛けたり下に敷いたりするために、毛などで厚く織った寝具。主に寝る時や寒さを防ぐ時に使う(毛布)。
당일=事がある、まさにその日（当日）。／（主に「당일로」の形で）家を出て他の場所へ行き、その日のうちにすぐ戻ってくること。
당첨=抽選や景品イベントなどで選ばれること。／宝くじや応募券などが割り当てられた順位に入り、利益を得ること。
당황=驚いたり慌てたりして、どうすればいいか分からなくなること。または、そのような状態。
대-=「大きい」という意味を添える接頭辞。／「偉大な」、「立派な」という意味を添える接頭辞。／「すごい」、「甚だしい」という意味を添える接頭辞.
대륙=地球の表面で海に囲まれた巨大な面積の陸地。アジア、ヨーロッパ、アフリカ、北アメリカ、南アメリカ、オセアニア、南極大陸などを指す。／島や半島に対して、その本体となる大きな陸地を指す言葉。
대리=他人を代理して仕事を処理すること。または、そのような人。／職位の一つ。課長や係長の下の職級で、上司を補佐し実務を担当する職務。
대립=二人以上の人や集団、思想などが互いに反対の立場に立って対抗すること。／意見や立場が互いに異なり、調和できずに衝突すること。
대비하다=将来起こりうる困難な事態や変化に対し、あらかじめ準備したり対策を立てたりする（備える / 対策する）。／二つ以上の内容を互いに照らし合わせて比較、または対照する（対比する / 照らし合わせる）。
대상=ある事柄や行動の相手となる人や物（対象）。／研究や観察、調査などの活動が集中する目標物（対象）。／複数の部門の中で最も優れた成果を上げた人に贈られる最高賞（大賞）。
대신하다=ある対象が果たしていた役割を、別の対象が引き継いで果たす（取って代わる / 代わる）。／ある対象を別の対象に替えて使ったり使用したりする（代用する）。／他の人のために、その仕事を代わってあげる（代行する）。
대응하다=ある事柄や状況に合わせて態度をとったり、処置を講じたりする（対応する）。／二つの対象が互いにペアを成したり、向き合ったりする（対応する）。／数学において、一つの集合の要素ともう一つの集合の要素が、決められた規則に従ってペアになる（対応する）。
대조=二つ以上の対象を照らし合わせ、相違点や類似点を調べること（対照 / 照合）。／(文学/修辞学) 相反する二つの事柄や現象を並べ、その違いを際立たせる技法（対照法）。
대중교통=一般大衆が決まった路線と時刻表に従って共同で利用できる輸送手段。バス、地下鉄、列車、タクシーなどがこれに属する。
대처=困難な事や状況が起きた時、それに応じた適切な措置を取ること（対処）。
대처하다=ある情勢や事件に対して適切な措置を取る（対処する）。
대표하다=ある集団や団体の意思を代わりに表したり、その状態を象徴的に示したりする。／ある分野や集団において、最も優れている、または特徴的なものとして挙げられる。／法人や団体を代行して法律行為を行ったり、対외的にその団体を象徴したりする。
대합실=鉄道駅、停留所、病院、劇場などで、客が乗り物を待ったり順番を待ったりするために設けられた部屋（待合室）。
더러워지다=きれいだった物や場所などに垢や汚れがついて汚くなる。／（比喩的に）純粋だった心や名誉、評判などが悪いことに染まって醜くなる。
덕택=施してもらった恩恵や助け。／(主に「～のおかげで(덕택에)」の形で使われ) 物事がうまくいくように影響を与えたありがたい背景や原因。
데다=火や熱い気運によって肌に傷を負う（火傷する）。／（比喩的に）ひどい目に遭ったり驚いたりして、二度とやろうとする勇気が出なくなる（懲りる）。
데우다=冷たくなった飲食物や物体に熱を加え、温かくする。／(比喩的に) 冷めていた感情や雰囲気などを、再び温かく活気に満ちたものにする。
도난=他人の物を盗まれること（盗難）。
도달하다=目的地やある場所にたどり着く（到達する）。／ある水準、範囲、程度などに達する。／物事や現象が伝わったり、及んだりする.
도덕=人々が共同体生活を送りながら守るべき自律的な行動規範や善悪の基準。／人間として当然守るべき道理、およびそれを実践する善い行い。
도서=学術的、文学的な内容を印刷して綴じた本。一定の目的やテーマの下で知識や情報を伝えるために製本された読み物。
독=生物の体内に入り、機能障害を起こしたり生命を奪ったりする物質。／他人を害そうとする悪意や気配。／食べ物などが腐って体に害を及ぼす気。
독자=本や新聞、雑誌などの読み物を読む人（読者）。／（主に作家の観点から）自分の作品を読んでくれる人。
동그랗다=形や形態が少しも角張っておらず、丸い。／目が驚いたり、何かに集中して大きく見開かれた状態を表す。
동요=子供のために作られた歌。または子供が歌う歌(童謡)。／ある対象や現象が揺れること。または心が不安で落ち着かず揺れ動くこと(動揺)。／社会的にある出来事が起き、秩序が乱れて騒ぎになること(動揺 / 動乱)。
동의하다=ある意見や提案に対して、同じ考えであると認めたり賛成したりすること。／他人の行為を承諾したり受け入れたりすること。／法律的に、ある意思表示をする際に相手の提案を受け入れて一致させること。
동일=二つ以上の対象が互いに異ならず、一つである状態。／性質、等級、程度などが互いに全く同じである状態。
동일하다=二つ以上の対象が互いに異ならず、一つに一致すること。／形、大きさ、性質などが同じであること。
동행=道を一緒に行くこと。または、一緒に行く人。／ある事をしたり、道を行く際に共にする仲間や同僚。
되풀이하다=同じことや言葉を何度も繰り返すこと。
둘레=物の縁や外側の端 (周り / 縁)。／物の表面を一周した長さ (周囲 / 回り)。／ある物を中心としたその周辺の範囲や環境 (周囲 / 環境)。
뒷골목=大通りの裏側にある、狭くて人通りの少ない路地。／社会の正常な秩序が及ばない、暗くて隠微な環境を比喩的にいう言葉。
듣기=音を耳で受け入れること。／相手の言葉を注意深く受け入れて理解する態度や能力。／[教育] 外国語学習や試験などで、音声を聞いてその内容を理解する能力を測定する評価領域。
들어주다=人の頼みや要求、提案などを受け入れて、その通りにしてやる。／他人の言葉や声に耳を傾け、誠意を持って聞く。
듯=(語尾「-은/-는/-을」の後に使われ) 前の言葉が表す状態や動作が、後に来る内容とほぼ似ていることを表す言葉。「듯이」の略語。／(語尾「-은/-는/-을」の後に使われ) 前の言葉が表す状態や動作を推측したり、うっすらと見当をつけたりすることを表す言葉。／(語尾「-은/-는」の後に使われ) 実際はそうではないが、表面上そのような態度を見せることを表す言葉。
듯싶다=前の言葉が表す状態や事実を推測したり、ぼんやりと感じていることを表す言葉。「듯하다」より強調された感じを与え、話者の主観的な推測を強く表現する時に主に使われる。
듯하다=前の言葉が意味する状態を不正確に推測したり、ある状態を表したりする時に使う。（主に「-ㄴ/은/는/ㄹ/을 듯하다」の形で使われる。）／前の言葉が意味する内容が事実であるかのように感じられることを表す。
등기=国家機関である登記所が、法定の手続きに従って不動産や特定の動産、債権などの権利関係を登記簿という公的な帳簿に記載すること。またはその記録。これにより第三者に権利状態を公示し、対抗力を持つようになる。／郵便物の受付から配達までの全過程を記録し、紛失事故の際に損害賠償を受けられるようにする特殊郵便取り扱い制度。（主に「登記郵便（書留）」として使われる）
등등=先に並べた物事や事実のほかに、同類のものがまだあることを表す語。「等（とう）」を強調した表現。
등장하다=舞台や画面などに現れる。（俳優や人物などが演劇、映画、小説などの展開の中に初めて姿を現すこと。）／新しい物、現象、人物などが世の中に初めて知られたり現れたりすること。／ある場所や場面に直接現れること。
디스크=[医学] 脊椎の骨の間にある円盤状の軟骨組織。衝撃を吸収する役割を果たし、これが突出して神経を圧迫すると痛みが発生する（椎間板）。／[コンピュータ] データを保存するために使用される円盤状の媒体。／[一般] 薄くて丸い円盤状の物体。
디자이너=衣装、製品、グラフィック、インテリアなど、様々な分野で実用的かつ美的な形を計画し、図案化する人（デザイナー）。／特にファッション分野で、新しい服やアクセサリーを企画し、デザインする人。
따로따로=大勢が一緒にいなくて、それぞれ離れたり別れたりして。／一つ一つ個別に。
똥=人や動物が食べ物を食べて消化し、肛門から出すかす(糞 / うんち)。／(比喩的) 価値がないものや汚いものを指す言葉。／体から出る老廃物を指す言葉（例：目やに、耳あか）。
뛰어나가다=急いで走って外へ出る。ある場所や範囲を速い速度で脱する。
뛰어나오다=中から外へ急いで走って出ること。／(比喩的に) ある状態や範囲から急に抜け出して現れること。
뛰어놀다=一箇所にとどまらず、あちこちを活発に走り回りながら楽しく遊ぶ。
뛰어오다=走って来る。／（比喩的に）非常に急いで来る。
뜻하다=何かを意味したり表したりすること。／ある物事や仕事をしようと心の中で考えたり決めたりすること。／(主に「뜻하지 않다(予期しない)」の形で使われ) 予想したり期待したりすること。
띄우다=水の上に浮くようにする（浮かべる）。／空間や時間の感覚をあける（空ける / 隔てる）。／手紙や便りなどを送る（出す）。／微笑みや光を顔に浮かべる。／麹（こうじ）やメジュ（味噌玉）などを発酵させる。
띠=物の周りに巻いたり、腰や体に巻いて結んだりする長い紐状のもの（帯 / ベルト）。／一定の範囲や区域を表す細長い形の空間や跡。／生まれた年の十二支を象徴する動物に従って決められる名前。／柔道、テコンドーなどの武道で実力の段位を表すために腰に締める布。／服の腰の部分に巻く紐。（例：ベルト、サスペンダーなど）／長い物の周りに巻いたり、一定の範囲を表すために巻く紐状の物。／人が生まれた年の十二支を象徴する動物によって決まる名称。／色や形などが長く続いている状態を比喩的にいう言葉。
띠다=帯や紐などを腰に巻く。／物を身につける。／用件、職責、使命などを帯びる。／色や色彩を帯びる。／感情や表情などを顔や姿に表す。／ある性質を帯びる。
량=ある仕事や作業の分量、または数量。（本来は「양」だが、漢字語の後ろについて数量を表すときは「량」と表記する）
런던=イギリスの首都であり、イングランド最大の都市。テムズ川の下流に位置し、世界的な金融、文化、芸術の中心地である。
리=距離を表す韓国の伝統的な単位。1里は約393メートル（約0.4km）に相当する。一般的に「十里（シプリ）」を約4kmとして計算する。
리그=スポーツ競技で成績が似た複数のチームが集まり、優勝を争う競技形式。または、そのような競技団体。／特定の目的のために結成された連盟や同盟。
리본=装飾や結ぶ用途に使うために、布を細長く織った帯。／帯状の布をきれいに結んで作った装飾品。／タイプライターや印刷機などで文字が印字されるよう、インクを塗った帯。
리터=体積の単位。1リッターは1,000立方センチメートルに相当し、記号はLまたはlで表記する。
마냥=不足なく、たっぷりと。／状態や様子がずっと変わらず、ひたすら。／まるで〜のように。（比喩の意味を表す）
마누라=中年を過ぎた女性を俗に言う言葉。／妻を遠慮なく呼んだり、他人にへりくだって言う言葉。（参考：もともと朝鮮時代には「マノラ」と言い、上田や王など身分の高い人を呼ぶ極尊称であったが、現代語では妻を指す卑俗な表現や親しみのある表現として定着した。）
막차=その日の最後に運行する列車や電車、バスなど。／(比喩的に) 物事や機会の最後の順番。
만원=定員に達すること。ある場所に人がいっぱいに詰まること（満員）。
만하다=(動詞の後で「-を（ㄹ/을）に値する」の形で使われ) ある対象が前の言葉が表す行動をする対象になることを表す。（価値や資格）／(動詞の後で「-を（ㄹ/을）に値する」の形で使われ) 前の言葉が表す行動が可能であることを表す。（可能性）／(動詞の後で「-を（ㄹ/을）に値する」の形で使われ) 前の言葉が表す状態がある程度に達していることや、その状態にあることを表す。（程度）
맘껏=心ゆくまで、存분分に、思う存分。（「마음껏」の短縮形）
맘대로=「마음대로（思い通りに）」の縮約形。物事や状況を自分の意思や考えに従って自由に決めたり行動したりする様子。
맛보다=食べ物の味を知るために、少量を食べてみる。／ある現象や経験を実際に経験してみる。／(比喩的に) ある気分や状態を感じたり、経験したりする。
망원경=遠くにある物体を大きく鮮明に見るために、レンズや反射鏡を組み合わせて作った光学機器。天体観測用、軍用、航海用など用途が多様である。
매너=日常生活における礼儀や態度。（英語の「manner」に由来）／相手を配慮する身だしなみや行動様式。
매번=それぞれの時ごとに。または、いつでもいつも。／それぞれの時ごとに。／ある事が起こるたびに欠かさず。
매점=学校、病院、軍部隊、停車場などの施設内で、本、文房具、食べ物などを備えて販売する小さな店（売店）。
매진=商品やチケットなどがすべて売れて、一つも残らないこと。／ある事に全力を尽くして集中すること。
맨발=靴下や靴を履いていない足(素足 / 裸足)。／(比喩的に) 何も持たず、身一つで立ち向かう状態。
멀미=自動車、船、飛行機などの乗り物の揺れを感じる時、めまいがして力が入らず、吐き気がする症状（乗り物酔い）。／ある物事や現象に嫌気がさしたり、苦痛を感じたりする状態を比喩的にいう言葉。
멍=外部の衝撃によって皮膚の下の微細血管が破れて内出血し、皮膚の色が青黒く変わった状態（あざ）。／（比喩的に）精神的な衝撃や苦痛によって心の中に生じた傷。
메달=運動競技や競演大会などで、優れた成績を収めた人に記念として贈る金、銀、銅の金属板（メダル）。／立派な業績を上げた人の功労を称えるために授与される勲章や記念盾（メダル / 記章）。
면도=顔や体に生えた髭や産毛を剃ること。主に剃刀や刃物を使って毛を取り除く行為を指す。
면접=1. 直接会ってみること。2. 入社、入学、試験などで、人物や能力を評価するために直接会って質疑応答を行う過程(面接)。
면허=特定の事項を行うことができるように行政機関が許可すること。または、その権利を証明する書類（免許）。／ある技術や資格を備えていることを公式に認めること。
명의=ある事柄の主体として公式に掲げる名前。または法律的な権利や義務を持つ主体として登録された名前。
명칭=人や物、現象などに付けられた名前(名称 / 呼び名)。
명함=氏名、住所、職業、肩書き、連絡先などを記した小さな紙片。主に初めて会った人に自己紹介をしながら渡す用途で使われる（名刺）。／（比喩的に）ある分野や場所で提示できるほどの面目や資格。
모색하다=物事の手掛かりや解決策、方法などを探そうと多方面で努力する(模索する)。
모험=危険を冒してある事をすること。また、その事柄（冒険）。／結果が不確実な状況で、新しい世界や領域を探検したり挑戦したりすること。
몫=複数が分け合うそれぞれの部分（分、割り当て）。／各自に任された職分や役割（役割、責任）。／（数学）割り算の結果として得られる数（商）。
몸속=人や動物の体の中の空間（体内）。／（比喩的に）心の中や考えの深いところ。
몽땅=残らず全部。一つも残さず、ことごとく。
묘사하다=ある対象や物事、現象などを言葉、絵、音楽などでありのままに描き出す。／心の中に浮かんだ形象や感じを具体的に表現する。
무-=一部の名詞の前に付き、「それが無い」という意味を添える接頭辞。
무덥다=気温が高く湿度も高いため、非常に暑い（蒸し暑い）。
무리하다=道理や理屈に合わない。手に余ることを無理にする。程度が過ぎて適切な範囲を外れる。
무시=人を低く見たり, 軽んじたりすること。／ある物事や現象をないものとしたり, 重要視しないこと。／法規, 規定, 信号などを守らずに破ること。
무지개=空中にある水滴が太陽の光に屈折・反射して現れる、七色の美しい円弧状の帯。主に雨が上がった後に現れる。／（比喩的に）実現の可能性が低い幻想や、はかない夢。
문명=人類が成し遂げた物質的、技術的、社会的発展の状態。特に、未開な状態を脱して高い水準の生活を享受する状態を意味する。／心が開かれ知識が発達し、世の中が明るく目覚めている状態。／考古学や歴史学において、特定の時期や地域に現れる高度な文化を備えた社会構造。
문법=言葉の構成および運用上の規則。または、それを研究する学問（文法）。／言語規範の体系。
문병=病気を患っている人を訪ねて慰めること。また、そのこと(お見舞い)。
문의=気になる事項や知らない事実を尋ねること。／(主に機関や団体に) ある事柄についての詳細な内容を電話や書信などで尋ねること。
물감=絵を描いたり、物に色を塗ったりする時に使う材料。顔料や染料を水や油などと混ぜて作る(絵の具)。
물리학=物質の構造と性質、エネルギーの形態、そしてそれらの間の相互作用と運動法則を研究する自然科学の一分野。
물약=液体状の薬。口から飲んだり患部に塗ったりするなどの用途に用いられる。
물체=具体的な形態を持ち、空間の一部を占めている個別的な物質の塊。／[物理] 力や運動を説明する際、大きさや形に関係なく一つの単位として扱われる対象。
뭘=(相手の褒め言葉、感謝、謝罪などに対して) 謙虚に否定したり、その必要がないことを表す言葉。「무엇을(何を)」の縮約形である代名詞としても使われるが、ここでは感嘆詞としての意味を含んでいる。／(相手の提案や当然の状況に対して) ためらうことがなかったり、ごく当然だという意味を表す言葉。
미=目に映る美しい形や姿。／芸術的価値や精神的価値が高く、感嘆を誘うような性質。／成績や等級をつける際、「秀・優・美・良・可」の第3段階。
미련=何かに執着して思い切ることができず、心に残り続けること(未練)。／非常に愚かな行動や状態（まれに使用される）。
미사일=ロケットやジェットエンジンの推進力で空中を飛び、目標物を打撃する精密兵器。誘導装置によって飛行経路が修正できるのが特徴である。
미스=物事を行う過程で生じる間違いや誤り（ミス）。／未婚女性の姓や名の前に付けて呼ぶ言葉。または若い女性を指す言葉。／「ミス・コリア」のように、美人コンテストで選ばれた女性の名前の前に付ける称号。
민간=官庁や軍隊などの機関に属していない一般の人々の間。／国家や公共団体ではない、個人や私的な団体。
민속=民間につたわる固有の風俗や習慣。古くから民衆の間で伝承されてきた信仰、伝説、歌、踊り、生活様式などを総称する言葉（民俗）。
민주=国民が国家の主権を持ち、直接または間接的に国家の意思決定を行う政治制度や哲学(民主)。／ある集団や組織内で、構成員が平等に意思決定に参加する方式。
민주화=政治、経済、社会、文化など、社会全般の体制や運営原理が民主主義的に変化すること。また、そうすること。／独裁的で権威主義的な秩序から脱却し、国民が主権を持って自由かつ平等に参加する状態へと移行すること。
밀접하다=二つの関係や対象が非常に密接に接しているか、関係が極めて深い。
밑줄=文章の中で重要な部分や強調したい部分の下に引く線。／（比喩的に）ある事実や現象に対して、特に注目したり強調したりすること。
바둑=二人の打ち手が黒と白の石を碁盤の交点に交互に置き、陣地(地)の広さを競う遊び。碁盤に置かれた黒石と白石の形勢。
반값=元の価格の半分になる値段（半額）。
반납=借りていたものや受け取っていたものを再び返すこと。／国や団体から与えられた権利や物品などを再び返すこと。
반달=弓のように片方だけが丸い形の月。普通、上弦の月や下弦の月を指す。／形が半月のようなものを比喩的にいう言葉。
반말=相手を敬わず、礼儀をわきまえない話し方。主に年下の人や、非常に親しい間柄で使用する（タメ口 / ため口）。／敬語を使うべき状況で、故意に崩して話す失礼な話し方。
반복=同じことを何度も繰り返すこと。／[音楽] 同じ旋律やリズムを繰り返して演奏すること。
반복되다=同じことや過程が何度も繰り返して起こる。
반성하다=自分の言動に対して、間違いや足りない点がないか顧みること。／自分の過去の行いや過ちを悔い、改めようと努力すること。
반영=光が反射して映ること。または、その映る影や姿。／ある物事や現象が他に影響を与え,その中に現れること。または、そうすること。
반영하다=光や影などがある物体に映って現れる。／物事や現象が他に影響を与え、その状態を現れさせる。／他人の意見、要求、または時代的状況などを計画や結果に盛り込む。
반짝거리다=小さな光が次々と一瞬現れては消える。または、そのような光を出し続ける(きらめく / ぴかぴか光る)。／目が生き生きとして鋭く光る。／物体や現象が非常に鮮明で清らかに光る。
반팔=袖の長さが肘のあたりまでくるほど短い袖。または、そのような袖がついた服。（一般的に夏に着るシャツやTシャツを指す。）
반품=すでに購入した品物を再び送り返すこと。または、その品物。
발급=機関や団体などで証明書、カード、パスポートなどを作って発行すること。
발레=西洋で発生した舞踊の一形式で、音楽、台本、舞台装置、衣装などを備え、一定の筋書きを演劇的に構成して見せる舞踊芸術。
발명=まだなかった新しい物や方法を初めて作り出すこと（発明）。／よく知られていなかったり、隠されていた事実を明らかにすること。
발톱=人や指のある動物の足の指の先端の上面を覆って保護している、硬くて薄い一片（爪 / 足の爪）。
발표되다=ある事実や結果、作品などが世の中に広く知れ渡る。予定された計画や声明、論文などが公式に明らかにされる。
발행=新聞、雑誌、本などを印刷して世に出すこと（発行）。／貨幣、債券、証券、切手などを作って社会に流通させたり、使用させたりすること（発行）。／証明書やチケットなどを作成して当事者に渡したり発行したりすること（発給 / 発行）。
발휘하다=才能、能力、気勢などを振るったり、現したりすること（発揮する）。
밤낮=昼と夜を合わせた言葉（昼夜）。／（副詞的に使われ）いつも、常に、または絶え間なく。／いつも、常に、始終。（あることを休みなく続けることを表す言葉）／夜と昼を合わせた時間。
밤새다=夜が明けて日が昇る。／(主に「夜を明かす」の意味で使われ) 眠らずに夜を過ごす。
밤새우다=寝ずに一晩を明かす。（主に目的語「밤을（夜を）」と共に使われたり自動詞のように使われ、ある事に没頭して徹夜することを意味する。）
밥상=ご飯を並べた膳（食事の膳）。／食事をするために料理を整えて出した膳。／（比喩的に）ある仕事の結果や恩恵を準備して、他人が享受できるようにしておいた状態。
방해하다=他人の仕事を干渉したり遮ったりして、物事が円滑に進まないようにすること（妨害する / 邪魔する）。
배구=6人または9人で構成された2チームがネットを挟んで手や腕でボールを打ち、相手の陣地に送る球技種目。ボールが床に触れる前に打たなければならず、1チームにつき3回以内のタッチで返さなければならない。／コートの中央にネットを張り、2チームがボールを手と腕で打ち合い、相手チームのコートの床に落として得点を競う球技。通常、1チームは6人または9人で構成される(バレーボール)。／(比喩的意味) ある対象や責任をお互いに押し付け合う行為を比喩的にいう言葉。
배낭=荷物を入れて背負えるように作られたバッグ。主に登山や旅行の際に使用する(リュックサック / バックパック)。
배려=助けたり世話をしたりしようと心をつかうこと。または、色々な状況をあまねく察して配慮する細やかな心遣い。
배송=物資を数か所に分けて送ること。主に商品や郵便物などを顧客に届ける過程を指す。
배웅=去っていく人に付いて出て別れの挨拶をしたり、遠くまで見送ったりすること（見送り）。
배편=船が通る道や便。または船を利用する輸送手段(船便 / 舟便)。／郵便物や荷物を船に載せて送る方法(船便)。
백성=国家の構成員として統治の対象となる一般の人々をいう言葉。（主に君主制国家で使われる）／一定の地域や国に住んでいる人々を広くいう言葉。
뱃사람=船に乗ることを職業とする人（船員、漁師など）。／船に乗ることに非常に慣れている人を比喩的にいう言葉。
뱃속=お腹の内側。胃腸などが入っている空間のこと。／(比喩的に) 心の中に抱いている考えや下心。
버려지다=使えなくなった物が投げ捨てられる。（「捨てる」の受身形）／世話をされずに放り出されたり、関係を断たれたりする。／（考えや習慣などが）それ以上維持されずに失われる。
번지=住所を表す際、土地の区域を分けて付けた番号（番地）。／（比喩的に）ある事柄の核心や根拠となる地点。
베다=刃物(包丁、はさみ、鎌など)で物を切る、または断つ。／鋭利なものに触れて皮膚に傷がつく。／穀物や木などを切り倒す、または刈る scraps.
벨=音を鳴らして合図を知らせるために、ドアの横や室内に設置された電気装置（呼び鈴 / インターホン）。／乗り物や機械などで、停止や呼び出しを知らせるために押す装置。
벽지=住宅や建物の内壁に装飾や保護を目的として貼る紙（壁紙）。
변비=大便が通常より硬く乾燥して出にくい症状。またはそのような病気。排便回数が少なかったり、排便時に困難を伴う状態を指す。
보고하다=業務や課題、進行状況などに関する内容を上司や関連機関に知らせる。／ある事実や研究結果などを公式に発表したり伝えたりする。
보급=1. 技術、知識、思想などが広く行き渡り、一般的になること。／2. 物資や資金などを必要な所に分け与えること。
보기=あるものを表に現して見せること。／例や手本になるようなもの。／試験などで答えを選べるように提示された例示の問題。
보도되다=新聞、放送、雑誌などのマスメディアを通じて、新しいニュースが一般の人々に知らされる（報道される）。
보도하다=新聞、放送、雑誌などのマスメディアを通じて、新しいニュースや情報を大衆に広く知らせる。
보물=極めて稀で、貴重な価値のある宝物。／保存する価値があると国家が法的に指定した有形文化財。／(比喩的に) 非常に大切で、かけがえのない人や物。
보석=外観が美しく色合いが綺麗で、希少な鉱物。ダイヤモンド、ルビー、真珠などのように装飾品として使われる(宝石)。／非常に貴く大切な人や物を比喩的にいう言葉。
보완=足りない部分を補って完全にすること。主に不足している点や欠陥を埋めて、より良い状態にする過程を意味する。
보장되다=ある事柄が支障なく行われるように、条件や環境が整えられる。／権利や地位などが侵害されないように、確実に保護される。
보장하다=ある事柄に支障がなく、うまく運ぶように条件を整えたり保護したりする。／権利や地位などを失わないように保護し、守る。
보충=足りないものを補って満たすこと（補充 / 補足）。／（教育）正規の授業以外に、不足している学習を補うために実施する授業（補習）。
보편적=すべてのものに等しく当てはまったり、共通していること（普遍的）。／時代や場所に関係なく、誰もが納得できる一般的なこと。
보호되다=危険や困難に遭わないよう世話を受けたり、安全に維持されたりする（保護される）。／（法律や制度などにより）権利や所有権などが侵害されないよう保障される。／（物や環境などが）損傷したり破壊されたりしないよう、大切に保管・管理される。
보호하다=危険や困難に遭わないよう、よく世話をしたり守ったりする。／損傷しないように、よく保管したり維持したりする。／(法律) 権利や利益が侵害されないように制度的に防ぐ。
복수=自分に害を与えた人に、同じように仕返しをすること(復讐)。／二つ以上の数。またはその数に当たるもの(複数)。
복용=薬を飲むこと（服用）。
복통=腹痛。胃腸疾患、食中毒、消化不良など、様々な原因によって腹部に感じられる痛みを総称する。
볶음=水気を少なくして火にかけ、かき混ぜながら火を通した食べ物（炒め物）。／炒めること、または炒めて作る調理法を総称する言葉。
본격적=物事の骨組みをきちんと整え、正式に行うさま。／物事の状態が軌道に乗り、活発に行われるさま。
본능=動物や人間が生まれつき持っており、教育や経験によらず特定の刺激に対して無意識に反応する先天的な行動様式。／物事を行ったり判断したりする際、理性よりも直感的に湧き起こる心の動き。
본성=人が生まれつき持っている本来の性質（本性）。／ある物事や現象が本来持っている固有の特性。
볼링=重いボールを転がし、レーンの端に立てられた10本のピンを倒す室内競技。
부-=一部の名詞の前に付き、「否定」や「反対」の意味を添える接頭辞。「〜しないこと」や「不足」の意味を表す。
부담하다=ある義務や責任を負う。／費用や品物などを引き受けて出したり、負担したりする。
부잣집=財物が非常に多く、裕福に暮らしている家。またはそのような家庭(金持ちの家)。
부정하다=ある事実や内容がそうではないと断定したり、正しくないと退けること。または、賛成せずに反対すること。
부츠=足首以上の高さまである西洋式の靴。革、ゴム、布など様々な材質で作られ、防寒や足의保護のため、あるいはファッションアイテムとして履く。
부회장=会長を補佐し、会長が不在などの際にその職무を代行する職位。またはその職位にある人(副会長)。
북미=北アメリカ大陸とその周辺の島々を総称する地理的名称。主にアメリカとカナダを中心とし、場合によってはメキシコを含むこともある。
북한=韓半島の軍事境界線以北の地域を占有している共産主義国家。正式名称は「朝鮮民主主義人民共和国」である。
분단=本来一つだったものが二つ以上の部分に分かれたり切れたりすること。／特に国の国土が政治的な理由などによって複数に分かれた状態を意味する。
분류=種類によって分けること。物事を一定の基準に従って区分けし、整理することを意味する。／[生物] 生物を系統的関係に基づいて分け、体系化すること。
분리되다=互いに離れた状態になったり、分かれたりする。／一つだったものが複数の部分や要素に分かれる。／関連のあったものが互いに関係が切れ、別に存在するようになる。
분수=圧力を加えて上へ勢いよく噴き出すようにした水。またはその装置。公園や広場などの装飾用としてよく設置される。／噴き出してくる水柱そのものを指す言葉处。／物事を分別する知恵や、自分の境遇にふさわしい限度（身の程 / 分際）。／数学において、全体に対する部分を表す数（分数）。／吹き出る水、または水が吹き出るように作られた施設（噴水）。
분실=自分の物をどこに置いたかわからないまま失くしてしまうこと（紛失）。
분포=一定の範囲の中に散らばって広がっていること。／[生物] 生物の種や集団が地表上のどこかの地域に存在している状態。／[統計] 数値や変量などがある範囲にわたって現れる状態やその形。
분포하다=일정한 範囲に散らばって広がっている。（ある現象、生物、資源などが特定の地域や範囲に位置している状態を表す。）
불-=一部の名詞の前に付き、「～しないこと」、「～できないこと」、「～がないこと」の意味を加えて反対の意味を作る接頭辞。（主に一部の漢字語名詞の前に付き、「不可能」、「不当」、「不足」などの意味を表す。）
불가=正しくないこと。または、不可能であること。／(主に名詞の後に使われ) ある行動や状態が許容されないこと。
불과=数量や水準がある程度にすぎないことを表す言葉。／(主に「～にすぎない」の形で使われ) それ以上ではないという意味を表す。
불과하다=数量や程度がある水準にすぎなかったり、及ばなかったりする状態だ。／（主に「～にすぎない」の形で使われ）ただそれだけであり、それ以上の特別なことがないことを表す。
불리=条件や状況が有利ではないこと（不利）。／利益がないこと。
불리하다=条件や立場などが利益にならず、むしろ害になるような状況にある。
불어=フランス人が使う言葉。またはフランスの国家公用語。「フランス語」を略して言う言葉。
불쾌=ある物事や状況が気に食わず、気分が良くないこと(不快)。／体の状態がすっきりせず、不快な感じ。
뷔페=色々な料理を用意しておき、客が食べたい分だけ取って食べるスタイルのレストラン、またはそのような食事形式。
비-=名詞の前に付き、「それがではない」または「その状態ではない」という意味を添える接頭辞。
비결=世間に知られていない自分だけの優れた方法や技術。／あることを非常にうまくやったり、解決したりできる核心的な方法。
비기다=競技や遊びなどで互いに勝敗が決まらず、点数が同じで終わる（引き分ける）。
비록=いくらそうであっても。後にくる言葉の条件をあらかじめ認める時に使う副詞。主に「-라도（〜であっても）」、「-지만（〜だが）」、「-ㄹ지라도（〜だとしても）」などと共に使われる。
비법=人に知られていない自分だけの特別な方法。／古くから伝わる神秘的な処方や技術。
비유=ある現象や事物を直接説明せず、それと似た性質を持つ他の現象や事物になぞらえて表現すること（比喩）。
비자=外国人が他国に入国するために、当該国の大使館や領事館から受ける入国許可証明書。パスポートにスタンプを押したりステッカーを貼ったりして表示する。（査証）
빗길=雨が降って濡れた道、または雨が降っている道。
빗다=櫛や指などで髪の毛を整える。
빚다=土や粉などをこねて、ある形を作る。（例：陶磁器、餃子、ソンピョンなど）／酒を造る。／ある結果や現象を引き起こす。（主に否定的な状況で使われる）
빨강=明るく濃い赤色。虹の七色のうちの最初の色で、リンゴや血の色のような強烈な赤色のこと。
뻔하다=(動詞の後で「-을 뻔하다」の形で使われ) ある事理が起こりそうな決定的な段階まで行ったが、結局は起こらなかったことを表す言葉。主に否定的な状況やひやりとする状況に対し、幸いであることを表す時に使う。／ある状態や結果が見なくてもわかるほど明白だ。／中が透けて見えるほど隠し事や嘘がない。／(主に「-을 게 / -을 것이」の後に使われ) 何か良くないことが起こる可能性が非常に高いことを表す。
뽀뽀=唇を相手の頬や口、手の甲などに軽くあてること。普通、幼い子供や親密な関係で愛情を表現する時に使う軽い口づけをいう。
삐다=関節が正常な運動範囲を外れ、靭帯や筋肉が痛んだり伸びたりする。（主に足首、手首などに使われる）／（俗語）考えや行動が正常な軌道から外れる。
사내=「男」を卑しめて言ったり、あるいは高く評価して言ったりする言葉。／「夫」を指す言葉。
사립=個人や民間団体が設立して維持すること。またはその施設。（主に公立や国立と対비される概念として使われる。）
사막=雨が降らなかったり、蒸発量が降水量より多くて植物が育ちにくい乾燥した地域。／(比喩的) 生気や活力がなく、殺風景で潤いのない状態や場所を指す言葉。
사생활=個人の私的な日常生活。公的な領域ではなく、個人の領域に属する生活を意味する。
사실상=実際において。または表に現れていない実際の事情や状態から見て。
사연=ある出来事の具体的な内容や事情。／手紙や文章の中心となる内容。／心の中に秘めている思いや事情。
사인=本人であることを確認するために、書類などに独自の筆跡で名前を書くこと。またはその文字。／スポーツの試合や演劇などで、互いに約束した一定の合図や身振り。／有名人がファンの求めに応じて自分の名前を書いてあげること。
사자=ネコ科の哺乳動物。体長は約2メートルで短い毛が生えており、尻尾の先には房毛がある。雄は首にたてがみがあり、雌よりも大きい。「百獣の王」と呼ばれ、主にアフリカやインドに生息する。
사적=個人的な事柄や関係に属する、または公的なものと対照される私的な（私的だ / プライベートな）。／個人的な範囲や性質に属すること。（公的なものと対比される個人の私的な領域）／個人の私生活に関わる事柄。
사진기=物体の形状を感光膜の上に現れるようにし、それを現像して写真を作る機械。「カメラ」ともいう。
사태=物事が進んでいく様子や状況。（主に否定的、または緊迫した状況に用いられる。）／山や丘の土、岩、または積もった雪などが急に崩れ落ちる現象。
사항=ある事柄の内容や計画などを構成する一つ一つの項目や内容（事項）。
사회주의=生産手段の共同所有と管理、計画的な生産と平等な分配を通じて貧富の差をなくし、社会構成員全体が豊かに暮らせる社会を建設しようとする思想や体制。／資本主義の原理である私的所有と自由競争を批判して登場した政治・経済的理論。
삭제=記録されている文字や絵、ファイルなどを消してなくすこと。
산길=山にある道、山道。
산불=山にある木や草に火がつき、広い範囲に燃え広がる火事（山火事 / 山林火災）。
삼국=三つの国。または韓国の歴史における高句麗、百済、新羅の三国時代。あるいは韓・中・日の三カ国。
상가=複数の商店が集まっている建物や地域（商店街）。／商売をするために用意された家や建物（店舗用建物）。
상당=ある程度の水準に達すること：数量、数値、程度などがある程度の高い水準にあるか、かなり多いこと。／互いに匹敵すること：価値や状態などがあるものと等しいか、それに該当すること。
상대성=物事がそれ自体で独立して存在せず、他の物事と依存的な関係を持つ性質。／観点や基準によって価値や状態が変わり得る特性。／[物理] 時間と空間が観測者の状態によって変化し得るという理論的な性質。
상사=職場において自分より地位が高い人。または自分の直属の上司。
상승=数値、価格、気温、物価などが上がること。／低い所から高い所へ上がること。／実力、成績、勢いなどがより良い状態に向上すること。
상영=映画を映写機でスクリーンに映して観客に見せること(上映)。
상인=商売をする人。主に利益を得るために、品物を売り買いすることを職業とする人を指す。
상징=抽象的な物事や観念を具体的な物で表すこと。または、そのように表された形。／[記号論] ある事物を代表したり、代わりとして表したりする記号、文字、標識など。
상징하다=抽象的な物事や観念を具体的な物や記号で表す（象徴する）。
상표=製造業者や販売業者が自社の商品を他業者の商品と区별するために商品に付ける記号、文字、図形などの標識（商標 / ブランド）。／（比喩的に）ある人や物を特徴づける独特な性質や兆し。
상하=上と下をあわせていう語。／地位、身分、階級、年齢などの高いことと低いこと。／服の上の方の部分と下の方の部分。
새삼=以前の感情や状態が改めて新しく感じられる様子。／（しばらく）していなかったことを急に新しくやり直す様子。
새소리=鳥が鳴く声(鳥の鳴き声)。
새집=新しく建てられた家（新築の家）。／新しく引っ越した家。／（比喩的に）鳥が新しく作った巣。
샌들=革や布、ゴムなどの底に紐をつけ、足の甲や足首を固定して履く靴。主に夏場や暑い時期に通気のために履く。
생략=全体から一部を減らしたり抜いたりして簡単にすること。／(文法) 文の成分をあえて表さなくても意味が通じる時、それを表面に出さないこと。
생물=生命力を持ち, 生きて動く存在。動物、植物、微生物などを総称する。／生命現象を研究する学問である「生物学」の略語。／死んだものではなく、生きている物体。
생산되다=人間が生活するのに必要な物や価値が作られる（生産される）。／ある結果や現象などが生じる（生み出される）。
생산력=人間が自然に働きかけて財やサービスを作り出す力。労働力、生産手段、技術的知識などが結合して現れる(生産力)。／単位時間や資源に対して生産される物量や効率を表す能力。
생산자=物や財などをつくり出す人。または、そのような団体や企業。／[経済] 生産活動を担当する主体として、生産要素を結合して商品やサービスを創出する個人や企業。／[生物] 無機物から有機物を合成して自ら栄養分を作る生物。主に緑色植物を指す。
생산하다=人間が生活するのに必要な物を作ったり、作り出したりすること（生産する）。／新しい価値を創出したり、現象や製品などを新しく作り出したりすること。
생존=生きていること。または、世の中に生き残ること。／(主に社会的、経済的な文脈で) 組織や個人が競争に取り残されず、その存在を維持すること。
생활비=日常生活を営むのに必要な費用。食費、衣類代、家賃、交通費など、生活全般にかかるすべての金を意味する。
생활용품=日常生活に必要な品物。（洗剤、歯磨き粉、トイレットペーパー、食器など、日常で常に使う物品を総称する言葉。）
샴푸=髪の毛や頭皮をきれいに洗浄するために使用する液体または固形状の洗浄剤。／シャンプーを使って髪を洗う行為。
서=「西側（서쪽）」の略語。方位の一つで日が沈む方向。
서구=ヨーロッパの西部地域。主にイギリス、フランス、ドイツ、ベネルクス3国などを指す。／西洋の諸国を総称する言葉。一般的に近代化された西欧社会とその文化を意味する。
서넛=三つか四つ、あるいは三、四個ほどの数。／(数量を表す言葉の後に使われ) 三、四人ほどの人数。
서민=何の特権や高い地位も持たない一般の人。また、経済的にゆとりのない一般の庶民や市民。
서클=学校や職場などで、同じ趣味や目的を持つ人々が集まって作った集まり。（サークル / 部活 / 同好会）／丸い形や縁。（円 / サークル）
서툴다=ある事をするのに慣れていなくて不自然だったり、上手ではなかったりする（下手だ / 不器用だ）。／言葉や文章などが滑らかではなく、不自然だ（ぎこちない / つたない）。／感情表現や対人関係の態度が慎重ではなかったり、ぎこちなかったりする（不慣れだ / 苦手だ）。
석=座席や席を数える単位。／一定の場所に集まった人の数や、その場を数える単位。主に公式な会議や演説、集まりなどの場を表す時に使われる。／(冠形詞) 「三(つ)」の意味で、主に数量を表す単位名詞(特に「月(달)」、「束(동)」、「尋(발)」、「石(섬)」、「綛(새)」など)の前に使われ、その数が三であることを表す言葉。
선명하다=色や形などがはっきりしていて鮮明だ。／態度や目的、記憶などが曖昧でなく確実だ。
선약=他の約束に先立って、あらかじめ決めておいた約束。
선언하다=国家や団体、または個人が自らの主張や方針、見解などを外部に公式に広く発表する。／ある事態や状況が成立したことを公式に知らせる。
선장=船の最高責任者として船内のすべての事項を指揮・統制し、乗客と乗組員の安全に責任を持つ人（船長）。
선정=多くの中から目的に合った対象を選び定めること。（例：受賞者の選定、候補地の選定など）
선정하다=多くの中から目的に合ったものを選んで決める（選定する）。
선호=数ある中から、あるものを特別に好むこと。
선호하다=多くの中から、あるものを特別に好むこと（選好する / 好む）。
설=韓国最大の節句（名節）で、旧暦の1月1日のこと。／旧年を送り、新年の最初の朝を迎える節句。
설득=相手が自分の意図に従うように、よく説明したり言い聞かせたりすること（説得）。
설득하다=相手が自分の意に従うように、いろいろと説明したり言い聞かせたりする（説得する）。
설립=団体や機関、学校、会社などを新しく作ること。
설마=そうであるはずはないだろうが、ひょっとしてという気持ちを表す言葉。主に否定的な推測や疑問を表す文章に使われる。／（強調の意味で）到底そうであるはずがないことを表す言葉。
설명되다=ある事柄や内容が分かりやすく明らかにされたり、解説されたりする。／ある事実や現象の原因や理由が明らかにされる。
설정=新しく作って定めておくこと(設定)。／機械や装置、プログラムなどの運用のために必要な条件や環境を合わせて定めること(設定)。／小説、映画、ドラマなどで作品の展開のために人物、背景、事件などの状況を具体的に定めること(設定)。
설치되다=ある機関や施設、装置などが特定の目的のために作られたり、備えられたりする。／機械、道具、プログラムなどが使用できるように、所定の場所に置かれたり装着されたりする。
설치하다=ある機関や設備、装置などを特定の場所に作っておいたり、備え置いたりする。／コンピュータのハードウェアやソフトウェアを使用できる状態に準備する。
섭씨=温度を表す単位の一つ。水の氷点を0度、沸点を100度と定め、その間を100等分した温度体系。記号は℃を使用する（摂氏 / セルシウス）。
성과=成し遂げた結実や功績。（ある仕事をして得られた結果。）
성당=カトリック教(天主教)で宗教儀式を執り行うために建てられた建物(聖堂 / 教会)。／聖なる殿堂や建物を総称していう言葉。
성립=一定の条件が整い、現象・組織・計画などが形になること。／契約・交渉・法案などが正式に結ばれ、確定すること。／論理や理論などが妥当な根拠に基づいて構成されること（成立）。
성립되다=一定の構成要素が集まって、一つの体系や組織が作られる。／契約、条約、法案などが正式に成立する。／ある現象や理論などが妥当性を備えて存在することになる。
성립하다=1. 一定の構成要素が集まって、一つの体系や状態を成す。2. 契約、協議、理論などが正式に成立する。3. ある論理や条件が妥当で、辻褄が合う。
성숙=生物の体が発育して完全に整うこと。／経験や修練を通じて考えや態度が円熟し、寛容で思慮深くなること。／心身が成長して大人らしくなること。／ある社会現象が十分に発展した状態に達すること。
성숙하다=生物の体が発育して完全に整う。／心身が成長して大人らしくなる。／経験や習慣が積み重なり、慣れたり熟したりする。／ある社会現象が十分に発展した状態に至る。
성실=まごころがこもっていて真実なこと。また、態度や行動に偽りがなく、まじめで正直なこと。（反対語：不誠実）
성실하다=誠実だ。真心がこもっていて偽りがない。言葉や態度、行動に嘘がなく、何事にも最善を尽くす状態を意味する。
성장하다=人や動植物などの生物が育って大きくなったり、成熟したりする。／物事の規模や勢力などが大きくなる。／経済や産業などの規模が拡大し、水準が高くなる printer。
세계관=世界および人生全般に対する体系的な理解や見解。個人や集団が世界を眺める根本的な態度や観点を指す。／文学作品、映画、ゲームなどの芸術創作物の中で設定された固有の時間的・空間的な背景と、その中の法則を総称する言葉。
세력=権力や勢いなどで他人を服従させたり、自分の意思通りに動かしたりできる力（勢력 / 権力）。／ある作用が及ぶ範囲や、その力の程度（勢力）。／政治、経済、社会などの分野で、一定の力を持って活動する集団（勢力 / グループ）。
세로=上から下へと続く方向。またはその長さ（縦）。／横方向と直角をなす方向。
세모=三つの直線で囲まれた図形（三角形）。／三つの角や隅。／一年の終わり頃（旧正月を控えた時期）。
세일=商品の価格を下げて売ること。「割引」または「割引販売」に換えて使うことができる。／商品を安く売り出す期間。
세차=自動車のほこりや泥などの汚れを洗い流してきれいにすること。
센티=長さを表す単位である「センチメートル」を短くして言う言葉。（1センチメートルは1メートルの100分の1に当たる。）
셈=ある状況や結果、状態などを表し、「それと同じだ」または「それと同様だ」という意味を表す言葉。／あることをしようとする意図や考え、またはそうするという期待や仮定を表す言葉。／数（数量）を数えることや、計算する状態を表す言葉。
셔츠=スーツの中に着たり、単独で上半身に着る洋風の上着。通常、前がボタンになっており、袖と襟がある。
소-=一部の名詞の前に付き、「規模が小さい」、「程度が低い」、または「範囲が狭い」という意味を添える接頭辞。
소감=ある事柄や現象を経験した後に、心の中に生じる感じや考え(感想 / 所感)。
소독=病気の菌を殺すこと。傷口や物などにある細菌、ウイルス、カビなどの微生物を物理的または化学的な方法で除去したり、その力を弱めたりすること（消毒）。／(比喩的に) 有害な、あるいは良くない要素をなくしてきれいにすること。
소박하다=飾り気や偽りがなく、質素だ。／物の形や構成などが華やかでなく、さっぱりしていて単純だ。
소변=人や動物の体内で老廃物が混ざり、腎臓を経て膀胱に溜まった後、尿道を通じて体外へ排出される液体（おしっこ）。
소속=ある機関や団体に属していること。または、その機関や団体。／ある対象が特定の部類や範囲に含まれること。
소시지=ひき肉に塩や香辛料で味付けし、動物の腸や薄い皮膜に詰め込んだ食べ物（ソーセージ）。
소요=ある事をするのにかかる時間や費用、物資などをひっくるめていう言葉。（本辞典では「所要時間」の意味を重点的に扱う。）
소위=世間で言われていること。いわゆる。
소유자=物件や権利、財産などを自分のものとして持っている人。
소유하다=物や権利などを自分のものとして持っている。
소프트웨어=コンピュータシステムを運用し、特定の作業を遂行するために必要なプログラムやルーチン、およびこれらに関連するすべての文書を総称する言葉。ハードウェアと対比される概念である。／(比喩的に) ある組織やシステムを運営する目に見えない体系、技術、知識などを意味する。
속다=他人の嘘や計略に乗せられて、それを事実だと信じる。／ある物の状態や現象が実際とは異なり、錯覚を起こす。
속마음=表に出さず、心の中に抱いている考えや感情（本심 / 内心）。／外見や言葉とは異なる実際の本音（本心）。
손끝=指の先(指先)。／仕事を処理する手際や、手の力。／指が届く場所や、手の影響が及ぶ範囲。
손잡다=互いの手を握り合う。／ある目的を達成するために志を共にし、互いに協力したり関係を結んだりする（提携する）。
손질하다=ある物や対象をよく手入れしたり整理したりして、状態を良くする。／料理の材料などを洗ったり切ったり整えたりして、料理しやすいように準備する。／髪の毛や身なりなどを整えて、端正にする。
수다=無駄口をたたくこと。またはその言葉。主に「おしゃべりをする」や「長々としゃべる」という形で使われ、軽快で楽しい日常の会話を意味することもある（おしゃべり / 駄弁）。
수량=数えられる物の多さ。または、その分量や額(数量)。
수리=故障したり古くなったりしたところを直すこと(修理)。
수사=警察や検察などの捜査機関が犯罪の有無を確認し、犯人を発見・確保して証拠を収集する活動。
수석=専門分野や団体で最も高い地位や座にある人。／試験や学校の成績などでトップの成績を収めること。また、その人。
수선=古くなったり傷んだりした物を直すこと（修理 / 修繕）。／騒がしくて落ち着かない状態。または、そのような言葉や行動（騒ぎ / 大騒ぎ）。
수속=ある事を進めたり完成させたりするために経なければならない、定められた順序や手続き。主に行政的な業務や公式な過程を終える時に使われる。
수용=提案、批判、条件などを受け入れること。／勢力や思想などを受け入れ、自分のものにすること。／人や物などを一定の場所や施設に収容すること。
수정=誤った部分や適当でない部分を正して直すこと(修正)。／すでに立てられた計画、法令、文言などを状況に合わせて変更すること(修正 / 変更)。
수집하다=趣味や研究のために、散らばっている資料や物を探して集める。／情報や証拠などを一つにまとめる。
수행=計画、業務、任務などを実際に執り行うこと。
수행하다=考えたり計画したりした通りに事を進めていくこと。／(主に公的な任務や課題を) 実際に履行したり実行したりすること。
수험생=試験を受ける学生。または試験を受けるために勉強している人(受験生)。
숙녀=教養と礼儀作法を身につけた、しとやかな女性。／(一般的に成人した女性を待遇して呼ぶ言葉で) 女性を敬って呼ぶ言葉。
숙박=旅館やホテルなどで、眠ったり泊まったりすること。
순수=全く他のものが混ざっていないこと。／考えや態度に私欲や不純な意図がないこと。／学問や芸術などで、他の目的なくそれ自体の本質的な原理や価値を追求すること。
순하다=性質や態度がきつくなく、穏やかで素直だ。／動物が野性的でなく、人によく懐いて従う。／食べ物の味や酒・たばこの刺激が強くなく、まろやかだ。／天気や風などが激しくなく、穏やかで暖かい。
쉿=他人に話し声を抑えたり、静かにするように促したりする時に出す声。／ある秘密を守るように言ったり、注意を喚起したりする時に出す声。
슈퍼=「スーパーマーケット」の略語。日常生活に必要な食品や雑貨などを備え、客が自分で選んで購入できるようにした比較的規模の大きい店。／（接頭辞的な意味で）「通常より大きい」または「最高の」という意味を表し、規模や水準が一般的な範囲を超えていることを指す言葉。
스승=自分を教え導いてくれる人。単に知識を伝える先生よりも、より高く深い尊敬の意味を込めて呼ぶ言葉（師、師匠）。
스케줄=これから行うべき事柄の手順や日程を組んだ計画（スケジュール）。
습도=空気中に含まれている水蒸気の量や程度。普通、百分率(%)で表す。
승낙=他人の頼みや提案を聞き入れること。または、聞き入れて受け入れること。／[法律] 申し込みの相手方が、申し込みの内容に同意することによって契約を成立させる意思表示。
승부=勝ち負け。または、勝ち負けを決めること。／（比喩的に）実力や技術などを競い、決定的な差をつけること。
승차=車に乗ること(乗車)。
승패=勝ち負け。または、勝敗の結果。／優劣や実力の差を競い、決めること。
시댁=夫の家を敬って呼ぶ言葉（婚家 / 夫の実家）。／夫の家族や親族を指す言葉。
시력=物体の存在や形を認識する目の能力。または、その能力の程度。
시부모=夫の父親と母親をあわせていう言葉（嫁の立場から義父と義母をいう言葉）。
시외=都市の境界の外。または都市の周辺地域（市外）。
시위=威勢や気勢を威厳をもって振るうこと。／大勢の人が公然と集会や行進をして威力を示すことで、ある要求を貫徹しようとすること(デモ)。
시즌=スポーツや公演、行事などが一定期間に集中して行われる時期。／季節や特定の活動をするのに適した時期。
시행=実際に行うこと。計画したり決定した事を実際に実行に移すこと。／法令の効力を実際に発生させること。公布された法律や規則などを実際に適用して効力を現すようにすること。
식료품=食品を作るのに必要な材料や食べ物（食料品）。
식비=食べ物を食べるのにかかる費用（食費）。
식후=食事の後。(食事を終えた後の時間や状態を表す。)
식히다=熱気を取ったり、温度を下げたりする。（「冷める」の使役動詞）／興奮や熱気などを静める。
신-=一部の名詞の前に付き、「新しい」、「現代的な」、「初めての」という意味を添える接頭辞。
신고하다=国民が法令に従い、行政官庁や公共機関に特定の事実を書面や口頭で知らせること。／ある事実や状況を警察や関連機関に知らせること。／軍隊や職場などで、上司や組織に着任、除隊、休暇などを報告すること。
신규=新しく資格を得ること、またはその資格。新しく施設を設けること、またはその施設。ある事を初めて始めること。
신뢰=強く信じて頼りにすること。または、そのような態度や心(信頼)。
신맛=酢やレモンの汁のように、舌に触れた時にピリッとして酸っぱく感じられる味（酸味）。
신앙=神や超自然的な絶対者を信じ、崇めること。／特定の宗教の教理や教えを真理として信じ、従うこと。／ある思想や対象を固く信じ、頼りにすること。
신인=ある分野に新しく現れた人。特に芸術、スポーツ、芸能界などの分野に初めて登場して活動を始めた人を指す。／新しいタイプの人。
신입=新しくある組織や団体（学校、会社など）に入ること。また、そのような人のこと（新入り / 新任 / 新入生）。
신중=非常に用心深く、思慮深いこと。物事を行うにあたって軽率に動かず、慎重に対処する態度や状態を意味する。
신청하다=国家機関や公共団体、学校、会社などにある事柄を行ってくれるよう、書面や口頭で求めること。／試合や討論などで、相手に対決や応答を要求すること。
신체적=体に関係すること、または体の機能に関するもの。／体に関すること、または体の機能を備えていること。／体に関する。（主に「신체적」の後に名詞が付いて使用される）
신혼=結婚したばかりであること。または、その時期(新婚)。
실로=実際、実に、誠に。（ある事実や状態を強調する時に使う言葉）
실수하다=不注意で過ちを犯す。／言葉や行動が礼儀に外れる。
실시되다=法令、計画、制度などが実際に行われる（実施される）。
실시하다=法令、規定、計画などを実際に移したり実行したりすること。／ある事や施設などを実際に施して行うこと。
실업=生計を維持するために一定の職業を持って働いていた人が、その職を失うこと。または、そのような状態。／働く意思と能力があるにもかかわらず、就職の機会を得られない状態。
실정=実際の事情や実情、ありのままの様子。
실종=行方をくらまし、行った場所や生死が分からなくなること（失踪 / 行方不明）。／当然あるべきものがなくなること（消失 / 紛失）。
실질적=うわべに現れる形式や名目より는、実際の内容や土台となること。／実質となること。（主に慣用的に「실질적」の後に名詞が来て、その性格や状態を表す。）
실천하다=考えたり計画したりしたことを、実際に行動に移す（実践する）。
실태=あるがままの状態や実際の様子（実態）。
실현되다=夢、計画、希望などが実際に叶う（実現する）。／ある考えや理論が現実の事実として現れる（具現化する）。
실현하다=夢、計画、希望などを実際に叶える。／ある事実や現象を実際に現れさせる。
싫어지다=嫌いではなかったものが嫌いな状態に変わる。気に入らなくなったり、遠ざけたい気持ちが生じるようになる。
싫증=物事が繰り返されることで飽きたり、嫌気がさしたりする感じ。状態や状況に満足できず、これ以上やりたくないと思う気持ち。
십상=「十常八九（十中八九）」の略語で、ほとんど例外なくそうなる時に使う言葉。／ある物事に非常に適していたり、ぴったり合っている状態。／十中八九、ほぼ例外なく。ある状態になるのに非常に適している様子。（主に「-기(에) 십상이다」の形で使われ、ある結果が起こりやすいことを表す。）
쐬다=顔や体に風や日差し、煙などを直接受ける。／気分転換のために家の中や息苦しい場所から離れて外に出る。／（比喩的に）ある空気や雰囲気に触れる。
쓰기=考えや事実を文字で表すこと。一定の言語能力を測定するために文章を書かせる評価方式（書き取り / ライティング）。
쓴맛=舌で感じる味覚の一つで、塩気や酸味、甘味とは異なる、荒くて不快な、あるいは口の中を刺激する味（苦味）。／（比喩的に）人生の苦難や失敗、過酷な試練などを経験して感じる、苦しくて辛い気持ち。
쓸데없이=何の甲斐も利益もない。／（主に金や時間、努力などを）もったいなく、むやみに。
씻기다=(人や動物が他の対象に) 水などで体の垢や汚れを落とさせる。(「洗う」の使役動詞)／(ある対象が他の対象の) 誤解や罪、恥などをそそがせる。(「洗う/そそぐ」の使役動詞)／「洗う」の被動詞。／「洗う」の使役動詞：水や液体で垢や汚れを落とさせる。／「洗う」の受動動詞：垢や汚れが水によって落ちる。／（比喩的に）濡れ衣や心のわだかまりなどが解消される。
아가=子供を可愛がって呼んだり、言ったりする言葉。「赤ちゃん(アギ)」をより柔らかく言う表現。／(主に義理の両親が) 嫁を親しみを込めて呼ぶ時に使う言葉。
아니하다=(動詞の後で「-지 아니하다」の形で使われ) 前の言葉が表す行動を否定したり禁止したりすることを表す言葉。(「않다」の本動詞)／(形容詞の後で「-지 아니하다」の形で使われ) 前の言葉が表す状態を否定することを表す言葉。(「않다」の本動詞)
아동=幼い子供。通常、幼稚園に通う時期から小学校を卒業するまでの子供を指す。／法律的な意味で、成人と対比される未成年者を総称する言葉。
아래층=ある階を基準にして、それより下にある階。／（主に建物の中で）すぐ下に位置する階。
아유=驚いたり慌てたりしたときに出す声。／辛かったり苦しかったりするとき、または面倒だったり嫌気が差したりするときに出す声。／相手の言葉に同意したり感心したりするとき、あるいは申し訳なさを表すときに出す声。／子供や目下の人を可愛がったり、あやしたりするときに出す声.
악취=不快で嫌なにおい(悪臭)。
악화=事柄や状態が以前より悪い方向へ変わること（悪化）。／病気の症状がさらにひどくなること（悪化）。
안색=顔に現れる健康状態や気分、または感情の色つや（顔色）。／他人の気配を伺う顔つき。
안심=心配事がなく、心を安らかに持つこと。またはそのような状態。／牛や豚の腰骨の内側に付いている柔らかい赤身の部位。
안약=目の病気を治療したり、目の疲れを癒したりするために目に入れる液状の薬（目薬）。
안정되다=変わったり揺らいだりせず、状態が静かに維持される。／考えや心が落ち着く。／現象や物体が一定の状態を維持し、危なげがない。
암기=内容を忘れないために暗記すること。または、覚えて記憶すること。
앗=突然驚いたり、慌てたりしたときに出る声。／何か重要なことを急に思い出したときや、悟ったときに出る声。／痛みを感じたり、危急な状況に直面したりしたときに出る声。
앞집=自分の家の前にある家。／自分の家の前の家に住んでいる人。
애기=「あき（赤ちゃん）」を日常的にいう言葉。生まれたばかりの子、または年の若い子供。／（比喩的に）まだ年が若かったり経験が不足していて、分別のない人を親しみを持っていう言葉。／一部の動植物の名前の前に付き、「サイズが小さい」という意味を添える言葉。
애초=最初。または、物事が始まった初期の段階。
액자=絵、写真、書などを入れて壁に掛けたり、立てておいたりできるように作った枠（額縁）。
야경=夜の景色。主に夜に明かりが調和した都市や自然の美しい風景を指す(夜景)。
야근=退勤時間を過ぎた後も残って業務を行うこと。（主に職場で定められた勤務時間後に行う仕事を指す。）
야옹=猫が鳴く声。または、その声を真似ることば(ニャー)。
야하다=卑しく見えるほど身なりや化粧などが過度に派手だったり、毒々しい。／性的刺激を与えるほど体つきが露出していたり、雰囲気が妙だ(エロい / 色っぽい)。／(まれに) 性質や行動が純粋でなく、品位がない。
약도=ある地域や地形の特徴的な部分だけを簡略に描いた地図。道探しを助けるために主要な建物や道路を中心に簡単に表したもの（略図）。
약품=病気を治療したり予防したりするために作られた物質（医薬品）。／化学的な実験や工業的な工程に使われる物質。
약혼=結婚を正式に約束すること。または、そのような関係(婚約)。
얌전=性質や態度が穏やかで品があり、静かなこと。／外見や身なりが端正で清潔感があること。／(慣用句「얌전을 떨다」の形で) 過度に大人しいふりをして、偽善的に振る舞うこと。
양배추=アブラナ科の一年草または二年草。葉は厚くて丸く, 互いに重なり合って球状の塊をなす。ビタミンと食物繊維が豊富で, 食用として広く使われる。
양보=他人(ひと)のために自分の利益や権利、意見などを放棄したり、後回しにしたりすること。／道や席などを他人が先に使えるように譲ること。／自分の主張を曲げて、他人の意見に従うこと。
양산=主に日差しを避けるために用いる傘の形をしたもの。通常は布で作られ、雨傘よりも軽く、装飾が華やかなことが多い（日傘）。
양옆=左と右の両側。
얕다=底から表面までの距離が短い。（反対語：深い / 浅い）。／考えや知識、経験などの水準が低い、または深みがない（浅はかだ）。／眠りや呼吸などが深く入っていない状態にある。／色や味、匂いなどが濃くない（淡い）。
어두워지다=光が弱まり、明るかった状態が暗くなる。／表情や雰囲気が明るさを失い、憂鬱になったり深刻になったりする。／視力が悪くなったり、物を見分ける能力が低下したりする。
어째서=「어찌하여서」が短くなった言葉。どうして。なぜ。
어찌=一体どのような理由や方法で。／程度が非常に激しいか、状況が驚くべき時。（主に「～ㄴ지/은지/는지」と共に使われる）／後に否定的な表現が来て、「決して～できない」という意味を表す時。
어휘=ある範囲内で使われる単語の数、または単語の全体。特定の言語、地域、分野、または個人が使用する単語の集合（語彙）。
어휴=ひどくもどかしかったり、疲れたりしてため息をつくときに出す音。／呆れたり、あまりにも意外で言葉を失ったりしたときに出す音.／驚いたり、慌てたりしたときに出す音。／余裕がなかったり、疲れ果てたりしたときに漏らす音。
억양=言葉の調子。声の高低を変化させて言葉の意味や感情の状態を表すこと（アクセント / イントネーション）。／勢力や気勢などを抑えたり高めたりすること。
언급=ある対象や問題について述べること。または、その言葉。
얼룩=液体などが付着したり染み込んだり、あるいは色あせたりして、本来の地の色とは異なって変わった部分(しみ / 斑点)。／ある物事や現象に残った良くない痕跡や点(汚点 / 傷)。
얼리다=液体や水気のある物体を零下の温度に置き、硬い固体状態にすること（「凍る」の使役動詞）。／物の温度を下げて鮮度を維持したり、保管しやすくしたりすること。
얼마간=(名詞) いくらかの分量や金額。(特に、いくらかのお金を意味する時に頻繁に使われる)／(副詞) 程度や数量がいくらか。または、しばらくの間。
얼핏=通りすがりに、ごく短い時間現れたり見えたりする様子。／考えや記憶などが、ふと思い浮かぶ様子。／ある事実や状況を詳しくなく、おぼろげに察する様子。
엄격=言葉、態度、規則などが非常に徹底しており、厳しいこと（厳格）。／些細な過ちも容赦しないほど厳しいこと。
엄격하다=言葉、態度、規則などが非常に徹底していて厳しい。秩序や規律を守る上で、少しの隙や寛大さもない(厳格だ / 厳しい)。
업계=同じ種類の産業や事業に従事する人々の活動分野、またはその領域（業界）。
업적=ある事業や研究などで成し遂げた功績や成果。
업종=営業や事業の種類。（例：サービス業、製造業、流通業など）
엊그제=「엊그저께（おととい・先日）」の縮約形。つい数日前。／ついこの間のことを指し、心理的に時間が非常に短く感じられる時に使う言葉。／つい数日前。（「어제그저께」の縮約形）／（比喩的に）ごく近い過去を指す言葉。
에=答える時や呼びかけに応じる時に使う言葉。「はい(イェ)」より少し軽い、あるいは無関心な感じを与える。／ある事実を新しく悟ったり、不審に思ったりする時に発する声。／話をしている途中で、次の言葉がすぐに思い浮かばない時に時間を稼ぐために発する声。
여겨지다=心の中でどのようであると思われたり、認められたりする。（「思う・見なす」の受動態）／ある状態や性質だと見なされたり、判断されたりする。
여고=「女子高等学校」を略していう言葉。女子生徒だけが通う高等学校を意味する。
여고생=女子高等学校に通う生徒。「女子高生」の略語。
여론=社会の大多数の人々が、ある社会的問題や現象に対して持っている共通の意見。
여부=そうであるかないか（～か否か / 与否）。／（主に「-するかどうか」の構成で使われ）あることをするかしないか決まっていない状態。
여직원=女性の職員。主に職場や団体で勤務する女性の従業員を指す。
엮다=紐や紐などで物を一つに結んだり繋いだりする。（例：わらや竹などを縦横に交差させて編む。）／様々な事件、現象、物語などを一つに繋げて組織したり構成したりする。／複数の人々を一つの関係や組織にまとめる。／（比喩的に）他人を騙したり陥れたりして、ある事に無理やり巻き込む。
연=地球の公転周期を基準とする時間の単位で、一年間の期間や量を表す時に使われる（年）。
연고=傷口や皮膚病がある場所に塗る、油分のある粘り気のある薬（軟膏）。
연도=事務や会計決算などの処理のために、便宜上設定した一年の期間。／前の名詞に対応する特定の年。
연못=地面を掘って水を溜めたり、自然に水が溜まった小さな場所。沼より小さく、水深が浅いのが一般的である。
연봉=一年の間に受け取る報酬の総額。主に会社員や専門職従事者の能力を評価して支給される年単位の賃金を意味する。
연체=納付すべき金銭や物品などを、期限が過ぎても出さないこと（延滞）。／期限までに終わらせることができず、物事が後に延びること（遅滞）。
연탄=石炭の粉に石灰などを混ぜて練り、穴を開けて固めた燃料。主に自炊や暖房用に使われ、穴の数によって九孔炭、十九孔炭などと呼ばれる(練炭)。
열중=一つの事に精神を集中し、他の事を顧みない状態（熱中）。
열째=順番が10番目になること（第十）。／10日目の日。／順序を数える際、10番目になる番。または、その順序に当たる人や物。／(主に「열째 날」の意味で使われ) 一ヶ月の10番目にあたる日。／(冠形詞) 順番が10番目になる。
염려=将来のことについて、苦しい気持ちで心配すること。または、その心配。
염색=糸、布、紙、髪の毛などに染料を染み込ませて、その色を変化させること。／[生物] 顕微鏡での観察を容易にするために、細胞や組織の特定部位を色素で染めること。
영원=ある状態が果てしなく続くこと。または、時間の終わりがないこと。／ある対象に対する気持ちや約束が変らずに持続することをいう言葉。
영화제=映画の芸術的・技術的成果を評価したり、産業的発展を図るために、一定期間に複数の映画を上映して行う祭典（映画祭）。
옆방=隣にある部屋。または、すぐ隣の部屋。
예고=ある事をあらかじめ知らせること。また、その知らせ（予告）。／これから起こることをあらかじめ見せたり、察じさせたりすること。
예방하다=病気や災難などが起こる前に、あらかじめ対処して防ぐ。
예상되다=今後の出来事や状況が前もって考えられたり推測されたりする（予想される）。
예상하다=ある事をする前や、ある現象が現れる前に、将来の状況をあらかじめ考えて推し量る（予想する）。
예술적=芸術の性質を持つさま。または芸術に関するさま。／美的価値が高いか、芸術的な技巧が優れているさま。／芸術の性質を持っていること。または芸術に関するもの。／芸術の基準から見て美しさや価値があること。
예정되다=将来のことがあらかじめ決まったり、計画されたりする（予定される）。
예측=あらかじめ推し量って見当をつけること。または、その内容。主に将来の状況や統計的な数値をあらかじめ推測する時に使う(予測)。
예측하다=将来の出来事をあらかじめ推し量って判断する。（データ、経験、兆候などをもとに、これから起こることを推測すること。）
옛날이야기=昔あった出来事や、伝わってきた伝説・民話などを素材にした話。／昔の自分の経験や、過ぎ去った過去の出来事。／（比喩的に）今はもう役に立たなくなったり、現実とかけ離れたりした話。
오븐=密閉された空間の中に熱を閉じ込め、食品を加熱したり焼いたりするのに使う調理器具。主にパン、菓子、肉料理などを作る際に使用する。
오염되다=汚い物質に染まったり、空気や水などが汚れる（汚染される）。／悪い思想や習慣などに染まる。
오피스텔=オフィス(Office)とホテル(Hotel)を合わせた造語で、昼間は業務を行い、夜は宿泊や自炊ができるように設計された建築物。主に都心に位置し、住居用と事務用の機能を併せ持つ住居形態。
온종일=朝から晩までの間。すなわち、一日の全時間を意味する（終日 / 一日中）。／朝から晩までの間。（日が暮れるまでの全時間 / 一日中）。
온천=地熱によって平均気温より高い温度で湧き出る泉。または、そのような泉がある施設や場所(温泉)。
올라타다=乗り物や動物の背などに乗る。／高い所や物の上に足を踏み出して登る。／ある流れや勢い、機会などを利用する。
올여름=今年の夏。
와인=葡萄を発酵させて作ったお酒。一般的に赤葡萄で作った赤ワインと、白葡萄で作った白ワインに分けられる。
완벽=欠点や不足が全くなく、完全であること。
완성되다=完全になされる（完成される）。／していた仕事がうまく締めくくられて終わる。
완성하다=完全に成し遂げる。／予定していたことや計画していた仕事を終える（完成させる）。
완전하다=欠点や不足がなく、すべてが備わっている。ある対象の状態や性質が非常に完璧な状態にある(完全だ / 完璧だ)。
왕복=一定の二地点間を行ってから、再び戻ってくること。／ある場所に行って帰ってくるのにかかる費用や時間。／品物や手紙などが行き来すること。
왕자=王の息子（王子）。／[比喩的意味] 特定の分野で最も優れている、あるいは権威のある人（〜の王者）。／[比喩的意味] 大切に育てられた男の子を指す言葉。
외가=母親の実家。つまり、母方の祖母と祖父が住んでいたり、母親の兄弟たちがいる実家のこと。
외면=人の外見や物の外面。／顔を合わせるのを嫌がって、顔をそむけて避けること。／ある事実や現象を認めず、故意に無視したり避けたりすること。
외면하다=顔を合わせるのを嫌がって顔を背け、避けること。／現実や事実、真理などを認めずに拒否したり、目をそらしたりすること。
외박=自分の家ではない別の場所で夜を過ごし、眠ること。主に軍人や学生などが定められた居所を離れて外で寝ることを意味したり、一般的な家庭で外に泊まってくる行為を指す。
외식=家で料理を作って食べず、外で買って食べること。または、そのような食事（外食）。
외출하다=家や普段滞在している場所から、しばらくの間外に出る（外出する）。
외투=寒さを防ぐために上着やスーツなどの上に着る服。（例：コート、オーバーコートなど）／（比喩的に）表に現れる姿や形式をいう言葉。
왼편=人が北を向いている時、西に当たる方向。または基準となる対象の左方向(左側 / 左手)。
요가=古代インドから伝わる心身鍛錬法の一つ。ポーズ、呼吸、瞑想を通じて心身を浄化し、精神統一を図る運動であり、修行方式である。
요구되다=ある事をするように求められる。／ある条件、資格、物などが必要とされる。
요소=物事の成立や効力発生に必ず必要な根本的な成分や条件（要素）。／[数学] 集合を構成している個々の対象（要素 / 元）。
요약=話や文章の核心となる内容をかいつまむこと。または、そのかいつまんだ内容(要約)。
요약하다=言葉や文章の核となる内容をかいつまんで整理する（要約する）。
요인=物事や現象が成立したり変化したりする根本的な原因。成功や失敗に決定的な影響を及ぼす中心的な要素。
요청하다=必要な事や行動をしてほしいと切に願ったり、要求したりすること。
욕망=足りなさを感じ、何かを手に入れたり楽しんだりすることを切に願う心（欲望 / 欲求）。
용건=用事や話したいことの核心となる内容（用件 / 用事）。
용서하다=犯した罪や過ちに対して、叱ったり罰を与えたりせず、寛大に許してやる。／(主に否認や否定の意味を表す言葉とともに使われ) ある状況や行動が容認されなかったり、寛大に見てやることができなかったりする。
용품=ある目的や活動に使われる品物や道具(用品)。
우물=地面を深く掘って地下水をためておくように作った施設（井戸）。／（比喩的に）一つのことだけに没두する状態や領域。
우수=才能や実力、品質などが、多くの中でとりわけ優れていること。／(主に教育現場で) 成績が非常に良い学生、またはそのような状態のこと。
우승하다=競技や競合で第一位になる(優勝する)。
우연=[哲学] 必然的な原因がなく起こる現象。
우울=心に悩みがあって気分が晴れず、沈んでいる状態。元気がなく活動が萎縮して、重苦しく悲しい感情。
우측=右の方向や場所を意味する名詞（右側）。
운반=品物などを運び移すこと(運搬 / 運び)。／(生物) 生体内で物質がある場所から別の場所へ移動すること(運搬)。
운영=組織、機構、事業体などを管理し、運用していくこと。／ある対象を目的に応じて効率的に動かすこと。
운영하다=組織、機構、事業体などを管理し、運営していくこと。／ある物や機能などを状況に合わせて使いこなしたり活用したりすること。
웃어른=自分より年上であったり、家系図上の列次（行列）が高い目上の人。主に尊敬の対象として礼儀を尽くすべき相手を指す。
원고=印刷したり発表したりするために書いた文章や絵の草稿。
원룸=一つの部屋に居間、寝室、台所などの機能をすべて備えた住居形態。主に学生や会社員などの単身世帯が居住し、トイレ以外の空間がつながっているのが特徴。
원리=物の現象や作用が起こる根本となる法則。／認識や行為の基礎となる道徳的な規範や根拠。
원장=「院」の字が付く機関や団体の長。（例：病院、学院、研究院、研修院、孤児院など）／法院（裁判所）や監査院などの国家機関の長。
원칙=ある行動や理論などにおいて、一貫して守るべき基本的な規則や法則（原則）。／事物の根本となる普遍的な法則。
월말=月の終わり頃。およそ25日からその月の末日までの期間を指す(月末)。
위로하다=温かい言葉や行動で苦しみを和らげたり、悲しみをなだめたりする(慰める)。／苦労した功績をねぎらい、心を安らかにしてあげる(ねぎらう)。
위성=[天文] 惑星の周囲をその引力によって回転する天体。月は地球の衛星である。／[宇宙] 惑星の周囲を回るように人工的に製作して打ち上げた装置。「人工衛星」の略語。／[比喩] ある中心となるものに従属し、その周辺にあるものを比喩的にいう言葉。
위아래=高い方と低い方、または上の部分と下の部分。／年齢や地位が高いか低いかの程度。／服の上の着物と下の着物を合わせていう言葉。
위원=ある団体や機関から特定の事務を処理するように委任された人。／委員会を構成する個々のメンバー。
위원장=委員会の事務を総括し、その委員会を代表する最高責任者。
위주=あるものを最も重要に考えたり、中心に据えたりすること(〜中心 / 〜主体)。
윗글=ある文章で先に書かれた文。または、すぐ上に書かれた文（上の文 / 前述の文章）。
윗사람=年齢、地位、身分、行列などが自分より高い人（目上の人 / 先輩 / 上司）。
유능=ある仕事をやり遂げるだけの力量や能力があること。
유도=人や物を目的の方向や場所に導くこと。／人を誘ってある行動をさせたり、特定の状態に導くこと。／[物理] エネルギーや流れが直接触れずに、物理的現象によって伝わったり発生したりする現象。
유럽=アジア大陸の西にある大陸。地中海、大西洋、北極海に囲まれており、イギリス、フランス、ドイツ、イタリアなど多くの国が属している。西洋文明の発祥地であり、政治、経済、文化の中心地の一つである。／アジア大陸の西側に位置する大陸。大西洋、北極海、地中海などに囲まれており、イギリス、フランス、ドイツ、イタリアなど多くの国が属している。西洋文明の発祥地であり、政治、経済、文化の中心地の一つである。
유료=ある物を利用したりサービスを受けたりすることに対して、一定の代金を支払わなければならないこと。またはその代金。
유리하다=利益がある。（条件、事情、都合などがある対象に有利だったり、助けになったりする状態にある。）
유사하다=互いに似ている。（形、性質、特徴などが互いに似通った状態にある。）
유의하다=心に留めて気をつけたり、関心を持ったりする。ある事柄や状況に対して注意を払う。
유일=たった一つしかないこと。
유지=ある状態や状況が変わることなく続くようにすること（維持）。／秩序、平和、健康などを保存し、守っていくこと（維持）。
유지하다=ある状態や状況が変わることなく続くようにする（維持する）。／ある対象が本来の機能を果たしたり、形を失わないように世話をし、管理する。
유쾌=気分がよくて楽しいこと。
유통=貨幣や物品、資本などが世の中で広く使われたり、あちこち回ったりすること（流通）。／空気や液体などが滞りなく流れ通ること（流通 / 通風）。
유혹=他人をそそのかして理性を失わせたり、悪い道へ引き込んだりすること。／性的な欲求を呼び起こしてなだめたり、誘ったりすること。／賄賂や不正な利益を条件に人の心を捉え、正しくないことをさせること。
육지=川、湖、海などの水を除いた地球の表面。すなわち「陸（おか）」を意味する。／島や海と対比して、大陸や本土を指す言葉。
으악=急に驚いたり、悲鳴を上げたりする時に出す声（うわっ / きゃあ）。／吐き気がして急に吐く時に出す声（おえっ）。／食べたものを突然、声を出しながら激しく吐く様子を表す副詞。／突然驚いたり、悲鳴を上げたりする時の声。
은혜=ありがたく施される恩恵や好意。／自然や神霊が人間に授ける慈しみ（恩寵）。
음반=音を記録して再生できるように作られた平板状の物体。主に音楽を収めて販売するCD、LP、カセットテープなどの総称。／歌手が歌を録音して大衆に正式に発表する媒体。
응답=呼びかけや問い、または送った手紙などに対して答えること。または、その答え。／外部からの刺激に対応して、何らかの反応を見せること。／[コンピュータ] 端末から送られたメッセージに対して、システムが反応を示すこと。
응시=試験に臨むこと。または試験を受けること。
응원=そばで拍手や歓声などを送りながら励ますこと。または、その励まし。／運動競技や活動などで、勝패や成功を助けるために力を貸すこと。
의논=ある事柄について互いに意見をやり取りすること。または、ある問題を解決するために大勢で話し合うこと。
의논하다=ある問題に対して互いに意見を交わす（議論する / 相談する）。
의상=外側に着る服（衣服 / 衣装）。／特定の行事や目的（公演、演劇、舞踊など）のために整えて着る服（衣装）。
의식하다=覚醒した状態で、自分自身や周囲の事物を感じ、認識する。／ある事柄や対象に対して、特に注意を向けたり気にかけたりする。／(社会的・政治的)問題などに対して、目覚めた考えを持つ。
의외=考えたり予想したりしたこととは違うこと。または、そのような状態(意外)。
의외로=考えたり予想したりしていたこととは違って（意外に / 案外）。
의원=国会や地方議会など、合議制の議決機関の構成員。選挙を通じて選出され、法律を制定したり予算案を審議したりするなどの職務を遂行する。
의존=物事を自分で行うことができず、他の対象に頼って助けを受けること(依存)。／酒、薬物、ギャンブルなど、特定の物質や行為に過度に耽溺し、それなしでは正常な生活が不可能な状態。
의존하다=何かに頼って存在したり生活したりすること（依存する / 頼る）。／自分の力で解決できず、他人の助けや外部の条件に頼ること（依存する / 依存している）。
의지하다=他のものに体を寄せる（寄りかかる）。／ある対象に心を寄せ、助けを受けたり力を得たりする（頼る / 依存する）。／ある物事や現象に基づいている（基づく / よ（拠）る）。
의학=人体の構造と機能を研究し、疾病の予防と治療および健康維持を目的とする学問。
이같이=前述の内容や状態のように。または、まさにこのように。
이곳저곳=あちこち。色々な場所や方向を指す言葉。
이놈=話し手が男の子を低めて言ったり、可愛がって言ったりする言葉（この坊主 / この子）。／男の人を卑しめて言ったり、冷酷に罵ったりする時に使う言葉（この野郎 / この奴）。／（対象を指して）前ですでに言及されたり、近くにいたりする男性を指す言葉（こいつ）。
이데올로기=人間、自然、社会に対して抱く意識の形態や思想体系。特に政治的、社会的行動の基礎となる観念の集合を指す。／社会集団や階級の利益を反映し、正当化する信念体系。
이동하다=ある場所から別の場所に移動したり、位置を変えたりすること（移動する）。／職場や職位、部署などが別の場所に移ること（異動する）。
이따=少し経った後で(後で / 後ほど)。
이래=（ある事件や状態が発生した）基準となる時点から今までの間。（主に「-은/는/ㄴ 이래」の構成で使われる）
이래서=「いりして（こうして）」または「いろして（こうだから）」が縮まった言葉。先に述べたいかなる理由や根拠、状況によって、後の結果が現れることを表す接続詞的な表現。
이론=個別の現象を一つの原理や体系でまとめて説明する知識体系(理論)。／実践や実務を離れて抽象的に議論される考えや見解。／[哲学] 物事の道理や原理などを知的に把握し、体系化したもの。
이만=状態、様子、程度などがこの程度に。／(主に手紙や会話を終える時) これ以上続けず、このまま。
이민=自国を離れて他国へ移り住むこと。または、そのような人。／他国から入ってきて住むこと。または、そのような人。
이발=主に男性が髪の毛を切り、整えること(散髪 / 理髪)。
이발소=主に男性の髪を切り整え、髭剃りなどのサービスを行う施設を備えた場所（理髪店 / 床屋）。
이사장=理事会を代表し、理事会の事務を総括する人。法人や団体の最高責任者を指す。
이왕=すでにそうなったからには。または、以前の事実がそうである以上。/ 既往。以前のことや状態。／[名詞] すでに過ぎ去ったこと。／[副詞] すでにそうなったからには。（主に後に続く決定や状況を強調する時に使われる）
이중=一つの要素が重なって二つの層や二重になること。またはそのような状態。／異なる二つの性質や状態が一つの場所に共存していること。／表向きの姿と本心が互いに異なることを比喩的にいう言葉。
이해되다=物事の道理や状況が何であるか分かるようになる（理解される）。／他人の事情や都合を察して、寛大に受け入れられる。／言葉や文章の意味が把握される。
이혼하다=夫婦が法律的に婚姻関係を解消して別れる。
인=人：人間をいう言葉。主に他の名詞の後ろに付き、その分野に従事したり、そのような特性を持った人を表す。／人数：人の数を数える単位。（例：3人前、5人家族）
인근=隣り合った近い場所。または近い近所(近隣 / 付近)。
인도=人が歩けるように設けられた道路の一部。通常、車道より高く作られたり、境界石を置いて区分する。（歩道）／他人を教え導いたり、目的地へ案内すること。
인력=人の力。または人の労働力。／ある仕事をするのに必要な人（人材 / 要員）。／[物理] 二つの物体が互いに引き合う力（引力）。
인사말=会った時や別れる時、または礼儀を尽くすべき席で交わす挨拶の言葉。／本の序文や祝辞などで感謝の意や紹介の文を記した言葉。
인식=物事を分別し、判断して知ること（認識）。／ある対象に対して、その本質や価値を深く理解し体得する過程。／心理学で刺激を受け入れ、保存し、引き出す一連の精神的過程。
인식하다=物事を分別し、判断して知ること。／ある事実や現象を意識し、それについて明確な知識や理解を持つようになること。／コンピュータや機械装置が入力された情報（文字、音声、指紋など）を判読し、識別すること。
인심=人の心。／他人を配慮したり助けたりする寛大な心 (人情)。／社会全体の人々の共通した心、または風俗 (世評 / 民心)。
인용=他人の言葉や文章を自分の言葉や文章の中に引いて使うこと（引用）。／法律的な処分や申請の内容を受け入れること（認容）。
인정=他人を同情したり助けたりする温かい心。（他人を大切にし、真心込めて接する気立て。）／人としての情や人間らしい面。／ある事実や状態がそうであると確実に受け入れること。／他人の能力、価値、または成果を立派だと認めたり、公式に受け入れたりすること。／(法律) 法廷で事実の有無を判断して確定すること。
인정되다=ある事実や状態がその通りであると判断されたり、受け入れられたりする。価値や能力、資格などが正当であると評価されたり承認されたりする。または、法的・公式的に効力があるものと見なされる。
인정하다=ある事実や状態がその通りだと判断して受け入れること。／能力や価値などを高く評価すること。／法的、あるいは公的にある権利や資格を許可したり確定したりすること。
일시=あることが起こる日と時（日時）。／短い時間。または、しばらくの間（一時）。
일어=日本人が使う言葉。（同意語：日本語）／一言の言葉、または短い言葉。
일자=日付を表す言葉。／仕事をする日（日数）、または特定の日。
일정하다=対象の状態、形、大きさなどが変わらず、いつも同じである。／考えや態度などが変わらず、一つに固定されている。／決まった規則や枠組みがあり、外れることがない。
일출=太陽が地平線や水平線の上に昇ること（日の出）。
일치하다=比較される対象が互いに食い違わず、同じであったり合致したりする。／考え、主張、態度などが互いに一つに合わさる。
일회용품=一度だけ使って捨てるように作られた品物。（主に紙コップ、割り箸、ビニール袋などのように、利便性のために一時的に使われる製品を指します。）
읽기=文字を見てその音を声に出して言うこと（音読）。／文章を見てその中に込められた意味を把握すること（読解）。／機械や装置がデータや情報を確認し処理すること（読み取り）。
읽히다=「読む」の使役動詞：他人に文章を見せたり、声に出して読ませたりする。／「読む」の受身動詞：文章や本が他の人によって読まれたり、内容が把握されたりする。／読書の状態：本や文章が読者に快く受け入れられたり、滞りなく理解されたりする。／(被動詞) 文章や本などが他人に読まれる。(「読む」の被動詞)／(使役動詞) 文章や本などを人に読ませる。(「読む」の使役動詞)／(被動詞) 他人に考えや本心が把握される。
입금=銀行や金融機関などの口座にお金を入れること。または、そのお金（入金）。
자극하다=外部から何らかの作用を加え、生体に反応を起こさせる。／ある物事や現象が人の心をあおり、一定の感情を起こさせたり行動をさせたりする。／経済や社会現象などに活気を吹き込んだり、変化を与えたりする。
자네=(代名詞) 聞き手が友人や目下の人である時、その人を高めて呼ぶ二人称代名詞。主に中年以上の男性が多く使い、高くも低くもない関係で用いられる。／(代名詞) 義父や義母が婿を呼ぶ言葉。
자막=映画、テレビ画面、舞台芸術などで、観客の理解を助けるために画面や舞台の横に表示される文字。台詞、歌詞、解説などを記す。／外国語の映像を翻訳して画面の下に表示する文字。
자본=商売や事業をする上での基盤となるお金(資本 / 元手)。／生産の基礎となる財貨。土地や労働以外に、機械、建物、原材料など、生産に投入される有形・無形の資産。／ある事をするために利用できる能力や手段などを比喩的に言う言葉。
자연적=人の力が加わらず、自ずから存在したり成し遂げられたりすること（自然的）。／人為的ではなく、自然の性質に合致すること。／人の力が加わらず、自然のままの状態や性質を持っていること。／自然の法則や現象によること。
자율=他人の支配や拘束を受けず、自分自身の原則に従って物事を行うこと（自律）。／[哲学] 客観的な道徳法則を自身の意志として受け入れ、それに従うこと。カント哲学の根本概念である。
자판=コンピュータやタイプライターなどで文字を入力するために、記号や文字が配列されている板。（キーボード）／印刷で活字を拾って使いやすいように、一定の順序に従って並べておいた板。
작곡=音楽の曲を作ること。または、その曲(作曲)。
작동=機械や装置などが動くこと。または、それらを動かすこと(作動)。
작문=文章を書くこと。または、書いた文章（作文）。／学生に文章の書き方を教える教科（作文）。
작성하다=書類や原稿などの草案をまとめたり、作ったりすること。／（主にスポーツ競技などで）記録や成績を新しく出したり、打ち立てたりすること。
작용하다=ある現象や対象が他のものに影響を及ぼしたり、力を加えたりする。／生物体の内部で生命を維持するために起こる物理的・化学的変化を起こす。
작전=[軍事] 戦争で勝利するために軍事力を運用する計画や方法。／ある事を成し遂げるためにあらかじめ立てた計画や手段。／[運動] 試合で勝つために立てた技術的な戦略や方針。
잔돈=少額のお金（小銭）。／大きな額のお金を崩して小さく分けたお金。／代金を支払った後に受け取るお釣り。（類義語：お釣り）
잔액=残りの金額。使い残した額のお金(残高)。／預金口座や会計帳簿などで、収入から支出を差し引いて残った金額。
장례식=死者を葬る儀式。故人の最後の旅路を見送り、悲しみを分かち合う儀礼を意味する。
장모=妻の母を指す言葉(義母 / 義理の母)。
장비=ある仕事や活動をするのに必要な器具や機械、道具などを備えること。または、その器具や道具。／軍隊で戦闘や訓練に必要な物資や武器体系をまとめていう言葉。
장애=身体機関が本来の機能を果たせなかったり、精神能力に欠陥がある状態。／ある事柄や進行を遮り、妨げになるもの。またはそのような現象。／[通信/コンピュータ] システムが正常に作動しない状態。
장학=勉強や学問への専念を促すために、学費などを補助したり研究を助けたりすること（奨学）。／奨学金を減らしたり増やしたりするなどの教育行政および事業。
잦다=ある現象や出来事が起こる回数が非常に多い（度々ある / 頻繁だ）。／（距離や間隔が）非常に短い、または近い。
재-=「再び」または「二番目」の意味を添える接頭辞。主に漢字語の名詞の前に付き、ある行為や状態が繰り返されることを表す。
재수=良いことが起きたり、利益が生じたりする運勢（運 / つき）。／（主に「運が良い」または「運が悪い」の形で使われ）気分や運勢。
재우다=肉や魚などを調味料で和え、味が染み込むように一定時間置いておく。／(人や動物を) 眠らせる、寝かしつける。／積まれていたり散らばっていたりする物を、秩序立てて整理して置く。／人や動物を眠らせる（「寝る」の使役動詞）。／肉や野菜などを調味料に漬け込み、味が染み込むように器に入れておく。／品物や荷物などを重なり合うように積み上げる。
재작년=去年の前の年。すなわち、今から2年前の年。(一昨年)。
재정=国や地方自治体などがその機能を遂行するために必要な資源を調達、管理、使用する経済活動（財政）。／団体や組織、または個人の経済的状態や暮らし向き（財政状態 / 台所事情）。
재즈=19世紀末から20世紀初頭にかけて、アメリカのニューオーリンズのアフリカ系アメリカ人の間で発生した音楽のジャンル。特有のリズム感や即興演奏、シンコペーション（切分音）などが特徴である。
재킷=上半身に着る短い上着の一つ。袖があり前が開いており、正装用からカジュアルな用途まで多様に活用される(ジャケット)。
잼=果物に砂糖を入れてとろ火で煮詰めて作った食べ物。主にパンやビスケットなどに塗って食べる。
저-=(一部の名詞の前に付き)「低い」という意味を添える接頭辞。主に数値や段階、等級などが基準より下であることを表す時に使われる。
저고리=韓服（ハンボク）の上半身に着用する上着。身頃、袖、襟、トンジョン（半襟）、結び紐（コルム）などで構成され、男女が共通して着る韓国固有の衣服。
저급=品質や水準、段階などが低いこと。／品格や道徳的水準が低く、卑속（ひぞく）であること。
저녁때=日が暮れて夜になろうとする頃。／夕食を食べるのに適した時間。
저울=物体の重さや質量を量るのに使う器具（秤 / はかり）。／（比喩的に）物事の軽重、善悪、是非などを判断する基準。
저장=品物や財貨などを大切にしまっておいたり、保管すること。／コンピュータやデジタル機器で、データやファイルを記憶装置に書き込んで保管すること。
적어지다=数や量、分量などが以前より少なくなる。／（ある現象や状態の）回数や程度が以前より低くなったり、少なくなったりする。
적용되다=法令、規則、原理などが、ある状況や対象に合わせて使われたり、実務に用いられたりするようになる（適用される）。
적응하다=周囲の環境や新しい状態に合わせて調節して変化したり、慣れたりする。／生物が周囲の環境に適合するように、体の形態や機能が変化する。
적자=支出が収入より多くて損失が出ること。または、その損失額。（反対語：黒字）／系譜や血統における正統な子孫。主に本妻が産んだ息子を指す。／ある思想や学説、技術などを正統に受け継いだ人。
적합하다=ある条件や状況、目的などにぴったり合っている（適している / ふさわしい）。
전개되다=開けて現れる。（ある状態や場面が目の前に広がる。）／事件や現象が発展したり進行したりする。（話や物事が特定の方向に進む。）／論理や思想などが解き明かされる。（考えや理論が体系的に説明される。）
전개하다=開いて広げる。（並べて広げたり、広げ置いたりする。）／ある内容や状態を進展させたり、繰り広げたりする。（話、計画、事業などを順を追って進める。）／目の前に広く現れる。（景色や光景が清々しく広がる。）
전달되다=物や内容などが一定の対象を経て、別の側へ移される。／考え、感情、知らせなどが他の人に知らされたり、感じられたりするようになる。／エネルギー、光、熱などの物理現象が他の場所へ移動していく。
전망하다=後日のことをあらかじめ予測したり見通したりする。／広い場所から遠くを眺める。
전문점=ある一種類や特定の範囲の商品だけを専門的に扱う店（専門店）。
전반=ある物事や分野、現象などの全体にわたるすべての部分（全般）。
전반적=ある事柄や分野の全体にわたること。
전원=ある集団や団体に属する人々全員（全員）。／機械や装置に電気エネルギーを供給する源、またはその入り口（電源）。／機械や装置に電気エネルギーを供給する源、またはその入り口(電源)。／その場にいる、あるいは特定のグループのすべての人(全員)。／田畑や家がある田舎の風景や地域(田園)。
전제=ある物事や現象を成立させるために、あらかじめ提示する条件。／[論理学] 推論において結論の基礎となる判断。一つまたは二つ以上の判断から新しい判断を導き出す際の根拠となる判断のこと。
전환=主たる方向や状態、形勢などが、別の方向や状態に変わること(転換)。／社会の制度や思想、技術などが、新しい方向へ急激に変わること。
전환하다=方向、状態、態度、条件などを他の方向や状態に変える（転換する）。／気分や考えの流れを他へ向ける（切り替える）。
점퍼=ゆったりとしていて動きやすく作られた洋風の上着。前が開き、ファスナーやボタンで留めるようになっており、主に運動や作業の時に着る。（一般的に「ジャンバー」とも呼ばれる）
접근하다=近くへ寄ったり、届いたりする。／ある対象や問題に近づくために、それを扱い始めたり分析を試みたりする。／（コンピュータ）ファイルやネットワークシステムなどに接続し、情報をやり取りできる状態になる。／親しくなるために相手に近づく。
접속=互いに向き合ってつながること。または、互いに向き合わせてつなぐこと。／二つ以上の物事や現象などが互いにつながること。／[情報・通信] コンピューターネットワークにおいて、端末やコンピューターが通信網に接続されること。
접수=申請書や書類、物品などを公式に受け取ること(受付 / 受理)。／機関や団体で苦情や知らせを受け取り、処理すること(受け付け)。／(比喩的に) ある場所や状況を完全に掌握したり、占めたりすること(占領 / ジャック)。
정비=機械や設備が正常に作動するように点検し、手入れすること（整備）。／体系的に整理して整えること。／道路や施設などを利用しやすいように整え、改修すること。
정의=ある言葉や物事の意味を明白に定義すること。または、その意味(定義)。／個人間の正しい道理、または社会を構成し維持する公正で正しい道理(正義)。
정작=いろいろな他のことはさておき、直接関係のある事柄に至って（いざ、実際に）。／表に現れていない実際の状態（実は、実際は）。／表に現れていない実際の状態に入って。考えたり意図したりしたこととは異なり、実際に何かの事態に直면した時。あるいは（否定語と共に使われ）当然そうあるべき重要な点を見落としたり、まともにできなかったりする様子。
정직=心に偽りや飾りがなく、正しくてまっすぐなこと。／事実を歪曲せず、ありのままを現す態度。
정착=一定の場所に落ち着いて住むこと(定住)。／新しい文化、制度、思想などが社会に当然のこととして受け入れられたり、慣れ親しまれたりすること(定着)。／物体が他の物体にしっかりとくっつくこと。
정책=政治的目的を実現するために、政府、政党、団体などが立てた計画や方針。／社会の問題を解決したり、特定の目標を達成するために、国家機関が公式に決定した活動路線。
정치권=政治の機能や作用が及ぶ範囲や領域。主に政治家、政党、国会など、政治と直接的な関わりを持つ集団やその社会的環境を指す言葉（政界）。
정치학=国家の権力構造、政府の形態、政治的過程、および国際関係などを体系的に研究する社会科学の一分野。
제-=(一部の数詞の前に付き) 「その数字に該当する順序」の意を添える接頭辞。
제거=取り除くこと。（例：障害物、臭い、毒素などをなくす行為）
제거하다=取り除くこと、除去すること。（ある対象や障害物、危険要素などをなくして存在しないようにする行為を意味する。）
제도=慣習、道徳、法律などの規範によって、一定の秩序が成立している体系。／国家や社会の組織、行動、関係などを規定する法規や基準の総体。
제때=適切な時、または決められた時期。
제비=ツバメ科に属する夏鳥。背中は黒く腹は白いで、尾は二股に分かれた形をしている。春に韓国へ渡来し、家の軒下に泥とわらで巣を作って繁殖する。／(比喩的) ダンスが上手で容姿が端麗なことを利用し、女性を誘惑して金を巻き上げる男を俗にいう語。／「くじ引き（ジェビポプキ）」の略語。複数の人が順番や当選を決めるために、紙などに記号や文字を書いて選ぶもの（くじ）。
제시되다=ある意思や内容、計画などが考えられるように出される（提示される）。／検査や確認のために、物や書類などが前に出される（提示される）。
제시하다=考えや議案を言葉や文章で表して示す。／検査や閲覧のために物を見せる（提示する）。／[心理] 学習課題や刺激を被験者に示す。
제안하다=案や意見を出す。ある案件を処理するために、公式な場で意見を提出する。
제외=ある範囲や対象の中に入らないように外すこと。（除外対象や範囲を定めて排除すること。）
제외되다=ある範囲や対象から外されることになる（除外される）。
제외하다=ある対象や範囲から外す(除外する / 除く)。
제의=意見を出すこと。または、その意見。主に会議や公の場で案件を提示する時に使う。
제작하다=材料を用いて、新しい品物や芸術作品、映像物などを作ること。
제한되다=一定の限度を定められ、それ以上を越えられなくなる。／権利、権限、自由などが一定の範囲に狭められたり抑制されたりする。
제한하다=物の範囲、限度、大きさなどを超えないように一定の限界を定める。／ある権利や活動などを勝手にできないように防ぐ。
조끼=袖のない上着の一種。通常、シャツやTシャツの上に重ね着し、前をボタンやファスナーで留める形が多い。スーツの一部として着ることもあれば、防寒やファッションを目的として着ることもある(ベスト / チョッキ)。
조리=味付けをしたり熱を加えたりするなど、食品を食べられる状態にする過程。すなわち、料理を作る行為や技術。
조림=肉、魚、野菜などを醤油やタレに入れ、煮汁がほとんど残らないように煮詰めて作った料理。または、食材に味がよく染み込むように弱火でじっくり煮る調理法。
조언=助けになるように言葉を添えたり、気づかせたりすること。またはその言葉。（類義語：忠告、勧告）
조작=機械や装置などを目的に合わせて適切に操ること（操作）。／ある物事をでっち上げたり、事実を歪曲したりすること（捏造 / 操作）。／(心理・コンピューター) 情報を特定の意図に合わせて変更したり加工したりすること（操作）。
조절하다=バランスが取れるように正したり、状況に合わせて調整すること。／機械や装置などを目的に応じて適切な状態にすること。／生理現象や心理状態を適正なレベルに維持したりコントロールしたりすること。
조직=特定の目的を達成するために、諸要素が集まって体系的な調和と秩序をなした集団や体制（組織）。／生物の体を構成し、形と機能が似ている細胞の集まり（組織）。／布や紙などの繊維が編まれている状態（組織 / 織り）。
조화=互いによく釣り合うこと。またはそのような関係。形、色、音などが互いによく合って、一つの秩序を成すこと。矛盾や衝突がなく、適切に配合されること。
존경=他人の人格、思想、行為などを高く評価し、厳かに丁重に接すること。またはそのような心。
존댓말=相手を敬って使う言葉。主に自分より年上の人や地位が高い人、または初めて会った人に使い、「敬語」や「高い言葉（ノピムマル）」とも言う。
존재하다=実際にどこかにあったり、現れていたりする。／ある物事や現象が実在する状態にある。
존중=人や意見、物事などを高く評価し、大切にすること。／相手の価値を認め、それに見合う待遇をすること。
존중하다=人や物、意見、価値などを貴重に思い、大切に扱うこと。／他人の権利や人格を侵害せず、そのまま認めること。
졸리다=眠気が差して意識がぼんやりしたり、眠りたい状態にある。まぶたが重く感じられ、眠りたいという気持ちが強い。／眠い、眠気がある。／眠気で意識がぼんやりし、まぶたが重くなる。
졸음=眠気が差している状態や気配（眠気）。
종로=1. 大韓民国ソウル特別市鐘路区に位置する法定洞の名。 2. 世宗路交差点から東大門に至る大通りの地名。朝鮮時代に鐘楼があったことに由来する。 3. ソウル特別市の中心部に位置する自治体である「鐘路区」の略称。
종이컵=紙で作られた、使い捨てのコップ。主に飲み物を飲むのに使われる。
좌측=人の体を基準にした左側。またはその方向。／ある対象と向き合った時の左側の部分。
죄인=1. 罪を犯した人。2. 法律的に犯罪を犯し、刑罰を受けるべき人。3. (比喩的に) 道徳的、あるいは良心的に他人に大きな過ちを犯した人。
주간=月曜日から日曜日までの7日間。／特定の事を行うために定められた1週間の期間。／1週間分の計画や日程。／一週間を単位として定められた計画や日程(週間)。
주년=一年を単位として回ってくる回数を数える単位。主に特定の事件や行事があった日から毎年巡ってくるその日を記念する時に使う。
주목=関心を持って注意深く見守ること。または、その視線。／ある対象や現象に対して、多くの人の関心が集まること。
주요하다=中心となり、極めて重要である。
주의하다=心に留めて気をつける（注意する / 用心する）。／ある状態や条件に関心を集中させて見守る。
주전자=水や酒などを温めたり沸かしたりして、注いで飲むことができるように作られた器。通常、胴体に取っ手と注ぎ口がついている。(やかん / 急須 / 土瓶)
중고=すでに使用したか、古くなった品物。または新しく作ったものではなく、他人が使っていたものを再び売買する品物（中古品）。
중급=中間程度の階級やレベル（中級）。／技術、実力、学業などの段階が初級を過ぎて高級に至る前の過程。
중단하다=作業や活動を途中で止めたり、中断したりすること。
중대하다=軽んじることができないほど、非常に重要で大きい。
중세=歴史の時期区分の一つで、古代と近代の間の時期。西洋史では概ね5世紀の西ローマ帝国の滅亡から15世紀のルネサンス以前までを指し、韓国史では高麗時代を中心に捉える(中世)。／ある事柄や現象が進行する過程における中間の時期。
증가하다=数や量が以前より増えたり、多くなったりする。
증권=財産上の権利や義務を証明する書類。手形、小切手、債券、株式などがある。／資本市場において株式や債券などの有価証券を総称していう言葉。
증권사=株式、債券などの有価証券の売買や仲介を専門とする金融会社（証券会社）。
증명=ある事実や判断の真偽を明らかにして確定すること。／ある事項が真実であることを示す証拠を提示すること。／仮定から結論を導き出す論理的な過程。
증명하다=ある事項や判断が真実であるかないかを、証拠を挙げて明らかにする。／論理的根拠や法則に基づき、ある命題の真偽を明らかにする。
지경=(主に「-을/를」や「-은/는/을」の後で使われ) ある状況や結果に至った状態や程度。／(歴史的に) 土地の境界。
지급하다=お金や物品などを決まった通りに払い出す。
지능=新しい状況や環境に直면したとき、経験を基に知的能力を活用して問題を解決し、適応する精神的能力。／物事や現象を理解して学習し、論理的に推論できる知的レベル。
지대=自然的条件や社会的状況によって区分された一定の範囲の土地(地帯)。／特定の目的や用途に指定された区域(地帯 / エリア)。
지배하다=ある人や集団、組織を自分の意思に従わせて治めること（支配する / 統治する）。／ある思想、感情、雰囲気などが人の心や行動に強く作用して影響を及ぼすこと（支配する / 左右する）。／ある現象や状況が特定の原因や原則によって左右されること（支配される / 決定づけられる）。
지불=価値に対する対価として、金銭や費用を出すこと（支払い）。
지불하다=お金を払ったり、代金を支払ったりすること。
지속되다=ある状態や現象が変わらずに、長い間保たれる（持続する / 続く）。
지속적=ある状態や現象が絶え間なく長く続くこと。または、そのような性質を帯びること(持続的)。
지시하다=ある目的のために、何かをするように言いつける（指示する / 命じる）。／指や物などで何かを指し示す（指す）。／あるものを特定して知らせたり表したりする（示す）。
지옥=宗教的に罪を犯した人が死後に審判を受け、苦しみを受けるという死後の世界（地獄）。／到底耐えられないほど苦しく悲惨な状況や場所を比喩的に表す言葉。
지원하다=ある組織や団体に入ることを願い出ること(志願する / 応募する)。／物資や力を貸して助けること(支援する / サポートする)。
지적되다=欠点や不適切な点が一つ一つあらわになる。／ある対象が指し示される。
지적하다=対象を指などで指し示す。／欠点や過ち、直すべき点などを指摘する。／重要な点や事実を的確に指摘する。
지정=指し示して、はっきりと定めること（指定）。／行政機関がある対象を特別な目的のために選択して決定すること。／(コンピュータ) データの位置や処理対象を定めること。
지지=ある人や団体の主義、政策、意見などに賛成し、それを助けたり応援したりすること（支持）。／ある物体や構造物が重さや圧力に耐えて支えること（支持 / 支え）。
지퍼=服や鞄などの開いた部分を開閉できるように作られた装置。2列の金属やプラスチックの駒がかみ合うようになっており、スライダーを上げたり下げたりして使用する(ジッパー / ファスナー / チャック)。
지폐=紙に印刷して作ったお金。政府や中央銀行が発行し、法的な強制通用力を持つ。
직전=何かが起こるすぐ前。／ある場所や物のすぐ手前。
직진=曲がったり歪んだりせず、まっすぐに進むこと。主に自動車の運転や道探しの状況で使われる。／(比喩的に) 物事を迷わずすぐに進めたり、目標に向かってよどみなく突き進む態度。
진급=階級や学年などの等級が上がること（進級 / 昇進）。
진술=ある事柄や事実、自分の考えを言葉や文章で詳しく説明すること。またはその内容（陳述）。／(法律) 法廷や捜査機関で、被告人、被疑者、参考人などが犯罪事実や関連事項について述べること。
진출하다=ある方面や分野へ活動範囲を広げて進む。／高い段階やより大きな舞台へと場所を移して進む。／軍隊が前進して目的の場所へ進む。
진학=上級学校に進んで勉強すること（進学）。
질투=愛する人の心が他人に向かう時に起こる嫉妬や憎しみの感情。／他人が自分より優れていたり、先に進んだりすることに対して、嫉妬して貶めようとする心。
짐승=体に毛が生え、四足で這い回る動物を総称する言葉。主に人間や魚、虫などを除いた哺乳類を指す。／(比喩的) 性質や行動が非常に残忍で野蛮であり、人の道をわきまえない人を低めて言う言葉。
짐작하다=事情や状況などを推し量って見当をつける。／相手の心や気持ちを察して気づく。
집단적=複数が集まって一つの群れをなした状態や性格を帯びていること(集団的)。／個人よりは組織や団体の行動と意思を優先する性格を帯びていること。
집세=他人の家を借りて使う対価として払う金（家賃）。
집중되다=一箇所に集まったり、偏ったりするようになる。／精神や力が一つの事柄に注がれるようになる。
짖다=犬やイヌ科の動物が声を出す（吠える）。／（比喩的に）人が他人を非難したり、騒がしく大きな声で話す。
짜증스럽다=気に入らなかったり面倒だったりして、腹が立ったりもどかしかったりする感じがある。
짝수=2で割り切れる整数。2、4、6、8、10などのように、2つずつペアにできる数を指す（対義語：奇数）。
차림=服を着たり身なりを整えたりした状態や格好。／料理を膳（テーブル）の上に整えて並べた状態や内容。
찬성=ある提案や意見、計画などが正しいと認め、賛同すること。（反対語：反対）
참되다=考えや態度、行動に偽りがなく、真実である（真実だ / まことだ）。／実質的で価値があり、名前や名目にふさわしい（真実だ / 本物だ）。
참새=スズメ科の鳥。体長は14cmほどで、背中には茶色に黒の縞模様があり、腹は白い。韓国でよく見られる留鳥で、穀物や昆虫を食べて生きる。
참여하다=ある事や集まりに関わって共にする（参加する）。／社会的な活動や公的な問題に出て行って力を貸す（関与する）。
창조적=新しいものを初めて作り出す性質を持っていること。または、既存の枠にとらわれず独創的なアイデアや方法で何かを具現すること。
창조하다=これまでに存在しなかったものを初めて作り出すこと。／新しい価値や文化、神話などを生み出すこと。／（神学）神が宇宙万物を初めて創ること。
채=(主に後にくる「안（ない）」、「못（できない）」、「없다（ない）」などの否定語と共に使われ) ある状態や動作が一定の程度に達していないことを表す言葉。／(主に「-기도 채」の構成で使われ) ある動作がまだ終わらないうちに次の動作が起こることを表す言葉。／既にある状態のままであるか、ある状態が継続されたまま他の動作が行われることを表す言葉。主に「-したまま」の構成で使われる。／家や建物を数える単位。／布団や寝具類などを数える単位。／大きな家具（たんすなど）や楽器（コムンゴなど）を数える単位。
책방=本を専門に売ったり買ったりする店。「書店」と言い換えられることもある。／昔、家の主人や子供が本を読んだり勉強をしたりした部屋。
처지=置かれている事情や状況（境遇 / 立場）。／物事が進行している具合や状況。
척=船を数える単位（～隻）。／そうであるかのように装う態度や様子。前の言葉が意味する行動や状態を偽って飾ることを表す。
척하다=(動詞や形容詞の後で「-은/는/을 척하다」の形で使われ) 前の言葉が表す状態や動作を装ったり、事実であるかのように見せかけたりする態度を表す補助用言。
천재=生まれつき他人よりはるかに優れた才能、またはそのような才能を持つ人。／非常に優れた文学的能力を持つ詩人。
철저하다=隅々まで見渡して、少しの不足や隙もない。／ある事や思想、態度などが根底まで非常に徹底している。
철학=世界と人間の生に関する根本原理を究める学問。存在、知識、価値、理性、心、言語などの一般的で基本的な問題を研究する(哲学)。／自分なりの確固たる考えや処世の原則(哲学 / 信念)。／物事の根本原理や理念(哲学 / 理念)。
철학자=1. 哲学を専門的に研究したり、哲学に精通している人。／2. 人生や世界の根本原理を深く探求し、悟りを開いた人。
청춘=万物が青い春という意味で、十代後半から二十代にわたる人生の若い年齢、またはその時期を指す言葉。／血気が旺盛で夢に満ちた若い世代を比喩的に指す言葉。
체계적=一定の原理に従って、個々の部分がまとまりよく組織されていること。また、一定の体系を備えている様子。
초보=学問や技術などを習得する際の最初の段階（初歩）。／ある事に慣れていない状態、またはそのような段階にいる人（初心者 / ビギナー）。
초보자=ある物事や技術を初めて習ったり始めたりして、まだ慣れていない人(初心者)。
초여름=夏の始まりの頃。通常、陽暦の6月頃を指す。
초원=草が敷かれた広い野原。主に降水量が少なく、木が育たない地域に形成される（草原）。
초저녁=夕方が始まったばかりの頃。日が暮れてから夜が深まるまでの時間（宵の口 / 早晩）。
초청장=ある行事や集まりに他人を招待する内容を記した紙や文章（招待状）。
촌스럽다=態度や格好、服装などが田舎の人のように洗練されておらず、あか抜けないところがある。
총각=結婚していない成人男性を指す言葉（独身男性 / 青年）。／(古語) 結婚前の男子が髪を編んで結んだ髪型。またはその髪型をした人。／「チョンガクギムチ（大根のキムチ）」の略語。
추진하다=物体を押して前へ進ませること。／目標に向かって物事を力強く推し進めること。
출판사=本や雑誌などを編集して印刷し、発行する事業体（出版社）。
측=人や物、場所などの方向を表す言葉。あるいは、対立したり関係があったりする両方のうちの一方の部類や集団、または特定の立場にある人や団体を表す言葉(側 / 方)。
치료법=病気や怪我などを治すための方法（治療法）。
컬러=光の波長に応じて目に見える色彩や色（色 / カラー）。／白黒ではなく、さまざまな色が入っている状態（カラー）。／(比喩的に) 個性や独特の特徴、あるいは雰囲気（カラー / 特色）。
코드=コンピュータシステムで情報やデータを表すための記号体系やプログラム命令の集合。／特定の集団や社会内で通用する行動様式、礼儀、または規範。／人の間で互いに通じ合う考え、気分、または傾向。／電子機器と電源をつなぐ絶縁された電線。
코트=寒さを防ぐために洋服の上に着る外套(コート)。通常、前が開いていて袖があり、丈はお尻の下まであるのが一般的である。／テニス、バレーボール、バスケットボールなどを行うために、床に区画を描いた競技場(コート)。／テニス、バスケットボール、バレーボールなどの球技種目を行うために、床に線を引いて作られた競技場。
쾌감=気分や感じが爽快で楽しいこと。欲求が満たされた時に感じる愉快な感情。
쿵=重くて大きい物が床に落ちたり、壁などにぶつかったりする時に出る音。またはそのさま。／胸が大きく波打ったり、どきりとしたりするさま。
큰아들=複数の息子のうち、一番目に生まれた息子。「長男(맏아들)」と同じ意味で使われる。
킬로=数量を表す言葉の後に使われ、「キログラム」を略して言う言葉。（重さの単位）／数量を表す言葉の後に使われ、「キロメートル」を略して言う言葉。（長さや距離の単位）
타락=正しい道から外れて誤った道に陥ること。または道徳的、精神的にレベルが低下し、腐敗すること。／(キリスト教) 人間が罪を犯して神の恵みを失い、悲惨な状態に陥ること。／高い所から下へ落ちること。
타입=形や性質などが似たもの同士でまとめられた部類や形式。「類型」、「形式」に言い換えられる。／ある人が持っている固有の雰囲気や性格、または好みの外見や性格の対象。「型」、「スタイル」として通用する直。／印刷やコンピュータ作業における文字の形や書体。
탁월하다=性質、能力、価値などが人よりはるかに優れている。
탄생하다=人が生まれる。／物、組織、現象などが初めて生まれる（誕生する）。／（比喩的に）偉大な人物や優れた作品などが世に現れる。
탓=主に否定的な現象が発生した理由や原因。／ある事の原因が他人や外部の条件にあるとする気持ちや態度。
태아=母親のお腹の中で育っている子供。受精した時から出生するまでの状態を指す。
테스트=人の実力、能力、性格などを調べるために実施する試験や検査。／機械、装置、プログラムなどの性能や状態が正常に作動するかを確認するための実験や試運転。
텍스트=書き込まれたり、印刷されたりした文章の本文。／注釈、序文、付録などを除いた文書の中心となる内容。／[言語学] 文章より大きな単位で、一定の意味や目的を持つ文章の塊。／コンピューターで文字データのみで構成されたファイルや情報。
토=一週間の七日のうち、金曜日の次の日で日曜日の前の日。「土曜日」を略していう言葉。
토대=建築物や施設物の土台となる基礎。／ある物事や事業、思想などの土台となる基礎や礎を比喩的にいう語。
통과하다=ある地点や通路を経て通り過ぎる（通過する）。／検査、審査、試験などに合格したり、一定の基準を超えたりする。／法案や案件などが会議で可決される。／ある状態や時期を経る。
통로=人や車などが出入りしたり、通り過ぎたりする道（通路）。／ある場所へ進んだり、疎通したりするための道や手段。／気体や液体などの物質が流れたり通り過ぎたりする道。
통역=互いに通じない異なる国の言葉を間に立って翻訳して伝えること。またはその仕事(通訳)。／異なる国の言葉を翻訳して伝える人(通訳者 / 通訳人)。
통제=一定の方針や目的に従って行為を制限したり制約したりすること。／強い力や権力で国家的、社会的な活動を調節し管理すること。／心理的に自分の感情や欲望を自ら抑え、調節すること。
통합=二つ以上の組織、機構、体系などを一つに合わせること（統合）。／互いに異なる要素が有機的に結合して、一つの全体をなすこと。
퇴근하다=仕事場での一日の仕事を終えて退出したり、帰ったりする。
투명하다=物体が光をよく通し、その向こうがはっきりと見えるほど澄んでいる(透明だ)。／物事や状態に隠し事がなく、すべてが明らかで潔백で公正だ(透明だ)。／音や色などが濁っておらず、非常に澄んでいてきれいだ。
튀다=(液体や粉などが) 四方に勢いよく飛び散る。／(ボールや物体などが) 地面に当たって上や横に強く跳ね上がる。／(火花や光などが) 急にぱっと現れる。／(人が) 急に素早く逃げたり、姿をくらましたりする（俗語的な表現）。／格好や行動が平凡ではなく、とりわけ目立って見える。
튀어나오다=中から外へ急に出てくる（飛び出す）。／周囲の他のものより表面に目立って突き出る（突き出る / 出っ張る）。／（言葉や行動が）思いがけず突然飛び出す（口をつく）。
트이다=塞がっていたものが片付けられたり、開いたりして隙間ができる。／前が遮られずに広く開ける。／（運勢や機会などが）開ける。／（耳や言葉の門が）開いて、聞こえるようになったり話せるようになったりする。／思考や見識が広がる。
특이하다=普通の物とは違って格別だ、あるいは特別だ。性質や形などが独特で、目につくところがある。
특정하다=特別に定められている。または、対象をはっきりと一つに指定できる（特定する）。
틀=物を製作する際、一定の形にするために使用する道具や模型（型 / 鋳型）。／ある物事や現象の全体的な輪郭や構造（枠組み / 枠）。／思考や行動を制限したり規定したりする一定の形式や範囲（枠 / 規範）。／（比喩的に）固まってしまった習慣や形式的な体制（型 / マンネリズム）。
파괴하다=打ち壊したり、砕いたりして崩す(破壊する / 壊す)。／組織、秩序、関係などを崩したり混乱させたりする(壊す / 打つ壊す)。／生態系や環境などを損傷させ、本来の状態を失わせる(破壊する)。
파악하다=ある対象の内容や状況を確実に知る（把握する）。／物事や現象の本質や要点をつかみ取る。
판=(依存名詞) 勝負を競う物事の順序や単位を表す言葉。主に「最後の～」という形で使われ、最終的な勝負の瞬間を意味する。／(依存名詞) ある物事が起きている状況や場面を表す言葉。／ある出来事が起きている場面や状況。／博打、相撲、囲碁など、大勢が集まって勝負を争う場。／（数量を表す言葉の後ろに使われ）囲碁や将棋などを一回行う回数を数える単位。／物事が進行している状況や局面。／木、金属、プラスチックなどでできた広くて薄い破片（板）。／ある出来事が起こる場や場面、またはその局面（場 / 状況）。／勝負やゲームを区切る単位（局 / 番 / 回）。／物事が進んでいる様子や状況（形勢 / 成り行き）。／本や新聞などを印刷するために作った木版や金属版。／印刷して発行した本の順序や回数を表す単位。（例：初版、改訂版）／新聞の面を分けて呼ぶ単位。（例：社会版、経済版）／写真のフィルムや印刷物の規格を表す言葉。
판결=裁判所で裁判部の判断に従い、事件に対する最終的な決定を下すこと。または、その決定の内容。／物事の善悪や可否を判断して決めること。
판단하다=物事の道理や状況を悟って決定したり、断定を下したりする。／善悪、是非、真偽などを区別して決定を下す。／(法律) 裁判所で事件に対する法律的な結論を下す。
평가되다=物の価値や水準が定められる。／ある対象の性格や内容が判断されたり、整理・締めくくられたりする。
평가하다=物事の価値や水準などを評定して定める。／人や物の価値や能力を判断して決定する。／品物の値段を付けたり、見積もったりする。
평상시=特別なことがない普通の日(平常時 / 平時)。
표현되다=考えや感情、状態などが言葉、文章、身振り、絵などの外的な形として表れる。／ある対象が特定の姿や雰囲気で描写されたり、現れたりする。
풀어지다=結び目や紐、紐などが緩んだり切れたりして、絡まっていたものが元の状態になる(ほどける / 解ける)。／緊張、怒り、誤解などの感情や状態が和らいだり消えたりする(解ける / 和らぐ)。／液体の中に他の物質が入って混ざったり溶けたりする(溶ける / 混ざる)。／問題が解決したり、疑問が解消されたりする(解ける / 解決する)。
품목=物品の名称や種類を分けた目録（品目 / アイテム）。
피로하다=体や精神が疲れ果てて力が入らず、だるい（疲労している）。
필연적=事物の関連や事の結果が決して偶然ではなく、法則によって必ずそうなるしかないこと（必然的）。
필자=文を書いた人（筆者 / 書き手）。／(自称として使われ) 文を書いている本人を指す言葉。
하=位置の下：空間的に低い場所や下の方を指す。／等級や水準の低さ：品質、成績、身分、等級などが低い段階であることを表す。／影響や支配下：ある条件や状況、または権威や影響力が及ぶ範囲内を指す。／順序の後ろ：文章や本の内容で、後ろの部分や下巻を指す。
하드웨어=コンピュータシステムを構成する機械的・電子的な装置そのものを総称する言葉。（例：本体、モニター、キーボード、マウス、メモリなど）／情報通信機器だけでなく、ある組織やシステムにおいて目に見える物理的な施設や設備などを比喩的にいう言葉。
하룻밤=一晩。（一晩の間）／短い時間や一時的な期間を比喩的にいう言葉。
하천=川や流れを合わせて呼ぶ言葉。主に大小の流れが流れる通路とその水を総称する。
하필=他のものを除いて、なぜよりによって。（主に恨めしかったり残念だったりする時、あるいは意外な状況で使われる。）
학급=学校で教育課程と学生の発達段階に合わせて分けられた学生の集団。一般的に「クラス」とも呼ばれる。
학번=学生の身分を区別するために、入学年度に応じて各学生に割り当てられる固有の番号。また、学生が入学した年度を表す数字。同じ年に入学した学生たちの集団を指すこともある。
학비=学校に通って勉強するのにかかる費用。授業料をはじめ、入学金、期成会費（PTA会費など）などを総称する言葉。
학술=学問と技術をあわせていう語。／体系的で専門的な知識を研究する活動や、その成果物。
한겨울=冬の真っ最中。すなわち、寒さが最も厳しい時期の冬を指す言葉（真冬 / 厳冬）。
한둘=一つか二つほどの数。／(主に「-이 아니다(ではない)」と共に使われ) 少ない数、あるいは決して少なくない数。／一つか二つ程度の少ない数。または、そのような数の人や物。
한정되다=数量、範囲、期間などが一定の限度内に定められる（限定される）。／権限や責任などが一定の範囲に狭められたり縛られたりする。
항구=船が安全に出入りし、停泊できるように海辺に施設を備えた場所（港 / 港口）。／外部の世界との交流が行われる通路を比喩的にいう言葉。
해결되다=提起された問題や疑問、葛藤などが解けてうまく処理される。／わだかまっていた感情や、もつれていた事柄が解ける。
해군=海を舞台にして国家の安全を保障し、防衛する任務を遂行する軍隊。艦艇、航空機、海兵隊などで構成される。
해당되다=ある範囲や条件、基準などにぴったり当てはまるようになる。
해당하다=ある範囲や条件、形式などにぴったり合う。／ある対象が一定の資格や関係を持つ。／他の何かに匹敵する、あるいは相当する。
해물=海から取れる産物の総称。主に魚、貝、わかめなどの食べ物を指す言葉。
해석하다=文章や物事、現象の意味を指し示したり説明したりすること。／ある事柄や状況を自分の観点から理解し、判断すること。／外国語を自国の言葉に翻訳したり、その意味を説いたりすること (解釈する / 訳す)。／芸術作品などを演出家や演奏家、俳優が自身の見解に従って再構成し、表現すること。
해수욕장=海で泳いだり、砂遊びや日光浴などを楽しめるように施設を整えた場所。通常、夏場の一定期間開場して運営される。
핵=物事の中心：ある物事や現象の最も中心となる部分。／細胞核：生物学で細胞の生命活動を調節する中心器官。／原子核：物理および化学で原子の中心に位置し、陽子と中性子で構成される部分。／核兵器：核分裂や核融合反応を利用して破壊力を出す兵器の総称。
행해지다=決定された事柄や計画、法、慣習などが実際に実践されたり実行されたりする。／ある行為や現象が起きたり作られたりする。
허용되다=問題にせず聞き入れたり、受け入れられたりする（許容される / 認められる）。／法や規則などによって、ある行為が制限なく行えるようになる。
허허=中が空っぽで飾り気がなく、さっぱりと笑う様子。／呆れたり、あまりにひどくて力が抜け、虚脱したように笑う様子。／他人の過ちを寛大に包容したり、余裕を持って受け流したりする時に出す笑い声 North。
헬기=回転翼航空機の一つで、機体上部の大きな翼を回転させて発生する揚力と推進力を利用して飛行する航空機。垂直離着陸や空中停止飛行（ホバリング）が可能。「ヘリコプター」の略語。
현=今の。または現在の。（名詞の前に使われ、現在の状態や時点にあることを表す。）
현대적=時代的に今日の特徴を持っている。／古びたものとは違う、新しい感覚や洗練された感じがある。／今日の時代に合っている、またはそのようなもの(現代的)。／現在の流行や感覚にふさわしい新しい形や雰囲気を持っているもの(モダン)。
혈액=人や動物の体内の血管を巡り、酸素や栄養分を供給し、老廃物を運搬する赤色の液体。血。／(比喩的に) 組織や社会が維持され、活動するために必要な核心的な資源や力。
형사=犯罪の捜査や犯人の逮捕を担当する警察官。／刑罰に関する事件。または刑事訴訟法が適用される事件。
형성되다=ある形状や状態、または性質が作られ、備わる。／ある集団や組織、体系などが構成されて作られる。
형성하다=ある形や形象を成す。／ある性質や関係、現象などが作られ備わる。
호실=建物の中の部屋を区別するために付けられる番号の後に付け、その部屋を指す言葉（〜号室）。
혼나다=驚いたり、ひどく狼狽して、気が遠くなるほどになる。または、ひどい目に遭ったり、苦労したりする。あるいは、過ちを犯して厳しく叱られたり、罰を受けたりする。
홀로=一緒にいる人がいなく、一人で。／助けを借りずに自分の力で。
화살=弓の弦につがえて射る、先が尖っていて後ろに羽がついた棒(矢)。／ある対象や目標に向かって降り注ぐ非難、視線、攻撃などを比喩的に言う語。／時計の針や、一定の方向を指し示す印。
화학=物質の組成と性質、そして物質間の反応による構成および構造の変化を研究する自然科学の一分野（化学）。
확산되다=散らばって広く広まるようになる。（物事、現象、気配などの範囲が広がること）／液体や気体の中に含まれている粒子が、濃度の高い方から低い方へと自然に広がっていくようになる。
확인되다=間違いなくそうであるか、事実が明らかになる。／ある対象の正体や内容などがはっきりと現れる。
확정=物事や状態、決定などが確実に決まること。または、それを確実に定めること。
환경오염=人間の活動によって排出される汚染物質により、自然環境や生活環境が破壊されたり、生物の生活に害を与えたりする状態（環境汚染）。
회견=ある人物に会って、その意見を聞いたり質問したりすること（会見）。／主に公式な場で記者たちと会い、情報や意見を発表すること（記者会見）。
회관=集会や会合を行うために建てられた建物。または、特定の目的で人々が集まったり、公共の便宜のために設けられた建物。
효자=両親に真心を込めてよく仕える息子（孝行息子）。／(比喩的) ある目的に非常に有用であったり、大きな助けや利益を与えたりする物や現象のこと。
후기=ある時代や期間の最後の時期。または、その時期の段階。／文学作品や文章の後に付け加える短い記録や感想。／[経済] 会計年度や事業期間を二つに分けた時の後半部分。
흑인=肌の色が黒い人種に属する人。主にアフリカを起源とする人種的特徴を持つ人々を指す。
희곡=演劇の台本。舞台上演を目的に、人物の台詞と行動を中心に構成した文学の一形態。
힘없이=元気や意欲がなく。／勢いや威厳がなく。／無理に耐えたり支えたりする力がなく。
