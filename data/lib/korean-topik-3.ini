가까이=ある地点から距離が近いところ。／時間的に遠くない時。／関係が非常に親密な状態。／距離的に短い位置に。（空間的意味）／時間的に遠くない時に。（時間的意味）／親密な関係を維持しながら。（関係的意味）／数値や程度がある基準にほとんど達するほどに。（程度的意味）
가꾸다=野菜や木などを植えて手入れをする。／外見や身なりを綺麗に整える。／物や場所などを綺麗で美しく整える。
가난하다=暮らし向きが豊かではなく、経済的に苦しい。(貧しい / 貧乏だ)／(比喩的に) 内容や成分が不足していたり、貧약したりする。(乏しい)
가라앉다=水の上に浮いていたり、水の中に混ざっている物体が底へ沈んでいく。／空中に舞っていた埃や煙などが床に降りる（静まる）。／勢い、雰囲気、痛み、興奮などが和らいだり静まったりする。／液体やガスの中に混ざっていた物質が底に溜まって積もる。／声が低くなったり、かすれたりする。
가루=固体物質を非常に細かく砕いたり挽いたりして作った微細な物質（粉 / 粉末）。／ある物体が壊れたり摩耗したりして生じた非常に小さな粒。
가리다=遮ったり隠したりして、見えないように、あるいは通じないようにする。（視界や光などを遮断する場合）／表面に現れないように隠す。（顔や身体の一部などを隠す場合）／多くの中から一つを選び出したり、識別したりする。（人見知りをしたり、是非を判断したりする場合）／大小便を自分で調節して出す。／多くの中から一つを選び出す。／物事の道理や善悪を判断して区別する。／見知らぬ人に会うとき、恥ずかしがったり避けたりする。／食べ物を満遍なく食べずに偏食する。／大小便を自分で調節して排泄する。
가만히=体を動かさなかったり、何の言葉や行動もしたりしない状態で。／ある状況や状態を変えずに、そのままにしておく様子。／音がしないように静かに。／あることを深く考えたり、見守ったりする様子。
가스=物質の状態の一つで、一定の形や体積がなく自由に広がる気体（ガス）。／燃料として使用される可燃性気体（LPG、LNGなど）。主に自炊や暖房用に使われる。／毒性を持つ気体や自動車の排気ガスなど、有害な気体を総称する言葉。／消化の過程で腸内にたまる空気や気体（おなら）。
가치관=世界や人生の事柄や現象に対して、何に価値があり、重要で、望ましいかによって持つ観点や態度（価値観）。
각국=それぞれの国。
갈다=すでにあるものを新しいものや別のものに取り替える。／傷口に巻いた包帯や赤ちゃんのオムツなどを外し、新しいものを巻いたり当てたりする。／ある職位にいる人を別の人に入れ替える。／鋭利な道具の刃を立てるために、硬い物に当ててこする（研ぐ）。／粉にするために, 物を硬い物の間に入れてこすったり砕いたりする（挽く / すりつぶす）。／表面を滑らかにするために、荒い物でこする（磨く / 削る）。／怒りや決意を固めるために、歯や爪などを合わせてこし合わせる。
감각=身体機関を通じて物理的な刺激を感じたり認識したりすること。／物事や現象に対する繊細で鋭敏な気配や能力。／(心理) 外部の刺激によって目、鼻、耳、舌、皮膚などの感覚器官に現れる心理現象。
감동=ある現象や事柄に対して心が深く動かされ、胸が熱くなったり喜びを感じたりすること（感動）。
감싸다=ある物や対象が見えないように巻いたり覆ったりする。／手のひらなどで、ある部位を覆ったり握ったりする。／誰かの過ちや欠点をかばい、味方になって保護する。／ある雰囲気や気配が周囲を取り囲む。
감옥=罪を犯した人を閉じ込めておく場所。（刑務所の日常的な表現）。／自由がなく、非常に息苦しかったり苦痛だったりする場所や状況を比喩的にいう語。
감추다=人に見られないように隠したり覆ったりする。／事実や感情、痕跡などを他人に知られないように表に出さない。／ある現象が消えたり、跡をなくしたりする。
강물=川を流れる水(川の水)。
강의=学問や技術の原理および内容を体系的に説明して教えること。／大学や塾などで教授や講師が学生に知識を伝達する授業の一形態。
강제=権力や威力で他人の意思を抑えつけ、望まないことを無理やりさせること。／[法律] 国家権力によって法的目的を実現するために物理的な力を行使すること。
개발하다=土地や天然資源などを切り開き、有用なものにする（開発する）。／知識や才能、新製品、ソフトウェアなどを新しく作り出したり発展させたりする（開発する）。／産業や経済などを発展させる（開発する / 発展させる）。
개방=門や通路などを開けておくこと。（ある場所に自由に出入りできるようにすること。）／禁止していたことを解き、自由に出入りしたり利用したりできるようにすること。（特定の対象を一般に公開すること。）／態度や考え方がわだかまりなく、さっぱりしていること。
개선=悪い点や足りない点を改めて、より良くすること。
개성=他の人や物と区別される、その人や物ならではの固有の特性。／社会や集団の共通的な特性とは対照的な、個人の独特な性質。
개인적=国家や社会、団体に対立する個々人に関係すること。／団体や公的なものではなく、個人の性質や事情に関すること。／全体や集団ではなく、一人ひとりの個人に関するもの。／公的なものではなく、私的な性質を帯びているもの。
객관적=個人の主観的な考えや感情に偏らず、第三者の立場で事物の実体をありのままに見たり判断したりすること。／個人の主観や先入観に偏らず、第三者の立場から物事を見たり判断したりすること。／世界や対象が主観の意識や作用とは独立して存在すると考えられること。
걔=「그 아이（その子）」の短縮形。自分より年下、あるいは同い年くらいの人を低めて言ったり、親しみを込めて指したりする代名詞。
거꾸로=上下、裏表、前後の順序や方向が反対になった状態で。／物事の進行過程や順序が正常な状態とは反対に。／状況や条件などが元の状態とは反対に。
거두다=熟した穀物や実などを収穫する。／散らばっている物を一箇所に集めたり片付けたりする。／広げていた仕事や感情などを整理したり、やめたりする。／良い結果や成果を得る。／世話をしたり面倒を見たりする。
거칠다=皮膚や物体の表面が滑らかでなく、ざらざ라している。／性質や態度が優しくなく、非常に荒々しい。／仕事の処理が几帳面でなく、いい加減である。／雨風や波などが激しく、荒れ狂っている.／息遣いが穏やかでなく、荒い。
건지다=水の中に入っていたり、浮いているものを外へ引き上げる。／水に落ちた人を助ける。／危険や困難な状況から人を救済する。／かけた努力に対して利益や結果を得る。／液体の中に入っている物をつまみ出す。
건축=家や城、橋などの構造物を設計し、土、木、石、煉瓦、鉄などの材料を使って建てたり築いたりすること。または、建築物そのもの。
검다=光がない時のように色が暗くて濃い。（炭やすみの色と同じだ。）／日に焼けて肌の色が黒くなる。／（比喩的）心や行動が陰険で悪い。／雲が出て天気が非常に悪い。
검토=ある事柄や内容を詳しく調べ、分析すること。／書類や計画案などを注意深く読み、点検すること。
겁=怖がる心。またはそのような心理的状態（怖がり / 恐怖）。
게다가=ある状態や状況に加え、別の何かが付け加えられることを表す副詞。前の内容にさらに激しい内容や追加の情報が加わる時に使われる。（類義語：その上、さらに、追い打ちをかけるように）
겨우=精一杯努力して、やっとのことで。（かろうじて / 간신히）／せいぜい、たったその程度の数量や水準にすぎないことを表す言葉。／やっとのことで、ある限度に到達したことを表す言葉。
견디다=困難な状況や苦痛を耐え忍ぶ。（人や動物が肉体的、精神的な苦しみに打ち勝つ。）／物体が外部の圧力や熱などに変化なく持ちこたえる。（事物が外部の刺激や力に対抗して本来の状態を維持する。）／時間や状態が続く。（ある状態がずっと維持される。）
견해=ある物事や現象に対する自分の考えや意見。または、物事を見て判断する態度。
결론=1. 話や文章の結びの部分。2. ある決定や判断を下した最終的な状態。3. [哲学] 推論において前提から導き出された最終的な判断 (結論)。
결정되다=行動や態度、物事の性格や運命などがはっきりと決まる。／複数の意見や案の中から一つに確実に固まる。
경계=物事がある基準によって分けられる地点や線（境界）。／地域と地域が接して区別される限界。／物事や現象の間の違いや区別。
경고=ある危険や悪いことが起こり得ることをあらかじめ知らせ、注意を促すこと。／過ちや違反事項に対して、今後そうしないように注意を与えること。またはその通知。／スポーツの試合で、ルールに違反した選手に審判が与える注意。
경쟁력=ある対象が他の対象と競い合って勝つことができる力や能力。／市場で商品やサービスが他の競合相手に比べて優位に立てる実質的な力。
경제적=経済に関する、または経済の原理に従うさま（経済的）。／費用や労力が少なくて済み、利益が大きいさま（経済的・効率的）。／経済に関わること。／費用や労力を抑えて大きな効果を得られること（経済的 / 効率的）。／金の額が多かったり、経済的な能力が十分な状態。
경험하다=自分が実際にしてみたり、経験してみたりする。／ある物事や現象について、直接見たり聞いたり感じたりする。
곁=ある対象の横や近く(そば / 脇)。／(主に「곁에」の形で使われ) 心理的に近い、または世話を焼ける距離や関係。
계곡=山と山の間に深く刻まれ、水が流れる谷(渓谷)。
계산기=数字を入力して加法、減法、乗法、除法などの算術演算を自動的に行う機械装置。／複雑な数式や工学的計算を処理するために作られた電子ツール。
계산하다=数を数えたり、ある数値を算出すること（計算する）。／ある事態や結果に対して、あらかじめ予測したり考慮したりすること（計算に入れる）。／物の代金を払ったり、費用を支払ったりすること（会計する / 支払う）。
계약=関連する二当事者間で、互いに守るべき義務と権利について合意すること。または、その内容を記した文書。／法的効果を生じさせるために、二人以上の当事者が互いに反対方向の意思表示をし、その意思が合致することで成立する法律行為。
계좌=銀行などの金融機関で顧客の預金や貸付などの取引内訳を記録するために設定した個人別または団体別の勘定。預金者に付与された固有番号（口座番号）を意味することもある。
계층=社会的地位、職業、経済的水準などによって差異が生じるように分けられた集団。／似たような性質や水準を持つ物事や現象を段階的に分けたもの。
고객=商店や企業などを利用する客。または、常連客。
고급=物の品質や価値、水準などが高く、優れていること。／地位や身分、段階などが高いこと。
고려하다=物事を行う際に, 様々な状況や条件を慎重に考え、検討すること。
고민하다=心の中で苦しみ、思い悩む。ある問題に対してどうすればいいか分からず、考え込むこと。
고생=つらく苦しい経験をすること。または、その仕事や状態。／精神的、あるいは肉体的に苦しみを受けること。
고생하다=つらく苦しいことに遭い, 体や心が苦しい状態にある。／(主に「お疲れ様でした」の形で使われ) 他人の苦労を労ったり挨拶したりする時に使う言葉。
고전=長い間多くの人々に広く読まれ, 高く評価されている芸術作品。特に文学作品を指すことが多い(古典)。／昔の儀式や制度、または慣習。／[文学] 主に近代以前に書かれた文学作品を総称する言葉。
고추=ナス科の一年草、またはその実。実は長い円筒形で、初めは緑色だが熟すと赤くなる。辛味があり、調味料や香辛料として広く使われる。／(比喩的) 非常に辛辣で毒舌な人、またはそのような性格を指す言葉。
곡=音楽の形式を備えて作られた歌や演奏音楽の単位(曲 / 楽曲)。／楽曲を数える単位。／曲がっていたり、反っていたりする状態、またはそのような形。
곡식=人間が主食として食べるために栽培する農作物。米、麦、小麦、大豆、粟、きびなどを総称する言葉。
곧바로=距離や方向が曲がったり歪んだりせず、まっすぐに。／ある事が遅滞なく、直ちに。
골목=大通りから入って町の中をあちこち通じる狭い道（路地 / 横丁）。
곱다=形や色が目に美しく見える（麗しい / 美しい）。／触った感じが荒くなく柔らかい（きめ細かい / 滑らかだ）。／音が澄んでいて聞き心地が良い（美しい / 清らかだ）。／性分や気立てが善良で正しい（美しい / 優しい）。
곳곳=あちこち、至る所。またはすべての場所。「全国の至る所」、「我が国のあちこち」などのように使われ、広い範囲の中のあちらこちらを意味する。
공개=ある事実や物、内容などを一般の人々に広く表して知らせること。／制限を設けず、すべての人に開放すること。
공격=進んで敵を打ち、害を与えること(攻撃)。／スポーツの試合などで相手チームに勝つために攻勢をとること(攻撃)。／相手を非難したり批判したりすること。
공급=要求や必要に応じて品物やエネルギー、資金などを与えたり、補充したりすること。／[経済] 販売者が商品やサービスを市場に出すこと。
공기=ご飯を盛るのに使う、上が少し開いた小さな器。主に「サバル（碗）」より小さく、「テジョプ（大鉢）」より深さが浅い形を指す。／(数量の後ろに使われ) ご飯一杯の分量を数える単位。／地球を取り巻く無色・無臭・無味の気体。窒素と酸素が主成分である。／ある場所や雰囲気を包み込んでいる気配や感じ。／(慣用的) 息をすること、または呼吸すること。
공사=土木や建築などで施設を新しく作ったり、既にある施設を直したり手入れしたりすること。／機械や装置などを新しく設置したり補修したりすること。
공식=型のように決まった方式。／国家や団体、社会的な手続きにおいて正式に認められた公的な方式。／[数学/科学] 計算の法則や性質を文字や記号で表した式。
공포=特定の物事や状況に対して抱く激しい恐れや怖さ。脅威や危険を感じて心が不安でハラハラする状態。
과목=1. 教えるべき、あるいは学ぶべき知識の分野を分類した項目。／2. 試験や教育課程において評価の対象となる知識の部門(科目)。
과장=官庁や会社などの「課」で業務を指揮し管理する職位。またはその職位にある人。通常、次長の下、代理や係長の上に当たる。／事実より大げさに言い表すこと。または、その内容(誇張)。
과제=処理したり解決したりすべき問題（課題）。／学生に復習や予習のために出す問題や作業（宿題）。／社会や国家などが発展するために必ず扱うべき重要な事柄。
과학자=科学に関する専門的な知識と技術を持つ人。主に自然科学分野を研究する人を指す。
과학적=具体的な物事や現象に対して、普遍的な真理や法則を発見しようとする体系的な知識の態度や方式に基づいていること。／妥当性、客観性、正確性を備え、論理的で合理的なこと。／科学の土台の上に立っているか、科学に基づいていること。／現象や事物を分析・体系化し、客観的な原理に合致すること。
관객=運動競技、公演、映画などを観賞する人（観客）。
관련되다=二つ以上の人、物、現象などがお互いに関係を結ぶ。／ある事柄や事件に繋がったり、巻き込まれたりする（関与する）。
관련하다=二つ以上の人、物、現象などが互いに関係を結ぶ。／ある事柄や現象に影響を及ぼしたり、関連したりする。
관찰=物事や現象を注意深く、詳しく見守ること（観察）。／ある対象を客観的な態度で見て、その変化や特徴を把握する活動。
관찰하다=物事や現象を注意深く、詳しく見守ること。／ある対象を客観的な態度で注意深く把握し、その特徴や変化を見出すこと。
괜히=これといった理由や実益もなく。／どうしようもなく心が虚しかったり、寂しかったりする様子。／しなくてもいいことをしたり、既にしたことに対して後悔する気持ちがある様子。
괴롭다=体や心が安らかではなく、痛かったり苦しかったりする。／状況や物事が思い通りにいかず、もどかしかったり辛かったりする。
굉장히=(副詞) 普通の程度よりはるかに優れているさま。／(副詞) 非常に大きく立派なさま。
교류=異なる地域や団体、国などが文化、思想、物資などを互いにやり取りすること（交流）。／流れる水が互いに混じり合って流れること。／時間の経過とともに大きさと方向が周期的に変化する電流（交流）。
구경하다=興味や関心を持って、ある対象や現象を見る(見物する / 眺める)。／ある場所や場面に直接行って見る。／(否定的な意味で) 降りかかった出来事を直接経験したり、目にしたりする。
구멍=物体の表面から中まで貫通している空間、またはあけられたり掘られたりした所。／(比喩的) 困難な状況を抜け出せる弱点や逃げ道、または物事の足りない部分や欠陥。
구분=一定の基準に従って、全体をいくつかの部類に分けること。／性質や種類によって対象を分け定めること。
구석=建物、部屋、物などの内側に深く入り込んだ隅や角（隅 / 角）。／中心から遠く離れた、辺鄙な場所（片隅 / 奥まった所）。／(比喩的に) 物事の見えにくい部分や人の心の奥底（隅 / 奥底）。／(比喩的に) 他人に自慢できるような特徴や面目（点 / 部分）。
구속=考えや行動の自由を制限したり、束縛すること。／[法律] 被疑者や被告人の自由を制限し、一定の場所に拘禁すること。
구역=区切られた地域。または一定の枠の中の地域。／行政上の目的や管理の便宜のために分けられた土地の単位。
국물=汁物や鍋料理などで具を除いた液体(汁 / スープ)。／肉や野菜を煮たりゆでたりして出汁をとった液体(出汁)。／(比喩的に) ある仕事の結果として生じる付随的な利益や所得(おこぼれ)。
국어=一国の国民が共通して使用する言葉。（韓国では韓国語を指す。）／教科の一つ。自国語の文法、読解、作法などを教え、学ぶ。／自分の国の言葉。
국제화=政治、経済、文化など社会の様々な分野で国家間の交流が活発になり、世界が一つの共同体へと変化する現象。／特定の固有な体系や基準が世界的な標準に合わせて変化したり、開放されたりすること。
국회의원=国民の代表として国会を構成する一員。国民の選挙によって選出され、法律を制定し、国政を審議する権限を持つ（国会議員）。
군대=一定の組織体系を整え、国家を防御するための任務を遂行する武装集団。／(慣用的な表現) 兵役の義務を履行するために入隊して生活する場所、またはその生活自体。
군데=個々の場所や地点を数える単位。主に数量を表す言葉の後ろに置かれ、場所や部分の個数を表す。
군사=軍隊で服務する兵士。／軍隊と戦争に関する事柄。／軍隊と戦争に関する一切の事務や活動（軍事）。／軍隊に所属して軍務を遂行する人（軍士 / 兵士）。
굳어지다=柔らかかった物体が固くなる。／表情や態度、雰囲気などが和やかでなくなり、硬くなる。／考え、習慣、制度などが確固たるものとして定着したり、変わらない状態になったりする。／筋肉や体の節々が強張る。
굳이=強い意志で自分の意地を張り、あえてしなくてもいいことをしようとする態度で。／(否定語と共に使われ) かたくなに、必ずしも。
굶다=食事を抜いて、食べ物を食べない。／(比喩的に) 当然受けるべき恩恵や利益を得られずにやり過ごす。
굽히다=一方に曲げたり、屈曲させたりする。（例：膝、腰、足の指など）／自分の意志や志、気勢などを折って人に従う。
권리=ある事を行ったり、他人に対して当然に要求できる力や資格。法律によって保護される利益。または、国家や公共団体に対して特定の行為を請求できる力(権利)。
권위=他人を服従させたり信頼させたりして、自分の意思に従わせる威力。／特定の分野で社会的に認められている優れた能力や専門性、またはそのような能力を備えた人。／制度や地位などによって正当性が認められ、行使される力。
권하다=ある事をするように勧めたり、誘ったりする。／食べ物や品物などを、食べるように言ったり使ってみるようにと出したりする。／医者が患者に、状態の深刻さを考慮して病院に入って治療を受けること(入院)を提案する。
귀국하다=外国に行っていた人が自分の国に帰ってくること（帰国する）。
귀신=人が死んだ後に残るという霊魂(幽霊 / お化け)。／人に禍福をもたらすという神霊。／ある物事において優れた能力を持つ人を比喩的に表す言葉。／容姿がひどく荒々しく、恐ろしい人を比喩的に表す言葉。
귀하다=身分や地位が高い。／見た目にとても価値があり、大切だ。／手に入れるのが難しいほど、ありふれておらず珍しい。／（相手を敬って）もてなされるに値する、または大切だ。
규정=規則や法則で定めること。または、定められたもの。／内容、性格、意味などを明確に定めること。
균형=どちらか一方に偏らず、均等な状態（バランス / 均衡）。／二つ以上の物事や現象が、互いに力や量が等しく安定している状態。
그나마=十分ではなかったり気に入らなかったりするが、それだけでもあってよかった（不幸中の幸いだ）という意味を表す言葉。良くない状況がさらに悪化しなかったり、前の状況よりは少しマシな状態であることを表す時に使う言葉。
그늘=光が物体に遮られてできた暗い部分。主に日差しが遮られた場所を指す。／表に現れない暗くて不幸な境遇や環境。／他人から受ける保護や恩恵。
그다음=それのすぐ後に続く時や順序（その後 / その次）。
그다지=（主に後に否定語が来て）状態や程度が期待を満たすほど特別であったり、甚だしくはない様子。「あまり」「それほど」の意味を表す。
그램=質量の単位。1キログラムの1,000分の1に当たり、記号はgである。
그렇지=相手の言葉を肯定したり、同意したりする時に発する言葉。／忘れていたことを思い出したり、あることに気づいたりした時に発する言葉。／自分の考えが正しいことを確認したり、強調したりする時に使う言葉。
그려지다=線や色彩などを用いて、形状が平面上に現れるようになる。（「描く」の受動態）／物事の姿や現象が心の中に記憶されたり、想像されたりする。／文章や言葉などを通じて、ある対象の姿や性格が描写される。
그리=「副詞」あんなに、さほど、それほど。（状態、模様、性質などがそのような程度や状態に。）／「副詞」（否定語と共に使われ）それほど、そんなに、さほど、あんまり。／「副詞」あちらへ、そちらへ。（そこに向かって。）／そのような様子で。またはそのように。／（主に否定文で）状態や程度がそれほどまでに、さほど。／「저리로（あちらへ）」の略語。（指示代名詞としての使い方）
그림자=光が物体に遮られて平面に現れる黒い形（影）。／物体の姿が鏡や水面などに映って現れた像（影 / 投影）。／ある人や物にいつも付きまとう存在を比喩的にいう語（影）。／ある対象の影響や跡、あるいは暗く憂鬱な雰囲気を比喩的にいう語（影 / 陰影）。
그만큼=先に言及された対象や状況の数量、程度、大きさなどと同じくらいに。／状態、程度、限度などが、直前の内容や対象と同じ程度に。／（副詞的用法としても使われ）先に言及された事実や数量に相当する程度に。
그야말로=「それが本当に」、「文字通り」という意味で、ある状態や事実を強調する時に使う言葉。／強調する対象がまさに最高であったり、極致に達していることを表す。
그저=変わらず今まえ、またはありのまま。／他のことはせず、ただ（ある行為や状態だけを維持することを表す）。／特別な理由や目的もなく、ただ単に。／思ったよりずっと（程度や水準が期待を超えることを表す）。
그토록=状態、程度、性質などが非常に甚だしい様子。「あんなにまで」または「あれほど」の意味を表す副詞。
극히=この上なく、非常に。または極度に。／範囲や程度がある限界に達し、これ以上足すことができないほど。
근거=ある事柄や意見、主張などの土台となる根拠や理由。／物事の存在や現象が発生するに至った法的・理論的な背景。／(稀に) ある活動の中心となる拠点や根拠地。
근로자=勤勉に働く人。／職業の種類に関係なく、賃金を目的として事業や事業場に労働を提供する人（法律的定義）。
근무=職場で任された業務を遂行すること。または、その業務（勤務 / 仕事）。
근무하다=職場で見に付いた業務を遂行する。一定の時間、決められた場所で働く（勤務する）。
근본=物事の本質や土台となる最も基礎的な部分(根本 / 根底)。／ある出来事が生じるようになった原因や根源(根本 / ルーツ)。／人の性分や家柄、または育ってきた背景(育ち / 素生)。
근본적=物事の本質や土台となるさま。／現象の最も根源となる原因や理由に関わっているさま。／事物の本質や土台となること。または、そのような性質を帯びること。／ある現象や問題の根源となる、最も基礎的で重要なこと。
근육=人や動物の体で力を出し、動かす機能を持つ赤くて柔らかい肉の組織（筋肉）。／（比喩的に）物事を推進したり、持ちこたえたりする力や基礎。
글쓰기=考えや事実などを文章で書いて表現すること。／文学作品や記事などを作成する創作活動全般。
금년=今、過ぎ去ろうとしているこの年（今年 / 当年）。
긍정적=そうであると認めたり、賛成したりすること。／対象や現象を良い方向に認めたり、望ましく思ったりすること。／(冠用詞的用法) 物事を発展的、あるいは希望的な方向に考えて推進するさま。／そうだと考えて正しいと認めること。または、対象や現象を良い方向に認めたり、望ましく思ったりすること（肯定的）。
기구=ある目的を達成するために構成された組織や機関の内部構成体系(機構 / 組織)。／機械装置が作動する内部の構成や原理(機構 / メカニズム)。／社会や国家の政治、経済、文化などが行われる枠組みや構造(機構 / 体制)。／道具、機械、器具などを総称する言葉で、特定の仕事や目的を遂行するために作られた装置や品物。特に運動、実験、調理などの特定の分野で使用される物理的な装備。
기대=ある事が実現することを望んで待つこと。／将来、ある事が起こるだろうとあらかじめ考えて待つこと。
기대하다=あることが実現することを願って待つ。／ある対象が一定の水準に達したり、成果を上げたりすることを願う気持ちを持つ。
기록하다=主に文章や写真、映像などで、ある事実や内容を残す。／スポーツの試合などで成績や数値を結果として表す。／公的な文書や帳簿に書き留める。
기본적=物事の根本となること(基本的)。／物事の根本となること。／ある事をする上で最も基礎となること。
기사=新聞、雑誌などの定期刊行物や放送で、ある事実を大衆に知らせるために書いた文章や報告書（記事）。／技術的な方面に熟練した人(技師)。／バスやタクシーなど、輸送手段を専門的に運転する人を高めて呼ぶ言葉(運転手さん)。／国家技術資格の一つ。産業技師より高い等級である(技師)。
기억하다=以前の姿、事実、知識、経験などを頭の中に留めたり、呼び起こしたりする（覚える / 思い出す / 記憶する）。／ある事実を忘れずに心に留めておく。
기운=生物が活動するための力やエネルギー（元気 / 力 / 精）。／ある雰囲気や状態、現象などが現れ始める感じや兆し（気配 / 兆候）。／考えや感情、意志などが表に現れた状態（気勢 / 気）。／（主に「気力がない」の形で使われ）体に力がなく、だるい状態（元気がない）。
기울이다=斜めに状態を変える。（例：体や物を片方に寄せること）。／精誠や努力、注意などを一箇所に集める。／杯に入った酒や飲み物などを飲む。
기초=物事の基本となる土台。／知識や技術などを学ぶために、まず身につけるべき基本的な原理や土台。／建築物や構造物の重さを支えるために地中に作った下敷き。
기획=ある事を企てて計画すること。／(主にビジネスや芸術分野で)新しい事業、商品、作品などを作るために、その内容と実行方法を構想し設計すること。
기후=一定の地域で長期間にわたって現れる総合的かつ平均的な大気の状態（気候）。／（比喩的に）ある集団や時代の全般的な雰囲気や流れ。
긴급=至急で肝要なこと。または、猶予がないほど急ぐこと(緊急)。
깔다=床に広げて置く。（例：布団、ござなど）／物の下に敷く。／金銭や品物などを貸したり分け与えたりして、あち코치こちに散らばらせる。／声を低くしたり、態度を重々しくしたりする。／線路や電線などを設置する（敷設する）。
깔리다=床に敷かれる。（例：布団、敷布団、カーペットなど）／物や人の下に敷かれる、下敷きになる。／霧や暗闇、噂などが広く立ち込める、広まる。／ある場所に物や人があふれる、充満する。／金や借金などが回収されないまま残される。
깨지다=固い物体がぶつかったり落ちたりして破片になる。（例：ガラス、器など）／雰囲気、約束、希望などがこれ以上続かず、台無しになったり消えたりする。／記録や数値が更新される。／頭や体の一部が傷つく。
꺾다=細長くて硬い物体を折ったり曲げたりする。／花や木の枝などを折って手に取ったり摘んだりする。／体の一部を曲げたりひねったりする (回す)。／物体の方向を変える (曲がる)。／相手の勢いや意志をくじいたり、勝ったりする。／声や節回しを変化させる。
껍질=柔らかい物体の表面を包んでいる丈夫な物質（例：果物、野菜、卵など）。／（比喩的に）表面に現れた現象や、実質的な内容のない外見。
꼬리=動物の胴体の端に細長く伸びた部分（しっぽ）。／ある物事の後ろの部分や端の部分を比喩的にいう言葉（末尾 / 後尾）。／物事の形跡や跡を比喩的にいう言葉（尻尾 / 手がかり）。／他人の後ろをこっそり追いかける行為（尾行）。
꽂다=倒れないように打ち込んだり、差し込んだりする。／投げつけて逆さまに突き刺さるようにする。／視線や目線などを一箇所に固定する。／穴や隙間に何かを押し入れる。
꽉=力いっぱい押したり締めたりする様子（ぎゅっと / しっかり）。／いっぱいに詰まって隙間がない様子（ぎっしり / ぱんぱん）。／口を固く結んだり我慢したりする様子。／機会や物を逃さないよう、しっかり掴む様子。
꽤=普通よりずっと上回る程度で。（予想や期待より水準が高い、または程度が甚だしいことを表す。）／なかなかの程度で。
꾸미다=外見を整えたり、身なりを整えたりして見栄えを良くする。（例：外見、身なりなど）／ある対象や場所をきれいに飾ったり並べたりする。（例：部屋、庭など）／嘘の話をでっち上げたり、事実でないことを事実のように作り上げたりする。（例：話、口実など）／ある事を行うために計画を立てたり、謀ったりする。（例：陰謀、計画など）／書類や文書などを整えて作成する。（例：書類、帳簿など）
꾸준히=欠かさず絶えず。／態度や勢いなどが変わらず一途に。
꿈꾸다=眠っている間に夢を見る。／実現したい希望や理想を心に抱く。
끄덕이다=賛成、肯定、認めの意を表したり、相手の話を理解したという印として、首を上下に軽く動かす（うなずく）。／頭を軽く一度振ったり、続けて動かしたりする動作を意味する。
끊임없이=状態や動作が中断されず、絶え間なく続く様子（絶えず / ひっきりなしに）。
끝내=ついに。結局。（予想や期待に反して、否定的な結果が生じる時に主に使われる）／最後までずっと。または、ついに。
끼우다=隙間に何かを入れ、挟んで抜けないようにする。／穴や輪などに何かを合わせて入れる。／大勢が集まっている間に一緒に混ぜる。／（ボタンなどを）穴に入れて固定する。
나란히=複数が列を作って並んでいる様子（並んで / 一列に）。／肩や頭の高さが同じになる様子（並んで / 揃って）。／考えや行動、歩調などを共にする様子（足並みをそろえて / 並んで）。
나뭇가지=木の幹から分かれて出た枝。
날개=鳥や昆虫などの体の両側についていて、飛ぶことを可能にする器官。／飛行機や機械装置などで、空気の抵抗を利用して浮力を得たり回転したりするために平らに作られた部分。／（比喩的）自由な活動範囲や勢力、または希望に満ちた気性を象徴するもの。／服や物の両側に伸びている部分。
날리다=「飛ぶ」の使役動詞。空中を舞わせたり、風に散らしたりする(飛ばす / 散らす)。／(名前や名声などを)広く知れ渡るようにする(馳せる / 売る)。／(金や財産などを)使い果たしたり失ったりする(使い果たす / すっ飛ばす)。／機会を逃したり仕事を台無しにしたりする(ふいにする / 棒に振る)。／風によって物体が散ったり、宙に浮いて動いたりするようになる。（主に「雪片」、「ほこり」、「花粉」などと共に使われる）／名前や名声を広く知らしめる。／お金や財産などをすべて使い果たす。／飛行機や凧などを宙に浮いて動くようにする。
날아가다=空中を飛んでどこかへ行く。／(物や機会などが) 激しい風に飛ばされたり、急に消えてしまったりする。／(俗語) 非常に速く動いたり、急いで走っていったりする。
날아오다=空中を飛んで、話し手（言う人）がいる場所や基準となる場所に来る。／（比喩的に）物体や知らせ、視線などが素早く伝わったり近づいてきたりする。
낡다=物や施設などが古くなり、傷んで古びる。／考え、制度、慣習などが時代に遅れ、新しくない。
남부=ある地域や範囲の南の部分（南部）。／一国の全領域のうち、南側に位置する地方。
낯설다=前に見たり会ったりしたことがなく、顔や姿が見慣れない。／ある場所や物、状況などが目慣れなかったり、経験したことがなかったりして不慣れだ（見知らぬ）。
내내=ある期間や状態が最初から最後までずっと。
내다보다=中から外に向かって見る。／将来をあらかじめ見越したり、推測したりする。／表れた現象を通じて、本質や内情を把握する。
내려놓다=手に持っていたり、身につけていたりした物を下に置く。／職位や権利、責任などを辞めて退く。／心の中に抱いていた考え、欲心、悩みなどを捨てて、心を楽にする。
내려다보다=高い所から低い所、あるいは下の方を眺める。／高い地位や威圧的な態度で他人を見下したり、軽んじたりする。／（ある場所から）目の前や下に広がる景色に面する。
내밀다=物や体の一部を外や前へ出すようにする(突き出す / 出す)。／助けや協力、和解などを要請したり提案したりする(差し出す)。／ある事に乗り出したり、自分の意見を強く主張したりする(突きつける / 出す)。
내부=物や建物などの内側の部分(内部)。／組織や団体の内部で行われる関係や範囲。／表に現れない心理的な状態や物事の本質。
내지=数量を表す言葉の間に使われ、「いくらからいくらまで」の意味を表す副詞。／「または」の意味で、前の文句と後ろの文句のうち一つを選択することを表す副詞。
너머=高さや境界などの向こう側。または、その向こうの空間。／(主に「山」、「塀」、「峠」などと共に使われ) ある障害物や地形の背後を指す言葉。
널리=範囲が広く。／多くの人に等しく、またはたくさん。
넓히다=面積や空間の範囲をより大きくする（広げる）。／知識、経験、勢力、心の余裕などをより大きくしたり増やしたりする（広げる / 深める）。／道や間隔などをより大きく広げる（広げる）。
넘기다=時間、時期、範囲などを過ぎさせる。（特に一年を送り、翌年につなげることを意味する。）／本や紙などのページをめくる。／品物や権利、責任などを他人に渡す（譲る）。／峠や困難を乗り越える、あるいは脱する。／食べ物やつばなどを喉の奥へ送る（飲み込む）。
넘어가다=倒れたり傾いたりすること：立っていたものが片方に傾いたり、床に横になったりする。／境界や限界を越えること：ある基準線、国境、峠などを通り過ぎて向こう側へ行く。／権利や所有が移ること：土地、建物、品物などの所有権が他人に移る。／だまされること：他人の誘惑や欺瞞にのせられる。／飲み込むこと：食べ物などが喉を通って下に降りていく。／ある状態や段階に移ること：していたことを終えて次の段階に進んだり、時間が経過したりする。
넘어서다=高い地点や境界を越えて行く。／一定の時間や時期、数量、程度などが基準値を過ぎたり上回ったりする。／困難な状態や苦しい局面を乗り越える。
넘치다=液体や物質がいっぱいになり、器や境界の外へあふれ出る。／活力、感情、考えなどが非常に強い、あるいは満ちあふれている。／決められた限度や基準よりも多くなる。
녀석=(名詞の後で)「人」を低めて言ったり、親しみを込めて言ったりする言葉。主に男性に使われる。(やつ / あいつ / こいつ)／(主に冠用詞の後で) ある対象を擬人化して、可愛らしく、または親しみを持って呼ぶ言葉。
년도=事務や会計決算などの処理のために設定された一年の期間（年度）。／前の数字が表すその年。（主に数字の後に使われ、特定の年を表す。）
논리=言葉や文章において、思考や推理などが理にかなって展開される過程や原理。／物事や現象の間に存在する法則的な関連性。／[哲学] 正しい知識を得るために思考が従うべき法則と形式。
논문=ある問題について学術的に研究し、その結果や意見、主張などを体系的に記述した文章（論文）。
논의하다=ある問題について互いに意見を交わし、検討したり討論したりする。
논쟁=異なる意見を持つ人々が、自分の主張が正しいことを立てて言葉で争うこと（論争）。
놀랍다=ある物事や現象が予想をはるかに超えて、胸が躍るほど不思議だったり奇妙だったりする。／実力や成果などが普通よりはるかに優れていて、感嘆するに値する。／恐怖を感じるほど威力がすごかったり、恐ろしかったりする。
농부=農業を職業とする人。種をまき、作物を育てて収穫する仕事をする人を指す。
농사=土地を耕して農作物を植え、収穫すること(農業 / 耕作)。／(比喩的に) ある物事や現象を丹精込めて育てたり準備したりすること。
농산물=農業によって得られた生産物。穀類、野菜、果物、肉類などを総称する言葉。
농촌=主に農業を営む人々が集まって住む地域。都市と対比される地域で、農業が主な産業である村を指す。
높아지다=下から上までの長さが長くなる（高くなる）。／数値、温度、度数などが以前より大きくなったり上がったりする（高まる）。／声のトーンや音調が上がる。／名前や名声、価値などが世の中にもっと広く知られたり、立派だと思われるようになる（高まる）。／（波が）うねる波の高さが上に突き上げ、激しくなる。
놓이다=不安、緊張、心配などが消えて心が安らぐ。／ある物体が一定の場所に置かれる。（「놓다（置く）」の被動詞）／橋、道、電話などが作られたり設置されたりする。（「놓다（架ける・設置する）」の被動詞）／状況や境遇がある状態に置かれる。
놓치다=手に持っていたり、つかんでいたりしたものを誤って落とす。／つかめるはずの機会や時期を逃してしまう。／乗ろうとしていた車や船、飛行機などに間に合わず、乗れなくなる。／見たり聞いたりすべき対象に注意を払わず、見逃したり聞き逃したりする。／追っていた人や動物を捕まえられずに逃がしてしまう。
뇌=頭の中にあり、神経系の最高中枢として思考、感情、記憶、そして身体の活動と調節を司る器官(脳)。
눈길=目が向く方向。または、目に見える範囲。／他人が見つめる視線。／雪が積もった道。
눈빛=目から現れる気迫や感情の状態（目つき / 眼差し）。／目の色。または、目の光沢（目の色 / 瞳の輝き）。
눈썹=目の上の骨が出っ張った部分に並んで生えている短い毛（眉毛）。／（比喩的に）非常に近い、あるいはすぐそこに迫っている出来事を指す言葉。
눈앞=目に見えるすぐ前の空間。／ごく近い将来や未来。／(比喩的に) ある事柄や現象が直接感じられたり、繰り広げられたりする状況。
늘리다=物体の長さや広さ、体積などを元より大きくする。／数や分量、時間などを元より多くする。／勢力や力量、財産などを元より大きくしたり多くしたりする。／実力や能力などを向上させる。
다가가다=ある対象や場所に距離が近くなるように移動する（近づく / 近寄る）。／ある水準や状態にほとんど近いところまで達する（近づく / 迫る）。／（比喩的に）ある人と親しくなるために心を開いて身近に接する（歩み寄る / 親しく接する）。
다가오다=距離的に、ある対象の近くへ移動してくる。／時間的に、ある時や時期が間近に迫る。／ある状態や現象が、肌や心で感じられるほど身近になる。
다듬다=物の表面を滑らかにしたり整えたりするために、不要な部分を削ったり切り取ったりする。（例：野菜を下ごしらえする、木を整える）／文章や考えなどをより整然と、スムーズに直す。（例：原稿を推敲する、文章を整える）／身なりや身だしなみを端正に整える。（例：髪を整える、身なりを整える）／声や音色を均等に調節する。（例：声を整える）
다름없다=比較対象と比べてみた時、水準や状態がほとんど同じか、差がない。／事実上、ある状態や結果と同じであると認められる。
다방=一定の施設を備えて茶や飲料を販売し、人々が会って会話を交わしたり休んだりできるように作られた場所。今日の「カフェ」と類似した機能を持つ伝統的な形態の休憩施設。
다소=ある程度、少し。 (多少 / 少々)／分量や程度の多寡。 (多少)／分量や程度が少しあること。または、そのような程度。／ある程度。または、少々。
다수=数が多いこと。または、その多い数(多数)。／(主に「多数の」の形で使われ) 多くの人や物。
다지다=押したり叩いたりして固める（固める / 踏み固める）。／心をしっかりと引き締める（固める / 決意する）。／肉や野菜などを細かく切る（みじん切りにする / 叩く）。／関係を確実にしたり強固にしたりする（固める / 深める）。／肉、野菜、薬味などを包丁や臼で細かく刻んだりつぶしたりする。／押したり踏んだりして地面を固める。／心、考え、決心などをより強くする。／基礎、基盤、権力などをしっかりと確立する。／すでにした約束や誓いを確認し、破らないようにする。
다투다=意見や利害関係が異なり、互いに立ち向かって争う。（口論や取っ組み合いを含む）。／ある対象や座（地位）を手に入れるために競争する。／非常に急いでいたり、緊迫した状態にある。（主に「時間を争う」の形で使われる）。／理非を正したり、論争したりする。
단=技術や能力の高低の程度を表す単位。（例：囲碁、剣道、テコンドーなど）／本や新聞などで印刷面を横または縦に分けた区画。／階段やはしごなどの段を数える単位。／ある物事の段階や過程。／(数量を表す言葉の前に使われ) ただ一つだけの状態であることを表す語。／(一部の名詞の前に使われ) 「ただ」「ひたすら」の意味を表す語。／(冠形詞) 「ただその数量だけであること」を表す言葉。主に「一日」「一度」「一言」などの数量表現の前に付き、強調の意味を添える。
단순하다=構造や内容などが複雑でなく、単純だ。／考えや態度などが深くなく、純真、またはお人よしだ。／他のものが混ざらず、ただ一つだけで成り立っている。
단순히=複雑ではなく簡単に。／他の機能や目的がなく、ただそれだけで。
단위=数や量の基礎：長さ、重さ、時間、数値などを測ったり数えたりする時の基本となる基準。／組織の構成基礎：一つの組織や団体を構成する基本的な集団または個体。／貨幣の基準：お金の価値を表す計算の基本尺度。
단지=住宅、工場、施設などが集団的に入るように計画的に造られた区域（団地）。／[副詞] 他に何もなく、ただ。 「ただ（のみ）」の意味を表す言葉。／[副詞] （主に「～に過ぎない」と共に使われ）その数量や水準が非常に少ない、または低いことを表す言葉。
달려가다=ある目的地に向かって速く走っていく。
달려오다=人がいる場所に向かって急いで走ってくる。／遠くから休まずに急いで来る。／(比喩的に) ある目標や状態に向かって、ためらうことなく前進してくる。
달아나다=監視や拘束から逃れるために、身を避けて場所を移す（逃げる / 脱走する）。／ある場所や状態から急いで去ったり退いたりする（立ち去る / 退散する）。／捕まえようとする対象が遠くに消えたり、見えなくなったりする（逃げ去る）。／（比喩的に）眠気や正気、食欲などがなくなる（失せる）。
담그다=液体の中に入れる。（例：手や足を水に入れる行為）／キムチ、酒、醤（ジャン）などを作るために、材料を和えたり水を注いだりして容器に入れておく。
담기다=品物が器や箱などの中に入る。（「담다（盛る・入れる）」の被動詞）／ある内容、思想、感情などが文章、絵、言葉などに表現されたり含まれたりする。／目や心の中に、ある姿が深く刻まれる。
담당=ある事を引き受けて責任を持つこと。または、その引き受けた人（担当）。／部署や職務において、特定の業務を処理するように指定されること。
담당하다=ある事や責任を引き受ける。／一定の部署や区域などの管理および運営を受け持って処理する。
담임=クラスや部署の責任を持つこと。または、その責任を持つ人。主に学校で学級を受け持つ教師を指す言葉として使われる。
답하다=呼ぶ声や問いに答えて言葉を返したり、文を書いたりする。／相手の呼びかけや行動、またはある状況に対して一定の反応を示す。
당근=セ리科の二年草。根は太くて長く、通常は赤みがかった黄色で食用にする。ビタミンAが豊富で、料理の材料として広く使われる（ニンジン）。／（俗語）「当たり前だ」をふざけて言う言葉。
당기다=物などを自分の方や一定の方向に近づくようにする（引く / 手前に寄せる）。／決められた時間や期日を前倒しにする（早める / 繰り上げる）。／食欲がわいたり、ある事に心が引かれたりする（そそられる）。／身体の筋肉や組織がぴんと張る（つっぱる / 引きつる）。／弓や銃の発射装置などを引き寄せる（引く）。
당당하다=1. 姿や態度に自信があり、活気に満ちている。 2. 体格ががっしりしていて威厳がある。 3. 他人の目を避けないほど道理に外れたことがなく、潔い。 4. 規模や勢力が大きく立派だ。
당연하다=道理や理屈から見て、結果がそうなるのが当然だ。／ある出来事が起こることが少しも不思議ではなく、不自然でもない。
당연히=道理や理屈から見て当然に。／予想や期待通りに間違いなく。
당장=ある事が起きた、まさにその場。／ある事が起きた、まさにその時。「今すぐ」の意味で使われる。
당황하다=驚いたり慌てたりして、どうすればいいか分からなくなること。 (突然の状況や予想外の出来事により心が揺れ、収拾がつかない状態を意味する。)
닿다=物体が他の物体にくっついたり触れたりする（接触する）。／ある場所に届いたり到着したりする。／消息や連絡が伝わる。／機会や縁などが結ばれる。
대가=品物の代金として支払う金銭（代金）。／ある事をするのに費やす努力や犠牲、またはその結果として得られる価値や報酬（対価）。
대개=物事の基本的な原則や、おおよその内容。／(一般的に「大抵は」の形で使われ) 大抵の場合。または、大部分。／大体の合、物事の全体の中で、ある状態が大部分を占めていることを表す言葉（大抵 / 大体）。／内容の中心となるおおよそのあらすじ（大要 / 概略）。
대규모=形体、機構、計画などの範囲や大きさが非常に大きいこと（大規模）。
대기=時機や機会を待つこと。または、次の指示や状況に臨むために準備状態でとどまること（待機）。／地球を取り囲んでいる気体の層。空気が存在する空間を指す。／天体を取り囲んでいる気体層。
대기업=資本金や従業員数の規模が大きく、売上高が多い企業（大企業）。
대단하다=人の才能、実力、技術などが非常に優れている、あるいは立派だ。／状態、程度、数量などが並外れて大きい、あるいは激しい。／ある事柄や現象が非常に重要である、あるいは価値がある。
대단히=状態、程度、量などが非常に大きく、または激しく。「とても」、「非常に」、「ものすごく」の意味を表す。
대량=非常に多くの分量や数量(大量)。
대문=家の前や庭に入る所に作られた大きな門(大門)。／(比喩的に)ある場所に入るための関門や通り道。／新聞や雑誌などで、一番最初に掲載される重要な記事や広告。
대응=ある事件や状況に合わせて態度や行動をとること（対応）。／互いに向き合うこと。または、そのような関係。／[数学] 二つの集合の要素が一定の規則に従って対になる関係。
대중문화=一般大衆が楽しみ、享受する文化。主に複製と大量生産が可能な媒体を通じて広まり、多数の人々が共感し楽しめる性質を持つ(大衆文化)。
대체로=要点だけを言って手短に。／細かなケースをいちいち問わず、全体的に見て。（大体、一般的に）
대출=お金や物を貸すこと。または借りること。／図書館で本を借りていくこと。／銀行や金融機関で利子を取って資金を貸し出すこと。／図書館で本や資料を貸し出すこと。／金融機関が利息を取って資金を貸し出すこと（融資）。
대충=物事を丁寧に行わず、いい加減にする様子。／具体的ではなく、大まかな要点だけをかいつまむ様子。／程度や分量が標準に近くなるよう、だいたい合わせる様子/適当にする様子。
대표적=ある種類や集団の特徴を最もよく表していること。／多くの中で手本とするに足りるもの。／ある部類や範囲を特徴的に最もよく表していること（代表的）。
대형=同じ種類の物の中で、規模や大きさが格別に大きいもの(大型)。／(主に名詞の前に使われ) 集団や組織、現象などの規模が非常に大きい状態(大型 / 大規模)。
댐=川や谷をせき止めて水の流れを止めたり、水位を調節したりするために作られた土木構造物。発電、用水供給、洪水調節などの目的で建設される。
더구나=すでにある事実に加えて、それと同様、あるいはさらに程度の甚だしい事実が後に続くことを表す言葉。「そのうえ」や「さらに」に近い意味で使われる。
더불다=二人以上の人が行動を共にしたり、ある状態にある。（主に「-와/과 더불어」の形で使われる）／ある出来事や現象が、他の出来事や現象と共に起こることを表す。
더욱이=すでにある状態に加えて。「게다가(さらに、その上)」より意味が強く、前の内容にいっそうある事実を付け加える時に使う。
더위=夏の暑い気配、または暑い天気。／暑さによって体に生じる病気や症状。
더하다=ある数や量に、他の数や量を合わせる。（数量が増えたり、付け加えられたりする。）／ある性質や状態が前よりも強くなったり、深まったりする。（程度や状態が激しくなる。）／元々あったものに新しい要素や機能を追加する。（ある機能を付け加える。）／二つ以上の数や式を合わせる（足す）。／もともとあったものに何かを付け加え、量や数を増やす（加える）。／程度や状態が以前よりも大きくなったり強くなったりする（増す）。／ある雰囲気や現象に特定の性質を添えて強調する（添える）。
덕=道徳的・倫理的な理想を実現していく人格的な能力。または、その結果として表れる高潔な品性。／他人に及ぼす恩恵や助け。／（一部の名詞の後について）その対象が持つ肯定的な特性や力。
덜=ある水準や程度に達していないか、不十分な状態を表す副詞。／比較対象より数量や程度が少ないことを表す副詞。
덜다=多数や分量の一部を取り分ける。／数量や重さなどを減らす。／苦痛、困難、責任などを軽くしたり、なくしたりする。
덧붙이다=すでにあったものに新しいものを加えて合わせる。／言葉や文の最後に別の内容をさらに付け加えて言ったり書いたりする。／もともとあった壁紙や紙の上に別の紙を重ねて貼る。
덩어리=小さく固まったもの、またはそうなった物の単位。／ある物事の中心となる部分や、大規模な集合体。／（比喩的に）ある特性や性質が非常に強く固まっている人や物を指す言葉。
덮다=物の形や表面を他の物で覆ったり被せたりする。／本や器の蓋などを閉じる。／事実や過ちなどが現れないように隠したり伏せたりする.／ある状態や現象が包み込んだり、満ち溢れたりする。
데리다=目下の人や動物などを自分の近くにいさせる。（主に「데리고（連れて）」、「데려（連れて）」の形で使われ、後に「来る」、「行く」などの移動動詞を伴う。）
도구=仕事をする時や物を作る時に必要な器具。／ある目的を果たすための手段や方法。／[仏教] 仏道を修めるために必要な物。
도입=知識、技術、物資などを外部から取り入れること(導入)。／物事の緒（いとぐち）や始まりの部分(導入部)。／新しい制度、設備、方法などを取り入れて適用すること(導入)。
도저히=(主に後に否定語が来て) どうしても。到底。
도중=道を行く途中。／あることをする過程や、状態が続いている間。
독립=他人に依存したり従属したりせず、自立すること。／一国が他国の支配や干渉から脱し、完全な主権を持つこと。／経済的に他人に頼らず、自分の力で生きていくこと (経済的自立)。
독특하다=他と比べて特別に異なっている（独特だ / ユニークだ）。／特徴や性質が並外れていて、一風変わっている。
돌보다=関心を持って世話をする。（子供、患者、動物などを世話して見守る行為）／ある事柄や事務に責任を持って処理する。（家事や業務などを引き受けて管理すること）／後ろ盾となって世話をしたり助けたりする。（経済的、精神的に助けたり後援したりすること）
돌아다니다=あてもなくあちこちを動き回る（歩き回る / 徘徊する）。／一定の範囲内であちこちに立ち寄ったり、見て回ったりする（巡る / 回る）。／噂や風評、病原菌などが多くの人に広く広まる（広まる / 流布する）。
돌아보다=首を回して後ろを見たり横を見たりする(振り返る / 振り向く)。／過去に起きた出来事を振り返りながら考える(顧みる / 回想する)。／周りの状況や人々を察したり世話をしたりする(目を配る / 気遣う)。／あちこちを回りながら見学したり調べたりする(見回る / 見物する)。
돌아서다=体の向きを変えて立つ。または後ろを向く。／関係を断ったり心変わりしたりして、敵対的な態度を取る。／考えや態度、状態などが別の方向に変わる。／ある場所を回って後ろの方へ行く。
동=(冠形詞) 前に言及したものと同じであることを表す言葉。「その」、「該当する」の意味で使われる。／行政区域：市（特別市、広域市を含む）や区の管轄区域を分けた行政単位の一つ。区（ク）の下に位置する（洞）。／建物の単位：アパートや病院など、複数の棟からなる建物群で各建物を数える単位（棟）。／日が昇る方の方向。方位の一つで、北を向いた時の右側。／（主に一部の名詞の後ろに付き）行政区画の単位や建物の番号を表す語。／大きな建物やアパート、病院などで、それぞれの独立した建物を数える単位。／屋根の棟木（屋根の最も高い部分に水平に置かれた木材）を数える単位。
동기=同じ時期に同じ学校を卒業したり、同じ職場に入社したりした人。／同じ時期や同じ期間。／物事や行動を起こさせる直接的な原因やきっかけ(動機)。／[心理] 有機体の行動を引き起こし、目標に向かわせる内部的な原動力(動機)。／同時期に同じ学校や機関などに入った人(同期)。／ある事や行動を起こさせる直接的な原因やきっかけ。／[心理] 有機体の行動を引き起こす内的要因。
동료=同じ職場や同じ部門で一緒に働く人（同僚）。
동양=アジア大陸の東部と南部地域を総称する言葉。（主に韓国、中国、日本を中心とした文化圏を意味する。）／西洋に対して用いられる言葉で、東方特有の思想、文化、風習などを持つ世界。
동작=体や手足を動かすこと。または、その動き。／機械や装置などが作動して動くこと。
동포=同じ親から生まれた兄弟と姉妹。／同じ国、または同じ民族の人を親しみを持って呼ぶ言葉（同胞）。
동화=子供のために、童心を基に作られた話。または、そのような文学作品。大体において幻想的で教訓的な内容を含んでいる。／現実とはかけ離れた、美しく幻想的な雰囲気や状態を比喩的にいう言葉。
되게=とても、非常に。（状態や程度がはなはだしいことを表す副詞）／食べ物の生地などの水分が少なく、ねばっこい様子。
되찾다=失ったものを再び手に入れたり、取り戻したりする。（ある品物や権利、地位などを再び所有するようになることを意味する。）／以前の状態や姿を再び回復する。（健康、記憶、平穏などの抽象的な状態が元通りになることを意味する。）
두뇌=頭の中の器官である脳。思考、記憶、判断などの中枢的な役割を果たす部分。／物事を判断したり問題を解決したりする知的能力。または、そのような能力を持つ人。
두드러지다=表面にはっきりと目立っている。／以前よりずっと優れていたり、明確である。／表面にぱっと目立つように突き出る。／状態や性質などが他人よりはるかに優れていたり、はっきりと現れたりする。
두드리다=音がするように、ある物体を続けて叩いたり打ったりすること。／(比喩的に) 物事を成し遂げるために、扉を開けるように何度もアプローチしたり要請したりすること。／楽器や鍵盤などを叩いて音を出すこと。
두려움=ある対象や状況に対して怖がり、不安に思う心（恐怖 / 恐れ）。／これから起こることに対して念じたり心配したりする心（不安 / 懸念）。
두렵다=ある対象や状況が怖かったり、脅威に感じられたりして心が不安だ。／将来起こる結果や後患が心配で心が穏やかでない。／(敬畏の意味で) 対象をむやみに扱いがたいほど厳숙（しゅく）だったり偉大だったりする。
두르다=タオル、マフラー、スカートなどを体の一部に巻いたり掛けたりする。／周囲を塞いだり囲んだりするために、何かを張り巡らす。／液体などをまんべんなく広げる。／ある対象を中心に丸く列を作って並ぶ。
둘러보다=周りの物や状況を知るために、あちこちを見渡す。／一定の範囲を一周しながら見る。
둘러싸다=ある物の周囲を見えないように、あるいは触れられないように包んだり遮ったりする（包む / 取り囲む）。／複数の人や物が、ある対象の周りを丸く取り囲む（取り囲む / 囲む）。／ある問題や事件の中心になったり、その周囲の背景になったりする（巡る / 取り巻く）。
둥글다=円や球の形と同じだ（丸い）。／性格や態度が柔らかく円満だ（丸い / 穏やかだ）。／声が柔らかく穏やかだ。
둥지=鳥が卵を産んだり雛を育てたりするために、木の上や草むらなどに作った巣。／（比喩的に）人が住まいを構えて暮らす場所や安らぎの場（ねぐら）。／（比喩的に）ある活動や生活の拠点となる場所。
뒤늦다=時期や時がすでに過ぎている。／悟りや反応などが他人より遅かったり、適時を逃したりする。
뒤따르다=誰かや何かの後ろに続いて行ったり歩いたりする。／ある事件や現象が起きた直後に続いて現れる。／他人の例や基準をそのまま真似て行う。
뒤지다=物を探そうとあちこちをひっくり返したり、かき分けたりする（探す / 漁る）。／くまなく調査したり探し出したりする（捜索する / 洗い出す）。／中にあるものが外に出るようにひっくり返す（裏返す）。／距離や水準、順序などが他人より後ろになる（遅れる / 遅れをとる）。／時間や時期が基準より遅い。／実力や成績などが他の対象に及ばない（劣る）。
뒤집다=表と裏、上と下、前と後ろが入れ替わるようにする（ひっくり返す / 裏返す）。／順番や順序、勝負の結果などを反対に変える（覆す / 逆転させる）。／物などをくまなく探したり、掘り返したりする（ひっくり返す / かき回す）。／ある状態や体制を完全に変えてしまう（覆す / 変革する）。
드물다=ある事柄や現象が起こる回数が少ない。／物や人の数が非常に少ない、または珍しい。／間隔やあわいが広い、または遠い。
들=(名詞) 平らで広く開けた土地。田畑があり、農業を営む土地を指すこともある。／(依存名詞) 二つ以上の事物を羅列する際、それらすべてを指したり、同種のものたちが他にもあることを表す言葉。／(接辞) 名詞の後に付き、「複数」の意味を添える接尾辞。
들려오다=音や便り、噂などが外から中へ、あるいは遠い所から伝わってくる。／ある音が耳に聞こえるようになる。
들여다보다=外から中の内容や状態を見る。／近くに寄せて詳しく観察したり調査したりする。／他人の心や事情などを察する。
들이다=中へ入れさせる。（「들다（入る）」の使役動詞）／客や人を迎え入れて泊まらせたり、もてなしたりする。／品物や家具などを家の中や特定の場所に配置する。／ある事に金、時間、努力、誠意などをつぎ込む。／色や色彩が染まるようにする。
등록=記録や文書に名前を載せること（登録）。／学校や塾などに学生として名前を載せ、必要な手続き（履修登録、授業料の納付など）を済ませること。／特許、著作権、自動車などを公共機関の帳簿に正式に記載し、権利を認められること。
등장=舞台や演壇などに現れること。／ある対象や現象が世の中に初めて現れたり、新しく現れたりすること。／小説や映画などの作品の中に人物が登場すること。
따다=木や草についている実、花、葉などを手で取って切り離す(摘む / 採る)。／賭け事や試合などで勝ってお金や品物などを手に入れる(取る / 勝ち取る)。／資格、権利、名誉などを得たり取得したりする(取る / 取得する)。／瓶や缶などの蓋を開けたり穴を開けたりする(開ける / 抜く)。
따라가다=前を行く人や物の後について動く（ついていく / 追う）。／他人がするように一緒にしたり、その水準に達したりする（ついていく / 追いつく）。／ある状況や現象が他の出来事と共に起こる（伴う）。／（比喩的に）亡くなった人の後を追って死ぬ（後を追う）。
딱=動作や状態が急に止まる様子。／ある物体が他の物体にぶつかったり触れたりする時に出る音、またはその様子。／隙間や間隔が全くなく、ぴったり合ったりくっついたりしている様子。／ある数値や程度に正確に一致する様子。／態度や決心が非常に断固としていたり強硬だったりする様子。／数値や基準、形などが少しの狂いもなく正確に合う様子。／状況や立場が非常にふさわしく、適切な様子。／態度や決心が非常に断固としていたり、固かったりする様子。／物体が急にぶつかったり折れたりする音、またはその様子。
딴=「ほかの」の意味を表す冠形詞。現在扱っているものや決められたもの以外のものを指す。／「とんでもない」または「見当違いな」の意味を表す冠形詞。
때로=決まった時がなく、たまに一回ずつ。（場合によっては、ある時は。）
때리다=手のひらや拳、棒などで他人や動物の体を叩く（殴る / 打つ）。／物をぶつけて音を鳴らしたり、衝撃を与えたりする。／（比喩的に）過酷な批判をしたり、大きな打撃を与えたりする。／ある対象を激しく追い詰めたり、攻撃したりする。
떠올리다=記憶や考えなどを頭の中に思い浮かべる。／顔にある表情を浮かべる。／水の上や空中へ浮かせる。
떨다=恐怖、寒さ、病気などのために、体や体の一部が繰り返し震える。／ある感情や緊張感が非常に激しく、体が動く。／物体が速い速度で繰り返し揺れる。／(比喩的) ひどく恐れたり、萎縮した状態になる。
떨리다=寒さ、病気、恐怖、興奮などにより、体や体の一部が自然に震える。／声や楽器の音などが細かく震える。／物体がある力によって細かく揺れる。／（比喩的に）心がときめいたり、ひどく緊張したりする。
떨어뜨리다=上にあった物体を下に下げたり、地面に触れさせたりする。／持っていた物を本意ではなく失くしたり、落としたりする。／値や数値、等級などを低くする。／ある状態や関係を遠ざけたり、悪化させたりする.／病原菌に感染させたり、悪い気配を呼び込んだりする。
떼=目的や行動を共にする人や獣の多くの群れ(群れ / 集団)。／複数が一箇所に集まって成す塊(塊 / 群生)。
또다시=何度も繰り返し、また再び。（すでに行った事やあった現象が繰り返されることを強調して表す言葉。）
뚫다=塞がっている場所を通れるようにしたり、穴を開けたりする。／詰まっていたものを通じるようにする。／困難な事や難関を克服して進む。／物事の本質や将来を鋭く見抜く。
뛰어나다=実力や技術、能力などが他人よりはるかに優れている、または勝っている。／外見や景色などが普通よりはるかに良い。
뛰어넘다=塀や障害物、境界線などをひょいと越える。／ある水準や限界をはるかに脱して先に進む。／中間にある段階や過程を省略して飛ばす。／困難や苦難に打ち勝って克服する。
뛰어들다=水の中や穴など、ある場所の中へ勢いよく身を投じて入る。／ある仕事や事件に積極的に参加したり、関わりを持ったりする。／突然ある場所や範囲の中に入ってくる。
띄다=(主に「目に」と共に使われ) 目立つ、目に付く。／(目が) ぱっちり開くの短縮形。／(稀に) 間隔をあけるという意味の「띄우다」の短縮形として使われることもある。
리듬=音の長い短い、または強い弱いなどが規則的に繰り返される時の流れ。（拍子、リズム）／一定の規則に従って繰り返される動きや現象の状態。（生体リズム、生活リズムなど）
마구=激しく叩いたり、激しく追い込む様子。／決まった作法や礼儀もなく、むやみやたらに。／非常にひどく、または分別なく手当たり次第に。
마늘=ユリ科の多年草。またはその鱗茎を指す言葉。強い香りと辛味が特徴で、韓国料理において薬味の核心的な材料として広く使われる。
마디=竹、葦、草などの茎から葉が生え、目立って隆起している部分（節）。／骨と骨が接する連結部位。または指や足の指の曲がる部分（関節 / 節）。／言葉や文章、歌などで一定の分量で区切られる部分（節 / フレーズ）。／物の長さを表す際、一定の間隔で区切られた部分。
마땅하다=言動や状況などが理にかなっており、条件に合っていて適切だ。／気に召したり、満足したりする。（主に否定文で使われる）／ある待遇や処罰を受けるのが当然だ。
마련=(主に「-기 마련이다」の形で使われ) あることが起こるのが当然である、または妥当であることを表す言葉。／(主に「-은/는 마련이다」の形で使われ) 前の状況や状態がそのようになるのが一般的な理であることを表す言葉。／ある物や状況を準備して整えること。／（依存名詞として）前の内容が当然そうなる、あるいはそうでなければならないことを表す語。
마련되다=ある物や状況、計画などが準備されたり整ったりする。／お金や財産が準備され、用意される。
마루=韓屋（ハノク）や伝統家屋で、部屋と部屋の間、または部屋の前に板を敷いて作られた平らな空間。／建物の床を板張りで仕上げた場所（フローリング）。／（比喩的）ある物事の頂上や最も高い部分。
마음대로=自分の考えや願い、あるいは決定に従って。／こだわりや遠慮なく自由に。
마음속=表に現れない考えや感じ、またはそのような状態。／心の奥底や内面。
마주=互いに真っ向から向かい合って。／二つの対象が互いにぶつかったり触れ合ったりするように。
마침=ある機会や場合にちょうどよく。／折よく起こった状況があいにく（あるいは幸いにも）。
마침내=ついに、ようやく、とうとう。（待ち望んでいた事や願っていた結果が、結局実現したことを表す。）／ついに、ついに、最終的な状態に至って。
막=あることが起こる直前、あるいは直後を表す言葉（たった今 / ちょうど今）。／「今すぐ」または「たった今」の意味で使われ、行動が起こる時点が現在と非常に近いことを表す。／何を選ばずむやみに。または荒く。非常に激しく。惜しみなく、あるいは勝手に。
만남=ある人や対象に対面したり、出くわしたりすること。／二人以上の人や団体が関係を結んだり、集まりを持ったりすること。／思想、学問、芸術などの異なる要素が調和したり、触れ合ったりすること。
많아지다=(数や量か) 以前より増えた状態になる。／(年齢や経験などが) 加わったり積み重なったりする。
말기=ある期間や時代の終わりになる時期。／病状が非常に悪化し、回復が困難な最終段階。／妊娠期間中、出産が間近に迫った最終段階（妊娠末期）。
말리다=濡れた物体から水分を飛ばしてなくす（乾かす）。／ある人がしようとすることをできないように妨げたり、やめさせたりする（止める / 制止する）。／人がしていること、特に喧嘩や争いなどをやめさせる。／ある行動や事柄ができないように引き止めたり止めたりする。
말씀드리다=「言う（말하다）」の尊敬語で、目下の人が目上の人に何らかの事実や考えを伝えたり知らせたりする。
말없이=何も言わずに。／(比喩的に) ある状態や現象が表面に現れないように静かに。
망설이다=あれこれ考えるばかりで態度を決められない。物事をさっと決めたり行動に移したりできず、ためらう。
망하다=国家、企業、家庭などが勢力を失って滅びたり、状況が非常に悪くなったりする。／行っていた仕事が失敗したり、計画が狂ったりする。／（俗っぽい表現で）呪いや恨みの意を込めて言う言葉。
맞서다=互いに向かい合って立つ。／ある力や勢力に屈することなく対항したり、持ちこたえたりする。／互いの気勢や勢力が似ていて、勝敗を決めがたい状態にある。
맞이하다=来る人や対象を礼儀を尽くして受け入れる（迎える / 出迎える）。／時間の流れに従って巡ってくる時や季節、名節などを迎える。／新しい家族（妻、夫、嫁、婿など）を迎え入れる。
맡기다=物事や物を人に預けて処理させたり、保管させたりする。／ある権限や責任を他人に譲る。／体や心をある状態に完全に従わせる（身を任せる）。
매달리다=何かにしがみついてぶら下がる。（鉄棒や紐などに体を預けてくっついている状態）／ある事や人にすべての力を注いだり頼ったりする。（専念したり、切実に頼んだりすること）／何かにぶら下がっていたり、付いていたりする。
매력=人の心を引きつけ、魅료する力（魅力）。
매장=商品を販売するために設備を整えた場所(売り場 / 店。
매체=物事の中間で仲介したり、伝えたりする手段や通路(媒体)。／[マスコミ] 新聞、放送、雑誌、インターネットなどのように、情報を大衆に伝える手段（マス・メディア）。／[物理] 波動や物理的作用を、ある場所から別の場所へと伝える物質（媒質）。
맨=(冠形詞) これ以上ないほど一番であること。（主に「上」、「最後」、「最初」、「最後」など、場所や順序を表す名詞の前に使われ）一番端や一番高いところなどを意味する。
맺다=液体（の雫）や露などが物にぶら下がって生じる。／実や蕾などが結ばれる。／縁、関係、契約などを公式に結んだり形成したりする.／心の中に恨みや感情が深く残る。／物事の終わりを締めくくったり、結末を出したりする。
머릿속=想像や考え、記憶などが行われる心の状態や精神的な領域を比喩的にいう言葉。／頭の内側の部分。
머무르다=途中で止まったり、ある場所に一時的に身を置いたりする（滞在する / 留まる）。／ある状態や範囲にそのまま残ったり留まったりするようになる。／視線や考えなどがある一点に固定される。
머물다=ある場所に滞在したり、一時的にとどまったりしている。／ある状態や水準にそのまま止まる。／視線や考えなどがある対象に固定される。
먹이다=食べ物を口に入れてやったり、飲み込ませたりする。（「食べる」の使役動詞）／動物や家畜にエサや草などを与えて育てる。／（比喩的に）賄賂や金などを裏取引で渡す。／ある物質を染み込ませたり、付着させたりする。
먼지=細かく柔らかい埃。空気中に浮遊したり、物体の上に積もったりする非常に小さな粉状の物質のこと。／（比喩的に）極めて小さい、あるいは取るに足りない存在を指す言葉。
멀어지다=距離的に二つの対象の間がより開くようになる。／時間的にある時点から遠く過ぎ去るようになる。／関係や仲が以前のように近くなく、疎遠になる。／ある状態や目標から距離ができ、到達しにくくなる。
멋지다=姿や装い、行動などが、見ていて非常に立派で良い。／景色や雰囲気などが、感嘆するほど美しく素晴らしい。／考えや計画などが、非常に立派で満足できるものである。
며느리=息子の妻(嫁)。／(比喩的に) 家族の一員になった女性を親しみを込めて呼んだり、義父母の立場でその家系の同世代の女性を丁寧にもてなして呼ぶ言葉。
면하다=責任や義務などを免れる。任された仕事や守るべき道理から自由になることを意味する。／事故、災難、災いなど、望ましくない悪い状況を避けたり、免れたりする。／ある水準や状態からかろうじて抜け出す。
명령=目上の人や組織が目下の人に何かをさせること。また、その内容。／[法律] 国家機関が法令に基づき、強制的に特定の行為を行わせたり禁止したりする処分。／[コンピュータ] コンピュータが特定の作業を実行するように指示する信号やコード。
명예=世間から立派だと認められる名前や誇り、またはそのような尊厳や品位（名誉）。／ある人の人格的価値に対して社会が下す評価。／（一部の名詞の後について）正式な肩書きではないが、それに準ずる待遇を表す言葉（名誉〜）。
몇몇=それほど多くない人数の人（数人 / 若干名）。／(冠形詞としても使われ) それほど多くない数の。／(冠形詞) それほど多くない数の人や物を表す言葉（いくらかの / 数人の / 数個の）。
모=(代名詞) 名前を明らかにしようとしない人を指す言葉。主に姓の後に使われ、「金某氏」、「李某嬢」のように用いられる。／(冠形詞/代名詞) ある人や物、場所などを漠然と指す言葉。／(人の姓や名の前に使われ) その人の名を具体的に明かさずに指す言葉(某 / なにがし)。／(事象、場所、時間などを表す名詞の前に使われ) 対象を具体的に明かさず、漠然と指す言葉(ある～ / 某～)。
모니터=コンピューターやテレビ、ビデオ機器などで映像や情報を画面に表示する出力装置。／放送番組や製品の品質、サービス状態などを定期的にチェックし、批判や意見を提出する人。またはその活動。／ある状況や進行状態を監視し、確認するための画面や装置。
모델=製品を作る前の手本となる物や形。／ある対象や現象を説明するために体系的に作られた構造や方式。／芸術作品の素材となる人や物体、またはファッションショーや広告などで製品を引き立たせる仕事をする人。
모래=自然の状態で岩や石が非常に細かく砕けてできた粒（砂）。／植物が育ちにくい乾燥した砂漠の地表を構成する主な物質。
모처럼=機会がめったにない時に使われる言葉（せっかく / 久しぶりに）。／久しぶりに思い通りになったり、物事が起きたりした時に使う言葉。
목사=プロテスタントにおいて、一定の資格を持ち、教会を管理し、礼拝を導き、信者の霊的生活を指導する聖職者(牧師)。
목숨=人や動物が息をして生きている力。または、生きている状態（命 / 生命）。／ある物事の存在や機能を維持する中心的な寿命や期間を比喩的にいう語（命 / 寿命）。
몰다=ある対象を特定の方向や場所へ動かして行かせる。／ある人や事物を特定の境遇や状態に陥らせる。／車、船、飛行機などの乗り物を動かして行く（運転する）。／ある事柄や現象を一度に押し寄せたり、一箇所に集中させたりする。
몰래=他人に知られないように秘密に。または、人の目を避けてそっと。
몹시=これ以上ないほど激しく。（状態や程度が非常に甚だしいことを表す副詞）
못지않다=水準や程度がある対象に劣らない。（主に「-に劣らない」の構成で使われ、比較の対象を表す。）
무기=戦いや戦争で敵を攻撃したり、自分を防御したりするために使用する道具（刀、銃、弓など）。／ある目的を達成するために使用する有力な手段や方法。
무너지다=積み重なっていたものや建てられた建物、施設などが崩れ落ちる。／体制、秩序、希望、計画などが維持できなくなり、破壊されたり消えたりする。／体や心のバランスが崩れたり、元気がなくなったりする。／(地形や地盤が) 削られたり沈下したりする。
무늬=物体の表面に現れる模様や形状。線、色、点などが組み合わさって一定の形をなすものを指す。／ある物事や現象が持つ独特な特徴や様相を比喩的にいう言葉。
무덤=死者の体や遺骨を土に埋めた場所（墓 / 墳墓）。／(比喩的) 物事や現象が完全に終わったり消えたりした状態、または破滅に至る原因。／(比喩的) したくないことを無理やりしなければならない状況や、非常に息苦しい場所のこと。
무려=思ったよりその数や量がはるかに多いことを表す言葉。（主に数量を表す言葉の前に使われ、驚きや強調の意を表す。）
무렵=ある時期とだいたい一致する時を表す依存名詞。（主に「-을 무렵」や「-ㄹ 무렵」、または時間名詞の後に使われる。）
무리=常識や道理から外れたり、程度が過ぎること。／無理なことを強いてすること。／あることをするには条件や状況が適切ではないこと。／集まってできた一つの群れ(集団 / 群れ)。／同じ種類の物事や現象が一箇所に集まっていること。
무시하다=物事の存在意義や価値を認めない(無視する / 軽視する)。／人を馬鹿にしたり、見下したりする(見下す / 蔑む)。／ある事実や現象をないものとして放っておく(無視する / 見逃す)。
무어=知らない事実や物を指す代名詞。「무엇（何）」の縮約形。／はっきりと特定して言い難い対象や状況を、漠然と指す時に使う言葉。／相手の言葉に驚いたり疑ったりして問い返す時、または相手の褒め言葉に謙遜して答える時に使う言葉。
무역=1. 地方と地方の間で物を売り買いすること。／2. 国と国の間で物やサービスを売り買いする国際的な商取引(貿易)。
무용=音楽やリズムに合わせて体を動かし、ある感情や意味を表現する芸術（舞踊 / ダンス）。／一定の形式や体系に従って体を動かす動作。
무조건=何の条件もないこと。または、そのようなこと。／ある事柄に対して、前後を考えたり問い詰めたりしないこと。／何の条件も付かないこと。または、そのような状態(無条件)。／前後の事情を考慮せず、むやみに(無条件に / ひたすら)。
묶다=紐、紐、帯などを結び目にする（結ぶ）。／人や物が動けないように固定したり、縛り上げたりする（縛る）。／複数を一つに合わせたり、一箇所にまとめて管理したりする（まとめる）。／法規や規定などで行動を制限したり、自由を拘束したりする（縛る / 制限する）。
문득=考えや感情などが不意に浮かぶ様子。／ある行為が突然行われる様子。
문서=文字や記号などで記録し、ある事実や権利、義務などを証明したり、情報を伝えたりする媒体。／事務や業務処理のために作成された書類や記録物。／コンピューターでテキスト、画像などを含めて一つの単位として保存されたデータファイル。
문자=言葉や音を目で見えるように書き記すための記号体系。（例：ハングル、漢字、ローマ字など）／携帯電話などを通じてやり取りする電子メッセージ。
문장=考えや感情を完結した内容で表現する最小の言語単位。主語と述語を備えるのが基本である。／文章の全体、あるいは文章の節々をなす一文。／文章を書く腕前や才能。
문제점=ある物事や現象の中で問題となる部分や要素。（物事を処理したり解決したりする際に障害となる点。）
문화재=考古学、歴史学、芸術学的に価値が高く、保護すべき遺産。先祖が残した遺産の中で、歴史的・芸術的価値のある建造物、芸術品、遺跡、無形の技術などを総称する言葉。
묻히다=物が土や他の物体の中に入れられたり、積み重なったものによって覆われる。（「묻다（埋める）」の受動態）／ある出来事や現象が表れないように深く隠されたり、忘れられたりする。／ある環境や状態に深く入り込んだり、身を置いたりする。／物体に粉、液体、汚れなどが付くようにする。（「묻다（付く）」の使役動詞）／物を土や物の中に入れ、他の物質で覆い隠す。（「묻다（埋める）」の使役動詞）／ある環境や状態に深く入り込ませたり、隠したりする。
물가=物の値段。または、様々な商品やサービスの価格を平均して表した指数。／海、川、池、沼などのように、水がある場所のふち（水際 / ほとり）。
물결=水が揺れ動いて生じる水の表面現象（波）。／動く様子や音、光などがうねる現象。／社会的な現象や思想、感情などが激しく沸き起こる状態を比喩的にいう言葉。
물기=水の気配。または、しめった湿気。／植物の茎や葉、実などに含まれている汁。
물다=口に入れ、上の歯と下の歯の間に挟んだり押さえたりする。／口に何かを挟んで支える。（例：タバコをくわえる）／獣が歯で傷をつけたり危害を加えたりする。／（比喩的に）ある言葉や話題を口にする。
물속=水のなか。または、水の下の方（水中）。
물음=問うこと。または、その内容（問い / 質問）。／答えや解決を求める問題や疑問（問い / 課題）。
미디어=ある作用を一方から他方へ伝える中間媒体。／新聞、テレビ、ラジオ、インターネットなど、情報や知識を大衆に伝える手段や道具。
미루다=決められた時間を遅らせたり、移したりする（延ばす / 延期する）。／すべきことをすぐに行わず、後に回す（先送りにする）。／他人に責任や過ちなどをなすりつける（転嫁する）。／ある事実や現象を基に、他のことを推測する（推し量る）。
미소=声を立てずに穏やかに笑う笑い。唇をわずかに開けたり、口角を上げたりして喜びや満足感を表す表情。
미술=線、色彩、形態などを用いて視覚的・空間的な美を表現する芸術。絵画、彫刻、工芸、建築などを総称する。／教科の一つ。絵を描いたり、工作をしたりすることを通じて美的感覚や表現能力を養う。
미처=ある動作や事態がある水準や程度にまで達していない状態を表す言葉。（主に後ろに「～できない」、「～しない」などの否定語を伴う。）
민주주의=1. 国民が国家の主権を持ち、権力を直接行使したり、選挙を通じて選出された代表者を通じて権力を行使する政治体制。／2. 人間の尊厳、自由と平等を基本原理とし、多数の意思に従って共同体の意思を決定する生活様式や原理。
믿음=ある人や物、事実などが間違いないと信じる心。／他人の言葉を事実として受け入れる心。／宗教的な信念や信仰心。
밀리미터=メートル法による長さの単位。1ミリメートルは1メートルの1,000分の1であり、1センチメートルの10分の1に当たる。（記号：mm）
바늘=服を仕立てたり縫ったりするのに使う道具。細くて先が尖っており、後ろには糸を通す穴がある。／注射針、釣り針、時計の針などのように、先が尖っていたり、何かを指し示したりする細長い道具を総称する言葉。／(比喩的に) 非常に鋭かったり過敏な状態、または極めて小さいものを指す言葉。
바람직하다=道理にかなっており、好ましい状態にある。ある事柄や現象が当然そうあるべき状態であったり、期待される方向へ進んだりする状態を意味する。
바로잡다=曲がったり歪んだりしたものをまっすぐにしたり正しくしたりする。／誤りや間違いを直して正しくする。／混乱した状態を収拾して秩序を立てる。
바보=知能が低く愚かな人を卑하したりからかったりする言葉。／ある事柄について知識がなかったり、不慣れな人を比喩的にいう言葉。／融通が利かず生真面目で、自分の利益をうまく確保できない人。／(主に恋人や家族の間で) 相手を可愛がったり、愛情を込めて呼んだりする言葉。
바위=体積が非常に大きく、硬い石の塊（岩）。／（比喩的に）非常に硬かったり、変わらない対象を指す言葉。
바치다=神や目上の人に丁重に差し上げる(捧げる / 献上する)。／何かのために自分の大切なものを惜しみなく出したり、犠牲にしたりする(捧げる / 尽くす)。／税金や決められたお金などを国家や機関に納める(納める / 支払う)。
박다=土台となる物体に釘、杭、ネジなどを打ち込んで刺さるようにする。／ある場所や物の中に深く入れさせる、またははめ込む。／視線や心などを一箇所に集中させたり固定したりする。／写真を撮ったり、印刷物に文字を刷り出したりする。／頭や体の一部を強くぶつける。
박사=大学院の博士課程を修了し、規定の試験に合格した後、学位論文が通過した際に授与される最高学位。または、その学位を受けた人。／ある分野に精通しているか、知識が非常に豊富な人を比喩的にいう言葉。
박히다=打ち込まれたり押されたりして、ある物体の中に深く入る。（「打つ・打ち込む」の被動詞）／ある場所に固定されていたり、深くはまっていたりする。／頭の中や心の中に深く刻まれる。／ある場所に固定されて離れられない。／模様や絵などが刻まれていたり入っていたりする。
반대하다=ある意見や提案、政策などに対して賛成せず、逆らう。／ある事柄や現象が他のものと互いに対峙したり、食い違ったりする状態にある。
반발=ある状態や行動に対して逆らって起きたり、反対したりすること（反発 / 反抗）。／外部からの圧力や影響に対して屈せず、立ち向かうこと（反発）。／(物理) 二つの物体が互いに退け合う現象（反発）。
반응=刺激や作用に応じてある現象が起こること。または、その現象。／ある事件や現象に対して、一定の態度や感情を表すこと。／[化学] 物質が他の物質と相互作用して、化学的性質の異なる物質に変わること。／[物理] 原子核が外部の粒子と衝突して、別の種類の原子核に変わったりエネルギーを放出したりすること。
반장=学校の学級や団体などで、そのクラスを代表し管理する人（級長 / 学級委員）。／行政区画である「班（パン）」の長。／作業現場や特定の組織で、一組の責任を負う人（班長 / 作業主任）。
반하다=(ある対象に)心が奪われるように惹かれる。人や物の美しさ、魅力などに強く惹きつけられる。／(法律、規則、原則などに)反する、または背く。／人や物などの美しさや魅力に心が奪われる（惚れる / 見とれる）。／ある対象に心が惹かれ、夢中になる（はまる）。
발견=まだ見つけ出せなかったり、世の中に知られていなかった物事や現象、事実などを見つけ出すこと(発見)。
발견되다=まだ見つけられなかったり、世の中に知られていなかった物事や現象が、他人によって見つけられる（発見される）。
발달=身体や知能などが成長して完全な状態に達すること。／技術、経済、文化などの水準が以前より高くなったり、規模が大きくなったりすること。／気象現象や勢力などが次第に強くなること。
발생=ある事件や現象が生じること(発生)。／(生物学) 卵や受精卵が個体へと成長していく過程(発生)。
발표=ある事実や結果、作品などを世の中に表して知らせること(発表)。
밝혀지다=明らかになる。判明する。（知らなかった内容や秘密などが世間に公開されたり、確実になったりすることを意味する。）／明るくなる。（火が灯ったり光が射したりして、周囲が明るく変わる状態を意味する。）
밟다=足の裏をつけ、体重をかけて対象の上に乗る。／ある場所に足を踏み入れる、または到着する。／自動車のアクセルやブレーキなどを足で強く踏む。／ある手続きや過程を順を追って経る。／人の後ろをこっそりつける。
방문하다=人にあったり風景を眺めたりするために、ある場所を訪れる（訪問する / 訪ねる）。
방지=ある事柄や現象が起きないように防ぐこと（防止）。
밭=穀物や野菜などを植えて育てる、田以外の耕作地(畑)。／ある物事や現象が多く現れる場所を比喩的にいう言葉。／(一部の名詞の後について)そのような性質を持つ人が多く集まっている場所。
배경=背景物：物や人物の後ろで雰囲気を高めたり、対象を引き立たせたりする風景や絵。／環境および条件：ある事件や現象が起こる際の土台となる時代的・社会的な状況。／その後ろ盾：ある人や団体の後ろで後押しする力や心強い勢力。
배다=染み込んだり付着したりして、その状態が長く残る（臭い、味、習慣などが深く残る場合）。／癖や態度などが体に馴染む。／お腹の中に子供や胎児、卵などを持つ（身籠る）。／物の間隔が非常に詰まっている。
버터=牛乳の脂肪を分離して凝고시킨 유제품。主に黄色を帯び、香ばしい味と香りがあるため、パンに塗ったり料理の材料として広く使われる。
버티다=困難な状況や外部の圧力にも屈せず、最後まで我慢したり耐え抜いたりする。／主観や態度を曲げず、意固地に立ち向かう。／物体が重さや力に押しつぶされないように支える。
벌리다=二つの間の間隔を広げたり、遠ざけたりする。／殻や包まれているものを押し開けて、中が見えるようにする。／口やくちばしなどを大きく開ける。
벌어지다=(事態や事件が) ある現象や出来事が起こる。／(間隔や隙間が) 広く開いたり、あいたりするようになる。／(宴会や場が) 盛大に開かれる。／(差異が) 数値や程度の格差が大きくなる。／隙間や間隔が広くなる。／物事や現象が広く繰り広げられる。／出来事や事件が起きる。／差や隔たりが大きくなる。／口や目などが大きく開く (開かれる)。
범위=領域や限界：一定の枠や区域の中。ある力や影響が及ぶ限界。／分野：知識、活動、物事などが含まれる一定の部門やカテゴリー。
범인=罪を犯した人。または犯罪を犯したと疑われ、追跡や調査の対象になった人（犯人）。／（比喩的に）良くない結果や事態を引き起こした直接的な原因や根拠となる人や物。
범죄=法令に違反し、国家が定めた刑罰を受けるに値する過ちを犯すこと。または、そのような行為(犯罪)。／社会的な道徳や倫理に反する、極めて悪い行為。
법률=国会の議決を経て大統領が署名・公布することで成立する国家の規範。憲法の下位に位置し、国民の権利と義務に関する事項を規定する。／国家の強制力を伴う社会規範。広い意味で法令、条例、規則などを総称することもある。
법원=法に従って裁判を行い、紛争を解決して法秩序を維持する国家機関。司法権を行使する独立した機関を意味する。
법칙=すべての事象や現象の間に一貫して適用される原理や規則。／必ず守らなければならない社会的規範や制度。／数学や科学において、現象の因果関係や性質を公式化して表したもの。
벗기다=服を脱がせる：人や動物が着ている、または身につけている服、靴、装身具などを体から離れさせる。（「脱ぐ」の使役動詞）／むく、はがす：物の皮や表面を削ったり、しごいたりして取り除く。／（汚名などを）そそぐ、晴らす：着せられた罪や不名誉を取り除いてやる。
변동=状況や状態が変わり、以前とは違ったものになること。／数値、価格、気温などが上がったり下がったりして、一定せずに動くこと。
변화하다=物事の形、性質、状態などが以前とは異なって変わる（変化する）。
별다르다=普通の事柄と大きく異なっている。格別だ、あるいは特別だ。／(主に否定の言葉と共に使われ) 特に変わったところがない。
별도=元のものに含まれず、別に分かれている状態やもの。／一般的な場合とは異なり、特別に別途用意すること。
보고=ある任務に関する仕事の進行状況や結果を言葉や文章で知らせること（報告）。／国家機関や公共団体に特定の事実について書面で提出すること（届け出 / 報告）。
보고서=ある事柄に関する研究、調査、検討などの結果や進行状況を知らせるために作成した文書（報告書）。
보관하다=物を預かって大切に管理する。また、ある物や資料などを安全に一定の場所に置く。
보도=新聞、ラジオ、テレビなどの大衆媒体を通じて、新しいニュースを一般の人々に知らせること。または、その知らせ。
보람=あることをした後に得られる良い結果や満足感。または、そのことの価値。／(古語) 何かを区別したり忘れないように印を付けておくこと。または、その標的。
보장=ある事柄が支障なく行われるように条件を整えて、保証したり保護したりすること。／権利や地位などを犯したり侵害したりできないように保護し、維持すること。
보험=災害や事故による経済的損失に備え、あらかじめ一定のお金を支払い、事故が発生した際に約束された金額を受け取る制度。／（比喩的に）将来起こりうる不幸や危機的状況に備えて用意しておく安全装置。
복도=建物の中で部屋と部屋の間をつないだり、建物の各部分に通じるように作られた長い通路（廊下）。
본래=物事の根本や最初の状態。／ある出来事が起こる前の状態や下地。／（副詞的に使われ）最初から、あるいは元来。／物事や現象が最初から持っていた属性や状態。（物や状態が「最初から違う」という意味を内포する）。／あることが行われる前の元の状態や根本。
본질=物事や現象が成立するために欠かせない、最も根本的で核心的な要素。／ある物事の本来的な性質や姿。
부=(依存名詞) 各行政部署や機関、団体などで、その部門(部)の業務に責任を持って担当する人を指す言葉。主に職称の後に付けて使われる。／組織や機関で一定の業務を分担する部署の責任者（主に「部長」の略語として使われる）。／全体をいくつかの部門に分けた単位。／財産が多くて豊かなこと。または、その財産。／ゆとりがあり、豊富な状態を指す言葉。
부근=ある場所を中心としたその周辺地域。（ある場所から近いところ）
부담=ある義務や責任、税金などを引き受けること。または、その義務や責任。／心や体に加えられる重苦しい感じや圧迫感。／[経済] 費用や品物などを自分が引き受けて支払ったり責任を負ったりすること。
부대=一定の組織体系を備えた軍人たちの集団(部隊)。／ある目的のために組織された人々の群れ。
부동산=土地や建物のように、位置を動かすことのできない財産。（反対語：動産）／不動産に関する業務を専門的に扱う仲介所や事業所を指す言葉。
부딪치다=非常に強くぶつかる。または、ぶつける。／予想外の事や状況に直面する。／人や対象と意見の相違などで対立する。／(比喩的に) 手のひらを合わせたり、物同士を強く触れ合わせたりする。
부문=ある分野をその特徴や性格に従って分けた一定の範囲や区分。主に経済、学問、芸術などの領域で体系的に区分する際に用いられる（部門 / セクター / ジャンル）。
부위=全体の中で、ある特定の部分が属している領域や位置。／(医学) 体の表面や内部のある一定の部分。／(食品) 肉などの体から区分けされた各部分。
부작용=ある薬を服用した際、治療目的とは関係なく現れる望ましくない反応（副作用）。／ある事を進めるにあたって、本来意図していなかった良くない結果が現れる現象（副作用 / 弊害）。
부정적=ある対象を正しくないと考えたり、反対する態度を見せること。／状態や現象が望ましくなかったり、悪い方向に流れること。／そうだと認めなかったり、違うと言い張ること。／そうではないと断定したり、反対したりする性質を帯びること。／態度や状況が望ましくなかったり、悲観的であったりすること。
부족하다=必要な量や水準に及ばず、足りない。／ある能力や資質が標準に達していなかったり、完全ではなかったりする。
부처=仏教の開祖である釈迦牟尼(しゃかむに)を指す言葉。／仏教の真理を悟り、あらゆる煩悩から脱して永遠の自由を得た人。／慈悲深く、情け深い心を持つ人を比喩的に指す言葉。／行政組織の編成単位である「部」と「処」を総称する言葉。政府の各行政機関を意味する。
부탁하다=何かの事柄をやってほしいと頼んだり、任せたりすること。
부품=機械、器具、装置などの全体を構成する個々の組み立て単位となる品物。
북부=ある地域や地形の北の部分。または、北にある地方。
분노=憤慨してひどく怒ること。または、その怒り。
분리=互いに離れたり分かれたりすること。また、そうさせること。／混ざり合っているものを種類別に分けること。
분명=間違いなくそうであったり、事実がそうである。／姿や音などがかすんでおらず、はっきりしている。／態度や意思が曖昧でなく、確実である。
분명히=姿や音などがかすかではなく、はっきりと。／態度や意思などが曖昧ではなく、確実に。／間違いなく、きっと。
분석하다=絡み合っている化合物や混合物を、その成分や要素に従って分けること。／ある現象や事物をその構成要素に分け、その組織や性質、関係などがどのようになっているかを明確に明らかにすること。
불가능하다=ある事が起こり得ないか、不可能である。／ある事をする能力がないか、できない状態である。
불가피하다=避けられない。（ある状況や結果が決まっており, 他の選択의余地がないことを意味する。）
불러일으키다=感情、考え、反応などを頭の中に思い浮かばせたり、新たに生じさせたりする。／ある状態や行動を始めさせるきっかけを作る。／眠っている人を起こして立たせる。
불리다=水や液体に浸されて体積が大きくなる。（「붇다（ふやける）」の使役動詞）／分量や数などが元より多くなる。（「붇다（増える）」の使役動詞）／誰かによって名前や名称が呼ばれる。（「부르다（呼ぶ）」の被動詞）／歌が歌われたり、音が出されたりする。／誰かに呼ばれて、来るように要請を受ける。／（価格や数量が）付けられたり提示されたりする。
불만=満足がいかず、満ち足りないこと。または、そのような状態。／ある状況や条件に対して抱いている良くない感情。
불법=法令に背くこと。またはそのような行為。[法律] 社会秩序に違反すること。／仏教の教理や釈迦が教えた真理。または、釈迦が定めた戒律や法道。仏教そのものを指す言葉。
불빛=火が燃えながら放つ光(火影 / 火の光)。／電灯や灯火などから出る光(明かり / 灯火)。
불안하다=心が安まらず、はらはらしている。／雰囲気や状態が安定せず、危うい。
불편하다=利用するのに不自由だったり、苦痛である。／体や心が安らかでない。／ある人と接するのが気まずかったり、難しい。
불행하다=幸せではない。運が悪く、哀れな状態にある。
붓다=皮膚や器官の一部が膨れ上がる。（例：顔、目、扁桃腺など）／（俗語的に）腹を立ててふてくされる。／液体や粉末などを他の場所へ注ぎ入れる。／（払입금이나 利子などを）一定の期間ごとに分割して払う。／肉が膨らんだり、身体の一部が大きくなったりする（腫れる）。
붙잡다=手で握りしめて離さない。／去ろうとする人を引き止めたり、留まらせたりする。／逃げる人や動物を追いかけて捕まえる。／(比喩的に) 心や機会を逃さないように努める。
비교적=[副詞] 他のものと比べたとき、ある程度、またはかなり(比較的)。／他のものと比較して見た時、ある程度、またはかなり。（副詞的用法）／他のものと比較して判断する状態。（名詞的用法）／他のものと比較してみたとき、ある程度そうであるさま。または、普通の水準より少し上回るさま(比較的)。
비교하다=二つ以上の対象を比べ合わせ、互いの類似点、相違点、優劣などを調べる。／ある対象を別の対象になぞらえて表現する。
비극=人生の悲しく痛ましい出来事。または、そのような状況。／演劇の形式の一つで、主人公が不運や欠陥などによって苦難を経験したり破滅に至ったりする悲しい内容の劇。
비난=他人の過ちや欠点をとがめて、悪く言うこと。
비닐=エチレンの水素原子が一つ取れた形態であるビニル基を含む高分子化合物の総称。日常生活では、柔軟で透明な膜状の素材や、それを利用して作った袋、カバーなどを指す言葉として広く使われる。
비로소=ある状態や事柄がついに実現したり、悟りが開かれたりする時に使う言葉で、「ある時点に至ってようやく」という意味を表す。（それまではそうでなかったが、あるきっかけや時間が経った後にようやく始まることを強調する。）
비롯되다=ある現象や状態が初めて生じ始める。／ある対象が原因となり、そこから結果が生じる。
비용=あることをするのにかかるお金（費用 / 経費）。／生産や取引のために消費される経済的価値。
비우다=中に入っているものを外に出して、中を空（から）にする。／占めていた空間から場所を移したり、離れたりする。／わだかまっていた心や考えをなくしたり、捨てたりする。
비율=ある数や量に対する、別の数や量の関係。普通、百分率（パーセント）で表される。／一定の数や量に対する、別の数や量の比重。／物全体の大きさの中で、各部分が占める調和のとれた関係。
비중=他のものと比較した時に占めている重要性や価値。／[物理] ある物質の質量と、それと同体積の標準物質の質量との比。
비추다=光を放つ対象が他の物に光を送り、明るくすること。（例：月明かり、電灯、日差しなど）／光を受けた物体の形を、鏡や水面などに映し出すこと。／あるものを基準や手本にして、照らし合わせて見ること。／意中や意思をさりげなく示すこと。
비치다=太陽の光や月の光、灯りなどが現れたり、明るく照らしたりする。／物体の影や姿が透明な物体や鏡などに映って見える。／光が通り抜けて中が透けて見える。／ある心や意思が表面にさりげなく表れる。
비판=現象や事物の是非を問い、判断したり明らかにしたりすること。／物事の誤った点や否定的な側面を指摘して正そうとすること。／[哲学] 認識の根拠と限界を明確に明らかにすること。
비판하다=現象や事物の是非を見極めて判断したり、明らかにしたりする。／否定的な側面や誤った点を指摘して問題を提起する。
빌다=神や霊적인存在に、願いが叶うように切に祈る。／過ちを悟り、相手に許しを請う。／他人の物を断れないように頼み込んで手に入れる。
빛깔=物体が光を受けて現れる色の性質や状態（色合い / 色彩）。／（比喩的に）物事の状態や雰囲気、または外観。
빛나다=光が明るく照る。（例：星、宝石、瞳など）／名誉、価値、能力などが際立って現れる。／顔色や表情が明るく、生き生きと変わる。
빠져나가다=中から外へと体を動かして出る。／困難な状況や拘束、監視などから逃れる。／(金や気力などが) 外へ漏れたりなくなったりする。／難しい質問や責任から巧妙に逃れる。
빠져나오다=中や内側から外へ出ること。／困難な状況や拘束された状態から脱すること。／(主にこっそりと) 人目を避けて、そっと外へ出ること。
뺨=人の顔で、口の両脇から耳の前までの肉のある部分(頬 / ほっぺた)。／(比喩的) ある物の両側面や横の部分を指す言葉。
뻗다=枝、蔓、根などが長く伸びる。／体の一部を長く伸ばす。／道や川、山並みなどが長く続く。／勢力や気運などが遠くまで及ぶ。／(俗語) 非常に疲れたり、お酒に酔いつぶれたりする。
뼈=人や動物の体を支え、臓器を保護する硬い組織（骨）。／(比喩的に) ある事物の基礎となる核となる枠組みや筋書き（骨組み / 骨子）。／(慣用的に) 言葉の中に込められた意図や、しっかりとした気概（骨）。
뽑히다=刺さっていたり挟まっていたりしたものが外に出るようになる。（「抜く」の受動詞）／多くの中から選択されたり選抜されたりする。／中にある液体や気体、感情などが外に出るようになる。／（髪の毛や毛などが）毛根から抜け落ちる。
뿌리=植物の下部で、地中に張って養分と水分を吸収し、植物を支える部分（根）。／（比喩的）物事の根本や組織の基礎。／ある現象や性質が生じるようになった原因や土台。／苗字や家門の根源。
뿌리다=ばらまく、振りかける。液体や粉末などをあちこちに分けて散らす行為を意味する。／（雨や雪などが）降り注ぐ。主に細かく降り始めたり、少しずつ降ったりする様子をいう。／ばらまく。お金や品物などを惜しみなく広く分け与えたり、浪費したりする。／振りまく、流す。ある雰囲気や噂などを広く流布させる。
사례=ある事柄が以前に実際に行われた例。（主に「事例を挙げる」、「事例がある」などの形で使われる。）
사물=物質世界にあるすべての具体的で個別的な物や対象。／社会で起こるすべての事柄や現象。
사방=東、西、南、北の4つの方向(四方)。／周囲のあらゆる方向、またはすべての場所(四方 / 四方八方)。／縦と横の長さ。
사설=新聞や雑誌で、当該メディアの主張や意見を書いた文章。主に時事的な問題や社会的な争点を扱う（社説）。
사용되다=一定の目的や機能に合わせて使われる。（「使用する」の被動詞）／人や人力が仕事に雇用され、業務を任されるようになる。
사용자=物、施設、サービスなどを実際に使う人（ユーザー / 使用者）。／労働法上、労働者を雇用して使う事業主や経営担当者（使用者 / 雇い主）。
사원=会社や法人などの団体に属して働く人。／株式会社に資本を出資した人（株主）。／一般的な職級体系において、代理（係長級）の下の最も低い職級を指す言葉。
사회적=社会的な性格を帯びたり、社会に関係したりするもの。／社会一般に通用したり、社会を構成する集団に関連したりするもの.／社会と関係があるか、社会に属していること。／社会の構成員が共通して認識したり、経験したりしている現象や問題に関すること。
산소=化学元素の一つ。原子番号は8番で、空気成分の約21％を占める。動植物の呼吸に欠かせない透明な気体。／[化学] 酸素分子($O_2$)を総称する言葉。
살림=一家を成して暮らしていくこと。または、そのような生活に必要な品物。／国家や団体などの経済的な状況、または運営していくこと。／元気づけたり、生命力を蘇らせたりすること。
살아남다=死線を越えて生き続ける(生き残る / 生き延びる)。／競争や困難な状況の中で淘汰されずに残る(生き残る)。
살아오다=命をつなぎ、あるいは生活を維持しながら今まで過ごしてくる。／ある価値観や態度を守りながら今まで過ごしてくる。／死ぬ間際から逃れ、かろうじて命を保ってやってくる。
살인=人を殺すこと。または、その罪。
살짝=人目に付かないように素早く動いたり抜け出したりする様子。／力を入れずに軽く行動する様子。／程度がひどくない程度に、少し。／表に現れないように密かに、かつ機敏に。
살피다=あちこち詳しく探したり調査したりする。／状況や様子を注意深く把握する。／前後の事情を察して考える。／目下の人や周りの状況を世話する（見守る）。
삶다=水の中に入れて煮て火を通す。（例：麺、卵、肉など）／麻や綿などの布に石鹸を溶かし、水に入れて煮て汚れを落とす。／田畑の土を馬鍬でならしたり、こねたりして柔らかくする。／（比喩的）人をなだめたり脅したりして、自分の言うことをよく聞くようにさせる。
상담=問題を解決したり助言を得たりするために、専門家や関係のある人と話し合うこと(相談)。／ある問題について互いに協議すること。
상당하다=数量や分量、数値などがある程度に達する。／程度がかなり高いか、少なくない（実力、水準、量などが優れていることを意味する）。／ある条件や状況にふさわしい。
상당히=普通レベルよりずっと、あるいはかなり。(相当に / かなり)／数値や程度が少なくなく、かなり大きく。
상대=互いに向き合ったり、比較されたりする対象（相手 / 対戦相手）。／人や物事に立ち向かったり、相手をしたりすること。／ある事柄や状況に直面して対応すること。
상대방=何かをする際に向かい合ったり、接したりする人。または、互いに立ち向かって争ったり競争したりする対象（相手 / 相手方）。
상대적=互いに向き合ったり、比較されたりする関係にあること。／絶対的な基準ではなく、周囲の状況や他の対象との比較によって決まること。／他のものと比較されたり、関係したりすること。／絶対的な基準ではなく、周囲の状況や対象によって変わること。
상상=実際には経験していない現象や事柄を心の中に描いてみること。／過去の経験をもとにして、新しい形を作り出す精神作用。
상상력=実際には経験していない現象や物事を頭の中で描き出す能力（想像力）。
상상하다=実際には経験していないことや、目の前にない物事や現象を頭の中で描き出すこと（想像する）。
상식=人々が普通知っているか、知っておくべき一般的な知識（常識）。／社会の一員として持つべき一般的な見解や考え方。
상업=商品を売買する行為を通じて利益を得る経済活動。または、生産者と消費者の間で商品の流通を円滑にする産業分野(商業)。
상하다=(食べ物が)腐ったり、味が変わったりする。／(体や物が)傷ついたり、損傷したりする。／(気分や心が)悪くなったり、苦しくなったりする。
새끼=動物が産んだ子供(子 / 幼獣)。／(人が)自分の子供を卑下して呼んだり、他人の子供を低めて言う言葉(子供 / 息子・娘)。／ある人を卑下したり、罵ったりする時に使う言葉(野郎 / あいつ)。／大きな物に付随する小さな物を比喩的に言う言葉。
새다=夜が明ける。（夜が過ぎて朝になる。）／気体、液体、光などが隙間や穴を通じて外に漏れたり、中に入り込んだりする。／秘密、情報、噂などがひそかに外部へ知れ渡る。／お金や財産などが管理不足によって少しずつなくなる。／隊列や会話、目的地など、決められた道から外れて別の場所へ行く。
생각되다=ある物事や現象に対する意見や感じが心の中に生じる。（「思う・考える」の受身形）／ある対象が特定の状態や性質を持っていると判断されたり、見なされたりする。
생겨나다=なかったものが新しく現れたり、作られたりする。／ある出来事が発生したり、新しい状況が起きたりする。
생활하다=人や動物が一定の環境で活動しながら生きていく。／生計を立てる。／組織や団体に所属して活動する。
서부=ある地域や国の西の部分（西部）。／(歴史的・文化的) アメリカ大陸の西側地域、またはその地域を背景にした西部劇の舞台。
서서히=動作や態度が急がず、ゆったりとしているさま。／ある状態や現象が急激ではなく、少しずつゆっくりと。
석유=地中から天然に産出する、黒く粘り気のある液状の有機化合物。精製してガソリン、灯油、軽油、重油などに分けられ、燃料やガソリン、化学製品の原料として使われる。／経済的な側面における石油産業や、それに関連するエネルギー資源を総称する言葉。
섞이다=二つ以上の物質が一つに合わさる。／ある部類や隊列の間に別のものが入り込む。／様々な成分や要素が一つに調和する。／言葉や音などが一つに混ざり合い、判別しにくくなる.
선진국=経済、文化、技術などが高度に発展し、国民の生活水準が高い国（先進国）。
선택하다=多くの中から必要なものを選び出す(選択する / 選ぶ)。
설치=機械、設備、施設などを必要な場所に置いたり、架設したりすること(設置 / 据え付け)。／ある目的のために機関や機構などを新しく作ること(設置 / 創설)。
성공하다=目的としたことや志したことを成し遂げる。／社会的地位を得たり、富を築いたりする。
성명=国家、団体、個人などがある問題に対して、自身の立場や態度、見解を公式に発表すること。またはその発表内容。／人の姓と名前(氏名)。／ある事件や現象について、自分の立場や見解を公式に発表すること。また、その内容(声明)。
성질=人が本来持っている心のあり方や品性（性質 / 性格）。／怒る心の状態や気配（かんしゃく / 腹立ち）。／物事が本来持っている固有の特性や素地（性質 / 特性）。
세계적=世界全般にわたるか、世界的に広く知られていること。また、そのようなもの。／世界のすべての国に広く該当したり、影響を及ぼしたりすること。／実力や水準が世界的に認められるほど優れていること。
세금=国や地方自治体が公共目的に必要な資金を調達するため、国民や住民から強制的に徴収する金銭（税金）。
세대=子供から高齢者に至るまで、年齢層が近い人々の集まり（世代）。／親が子を産んで代を継ぐまでの約30年間の期間。／一つの家で共に暮らし、生計を共にする世帯単位。／技術や文明の発達段階において、特定の特徴を共有する段階。／同じ時代に生き、共通の意識を持つ似たような年齢層の人々。／親が子を産み、家系を継承する約30年ほどの期間。／一つの家で共に暮らす家族の単位。／生物の世代交代や技術発展の段階を表す単位。
세워지다=建物や施設などが造られたり、設置されたりする（「建てる・立てる」の受身形）。／秩序、法道、計画、功績などが確立されたり、整えられたりする。／鈍くなった刃先や先端が鋭く研がれる。／倒れていたり横になっていたものが、まっすぐに起こされる。
소개되다=知らない人同士がお互いに知り合えるように、名前や経력などが知らされる。／よく知られていない物事や現象、内容などが大衆に知らされる。
소나무=マツ科に属する常緑針葉高木。葉は2本ずつ束になって生え、針のような形で、花は5月に咲く。韓国を象徴する代表的な木で、山や野原に茂っている。
소득=労働や賃貸、事業などを通じて得る収入。／あることの結果として得られた利益や成果。
소리치다=喉を張り上げて大きな声を出す（叫ぶ / 怒鳴る）。／相手に強く主張したり抗議したりするために大声で話す。
소문=人々のアいだで口から口へと伝わる噂や話。／ある事柄について世間に広く知れ渡っている評判やニュース。
소비=お金、品物、時間、努力などを使い果たすこと（消費）。／人間の欲求を満たすために財貨やサービスを使用すること（消費）。
소스=西洋料理で味や色を出すために、料理の上にかけたり添えたりする液体または半固体状態の調味料。／ある情報や噂の出所、または根拠（比喩的表現）。／コンピュータープログラムの内容を記録した設計図やソースコード。
소유=持っていること。または、そのもの（所有）。／[法律] 対象物を全面的に支配して、使用・収益・処分できる権利（所有権）。
소음=不快で騒々しく、聞き苦しい音。機械や器具の作動、人の活動などによって発生する望ましくない音（騒音）。
소재=芸術作品を作る上での土台となる材料（素材）。／ある物を作る上での土台となる材料。
속담=古くから民間に伝わってきた、先祖たちの知恵や教訓、批判などを込めた短い言葉。普通、比喩的な表現を用いて人生の道理を悟らせてくれる（ことわざ）。
속하다=ある範囲や組織の一員になる。／ある部類や種類に入っている。／あるものの所有や支配下にある。
손자=息子の息子。または娘の息子を含めて呼ぶ言葉。行列（世代）が子の次の世代に当たる人（孫）。
손해=物質的、あるいは精神的に損をしたり失ったりすること。または、その失った内容（損害 / 損失）。／害を被ること。または、その害（害 / 損）。
솔직하다=偽りや飾りがなく、正しくて真っ直ぐだ。／自分の考えや感情を隠さず、ありのままに表している状態にある。
솔직히=偽りや飾りがなく、正しく、まっすぐに。
솜씨=手際よく物を作ったり、仕事を処理したりする際に見せる手腕や能力。／文章や絵、演技などの芸術的な技量を表す時に使う言葉。
솟다=液体や気体などが下から上へ勢いよく出ること（湧き出る / 噴き出す）。／物体が下から上へ突き出たり、高くそびえ立つこと（そびえる / 突き出る）。／力や感情、考えなどが激しく沸き起こること（湧く / 湧き上がる）。／（物価や数値などが）急激に大きく上がること（跳ね上がる / 急騰する）。
수단=ある目的を達成するための方法や道具。／物事を処理していく手際や計略。
수도=一国の中央政府があり、政治・行政・経済・文化の中心となる都市（首都）。／管を通じて飲料水や生活用水を供給する施設。（主に「水道を引く」のように施設設置の意味で使われる）。／一国の中央政府があり、政治・行政の中心となる都市。／道を修めること。宗教的な修行を通じて精神を鍛錬すること。
수도권=一国の首都を中心に、その周辺の主要都市を含めた近隣地域（首都圏）。／大韓民国では、ソウル特別市、仁川広域市、京畿道を総称する圏域を指す。
수많다=数が非常に多い。（多くの人や物を表す時に使われる。）
수상=議院内閣制の国において内閣の首長となる行政の首班。国政を統括し、閣僚を任命したり解임したりする権限を持つ。
수십=十의数倍になる数。（十の2倍、3倍などのように、十単位で増えていく漠然とした大きな数を表す）。／数の単位である「十」の数倍になる数の。（「十」のおよそ数倍になるという意を表す冠形詞）
수요=ある品物やサービスを買い求めたり、手に入れようとしたりする欲求。／[経済] 経済主体が商品やサービスを購入しようとする欲求、およびその具体的な量。
수입=個人が労働の対価として得たり、企業や国家が事業または財産などを通じて得る金銭的な利益。（例：給料、売上高など）／他国から物品、技術、文化などを国内に買い入れたり、持ち込んだりすること（輸入）。／外部から新しい思想、知識、風習などを受け入れること。
수출=国内の商品や技術、サービスなどを外国へ売って送り出すこと(輸出)。／(比喩的に) 文化、思想、制度などを他国に伝播したり影響を及ぼしたりすること。
수표=発行人が銀行などの金融機関に対して、持参人に一定の金額を支払うことを委託する有価証券。現金の代わりに使用される決済手段。
수화기=電話機で相手の声を聞く部分。（主に送話器とセットになっている。）／電話をかける際に耳に当てる装置。
숙이다=頭や体の上部を前や下に曲げる（うつむく / かがめる）。／考えや態度が謙虚になったり、勢いが挫けたりする。／声を低くする（潜める）。
순수하다=心や考えに私欲や偽りがなく、清らかだ。／他のものが混ざっておらず、それ自体で完全だ。／学問や芸術などが実用的な目的よりは、その本質的な理論や原理を追究する状態にある。
숨기다=ある物を他人に見えない場所に置いたり、見つけられないようにする（隠す）。／事実や感情、正体などを他人に知られないよう、表に出さない（隠す / 秘める）。
숨다=他人の目に触れないように身を隠したり、ある場所に姿をくらましたりする。／ある事実や現象、事物が表面に現れず、内部に沈んだり遮られたりする。／世間を避けて静かに暮らす。
숨지다=息が絶えて死ぬ。（主に事故や疾病などで死亡した際、遠回しに表現する言葉）。
스님=仏教の修行者で、修行と教化に専念する男女の僧侶を敬って呼ぶ言葉。（主に「お坊様をお迎えする」のように、尊敬の意味を込めて使われる。）
스치다=物体がある物体の傍らに軽く触れながら通り過ぎる。／風やにおい、光などがごく短い間現れたり感じられたりする。／考えや微笑み、表情などが一瞬だけ浮かんで消える。
스타일=人の姿や形、または身なりの着こなし（スタイル / 着こなし）。／仕事の処理や言葉遣い、行動などに現れるその人ならではの独特な方式や特徴。／髪の毛を整えて作り出す形（ヘアスタイル）。
승리=戦争や競技、試合などで相手に勝つこと。／困難や障害を克服して目標を達成すること。
승용차=主に人を乗せて移動する目的で作られた自動車。バスや貨物車とは異なり、少人数の人が搭乗し、個人用または家庭用として広く使われる。
시각=物事を観察したり把握したりする基本的な姿勢や観点（視각 / 視点）。／[物理] 光学機器や目で物体の両端を見たとき、その両端から目に至る二つの直線がなす角度（視角）。／時間の流れにおける、ある一点（時刻）。／[物理] 時間の流れの中のある瞬間。
시도하다=あることを成し遂げるために計画したり, 実際にやってみること（試みる / 試図する）。
시리즈=連続物。同じタイトルの下で内容や素材を変え、連続して続く本、映画、放送番組、商品などの集まり。／一定の順序に従って並べられた一連の出来事や物。
시스템=必要な機能を遂行するために、関連する要素が有機的に結合された集合体（体系、組織）。／コンピュータのハードウェアとソフトウェアが結合して情報を処理する運用方式。
시점=時間の流れの中のある一瞬。／ある物事が始まったり終わったりする時、またはある事件が起こる時。
시중=都市の中の通り。または一般の市場。／（主に経済分野で）官庁や銀行の外の一般社会。
시청자=ラジオやテレビの放送を見たり聞いたりする人（視聴者）。
식량=人が生きていくために食べるのに必要な食べ物。特に米や麦のように主食となる農産物を指す。／軍隊や遠征隊などが活動を継続するために備えておく食べ物。
식물=生命体の一つで、光合成を通じて自ら栄養分を作り、動くことができず一箇所に根を下ろして生きる生物。木、草、苔などを総称する言葉。
식용유=料理に使う油。大豆、トウモロコシ、菜種、オリーブなどの植物原料や動物脂肪から抽出・精製した油の総称（食用油）。
신고=国家機関や公共団体にある事実を書面や口頭で知らせること。（主に法律的な義務や権利行使のために行われる。）／紛失物や事故、犯罪被害の事実などを関係機関に知らせること。
신분=家柄、職業、財産などによって個人が社会体制の中で占めている地位や階級。／国家や団体などの法律的関係において持つ資格や地位。
신용=人や企業が約束を守ると信じられる度合い。／取引した財貨の代金を後で支払うことができる能力、またはその価値。／他人から得られる信頼や評判。
신체=人間の体。／頭から足先までの物理的な形態や構造。
신화=古代人の思惟や表象を通じ、神を中心に宇宙の起源、人類の誕生、民族の始祖などについて記述した神聖な物語。（例：檀君神話、ギリシャ・ローマ神話）／絶対的な権威を持ったり、神秘的なものと見なされる物事や現象。／（比喩的に）非常に驚くべき、あるいは優れた業績を成し遂げ、伝説のように伝えられる出来事。
실내=部屋や建物などの内部(室内)。
실력=学問、技術、運動など、ある分野で実際に発揮できる能力や腕前。／表に現れていない実際的な力や威力。
실리다=物体や荷物が船、車、飛行機などの輸送手段に置かれる。（「싣다（載せる）」の被動詞）／文章、写真、広告などが本、新聞、雑誌などの刊行物に掲載されたり収録されたりする。／ある機運、感情、力などが移されたり込められたりする。／人の足や脚がある物体の上に載せられる。
실습=学んだ理論や技術を実際の現場で実際にやってみて習得すること（実習）。／教育課程の一つとして、学生が一定期間、実際の職業環境に出て業務を体験し学ぶこと。
실시=実際に、ある事柄や法令、制度などを実行すること。
실제=事実の状態。または、あるがままの状態。／理論や空想とは異なる、現実の具体的な様相。／(副詞的に使われ) 偽りや想像ではなく、本当に。／「副詞」 嘘や想像ではなく現実的に。または理論や言葉だけでなく事実の場合に。／「名詞」 事実の状況や結果。
실체=実際の物体や外形の後ろに隠された本来の姿。／[哲学] 常に変わらず一定に持続し、その物事の根底となる客観的な存在。／ある現象や噂などの根拠となっている具体的な事実や内容。
실패하다=物事をやり損なって、思い通りにならなかったり失敗したりする。／試験、試合、選挙などで落第したり負けたりする。
실험=ある理論や仮設が正しいかを確認するために、一定の条件の下で実際にやってみること（実験）。／新しい方法や形式を試験的に試みること（試行）。
실현=夢や計画、期待などを実際に叶えること(実現)。／事実として現れるようにすること(具現)。
심리=心の作用と意識の状態(心理)。／ある状況や物事に対して起こる心の動き。／心理学の対象となる精神現象。
심사=物事の状態や価値、または人の能力や資格などを調査して決定すること（審査）。／（主に法律分野で）提案された案件や書類などを詳しく調査し分析すること（審議 / 審査）。
심장=人や動物の体で血液を全身に送り出す中心的な器官。胸の左側に位置し、筋肉質である（心臓）。／物事の中心、あるいは最も重要な部分（心臓部 / 中枢）。
심정=心の中に抱いている考えや感情。または、ある状況に置かれた時に感じる気持ち。
싸움=言葉や力、武器などを使って相手に勝とうと争うこと。／試合や競合で勝負を争うこと。／ある困難や対象に打ち勝つための努力や闘争。
쌓이다=物や道具などが重なり合って置かれる。／経験、知識、業績などが着々と蓄えられる。／感情や疲労、悩みなどが解消されずに残っている。／雪や埃などが地面に降り積もる。
썩다=食べ物や有機物が微生物の作用で分解され、悪臭がしたり形が変わったりする。／物や才能などが適切に使われず、放置された状態にある。／（比喩的に）精神や考え方、社会体制などが健全でなく、堕落する。／心配や悩みで心がひどく苦しみ、いらだつ。
쏘다=弓、銃、大砲などを一定の目標に向けて発射する。／蜂やヘビなどが針や牙で刺す。／言葉で他人を強く刺激したり、厳しく攻撃したりする。／日差しや視線などが強く降り注いだり、刺すように向けられたりする。／(俗語) 食べ物やお酒などを人にご馳走する。
쏟다=容器などに入っている液体や粒などを、一度に外に出るようにする(こぼす / 注ぐ / あける)。／精神、力、心などを一つのところにそのまま全部使う(注ぐ / 傾ける)。／言葉や感情などを一度に外に表す(ぶつける / 吐き出す)。
쏟아지다=液体や物質などが一度に外へこぼれ出る。／雨、雪、日差しなどが強く降り注いだり降ったりする。／音、言葉、視線、質問などが一度にたくさん現れる（殺到する）。／眠気や涙などが抑えきれずに出てくる。
쓰러지다=立っていた物体や木などが中心を失い、地面に横倒しになる。／病気や疲労などのために力がなく、体を支えきれずに倒れる。／国家や家門、企業などが勢力を失ったり滅びたりする。
쓰이다=「書く」の受身形：紙や掲示板などに文字や文章が書かれる。／「使う」の受身形：ある用途や目的のために利用される（使われる）。／「被る」の受身形：頭などに載せられたり覆われたりする（被せられる）。／心や神経がある事に向けられる（気になる）。／「使う（物や道具などを利用する）」の被動詞。ある物や道具が特定の目的のために利用される。／「書く（文字や文章を記す）」の被動詞。紙や壁などに文字や文章が残される。／「被る・かける（帽子や眼鏡などを頭や顔に載せる）」の被動詞。ある物が頭や顔に載せられる。／ある事柄に心が向いたり、気になったりする。（主に「心が使われる（気になる）」、「神経が使われる（気にかかる）」の形で使用）
아끼다=物やお金、時間などを大切にして、むやみに使わない（惜しむ・節約する）。／ある対象を非常に大切に思ったり、世話をしたりする（大事にする・愛着を持つ）。／惜しまず快く差し出す。
아냐=相手の言葉や問いに対して否定したり、そうではないことを表したりする時に使う言葉。「아니야（アニヤ）」の縮約形。／申し訳なく思ったり感謝したりする相手に対して、その必要がないことを優しく表す言葉。
아마도=確実ではないが、推測するにおそらくその可能性が高いという意を表す言葉。主に後に「～だろう」、「～のようだ」などの推測を表す表現が来る(たぶん / おそらく)。
아무래도=いくら考えてみても。話し手の推測や判断を強調する時に使い、色々な可能性を考慮しても結局ある結論に至ることを表す。／状態や都合から見て、推測通りほぼ間違いなく。ある事が起こる可能性が非常に高いことを表す。
아무렇다=状態、性質、様子などがどうである。（主に疑問文や否定文、または「-든지（〜でも）」、「-도（〜も）」と共に使われ、特別な条件や制限がないことを表す。）／格別の問題がなかったり、大したことではなかったりする。
아무튼=意見や状況がどうであれ。（前の内容にかかわらず、結論を出したり話題を変えたりする時に使う）／「とにかく」または「いずれにせよ」の意味を表す副詞。
아쉽다=名残惜しくて、心残りで物足りない。／何か不足していたり、なくて物足りない気持ちがある。
아예=(主に否定を表す言葉と共に使われ)「絶対に」「断じて」「はなから」の意味で、ある事を最初から全くしなかったり否定したりすることを表す言葉。／(強調の意味で)「どうせなら」「いっそ」の意味で、最初から心に決めて行う様子を表す言葉。
아울러=同時に他のことをしたり、状況が付け加えられたりする時に使う言葉。（同時に、また、共に）／二つ以上の事柄や現象が一気に起こることを表す言葉。
아이고=絶望、苦痛、悲しみ、驚き、戸惑いなど、突然の感情が込み上げてきたときに出す声。／体がきつかったり、疲れたりしたときに習慣的に発する声。／非常に嬉しかったり、喜ばしかったりするとき、あるいは呆れたことを見たときに出す声。／話を始めたり終えたりするとき、あるいは雰囲気を変えるときに合いの手のように使う声。
아이디어=物事に対する新しい考えや構想（アイデア / 発想）。／問題を解決したり、新しいものを作り出すための創造的な発想。
아픔=肉体的に感じる痛みや苦痛。／精神的に経験する苦しみや悲しみ。
안방=家の奥様や夫婦が居る部屋。通常、家の最も奥に位置し、居住空間の中心となる(奥の間 / 主寝室)。／(比喩的に) ある分野や場所の中心、または最も重要な場所を指す言葉。
안전하다=危険が生じたり事故が起きたりする恐れがない。／体や財産などが保存され、安らかである。
안정=変化したり揺れたりせず、状態が静かに維持されること（安定）。／心や精神状態が平穏で落ち着いていること（安定 / 平静）。／物体が一箇所に留まっていたり、平衡を保って倒れないこと（安定 / 平衡）。
안타깝다=思い通りにならなかったり、見ていて可哀想で心が痛み、もどかしい。／ある状況が非常に惜しまれたり、居ても立ってもいられないほどもどかしい状態にある。
알=鳥、魚、昆虫などのメスが体外に出す丸い形の物質。中から雛や幼生が孵化する(卵)。／殻に包まれているか、外形が丸い物体。（例：目玉、眼鏡のレンズ、飴玉など）(玉 / 粒)。／皮をむいた果物や穀物の実(粒 / 中身)。
알아듣다=人の話を聞いて、その内容や意味を理解する。／他人の助言や指示、命令などを理解して受け入れる。
앓다=病にかかって苦しむ。／ある事柄のために心の中で心配し、苦しむ。
압력=物体と物体の接触面の間で垂直に押す力。／社会的・政治的な目的を果たすために、他人を威圧したり強制的に従わせたりする力。／気体や液体が周囲を押し出す力。
앞두다=時間的、または空間的にある事柄や対象が近い状態にあるようにする。／ある事柄や状況が訪れる前の状態にある。
앞서=時間的に、または順序において、ある基準より先に。／空間的に、ある対象より前の場所に。
앞서다=人の前の位置を歩いたり、行ったりする。／物事や時期が他より先に行われる。／能力や成績、技術などが他より高い水準にある。／考えや気持ちが実際の行動や現実より先走る。
앞세우다=人を自分より前の位置にいさせたり、ある隊列の前に立たせたりする。／ある物事や価値、理由などを他のものより先に出したり強調したりする。／目上の人（親など）より先に死んで死別する。／物事の進行において、他の人をリーダーや代表として立てる。
앞장서다=集団の先頭に立って行く。／ある事柄の主導者になったり、最も積極的に参加したりする。
애쓰다=目的を果たすために心身を尽くして励む。ひどく苦労したり、骨を折ったりする。／他人を助けたり配慮したりするために精一杯尽くす。
애정=愛する心。または愛を感じる感情。／ある物事や対象を慈しみ、大切に思う心。
액수=貨幣や有価証券などの一定の金額の数値（額 / 金額）。
양=(依存名詞) 未婚の女性を高めたり、丁寧にもてなして呼ぶ言葉。主に姓や名前の後に使われる。／(一部の名詞の前に使われ)「二つ」または「両方」の意味を表す言葉。主に身体部位や方向、対立する二つの対象を指す時に使われる。／数えられる、または測定できる分量や程度。／物の大きさ、幅、長さ、重さなどの分量。／エネルギーや情報などの大きさを表す数値。／ウシ目ウシ科の哺乳類。体に縮れた毛がたくさん生えており、性質は温순だ。肉と毛は食用や衣類の原料として使われる。／十二支の八番目である「未（み）」を象徴する動物。
양국=二つの国。または、互いに関係のある二つの国（両国）。
양념=料理の味を引き立てるために使う醤油、砂糖、唐辛子粉、ごま塩などの材料を総称する言葉（味付け / 調味料）。／（比喩的に）ある事柄や話に面白みを加えるために付け加えるもの（スパイス / 彩り）。
양쪽=道や物体などの両方の側、あるいは両方の側面。／互いに向かい合っている、あるいは関係のある二つの対象の両方。
양파=ユリ科の二年生草本。鱗茎は丸く、外側は赤みを帯びた茶色で、内側は白色である。特有の辛味と香りがあり、食材として広く使われる（タマネギ）。
얘=近くにいる人や目下の人を呼ぶ時に出す言葉。「이 아이(この子)」が縮まったもの。／驚いたり慌てたりした時、または相手の言葉に同意したり反論したりして話を始める時に出す言葉。／「この子(이 아이)」の縮約形。近くにいる子供を指したり呼んだりする時に使う。／(代名詞的用法) 前ですでに言及された、身近な立場の子供を指す。
어느새=知らないうちに。いつの間にか。いつの間にやら。（主に予想より時間が早く過ぎたことを表す時に使う）
어둠=光がないか、足りなくて暗い状態(暗闇 / 闇)。／社会的に希望がないか、暗鬱な状態。／表に現れない、秘密めいた、あるいは邪悪な状態。
어떡하다=「어떠하게 하다(いかにするか)」が縮まった言葉。主に状態や状況が困ったものであったり、どう対応すべきか分からない時に使う。
어려움=ある事をするのが難しかったり、骨が折れたりする状態や程度（困難 / 難しさ）。／困難であったり、貧しかったりする事情や状況（苦労 / 窮状）。／心理的に気まずかったり、慎重になったりする心の状態（気まずさ / 遠慮）。
어머=話し手が急に驚いたり慌てたりした時、または何かに感動したり感心したりした時に発する言葉。主に女性が多く使用する。
어색하다=言葉や行動などが自然ではなく、不慣れだ。／人との関係や雰囲気がぎこちなく、気まずい。／物や服装などが似合わず、浮いている。
어쨌든=意見や事情、都合がどうであれ。（どのような状況でも結果を重視する時に使用）／前の言葉とは関係なく、次の段階へ話題を変える時に使う言葉。
어쩌면=(推測) 確実ではないが、察するにおそらく。／(感嘆) いかにあんなことがあり得るのかと思うほど、驚いたり呆れたりした時に使う言葉。
억울하다=何の落ち度もないのに叱られたり罰を受けたりして、心が晴れず悔しい。／正当な待遇を受けられなかったり、事情をきちんと認めてもらえなかったりして心が苦しい。
언젠가=未来のいつか。（これから訪れる漠然とした時点を指す）／過去のある時。（すでに過ぎ去った漠然とした時点を指す）
얹다=ある物体の上に別の物体を置く（載せる / 置く）。／一定の金額や分量にいくらかを足す（上乗せする / 加える）。／他人に頼ったり、ある事に付수随したりする（身を寄せる / 付随する）。
없애다=すでにある状態や現象を消し去る。／ある物や対象を片付けたり捨てたりして、存在しないようにする。／悩み、心配、苦しみなどの心理状態を解消して落ち着かせる。／（人や動物を）殺す。
엉뚱하다=常識や一般的な考えから大きく外れている。／言動が状況に合わず、非常に思いがけない。／元の目的や方向とは全く別のことをする。
에너지=人間や動物が活動する力の源。または、物事や現象を動かす根本的な力。／仕事をする能力。物理的なエネルギー（熱、光、電気など）だけでなく、心理的・精神的な活力を指す言葉。
여건=ある事をなすために備わっている条件や状況。／[哲学] 論証の根拠になったり、思考の出発点になったりする、与えられた命題または事実。
여보=夫婦の間で夫や妻を呼ぶ言葉（あなた / お前）。／よく知らない人を呼ぶとき、注意を引くためにかける言葉。主に年配の人の間で使われる（もしもし / ちょっと）。
여유=時間、空間、お金などが十分にあって余りがある状態。／心が急がず、落ち着いていてゆったりとした状態。／ある物事や現象において、定められた範囲を超えたゆとりのある程度。
여인=成人した女性。（普通、中年以上の女性を丁寧に呼んだり、文学的な表現として使われる。）
역사가=歴史を専門的に研究したり、歴史書を編纂したりする人(歴史家)。
역사적=歴史の記録や事実に根拠していること（歴史的）。／歴史において重要視されるほど価値があるか、大きな影響を及ぼすこと（歴史的）。／歴史に基づいたり、歴史に関連していること（歴史的）。／歴史の発展に大きな影響を与えるほど価値があったり、重要であること（歴史的）。
연결되다=二つ以上の物事や現象などが互いにつながったり、関係が結ばれたりする。／電話やインターネットなどの通信網が通じるようになる。／ある場所へ行く道や通路がつながっている。
연결하다=二つ以上の物や現象などが互いにつながるようにする。または、そのようになる。／ある物や人と関係を結ばせる。／情報通信網や電気回路などを通じさせる。
연구소=特定の主題や分野について専門的に調査・研究するために設立された機関。
연구자=ある事柄や物事について深く調査・分析し、真理を解明することを専門とする人（研究者）。
연구하다=ある事柄や物事について深く調査・分析し、真理を究明する。／問題を解決するために多角的に考え、方法を探る。
연기=決められた期限や時間を先に延ばすこと（延期）。／物が燃える時に発生する気体や煙状の物質。特に、タバコが燃える時に発生する煙を指すこともある。／俳優が映画、演劇、ドラマなどで引き受けた人物の性格、行動、感情などを身振りや話し方で表現すること(演技)。
연기자=俳優や芸人のように演技をすることを職業とする人。映画、ドラマ、演劇などで配役を務め、人物の感情や行動を再現する人(演技者 / 役者 / 俳優)。
연속=絶え間なく続くこと。／ある物事や現象が、時間的・空間的に途切れることなく接している状態。
연출=脚本に基づき、俳優の演技、舞台装置、衣装、照明、音楽などを総合的に指示・決定して、演劇や映画などを作り上げる合こと。／ある状態や状況を人為的に作り出すこと。
연합=二つ以上の団体や国家が共通の目的を達成するために一つに合わせたり、緊密な関係を結ぶこと（連合）。／[政治] 複数の国家が独自の主権を維持しながらも、経済や安保などの特定の分野で協力するために結成した組織体制。
영상=温度が0℃以上である状態(零上)。／光の屈折や反射などによって、レンズや鏡に現れる物の形。／映画、テレビ、コンピューターなどの画面に映し出される姿。／頭の中に描かれる姿やイメージ。
영양=生物が体の外から必要な物質を摂取してエネルギーを得て、体の組織を作り、生命活動を維持すること。または、その物質。／体に養分となる成分や気運。
영업=営利を目的として事業を行うこと。または、その事業。／企業や商店で営利を目的として継続的に行う事業活動。／業務を進行したり、引き受けた仕事をこなしたりすること。
영역=一国の主権が及ぶ範囲。領土、領海、領空をすべて含む。／活動や機能、あるいは関心などが及ぶ一定の範囲や分野。／生物学で、個体や集団が自分の区域であることを主張し、他の個体の侵入を防ぐ空間（テリトリー）。
영원하다=ある状態が果てしなく続いたり、時間が経っても変わらない状態にある。
영원히=ある状態や現象が際限なく続いたり、変わらずに持続する様子。／時の流れに制限がなく、いつまでも。
영혼=死んだ人の体から抜け出ると信じられている、精神的な実体。／肉体に宿り、精神活動の主体となって肉体を司る非物質的な実体。／ある物や芸術作品の中に宿っている精神や気魂。
예금=銀行などの金融機関にお金を預けること。または、その預けたお金(預金)。
예방=疾病や災害、事故などが起きないようにあらかじめ対処して防ぐこと。
예산=国家や団体で、一会計年度の収入と支出をあらかじめ計算して定めた計画。／ある事をするのに必要な費用をあらかじめ計算すること。または、その費用。
예상=あることが起こる前にあらかじめ考えておくこと。またはその内容（予想 / 予測）。／将来の結果や状態がどうなるかを推測すること（予想 / 推測）。
예술가=芸術作品を創作したり表現したりすることを職業とする人。または、そのような仕事に従事する人。文学、音楽、美術、舞踊、演劇、映画など、各分野の専門家を総称する。／技巧や腕前が優れており、芸術的な境地に達した人を比喩的にいう言葉。
예외=一般的な規則や例から外れること。またはその状態。一定の原則が適用されない特殊な場合。
예전=今よりかなり前の時。（過去のある時点や時期を意味する。）
예절=守るべき正しい態度や道理。社会の構成員の間で互いに尊重し、円満な関係を維持するために約束された行動規範を意味する。
예컨대=いくつかの例の中から、例を挙げて言えば。（ある事実を説明したり証明したりするために、関連する事例を引用する際に使う副詞）
오가다=人や物体などがある場所を行き来する。／ある場所を定期的に決めて通ったり往来したりする。／言葉、挨拶、視線、感情などが互いに交わされる。
오래전=過ぎ去った時間がかなり長い、あるいは遠い過去(大昔 / ずっと前)。
오랜=長い時間（の）。（冠形詞として後ろに来る名詞を修飾し、「すでに過ぎ去った時間が長い」という意味を表す。）
오염=汚い物質によってきれいなものが汚れること。またはその状態。／(比喩的に) 純粋な状態がなくなり、悪い影響を受けて堕落すること。
오직=他のものはなく、ただそれ一つだけであることを表す語。／色々なものの中で、ただ一つだけを選んだり強調したりする時に使う語。／ある状態や行動が他に邪魔されず、ひたむきであることを表す語。
오징어=[動物] 十腕目ジンドウイカ科に属する軟体動物の総称。体は細長く、頭に10本の腕があり、危険を感じると墨を吐く。食用として広く利用される。／(比喩的) 外見が相対的に不細工な人を擬人化したり、からかって呼ぶ言葉。
오해=ある内容や事実を実際とは異なり、間違って理解すること。／相手の意図や状況を誤った方向に判断することで生じる非難や葛藤の原因。
온=全部の、またはすべての。（主に数量を表す言葉や名詞の前に使われ、その範囲全体を指す。）
온갖=あれこれ様々な。あらゆる種類の(あらゆる / あらゆる種類の)。
온몸=頭の先から足の先までの体全体（全身）。
온통=すべて。あるいは、あるもの全部。 (全部 / すべて)／心や考えがただ一箇所にだけ向いている状態。 (一心に / 専ら)／全部、すっかり。またはある限りすべて。／頭の中や心の中が、その考えだけでいっぱいである状態。
올=「今年」を意味する言葉。主に日付や年を表す名詞の前に使われ、今過ぎようとしているこの年を意味する。／「名詞」今年。（現在進行しているこの年。）／「冠形詞」今年の。（主に一部の名詞の前に使われ、「今年の」という意味を表す。）
올려놓다=低い所から高い所、またはある物の上に移動させて置く。／ある対象や案件を議論の対象になるよう提示したり登録したりする。／コンピュータネットワークやシステム上にデータやファイルを登録する（アップロードする）。
올바르다=言葉や考え、行動などが理屈や規範から外れることなく、正しくて妥당だ。／姿勢や形がゆがんだり曲がったりせず、まっすぐだ。
완벽하다=欠点や不足しているところが全くなく、非常にきれいで完全だ（完璧だ）。
완성=完全に成し遂げること。または、その結果。／ある計画や目標が意図した通りに締めくくられること。
완전=不足や欠陥がなく、すべてのものが備わっている状態。／（副詞的口語）主に若者の間で「とても」「非常に」「完全に」の意味で、状態や程度を強調する時に使う言葉。
왠지=「なぜ（である）か」の略語で、はっきりした理由もなく何となく。／具体的な根拠を挙げるのは難しいが、漠然と感じられる気分や状態を表す時に使われる。
외교=国家間に結ぶ政治的、経済的、文化的関係。または、その関係を維持し発展させるための国家的な活動(外交)。／他人や他国との関係を円滑にするために手腕を発揮すること。
외부=ある組織、団体、または建物の内側ではない外側。ある対象や現象の外側の部分。または、自分が属していない他の社会や組織。
외치다=大声で叫ぶ。／自分の主張や意見などを他人に強く訴える。
요청=必要な事柄や行動をしてほしいと頼んだり要求したりすること。また、その内容。
욕=他人を侮辱したり卑하したりするために使う下品な言葉（悪口 / 罵倒）。／他人から聞かされる非難、または恥ずべきこと（不名誉 / 恥）。／目下の人の過ちを叱る言葉（叱責）。
욕심=分に過ぎて何かをむやみに欲しがったり、手に入れようとしたりする心（欲・欲心）。／ある事をやり遂げたり、目標を達成しようとしたりする意欲や情熱（意欲）。
용기=勇ましく強い意気込み。または、物事を恐れない気概（勇気）。／物や材料を入れる器。液体、固体、気体などを保管・運搬するための入れ物の総称（容器）。
용돈=個人的な入用のために、ちょっとしたことに使う金（お小遣い）。／親や保護者が子供に定期的に、または必要な時に与える金（お小遣い）。
용어=ある分野で専門的に使われる言葉（用語）。／一定の意味を表すために使用する言葉。
우려=心配すること。または、その心配。（物事が悪い方向へ進むのではないかと案じ、心が休まらない状態を意味する。）
우리말=わが国の言葉。主に韓国人が韓国語を指して言う言葉。／自国の言葉を親しみを込めて呼ぶ言葉。
우승=競技や競合などで第一位を占めること。／複数の候補や競争者の中で、最も優れた成績で勝利すること。
우연히=物事が意図したり計画したりしていない状態で、おのずと起こるように。／はっきりと言い表せないある原因によって、物事が成されるように。
운=あらかじめ決まっていて、人間の力ではどうすることもできない天運や運数。／物事がうまくいく良い機会や運勢。／動いたり移り変わったりする状況。
운명=人間を含むあらゆるものを支配する超人的な力。または、その力によってあらかじめ決まっている境遇（運命）。／今後の生死や存亡に関する状況。
울리다=誰かを涙を流して泣かせる。（「泣く」の使役動詞）／音を鳴らしたり、響かせたりする。／感動を与えて心を熱くさせる。／ある音が広く響き渡ったり、反射して聞こえたりする。／音が 広く響き渡ったり、大きく鳴ったりする。／ある物体が振動して音を出す。／感動や衝撃を与えて心を揺さぶる。／悲しませたり痛めつけたりして、涙を流させる。
웃기다=人を笑わせる。（動詞「笑う」の使役動詞）／言動がふざけていたり、おかしい。（主に皮肉として使われる）
워낙=とても、非常に、または普通よりはるかに。（主に後に来る形容詞を修飾して、度合いがはなはだしいことを表す）／もともと、または本来の性質が。
원래=物事が前から持っていた本来の状態や性質。また、初めから、根本から。／物事が最初に生じた時からの状態や属性を表す時に使う言葉。／以前からずっと、または根本的にそうであることを表す時に使う言葉。／以前から決めていたり、予想していたりしたことを表す言葉。
웬=どうした、どのような、思いがけない。（正体が分からない、または予想外の状況で使われる）
웬일=どうしたこと。意外な状況や思いがけない出来事を表す時に使う。
위기=危険な境目や時期（危機）。／ある状況が破局に向かいかねない決定的な段階や状態。
위대하다=能力や業績、気概などが非常に優れていて立派だ。／形や規模が非常に大きく雄大だ。
위반=法律、命令、約束、規則などを守らず、背くこと。
위치하다=一定の場所に位置を占めている。／ある物事や現象が、特定の立場や状況に置かれている。
위협=力や権力などで相手を怖がらせて脅し、自分の言うことを聞かせること。／何かが起こりそうな恐ろしい勢いや雰囲気。／存在や状態を危うくする要因や現象。
유교=孔子を始祖とする中国の代表的な道徳的・政治的思想。忠・孝・礼を根本的な教えとし、修己治人（己を修め人を治めること）を目標とする。／儒学を宗教的観点からいう言葉。
유난히=状態や性質などが普通の場合と非常に異なって（とりわけ / 殊に）。／以前や他のものに比べて際立って（目立って / 格別に）。
유물=前世代の人類が後世に残した物。特に考古学的な価値があるものを指す。／亡くなった人が残した遺품。／過去の慣習や制度のうち、今まで残っているもの。
육체=人間の体。精神や魂に対比される概念として使われる。／人間の生きている体そのもの。
음성=人の声。喉を通して出る音。／[言語] 人の調音器官（発音器官）を通じて出される物理的な音。
의도=何かをしようとする考えや計画。または、あることをしようと決心した目的。
의무=当然なすべきこと。または法律や道徳によって強制されたり、任されたりした責任(義務)。／人として当然守るべき道理。
의문=疑わしく思う問題や状態。／はっきりと分からず、頭の中に生じる問い。
의미하다=言葉や文章、記号などが、ある内容を表す。／ある出来事や現象が、ある価値や重要性を持つ。／含みを持たせたり、ある意図を持ったりする。
의복=人の体を包んで保護し, 礼儀を尽くしたりおしゃれをしたりするために着るすべての外衣と下着をひっくるめていう言葉。
의심하다=確信が持てないため信じられず、不思議に思う（疑う）。／ある事実がそうなのかそうでないのか判断がつかず、不安に思う。／ある人が犯罪を犯した、あるいは過ちを犯したと推測する（疑いをかける）。
의욕=何かをしようとする積極的な心や意志。
이끌다=目的地やある方向へ進むようにする。／団体や組織の先頭に立って治めたり率いたりする。（指導する）／注意、関心、考えなどをある方向へ向けさせたり引き出したりする。／品物や動物を引いて動かす。
이내=一定の時間、距離、数量、程度の範囲内に入ることを表す言葉。（主に「- 以内」の形で使われる。）／待つ必要もなく、すぐに。または直ちに。（ある状態や動作が遅滞なく後に続くことを表す。）
이념=ある時代や社会、または個人が持っている根本的な考えや価値体系。／国家や団体が進むべき道を提示する道徳的、政治的な理想や目的。／[哲学] 理性が把握した絶対的な価値や原理。
이달=今月。（話している時点が属している月。）
이동=動いて場所を移ること（移動）。／ある職位や職務から別の場所へ移ること（異動）。／情報やデータなどが一箇所から別の場所へ伝えられたり変わったりすること（移行 / 転송）。
이러다=「このようにする(이렇게 하다)」が縮まった言葉。状態や動作がこのように進行することを表す。／「このように言う(이렇게 말하다)」が縮まった言葉。先に述べた内容や現在の状況について、このように話すことを表す。
이룩하다=1. (状態や現象、結果などを) 念を入れて非常に甲斐のある形で成し遂げる。／2. ある現象や状態が作られたり形成されたりする。
이뤄지다=(夢や願いなどが) 実際に現れたり現実になったりする(叶う / 実現する)。／(ある状態や結果が) 組み立てられたり作られたりする(構成される / 形成される)。／(男女の愛が) 結実する(結ばれる)。
이리=話し手に近い場所へ。または、こちらへ。／状態、形、性質などがこれほどの程度に。または、このように。／話し手の方へ近く。または話し手が指す場所へ近く。（「이리로」の縮約形）／状態、模様、性質などがこれほどまでに。または、このように。
이성=概念を形作り、判断し、推理する人間の能力。本能や感情に流されず、冷静に思考する力を指す。また、事物の理を論理的に考え、判断する精神的な機能。／性別が異なる人。（主に男性に対して女性を、女性に対して男性をいう言葉。）／性質が互いに異なる性質。
이어=絶えず続けて。 (続けて / 引き続き)。／前の言葉や行動に続いてすぐに。 (続いて)。
이외=一定の範囲や限界の外。または、提示されたもの以外の別のもの。
이용되다=対象を必要に応じて役立てたり、用いたりするようにする。（「利用する」の被動詞）／他人を騙したり巧妙に使ったりして、自分の利益を得るための手段になる。
이윽고=副詞：しばらく時間が経った後で。「ついに」、「結局」の意味を込め、前の状態や状況が続いた後に新しい状況が起こることを表す。
이익=1. 物質的、あるいは精神的にプラスになること（利益 / ためになること）。／2. 事業や取引などを通じて得られる経済的な儲け（利益 / 得）。
이튿날=ある出来事があったすぐ次の日（翌日）。
이하=数量や程度が決まった基準より少ないか低い状態。（基準となる数や水準を含む。）／ある記録や言葉で、その後に続く内容。／期待や一般的な水準に及ばない状態。
익히다=何度も経験したり練習したりして、手慣れるようにする。（技術、仕事、習慣など）／知識や情報を自分のものにする。（学問、言語など）／何度も見たり経験したりして、目や耳に慣れるようにする。（顔、地理など）／肉や野菜などの食べ物に熱を加えて、食べられる状態にする。（料理）／キムチや酒などの味が出るようにする。（発酵）／(食べ物などを) 火を通して生の状態ではなくする（「煮える・焼ける」の使役形）。／(技術や知識などを) 頻繁に経験したり繰り返したりして、自分のものにする。／(顔や目などを) 何度も見て、見慣れるようにする。／(キムチや酒などを) 味が染みるようにしたり、発酵させたりする。
인격=人としての品格や身なり（人格）。／道徳的行為の主体となる個人。またはその個人の独自的な価値や権利。／法律上の権利と義務の主体となり得る資格。
인구=一定の地域内に住んでいる人の総数。／ある仕事や分野に従事したり、それを楽しんだりする人の数。
인상=人の顔つき、またはその顔つきから受ける感じ（人相 / 印象）。／顔の筋肉が動いて現れる表情。（主に「顔をしかめる」の形で使われ、不快な表情を作るという意味で用いられる。）／ある対象が人の心に与える感じやしるし（印象）。／ある対象が記憶の中に強く残る痕跡。／品物の値段、料金、税金、給料などを上げること（値上げ / 引き上げ）。／引っ張って上に上げること（引き上げ）。
인연=人々との間に結ばれる関係（縁 / 絆）。／物事が発生する根本的な原因や条件。／[仏教] 因と縁を合わせた言葉。結果を生じる直接的な原因と間接的な助け。
인제=今（「話している今この時」を強調して言う言葉）。／今（「過去と断絶された現在」を強調して言う言葉）。／今（「待ちわびていた時がついに来たこと」を強調して言う言葉）。／ちょうど今。（「이제（今）」を強調していう語）。／前の内容が後ろの内容の理由や根拠になることを表す語。
인체=人の体。または、人の体全体を構成する構造や組織。
일반인=特別な地位や身分を持たない普通の人（一般人）。／特定の分野において専門的な知識や技術を持っていない人。／軍人、警察、公務員などの特殊な職域に従事していない民間人。
일반적=全体に広く当てはまったり、通用したりするさま。／普遍的で平凡であり、特別ではないさま。／全体に広く当てはまること（一般的）。／特別ではなく、平凡なこと。
일부러=ある目的や考えを持って、わざわざ。／知っていながら、あえて故意に。
일상=毎日繰り返される普通の日々（日常）。／時々起こる特別なことではない、平凡な生活の範囲。
일상생활=毎日繰り返される普通の生活。特別なことがない平凡な生の過程(日常生活)。
일정=一定の期間に行うべきことの計画を日付順に立てたもの。旅行や行事などを進めるために決められた日付や時間の計画（日程 / スケジュール）。／一つに決まっていること。または状態や程度が変わらずに同じであること(一定)。
일종=同じ部類の一種類。／何ともはっきり言えないが、ある程度そのような性質を持っていること。
일찍이=時間的に先んじて。または、普通より早く。／昔から、あるいは前から。
일행=一緒に道を歩む人々の群れ。または、その群れに属する人（同行者 / 一行）。
임시=決まった時期ではなく、必要に応じてその都度定めること(臨時)。／一定期間、一時的に滞在したり仕事を引き受けたりすること。／根本的な解決策が出るまで、ひとまず急ぎで処理すること。
임신=子や胎児がお腹の中にいること。または、そのような状態。
잇따르다=動く物体が他の物体のすぐ後ろに続いて追う。／ある事件や行動が相次いで起こる。
자격=ある事をするのに必要な条件や身分。／一定の身分や地位を持つことで行使できる権利や義務の範囲。／法律上、特定の権利を享受したり義務を負ったりするための法的要件。
자극=ある物体や現象が生物に作用して感覚を起こさせたり、反応を誘発すること（刺激）。／人の心を揺さぶり目覚めさせたり、ある事に意欲が湧くように促すこと（刺激 / 鼓舞）。／皮膚や身体組織に触れて、一時的に痛みや熱さを感じさせること（刺激）。
자녀=息子と娘を合わせていう語。親の立場から見た子供たちを意味する。
자동=自らの力や内蔵された装置によって動くこと。／機械が人の直接的な操作なしに、決められた規則や条件に従って自ら作動すること。
자랑스럽다=人に自慢できるようなところがある。自分自身や自分に関係のある対象が立派で、誇らしい気持ちである。
자랑하다=自分と関係のある人や物、事柄などが優れている、または立派であると他人にさらけ出して言う（自慢する / 誇る）。／ある優れた品物や条件などを備えている状態を表す（誇る / 有する）。
자연환경=人間の生活に影響を及ぼす山、川、海、大気など、自然のあらゆる状態や条件。
자원=人間生活や経済生産に利用される原料となる物質。（天然資源、水産資源、地下資源など）／ある目的を果たすために活用できる人力や技術、知識などを総称する言葉。（人的資源、観光資源など）
자유롭다=何かに縛られたり拘束されたりせず、自分の思い通りに行動する状態にある。／障害になるものがなく、活動するのに邪魔がない。／形式が決まっておらず、格式に囚われない。
자존심=他人に対し屈せず、自らの品位を自分で保とうとする心（自尊心 / プライド）。／自分自身を尊び、大切にする心。
잔뜩=ある様子や状態が非常に激しかったり、いっぱいだったりする様子。／器具などに物がぎっしり詰まっている様子。／期待をしたり緊張したりする態度が非常に激しい様子。／天気がひどく曇っている様子。
잠기다=ドアや鍵などがかかったり、締められたりする。（鍵や掛け金などがかかって開かなくなる。）／液体の中に沈んだり、覆われたりする。（水や他の液体の中に浸かったり、完全に覆われたりする。）／ある状態や雰囲気に深く入り込む。（考え、悲しみ、霧などに包まれたり、没頭したりする。）／声が低く、かすれる。（喉が枯れたり腫れたりして、声がまともに出なくなる。）／液体の中に入って見えなくなる。（水に沈んだり覆われたりする。）／ある雰囲気や状態、考えに深く入り込む。／霧や暗闇、煙などに包まれる。／（声が）スムーズに出ず、かすれる。
잠들다=眠りにつく。眠り始める。／（比喩的に）亡くなって永遠に眠る。／（比喩的に）活動や作用が止まったり、静まったりする.
잡히다=「つかむ」の被動詞：人や動物などが、他の人や獣に捕らえられる。／荷物や物などが手に握られる。／弱点や口実などが他人に知られたり、利用されたりするようになる。／心や態度が一箇所に集中したり、落ち着いたりする。／計画、日程、順序などが決まる。／テレビやラジオの信号、カメラの被写体などが捉えられる。
장군=軍隊を指揮し、統率する首領。（現代の軍事階級における准将、少将、中将、大将の総称）。／将棋（チャンギ）で、相手の王を攻撃する時に出す声。またはその状態。／（比喩的に）体格が立派で、気性がたくましい人を指す言葉。
장래=将来、これからやって来る先の日々。発展する可能性や見通し。
장르=芸術や文学において、区分けの基準となる部門や様式。映画、音楽、文学などで、似た特徴を持つ作品をまとめて呼ぶ言葉。
장면=ある事件や現象が起きている光景や状況。／映画、演劇、小説などで、特定の背景や視点を中心に構成される一場面の内容。／ある状況に直面したり出くわしたりすること。
장사=利益を得るために物を買って売ること。またはそのような事業（商売 / 商い）。／体が非常に大きく、力が強い人（力持ち / 壮士）。
장식=外観を美しく飾ること。また、そのために使われる物（装飾 / 飾り）。／ある物事や現象を引き立たせるために付け加えるもの（飾り / 彩り）。
장점=人や物などが持っている、良い点や得意な点。または、他より優れている点。
재판=裁判所において裁判官が訴訟事件に対して法律的判断を下し、公的な決定を下すこと（裁判）。／物事の是非を判断して決定を下すことを比喩的にいう言葉。
저절로=人の力や外部の刺激が加わっていないのに、自ずから、または自然に。／ある事柄や現象が他の力を借りずに自然に起こる様子。
저지르다=罪や過ち、失敗などを犯したり、しでかしたりする。／（主に後始末を考えずに）仕事や事件を引き起こす。
적극=対象や事柄に対して自分の意思をはっきりと示したり、元気に活動したりすること。／ある物事を肯定的かつ能動的な態度で推進すること。
적극적=対象に対してそれを肯定し、進んで活動すること。／ある事柄に対して能動的に勢いよく推し進める性質があるさま。／対象や物事に対して意欲的で、力強く活動するさま。
적당히=基準や程度にふさわしく（適当に / ほどよく）。／いいかげんに、またはおざなりに（適当に / 適当にあしらう）。／状況に合わせて適切に（適宜 / 程よく）。
적어도=いくら少なく見積もっても。（数量や程度の最小値を表す時に使う。）／（後に続く言葉の条件を強調して）他のことはともかく、最小限これだけは。
적용=適切に利用したり、当てはめて使うこと。／法律、規定、原則などを具体的な事例や状況に合わせて実際に実践したり行使したりすること。
적용하다=法や規定、理論などを実際の具体的な状況に合わせて用いる。
적절하다=非常にふさわしい。状況、目的、要求などに照らしてみて、非常によい状態にある。（適切だ / ふさわしい）
전개=内容や状態の進展：物事の過程や物語の内容が進展していくこと。／広げること：畳んでいたものや固まっていたものを広く広げること printer.／展開すること：軍隊や勢力などをある目的のために広く配置すること。
전날=ある決まった日のすぐ前の日。または（主に「試験」などの特定な出来事と共に使われ）単なる昨日の意味を超え、その出来事が起こる直前の日を強調する。
전달하다=物やメッセージ、情報などを他の人や場所に送り届ける。／考え、感情、知識などを他人に理解させたり、知らせたりする。／音、光、熱、電気などのエネルギーをある場所から別の場所へ移す（伝導する）。
전망=将来をあらかじめ見通すこと。または、見通される将来の状況(展望 / 見通し)。
전문가=ある分野に専門的な知識や技術を持っている人（専門家）。／特定の仕事を長く続け、その仕事に非常に熟練している人。
전자=電気を帯びた非常に小さな粒子。すべての物質を構成する原子の基本成分の一つ。／電子の運動や特性を利用した技術、またはその技術が適用された装置を総称する言葉。
전체적=一部分に局限されず、対象の全部に関係すること。／対象の個々の構成要素よりは、それらが集まって成す一つの統一された塊や雰囲気に注目すること。／ある一部分に限定されず、物事や現象の全体に関係すること。
전통적=伝統を受け継いで伝わってくること。または、そのような方式や性格を帯びていること。／ある集団や共同体で古くから伝わってきた系統や慣習、風習に基づいていること（伝統的）。／昔の形式をそのまま踏襲したり、その価値を重視すること（伝統的）。
전해지다=ニュースや言葉、情報などが他の場所や人に伝わる。／品物や物品などが他の人に渡される。／伝統、風習、技術などが後世へと継승されたり伝わってきたりする。／感情や機運、感じなどが相手に伝わり、感じ取られる。
절=相手に敬意を表すために、体をかがめてする挨拶。／仏像を安置し、僧侶が居住して修行をする場所（寺 / 寺院）。／主語と述語を備えているが、独立して使われず、大きな文章の中に組み込まれている単位（節）。／仏像を安置し、僧侶が居住しながら仏道を修行する所（寺 / 寺院）。／相手を敬う気持ちを表すために、体をかがめてする挨拶（お辞儀）。／文章の内容を区分する単位。主に本の章（章）の下の単位を指す。／節目や節の間。／音楽で楽曲の内容を区分する単位。
절대=何の条件や制約もつかないこと。／比較できる相手がいないこと。／(副詞的に使われ、後に否定語が来ると) いかなる場合でも必ず、絶対に。／「絶対安静」のように、いかなる外的影響も許さない状態を意味する。／何の条件や制約もつかないこと（絶対）。／比較できる相手がいないこと（絶対）。／（主に後に来る否定語と共に使われ）いかなる場合でも必ず、または絶対に。
절대로=(主に否定を表す言葉と共に使われ) いかなる場合でも必ず。「決して」の意味を強調する時に使う。／何の条件や制約もなく、必ず。
절대적=1. いかなる条件や制約もつかないさま。／2. 比較する対象がないほど非常にはっきりしているか、ものすごいさま。／3. 他のものに依存せず、それ自体で存在するさま。 (絶対的)／何の条件や制約もつかないこと（絶対的）。／比較する対象がないほど非常に優れた状態や権威を持っていること。／他の物事との関係の中で成立するのではなく、それ自体として変わらず存在すること。
절반=一つを二つに等しく分けること。または、そのように分けた半分。／全体の二分の一程度の分量や水準。
절차=物事を進めていくうえで経なければならない順序や方法（手続き / 手順）。
젊은이=若い人。普通、青年期や壮年期の初期の人を指す。／（比喩的に）精神的、身体的に活力が溢れている人を指す言葉。
점차=順序に従って少しずつ。／時間の経過とともに状態や程度が少しずつ変化して。（類義語：だんだん、次第に、徐々に）／順を追って少しずつ進むこと。時間が経つにつれて程度が少しずつ増したり減ったりする様子(次第に / 徐々に)。
접근=近くに寄ったり、近づいたりすること(接近 / 寄り付き)。／ある対象や問題に近づき、その実体や解決に近づくこと。／機械や設備、ネットワークなどに接続したり入ったりできる状態(アクセス)。
접촉=触れ合うこと。または物体と物体が互いに触れること。／人や団体などが互いにつながったり、行き来したりすること。／ある現象や実体に直接経験したり対面したりすること。
접하다=消息や情報、知識などを聞いたり受け取ったりする。／ある対象や現象に直接向き合ったり接したりする。／境界や線が互いに触れ合う。
젓다=液体や粉末などが均一に混ざるように棒などを入れて回す（かき混ぜる）。／船を進ませるために櫂（オール）を動かす（漕ぐ）。／拒絶や否定の意を表すために体の一部（首、手など）を左右に振る。／風や光が入るようにうちわなどを振る。／手足を振りながら歩いたり動いたりする。
정=1. 愛や親近感を感じる心。 2. 長い間共に過ごす中で生まれる、近くて厚い情愛や連帯感。 3. 他人を配慮し助けようとする温かい心。
정기=定められた時期や期間。（主に一定の間隔をおいて繰り返される時を指す。）
정당=政治的な見解を同じくする人々が権力を握り、自分たちの政策を実現するために組織した団体（政党）。
정리하다=散らかった物や状態をきちんと片付け、整える。／不要なものを減らしたりなくしたりして、秩序を正す。／考えや文章、関係などを体系的にまとめたり、円활（円滑）にしたりする。／お金や帳簿などの計算を締めくくる。
정말로=嘘偽りなく、本当に。誇張や飾り気がなく、実際に。自分の言葉や信念が真実であることを強調する時に使う言葉。
정면=物体の正面（前方の面）。／ある事柄や現象と真っ向から向き合うこと。またはその状態。／（比喩的に）物事の核心や本質的な部分。
정상=状態や状況に特別な変動や異常がなく、本来あるべき状態であること。／(教育・行政) 中断したり遅延したりしていた日程が、本来の計画通りに進む状態。／山の頂、一番高いところ。／ある状態や現象の最高の段階。／国家や政府の最高指導者。
정성=あらゆる誠意を尽くそうとする、真実味のある偽りのない心。または、ある事に全力を尽くしたり精力を傾けたりする態度(精誠 / まごころ)。
정식=一定の形式や公式な手続きを備えている状態（正式）。／準会員や臨時会員ではなく、すべての権利と義務を備えた状態（正会員）。
정신적=精神に関すること。または精神を基にするもの。（主に冠形詞として使われ、後に来る名詞を修飾する）／精神に関すること。または精神を基盤とすること。／物質的、あるいは肉体的なものではなく、心や魂の状態に関連すること。
정치인=政治を専門的に行う人。国家の政策を決定したり法律を制定したりし、権力を行使したり調整したりする仕事に従事する人を指す。
정치적=政治的な性格を帯びたり、政治に関連していること。／国家の権力を行使したり、政党間の利害関係に絡む事柄に関連していること。／政治に関連したり、政治の性格を帯びたりするもの。／政治上の目的や利害関係に基づいて行われること。
정해지다=決定されていなかった対象や状態が一つに固まったり、確実に決定したりする。／規則や秩序などが立てられたり、設けられたりする。
정확히=正しく確実に。数字の計算や事実の把握に間違いがない状態で。
제공하다=何かを出したり、供給したりすること（提供する）。／ある事柄の土台となるように、資料や機会などを整えてあげること。
제발=切に願わくは。（相手に懇切にお願いしたり、哀願したりする時に使う言葉）
제법=水準が普通以上で、なかなかもっともらしかったり立派だったりするさま。予想していたよりずっと。
제사=神령이나亡くなった人の霊に食べ物を供えて誠意を示すこと。またはその儀式。韓国では主に先祖を祀るために定められた日に料理を供え、お辞儀をする儒教的な儀礼を意味する。
제약=条件を付けて内容を制限すること。またはその条件。／何らかの活動や物事の存立を妨げたり、自由を拘束したりすること。／[哲学] ある事物の成立や発生、または存在を規定する条件。
제자=知識や技術、芸能などを教わる人（師匠の対義語）。／宗教的な教えを受け、その後を追う人。
제작=材料を用いて新しい品物や芸術作品などを作ること。／音楽、映画、放送番組などの文化コンテンツを企画し、完成させること。
제출하다=書類、資料、物品などをある機関や人に出すこと（提出する）。／意見や案件を議論の対象として出すこと（提出する / 提示する）。
제한=物事の範囲や限度を定めたり、その限度を超えないように防ぐこと。または、その範囲や限度。／一定の数量や資格などを超えないように抑制すること。
조=億の万倍になる数。またはそのような数の。(兆)／法令、規則、条約などの内容を構成する条項を数える単位（条）。／考え、計画、筋道などを表す言葉。／(依存名詞) 複数人が集まって作られた群れや団体を数える単位。／(依存名詞) セットで使われる物の組やセットを数える単位。／億の万倍になる数の。（五兆二千億などの数量を表す時に使われる。）／ある目的のために数人ずつに分けたグループ。また、そのグループを数える単位（組 / 班）。／物の対になった一揃い。また、それを数える単位（セット / 組）。／組織や団体の構成単位となる小さな集団（ユニット / 組）。
조각=材料（木、石、金属など）を削ったり、刻んだり、こねたりして立体的な形状を作る芸術活動（彫刻）。／彫刻をして作った芸術作品（彫刻作品）。／一塊から砕けたり、切り取られたりした一部分(破片 / かけら / ピース)。／木、石、金属などに形を彫ったり削ったりして作る芸術活動、またはその作品(彫刻)。／（数量の後で）非常に少ない量や、小さな部分を表す単位。
조그맣다=大きさや体積がかなり小さい。／(主に人の顔や目鼻立ちを描写する時) 小さくてこぢんまりとしている。
조미료=料理を作る際、味を調えるために加える材料。塩、砂糖、醤油、酢などや、人工的に作られた化学製品などを総称していう(調味料)。／(比喩的に) ある物事や現象に面白みや興味を添えるために加える要素。
조상=ある家系や民族の代々受け継がれてきた先祖。／現在のものの以前の状態、または基盤となったもの。
조심스럽다=間違いや失態がないように気を配り、非常に慎重で用心深い状態にある。／相手の気分を害さないように、態度が非常に慎重で控えめなところがある。
조심하다=間違いや事故が起きないように気を配り、注意を払う。／言葉や行動を慎み、警戒する。
종=金属で作られ、音を出す器具。主に寺や教会、時計塔などに吊るして叩いたり振ったりして音を出し、時間を知らせたり人々を集めたりするのに使う（鐘 / ベル）。／楽器の一つで、一定の音の高さを持つ金属製の打楽器。／生物分類の基礎単位で、形態的・生理的に類似し、互いに交配して繁殖能力のある子孫を残すことができる集団（種）。／物事の種類や区分を指す言葉。／物事の根本となる種や種子。
종일=朝から晩までの間。一日中。／朝から晩までの間。または日が暮れるまでのずっと。
종합=種類が異なるいくつかのものを一つにまとめること(総合)。／個別的な色々な要素や現象を統合して、全体として把握すること。／様々な学問や技術などを一か所に集めて体系化すること。
좋아지다=状態や品質、状況などが以前より良い水準になる（良くなる / 向上する）。／ある対象に対する好感や愛情が湧いたり、深まったりする（好きになる）。／健康が回復したり、気分が愉快になったりする（快方に向かう / 元気になる）。
좌우=左と右。／左側と右側の翼。（飛行機や鳥などの両翼）／側や周辺。／物事や状況を支配したり、決定的な影響を及ぼすこと。（主に「左右する」の形で使われる）／Aquello que domina o influye decisivamente en un asunto o situación. (Se usa principalmente en la forma '左右する' - influir/decidir)
죄=良心や道理に背く、あるいは反する行動。／法律に違反し、国家や社会から処罰を受ける可能性のある行為。／（宗教的に）神の意志に逆らったり、戒律を破ったりすること。
주고받다=物やお金などを互いにやり取りする。／言葉や挨拶、視線などを互いに交わす。／（攻撃や打撃などを）互いに加えたり受けたりする。
주먹=指をすべて内側に曲げて固く握った状態の手（こぶし / 拳）。／（比喩的に）武力や暴力を指す言葉。／握りこぶしの大きさや、その量を示す単位。
주식=株式会社において資本を構成する単位、およびその単位を表す有価証券。／会社の資産と利益に対する所有権を表す権利。
주어지다=人に何らかの権利、義務、機会、環境などが生じたり与えられたりする。／ある仕事や条件が提示されたり任されたりする。／物や状況がある対象に渡されたり用意されたりする.
주의=心に留めて気をつけること（注意 / 用心）。／ある一つの場所に心を集中させること（注意 / 集中）。／(法律) ある事態を避けるために、心に留めて気をつけること。／(教育) 学生の意識を一定の場所に集中させること。
주인공=小説、映画、演劇などの作品の中で中心的な役割を果たす人物（主人公）。／ある出来事や事件において中心となる人。／ある状況や環境の中心にいる人。
주저앉다=足に力が入らなかったり、元気がなかったりして、床に急に座り込む。／ある場所や地位にそのまま留まったり、居座ったりする。／物体が重さに耐えられなかったり、古くなったりして、下に崩れたり沈み込んだりする。／していたことを途中で諦めたり、失敗したりして挫折する/くじける.
주택=人が住めるように造られた家。普通、アパートのような共同住宅と対比される一戸建て住宅を指すこともある。
죽이다=生き物（人、動物、植物など）の命を絶つ。／勢い、気勢、声、色味などを弱めたり抑えたりする。／（俗語）非常に優れていたり格好良かったりして、他人を圧倒するほど良い。／ある機能や作用を止めたり、なくしたりする.／（囲碁やゲームなどで）石や駒を使えなくする。
줄곧=絶えず、休みなくずっと。／最初から最後まで変わることなく。
줄기=植物の胴体から枝が伸びる部分。根から水分や養分を葉や花へ運ぶ通路の役割を果たす。／物事が分かれて伸びている筋や系統。／水気や光、煙などが長く伸びていく様子。
줄어들다=物の体積や量、数量などが元より少なくなる（減る / 減少する）。／力や勢いなどが弱まる（衰える）。／（服などが）洗濯や乾燥の後にサイズが小さくなる（縮む）。
중반=ある事柄や一定期間の中間段階、または時期。／囲碁や将棋などで、局面が本格的に展開される中間の段階。
중부=ある地域や物の中間部分（中部 / 中央部）。／韓国の地理的区分で、ソウルを中心とした京畿道、江原道、忠清道の地域を総称する言葉。
중소기업=規模が比較的小さく、経営資本が少ない企業。資本金、売上高、従業員数などが法規で定められた基準以下の企業を指す。大企業と対比される概念で、経済の基礎を成す重要な役割を果たす。
중요성=貴重で肝要な性質や特性。ある物事や現象が価値を持ち、大きな影響を及ぼしうる状態を意味する。
쥐=ネズミ目ネズミ科に属する哺乳動物を総称する言葉。一般に体が小さく、前歯が鋭く、繁殖力が強い。／(比喩的) 非常にすばしこくて、悪賢い人を指す言葉。／(医学) 筋肉が急激に収縮してけいれんを起こす現象。
쥐다=指を曲げて物の周りを囲んだり、掴んだりする。／指をすべて内側に曲げて拳を作る。／権力、実権、金などを思いのままにできる状態になる。／心や感情を抑えたり、強くコントロールしたりする。
즉시=あることが起きた直後。/ 遅滞なく、すぐさま。
즐거움=気に入って満足し、うれしい感じや心の状態。
증가=数や量が増えたり、多くなったりすること（増加）。
증거=ある事実や現象を裏付け、証明できる根拠。／[法律] 裁判所や裁判官が判決を下す際、判断の基礎となる資料。
증상=病気を患っている時に体に現れる様々な状態（症状）。／ある現象が起きる状態や様子。
지도자=集団や団体、国家などを先頭に立って導いていく人（指導者 / リーダー）。／ある目的や方向へ他人を教え導く人。
지붕=家の最上部を覆う部分。雨、露、日光などを防ぐ役割をする(屋根)。／物の上を覆い隠す施設物(覆い / 屋根)。
지시=ある目的や方向を指し示すこと。／上司や上位機関が部下や下位機関に対して、ある仕事をするよう命じること。また、その内容。
지식인=1. 新しい知識や専門的な知識を持つ人。／2. 社会的に知的で批判的な思考力を土台に文化を創造し、社会の変化に影響を与える人（知識人）。
지위=個人の能力や身分、役割などに応じて社会や組織の内部で占めている位置（地位）。／ある物事や現象が全体の中で占める比重や価値。
지적=知識や知性に関すること。／知的能力や知的好奇心など、人間の精神的活動に関連する性質。／欠点や手落ち、誤った点などを探し出して指し示すこと（指摘）。／ある事実や内容をはっきりと示して知らせること。
지점=本店（ほんてん）の指揮（しき）を受（う）け、本店以外（いがい）の地域（ちいき）で本店の営業（えいぎょう）の一部（いちぶ）を分担（ぶんたん）して経営（けいえい）する営利機関（えいりきかん）。／特定の場所や地点。／本店や本社の他に別途設置された営業所や事務所（支店）。
지출=ある目的のために金銭や物品などを支払うこと。または、その金銭や物品(支出)。
지치다=苦労したり、あることに苦しめられたりして元気がなくなる(疲れる / くたびれる)。／ある物事や人に対して、飽きたり嫌気が差したりする(飽きる / うんざりする)。
지켜보다=注意深く視線をそらさずに見る。（ある対象の動きや状況の変化を注意深く見守る。）／物事がどうなるか関心を持って見守りながら待つ。（状況の推移を観望する。）／こっそり隠れて他人の行動をうかがう。
지혜=物事の道理を素早く悟り、物事を正確に処理する精神的能力（知恵）。／生きた知識として人生の問題を解決し、より良い方向を提示する見識。
직접적=間に媒介物がなく、すぐにつながるさま。／ある現象や結果に対して、直接的な原因となるさま。／中間に媒介物がなく、すぐにつながること（直接的）。／ある事柄や現象に対して、直に影響を及ぼすこと。
직후=ある事が起きたすぐ後。
진단=医師が患者の状態を診て、病気の有無や種類、状態などを判断すること。／物事や現象の実態を分析し、問題点や原因を把握すること。
진리=いつどこで誰でも承認できる、普遍妥当な法則や事実。／真実の理。または正しい道理。／[哲学] 認識とその対象が一致すること。または客観的事実に合致する認識。
진실=偽りのない事実。／心に偽りがなく純粋で正しいこと。
진지하다=心や態度が浮ついておらず、厳粛で誠実だ。／ふざけたところがなく重みがあり、真心がこもっている。
진출=ある方面や分野へ領域を広げていくこと。／先の段階や、より高い水準へと進むこと。
진행=物事や現象が絶えず前に進んだり発展したりすること。／行事を進めたり、プログラムなどの司会を務めたりすること。／[言語] ある動作や状態が継続していることを表すこと。
진행되다=物事や現象が前に進んだり、継続して行われたりする(進行する / 進む)。／病気や症状などがだんだんひどくなったり広がったりする(進行する / 悪化する)。
진행하다=前へ進む。／物事や現象が絶え間なく続いていく(進行する)。／会議、行事、番組などの司会を務め、進める。
질=土台となる性質や品質（物の価値や水準）。／人の成り立ちや性格の素養。／ある物事を構成する本質的な内容。
질병=体の全体または一部に異常が生じて苦しみを感じたり、機能が正常に作動せず障害が起きたりする現象。「病気」を専門的にいう語。
집다=指や箸などで物をつかんで持ち上げる。／いくつかの中から一つを選んで指さしたり指摘したりする。／(案件や問題などを) 的確に話したり指摘したりする (指摘する / 突く)。
집안=家の中。または家の中と外（家中 / 家の内部）。／家族や親戚で構成される共同体。またはその門中（一族 / 親族）。／家柄や家門の社会的地位（家柄 / 家系）。
집어넣다=品物などをある空間の中へ移し入れる。／人を機関や団体に所属させたり、特定の場所（主に監獄や施設）に閉じ込めたりする。／ある内容や項目を文章や計画などに含める。
집중=一箇所に力や精神を集中させること。／物事や現象が一箇所に集まること。／視線や関心がある対象に強く向けられる状態。
짓=体の動きや振る舞いを卑しめて言う語。主に否定的な文脈や「悪い行い」の意味でよく使われる。
짙다=色や色彩が強く、濃い。／霧、煙、匂いなどが非常に立ち込めている、または強い。／気配、感じ、属性などが非常に強く表れている。
짚다=床や壁、杖などに体を支えるために手や先を触れさせる。／指で指したり、特定したりする。／状況や原因、核心などを正確に把握したり突き止めたりする。／（脈拍などを）調べるために指を当てる。
쫓다=ある対象を捕まえたり会ったりするために、後ろを急いで追う。／ある目標や理想、価値などを成し遂げるために努める。／視線や目が、ある動きを追いかける。
찌르다=先が尖った道具で刺したり、穴を開けたりする。／指などで強く押したり突いたりする。／痛みや刺激を強く感じさせる。／他人の弱点や核心を鋭く指摘する。／（比喩的に）ある感情や状態が心を強く刺激する。
차라리=いくつかの選択肢の中から一つを選ぶ際、前のものより後ろのものの方が良いという意を表す副詞。（一般的に「～より」「～の代わりに」などと共に使われ、選択の意志を強調する。）／現実的に不可能だったり困難なことをするくらいなら、死ぬことや非常に極端な状況の方がましだという心情を強調する時に使う言葉。
차량=自動車、汽車、電車など、あらゆる種類の車を総称する言葉（車両）。／汽車や電車などの列車を構成する各車両（両 / 車両）。
차리다=料理を食べられるように膳（テーブル）の上に準備して並べる。／気力や精神を整えて取り戻す。／服を着たり外見を整えたりして、身なりを整える。／世帯（家計）や事業などを準備して始める。
차별=二つ以上の対象を等級や水準に差をつけて区別すること。／不当に低い待遇をすることで平等な権利を侵害すること。主に性別、人種、宗教、身分などを理由とする。
참가하다=集まりや団体、行事、競技などの場に加わって活動に参加する。
참기름=炒った胡麻を圧搾して搾り出した油。特有の香ばしい香りと味があり、韓国料理でナムルを和えたりビビンバを作ったりする際、調味料として広く使われる。
참석하다=集まりや会議などの席に行って加わる（出席する / 参列する）。
참여=ある集まりや物事に加わり、共に関係を築くこと（参加 / 関与）。
참으로=事実と少しも違わず、実際に。／考えや期待以上に、非常に。
창고=物や資材を貯蔵したり保管したりするために建てられた建物(倉庫 / 蔵)。／(比喩的に) 知識や情報などがたくさん集まっている場所。
창밖=窓の外。
창조=以前にはなかったものを初めて作ること。／新しい価値やアイデアを引き出し、体系的な結果を生成すること。／神が宇宙万物を初めて作ること。
찾아내다=ある物や人を尋ね回ったり、捜したりして見つけ出す。／隠れていた事実や真理、原因などを研究したり調査したりして解명する（見つけ出す）。／忘れていた記憶や失っていた権利などを再び取り戻す。
채우다=一定の空間に人、物、気運などを満たす。／決められた数量や期間、基準などを満たす。／不足している部分を補ったり、欠乏した欲望を満たしたりする。／輪やボタンなどをはめたり、鍵をかけたりする。／環やボタンなどを掛けたりはめたりする。／錠や手錠などを掛けて締める。／一定の空間や器などに内容物をいっぱいに満たす。
책임자=ある事柄や集団の運営、管理などに対して実質的な責任を負う人（責任者）。／法律的または道徳的に責任を負わなければならない立場にある人。
책임지다=ある事柄や結果に対して、義務や権限を持って引き受け処理する（責任を負う / 責任を持つ）。／ある過ちや事故に対して、その代償を払ったり補償したりする（落とし前をつける / 責任を取る）。／（主に経済的な面で）誰かの生活や生計を引き受けて面倒を見る（養う）。
챙기다=必要な物を探して備えておいたり、まとめたりする。／欠かさずによく収めたり、世話をしたりする。／自分のものにしたり、利益を得たりする。／ある事柄や状況を几帳面に調べる。
처녀=結婚していない成人の女性（未혼女性 / 処女）。／男性との性的経験がない女性（処女）。／（比喩的）まだ人の手が触れていないか、初めての状態のこと。
처리=事件や事務、物質などを一定の方法で扱い、片付けたり整理したりすること。／結果を得るためにデータを操作したり計算したりすること。／表面に化学物質を塗ったり物理的な力を加えたりして、性質を変化させること。
처벌=罪を犯した人に対して、国家や権力機関が刑罰を下すこと。または、その刑罰。
천장=建物内部の空間の上面。屋根の内側や上の階の床の下側を仕上げて作るもの(天井)。／(比喩的に) 物価や株価などが上がり得る最高限度。
철저히=物事を行う際、隅々まで注意深く見渡し、手落ちや不足がないように。／考えや態度が根深く、徹底しているさま。
체력=肉体的な力。または、病気や寒さなどに対する体の抵抗力。体の力や気力の程度(体力)。
체육=健全な身体を育成し、強健な体力を養うことを目的とする教育（体育）。／体を鍛えるために行う様々な運動。／学校の教科の一つ。運動競技や保健に関する理論と実技を教える。
체조=体の柔軟性を高め、筋力を強化するために、一定の形式に従って体を動かす運動（体操）。／器械や道具を使用して、身体の技法と美しさを競う競技種目。（例：器械体操、新体操など）／健康維持のために日常的に行う軽い運動。（例：国民体操、ラジオ体操など）
체험=自ら経験すること。または、その経験。／[哲学] 客観的な対象に対して主観が直接的に経験する心理的な過程。
초반=ある事や現象が始まってから間もない時期。／スポーツの試合や囲碁などで、競技が始まった初期の段階。
초점=鏡やレンズなどを通過した光が一点に集まる点（焦点）。／人々の関心や注意が集中する核心的な部分や対象（焦点 / 的）。／カメラや顕微鏡などのレンズで像が最もはっきりと結ばれる状態（ピント）。
총=「冠形詞」すべて合わせていくらであることを表す言葉。（数量を表す言葉の前に使われる。）／火薬の力で弾丸を飛ばす携帯用火器。拳銃、小銃、機関銃などを総称する言葉。
총리=大統領の命を受け、行政各部を統括し監督する行政部のナンバーツー。（国務総理の略称）。／議院内閣制の国で内閣の首班となり、行政権を行使する最高責任者。
총장=大学の最高責任者。大学を代表して教務を統括し、所属する教職員を監督する（総長 / 学長）。／国家機関や公共団体で事務全般を統括する職位、またはその職位にある人（総長 / 事務総長）。
촬영=人、物、風景などの対象をカメラやビデオカメラを利用して写真や映像に撮ること（撮影）。
최대=数量や程度がこれ以上ないほど大きいこと。または、そのような状態。／一定の範囲内で最も大きいこと。
최대한=一定の範囲や限度内で、最も多い程度で（最大限）。／一定の限度内で最大に見積もった状態（最大限）。／できる限りの努力や力を注ぐ様子。
최선=最も良いこと。または、そのような状態。／あらん限りの誠意と力を尽くすこと。
최소한=ある数量や程度の最小の限度。／どのような場合でも必ず備えるべき、最も基本的、あるいは低い水準。／数量や程度が最も少ない限度（最小限）。／（副詞的に使われ）どんなに少なく見積もっても。または、少なくとも。
최종=一番最後。または、物事の最後となる段階。／ある物事の結末や最後の結果。
최초=一番最初。時間的にも順序的にも最も早い状態や時点。
추가=後でさらに付け加えて満たすこと（追加）。
추억=過ぎ去ったことを思い返すこと。また、その思いや事柄（思い出 / 追憶）。
추위=冬の寒い天気や寒い空気（寒さ）。／体で感じる冷たい空気や感覚（寒さ / 冷え）。
추진=物体を押し進めること(推進)。／目標を定めて、ある物事を力強く推し進めること(推進)。
축제=お祝いのために行われる大規模な宴会や行事。／芸術、文化、スポーツなど特定の分野の発展を記念したり楽しむために定期的に開かれる集まりや儀式。
출산=子を産むこと(出産)。／(比喩的に) 新しい結果物や作品などを作り出すこと。
출연=俳優、歌手、舞踊家などが舞台や映画、放送番組などに出て、演技や演奏などをすること。
출연하다=舞台、映画、放送などに出て演技をしたり公演をしたりすること。／ある出来事や現象が表面に現れること。（比喩的表現）
충격=物体に急激に加えられる物理的な力。／急激な刺激や予期せぬ出来事によって心が大きく揺れ動いたり、受ける精神的な打撃。／ある事件や現象が社会や人々に与える大きな影響。
충분히=ある基準や分量に不足がなく、たっぷりとしているさま。／ある状態や状況が足りないところがないほど、深く、または徹底的に。
치르다=(主に代金を)払う：品物の代金やサービスに対する対価を相手に渡す。／(試験や宴会などを)行う、済ませる：大事や行事、試験などを経験したり終えたりする。／(ある事柄に対する代償を)払う、受ける：自分がしたことや置かれた状況に対して、苦痛や犠牲などの報いを受ける。
치우다=(動詞の後で「-어 치우다」の形で使われ) 前の言葉が表す行動を非常に早く、てきぱきと終えることを表す語。／(動詞の後で「-어 치우다」の形で使われ) 前の言葉が表す行動を仕方がなく行ったり、その結果が気に入らなかったりすることを表す語。／散らかっている物を片付けたり、一方に寄せたりして場所を綺麗にする。／していた仕事を終えて整理する。／ある対象を遠ざけたり、なくしてしまったりする。／子供を結婚させて送り出す。
치즈=牛乳の中のタンパク質を凝고させて発酵させた食べ物。タンパク質、脂肪、カルシウムなどが豊富で、種類と味が非常に多様だ。
침=口の中の唾液腺から分泌される粘り気のある透明な液体。食物の消化を助け、口の中の粘膜を保護する(唾 / 唾液)。／(比喩的に) ある物をひどく欲しがったり、むさぼったりする心の状態。
침묵=何も言わずに黙っていること。または、そのような状態。／ある事柄に対してその内容を明かさなかったり、反応を示さないこと。／（比喩的に）ひっそりとして静かな状態。
커지다=大きさ、体積、量などが以前より増す（大きくなる）。／音や声などがより大きく、または響きが強くなる。／勢力、勢い、規模などがより広く、または強くなる。／考え、問題、感情などがより深く、または深刻になる。
코너=道の曲がった所や角（かど）。／競技場の隅（コーナー）。／百貨店や商店などで特定の賞品を集めて売る区域（売り場）。／新聞、雑誌、放送番組などで特定の領域を扱うために設けられた部分（コーナー）。
코스=ある場所から別の場所まで行く道や経路。／運動競技や訓練のために定められた道や区域。／順序に従って進められる食事の料理や学業の過程。
콤플렉스=[心理] 現実的な意識とは無関係に潜在意識の中に潜んでおり、感情的に強く結びついて人間の行動や態度に影響を与える心理的構造(コンプレックス)。／[一般] 自分の外見や性格、能力などに対して自ら不足を感じて抱く劣等感(コンプレックス)。
큰일=扱うのに多くの労力を要する重大な事柄。／不幸で深刻な事故や事件。／宴会や葬儀のような家庭内の大きな行事。
탑=石、煉瓦、木などを高く積み上げた建造物。主に仏教で舎利を祀るために建てられる。／高い建物や構造物の上部に尖ってそびえている部分。／（比喩的）功績や業績などを比喩的に言う言葉。
태양=[天文] 銀河系にある恒星の一つで、地球を含む太陽系の中心天体。地球に光と熱を供給し、生命体が生きる上で決定的な役割を果たす(太陽)。／比喩的に、世界を照らしてくれる存在や希望、あるいは権威の象徴を指す言葉。
태우다=車、船、飛行機などの輸送手段に人や荷物を載せる。／火をつけてなくしたり、熱くしたりする（燃やす）。／（気を）ひどくもんだり、心配させたりする。／日光で肌を黒く変色させる（焼く）。／火をつけてなくしたり、炎を上げさせたりする（燃やす / 焼く）。／物体に熱を加えて黒く変色させたり、火を通したりする（焦がす / 焼く）。／（比喩的に）ひどく心配させたり、気を揉ませたりする（焦がす / 煮やす）。／車、船、飛行機などの乗り物に他人を乗せる（乗せる）。／皮膚が日光を浴びて黒く変色するようにする（焼く / 日焼けさせる）。
택하다=複数の中から一つを選び出す。（選択する）／ある道や方向、方法などを決めて取る。／職業や進路などを自分の仕事として定める。
탤런트=テレビドラマや放送番組に出演して演技する人。主に「TV俳優」を指す。／優れた才能や能力。または、そのような才能を持つ人。
터뜨리다=中に入っているものが外に出るように力を加えて、破ったり割ったりする（破裂させる / 割る）。／溜まっていた感情や気運などを一度に強く表に出す（爆発させる / 沸き起こす）。／噂や事件などを広く広めたり、突然引き起こしたりする（言いふらす / ぶちまける）。／勝利や得点、実績などを劇的に成し遂げる（挙げる / 出す）。
턱=(主に「-을/ㄹ 턱이 없다」の形で使われ) 何らかの理由や可能性、状況を表す言葉。当然そんなはずがないことを強調する時に使う。／人の顔で口の下にある部分。ひげが生えることもあり、食べ物を噛む時に動く。／ある物や地面の高さが急に変わり、段になっている所。／ある事をするはずの根拠や状況を意味する依存名詞。（例：そんなはずがない。）
털=人や動物の体の表面に生えている糸状の物質（毛）。／植物の茎、葉、果実などに生えている細い糸状の物質。／生地や革などについている毛羽、または動物の毛皮をそのまま生かしたもの。
털다=付着しているものや打ち込まれているものが落ちるように、振ったり叩いたりする。／持っているものを残らずすべて出し切る。／他人の財物を盗んだり奪ったりする。／わだかまりや心に深く残っていることなどをきれいに忘れたり、なくしたりする。
테이프=物を貼ったり縛ったりするのに使う、片面または両面に接着剤が塗られた帯状の道具（テープ）。／音や映像を記録するために磁性物質を塗った薄いプラスチックの帯（テープ）。／ゴールラインや会場の入り口などに設置して装飾したり、競技の終わりを知らせたりする帯（テープ）。
토론=ある問題について、多くの人が各自の意見を主張し、その正否を問いながら議論すること（討論）。
톤=重量の単位。1トンは1,000キログラムに相当する。（記号: t または T）／船舶の容積（体積）を表す単位。1トンは100立方フィート（約2.83立方メートル）に相当する。
통=物や液体などを入れるために、木、プラスチック、金属などで深く作られた器（桶 / 容器 / タンク）。／白菜やスイカなど、大きな塊の野菜や果物を数える単位。／ある物が中に入っている状態や、その分量を表す言葉。／(打ち消しの語を伴って) 全く、さっぱり、ちっとも。／(主に「-ㄴ/는/-은」の後に使われ) ある状態が続いている様子。／手紙や書類、電話などを数える単位。／白菜やスイカのように、塊になった植物や物を数える単位。
통계=一括して計算すること。／ある現象を総合的に把握するために、その数量を順次数えたり調査したりして数値で表すこと。または、その結果。
통증=痛む症状。体のどこかが苦しいほどに痛い感じ（痛み / 疼痛）。
특수=普通のものと大きく異なっていたり、特別であること。／性質、状態、条件などが一般的な範囲から外れ、個別的で独特であること。／[軍事] 特殊部隊、特殊任務などのように、一般的な兵科や業務と区別される専門的な分野。
틀림없다=少しの狂いもなく確実だ。事実と一致しており、嘘がなかったり信頼できたりする（間違いない / 確かだ）。
틈=物体と物体の間の空いた空間(隙間)。／時間的な余裕や暇。／人々の間の関係が遠のいた状態、または機会。／時間的な余裕や暇(合間)。／人々の間の仲が悪くなった状態(亀裂)。／ある機会や状態。
파=ユリ科の多年草。高さは約60cmで、葉は円柱状で中が空洞になっており、先が尖っている。特有の香りがあり、食材として広く使われる(ネギ)。／(比喩的に) 物事を行ったり問題を解決したりする際の手段や方法。
파다=穴や溝を作るために,地面や物体の表面を削ったり掘り出したりする。／刃物や道具で文字や絵などを刻む。／ある分野の仕事や学問を深く研究したり掘り下げたりする。／(井戸や溝などを)作って通す。／(比喩的に)他人の弱点や秘密を暴き出す。
파도=海や湖などで風や地殻変動によって波がうねる現象(波 / 荒波)。／強力な勢いや大きな流れを比喩的にいう言葉(波 / 潮流)。
파일=書類や文書を整理して保管できるように作られた道具（ファイル）。／コンピューターで情報を保存する基本単位。テキスト、画像、オーディオ、プログラム実行データなどを含む。
판매=商品などを対価を受け取って売ること。
판매하다=商品などを対価を受け取って売る（販売する）。
팬=スポーツ競技や演劇、映画、音楽、または特定の芸能人などを熱狂的に好きな人（ファン）。／料理を炒めたり焼いたりするのに使う薄くて広いフライパン。／空気を流したり冷却したりするために使用する回転羽根装置（扇風機、換気扇など）。／スポーツの試合や演劇、映画、音楽など、または特定の芸能人やスポーツ選手などを熱狂的に支持する人（ファン）。／ある物事や現象を特に愛着を持って楽しむ人。
퍼지다=液体や気体、粉末などが四方に広く広がる。／噂やニュース、伝染病などが多くの人に知れ渡ったり伝わったりする。／音や光、香りなどが遠くまで伝わる。／しわになったものが伸びたり、狭かった空間が広くなったりする。／体が太って横に広がる。
펴내다=本や雑誌などを印刷して世に出す（出版する）。／曲がったり丸まったりしているものを広く広げる。
편리하다=利用するのに便利で利点があり、たやすい。ある対象や施設などが使用者の目的に合うよう整っており、煩わしくない。
편안하다=体や心が苦しくなく、平穏だ。／ある対象や環境が利用するのに不自由がなく、良い。／心配やトラブルがなく、無事だ。
펼쳐지다=畳まれたり巻かれたりしていた物が広く広がる。／前나横に爽快に開け、広く現れる。／ある状態や現象が広い範囲にわたって現れる.／夢や希望、計画などが実現する機会を得る。
평=物の善悪、是非、価値などを判定して言うこと。またはその内容（評 / 評価）。／ある対象に対する社会的な評判や世論（評判 / 噂）。／文章や作品の内容を分析してその価値を論じること（評 / レビュー）。／土地や建物の広さを表す単位。一坪は約3.3058平方メートル(㎡)に相当する。／ガラス、布、壁紙などの広さを表す単位。一坪は縦横それぞれ一尺(約30.3cm)の広さを指す。
평균=複数の数や量の平均値を持つ数。すべての値を足した後、その個数で割って算出する。／物事や現象の一般的な水準や状態。／等しいこと、または均等であること。
평범하다=秀でた点や変わった点がなく、普通だ。／(主に外見や実力などについて) 他の人より目立つところがなく、無難だ。
평생=生まれてから死ぬまでの間（一生 / 生涯）。／（比喩的に）非常に長い年月。
평화=戦争、紛争、または騒ぎがなく平穏な状態。／心に心配や障り（トラブル）がなく安락な状態。／（組織や社会内で）葛藤が解決され、睦まじく過ごす状態。
포기하다=やっていたことを途中でやめてしまう(放棄する / 断念する)。／自分の権利や資格、物などを捨てたり行使しなかったりする(放棄する)。／希望や期待を捨ててあきらめる(断念する)。
포함되다=ある物事や現象が中に含まれるようになる（含まれる）。／ある範囲や全体の一部として組み入れられる。
폭=横の長さ、または幅。／ある範囲や程度。／布や紙などの幅。／(依存名詞) 絵画や掛け軸などを数える単位。
폭넓다=範囲が非常に広い。／考えや見識、理解心などが偏りなく寛大だ。／人間関係や活動領域などの幅が広い。
폭력=他人を荒っぽく、荒々しく制압する時に使う物理的な力。／個人や集団が他人に身体的、精神的、言語的な被害を与える強圧的な行動。
표면=物の最も外側の部分や表面。／内部の事情や本質が現れていない、表面に現れた姿や現象。／[数学/物理] 立体の境界をなす面。
풀=草本植物を総称する言葉。木よりも茎が柔らかく、通常1、2年生き、花が咲いて実を結んだ後に枯れる。／草刈りなど、農業や造園の対象となる植物。／紙や布などを互いにくっつけるのに使う粘り気のある物質。主にデンプンを煮て作ったり、化学成分で作ったりする(のり)。／生地をパリッとさせるために塗るデンプン水(のり)。
풀리다=結び目、紐、ネジなどが緩んだり、元の状態に戻ったりする。（「解く」の受動詞）／抑えられていた気持ちや緊張、疲労などが消える。／理解しがたかった問題や疑問が解決される。／天気が暖かくなる。／禁止されていたことが自由になる。／気が緩んだり、集中力が切れたりする。（慣用表現：ネジが緩む）
품=上着の脇の下の胸囲の幅のこと。／懐や胸の広さを意味し、主に抱きしめたり包み込んだりできる空間的・心理的な余裕を意味する。／ある仕事にかかる力や努力、または手間を指す言葉。
품다=懐に入れたり、抱いたりする。／卵をかえすために体で覆って温める。／心の中に考えや感情を持つ。／ある対象を包み込んだり、抱えたりしている。
품질=物の性質や質。または、その性質や質が良い程度（品質）。
풍부하다=あり余るほどたくさんあって、ゆとりがある。（主に資源、経験、知識、物資などが対象の場合に使用される）／感情や表情などが非常に深く、多様である。（主に情緒、想像力、感受性などが対象の場合に使用される）
풍습=古くから伝わってきた生活上の習慣や風俗。ある社会や集団の中で長い間繰り返されてきた固有の生活様式や行動様式を意味する。
프로=ある事を専門的に行ったり、それを職業としている人。「プロフェッショナル」の略。／ある分野で実力が非常に優れている人を比喩的にいう言葉。／スポーツ競技などで報酬を得てプレーする選手、またはそのような選手が参加する競技団体やリーグ。／「プログラム(program)」の略語。放送、公演、スポーツ競技などの進行計画や、その内容を盛り込んだ目録のこと。
피로=体や精神が疲れ果てて力がないこと。または、そのような状態。／[物理] 材料に反復的な荷重や振動が加わり、その強度が次第に低下する現象。
피부=人や動物の体の表面を包んでいる組織(皮膚 / 肌)。／(比喩的に) ある物の表面や現象の一部。／(比喩的に) 直接的に感じる感覚や状態。
피시=個人が家庭やオフィスで独立して使用できるように作られた小型コンピュータ。「個人用コンピュータ(パソコン)」を指す言葉。
피해자=事故や災難により、身体的、精神的、物質的な損失を被った人。／他人の犯罪行為により、自己の権利や利益を侵害された人。
필수적=必ず必要であるか、経なければならないこと。またはそのようなもの。／あることをする上で、必ず備えたり経たりしなければならないこと（必須的）。／どうしても必要であったり、なくてはならない性質を帯びていること。
필요성=必ずあるべき、またはすべき必要のある性質。
하긴=(副詞) 「하기는」の縮約形。前の言葉を認めつつ、それに対する理由や条件を付け加える時に使う。／(副詞) 前の内容に対して肯定したり同調したりしながら、「考えてみれば確かにそうだ」という意味を表す。
하여튼=前の内容がどうであれ、関係なく結論を言う時に使う言葉。いずれにせよ、ともかく。
하하=口を大きく開けて愉快に、またすがすがしく笑う声。またはその様子。
학부모=学生の父や母、またはそれに代わって学生を保護し教育する責任がある人（保護者 / 学父母）。
학습=学び習うこと。学문や技術などを学んで身につける過程（学習）。／(心理学) 経験や練習の結果として生じる、比較的一貫した行動の変化や知識の獲得。
학용품=学校で勉強するのに必要な物。鉛筆、ノート、消しゴム、定規などを総称する(学用品)。
학자=学問に精通しているか、学問を専門的に研究する人（学者）。／特定の分野に対する深い知識と体系的な理論を備えた知識人。
한가운데=ある場所や物体の中心となる所。／ある事柄や事件が最も活발に行われている中心点。
한꺼번에=あることが同時に、または一度にどっと起きる様子。／分けずに一度にすべて合わせて。
한동안=ある程度かなり長く続く間（しばらく / しばらくの間）。
한때=ある時期。（ある出来事が起きた過去の特定の時、または短い間）／盛り（真っ盛り）の時。（最も勢いが盛んな時、または状態が良い時）／同時。（ある事柄や現象が同時に起こること）／ある時。過去の特定の時期。／ひととき / しばらく。あることが続く一時的な期間。／同時 / 同じ時。同一の時点。
한숨=心配や嘆き、あるいは安堵した時に口を開けて大きく吐き出す息、またはその音（ため息）。／一度大きくつく息。／（慣用的な表現で）ごく短い間、またはひと休みのこと。
한쪽=ある一方、またはある方向。／二つのうち、どちらか一方。／いくつかある中の、ある一つの側面や部類。
한참=かなりの時間。または、相当長い間。／物事が真っ盛りの時。（主に「한참이다」の形で使われる）／時間がかなり経過する間。または、かなりの長い間。／ある出来事が最も活発に起きたり、勢いが最も高まったりする時。
함부로=慎重に、あるいは深く考えずに、むやみに。／決められた規則や秩序を無視して、勝手放題に。
합리적=論理や理屈に合っており、食い違いがないさま。／経済的な原則に合致し、利益になったり効率的であるさま。／論理や理屈に合っていること。／ある目的や基準に照らしてみた時、無駄がなく効率的なこと。
합치다=二つ以上の物や力、心などを一つに合わせたり混ぜたりする。／いくつかの部分を集めて全体を作る。／散らばっていたものを一か所に集める。
항의=ある事柄や状況が不当、あるいは正しくないと判断し、それに対する反対の意見や不満を強く申し立てること。
해결=もつれた事柄や提起された問題などをうまく処理して終わらせること（解決）。／争いや葛藤を仲裁し、円満に締めくくること。／疑問や疑惑などを解いて明らかにすること。
해내다=困難な仕事や任されたことを最後までやり遂げたり、目的を達成したりする。／困難や障害を克服して結果を出す。
해당=ある範囲や条件などにぴったり当てはまること。／まさにその物事や対象に関係すること。／[行政] ある事柄と直接的な関連がある場所を指すこと。
해석=文章や文の意味を分かりやすく説明すること。または、そのような説明。／物事や現象の意味や内容を自分の観点に従って理解し、説明すること。／数学で、問題の条件を満たす式や値を求めること。／芸術で、演奏家や俳優が作品の意味を把握し、独創的に表現すること。／文章や物事、現象の意味を指し示したり説明したりすること。または、その説明。／文学や芸術作品に込められた内容を批評して明らかにすること。／数学において、関数の連続性や微分・積分などに関する性質を研究する学問分野。
핵심=物事の最も中心となる部分。／ある問題や事件の最も重要な部分や要点。
햇살=太陽から差し込む光の筋。または、その光の力。
행동하다=体を動かしてある動作をしたり、仕事を遂行したりする。／考えや決心を実際の行動に移す。／一定の状況で特定の態度を取ったり、振る舞ったりする。
행복하다=生活の中で十分な満足と喜びを感じ、心が満たされている。
향=鼻で嗅ぐことができる心地よい匂い(香り)。／祭祀や宗教儀式の際、火をつけて煙と匂いを出すもの(香)。／食べ物から漂う固有の味や匂い(風味 / 香り)。
향기=花、香水、食べ物などから漂う良い匂い。／(比喩的に) 人の品格や文学的な風情などから感じられる、高貴で美しい雰囲気。
향상=実力、水準、技術、状態などが以前より良くなること、またはそれを高めること。
허가=法令によって一般的に禁止されている行為を、特定の場合に特定の人に対して解除する行政処分。／ある事をするように許すこと。または、そのような承諾。
허용하다=法や規則などに従って、ある事柄や行為を認めたり受け入れたりする。／一定の範囲や限度内で許し、寛大に受け入れる。／ある数値の誤差や変化を認める。
헤매다=道に迷ってあちこちをうろうろする。／ある状況から抜け出せず、苦しんだり右往左往したりする。／ある境界や状態にとどまっている。／（比喩的に）考えや精神がはっきりせず、見当がつかない。
헤아리다=数や量がいくらなのか一つずつ数える。／ある事柄や状況について推測したり察したりする。／他人の境遇や気持ちを深く理解し、思いやる。
현실적=現在実際に起きている状態や条件に合っているさま。／事実や実際の事情に基づいているさま。／現在の実情や状況に合っていること（現実的）。／実際に具現可能であったり、実現性があること（現実的）。
현지=ある出来事が実際に起きた場所（現地）。／今現在いる、まさにその場所（現地）。
협력=力を合わせて互いに助け合うこと。／[経済] 二つ以上の経済主体が共同の目的を達成するために、経済的資源や技術などをやり取りしながら助け合うこと。
형님=男性が同じ親から生まれた兄を高めて言ったり呼んだりする言葉。／「兄と弟」を合わせて言う言葉。／他人同士の男性の間で、年下の人が年上の人を高めて言ったり呼んだりする言葉。／妻の兄を指す言葉。または、年上の義兄（妻の兄）を高めて呼ぶ言葉.
형부=女性が自分の姉の夫を指したり呼んだりする言葉（義兄）。
형성=物事や現象、状態などが作られ、形づくられること。／体系や関係などが整うこと。
형편=物事が進んでいく状態や経過。／暮らし向きの状態や財産の程度。／ある物事ができる条件や境遇。
호기심=新しくて珍しいものを好んだり、知らないことを知りたがったりする心（好奇心）。
호흡=息をすること。酸素を吸い込み、二酸化炭素を吐き出す生命維持活動を意味する。／一緒に仕事をする際、調和がよく取れている状態やその度合いを比喩的に言う言葉。／運動や歌をする際、息を調節するやり方。
홍보=一般の人々に広く知らせること。または、その知らせや情報。／企業、団体、官公庁などが活動や商品の特性などを大衆に知らせ、理解と信頼を得て良いイメージを作る活動。
화면=テレビ、コンピューター、スマートフォンなどの映像が映る平らな表面（画面）。／映画や絵画、写真などの作品において構成された場面や画幅の状態。／コンピュータープログラムやウェブサイトで表示される視覚的な構成単位。
화분=花や木を植えて育てる器。土を入れられるように底に穴が開いているのが普通である。／(比喩的に) 鉢に植えて育てる植物自体を指すこともある。
화장=化粧品を塗ったりこすったりして、顔をきれいに整えること。／外見を華やかに飾ること。
화제=話の題目や素材。（主に会話や文章の中心となる内容）。／多くの人の口に上るような話の種やニュース。
확대되다=形や規模などが元より大きくなること(拡大される)。／範囲、勢力、権限などが広くなったり増えたりすること(拡大される)。
확대하다=形や規模などを元より大きくすること。／範囲、勢力、権限などを広げること。／写真や絵、文字などを大きく表示すること。
확보=確実に持っていること、または所有すること。／ある対象や状態を確実に保障したり、維持したりすること。
확실하다=態度や現象などが間違いなくそうである。／事実や証拠が明白で、疑う余地がない。／人柄や仕事の仕方が几帳面で、抜かりがない。
확실히=態度や状態が間違いなく、はっきりと。／事実や根拠に食い違いがなく、明確に。
확인=間違いがないか、あるいはその通りであるかどうかを確かめたり認めたりすること。／ある事実や状態を明確に明らかにし、間違いがないことを証明すること。
환하다=光が差し込んで清く明るい。／表情や姿が明るく朗らかだ。／視界が遮られることなく広く開けている。／ある内容や事情について滞りなくよく知っている。
활동하다=体を動かして何らかの活動をすること。／社会的な目的や個人の利益のために、ある分野で積極的に活動すること。／生物が生命を維持するために生理的な作用をすること。
활발하다=元気がよくて活気があり、動きがはきはきとしている。／交流や活動、作用などが非常に活発で勢いよく行われる。
활용하다=十分にうまく利用したり, 生かして使う。／(文法) 用言の語幹に様々な語尾がついて、形態が変化する。
회복=病気が治って、元の健康な状態に戻ること。／悪くなった状態が再び良くなること。／失ったものを再び取り戻すこと。
회복하다=病んでいた体を再び以前の健康な状態に戻す。／失っていた気力や精神を再び整える。／悪化した関係や停滞した経済状態などを再び良い状態に戻す。／失っていた権利や資格などを再び取り戻す。
효과적=ある目的を達成するにあたって、やりがいや良い結果が現れるさま。／ある目的を果たすのに役立ったり、結果が良かったりすること。／（冠形詞としても使われ）ある目的を果たすのに結果が良いさま。
후반=全体を二つに分けたものの後ろの半分。／ある期間や時代の後半部分。／試合時間や演劇などの幕を二つに分けた時の後ろの部分（後半戦 / 後半部）。
후보=選挙である職位や身分を得ようと名乗り出た人（候補者）。／ある地位や資格を得る可能性がある人や対象（候補）。／スポーツ競技などで、正規の選手が実力を発휘できない場合に備えてあらかじめ選んでおいた選手（補欠選手 / 控えの選手）。
후춧가루=コショウの実を乾燥させて粉にした調味料。特有の辛味と香りがあり、料理の臭みを取り除いたり、味を引き立てたりするのに使う。
훈련=基本の実力を備えるために繰り返し習得すること（訓練 / 練習）。／特定の技術や姿勢などを習得するように教え、鍛えること。／軍事的な能力を養うために実施する演習。
훔치다=他人の物を密かに持っていき、自分のものにする（盗む）。／水分や埃などが付いたものを拭き取る（拭う）。／他人の考えや文章、または心を密かに持ってきて自分のもののように使ったり、魅了したりする（盗む / 奪う）。
휴식=仕事や活動を止めて、しばらくの間休むこと。一定の時間、緊張を解いて心身をリラックスさせること。
흉내=他の人や動物の言葉、声、身振りなどをそのまま真似ること。／あるものに似せて見せようと、外見をそれらしく整えること。
흐름=液体や気体、エネルギーなどが一方向へ絶えず動く現象。／時間や時代、状況などが一定の方向へと進んでいく形勢や過程。／考えや文章、事件などがつながっていく筋道や系統。
흔들리다=物体が左右、上下、または前後にしきりに動く。／考えや信念、態度などが定まらず、しきりに変わる。／状態や状況が安定せず、危うくなる。／音や光などが一定せず震える。
흔적=物や現象がなくなったり、通り過ぎた後に残された跡や印。／ある出来事が起きたことを推測させる手がかりや跡。／(生態/生物) 過去の生物が生息していたことを示す化石や跡。
흔하다=普通よりずっと多くて,どこででもたやすく見かけたり手に入れたりできる。／価値があったり特別だったりせず、ありふれている。
흘러가다=(液体が)低い方へ移っていく。／(空気や雲などが)空中を動いていく。／(時間や歳月などが)止まらずに過ぎ去る。／(状況や雰囲気などが)ある方向へ展開したり傾いたりする。／(品物や金などが)一か所に留まらず他へ移される。
흘러나오다=液体や気体、音、光などが中から外へ押し出されたり、にじみ出たりする。／秘密や情報などが外部に知れ渡る。／歌や演奏の音が聞こえてくる。
흙=地球の表面を覆っている、岩が砕けてできた粉や有機物が混ざった物質。植物が育つ土台となる(土 / 地面)。／陶磁器やレンガなどの材料となる粘り気のある土の性質(粘土 / 泥)。／(比喩的に) 人の体が死んで帰っていく自然の本質。
흥미=ある対象や現象に対して心が引かれたり、面白さを感じたりする状態、または心。／ある事柄や物に対して、特別な関心を持つようになる気持ち。
흩어지다=一所に集まっていたものが、いくつかの方向に別々に分かれる。／一つに固まっていたものが解けてなくなったり、あちこちに広がる。／集中できず四方に広まったり、混乱したりする。
희다=雪や牛乳の色のように明るく清らかな色だ（白い）。／肌の色が非常に明るく澄んでいる（色白だ）。／（比喩的に）汚れがなく、きれいで純潔だ。
힘쓰다=ある事を成し遂げるために、あらゆる真心を込めて努力する（尽力する / 励む）。／体の力を一箇所に集中させて使う（力を入れる）。
