-되다=一部の名詞の後ろに付いて動詞や形容詞を作る接辞。（動詞を作る場合）受身の意味を表し、「その状態になる」または「その行為を受ける」という意味を添える。（形容詞を作る場合）「そのような状態にある」という意味を添える。
-하다=(一部の名詞の後ろに付いて)動身を作る接尾辞。その名詞が表す行為をしたり、その名詞に関連した動作を遂行することを意味する。／(一部の名詞の後ろに付いて)形容詞を作る接尾辞。その名詞が表す性質や状態があることを意味する。／(擬声語や擬態語の後ろに付いて)動詞や形容詞を作る接尾辞。
가구=住居と生計を共にする基本的な社会単位。またはその構成員（世帯）。／戸口調査や統計の対象となる家々の数。／家の中で生活するのに必要な道具。机、椅子、ベッド、タンスなどの総称。
가늘다=物の太さや幅が普通に及ばず、薄かったり狭かったりする（細い）。／声が小さくて力がない（細い）。／目を細める様子を表す。／光や煙などがかすかで弱い。
가능성=今後、あることが起こり得る性質や程度（可能性）。／将来、発展する可能性のある潜在的な能力や希望（可能性 / 見込み）。
가능하다=あることが実現できる、またはあることができる状態にある（可能だ）。
가요=大衆の間で広く歌われる歌。特に現代のポピュラー音楽を指す言葉(歌謡 / ポピュラーソング)。／古くから伝わる民謡や時調（シジョ）など、韻文文学の総称。
가위=紙、布、髪などを切るのに使う道具。2枚の刃を交差させ、持ち手を開いたり閉じたりして使用する(はさみ)。／「ジャンケン」の略語。人差し指と中指（または親指と人差し指）を伸ばして出す形を指す(チョキ)。／(民俗) 眠っている間に体が思うように動かせず、息苦しさを感じる現象。一般的に「金縛りにあう」という形で使われる。
가정=一家族が共に暮らしながら生活する共同体。または、彼らが住む家（家庭）。／夫婦や両親、子供など、血縁や婚姻で結ばれた人々が集まって構成する社会の最も基本的な単位。／事実ではないこと、または、まだ起きていないことを事実として仮に定めること（仮定）。／論理や科学において、結論を導き出すための前提とする条件（仮定）。
가져가다=ある物を手に持ったり身につけたりして、別の場所へ運ぶ（持っていく）。／ある権利、物、状態などを自分のものにしたり、手に入れたりする（勝ち取る / 手にする）。／ある事柄や現象を維持し続けながら進める（持ち越す / 進める）。
가치=物事が持っている使い道や重要性。／対象が人間の欲求や関心を充足させる程度、またはその対象が持っている値打ち。／[経済] 商品の交換価値を表すもので、商品に投入された社会的必要労働時間などによって決定される金額。
각=(冠詞) 一つ一つの。または、個々の。複数ある対象の一つ一つを個別に指す時に使う言葉。
각종=いろいろな種類。
간=ある対象から別の対象までの間や距離を表す言葉。／対象と対象の間の関係を表す言葉。／（一部の名詞の後について）「間（期間）」の意味を表す言葉。／食べ物の塩分の度合いを表す味の状態（塩加減）。／食べ物の味を調えるために入れる塩や醤油などの調味料。／人や動物の体内の器官の一つ。解毒作用、胆汁の分泌、炭水化物代謝など、代謝過程で重要な役割を果たす(肝臓)。／(比喩的に) 心や情熱、または度胸を指す言葉。
간단히=複雑ではなく単純に。／短く明료(めいりょう)に。／手間や力をあまりかけず、手軽に。／食事を正式に食べず、軽く。
간식=食事と食事の間に食べる簡単な食べ物（おやつ / 間食）。
간장=塩水を発酵させて作った、塩味と旨味のある黒い液体状の調味料。料理の味付けや風味を出すのに使われる(醤油)。
간호사=法的資格を持ち、病院などで患者の世話をし、医師の診療を助けることを職業とする人(看護師)。
갈등=葛と藤が複雑に絡み合うように、個人や集団の間で目標や利害関係が異なり、互いに敵対したり衝突したりする状態。／一人の個人の内面で、二つ以上の相反する欲求や機会が同時に存在し、どちらを選ぶべきか決められずに悩む状態。
갈비=牛、豚、鶏などの胸の部分にある骨、またはその骨についている肉。／食用の牛や豚のあばら肉で作った料理（主に焼き物や蒸し物）。／（比喩的に）人や動物のわき腹の骨の部分。
갈비탕=牛のあばら肉（カルビ）を適当な大きさに切り、水に入れて肉が柔らかくなるまでじっくり煮込んで作ったスープ。または、そのスープにご飯を入れた料理。
갈색=黒みがかったオレンジ色。または、落ち葉や樹皮のような色(茶色 / 褐色)。
갈아입다=着ていた服を脱いで別の服に着替える(着替える)。
갈아타다=乗っていた輸送手段(汽車、バス、地下鉄など)から降りて、別の輸送手段に乗り換える。／(比喩的に)していた仕事や態度、所属などを別のものに変える(乗り換える)。
감=カキの木の実。形は丸かったり平たかったりし、熟すとオレンジ色や赤色を帯びる。甘みがあり、そのまま食べたり、乾かして干し柿などにして食べる。／心の中で感じる気分や情緒。／物事を把握したり判断したりする直感的な能力や感覚。／外に現れる様子や雰囲気。
감기=ウイルスによって引き起こされる呼吸器疾患。主に鼻づまり、鼻水、咳、発熱、頭痛などの症状を伴い、「〜にかかる（에 걸리다）」と一緒に使われ、病気の状態になることを表す(風邪)。
감기약=風邪を治療したり、その症状を緩和するために飲んだり塗ったりする薬（風邪薬）。
감독=仕事や人などを目配りして取り締まること。または、その仕事をする人（監督）。／スポーツ競技で、チームを指揮し統率する責任を負う人（監督）。／映画、演劇、放送などで作品制作の全過程を指揮・演出する人（監督）。／仕事や人を指図し、見張ること。また、その人。／スポーツ競技でチームを指揮し、訓練に責任を持つ人。／映画、演劇、放送番組などの制作を総括し、演出する人。
감사=感謝の気持ちを表す挨拶。／ありがたく思う心。
감사하다=ありがたく思う気持ちがある。／感謝の気持ちを言葉やしぐさで表す。
감자=ナス科の多年草。またはその地下茎にできる塊茎。食用にしたり、でんぷんを抽出する原料として使われる。／(比喩的意味) 丸くて不格好な人の顔や鼻などを指す言葉。
감정=ある現象や事柄に対して起こる心や感じる気分。／外部の刺激に対して心に起こる喜び、怒り、悲しみ、楽しみなどの状態。／他人に対する良くない感情や恨み。
강아지=犬の子、子犬。／親が子供や孫を可愛がって呼ぶ言葉。
강조하다=ある部分を特に目立たせたり, 強く主張したりする。／物事や現象をはっきりと鮮明に表す。
갖추다=必要なものをすべて備える。（ある物や施設などを完備する。）／必要な条件や資格などを持つ。（実力、礼儀、格式などを備えるようになる。）／態度や身なりを正しくする。（身だしなみや服装を整える。）
갚다=お金や物などを他人に借りたり、借金したりしたものを返す。／他人から受けた恩恵や恵みを、それに相応する行動で返す。／他人から受けた害や恨みを、それと同じような方法で返す（報復する）。
개인=国家や社会、団体などを構成する一人一人の人間。／団体や組織の一員ではなく、個人としての中心的な一人。
거실=洋式の家で、家族が集まって座って休んだり、客を応対したりする部屋。普通、家の中心となる広い空間を指す（居間 / リビング）。／（古語・文語）普段住んでいる部屋（居室）。
거절=相手の要求、提案、贈り物、頼みなどを受け入れずに断ること。
거치다=ある場所を通ったり、立ち寄ったりする（経由する）。／ある過程や手続きを順に踏む（経る）。／選抜、検査、審査などの過程を通過する（受ける）。／何かに引っかかって妨げられる（障る / つかえる）。
건너가다=人や動物、物体などが道、川、橋などを一方からあちらの方向へ移動する。／ある場所や状態から他の場所や状態へ移っていく。／噂やニュース、品物などが一方から他方へ伝わる。
건너편=一定の間隔や道を挟んで向かい合っている向こう側。（道路、川、廊下などの反対側の地点や方向を意味する。）
건설=建物、橋、道路などの施設を新しく作ること。／新しい体制、組織、秩序などを作り上げること。
걸어오다=ある場所からこちらに向かって足を踏み出し、動いてくる。／(比喩的に) ある道や過程、歴史を歩んでくる。
걸치다=物をどこかに載せて置く。／服や装身具などを身につけたり羽織ったりする。／時間的、空間的な範囲がある限界に及ぶ。／お酒を飲む（主に「一杯ひっかける」の形で使われる）。／太陽、月、雲などが山や地平線などに掛かっている。
검은색=光が全くないか、物体が光をすべて吸収した時に現れる暗くて濃い色。炭や墨の色と同じ。
검정=光が全くない状態の色。炭や墨の色のように、非常に暗くて濃い色のこと。
겉=物体の縁や外側の面。（反対語：中、裏）／物体の外見や見た目。／中に隠されておらず、外に現れている状態。
게으르다=行動や態度が遅く、動いたり働いたりすることを嫌う状態にある。／引き受けた仕事を適時に行わなかったり、誠実でなかったりする。
겪다=困難なことや重要なことを経験する。（主に苦痛、試練、変化など、否定的または困難な状況に用いられる）／人と付き合ってみたり、一緒に過ごしたりして、その性格や人柄を知るようになる。
결국=物事や状況の最後の結果。／色々な過程を経た末、最後に至って。／物事の終わり、またはその結果として。ある過程や段階を経て最終的な状態に至ったことを表す。／（強調の意味で）究極的には、結局のところ。
결석=学校や職場、集まりなどの決められた場所に出ないこと。
결심=することや目的に対して、自分の意思を確固たるものに決めること。またはそのような心。
결정하다=1. 行動や態度をはっきりと定める。 2. 多くのうちから一つを選んで決める。 3. 裁判所や機関などが案件に対して最終的な判断を下す。 (決定する / 決める)
결코=(主に後に否定の言葉が来て) いかなる場合でも、決して、断じて。
결혼식=男女が正式に夫婦関係を結ぶ儀礼（結婚式）。
경복궁=朝鮮時代の法宮であり、ソウル特別市鍾路区に位置する、最も規模が大きく中心となる古宮。／朝鮮時代に建てられた五宮の中で最初に建てられた正宮。ソウル市鍾路区世宗路に位置し、太祖4年(1395年)に創建され文禄・慶長の役で焼失したが、高宗の時代に興宣大院君によって再建された。「大きな福を享受せよ」という意味が込められている。
경영=企業や事業などを計画的に管理し、運営すること。／基礎を築き、物事を進めていくこと。／(歴史的意味) 家を建てたり土地を管理したりするなどの仕事。
경우=置かれている条件や、置かれるようになった状況（場合 / ケース）。／道理や理屈にかなった道徳的な義理（道理 / 礼儀）。／ある出来事が起こり得る条件や状況（場合 / 際）。／置かれている条件や置かれるようになった状況（場合 / ケース）。／当然すべき道理や理屈（道理 / 礼儀）。
경쟁=ある目的を達成するために、互いに勝とうとしたり先んじようとして争うこと。／[経済] 同一の市場で利益を得るために、2人以上の生産者や販売者が価格、品質、サービスなどを通じて互いに争うこと。／[生物] 生存に必要な資源が限られた環境で、個体群や種の間で繰り広げられる相互作用。
경제=人間の生活に必要な財貨やサービスを生産、分配、消費するすべての活動。または、それを通じてなされる社会的秩序。／お金を節約して使うこと。または、費用があまりかからない効率的な状態。／[歴史] 「経世済民」の略語。世の中を治め、民を救うこと。
경주=大韓民国慶尚北道の南東部に位置する都市。新羅千年の都として仏国寺、石窟庵、瞻星台など数多くの歴史的な遺跡地や遺物が残っており、「屋根のない博物館」と呼ばれる由緒ある歴史都市である。
경찰서=市・郡・区の単位区域内で国家の警察事務を司る行政機関。犯罪の予防、捜査、交通整理、治安維持などの業務を遂行する。
경치=山や野、川、海などの自然や地域の様子（景色 / 風景）。
경향=現象や思想、行動などがある方向へ傾く現象。または、物事がある一定の方向へ向かう際に見られる特徴や傾向。
계란=鶏が産んだ卵。タンパク質が豊富で、様々な料理の材料として使われる。
계속되다=ある状態や動作が止まらず、そのまま維持される。
계속하다=絶えず相次いで進む。または、ある状態や動作を長く続けたり維持したりする。／していたことを止めずに、続けてさらに行う。
고등학생=高等学校に通い、教育を受けている学生。通常、中学校を卒業した後、3年間の課程を履修する学生を指す。
고속버스=主要都市間を高速で運行し、遠距離を行き来する大型バス（高速バス）。
고추장=粉唐辛子、メジュ（麹）の粉、米粉（またはもち米粉）、塩などを混ぜて発酵させて作った韓国の伝統的な辛味調味料。
고통=体が痛くて苦しいこと。／心が非常に苦しく、辛いこと。
고프다=お腹が空いて食べ物を食べたい感じがある（お腹が空く / 腹が減る）。／（比喩的に）あるものを切実に望んだり願ったりする状態にある（～に飢えている）。
골=サッカー、バスケットボール、ホッケーなどの競技で、ボールを相手チームのゴールに入れ、獲得する得点。／サッカー、バスケットボールなどの競技場で、ボールを入れる場所。ゴールポスト。
공간=何も無い空いている場所。／ある物質や物体が存在できたり、ある出来事が起こり得る場所。／[物理/哲学] 上下、前後、左右の三方向に広がっている果てしない範囲。
공동=二人以上の人や団体が、ある事を共にしたり、同じ資格で関係を持つこと。／多くの人や多くの団体に等しく該当したり、属したりすること。
공업=原料を加工して有用な物を作る産業。加工する原料や製造方法によって軽工業、重化学工業などに分かれる。
공연=音楽、舞踊、演劇などを多くの人の前で実際に演じて見せること（公演）。
공원=国家や地方自治体が公衆の保健、休養、娯楽のために設けた庭園、遊園地、築山などの施設（公園）。／自然景観が優れた地域を保護し利用するために指定された区域。
공중전화=一定の場所に設置され、一般公衆が自由に利用できるようにした電話。硬貨やカードなどを使って利用する。／（比喩的に）公衆電話機が設置されたブースやボックス自体を指すこともある。
공짜=労力をかけずにただで手に入れたもの。／代価を払わずに無料で得たり与えたりすること。
공책=文字を書いたり絵を描いたりできるように、白紙を綴じて作った本(ノート)。
공휴일=国家や社会で公式に休みと決めた日。「法定公休日」のように、日曜日、国旗掲揚日（祝日）、旧正月、秋夕（チュソク）などを総称していう。
과연=思った通りに、本当に。（予想や期待が実際の状況と一致することを示す時）／結果において本当に。（主に「すごい」という意味を含ませて褒めたり感嘆したりする時）／（疑問文で）果たしてそうだろうかと疑う時。
과자=穀物の粉に砂糖、牛乳などを混ぜて焼いたり、油で揚げたりして作った間食用の食べ物（菓子 / お菓子）。／主に正食以外に口寂しさを紛らわすために食べる、甘い味や香ばしい味のする間食（おやつ）。
과정=物事や現象が進行していく経路、または段階。／学業や訓練などで終えなければならない一定の内容と順序。／物事が進んでいく経路（過程 / プロセス）。／ある対象が変化したり発展したりする段階。／（教育・学問）一定期間、教育を受けたり学問を修めたりする順序や体系（課程）。
과학=普遍的な真理や法則の発見を目的とした体系的な知識。特に物理、化学、生物学などの自然科学を指すことが多い。／事物の現象に対する客観的かつ論理的な分析と検証に基づいた知識体系。
관계자=ある事柄や現象に直接関係している人(関係者)。
관광객=他の国や地域の風景、風習、文物を身に訪れた人(観光客)。
관광지=景色や遺跡、施設などの見どころが多く、観光客がたくさん訪れる場所（観光地）。
관련=二つ以上の人、物、現象などが互いに関係を結んでいること。または、その関係。
관리=国家機関に所属し、国の事務を司る人。（今日の「公務員」に相当する。）／ある事柄や施設、物などが適切に維持されたり、目的に合わせて運営されたりするように見守り、統制すること（管理）。／人を成績、健康、態度などに応じて世話し、指導すること。／財産や知識などを保存したり利用したりするために必要な事務を処理すること。
관점=物事や現象を観察し把握する際, その人が立っている基本的な姿勢や方向。または物事を見る角度(観점)。
관하다=話したり、考えたり、文章を書いたりする対象になる。主に「～について（に際して）」、「～に関する」の形で使われる。
광주=大韓民国全羅南道の中部に位置する広域市。湖南地方の政治、経済、文化の中心地であり、「ピッコウル（光の街）」という別称を持つ。／京畿道の中東部に位置する市。（主に「京畿広州」として区別して呼ばれる）／光州広域市：大韓民国南西部にある広域市。湖南地方の政治、経済、文化の中心地であり、「ビッゴウル（光の町）」という別称を持っている。／広州市：大韓民国京畿道の中東部にある市。ソウル特別市に隣接しており、南漢山城などの遺跡地がある。
괴로워하다=体の痛みや病気などによって苦痛を感じる。／心が穏やかでなく、辛かったり苦悩に陥ったりする。／ある状況や環境が耐え難く、苦労しながら過ごす。
교과서=学校で教育課程に従い、生徒の教育のために使用する主な教材（教科書）。／ある分野で手本となるような事実や物事を比喩的にいう言葉（模範 / 手本）。
교장=小学校、中学校、高等学校で学校運営の全般に責任を持って管理し、教職員を指揮する学校の最高責任者。
교통비=自動車、電車、船、飛行機などの交通手段を利用するのにかかる費用。
교통사고=自動車、汽車、電車などの運行中に起きた事故。人や物に損害を与える場合を含む（交通事故）。
교환=互いにやり取りすること。／ある物を別の物に取り替えること。／[経済] 商品やサービスを互いにやり取りすること。
구=8に1を足した数。（アラビア数字では「9」と表記する）。／順番で9番目を表す数。／8に1を足した数の。（後に来る名詞を修飾して数量を表す。）／特別市や広域市の下に置かれる行政区画（区）。／都市の一部を区分して設定した特定の区域（区）。
구경=興味や関心を持って、ある対象や現象を見ること（見物）。／ある場所の景色や遺跡、名物などを見に回ること（観光）。
구두=主に革を材料にして作られた西洋式の靴。正装や格式を重んじた服装の際によく履く。
구성=いくつかの部分や要素を集めて、一つの全体的な枠組みや体制を作り上げること。または、その体制。／文学や芸術作品において、主題を効果的に表現するために展開される内容の有機的な結合。／団体や組織を構成している人員の状態や仕組み。
구십=「あひん（九十）」の漢字語。八十九に一を足した数（九十）。／（数詞）九十歳を指す言葉。／(数量を表す言葉の前に使われ) 九の十倍の数。主に年齢を表す時、「九十歳」の意味で使われる。
구조=災難や危難に遭って命が危ぶまれる人を救い出すこと。／部分や要素が集まって全体をなすこと。または、そのようにして作られた仕組み（構造 / つくり）。／社会や組織などが、ある枠組みや体系を形成している状態。／建築物や機械装置などが作られた方式や形態。
구체적=物の形や性質が表に直接現れたり、目に見えるように実体があること。／考えや計画などが漠然としておらず、実際的で詳しいこと。／物の姿や内容が直接目で見えたり、体で感じられたりするほどはっきりしていて明白なさま(具体的)。／抽象的または一般的なものではなく、実体があって細部までわたっているさま(具体的)。
구하다=(仕事や人などを)得るために探したり努力したりする。／(お金や品物などを)借りたり買ったりして手に入れる。／(助けや許可などを)願ったり求めたりする。／困難や危険に陥った人を世わしたり、命を救い出したりする。／滅亡や破滅の状態から逃れさせる。
국=肉、魚、野菜などにたっぷりの水を加え、味を調えて煮た料理。韓国の食卓でご飯と共に出される最も基本的な料理の一つ。
국가=一定の領土とそこに住む人々で構成され、主権を持つ統治組織によって治められる社会集団。または国民、領土、主権の三要素を備えた民主的・政治的共同体(国家)。
국민=一国家を構成する人、またはその国家の国籍を持つ人（国民）。／国家の主権者として権利と義務を持つ主体。
국수=小麦粉、そば粉、じゃがいも粉などを練って、型に入れて押し出したり包丁で切ったりして細長く作った食べ物。または、それを茹でて作った食べ物（麺 / ククス）。／（比喩的な表現で）結婚式の時に振る舞う料理を意味し、「結婚」を指す言葉。
국적=一国の構成員となる資格。または、その資格を持つ人の身分（国籍）。／船や飛行機などがどの国に属しているかを示す関係。
국회=国民によって選出された議員を構成員とし、立法および国家の予算案審議、政府監視などの権限を持つ大韓民国の立法府機関（国会）。
군=一定の組織と武器を備え、国家を防御し戦争を遂行する集団（軍 / 軍隊）。／軍隊に関する事務や状態を表す言葉。／(依存名詞) 友人や目下の人の姓や名の後ろに付け、その人を敬って呼ぶ語。主に男性に用いられる。／道（ド）の管轄下にある行政区画の一つ。市（シ）より小さく、複数の邑（ウプ）と面（ミョン）で構成される（郡）。／（歴史的意味）高麗と朝鮮時代に置かれた地方行政区画の一つ。
굳다=柔らかかったものが硬くなる。／表情や態度、意志などが揺るぎなく強くなる。／筋肉や体の一部が突っ張って硬くなる。／雨が降った後、地面の湿気が抜けて固まる。／表情や態度などが和やかさを失い、硬くなる。／意志や決心が揺らがないほど強くなる。／筋肉や体の一部が突っ張るようになる。／状況や基盤が安定する。
귀걸이=耳につける装飾品。主に耳たぶに穴を開けて通したり、クリップのように挟んで固定する形態である。
귀여워하다=可愛がったり愛らしく思ったりして、大切に扱う。／子供や動物、または対象の外見や行動が微笑ましく可愛らしいため、喜びながら可愛がってあげる。
귀찮다=気に入らなかったり、苦しかったり、煩わしかったりして、やりたくない感じがある（面倒だ / おっくうだ）。／ある対象が何度も煩わしく振る舞い、うるさくて嫌だ（厄介だ / 鼻につく）。
규모=物事や現象の範囲や大きさ（規模）。／制度や施設などの外観や仕組み（構え）。
귤=ミカン科の常緑広葉灌木であるミカンの木の果実。形は平らな円形で皮はオレンジ色をしており、味は甘酸っぱい。皮をむいて中身を食べたり、搾ってジュースにして飲んだりする。
그녀=前に述べた、あるいは後に述べる女性を指す三人称代名詞。主に文章で使われる。
그래도=「그리하여도(そうであっても)」の縮約形。前の内容や状況を認めたり仮定したりした状態で、それとは関係なく、あるいはそれに反して次の内容を繋げる時に使う言葉（それでも / それにしても）。
그러다=「そうする」の縮約形。前に述べられた行動や状態をそのまま行ったり維持したりすることを表す。／状態、模様、性質などがそのようである。／ある言葉をそのように言う。
그러하다=状態、形、性質などが、前に述べた内容や対象と同じだ。／事実や状況がそのような状態にある。（主に「그러하다면（そうであるなら）」、「그러하듯이（そうであるように）」などの形で使われ、前の内容を肯定したり前提とする時に使われる）
그룹=共通の目的や性格を持つ人々が集まって作った群れ（グループ / 集団）。／複数の系列会社を従える巨大な企業組織（グループ / 財閥）。／[音楽] 演奏や歌を一緒に行うために結成されたチーム（バンド / ユニット）。
그립다=会いたかったり、見たかったりする気持ちが切実だ。／ある対象や状態が以前のようになることを望んだり、それがなくて惜しい。
그분=「その人」の尊敬語で、話し手と聞き手ではない第三者を敬意を込めて指す代名詞（あの方）。
그저께=今日の二日前になる日（一昨日）。／今日から二日前。昨日の前の日（一昨日）。
그중=範囲が定められた複数のうち。または、その中で一番のもの。
그쪽=指示代名詞：聞き手に近い場所や、聞き手が見ている方向を指す言葉（そちら）。／人称代名詞：相手を高めたり下げたりせず、婉曲に指す時に使う言葉（そちら様 / あなた）。主に同等の関係や面識のない人の間で使われる。／指示代名詞：前ですでに言及された対象や場所、あるいは考えの方向を指す言葉（そちら / その方）。
근데=「그런데（ところで・だが）」の縮約形。前の内容と相反するか、異なる内容を続けて言う時に使う接続副詞。／前の内容を認めながらも、それに対する疑問や新しい話題を引き出す時に使う言葉。／ある事態がすでに起きた後、それが原因となって後の事態が起きることを表す言葉。
글쎄요=相手の問いに対して、はっきりとした答えを出すのが難しかったり、よく分からなかったりする時に躊躇しながら出す声。／相手の提案や意見に対して、素直に同意しにくかったり、拒絶の意を婉曲に表したりする時に使う言葉。／自身の判断が確実でないことを表したり、後に続く言葉を考えたりする時に出す声。
글씨=書かれた文字の形や様子（筆跡 / 書きぶり）。／筆やペンなどで文字を書くこと（習字 / 書くこと）。
금요일=木曜日と土曜日の間の曜日。週の5番目の日（月曜日を始まりとする場合）、あるいは6番目の日（日曜日を始まりとする場合）。
기계=動力を受けて一定の運動を行い、有用な仕事をする装置。／(比喩的に) 主観や意志がなく、環境や他人の指示に従って機械的に動く人。／ある事を行うための組織や機構。／（比喩的に）主観や意識がなく、与えられた通りにだけ動く人を指す言葉。
기관=社会の体系や秩序の中で特定の目的を遂行するために設置された組織や施設。特に公共の利益のための公共機関を指すことが多い。／機械装置で動力を発生させたり、エネルギーを変換したりする装置（エンジン / 機関）。／ある事をするための手段や媒体。
기능=肉体的、精神的な活動を熟練して遂行できる技術的な能力。／物事や組織が本来の目的に応じて作用する役割や働き。／ある物事や組織が本来備えている作用や役割。／権限や職務に従って遂行する活動。／肉体的、精神的な能力や技術的な熟練度。
기록=主に後日に残すために、ある事実や内容を文章や映像などで書き留めたり残したりすること。または、そのように書かれた文章。／スポーツの試合や技術などで、成績や結果を数値で表したもの。／歴史的な事実を記した文書や本。
기말시험=学期や教育課程の終わりに、それまで学んだ内容を評価するために行う試験（期末試験）。
기본=物事や現象、事業、学問などで、最も中心となり土台となるもの（基本 / 基礎）。／あることをするために、まず最初に備えるべき条件や姿勢（基本）。
기뻐하다=嬉しい出来事や状況に直面し、心の中で喜んだり、外に喜びの表情を表したりする。／（主に他人の行動や状態について）満足に思ったり、良く考えたりする。
기숙사=学校や会社などで、学生や社員に寝食を提供するために建てられた建物。多くの人が共同で生活し、規律に従って過ごすことになる(寄宿舎 / 寮)。
기술=物事をうまく扱ったり、あることを熟練した手つきでやり遂げたりする方法や手段。／科学理論を適用して、物事を人間の生活に役立つように加工する手段。／ある目標を達成するための具体的な腕前や才芸。
기억나다=以前の姿、事実、知識、経験などが頭の中に再び浮かぶ（思い出す / 覚えている）。
기업=利潤を得るために財貨やサービスを生産・販売する組織体系。営利を目的として運営される事業単位。
기준=物事の程度や性格などを知るための根拠や尺度。／行動や判断の基礎となる核心的な原則。
기차=レールの上を走る車両を数台連結し、人や物を運ぶ交通手段。かつては蒸気機関で動いていたが、今日では主にディーゼルエンジンや電気を動力として使用する（汽車 / 列車）。
기차역=汽車が止まり、乗客が乗り降りしたり、荷物を積み降ろししたりする場所(駅)。
기차표=列車に搭乗するために一定の料金を支払って購入する証票(乗車券)。
기침=肺や気管支などの呼吸器官に異物や刺激が加わったとき、これを外に吐き出そうとする反射的な行動。またはその音（せき）。
기타=それ以外の別のもの。「そのほか」「など」の意味で使われる。／(音楽) 六弦琴。木製の箱型の胴体に長いネックとフレットがあり、通常6本の弦を指やピックで弾いて音を出す弦楽器。
김=海藻の一種で、海水の中の岩などに苔のように付着して育つ植物。普通、乾燥させて薄く加工し、おかずとして食べる（海苔）。／ある事や機会のついでに、という意味を表す言葉。主に「-는/은/던 김에」の形で使われ、ある行動をする機会を利用して他の事まで合わせて行うことを表す。／液体が熱を受けて気体に変わったもの。（水蒸気）／気温差によって窓ガラスや眼鏡のレンズなどに白く曇るもの。／（比喩的）熱気や気配を指す言葉。
김밥=海苔の上に米飯を薄く広げ、様々な具材（ほうれん草、たくあん、人参、卵、肉など）をのせて丸く巻き、一口大に切った韓国の料理。
김치찌개=キムチを主な材料とし、豚肉、脂身、豆腐、野菜などを入れて、汁を少なめにし、塩味をきかせて煮込んだ韓国を代表する料理。
까닭=ある出来事が生じるようになった理由や事情（わけ / 理由）。／ある現象が現れるようになった根拠（根拠 / 由来）。
까만색=光が全くない夜の闇のように、非常に暗くて濃い色。「검은색（黒色）」よりも鮮やかで濃い感じを与える。
까맣다=光が全くないか、夜空のように色が非常に黒い（真っ黒だ）。／目がかすんだり目眩がしたりして、一時的に目の前が見えない状態だ（真っ暗だ）。／距離や時間が非常に遠くてはるかだ（はるか遠い）。／すっかり忘れてしまったり、全く知らない状態を意味する（全く…ない）。
깜짝=突然ひどく驚く様子。／目を一度そっと閉じて開ける様子。
깨닫다=物事の道理や真理をはっきりと知るようになる（悟る / 覚る）。／過ちや欠点を深く感じたり知るようになる（悟る / 覚る）。／感覚器官を通じて何かを察したり感じたりする（気づく）。
껌=チクルなどに香料や砂糖などを混ぜて作り、口に入れて甘みがなくなるまで噛み続けるもの（ガム）。／（比喩的に）非常に簡単で、甘く見ることができる仕事や対象のこと。
꽃다발=数輪の花を束ねて作ったもの。主に祝賀、感謝、愛などの気持ちを伝えるための贈り物として使われる(花束)。
꽃병=花を生けておくために作られた瓶（花瓶）。
꽃집=花を専門に売る店（花屋）。
꾸다=眠っている間に夢を見る（夢を見る）。／将来の希望や理想を心に抱く。／後で返すことにして、他人のものを一時的に借りて使う。主に金や物などを借りる時に使う。
끌다=床に触れた状態で引っ張って動かす(引く / 引きずる)。／靴を完全にはかずに、かかとを踏んだり床にこすりつけたりして歩く(突っ掛ける / 引きずる)。／時間や期限を遅らせたり延ばしたりする(長引かせる / 引き延ばす)。／注意、関心、興味などを向けさせる(惹きつける / 引く)。／車や機械などを動かすために、先頭に立って引っ張る(引く / 牽引する)。
끓다=液体が熱を受けて気泡が発生し、渦巻く（沸騰する / 煮える）。／液体や食べ物などが熱く加熱される（煮え立つ / 沸く）。／(比喩的) 感情や元気がひどく激しくなる（たぎる / 煮えくり返る）。／(比喩的) 多くの人や虫などが一箇所に非常にたくさん集まって騒がしく動き回る（たかる / 沸く）。
나름=(主に「-기 나름이다」の形で使われ) 前の言葉が表す行動や状態のいかんによっていることを表す語。／(主に「나름」、「나름의」の形で使われ) それ自体が持っている固有のやり方や特性。
나서다=中から外へ出る（出向く）。／ある事に直接参加したり、先頭に立ったりする。／ある場所に現れたり、顔を見せたりする。／ある状態や現象が新しく生じたり現れたりする。
나아가다=前を向いて進んでいく。／目的とする方向や、より高い段階へと進む。／ある物事や状況が発展的に進展する。
나타내다=見えなかった姿や対象を表に現れさせる（現す / 出す）。／考えや感情を文章、絵、身振りなどで表現して知らせる（表す / 表現する）。／ある現象や結果が数値や兆候として現れる（示す）。／ある性質や特徴を持っている（示す / 帯びる）。
나흘=毎月の四日。
날씬하다=体が程よく細くて長い（すらりとしている / スレンダーだ）。／物の形が幅が狭く、すっきりと長い。
날아다니다=空中を飛んであち코ちへ移動したり、あちこちを行ったり来たりする。／（比喩的に）非常に速く敏捷に動く。
날짜=ある年、ある月、ある日の数（日付）。／特定の出来事が起こるように決められた日（期日）。
남대문=ソウルの都城の四大門のうち、南側にある正門。朝鮮王朝の太祖7年に建立され、国宝第1号に指定されている。公式名称は「崇礼門（スンネムン）」である。／（比喩的な表現）ズボンの前ファスナーを滑稽に言う言葉。／ソウル都城の四大門のうち、南側にある正門。朝鮮時代の太祖7年(1398年)に完工し、国宝第1号に指定されている。公式名称は「崇礼門」である。／ソウル特別市中区南大門路にある市場を指す言葉。（南大門市場）／(比喩的) ズボンのフロントジッパーを滑稽に呼ぶ言葉。
남대문시장=ソウル特別市中区南大門路を中心に形成された韓国最大規模の伝統総合市場。朝鮮時代から続く悠久の歴史を持ち、衣類、アクセサリー、厨房用品、農水産物など様々な商品を取り扱う。
남동생=同じ親から生まれた兄弟の中で、自分より年下の男性をいう言葉(弟)。
남산=ソウル特別市の中心部にある山。頂上にはNソウルタワーがあり、ソウルの代表的なランドマークであり休息の場である。／ある地域の南側にある山を一般的に指す言葉。／目の前の山（アプサン）を遠回しに言う言葉。／ソウル特別市の中心部に位置する山（海抜262m）。山頂にはNソウルタワーがあり、ソウルの象徴的なランドマークの一つである。／前方の山や南側にある山を一般的かつ通俗的に指す言葉。（韓国の多くの地域に「南山」という地名が存在する。）
남학생=学校に通う男子学生（男子生徒）。
낮잠=昼間に少し眠ること。主に疲労を解消したり休息を取ったりするために、日中の時間帯にとる睡眠を意味する(昼寝)。
낳다=お腹の中の子、子、卵を体外に出す（産む）。／ある結果や現象をもたらしたり成し遂げたりする（生む）。／ある人物を輩出する（生む）。
내과=医療機関で手術を行わず、主に薬の処方や注射などを通じて身体内部器官の疾患を診療し治療する専門分野。または、その部署や病院（内科）。
내놓다=中にあったものを外へ移し置く（出す）。／商品や品物などを市場で売るために出す（売りに出す）。／作品、成果物、意見などを世の中に公表したり発表したりする。／持っていたものを他人に与えたり捧げたりする。
냄비=食べ物を煮たり温めたりするのに使う調理器具。普通は金属製で、あまり深くなく、取っ手と蓋がついている(鍋)。／(比喩的) ある事柄に対してすぐに熱くなり、すぐに冷めてしまう性質や現象を指す言葉。
냉면=冷たく冷やしたスープや水キムチ（ドンチミ）の汁に麺を入れ、薬味や具をのせて作った韓国の伝統料理。そば粉を主原料とし、タレで和えて食べるビビン冷麺と、冷たいスープに入った水冷麺が代表的である。
냉장고=食べ物が腐らないように冷たく保管するため、一定の温度を維持するように作られた機械装置（冷蔵庫）。
너무나=ある程度の限界をはるかに超えた状態を強調して表す言葉。（主に形容詞や副詞の前に使われ、「とても（あまりに）」をさらに強調する時に使われる。）
넘어지다=立っていた人や物がバランスを崩して地面に倒れる。／していたことが失敗したり、計画が水の泡になったりする。／（比喩的に）外部の力や誘惑に屈する。
넥타이=洋服を着る際、ワイシャツの襟の下に回して首の正面で結んで垂らす長い布。装飾や礼儀を整えるために使用する(ネクタイ)。
넷=数量を表す際、「三つ」に「一つ」を足した数（四 / 四つ）。／順番を表す際、「三番目」の次を意味する数（四番目）。
넷째=順番が四番目になる番（四番目）。／（学校の授業などで）四時間目。／順番が四番目になることを表す言葉。（冠形詞：主に後ろに来る名詞を修飾する。）／順番が四番目になる順序。または、その順序に当たる人や物。（名詞）／順番が四番目になる順序。／（数詞の後に使われ）数や量を四つに分けたうちの一つ。／学校の授業時間などで、四時間目の授業を指す言葉。
년대=(依存名詞) 西暦年の10の位の数字の後に使われ、その数字が表す年から次の9年目までの10年間の期間を表す言葉。
노동=人が生活に必要な物資を得るために肉体的努力や精神的努力を注ぐ行為。／体を動かして働くこと。／[経済] 生産の一要素として、人の労働力を投入する過程。
노동자=労働力を提供し、 그対価として賃金を受け取って生活する人。肉体労働だけでなく精神労働を行う人を総称する言葉。
노란색=光のスペクトルでオレンジ色と緑色の間にある色。熟したバナナやレンギョウの花の色と同じである。
노랗다=レンギョウの花やひよこの色のように、明るく鮮やかな黄色を帯びている。／（比喩的に）恐怖や疲労などのために、顔に元気がなく青白い。
노래방=伴奏装置が設置された部屋で、料金を払って歌を歌えるように設備を整えた場所（カラオケボックス）。
노래하다=歌詞に曲をつけて声で音を出す（歌う）。／詩や文章などの文学作品を通じて、ある対象や感情を表現する（謳う）。／鳥や虫などが美しい声を出す（さえずる）。
노력하다=目的を果たすために、心身を尽くして励む（努力する）。
노트=講義や演説、考えた内容などを書き留められるように紙を綴じて作った本（ノート / 冊子）。／ある内容を覚えたり残したりするために短く書いた文章（メモ / 備忘録）。／コンピュータのデータやプログラムを一時的に記録しておく空間、または携帯用個人コンピュータ（ノートパソコン）の略称。
녹색=青色と黄色の中間色で、新鮮な草の葉や木の葉のような色。緑色（チョロクセク）と同じ意味で使われる。
녹차=緑色が出るように乾燥させた茶葉、またはその茶葉を淹れた水。茶葉を摘んですぐに釜で炒ったり蒸したりして、発酵させないように作った茶のこと。
농구=5人ずつで構成された2つのチームがコートでボールを手で扱い、相手チームのバスケットにボールを入れて得点を競う球技。／5人ずつで構成された2つのチームが、相手チームのバスケットにボールを投げ入れて得点を競う球技種目。
농담=ふざけてからかったり、冗談で言う言葉。／相手を楽しませたり、場の空気を和らげるために言う滑稽な言葉。
농민=農業を業とする人（農民）。
농업=土地を利用して人間の生活に必要な植物（穀物、野菜、果物など）を栽培したり、動物を飼育したりする産業。
높이다=下から上までの長さを長くする（「高い」の使役動詞）。／品質、水準、能力、価値などを良い状態にする。／音の大きさを大きくしたり、音調を高くしたりする。／人を尊敬したり、礼儀を尽くしてもてなしたりする。
느껴지다=体の感覚器官を通じて、ある刺激や状態が感知される。／心の中に、ある感情や気分、雰囲気などが生まれる。／ある物事や現象が、どのようなものとして認識されたり考えられたりする。
느리다=動きや仕事の速度が普通の程度に及ばないほど長い(遅い)。／性格や態度が急がず、ゆとりがある(のんびりしている)。／音や呼吸の間隔が長い。
늘어나다=長さ、広さ、体積などが本来より長くなったり大きくなったりする。／数量や分量、程度が元より多くなったり大きくなったりする。／力や気力、実力などが以前より良くなる。／時間や期間が元より長くなる。
다루다=道具や機械などを使ったり操作したりする。／人や動物を一定の態度で接する、あしらう。／ある事件や問題を素材にしたり、解決したりする。／業務や仕事を担当して行う。
다림질=アイロンを使って服や布のしわを伸ばしたり、折り目をつけたりすること（アイロンがけ）。
다만=ただ、単にそれだけであることを表す言葉。／前の言葉に対して、例外的な条件や補足説明を付け加える時に使う言葉。
다섯=数の名前。4に1を足した数（基数）。／順序や順番を表す際、5番目になるもの（序数）。／(冠形詞) 数量が五であることを表す言葉。後に来る名詞（数量単位など）を修飾する。
다섯째=(数詞) 順序が五番目になる順番。／(名詞) 五番目の人、または物。／(名詞) 五番目の子供。／順番が五番目になる順序。／五番目になる人や物。／(名詞の後で冠飾語的に使われ) 五番目の。／順序が五番目になる順番であることを表す言葉。／五番目の人であることを表す言葉。
다양=形、色、形態、様式などがいろいろで多いこと。物事や現象の種類が様々である状態。
다양하다=形、色、形態、種類などがいろいろあって多い（多様だ）。
다음날=決められた日や、ある出来事があった日のすぐ後の日（翌日）。
다이어트=食べ物の種類や量を調節して体重を減らしたり, 健康を維持しようとすること(ダイエット)。／(比喩的に) 放漫な経営や不必要な要素を減らして効率を高めること。
다치다=ぶつかったり、打たれたりして、体に傷ができる(傷つく / けがをする)。／物がぶつかって壊れたり、使えなくなったりする(傷つく / 損なわれる)。／(比喩的に)自尊心や心、名誉などが傷を負う(傷つく)。
단계=物事の順序や過程で経るべき一定の地点や区間（段階 / ステップ）。／物事の発展や現象の進行過程で現れる特定の状態（段階）。／[数学] ある目的に到達するために経ることになる個別的な過程（段階）。
단순=他のものが混ざっておらず、純粋な状態。／考えや態度が深くなく、平凡な状態。
단체=同じ目的を達成するために、二人以上の人が集まって結成した集団や組織。／個人ではなく、多くの人の集まりであるという性質。
단추=服や鞄などの開いた部分を留めるために付ける小さくて丸い物。穴に通したり、かみ合わせたりするようになっている(ボタン)。／(比喩的に) 物事を始める最初の段階やきっかけ。
단풍=気候の変化で植物の葉が赤や黄色などに変わる現象。または、そのように変わった葉(紅葉)。／カエデ科の落葉広葉高木。葉は手のひらのような形に分かれ、秋に赤く色づく(カエデ)。
달라지다=変わり、前と違うようになる。（状態、性質、模様などが変わること）／場所や状況がほかの場所へ移されたり、変わったりする。
달력=一年間の日月火水木金土の日付と曜日を順に記した表（カレンダー）。
달리=普通の物や状態とは異なって。／先に述べた内容や事実とは違って。／(「달리 하다」の形で使われ) ある状態や基準を別なものに変える。
달리기=人や動物が足を速く動かして速度を出し、走ること。／一定の距離を走り、その速さを競う競技。
닭=キジ科に属する家禽用の鳥。くちばしが短くて硬く、翼は退化してあまり飛ぶことができない。肉と卵を得るために世界中で広く飼育されている。／(比喩的に) 愚かな人や臆病な人をからかって言う言葉。／十二支の10番目である「酉(とり)」を象徴する動物。
닭고기=鶏の体から得られる肉。主に食用として使われ、タンパク質が豊富だ。
담다=ある物を器や袋などの 中に入れる。／ある内容や思想、感情などを文章、絵、言葉、表情の中に表したり含めたりする。／あるものを一定の範囲や限度の中に入れる。
답=問いや質問に対して反応して返す言葉や文章（答え / 返答）。／ある問題や要求を解決するための工夫や結果（解決策 / 解答）。／数学などで計算や解法の結果として得られる数値や式（答え）。／（比喩的）先が見えなかったり解決の兆しがない状況で使われ、解決策がないことを指す。
답장=他人から来た手紙、電話、メッセージなどに対して返事を書いて送る文。または、その文を送ること。
당시=ある出来事が起こったその時期や時（当時）。
당신=二人称代名詞：聞き手を敬って呼ぶ言葉。主に夫婦の間で相手を呼んだり、文語体で読者を指す時に使う。／二人称代名詞（格下げ）：喧嘩などの際、相手を見下して呼ぶ言葉。／三人称再帰代名詞：前に述べた、自分より目上の人を再び指す言葉。（極尊称）
당하다=（否定的なことを）経験したり、被ったりする。主に事故、損害、侮辱など良くないことに使われる。／（相手の力や能力に）立ち向かったり、打ち勝ったりする。主に「당해 내다（太刀打ちする）」の形や、否定語と共に使われる。／当然そうあるべき立場にある。または、その資格に該当する。
대구=慶尚北道の中央部に位置する広域市。繊維産業とリンゴで有名で、夏の気温が非常に高く「テプリカ（大邱＋アフリカ）」という別名がある。／タラ科の海水魚。口が大きく、味が淡泊で、スープや蒸し料理に主に使われる。／詩や文章において、前後の句を同じ格で対置させること。またはそのような修辞法（対句）。／大韓民国の東南部内陸に位置する広域市。嶺南地方の政治、経済、文化の中心地の一つであり、古くから繊維産業とリンゴで有名だった。
대다=ある物体を別の物体に触れさせたり、つけたりする。／決められた時間や数値などに合わせる。／決められた場所に届けたり、とどまらせたりする。（例：乗り物を止める）／金銭や品物などを供給したり、足してあげたりする。
대로=広く大きな道（大通り）。／ある状態や行動が現れるやいなや、またはそれと同じように。／ある形や状態と同じように。／ある状態が終わるとすぐ。／ある状態が非常に激しいことを表す言葉。／(語尾「-는/-은」の後に使われ) できる限り最大限。
대사관=一国を代表して他国に派遣された大使が職무を執る機関。またはその建物。主に相手国の首都に位置し、自国の国民を保護し外交政策を遂行する(大使館)。
대신=ある対象や人物を入れ替えて、その位置に置くこと。または、そのようになった人や物(代わり / 代用)。／あることの補償や代償として、別のことをすること。
대전=大韓民国の中央部に位置する広域市。京釜線と湖南線の鉄道が分岐する交通の要衝であり、大徳研究団地がある科学技術の中心都市である。／大韓民国の中部に位置する広域市。忠清南道の道庁所在地であり、現在は行政、教育、科学技術の中心地かつ交通の要衝地である。
대중=人々の大きな群れ。／社会の大多数を占める一般の人々。特定の階層や集団に属さない普遍的な人々。／[仏教] 仏の教えを聞くために集まった多くの人々。
대책=ある困難な状況を乗り越えたり、対処したりするための計画や手段(対策)。
대통령=共和国体制の国家において、国家の元首であり行政部の首班として国家を統治する最高の統治権者。国民の選挙を通じて選出されるのが一般的である。
대표=ある組織や団体を代表して、その性格をよく表したり、その意見を代변したりする人（代表者）。／色々なものの中で、その状態や性質を最も典型的に表しているもの。／スポーツの試合や大会などで、国や団体を象徴して出場する人。／(法律) 法人の活動を代行し、その行為が直接法人に対して効力を発生させる人。
대하다=ある対象や人と向き合ったり、顔を向けたりする。／人や物事に対し、一定の態度で接したり扱ったりする。／ある事実や現象に向き合ったり、接したりする。／（主に「～に対して」の形で使われ）ある物や事件を対象とする。
대학교=高等学校を卒業した人、またはそれと同等の学力を持つ人が入学し、専門的な知識や技術を学び研究する高等教育機関（大学）。
대학원=大学を卒業した人、またはそれと同等の学力があると認められた人を対象に、学問の理論と方法をより深く教授・研究し、指導力と創造力を備えた人材を養成するための教育機関。修士課程と博士課程がある。
더럽다=物や場所などに異物が付着していたり、散らかっていたりして不潔だ（汚い）。／言葉や行動、性質などが端正でなかったり、不快なほど悪かったりする（卑しい / 汚い）。／物事や状況が気に入らず、劣っている。
덕분=他人から受けた恩恵や助け。（主に「덕분에（おかげで）」、「덕분이다（おかげだ）」の形で使われ、肯定的な結果の原因を表す。）／（主に「-은/는/을 덕분에」の構成で使われ）ある物事や状況が良い結果をもたらす原因になることを表す言葉。
덥다=気温が高くて体に熱気を感じる。（主に天気や気温について使う）
데=所や場所。／事や物事。／場合や境遇、状況。
데려가다=人や動物を自分と一緒にいさせて、別の場所へ移して行く（連れていく）。／ある人を自分の味方や一行にして一緒に行く（連れていく / 同행する）。
데려오다=人や動物をある場所から自分がいる場所に来させる（連れてくる）。／ある人を自分の勢力や一員として引き入れる（招き入れる / 引き抜く）。
데이트=男女が互いに会って情を交わしたり、楽しい時間を過ごすこと。または、そのような会合（デート）。／気の合う人たちが集まって楽しく遊ぶこと。
도대체=(疑問文で) 疑問に思うことを強く問いただす時に使う言葉。全く分からなかったり、もどかしかったりすることを表す。／(否定文で) いくらやっても、到底。／(平叙文で) 全体をひっくるめて、大まかに言えば。
도착=目的地にたどり着くこと（到着）。／ある場所や状態に至ること。
독서=本を読むこと(読書)。
독일=ヨーロッパ中部に位置する国。首都はベルリンで、機械工業や化学工業などが発達した先進工業国である。第二次世界大戦後、東ドイツと西ドイツに分かれたが、1990年に統一された。／ヨーロッパ中部に位置する国。第二次世界大戦後、東西に分断されたが1990年に再統一された。主な産業として自動車、機械、化学などが発達しており、首都はベルリンである。
돈가스=豚肉を厚く切り、小麦粉、卵、パン粉をつけて油で揚げた料理。西洋のカツレツ(cutlet)から由来し、日本を経て韓国に定착した食べ物である。
돌려주다=借りたものや他人が持っていたものを、元の持ち主や元あった場所に再び戻す（返す）。／（ある権利や資格を）再び回復させたり、元の状態に戻したりする。
동대문=ソウル城郭の八大門の一つである「興仁之門(フンインジムン)」の日常的な呼び名。ソウル特別市鍾路区鍾路6街に位置し、宝物第1号に指定されている。／ソウル特別市東大門区にある地下鉄駅(東大門駅)およびその周辺の大規模な在来市場とファッションタウンを網羅する地域を総称する言葉。／大韓民国ソウル特別市鐘路区にある朝鮮時代の城門。本来の名前は興仁之門（フンインジムン）であり、宝物第1号に指定されている。／上記の城門周辺に形成された大規模な在来市場およびショッピング団地（東大門市場）を総称する言葉。
동물원=様々な野生動物を飼育し、人々に観覧させたり、動物の生態を研究・保護したりするために施設を整えた場所(動物園)。
동전=銅、ニッケル、亜鉛、アルミニウムなどの金属を溶かして丸く作ったお金。紙幣と違って金属でできているため「銅貨(硬貨)」と呼ばれ、10ウォン、50ウォン、100ウォン、500ウォン硬貨などがある。
돼지=イノシシ科に属し、肉を得るために家庭で飼育される家畜。体が太っており、鼻先が長く、尻尾は短く巻いている。雑食性である。／(比喩的) 食べ物を貪欲にたくさん食べたり、体が太っている人をからかって呼ぶ言葉。
돼지고기=豚の体から得られる肉。食用として広く使われ、サムギョプサル（バラ肉）、肩ロース、ヒレなど様々な部位がある。
된장=水に浸した大豆を煮てメジュ(味噌玉)を作り、これを塩水に漬けて発酵させた後、醤油を抜いて残った固形物を別に集めて熟成させた韓国伝統の味噌。／主にチゲやスープの味付けをしたり、野菜などをつけて食べる調味料の材料として使われる。
된장찌개=味噌を水に溶かし、肉、野菜、豆腐などを入れて塩味を効かせて煮込んだ韓国の伝統的なチゲ。
두껍다=物の厚さが普通の水準より大きい。（例：本、紙、板など）／層や積み重なったものの高さが高い。（例：氷、雲、唇など）／霧が濃かったり、暗闇が深かったりする。／人の上半身や身体の一部が丈夫で太い。
두부=水に浸した大豆を挽いて搾り出した豆乳を沸騰させた後、にがりを入れて固めて作った食べ物。タンパク質が豊富で、柔らかい食感が特徴である。
두세=「2」や「3」程度の数であることを表す語。数量を見計らって言う時に使う(二、三の / 二つ三つの)。
두통=頭が痛い症状。脳の疾患や身体的な疲労、ストレスなど、多様な原因によって現れる。
뒤쪽=向いている方向や進む方向とは反対の方向（後ろ / 背後）。／物体の背や背面がある方向（裏側 / 後方）。
드러나다=隠されていたり見えなかったものが、姿や形を現す。／知られていなかった事実や秘密、実体などが広く知れ渡る。／表面にある特徴や態度が現れる。
들어서다=外から中へ移動したり、中に入ってきたりする。／ある場所や空間に建物、施設、家具などが設置されたり、位置を占めたりする。／ある時期、時点、または状態が始まる。／子を宿す（妊娠する）。
듯이=(主に語尾「-은/-는/-을」の後に使われ) 推測や推量の意を表す言葉。「듯」の強調形。／(主に語尾「-듯」と同じ意味で) 後ろの内容が前の内容とほぼ同じであることを表す言葉。
등산=運動や余暇を目的として山に登ること（登山）。
디자인=衣類、工業製品、建築物などの実用的な目的のために、その形や色彩などを造形的に計画し設計すること。または、その結果。／ある計画や構想を視覚的に表現すること。
따라서=前に述べた内容が、後に続く内容の原因や条件になる時に使う言葉。（前の事実による結論を導き出す時に使用）／ある対象の動作や変化に続いて一緒に行動したり、その状況に合わせて変化したりする時に使う言葉。
따르다=液体や粉末などを別の場所へ移し入れる（注ぐ）。／（人や物体が）誰かの後ろについて行く（従う / ついて行く）。／慣習、規定、命令、意見などをそのまま実行したり従ったりする。／因果関係によってある現象が発生したり伴ったりする。／懐いて親しく接し、そばに寄り添う。／先行するものに付き従って行く。(物理的な移動)／慣習、規則、命令などをそのまま守ったり、従ったりする。／ある人や思想を手本にして、その通りにする。／ある対象の変化に合わせて他の対象が変化したり、続いて起きたりする。／器に入った液体を別の場所へ移し注ぐ。
딸기=バラ科の多年草、またはその実。種が表面に付いており、味が甘くて香りのよい赤い果物だ。
떠들다=声を張り上げて大きな声で話す(騒ぐ / 喚く)。／雰囲気が乱れるほど騒がしく振る舞う(騒ぎ立てる)。／ある事柄について多くの人の噂になるほど言いふらしたり、話題にしたりする。
떠오르다=下から上へ上がってくる（浮かび上がる）。／太陽や月、星などが空に現れる（昇る）。／考え、記憶、アイデアなどが突然頭の中に現れる（思い浮かぶ）。／ある現象や対象が社会的な関心の対象になったり、頭角を現したりする（台頭する / 浮상する）。
떡국=カレトック（棒状の餅）を薄く斜め切りにして澄んだスープに入れ、煮た料理。韓国で正月の朝に名節料理として必ず食べる伝統料理である。
떡볶이=適当な大きさに切ったトック（韓国の餅）をコチュジャンや醤油などの調味料に入れ、野菜や魚肉ねり製品などと一緒に炒めたり煮たりして作った料理。
떼다=付いているものや、つながっているものを離す。／全体から一部を減らす（差し引く）。／小切手や証明書などを発行したり、発行してもらったりする。／一緒にいた人を後に残したり、まいたりする。／学んでいたことを終えたり、マスターしたりする。
또한=あるものを含め、その上にさらに加えること（も、また、やはり）。／前の内容に付け加えて言う時に使う接続副詞（さらに、なお、その上）。
똑똑하다=頭が良く、理解力や判断力が優れている（賢い / 利口だ）。／言葉や行動、音などがはっきりしていて明료だ（明瞭だ / はっきりしている）。
똑바로=曲がったり歪んだりせず、まっすぐに。／物体や現象を正しい状態で向き合ったり見つめたりする様子。／言葉や行動などを正しく、あるいは明確にする様子。／ある場所に向かって真っ直ぐ進む様子.
뚱뚱하다=太っていて体が大きく、肥満している。／物体の体積が大きくて厚みがある。
뛰어가다=走っていく。速い速度で足を運び、目的地に向かって移動する。
러시아=欧州の東部とアジアの北部にまたがる、世界で最も面積の広い国。首都はモスクワで、正式名称はロシア連邦（Russian Federation）。／東ヨーロッパと北アジアにまたがる国。世界で最も広い領土を持つ国家で、首都はモスクワである。
레스토랑=洋風の食事を提供する専門の飲食店。格式高い雰囲気の中で、多様な料理や飲料を販売する場所を指す。
마련하다=物や状況を整えて準備すること。／お金や財産を集めて備えること。／考えや計画を立てて決めること。
마중=来る人を迎えるために出向くこと。
마찬가지=物の形や事の状態が互いに同じであること。または、以前と変わりないこと。
마치=実際とは異なったり事実ではなかったりするにもかかわらず、状態や様子が他のものとほとんど似ていることを表す言葉。一般的に「～のようだ」「～のようだ」「～のように」などと共に使われ、比喩を表す。
마트=食料品、生活用品、雑貨などを大量に備え、消費者に直接販売する大規模な割引店やスーパーマーケットを意味する。
마흔=10의 4倍になる数。または40個の数量を表す言葉。／(冠形詞) 数量の「40」を表す言葉。後ろに来る名詞を修飾し、その数が40であることを意味する。
막걸리=韓国の伝統酒の一つ。米や小麦などの穀物を蒸して麹と水を混ぜて発酵させた後、清酒を濾さずに濁ったまま濾した酒のことをいう。アルコール度数が低く、味が香ばしくて乳白色を帯びている。
막다=穴や通路などが通らないように埋めたり遮ったりする。／外部の空気や音、光などが入ってこないように遮断する(防ぐ)。／他人の言葉や行動、流れなどを中断させたりできないようにする(止める)。／迫りくる困難や被害などをあらかじめ防御したり避けたりする(防ぐ)。
만두=小麦粉などを練って薄く伸ばした皮に、肉、野菜、豆腐など様々な材料を混ぜた餡を包み、蒸したり、焼いたり、茹でたり、スープに入れたりして食べる料理。
만들어지다=努力や技術を通じて、新しい物や状態が生じるようになる。（「作る」の受動態）／ある材料や成分で構成される。／新しい団体、制度、法則などが立てられたり備えられたりする。／人の性格、習慣、態度などが形成される。
만큼=前の内容に相当する数量や程度であることを表す語。／あとにくる内容の原因や根拠になることを表す語。
말레이시아=東南アジアのマレー半島南部とボルネオ島北部にまたがる国。首都はクアラルンプールで、多様な人種と文化が共存する連邦立憲君主制国家である。
맛없다=食べ物の味が良くない(まずい)。／何ら楽しさや興味がない(つまらない)。
맡다=責任や任務を引き受ける（担当する）。／ある物を保管したり管理したりする（預かる）。／鼻でにおいを感じる（嗅ぐ）。／許可や承認を得る。／鼻で香りや臭いを感じる（嗅ぐ）。／ある仕事や責任を自分のものとして処理する（引き受ける / 担当する）。／物を保管したり、保証を受けたりする（預かる）。／機会や気配を察知する（嗅ぎつける / 察する）。
매년=一年一年、毎年。／毎年。(年を欠かさず、一年一年続けて。)
매다=紐や糸などの両端を掛け合わせて引き、結び目を作る。／解けないように紐や縄で縛る。／服や靴などを体に固定するために紐を巻いたり結んだりする。／家畜を柱や杭などに紐でつないで留めておく canvas。
매달=月ごとに欠かさず（毎月）。／それぞれの月。または、月ごとに（毎月）。
매주=1. [名詞] 各週。またはすべての週。 2. [副詞] 毎週欠かさず。／毎週。一週間ごとに。一つ一つの週ごとに欠かさず。
매표소=切符やチケットを売る所。主に劇場、駅、競技場、公園などの入り口に設けられている(チケット売り場 / 券売所)。
맥주=麦を発芽させた麦芽(モルト)を煮て汁を出し、そこにホップを入れて特有の香りと苦味を出し、酵母で発酵させたお酒。アルコール分が少なく炭酸ガスが含まれているため、清涼感がある。
맵다=唐辛子やニンニク、マスタードなどのように、舌先を刺すような刺激的な味がある（辛い）。／煙などが目を刺激して、涙が出るほど痛い。／気性や仕事の仕方がきびきびしていて、手ごわい。／天気が体が縮こまるほど非常に寒い。
머리카락=人の頭に生える毛（主に一本一本の毛筋、または全体的な髪質を指す）。
멋=身なりや行動、態度などが洗練されていて美しいこと（粋 / お洒落）。／その場にふさわしい風情や趣（風情 / 趣）。／（主に「멋을 내다」の形で使われ）外見を飾り立てて目立たせること（おめかし）。
멋있다=姿や身なり、行動などが見た目に非常に良く、立派だ。／品格があり、ロマンチックな感じがある。
메뉴=食堂などで客が選べるように用意した料理の種類と価格を記したリスト（メニュー / 献立表）。／コンピュータープログラムやオペレーティングシステムで、ユーザーが選択して実行できるように並べた機能のリスト（メニュー）。／（比喩的に）ある事柄や計画の内容、または項目。
메다=肩に掛けたり載せたりする。／ある責任や任務を引き受ける。
메모=他人に伝えたり、後で思い出すために短く書き留めた文（メモ）。／忘れないように記録する行為（メモすること）。
메시지=言葉や文章で伝える便りや情報（メッセージ）。／ある個人や団体が聴衆に伝えようとする主張や教訓的な意味（メッセージ）。
메일=インターネットやコンピュータ通信網を通じて手紙や情報をやり取りするシステム。または、そのようにしてやり取りされる手紙。「電子メール（電子郵便）」と言い換えられることもある。
면=物の表面や底面。／立体図形を構成する平らな部分。／紙、本、新聞などの片面、またはページ。／ある物事や現象の一側面。／壁の底面や平らな表面。／木綿の綿を原料にして作った糸や布。一般的に「ムミョン（無名）」とも呼ばれる。／ワタの実から取った綿。／郡(グン)の下にある地方行政区画の一つ。 邑(ウプ)より小さく、複数の里(リ)で構成される(面/ミョン)。
명절=伝統的に毎年決まった日に祝い、楽しむ記念日。旧正月（ソルラル）、秋夕（チュソク）、端午（タノ）、寒食（ハンシク）などがある。
모기=双翅目（ハエ目）カ科に属する昆虫の総称。雌は口吻でヒトや動物の血を吸い、その過程でかゆみを引き起こしたり、伝染病を媒介したりもする。
모레=明後日。／明日の次の日。今日から二日後の日(あさって)。
모자=礼儀を整えたり、寒さ、暑さ、ほこりなどを防ぐために頭に被るもの（帽子）。／母親と息子を合わせていう語。
모자라다=基準となる数量や程度に達しない（足りない / 不足する）。／知能や能力が正常な水準より低い（足りない / 抜けている）。
목걸이=首にかける装飾品。金、銀、宝石、真珠などを糸や鎖に通して作る(ネックレス)。／(比喩的な意味) ある物が首にかかっている状態や形を指す言葉。
목도리=寒さを防いだり、おしゃれをしたりするために首に巻く、布や毛でできたもの（マフラー）。
목요일=一週間の七日のうち、水曜日の次の日で、金曜日の前の日（木曜日）。
목욕=体全体を水で洗うこと（入浴 / お風呂）。／(比喩的に) ある状態や雰囲気にどっぷりと浸かること。
목욕탕=体を洗える施設を備え、料金を取って人を入れる場所(銭湯 / お風呂屋)。／家の中や建物の中に、体を洗えるように施設を整えた部屋(浴室 / お風呂場)。
목표=ある目的を達成するために目指す、実際の対象。／到達すべき場所や地点。／行動や活動が目指す最終的な成果。
못생기다=顔立ちに品がなく、見た目が醜い。主に人の顔や物の形が美しくなかったり、整っていなかったりする時に使う。
몽골=中央アジアの内陸に位置する国。首都はウランバートルで、広大な草原と高原地帯からなる。かつてチンギス・ハンが築いた世界的な帝国としてもよく知られている。
무=何も無い状態。有の反対概念で、実体がなかったり存在しなかったりすること。または、数学や競技の結果において、ゼロ(0)や数値上何も得られなかったことを指す言葉。／アブラナ科の一年草または二年草。根は太くて長く、白または赤色で食用にする。葉は羽状に裂け、主にキムチや汁物、煮物などの材料として広く使われる（ダイコン）。
무궁화=アオイ科に属する落葉灌木。夏から秋にかけてピンク、白、紫などの花が咲き、大韓民国の国花に指定されている。／かつて韓国鉄道公社で運行されていた列車種別の一つ（ムグンファ号）。
무대=歌、踊り、演劇などを見せるために高く作られた場所（舞台 / ステージ）。／ある出来事が起こる場所、または活動の中心となる分野（舞台 / 活動の場）。／[文学] 小説や演劇などの事件が展開される背景となる場所（舞台）。
무료=料金を取らないこと。または、料金がないこと(無料)。
문학=思想や感情を言語を通じて形象化した芸術。詩、小説、戯曲、随筆などがこれに属する。／学問の一分野として文章を研究したり、文学作品を批評・研究したりする学問。
물고기=脊椎動物のうち、魚類に属する動物を総称する言葉。主に水中に住み、ひれで泳ぎ、えらで呼吸する。
물질=物体の本体をなす材料（物質）。／精神的なものと反対の概念で、人間の主観的な意識から独立して存在する客観的な実在。／お金や財物など、経済的な価値があるもの。
미국=北アメリカ大陸の中央部に位置する国。首都はワシントンD.C.で、正式名称はアメリカ合衆国(United States of America)。／北アメリカ大陸の中央部を占める連邦共和国。首都はワシントンD.C.で、正式名称はアメリカ合衆国（United States of America）である。
미끄러지다=滑りやすい場所で一方に滑って動く。／ある場所を滑るように滑らかに動く。／（比喩的に）試験や選挙などで落ちたり失敗したりする。
미술관=美的価値のある芸術作品（絵画、彫刻、工芸など）を収集、保存、展示し、一般に公開して研究する施設（美術館）。
미안=他に対して心が安まらず、恥ずかしいこと。またはそのような感じ。主に相手の好意に報いられなかったり、失敗をしたりした時に使う言葉。
미역국=水で戻したわかめをごま油やえごま油で炒めた後、水を注いで煮たスープ。主に牛肉、ムール貝、貝類などを入れて味を出し、韓国では誕生日や産後の肥立ちの際に欠かせない食べ物である。／(比喩的に) 試験に落ちたり、落第したりすることを指す言葉。
미용실=一定の施設と設備を備え、主に女性の髪や顔などを美しく整えてくれる場所（美容室 / 美容院）。
미치다=影響や作用などが対象に及ぶ。力、影響力、作用などがある範囲や対象に到達し、結果や変化をもたらすことを意味する。／空間的な距離や水準がある地点や基準に届く。一定の水準、限度、距離などに到達したり、それに相応する程度になることを意味する。／精神に異常をきたし、言動が普通の人とは異なるようになる（狂う / 発狂する）。／（比喩的に）ある事に過度に熱中して、正気を失うほどになる（夢中になる / 狂う）。／常識から外れた行動をしたり、とんでもない考えをしたりする。
민족=一定の地域で長い間共に生活し、言語、文化、歴史的起源を共有し、共同体意識を持つ人間の集団（民族）。／国家や政治的境界を越え、血統や文化的同質性を強調する社会的な単位。
및=および、ならびに、また。（主に文章で単語や句を対等につなぐ時に使う言葉）
바=前に述べた内容そのものや事柄などを表す語。／ある方法や手段、または機会や状況を表す語。／(主に「-은/는/을 바에(는)」の構成で使われ) 前の事実を認めつつ、それならむしろ後ろの内容の方が良いという意を表す語。／(依存名詞) 前に述べた内容そのものや事、あるいは方法などを表す言葉。／(依存名詞) ある事情や状況を表す言葉。／(名詞) 西洋式の酒場。主にカウンター席があり、気軽に酒を飲める場所(バー)。
바깥쪽=ある範囲や物体の外側にあたる方。／一定の境界や線を基準にして、その向こう側の空間。
바나나=バショウ科の多年草、またはその果実。形が細長く皮が黄色で、果肉が柔らかく甘い代表的な熱帯果物。
바닷가=海と陸が接するところ。または、その近くの土地(海辺 / 浜辺)。
바이올린=4本の弦を持つ西洋の代表的な弦楽器。弓で弦をこすって音を出し、高音域を担当する。
바탕=物事や現象の根本を成す基礎や土台。／物体の底面、あるいは背景となる色。／生まれつきの性質や素質。
박수=喜び、賛成、歓迎を表したり、拍子を合わせるために両方の手のひらを打ち合わせること（拍手）。／（比喩的に）ある事柄や成果に対して送る称賛や激励。
반면=ある事実と反対になる側面。／前の事実を認めつつ、それと同時にこれと反対になる他の事実があることを表す言葉。
반바지=膝丈くらいまでの短いズボン。主に夏場や運動するときに履く。
반지=指にはめる輪の形の装身具。金、銀、玉、宝石などで作られ、約束、記念、身分などを表したり、単に装飾のために使用する。
반찬=ご飯に添えて食べるおかずの総称。キムチ、ナムル、煮物、焼き物などがこれに当たる。
받아들이다=人や物などを中に入れる。／他人の要求、誠의、批判などを快く聞き入れ、許諾する。／新しい知識、文化、技術などを学んで自分のものにする。／状況や事実をありのままに認めたり理解したりする.
받아쓰다=他人が話すことや読むことを聞きながら、そのまま紙や掲示板などに書き写す。／すでに書かれている文章を見て、そのまま書き写す。
발가락=足の先に分かれている部分。人間の場合は片足に5本ずつ、両足を合わせて計10本ある(足の指)。
발견하다=まだ見つけ出せていなかったり、世の中に知られていない物事や現象、事実などを見つけ出すこと。／ある対象を見て、その存在や価値を新たに悟ること。
발달하다=身体や知能などが成長して、完全な状態に達する。／社会、文明、技術などの水準が以前より高くなったり、規模が大きくなったりする。／ある現象や勢いなどが強まったり、活発になったりする。
발바닥=人の足の裏。足の甲の反対側で、地面に接する部分。
발생하다=これまでなかった物事や現象が新しく現れたり生じたりすること。／事故や疾病、戦争などの事件が起こること。
발음=言葉の音を出すこと。または、その音(発音)。／言語学において、子音や母音などの音素を調音器官を通じて実際に音にする現象。
발전=より優れ、高い状態や水準へと進むこと（発展 / 進보）。／物事がある方向へと展開したり、範囲が広がったりすること（進展 / 展開）。／[経済] 生産力が高まり、経済構造が充実して国民の生活水準が向上する現象（経済発展）。／機械的エネルギーや化学エネルギー、熱エネルギーなどを電気エネルギーに変換すること。すなわち、電気を作り出すこと。
발전하다=より良​​い状態や水準に進む（発展する / 進보する）。／物事が特定の方向に展開したり拡大したりする（進展する）。／機械や設備などが電気を起こす（発電する）。
발표하다=ある事実や結果、作品などを世の中に表して広く知らせる。／多くの人の前で自分の意見や研究内容などを言葉や文章で説明する。
밝히다=火や光を灯して暗い場所を明るくする。／明らかになっていない事実や真実、原因などをはっきりと公表する。／寝ずに夜を明かす。／目を大きく見開いたり、視力を集中させたりする (目をさらす)。／ある事柄に対して非常に好んだり、欲しがったりする。
방금=話しているまさにこの時点（名詞的用法としても使われる）。／ごくわずか前。／ついに今しがた。／今しがた。たった今。(話し合っている時点より直前)／今すぐ。今。 (主に未来のことを表す時に使われる)
방식=一定の方法や形式。ある事を行ったり、現象が起きたりする際の枠組みや手順。／[社会] 人々が生きていく一定の生活の見本や形態（生活様式）。
방안=ある事を処理したり解決したりするための具体的な計画や方法（方案 / 対策）。
배고프다=お腹が空いて食べ物を食べたい感じがある。／（比喩的に）ある対象や状況が十分ではなく、渇望を感じたり物足りなかったりする。
배달=品物や手紙、食べ物などを指定した場所に届けること（配達）。
배드민턴=ネットを挟んでラケットでシャトルコックを打ち合い、勝敗を競う球技。
배부르다=食べた物がお腹いっぱいに満ちて、腹持ちが良い（お腹がいっぱいだ）。／子を身ごもってお腹が大きく膨らんでいる（腹が大きい）。／物の真ん中の部分がぷっくりと膨らんでいる。
배추=アブラナ科に属する二年生植物。葉は薄い緑色で根元から集まって生え、秋に葉が重なり合って中が詰まる。ビタミンと食物繊維が豊富で、キムチの主材料や各種スープ、包み料理（サム）の材料として広く使われる（ハ쿠サイ）。
배탈=お腹の具合が悪くなって痛んだり、下痢をしたりする症状。（主に食べ物を間違えて食べたり、冷気に当たったりした時に発生する。）
백만=万の百倍になる数（百万）。／（比喩的に）非常に多い数。／数の単位である百万の数量を表す言葉。（一万の百倍）／「非常に多い数」を比喩的に表す言葉。
뱀=爬虫類有鱗目ヘビ亜目に属する動物の総称。体は細長く足がなく、体表は鱗で覆われている(ヘビ)。／(比喩的に) 性格が陰険で狡猾な人を指す言葉。
번호=物事の順序や性格などを表すために付けられる数字。／電話や住所などを識別するために付与された固有の数字。
벌=服や器などが一式（セット）を成すとき、その単位を表す言葉。／（主に「한 벌」の形で使われ）同種のデザインの服や物が集まって一塊になっているものを数える単位。／ハチ目の昆虫の総称。体に毛があり、腹の先に毒針があって人を刺すこともある。ミツバチ、スズメバチ、アシナガバチなどがある。／過ちや罪を犯した人に、その代償として与える苦しみや損害（罰 / 刑罰）。／規則や法規を破ったときに加えられる制裁。
벌이다=計画を立てて始めたり、繰り広げたりする。（例：事業、宴会、喧嘩など）／物を並べる。／人目を引くために特定の出来事を引き起こす。
법=前の言葉が意味する状態が当然であるか、必ずそうでなければならないことを表す言葉。／(主に「-는 법이다」の形で使われ) 物事の道理や理屈がそうであることを表す言葉。／(主に「-을 법하다」の形で使われ) ある事が起こる可能性があることを表す言葉。／国家権力によって強制される社会規範。国家の統治権によって発動され、国民の権利と義務を規定する(法 / 法律)。／社会の構成員が守るべき道理や慣習。／あることをしたり、問題を解決したりする方法や方式。／（依存名詞として使われ）前の言葉が表す状態が当然であることを示す言葉。
베트남=東南アジアのインドシナ半島東部に位置する国。正式名称はベトナム社会主義共和国で、首都はハノイである。
변호사=法律に関する専門知識に基づき、訴訟当事者や関係人の依頼を受けて法廷で弁論し、法律事務を処理することを職業とする人（弁護士）。
변화=物の形、性質、状態などが以前とは異なるように変わること（変化）。／[生物] 生物の形や性質が世代を重ねるごとに変わっていく現象。
병문안=病人を訪ねて慰め、安否を尋ねること。また、そのこと(お見舞い)。
보라색=青と赤が混ざった色。可視光線の波長の中で最も短い方の色で、優雅さ、華やかさ、または高貴さを象徴することもある。
보호=危険や困難に遭わないように、よく見守り世話をすること。／破壊されたり損傷したりしないように、よく手入れして維持すること。／[法律] ある人の権利や利益が侵害されないように、法律によって守ること。
복습=学んだ内容を復習し、勉強すること。（すでに学んだ内容を繰り返して身につけること。）
볶음밥=ご飯に肉、野菜、海鮮など様々な材料を細かく切って入れ、油で炒めて作った料理（チャーハン）。
볼펜=先端に小さな金属の玉（ボール）が組み込まれており、文字を書く際にこの玉が転がることで蓄えられたインクを紙に付着させて書く筆記具。
봉투=手紙や書類などを入れるために紙で作った袋（封筒）。／物を入れるために紙やビニールなどで作った袋。
뵙다=「見る・会う」の謙譲語で、目上の人や尊敬する対象に会う。
부산=大韓民国の東南端にある広域市。韓国第一の港湾都市であり第二の都市で、海雲台や広安里などの海水浴場や水産市場で有名である。／大韓民国の東南端に位置する広域市。韓国一の港町であり、ソウルに次ぐ第二の都市で、物流と海洋産業の中心地である。
부자=父と息子を併せていう語。／財産が多く、暮らしが豊かな人。／あるものをたくさん持っている人を比喩的にいう言葉。（例：心の富者、知識の富者）／財産が多く、暮らし向きが豊かな人（金持ち / 富豪）。／（ある物質を表す名詞の後に付いて）その物質をたくさん持っていたり、その物質が豊富な人。
부정=正しくないこと。またはそのような行為（法や道理、正義に反することを意味する）。／正直でない、あるいは不当な手法で利益を得ること。／ある内容や事実がそうではないと断定したり、反対すること（否定）。／正しくなかったり、妥当ではないこと（不正）。／定まっていないこと（不定）。
부지런하다=怠けることなく、粘り強く、または熱心に仕事や活動をする状態にある（まじめだ / 勤勉だ）。
부치다=手紙や荷物などを相手に送る。／ある案件や問題を別の場所に移して処理させる。／ある事に必要な力や能力が足りない。（例：力が及ばない）／秘密や個人的な事情を他人に知られないようにする。（例：秘密に付す）
부탁=ある事を頼んだり、任せたりすること（依頼 / お願い）。／（法律）法律行為や事務の処理を他人に任せること（付託）。
분석=[哲学] 複合的な現象や概念を、それを構成する単純な要素に分解すること。／[化学] 物質がどのような成分で構成されているかを突き止めるために、物質を分けて調査すること。
분식=小麦粉や米以外の他の穀物の粉で作った食べ物を食べること。／トッポッキ、キンパ、ラーメン、天ぷらなどのように、主に「粉食店（ブンシッチッ）」で安く手軽に買って食べられる料理を総称する言葉。
분야=社会活動や学問などで分かれた範囲や部門。／ある知識や技術、関心が及ぶ特定の領域。
분홍색=濃い赤に白が混ざり、明るく柔らかい感じを与える色。一般的に「ピンク」とも呼ばれる。
불고기=牛肉などの赤身肉を薄切りにして味付けし, 火に焼いて食べる韓国の伝統料理。
불교=釈迦牟尼を教祖とし、仏の教えを信じ従う宗教。修行を通じて悟りを開き、衆生を救済することを目的とする(仏教)。
불구하다=ある事柄や条件、状況などにこだわったり気にしたりしない。（主に「～であるにもかかわらず」「～にもかかわらず」の形で使われ、前の状況が後ろに来る事実に影響を与えないことを表す。）
불쌍하다=境遇が非常に気の毒で、助けてあげたい気持ちがある。
불편=ある事をするのに条件や環境が整っておらず、苦しかったり困難であったりすること（不便だ）。／体や心が安らかでなく、不快であること（不自由だ / 居心地が悪い）。／関係がぎこちなかったり、円滑でなかったりすること（気まずい）。
블라우스=主に女性が着るシャツの形の上着。上着の中に着たり、単独で着用したりし、シルクや綿などの軽い素材で作られ、柔らかい感じを与えるのが特徴だ。
비누=汚れを落とすために使う洗浄剤の一種。油脂や脂肪酸を水酸化ナトリウムなどと反応させて作り、水に溶けると泡立ち、洗浄力が強くなる。
비롯하다=(主に「-をはじとして」または「-をはじめとする」の形で使われ) ある対象を筆頭に、それと似たものを一括りにする時に使う。／(ある事態がどこからか) 初めて始まる。
비빔밥=肉やナムルなど様々な具材をご飯の上にのせ、薬味（コチュジャン、醤油など）とごま油を入れて混ぜて食べる韓国の代表的な料理。
비하다=二つ以上の対象を互いに突き合わせて比較する。（主に「-に比べて」、「-に比べれば」の形で使われ、比較の基準を表す。）／心の中で見比べて考える。
빌딩=主に都心に建てられた規模の大きい西洋式の建物。（主にオフィスや商業用として使われる。）
빛=視覚を刺激して物体を見ることができるようにするエネルギーの一形態(光)。／物体の表面で反射してきらめく光沢やつや(輝き)。／人の顔に現れる気配や表情(顔色)。／希望や栄光のように将来を明るく照らしてくれる肯定的な要素(光 / 希望)。
빨간색=明るく濃い赤色。熟したイチゴや血の色のような色。
빨다=唇をすぼめて口の中に引き込み、液体や食べ物などを口に含んだり飲み込んだりする。／口の中に入れ、舌でなめたり転がしたりする。／（比喩的に）ある利益や気運などを吸収して自分のものにする。／衣類や布などを水に浸して汚れを落とす（洗う / 洗濯する）。／口に入れ、舌や唇で噛んだり引いたりして液体などを飲み込む（吸う / すする）。／物の端を唇の間に挟み、唇で噛んだり舌を当てて刺激する（しゃぶる）。
빵집=パンを専門的に作って売る店（パン屋）。
뿐=(語尾「-을」の後に使われ) ただそのようであるか、そうするだけであることを表す言葉。／(普通「-다 뿐이지」の構成で使われ) ただそうしたり、そうであったりするだけだということを表す言葉。／(助詞としても使われるが、依存名詞として) それだけであり、それ以上はないことを表す言葉。
사=三に一を足した数。（アラビア数字では「4」と表記する。）／（数量を表す言葉の前に使われ）それだけの数の。／(数量を表す冠形詞) 「4(よん/し)」の意味を表す言葉。後に続く単位名詞によって形が変化せず、主に数量を数える時に使われる。
사거리=四つの道が一つに交わるところ（四つ角 / 交差点）。／弓や銃などを撃って、矢や弾丸が飛んでいく距離（射距離 / 射程）。
사건=社会的に問題を引き起こしたり、関心を引くような不意の出来事(事件)。／法律的な問題を引き起こす原因となる事実や、告訴・告発などの対象となる事柄。／小説や演劇などの物語の中で繰り広げられる展開上の葛藤や変化。
사계절=春、夏、秋、冬の四つの季節。／一年中の期間を指す言葉。
사과=リンゴの木の実。通常、丸くて赤く、味は甘くてシャキシャキしている。／自分の過ちを認め、許しを請うこと。またはその言葉や行動。
사귀다=互いに知り合い、親しく付き合う。主に友人や恋人関係になることを意味する。／多くの人と関係を結び、親交を深める。
사라지다=現象や物体の跡や姿が見えなくなる。／ある気配や感情、現象などがなくなったり終わったりする。／（比喩的に）ある存在が世の中からなくなったり死んだりする。／（比喩的に）会社や組織などが経営難や解散などによってなくなる。
사십=四十の数量を表す言葉。／1. 10の4倍になる数（数詞）。 2. 「마흔（四十）」の意味を表す漢字語の数字。
사이다=二酸化炭素を溶かして作った、砂糖と香料が入った透明でパチパチとはじけるような味がする炭酸飲料（サイダー）。／（比喩的に）もどかしい状況がすっきりと解決され、胸のつかえが下りるような出来事や状況を指す言葉。
사이즈=物の大きさや寸法を表す言葉。主に服、靴、家具などの体積や長さを指す。／物事の規模や範囲を比喩的にいう言葉。
사전=ある範囲内で使われる単語を集め、一定の順序で配列し、その意味・読み・語源・用法などを説明した本（辞典 / 辞書）。／（比喩的に）ある分野について非常に博識であるか、あらゆる知識を盛り込んでいるもの。／ある範囲内で使われる単語を集めて一定の順序で配列し、その意味・語源・比喩・用法などを解説した本(辞典 / 辞書)。／特定の分野の知識や事物を項目別に集めて説明した本(事典)。／あることが起こる前や、事を始める前。
사정=物事の事情やわけ。／ある結果に至るまでの過程や、そうせざるを得なかった状況。／他人の事情を察して、便宜を図ったり配慮したりすること。
사탕=砂糖を主原料として煮詰め、冷やして固めた菓子。普通、甘い味がして、香料や色素を入れることもある(キャンディー / 飴)。
사회=共同生活を営むあらゆる形態の人間の集団。または、その集団内での絆や関係。／上流階級の人々で構成される集団や、彼らの社交的な集まり。／会議、儀式、宴会などで進行役を務めること。または、その人。
사흘=三日（みっか）。(3日間の期間)。／(主に「사흘날」の形で) 毎月三日目の日。
산업=人間が生計を維持するために日常的に従事する生産的な作業。／農業、工業、サービス業などのように、製品やサービスを生産する体系的な経済活動の分野。／[歴史] 朝鮮時代、財産や家業を指す言葉。
산책=気分転換や健康のために、ゆっくり歩くこと（散策 / 散歩）。
살리다=死ぬ運命にある命を死なせないようにしたり、保たせたりする（生かす / 救う）。／活気나精神などを再び活性化させる（活気づける / 盛り立てる）。／本来の機能や特徴、効果などが十分に現れるようにする（生かす / 引き立てる）。／火を燃え上がらせたり、物を使えるように直したりする（おこす / 修復する）。
살아가다=命をつないでいく。／ある状況や状態で生活していく。／世の中を歩み、活動しながら過ごす。
살펴보다=あちこち詳しく探したり調査したりして見る（調べる / 目を通す）。／状況や都合などを推し量って知るために注意深く見る（見守る / 伺う）。
삶=生きること。または、生きていること。／命や生命。／生まれてから死ぬまでの期間、またはその間の生活。
삼=2と4の間の整数(3)を表し、時間の流れや回数などを数える単位の前に使われる数詞。／(冠形詞) 二に一を足した数の。主に後に来る単位を表す名詞と結合して数量を表す。
삼거리=三叉路（さんさろ）。三つの道が一つに集まる場所。
삼겹살=豚のあばら骨についている赤身肉で、脂身と肉が三層をなしている部位。主に焼き肉用として使われ、韓国人が最も好んで食べる豚肉の部位の一つ。
삼계탕=若鶏のお腹の中に高麗人参、もち米、なつめ、にんにくなどを詰め、水で長時間煮込んで作った韓国の伝統的な健康料理。主に伏日（ポンナル）に元気を出すために食べる。
삼다=人を連れてきて、ある関係を結んだり、ある地位に就かせたりする。／ある対象を何かに仮定したり、みなしたりして対象として扱う。／ある道具として使ったり、材料として利用したりする。
삼십=10의 3배가 되는 수의（後に来る名詞を修飾して数量を表す）。／10の3倍になる数（三十 / 三）。／「서른（三十）」の漢字語。
삼촌=親の兄弟や、行列（同じ世代の親族関係）が同じ男性の親戚を指す言葉。通常、結婚していない父の兄弟を呼ぶ際によく使われる（叔父 / 伯父）。／（親戚関係でなくても）成人男性を親しみを込めて呼ぶ時に使う言葉。
상=食べ物を並べるために使う家具。（主に食卓や御膳を意味する。）／物を置くための平らな家具。／品質、実力、成績などを等級で分ける際、最も高い等級を指す言葉。（例：上、中、下）／ある物事や基準から見て、状態が良い、または優れた水準であることを表す言葉。／物体の形状や形。／鏡、レンズ、写真、テレビ画面などに現れる物体の姿。／頭の中で考えて描き出す姿や観念。／青銅、石、木などで作られた人や動物の像。／優れた業績を挙げたり、善行を行ったり、優秀な成績を収めた人に与えて褒める証書や金銭、または品物（賞）。／ある仕事の成果を祝ったり、奨励したりするために与える褒賞。
상자=物を入れるために木、紙、プラスチック、金属などで作られた器。通常、四角い形が多い（箱 / ケース）。／（数量単位として使われ）箱に入った分量を数える単位（箱）。／物を入れるために木、紙、プラスチックなどで作った器。通常は四角い形で蓋がある(箱 / ケース)。／(数量を表す言葉の後に使われ) 箱に入った分量を数える単位。
상추=キク科に属する一年草または二年草。主に葉を食用とし、包み料理（サンチュ巻き）にしたり、浅漬け（コッチョリ）などにして食べる。茎を切ると白い汁が出るのが特徴である。
상태=物事や現象が置かれている現在の様子や状況（状態）。／人の体や心の健康、あるいは気分などの状況（具合 / コンディション）。
상황=物事が進んでいく過程や様子（状況 / 事態）。／ある物事が置かれている客観的な環境や条件（状況 / コンディション）。
새해=新しく始まる年（最も一般的な意味で、正月を前後した時期やその年の序盤を指す）。
샌드위치=二枚のパンの間に肉、野菜、チーズなど様々な材料を挟んで作った西洋料理。／(比喩的に) 両側から圧迫されたり、挟まったりしている状態を指す言葉。
생명=人が生きて呼吸し、活動できる力。またはそのような状態。／動物や植物が誕生して成長し、死ぬまでの期間。またはその維持能力。／物事や現象が存続できる根源的な力や価値。
생산=人間が有用な物を作り出す活動。主に原料を加工して製品を作ったり、農作物を育てたりすることを意味する。／新しいアイデアや価値、現象などを作り出すこと。
생선=食用にするために獲った新鮮な魚。乾燥させたり塩漬けにしたりしていないもの。
생신=「誕生日」の尊敬語。主に両親や先生など、目上の人の誕生日を敬って呼ぶ時に使う。
샤워=体に水を浴びてきれいに洗うこと。またはその装置。普通、浴槽に入らずに立ったり座ったりして簡単に洗うことを意味する。
서너=三つか四つ、あるいは三、四ほどの数量を表す言葉。（主に数量を表す名詞の前に使われ、「三個か四個」程度の少ない数を意味する。）
서랍=机、たんす、化粧台などに差し込んだり引き出したりするように作られた、物を入れる仕切り(引き出し)。
서류=ある事実を証明したり、記録として残すために文字で書き記した文書（書類）。
서른=三十の。後にくる名詞を修飾して、その数量を表す。／十의 3倍になる数(三十 / 三十路)。／(数詞的に使われる時)四十の前、十の三倍になる数の。主に年齢を数える時に多く使われる。
서울=大韓民国の首都。朝鮮半島の中央に位置し、漢江（ハンガン）を中心に発展した政治、経済、文化、教育の中心地。／一国の中央政府がある都市。（比喩的に）中心となる場所。／大韓民国の首都。漢江（ハンガン）を中心に形成されており、政治、経済、文化、教育の中心地である。／（一般名詞としての古語）一国の中央政府がある場所。または、その国の首都。
서울역=大韓民国ソウル特別市龍山区東子洞と中区蓬莱洞にまたがる京釜線、京義線の鉄道駅。KTX、セマウル号、ムグンファ号などの主要列車と、首都圏電鉄1号線、4号線、京義・中央線、空港鉄道が交差する交通の要所である。
서점=本を専門に売る店。「本屋(책방)」と同じ意味で使われる。
서쪽=日が沈む方。方位の一つで、地図を見る時の左方向。／基準となる地点から日が沈む方の方向、または地域。
선=引いたり垂らしたりした細い糸や紐（線）。／境界を表す標識や、区分けをする一定の限界。／電話、電気、通信などがつながる通路。／物体の輪郭や形を成す曲線や直線。
선거=一定の組織や集団において、投票を通じて代表者や公職者を選ぶこと（選挙）。／大統領、国会議員、地方議会議員などを国民の投票で決定する民主主義の基本手続き。
선물하다=人に挨拶や真心の印として物などをあげる（プレゼントする / 贈る）。
선선하다=暑さが引いて、気持ちよく涼しい感じがある。主に天気や風の状態を表現する時に使う。
선풍기=電動機や機械の力で羽根を回転させて風を起こす装置。主に夏場に室内の温度を下げたり、換気をしたりするために使用する。
설거지=食後の食器を洗って片付けること。／雨が降りそうな時や降っている時、物が雨に濡れないように片付けたり覆ったりすること。
설날=韓国の最大級の節句（名節）の一つで、旧暦1月1日の新年の初日を指す言葉。／旧年を送り新年の最初の朝を迎える日で、茶礼（チャレ：先祖供養の儀式）を行い、目上の人に歳拝（セベ：新年の挨拶の辞儀）をしてトックク（餅スープ）を食べる風習がある。
설렁탕=牛の頭、内臓、骨などを入れてじっくり煮込んだスープ。または、そのスープにご飯を入れた料理。白いスープが特徴で、塩、コショウ、ネギなどを入れて味を調えて食べる。
설악산=江原道の束草市、麟蹄郡、襄陽郡にまたがる山。高さは1,708メートルで太白山脈で最も高い山であり、大韓民国で漢拏山、智異山に次いで3番目に高い。奇岩怪石と滝が多く景色が非常に美しく、1970年に国立公園に指定された。
섭섭하다=期待していたことが外れたり, 情の厚い人と別れることになったりして、心が寂しく、名残惜しい。／もてなしや待遇が十分でなく、不満があって寂しい。
성장=人や動植物などが育って体が大きくなること（成長）。／物事の規模や勢力が大きくなること（拡大 / 発展）。／知識、経験、精神などが成熟したり発展したりすること（成長 / 成熟）。
성함=「名前」の尊敬語。主に相手の名前を丁寧に尋ねたり、呼んだりする時に使う。
세기=西暦紀元を基準にして、100年を一つの単位として数える名称(世紀)。／(比喩的に) ある特定の時代や、歴史的に重大な事件が起きた時期を指す言葉。
세다=物の数をおのずから一つずつ数える。／お金や価値のある物の額を計算する。／力や勢いが強い。／物体の固さや強度が高い。／風、波、火の勢いなどが非常に大きく激しい。／性格や気勢が他人に負けないほど強い。／能力や実力が優れている。
세배=元旦の朝、新年のあいさつとして目上の人に捧げるお辞儀。
세수=手や顔を洗うこと。主に顔を洗う行為を指す。
세월=流れる時間。／はかなく過ぎ去る時間、またはその期間中の状況。
세탁=汚れた服や布などを水や油などできれいに洗うこと（洗濯）。／（比喩的に）良くない過去をなくしたり、新しい姿に変えたりすること。
세탁기=汚れた服や布などを水と洗剤を使って自動できれいに洗ってくれる機械（洗濯機）。
세탁소=お金をもらって衣類や布団などの洗濯物を洗ったり、アイロンをかけたりしてくれる場所（クリーニング店 / 洗濯所）。
센터=ある活動や機能の中心となる施設や場所。／社会的活動やサービスが集中的に行われる機関や組織。／[スポーツ] バスケットボール、バレーボールなどでコートの中央で試合を調整したり、攻守の核心的な役割を果たす選手。
셋=二つに一つを足した数（基数）。／順番や列を数える時、三番目になる数（序数）。
셋째=順番が三番目になる順序。／数量が三つになる順番。／(名詞の後に使われ) 兄弟や姉妹の中で三番目に生まれた人。／複数のうち、三番目にあたるもの。／順序が3番目になる。／(主に数量を表す言葉の後に使われ) 様々な項目や理由などを順に並べる際、3番目であることを表す言葉。
소개=知らない人同士の間に入って、お互いを知るようにすること。／あまり知られていない物事や現象を他人に知らせて、分かってもらうこと。／自分の身上に関する事項や情報を他人に知らせること。
소고기=牛の肉。食用にされ、タンパク質が豊富である。「쇠고기」とも言う。
소녀=まだ年が若い女の子。普通、未成年者の女性を指す。
소년=まだ若い男の子。普通、小学生から中学生くらいの年齢層の男子を指す。／若い年齢、または少年時代。
소비자=商品やサービスを生活のために買ったり使ったりする人（消費者）。／生産者が作り出した物を最終段階で使用する人（消費者）。
소주=穀類を発酵させて作った酒を蒸留して作った、透明でアルコール度数が高い酒。韓国を代表する庶民的なお酒である。
소파=背もたれと肘掛けがあり、中にスプリングを入れ、表面を革や布で覆って作った柔らかい長い椅子。主にリビングやオフィスで休息を取ったり、客を迎えたりする時に使用する。
소포=郵便物の一つで、小さく梱包して送る荷物(小包)。
소풍=休息を取ったり、周辺の景色を眺めたりするために野外に出かけること（遠足 / ピクニック）。／（比喩的に）軽やかで楽しい気持ちで出かける短い旅行。
소화제=食べた物をよく消化させるために飲む薬。胃腸の機能を助け、消化作用を促進したり調節したりする薬剤を総称する。
속옷=上着の内側に、体に直接触れるように着る服（下着 / 肌着）。
손녀=息子の娘、または娘の娘を指す言葉（孫娘）。
손바닥=指を除いた手の内側の部分（手のひら）。
손수건=主に体を拭いたり鼻をかんだりするために持ち歩く、小さな正方形の布（ハンカチ）。
송편=うるち米の粉を湯練りして、あん（豆、ごま、栗など）を入れ、半月状に形を整えて松の葉を敷いて蒸した餅。主に秋夕（チュソク：お盆）に作って食べる韓国の伝統料理である。
쇼핑=品物を買いに百貨店、市場、商店などに行くこと。必要な物品や嗜好品を見て回り、購入する行為(ショッピング / 買い物)。
수건=体や体の一部、または物の水気を拭き取るのに使う布（タオル）。
수고=ある仕事をするために力を尽くし、苦労すること。また、その功労。／（主に挨拶として使われ）相手の労をねぎらったり、励ましたりすること。
수박=ウリ科の一年生のつる植物。またはその実。実は丸いか楕円形で、外皮は緑色に黒い縞模様があり、果肉は赤や黄色で、汁が多くて甘い。
수영=水の中で手足を動かして泳ぐこと。または、そのこと。／水泳場や海などで行われるスポーツ競技の一つ。
수영복=水泳をしたり水遊びをしたりする際、体にフィットするように特別に製作して着る服（水着）。
수영장=水泳ができるように設備を整えてある場所（水泳場 / プール）。
수요일=一週間の七日のうち、火曜日の次の日で、木曜日の前の日。
수저=スプーンとお箸を合わせて呼ぶ言葉（匙とお箸）。／（主に「スプーン（匙）を置く」や「スプーン（匙）を持つ」の形で使われ）スプーンを指す言葉。
수준=物事の価値や品質、または能力の程度。／一定の標準や基準となる程度。／水の表面のような平らな高さ。
수첩=メモや連絡先、日程などを手軽に書き留めるために、手に持って運べるほどの小さなサイズで作られた本（手帳）。
순간=きわめて短い時間（瞬間）。／あることが起きた、まさにその機会や時。
순두부찌개=水気を切っていない柔らかい状態の豆腐（スンドゥブ）を主材料とし、粉唐辛子、醤油、各種調味料を入れてピリ辛に煮込んだチゲ。主にアサリ、豚肉、卵などを添えて味を出す。
숟가락=ご飯やスープ、液体の食べ物をすくって食べる時に使う道具。普通、長い持ち手の先が丸くてくぼんでいる形をしている(スプーン)。
숨=人や動物が肺やエラを通して空気を吸い込み、吐き出す息。または、その息を吐き出す行動（息 / 呼吸）。／植物の葉や茎から水分が抜け、張りがなくなる現象。／(比喩的に) ある事柄や活動が持続する力、または生命力。
숲=木が茂っている所(森 / 林)。／草や木などが빽빽（ぺっぺく）と立ち並んでいる状態を比喩的にいう言葉。／ある物事や現象が一箇所に集まっている状態を比喩的にいう言葉。
쉰=10의 5배가 되는 수의. (数詞/冠形詞) / 49に1を足した数 (50 / 五十)。／(冠形詞) 十の五倍になる数の。（後に来る名詞を修飾して数量を表す。）
슈퍼마켓=食料品や日用雑貨などを備え、客が自ら品物を選んで会計するようにしてある、比較的規模の大きい小売店。
스무=(数量を表す言葉の前に使われ)「二十(スムル)」の連体形。数が20であることを表す。
스물=10の2倍になる数（二十）。／（冠形詞として使われる時）40の半分になる数の。
스웨터=毛糸で厚手に編んだ上着。主に寒い時期に保温のために着るもので、頭からかぶって着たり、前をボタンやファスナーで留める形などがある。
스카프=首や頭に巻いたり、肩に掛けたりする薄い布。主に保温や装飾を目的として使われる。
스케이트=氷の上を滑るように靴の底に薄い鉄の刃をつけた器具。または、それを履いて氷の上を走る運動（スケート）。／車輪のついた靴を履いて平らな床の上を走る器具（ローラースケート）や、その運動を総称することもある。
스키=雪の上を滑るために足の裏につける細長い板。通常、木、金属、プラスチックなどで作られる。／スキーを履いて雪の上を滑るウィンタースポーツ。
스키장=スキーができるように設備と施設を整えた場所(スキー場)。
스파게티=イタリア料理の一つで、小麦粉を練って細長く作った麺、またはその麺をゆでてトマトソースやクリームソースなど、さまざまなソースと和えて作った料理。
슬퍼하다=悲しい気持ちを表に出す。心に悲しい感情を感じて苦しんだり、涙を流したりする。／誰かの死や不幸、あるいは別れに対して切なく思う（悲しむ）。
슬픔=悲しい心や感じ。または、切なくて苦しい心の状態。／(比喩的に) 不幸や苦痛な状況によって感じる悲哀。
시간표=ある事を行うために、時間ごとに計画を立てて記した表（タイムテーブル / スケジュール表）。／学校や塾などで、教科や授業時間を定めた表（時間割）。／列車、バス、飛行機などの出発・到着時間を記した表（時刻表）。
시기=ある事柄や現象が進行する時点や期間（時期）。／ある事を行うのに最も適した機会や時（時期 / タイミング）。／ある物事を行うのに最も良い時や機会（時機 / タイミング）。
시끄럽다=音が大きすぎたり混じり合ったりして聞き苦しく、気が散る（うるさい / 騒がしい）。／ある事柄に対して、騒ぎや議論が多くて騒がしい（騒々しい / かまびすさい）。
시다=味が酢やレモンのように舌を刺すような感じだ(酸っぱい)。／(目が)日光や刺激を受けて、ひりひりしたり、ちくちくしたりする。／(歯が)冷たい食べ物や刺激的な食べ物に触れて、しみるような痛みがある。／(筋肉などが)疲れ果てて、だるい感じがする。
시대=歴史的に区分される、ある一定の期間。／社会の変化や流れによって特徴づけられる一つの時期。／人の生涯や現象の進行過程における特定の段階。
시선=目が向いたり留まったりする方向。または、その目の方向が届く線(視線)。／注意や関心を比喩的に表す言葉。
시설=道具、機械、装置などをある目的に合わせて備え付けること。または、その装置や設備。／建物や場所など、公共の便宜のために作られた構造物。
시어머니=夫の母親を指す言葉（義母 / 姑）。
시인=詩を専門的に書く人（詩人）。／（比喩的に）物事を美しく叙情的に眺めたり表現したりする人。
시절=(主に過去の) 特定の時期や時。子供時代や若い頃のような人生の一時期。または、その当時の世の中の状況や社会的な雰囲気。
시청=視覚と聴覚を通じてテレビ放送などを見たり聞いたりすること(視聴)。／市の行政事務を司る機関。／市の行政事務を司る機関が入っている建物。／（比喩的に）市役所で勤務する公務員。
식=ある事柄や現象がなされる一定の方式や手本。／特定の格式や体制を整えた一定の儀式。／（一部の名詞の後に付いて）「そのような方式」または「そのようなスタイル」の意を表す言葉。
식다=熱気が 없어지거나 온도가 내려가다. (主に食べ物や物体に使われる)／情熱や興味、感情などが減ったり消えたりする。／汗が引いたり熱が下がったりする/冷めたりする。
식빵=小麦粉を主原料として酵母で発酵させた後、一定の型に入れて焼き上げたパン。主に薄く切ってジャムを塗ったり、サンドイッチを作ったりするのに用いられる。
식사하다=ご飯を食べる。（主に格式を重んじたり、礼儀を守るべき状況で使用される。）
식초=お酒がさらに発酵して酸味が出る液体の調味料。料理の味付けや殺菌、疲労回復などの目的で使われる。
식탁=料理を並べて食べるテーブル(食卓 / ダイニングテーブル)。／(比喩的に) 食事の時間や、食事の席そのものを指す言葉。
신=宗教や信仰の対象で、宇宙を主宰し人間の生死や幸不幸を司ると信じられている超自然的な存在（神）。／不可思議な能力や知恵を持つ霊妙な存在。／ある分野で優れた能力を発揮し、他者の追随を許さない人を比喩的にいう言葉（神）。／足に履くものの総称。（靴、履物、運動靴などを含む）。／ある事に興味や熱意が湧き、気分がとても良くなって浮き立った状態。／(主に「신이 나다(のりに乗る)」、「신을 내다(張り切る)」の形で使われ) 仕事の能率が上がったり、元気づけられたりした状態。
신경=[生物] 身体の内外の刺激を脳や脊髄に伝えたり、脳や脊髄の命令を体の各器官に伝える器官(神経)。／[心理] ある事柄に対する心の働きや注意力。／[俗語] 気分や感情の状態、または過敏に反応する態度。
신다=靴、靴下、足袋、ストッキングなどを履く。
신랑=結婚したばかりの、または結婚する男性(新郎)。／(相対的に)「新婦」のパートナーとなる男性。／夫を親しんで呼んだり指したりする言葉。
신분증=氏名、生年月日、住所などの個人の人的事項を記録し、その人が本人であることを証明できるように国家や公共機関が発行した文書やカード。（例：住民登録証、運転免許証、パスポートなど）
신선하다=野菜、果物、魚などが生き生きとしている（新鮮だ）。／空気が清らかで清潔だ（清々しい）。／感じや考えが新しく、さっぱりとしている（斬新だ）。
신호=一定の符号、音、光、身振りなどで特定の内容や情報を伝達すること。または、その符号や手段。／通信機器で情報を転送するために使用する電気的エネルギーの流れ。／ある状況や事件がまもなく起こることを表す兆候。
신호등=道路で自動車や人の通行を調節するために、光で一定の信号を送る装置。主に赤、黄、緑の3色を使用する(信号機)。／ある事柄の進行や状態を知らせる比喩的な兆候や兆し。
신혼여행=結婚した直後に夫婦が一緒に行く旅行。普通「ハネムーン」ともいう。
실례=言葉や行動が礼儀に外れること。または、そのような言葉や行動。／(主に「失礼する」、「失礼ですが」、「失礼になる」などの形で使われ) 他人の領域を侵したり邪魔をしたりする時に了解を求める挨拶の言葉。／言葉や行動が礼儀に外れること。または、そのような言葉や行動(失礼)。／具体的な実際の例(実例)。
실례하다=言葉や行動が礼儀に欠ける。／(主に「失礼します」「失礼ですが」などの形で使われ) 他人の領域に入ったり話しかけたりする時、または何かを頼む時に了解を得るための挨拶の言葉。／決まった席や会話の途中で、先に席を立ったり席を外したりする。
실제로=嘘や想像ではなく現実的に。または具体的な状態で（実際に）。
실천=考えや計画、理論などを実際に行動に移すこと。
실패=物事をやり損なって、思い通りにならなかったり台無しにしたりすること（失敗）。／試合や試験などで目標とした結果が得られないこと。
싫어하다=ある物事や状態が気に入らず、忌み嫌ったり遠ざけたりする。／（主に「-기를 싫어하다」の構成で使われ）あることをしたり、経験したりすることを嫌がる。
심각하다=状態や状況が非常に危うかったり重大で、安心できない状態にある（深刻だ）。／考えや態度が軽々しくなく、非常に真面目で深い（深刻だ / 真剣だ）。
심심하다=することがなくて退屈である。／食べ物の味が薄い。（主に食欲をそそらないほど塩気が足りない時に使う）
십=九に一を足した数。成数の終わりであり、二桁の数の中で最も小さい数。／（数詞の後に使われ）数量が十であることを表す言葉。／物の数を表す冠形詞。数詞「열(10/十)」と同じ意味で使われ、数量を表す時に用いる。 (十 / 10)
십만=万の10倍になる数。（アラビア数字で書く時は「100,000」と表記する。）／万の10倍になる数の。（後に来る名詞を修飾する冠形詞）。
싱겁다=料理の塩加減が足りず、味が薄い。／言動が状況に合わず、いい加減で中身がないため、面白くない。／人の性格や態度が軽薄で、真面目みがない。
쌀쌀하다=肌に触れる感じが少し冷たい。（主に天気や風の気配を表す。）／人の態度や性格などに温かい情がなく、冷たい。
쓰레기통=ゴミを集めて入れておく器や桶（ゴミ箱）。
씹다=口に入れた食べ物を歯で細かく砕く（噛む）。／（比喩的に）ある事柄や内容を十分に吟味したり、深くかみしめたりする。／（俗語で）他人をけなしたり非難したりする。／相手の連絡や言葉を無視して返事をしない。／ガムなどを口の中で転がしながら歯で押し続ける（噛む）。
아래쪽=ある基準より低い方向や場所（下の方 / 下側）。／階級、地位、序列などが低い位置（下位）。
아르바이트=本来の職業ではなく、学費や生活費などを稼ぐために一時的にする仕事（ドイツ語のArbeitに由来）。学生や社会人などが収入を目的として本業以外の時間にする副業。
아무런=(主に後にくる「없다(ない)」、「않다(ない)」、「못하다(できない)」などの否定の意味を表す言葉とともに使われ) いかなる種類の状態や性質もないことを表す語。
아버님=他人を敬って、その父親を指す言葉（お父様）。／義父（夫の父親）を指したり呼んだりする言葉（お父様）。／他人である年配の男性を敬いつつ、親しみを込めて呼ぶ言葉（お父さん）。
아이스크림=牛乳やクリームに砂糖、卵、香料などを混ぜて凍らせて作った冷たいおやつ。
아홉=(冠形詞) 8に1を足した数の。とにくる名詞(単位名詞など)を修飾する。／八に一を足した数（九）。／（冠形詞として使われ）数量が九であることを表す言葉。
아흔=10の9倍になる数。（固有語の数詞：九十）／（冠形詞として使われ）40、50、60、70、80の次の数である「90の」。／90(九十)という数量を表す言葉。後に続く名詞を修飾し、その数が「九十」であることを表す。
악기=音楽を演奏するのに使う器具や道具。弦楽器、管楽器、打楽器などに分類される。
안개=地表面の近くで水蒸気が凝結し、微細な水滴が空中に浮いている現象。視界を遮り、前が見えにくくなる。／（比喩的に）ある事態や状況が不透明で、先を見通すのが困難な状態。
안경=視力が悪い目を見えやすくするため、あるいは風や埃、強い日光などを防ぐために目に装着する器具。通常、ガラスやプラスチックのレンズをフレームにはめ込み、耳にかけるようになっている。／（比喩的）物事を見る特定の視点や偏見を指す言葉。
안내=ある対象や場所、内容などについてよく分かるように説明したり教えたりすること（案内）。／道を知らない人を目的地まで連れて行ったり、道を教えたりすること。／ある事柄を紹介したり情報を提供したりする文書や掲示物。
안내문=ある事実や内容を他人に知らせるために書いた文（案内文 / お知らせ）。
안녕=会ったり別れたりする時に交わす挨拶の言葉。主に友達や目下の人に対して使う。／何事もなく安らかなこと。／何事もなく穏やかなこと(安寧 / 平穏)。／会う時や別れる時に交わす挨拶（主に同等の関係や目下の人に対して使う）。
안녕히=何事もなく安らかで無事に。／（主に別れの挨拶をするときに使われ）相手の安泰を祈る気持ちで。
안되다=事、現象、物などがうまく運ばない。／人が立派になれない。／一定の水準や程度に至らない。／（形容詞的用法）残念だったり気の毒だったりして、心が痛む。／（形容詞的用法）顔が青白く、やつれている。／気の毒だ。かわいそうだ。（心が痛む、不憫に思う）／（顔色が）良くない、やつれている。（状況や暮らし向きが良くない）
안쪽=ある物体や空間の内部、または中心に近い部分。／ある線や境界の内側になる方。
알려지다=ある事実や知らせ、噂などが多くの人に伝わり、知られるようになる。／世間に名前や名声が広く知れ渡る。
앞쪽=向かっている正面の方向や場所。／進行方向の前方。
애인=互いに愛し合っている関係にある人。または、恋愛の対象。
앨범=写真や切手、サインなどを収集して保管できるように作った本（アルバム）。／歌手の曲を集めて発表する音盤の単位（アルバム）。
야구=9人で構成された2つのチームがバットとボールを使って競う球技。投手が投げたボールを打者が打ち、ベースを回ってホームに戻ると得点を得る方式だ。
야채=野原で育つ山菜。／食べるために畑で栽培する農作物。大根、白菜、レタス、きゅうりなどを総称する言葉。「野菜（チェソ）」と浄化して使うこともある。
약국=薬剤師が薬を調剤したり販売したりする場所。または、そのような施設を備えた場所。／病院や保健所などで薬を調剤して出す部署。
약사=大学で薬学を専攻し、国家試験に合格して保健福祉部長官の免許を受けた人。医師の処方に基づいて薬を調剤したり販売したりし、薬事に関する業務を担当する。
약속하다=他人とこれからのことをどうするか、あらかじめ決めておく。／将来にあることが起こると信じたり、誓ったりする。
얇다=厚さが薄い。または層や膜、服などが厚くない。／唇などが厚くない。／(比喩的に) 音や声が軽くて高い。／(比喩的に) 信念や主観がしっかりしていない。
양말=足に履く、布や糸で編んだもの。足を保護し、保温したり汗を吸収したりする役割をする（靴下）。
양복=洋服（スーツ）。西洋式の正装を総称する言葉。主に上下を同じ生地で仕立てた紳士服を指すが、婦人用のスーツを含むこともある。
양식집=西洋料理を専門に作り、販売するレストラン。（ステーキ、パスタ、とんかつなどを主に販売する。）
양치질=歯を磨き、水で口の中をゆすぐこと。（主に「歯磨きをする」という形で使われる。）
어린아이=年齢の低い子供。通常、乳幼児期から小学校低学年程度の子供を指します。
어머님=「어머니（母）」の尊敬語。主に他人に自分の母のことを話したり、他人の母を高めて呼ぶ時に使う。／義母（夫の母、または妻の母）を高めて呼ぶ言葉。／子供がいる女性を親しみを込めて高めて呼ぶ言葉。
어젯밤=すぐ前の夜（昨日の夜）。
어쩌다=「어쩌다가」の略。思いがけず、または偶然に。／「어쩌다가」の略。たまに、または稀に.／「どうにかする」、「ある態度を取る」という意味の「어찌하다」の縮約形。／（主に「어쩌다가」の形で使われ）思いがけず偶然に起こる。
억=万の万倍になる数の。（数冠詞として体言の前に置かれ、数量を表す）／非常に多い数の。（比喩的に非常に大きな数量を表す）／万の万倍になる数。数字で書くときは「100,000,000」と表記し、兆の万分の一である。／数詞として「億」は数の単位として使われ、非常に多い数や量を比喩的に表すときにも使われる。
언론=言葉や文章で自分の思想を発表し、公論を形成する活動。／新聞、放送、雑誌などのように、大衆にニュースや意見を伝える媒体やその機関。
얼다=液体や水分が温度が低くなって、固体状態に固まる。／寒さのために体の一部が感覚を失ったり、機能が麻痺したりする。／（比喩的）緊張したり怖がったりして、体や心が固まる。／（経済）資金や流れなどが円滑でなく、すっかり滞る。
얼른=ためらわずに、すぐに。／時間が遅れることなく、非常に早く。
얼음=水が凍って固まった固体状態の物質。／(比喩的) 性質や態度が非常に冷淡で冷ややかな状態を指す言葉。／(比喩的) 緊張感によって体や雰囲気が固まってしまった状態を指す言葉。
엄청나다=数量、程度、大きさなどが基準よりずっと上回っている、またはすごい。／状態や現象が想像を絶するほどものすごい。／（比喩的に）非常に驚いたり、戸惑うほど大きい。
업무=職場や組織で継続的に担当し遂行する事務や事業（業務 / 仕事）。／個人が生計を維持するために一定の職業に従事し、継続的に行う仕事（業務 / 務め）。
업체=利益を得るために事業を営む企業体(業者 / 企業)。
없어지다=あったものが消えたり、見えなくなったりする。／ある制度、風習、現象などが消えて存在しなくなる。／(金や時間などが)使い果たされて残らなくなる。／人が亡くなる。（婉曲的な表現）
없이=何の過ちや罪もない状態で。
엉덩이=人の臀部の上部から腰の下に至る身体部位(お尻)。／物の底や下の部分を比喩的にいう言葉。
에어컨=室内の温度、湿度、清浄度を調節して快適な状態に維持してくれる機械装置。「冷房機」と言い換えられることもある。
엘리베이터=建物や施設の中で人や荷物を上下方向に垂直移動させるために作られた昇降装置（エレベーター / 昇降機）。
여권=政府が外国を旅行する者の身分や国籍を証明し、相手国にその者の保護を依頼するために発行する証明書（パスポート）。
여기다=心の中でどのようであるかと考えたり認めたりする。（ある対象や状態を特定のものとしてみなす。）／大切に思ったり、貴重に扱ったりする。
여덟=七つに一を加えた数。（基数：八）／順番に数えたとき、八番目になる数。（序数：第八）／七に一を足した数の。（後に来る名詞を修飾して、その数量を表す。）
여동생=同じ親から生まれた兄弟や兄妹の間で、自分より年下の女性を指す言葉（妹）。
여든=10の8倍になる数の。後にくる名詞（数量単位）を修飾する役割をする。／10の8倍になる数（80 / 八十）。／（冠形詞として使われる時）10の8倍になる数の。
여보세요=電話に出る時や掛ける時、相手を呼ぶ言葉（もしもし）。／道や大きな通りで、遠くにいる人を呼ぶ時に使う言葉（ちょっと / すみません）。／目下の人や対等な人を呼んで、注意を引こうとする時に使う言葉（おい / ちょっと）。
여섯=(冠形詞) 5に1を足した数の。後に来る名詞を飾り、その数量が6であることを表す。／五に一を足した数（六 / むつ）。／順序や順番が六番目になる数（六番目）。
여전히=以前と変わりなく、そのまま。
여쭙다=「問う・聞く」の謙譲語。目上の人に話をしたり、挨拶をしたりする。／目上の人に、ある事柄について意見を聞いたり教えを請うたりする。
여학생=学校に通う女子、または女性の成人(女子学生 / 女子生徒)。
여행사=旅行客のために乗車券の予約、宿泊施設の斡旋、観光案内など、旅行に必要な各種便宜を提供し、手数料を受け取る産業機関(旅行代理店 / 旅行会社)。
여행지=旅行をする目的地や、旅行に行くことに決まった場所（旅行先）。
여행하다=自分が住んでいた場所を離れ、他の地域や国を見物したり、様々な用事を済ませるためにあちこち行くこと。
역할=自分が当然すべき、受け持った職責や任務（役割 / 役目）。／映画や演劇などで俳優が引き受けて演じる人物（役 / 配役）。／（比喩的に）ある物事や現象が及ぼす影響や作用（役割 / 働き）。
연결=二つ以上の物事や現象などが互いにつながったり、関係を結んだりすること。／コンピュータや電話などの通信網が互いに通じる状態になること。／ある物を別の物につなぎ合わせること.
연구=ある物事について深く調査・分析し、真理を究明すること。／技術を磨いたり、新しい知識や理論を得るために特定の分野に没頭すること。
연락처=互いに連絡を取り合うことができる電話番号や住所、メールアドレスなどをひっくるめて言う言葉（連絡先）。
연말=一年の終わり。主に12月末頃を指す。／一年の終わりごろ(年末)。
연세=「年齢（나이）」の尊敬語。主に目上の人や年配者の年齢を丁寧に呼ぶ際に使われる。
연습하다=学問や技術などを習得するために、同じことを繰り返して身につける（練習する）。
연예인=俳優、歌手、コメディアンなどのように、演劇、映画、放送、音楽などの芸能界に従事し、大衆の前で技芸を見せることを職業とする人（芸能人）。
연필=黒鉛と粘土の混合物を焼いて作った細い芯を中に入れ、外側を木で囲んで作った筆記用具。文字を書いたり絵を描いたりする時に主に使われ、消しゴムで消せることが特徴である。
연휴=休日が二日以上続くこと。また、その休日（連休）。
열쇠=鍵（かぎ）：錠を締めたり開けたりするのに使う道具。／（比喩的）鍵、キー：ある問題や秘密を解決できる決定的な手がかりや方法。
열흘=十日間という時間。／毎月のついたちから数えて十日目の日。
엽서=一定の規格の厚紙に簡単な内容を書き、切手を貼って送る郵便物。封筒に入れず、そのまま送る。／写真や絵が印刷された紙の裏面に文章を書いて送る通信手段。
영=何もない状態を表す数。（数字の「0」）。／温度計や目盛りなどで基準となる点。／(主に否定の言葉と共に使われ) いくらしてもどうしても。または、全く。／状態や様子が予想や以前とは全く違う様子。
영국=欧州大陸の西北にある島国。グレートブリテン島とアイルランド島北東部から成り、ロンドンを首都とする。正式名称は「グレートブリテン及び北アイルランド連合王国（United Kingdom of Great Britain and Northern Ireland）」である。／欧州北西部にある島国。イングランド、スコットランド、ウェールズ、北アイルランドで構成されており、首都はロンドンである。（正式名称は「グレートブリテン及び北アイルランド連合王国」である。）
영수증=お金や品物を受け取ったことを証明するために渡す紙切れ（領収書）。
영하=摂氏温度で0度(℃)より低い温度。水が凍る点以下の寒い温度を意味する。
영향=ある事物の作用や現象が他にまで及び、その状態や変化に何らかの作用を及ぼすこと。または、その結果。
영화관=映写施設を備え、観客に映画を見せる施設や建物。「劇場」と混用して使われることもある。
영화배우=映画に出演して演技をすることを職業とする人（映画俳優）。
옆집=隣の家。またはその家に住む人（隣家 / 隣人）。
예매=車券や入場券などをあらかじめ買っておくこと（前売り / 予約購入）。
예순=(数量を表す冠用詞として)10の6倍になる数の(六十 / 60)。／10の6倍になる数（六十 / 60）。
예습=これから学ぶ内容をあらかじめ調べたり読んだりして勉強すること（予習）。
예약=あらかじめ約束すること。または、そのような約束。／今後のことをあらかじめ決めておくこと。特に、レストラン、ホテル、公演会場などの座席や部屋を事前に確保する行為を指す。
예정=今後することを作業などをあらかじめ決めておくこと。また、その内容。
오=놀라움, 기쁨, 감탄, 혹은 깨달음을 나타낼 때 내는 소리 (お、おお)。／相手の言葉に肯定したり同意したりする時、あるいは新しく知った事実に対して反応する時に出す声。／(数量を表す冠用詞) 「5」の意味を表す言葉。後に続く単位名詞と結合して用いられる。／四に一を足した数。（アラビア数字では「5」、ローマ数字では「V」と表記する。）
오늘날=今の時代。または、現在。／近い過去から今に至るまでの期間。
오래간만=ある出来事があってから長い時間が経過した後。（主に「오래간만에（久しぶりに）」の形で使われ、長い時間の末に再びあることが行われることを表す。）
오래되다=時間の経過が長い。ある状態や出来事が発生してから長い時間が経過している。／時間の経過が長い。ある状態が始まってから長い時間が過ぎている。／品物や施設などが作られてから長い月日が経ち、古びている。
오렌지=ミカン科の常緑小高木、またはその果実。形はミカンに似ているが、皮が厚く汁が多くて香りが強い西洋の果物。／オレンジの果皮の色のような濃い橙色。
오른손=人の体で右肩の下についている手。普通、左手より力が強く、より頻繁に使われる。／(比喩的) ある人の仕事を助ける、最も信頼できて重要な人を指す言葉。
오십=(冠形詞) 四十九に一を足した数の。後に来る名詞を修飾して、その数量が五十であることを表す。／49に1を足した数。（10の5倍になる数 / 五十）。
오이=ウリ科の一年草のつる植物。またはその実。実は細長く、たいてい緑色で、水分が多くシャキシャキとした食感があり、食材として広く使われる。
오히려=一般的な考えや期待とは反対に、または異なって。（予想外の結果）／前の内容より後ろの内容の方がましである、またはより甚だしい。（むしろ、いっそ）／過ちを犯した人がかえって怒ったり、図々しく振る舞ったりする時。（逆ギレ）
올림=手紙や文書を締めくくる際、差出人の名前の後に書き、受取人への尊敬の意を表す言葉。「ドリム（드림）」よりさらに格式の高い表現。
옮기다=物体や対象をある場所から別の場所へ移動させる。／場所や住居、職場などを別の場所へ変える（移す）。／考えや計画、言葉などを行動に移したり、別の言語に翻訳したりする。／病原菌や噂などを他人に伝えたり広めたりする。／視線や足取りなどを別の方向へ向ける。
옷걸이=服を掛けて保管したり乾かしたりするのに使うもの（ハンガー）。／(比喩的に) 服を着た時に見栄えがする体つきや体格。
옷장=衣類を収納したり、掛けたりするために作られた家具（たんす / クローゼット）。
와=相手に会った時、非常に嬉しかったり喜ばしい気持ちを表す声。／物事に対して驚いたり感心したりする時に出す声。
와이셔츠=主に背広（スーツ）の中に着る、襟と袖がついた西洋式のシャツ。英語の「white shirt」に由来する言葉である。
외=一定の範囲や限度を外れた残り。名詞や名詞句の後に使われ、「それ以外」または「それを除いた」という意味を表す。／一定の範囲や限界の外(外 / 以外)。／(主に「-은/는 외에」の形で使われ)それ以外は。またはそれを除いた残り。
외국어=自分の国の言葉ではない、ほかの国の言葉(外国語)。
외롭다=一人でいたり、頼る場所がなくて寂しい感じがする(寂しい / 心細い)。／周りに誰もいなくてひっそりとして静かだ。
외우다=言葉や文章などを忘れないように、頭の中に記憶しておく。（暗記する）／記憶した内容を口に出して唱える。
외출=家や普段滞在している場所から、しばらくの間外に出ること。
왼손=人の体で、左肩についている腕の先端部分。／(比喩的) 中心となったり、主な役割を果たす側の反対側。
요구=相手に何かをしてほしいと強く求めること。また、その内容。／社会的、経済的な権利や利益を得るために、団体や個人が提示する条件。／状況や物事が必要とする条件。
요구하다=もらうべきものをくれるよう強く求めること（要求する）。／ある事柄や条件が満たされることを望むこと。／状況や事物が、ある状態や行為を必要とすること。
요리사=料理を作ることを専門とする人。またはそのような職業を持つ人（料理人 / シェフ）。
요리하다=料理を作る。米、野菜、肉、魚などの食材を加工して食べられる状態にする過程を意味する。／（比喩的に）ある物事を巧みに処理したり、相手を思いのままに扱う。
요일=一週間の中の各日のこと。日曜日、月曜日、火曜日、水曜日、木曜日、金曜日、土曜日を総称する言葉。
우동=小麦粉を練って作った太い麺をゆで、スープに入れたり炒めたりして食べる料理（うどん）。
우주=無限の時間と万物を含んでいる終わりのない空間（宇宙）。／地球を除いた天体が存在する空間（宇宙 / 外層圏）。／秩序ある体系としての世界、または万物。
우체국=郵便物나小包を受け付けて配達し、預金や保険などの金融業務を扱う公共機関(郵便局)。
우표=郵便料金を支払ったことを証明するために郵便局で発行し、手紙や小包などに貼る証票（切手）。
운동복=運動をするときに着るのに便利なように作られた服（運動着 / スポーツウェア）。
운동하다=体を鍛えたり、健康のために体を動かす。／ある目的を果たすために大衆を扇動したり、一定の方向に導く。／物体が時間の経過とともにその位置を変える。
운동화=運動する時に履きやすいよう、ゴム底を付けて作った靴。軽くて丈夫で、活動性に優れている(運動靴 / スニーカー)。
운전=機械や自動車などを操縦して作動させること（運転）。／資本や組織などを働かせて活動させること（運用 / 運転）。
운전하다=機械や自動車、船、飛行機などを操作して動かすこと（運転する）。／資本や組織などをうまく活用して運営していくこと（運用する / 回す）。
울산=大韓民国の東南部海岸に位置する広域市。現代自動車、現代重工業など大規模な工業団地が造成された韓国最大の工業都市である。／大韓民国慶尚南道の北東部海岸に位置する広域市。韓半島最大の工業都市で、自動車、造船、石油化学産業が発達した国家産業の中心地である。
울음=声を出しながら涙を流すこと（泣き / 泣くこと）。／鳥や獣、虫などが鳴く声（鳴き声）。
움직임=体や体の一部を動かしたり振ったりすること。／一定の目的や方向性を持って起こる活動や変化。／ある状態や現象が変わったり、変わろうとしたりする兆し。
원인=ある状態を作り出したり、事件を引き起こしたりする根本となった事柄や理由。（物事や現象が起こる根拠）
원피스=上衣と下衣が一つに繋がった形の女性用の服（ワンピース）。／切り離されず、一つの塊になっている物。
월=一週間の最初の日の「月曜日」を略して言う言葉。／(依存名詞) 一年を十二に分けた月を数える単位。／(依存名詞) 月数を表す単位。「箇月(개월)」と同じ意味で使われる。／一年を十二に分けたものの一つ。（主に数字の後に使われ、特定の月を指す。）／「何月」の意味で使われ、日付を尋ねたり答えたりする時に使う。
월급=職場や仕事場で一ヶ月間働いた対価として受け取る報酬（月給）。
월요일=日曜日の次の日で火曜日の前の日。週が始まる最初の曜日(月曜日)。
위쪽=高い所や前の方に向かった方向、または位置。／ある基準より数量、程度、価値が高い状態、または部分。／文章や本などで前の方、または上段に位置する内容。
위하다=ある人や事物を利するようにしたり、助けたりする。／あることを目的にしたり、大切にしたりする。／尊敬したり、真心を尽くしてもてなしたりする。
유리=利益があること。または、条件や状況などが利益になるようになっていること。（反対語：不利）／砂、炭酸ナトリウム、石灰石などを混合して高温で溶かした後、冷却して作った、透明で硬く割れやすい物質。／珪砂、炭酸ナトリウム、石灰石などを高温で溶かした後、冷却して作った透明で硬く、壊れやすい物質。窓、器、眼鏡のレンズなど多様な用途に使われる。／(比喩的表現) 状態が非常に清らかで透明であることを指す言葉。
유명=名前が広く知られていること(有名)。／(主に「有名歌手」、「有名人」などの形で使われ) 名高い状態やそのような人。
유치원=満3歳から小学校入学前の子供を教育するために設立された教育機関（幼稚園）。
유학=孔子の教えを根本とする学問。修己治人、すなわち自己修養を通じて徳を積み、世を治めることを目的とする。／儒教の学術的な側面を指す言葉。／外国に滞在して勉強すること（留学）。
유학생=外国に滞在しながら勉強をする学生（留学生）。
유행=社会のある時期に、新しい様式や現象、事物などが広く普及し、多くの人の関心を集めてそれに従う現象（流行）。／伝染病が広く蔓延すること。
육=五に一を足した数。（アラビア数字で「6」と表記する。）／順序や順番が六番目であることを表す言葉。／5に1を足した数の。後に来る名詞を修飾して数量を表す(六 / 6 / 六つの)。
육교=道路、鉄道、渓谷などをまたいで人や車両が通行できるように作られた橋。主に歩行者の安全な横断のために道路の上に設置された歩道橋を指す。
육십=59に1を足した数の。後に来る名詞を修飾して、その数量が60であることを表す。／10의 6倍になる数。59に1を足した数（数詞および冠用詞として使われる）。
윷놀이=4つのユッ（木の棒）を投げ、 그結果に応じて板の上の駒を動かして勝敗を競う韓国固有の民俗遊び。主に正月から小正月（旧暦1月15日）まで行われる。
음료수=人が飲むことができるように作られた液体。水をはじめ、酒や茶、牛乳などを総称する言葉。／一般的に水以外に、喉の渇きを癒したり味を楽しんだりするために加工された液体状態の食品（炭酸飲料、ジュースなど）を指す言葉。
음식점=一定の施設を備え、料理を作って客に売る店。「食堂」と同じ意味で使われる。
음악가=音楽を専門的に作曲したり、演奏したり、歌ったりする人(音楽家)。
의견=ある対象や現象、問題に対して持つ考え。／自分の心や主張を表したもの。
의식=個人や集団が物事や現象に対して持つ考えや態度（精神状態）。／目覚めている状態で自分自身や周囲の環境を認識できる精神作用（知覚能力）。／社会問題や自分の立場などに対して目覚めている考え（社会的な関心）。／定められた規則や礼法に従って行われる行事。主に婚礼、葬儀、宗教的行事など、格式を重んじる状況を指す。／集団や共同体の結束を固めるために慣習的に行われる一定の行動様式。
의지=何かを成し遂げようとする強く堅い心。または、目的を達成するために自らの行動を決定し調節する自발的な精神作用（意志）。／ある事を成し遂げようとする断固たる心や精神状態（意志）。／他のものに体や心を寄せて助けを受けること。またはその対象（寄りかかること / 依存）。
의하다=ある人や物、現象などを根拠や条件とする。／ある力や手段、方法などの助けを借りる。／ある原因や理由に起因する。
이다=体言や体言の役割をする言葉の後に付き、文章の主語が何であるかを指定したり説明したりする機能を持つ叙述格助詞。
이따가=少し経った後で。時間的にあまり遠くない近い未来を表す時に使う。
이러하다=状態、形、性質などが、さきほど言った通りであるか、このようである。
이루다=夢や願いなどを実際に叶えたり、完成させたりする。／ある状態や結果を作り出したり、形成したりする。／何かを構成して全体を作る。
이루어지다=意図した通りの結果が現れる。（主に願い、夢、計画などが実現する時に使われる。）／ある対象がいくつかの部分や要素で構成される。／ある状態や関係が形成される。
이모=母親の姉妹（おば）。／(非公式) 食堂や店などで働く中年女性を親しみを持って呼ぶ言葉。
이미지=感覚によって抽象的に再生される記憶や映像。（視覚的、聴覚的、嗅覚的イメージなど）／ある人や物に対して抱く主観的な印象や感じ。／心象（イメージ）の意味で、芸術作品において具体的な形象を通じて現れる作者の意識状態や感じ。
이분=(代名詞) 話し手に近いところにいる人、または話し手が考えている人を高めて言う語。「この人」の尊敬語。
이불=寝る時に体を掛けるために使う寝具の一つ。中に綿や羽毛などを入れ、表を布で包んで作る(布団)。
이삿짐=引っ越しの時に運ぶ荷物。
이상하다=状態、形、性質などが正常であったり一般的であったりするものとは異なるところがある。／これまでの経験や知識では理解できないほど妙であったり奇妙であったりする。／疑わしかったり、不審な点があったりする。／（体や機械などが）故障したり、病的な症状があったりする。
이십=十の二倍になる数（二十）。／後に来る名詞を修飾し、その数量が二十であることを表す。
이어지다=途切れずに長くつながる。／前の内容や現象が後ろへ続く。／ある状態や関係が維持される。／複数の物体や線などが切れずに丸くつながって一つに統合される。
이용하다=対象を必要に応じて役立てたり、有用に使ったりする（利用する）。／対象を自分の利益のための手段として使う（利用する / 悪用する）。／交通手段や施設などを使う（利用する）。
익다=あることを何度もして、不慣れでなくなり熟달する。（主に「手に馴染む」という形で使われる。）／頻繁に見たり聞いたりして、とても親しみがある。（見慣れる、聞き慣れるなど。）／(実や種が) 木や草で完全に育ち、味が良くなる(熟す)。／(肉や野菜などが) 熱を受けて食べごろの状態に変わる(焼ける / 煮える)。／(キムチや酒などが) 発酵して味が深まる(浸かる / 熟成する)。／(技術や仕事が) 体に馴染んで、手際よくできるようになる(慣れる)。／(顔や目に) たびたび見ていて見慣れている(見覚えがある)。
익숙하다=ある事を何度も経験して、手際が良く熟練している（慣れている / 熟練している）。／ある物や状態をよく見たり経験したりして、見慣れている（馴染みがある）。
인간=人が住む世の中。または人間社会。／一定の資格や人格を備えた人。／（生物学的意味で）ヒトという動物の種。
인도네시아=東南アジアにある島国。世界で最も島が多い国であり、首都はジャカルタである。
인류=全世界のすべての人。または人類共同体を構成する人間全体。／生物学的分類においてヒト属に属する動物を総称する言葉。
인물=人の人柄や品性。／優れた才能や業績を持つ人。／表に現れた人の姿や、整った容姿。／小説、演劇、映画などに登場する人物。
인분=一人前の食事の分量を数える単位。主に肉やご飯などの量を表す時に使う。／人の数に応じて分量を分けて数える時に使う単位。主に料理の量を表す時に使われる(〜人前)。
인사하다=会ったり別れたりする時、あるいは礼儀を表すべき時に、言葉や仕草で礼を示す。／感謝の意や祝辞の意を表す。／初めて会った人同士がお互いに自己紹介をする。
인삼=ウコギ科に属する多年草。根は薬材として使われ、補身や強壮の効能に優れており、珍重される。／1의根を乾燥させたり加工したもの。気力の回復や免疫力の増進のために煎じて飲んだり、薬材として使用する。
인생=人が世の中を生きていくこと。または、その期間。／人の生涯や人生の道のり。／(比喩的に) ある対象に精一杯の誠意を尽くしたり、深い価値を付与したりすること。
인정받다=能力や価値、正当性などが他人に確実に受け入れられる（認められる）。／ある事実がその通りだと公式に判断されたり、確認を受けたりする。
인천=大韓民国京畿道の西部に位置する広域市。黄海に面した港湾都市であり、仁川国際空港が位置する交通の要衝である。／大韓民国の西海岸に位置する広域市。韓国を代表する港湾都市であり、国際空港がある交通の要衝地である。
인하다=ある事実が原因になる。（主に「-으로 인하여（～によって）」、「-으로 인한（～による）」の形で使われ、前の内容が後ろの内容の根拠であることを表す。）
인형=人や動物の姿に似せて作ったおもちゃ。木、布、ゴム、プラスチックなど、さまざまな材料で作られる。／(比喩的) 独自の主観を持たず、他人に言われるがままに動く人のこと。／(比喩的) 目鼻立ちがとても整っていて、可愛らしくて美しい人のこと。
일곱=(冠形詞) 6に1を足した数の。とに続く名詞(数量単位)を修飾して、その数が7であることを表す。／六に一を足した数（七 / 七つの）。
일기=毎日その日その日に経験した出来事や考え、感じたことなどを記した記録。／日付別に記録する個人的な帳簿や記録物。／その日その日の天気や気温、風、雨などの気象状態。一定期間の天気の変化。
일단=まず、とりあえず。（あることを本格的に始める前に、優先的に行うことを表す時に使用）／一度、いったん。（ある状況が発生したり条件が整ったりすると、その後に何かが起こることを表す時に使用）／さしあたり、ひとまず。（しばらくの間の猶予を表す時に使用）
일반=特別ではなく、平凡な水準のもの。／全体に広く当てはまったり、通用したりすること。／（名詞の後で）それと相違ないこと、または同様であること。
일본=アジア大陸の東端、北太平洋上に弓なりに長く延びている島国。北海道、本州、四国、九州の4つの大きな島と、数多くの小さな島々からなる。／アジア大陸の東側に位置する島国。首都は東京であり、四方を海に囲まれている。
일본어=日本人が使用する言語。系統的にはアルタイ語族に属するという説があるが、定かではない。韓国語と文章構造が非常に類似している。
일식=日本固有の方式で作られた食べ物。またはそのような料理(和食 / 日本料理)。
일식집=日本食を専門に作って販売する店（和食屋 / 日本料理店）。
일으키다=横たわっていたり座っていたりする人を立たせる。／倒れたり転んだりしたものをまっすぐに立てる。／病気や事故、戦争、騒動などを発生させる（引き起こす）。／事業や家柄などを盛んにしたり繁栄させたりする。
일흔=十の七倍になる数の。（後に来る名詞を修飾する連体詞：七十の）。／そのくらいの順序(七十番目)。
임금=労働者が労働の対価として使用者から受け取る報酬。一般的に金銭の形で支払われる(賃金)。／国を治める最高統治者。「王」や「君主」を指す言葉(王 / 君主)。／労働者が労働の対価として使用者から受け取る報酬。主に時間、日、月単位で計算され支払われる。
입시=入学試験の略。主に大学や高校など、上級学校に進학するために受ける試験を指す。
입원=病気を治すために、一定期間病院に入って滞在すること（入院）。
입장=行事や公演、展覧会などが開かれる場所の中に入ること（入場）。／置かれている都合や境遇（立場 / 境遇）。／ある問題に対して取る観点や態度（立場 / 見解）。／立場、処地、状態：個人が置かれている都合や状況。／立場、観点、態度：ある物事や現象を見つめ、対する方向や観点。
입장권=会場、展示場、競技場などの場所に入るために必要な権利を証明する券（入場券）。
입학시험=学校や教育機関に入学するために受ける試験(入試 / 入学試験)。
잇다=切れたり離れたりした部分を互いにつなげたり合わせたりする。／絶え間なく続くようにし続ける。／多くの人や物が列を作って並ぶ。／祖先の代や伝統、命脈などを受け継ぐ。
잊어버리다=一度覚えたことを思い出せなかったり、思い出せなかったりすること（忘れる）。／覚えておくべきことを疎かにして、不意に逃してしまうこと。／ある状態や事実を心の中から完全に消し去ること。
자=(人を表す名詞の後や連体修飾節の後に使われ) 「人」を低めて言ったり、格調高く言ったりする言葉。／(主に「-る者」、「-した者」の形で使われ) ある性質や特徴を持つ人を指す言葉。／人の勧誘や頼みを聞き入れる時、または何かを始めようとする時に出す声（さあ / では）。／相手の注意を引いたり、何かを催促したりする時にかける言葉（ほら / さあ）。／決心を固めたり、新しい局面に転換したりする時に自分に言い聞かせる言葉（よし / さて）。／言葉を記す記号の一つひとつ。（文字）／名前や文章の文字数を数える単位。／漢字のことを指す言葉。／線を引いたり長さを測ったりするのに使う道具。目盛りが刻まれており、竹、木、プラスチック、鉄などで作られる(物差し / 定規)。／長さを測る単位。一「チャ(尺)」は約30.3cmに当たる。
자기=その人自身を指す言葉。前ですでに言及された人を再び指す時に使う。／自分の利益や立場だけを考える態度や状態。／哲学的意味で、思考や行動の主体となる自分自身。／前に言及された人を再び指す三人称再帰代名詞（自分 / 自己）。／話し手が自分自身を指す言葉（主に親しい間柄や非公式な場で使用）。／ある事柄や現象の主体となる、その人自身。／その人自身を指す言葉。前に言及された対象を再び指す時に使う。／自身の体や心、または自分に属する状況や都合を指す言葉。／(口語で) 恋人や配偶者など、非常に親しい人を親しみを込めて呼ぶ言葉。／[代名詞] 前ですでに言及された人を再び指す三人称再帰代名詞（自分）。／[代名詞] その人自身（自己）。／[代名詞] 主に恋人や夫婦の間で相手を親しく呼ぶ二人称代名詞（ハニー / ダーリン）。
자기소개=初めて会う人や大勢の人の前で、自分の名前、経歴、職業、性格などを知らせること（自己紹介）。
자동판매기=お金を入れると、人が直接売らなくても機械が自動で商品やサービスを提供する装置。（略して「自販機」ともいう。）
자랑=自分に関係のある人や物、または自分自身の事柄などが、他人に際立って見えるものであることを他人に表して自慢すること。／他人に誇って見せるに値する事柄や物。
자료=研究や調査などの土台となる材料(資料)。／ある事を行うために必要な記録や物(資料)。
자세=体を動かしたり、支えたりする様子（姿勢）。／物事に対処する時の心構えや態度。／ある事に臨む基本的な立場や方向性。
자연스럽다=無理に飾っておらず、不自然なところがない。／理にかなっていて当然だ。／力を入れたり努力したりせず、自然にできたようだ。／（表情や態度などが）ぎこちなくなく、スムーズだ。
자장면=肉と野菜を甘く炒めた春チャジャン（チュンジャン）に麺を和えて食べる中国料理。（中国語の「ジャジャンミェン」に由来する。）
자체=他のものが混じっていない、その対象本来の素地。／(代名詞的な性格で使われ)「それが持つ本来の性質や姿」を強調していう言葉。
자판기=「自動販売機」を略していう言葉。硬貨や紙幣、カードなどを入れると、機械の中に入っている品物が自動的に出てくる装置のこと。
작가=文学作品を創作する人。小説家、詩人、劇作家などをひっくるめて言う言葉。／芸術的作品を制作する人。画家、彫刻家などを含む。／シナリオや放送台本を専門的に書く人。
작업=一定の目的と計画の下、体や精神を使う活動。または、その活動の過程。／機械などを操作して物を作る仕事。／(俗語) 異性を誘惑したり、付き合ったりするために試みる行動。
작용=ある物質や力が他の事象に影響を及ぼして現象を引き起こすこと。または、その影響。／ある目的や意図に従って体や心を動かすこと。／[生物] 生物が生命を維持するためにエネルギーを獲得したり消費したりするすべての活動。／[法律] 行政主体が法規を執行して行政目的を達成する活動。
작품=芸術的な努力と技巧を凝らして作られたもの（文学、美術、音楽、映画など）。／ある人が丹精込めて作り上げた結果物や成果。／（比喩的に）ある意図や計画によって作られた状況や現象。
잔치=嬉しいことがあった時、料理を並べて大勢の人が集まって楽しむこと（宴 / パーティー / 振る舞い）。／（比喩的に）ある物事や現象が豊かに現れる状態を指す言葉（祭典 / づくし）。
잘생기다=人の顔や体つきが整っていて見栄えが良い（格好いい / ハンサムだ）。／物の形が立派で、見た目が良い。
잠자다=目を閉じて体と精神の活動を止め、休息を取る（眠る / 寝る）。／ある物事や現象が活動せず、静かな状態にある。／（比喩的に）亡くなって永遠に休む。
잡수시다=「食べる」の尊敬語。主に目上の人や上司など、敬うべき対象が食べ物を食べる行為を指す時に使う。／（比喩的に）年を取ることを敬って言う言葉。
잡채=茹でた春雨に炒めた肉、きのこ、ほうれん草、キキョウの根、玉ねぎなど様々な野菜を入れ、醤油、砂糖、ごま油などの調味料で和えて作った韓国の伝統料理。
장갑=手を保護したり寒さを防いだりするために手にはめるもの。布、革、毛糸、ゴムなどで作られる(手袋)。
장관=行政各部の長。国務委員の中から大統領が任命し、所管事務について中央行政機関の長として指揮および監督権を持つ(大臣 / 長官)。
장난감=子供が持って遊ぶ道具（おもちゃ / 玩具）。／比喩的に、他人から利用されたり、あざ笑いの対象になったりする人や物を指す言葉。
장마=梅雨の時期に数日間降り続く雨、またはその現象。
장미=バラ科バラ属に属する落葉低木の総称。茎には通常棘があり、花は5月から6月の間に赤、白、黄色など様々な色で華やかに咲く。香りが強く、観賞用や香料の原料として多く栽培される。
재미없다=楽しさや興味を感じさせる要素がない（つまらない / 面白くない）。／話や状況などが退屈で、ためにならない。
재산=個人や団体が所有している経済的価値のあるすべての物と権利。（金、家、土地、株式など）／（比喩的に）大切な能力や経験、または人。
재채기=鼻の粘膜が刺激を受けて急激に空気を吐き出す反射的な反応。普通「ハクション」という音を伴い、風邪やアレルギー、あるいは突然の光の刺激によって起こる(くしゃみ)。
저거=話し手と聞き手から遠く離れているものを指す代名詞。「저것（あれ）」の口語。
저것=話し手と聞き手から遠くにある事物を指す代名詞（あれ）。／すでに前で言及されたか、話し手が考えている対象を指す代名詞（あれ / それ）。
저곳=話し手と聞き手から遠く離れている場所を指す指示代名詞（あそこ）。
저금=1. お金を節約してためておくこと。 2. 銀行や郵便局などの金融機関にお金を預けること。（類義語：預金）
저런=思いがけない不幸な出来事や残念な状況を見たり聞いたりした時、気の毒に思ったり惜しんだりして発する言葉（あら / まあ / おや）。／予想外の状況や驚くべき出来事を目撃した時、軽く驚嘆して発する言葉（おやまあ / おっと）。／話し手や聞き手から遠くにある対象の状態、形、性質などがそのようである様子。「저러한（あのような）」の縮約形。／（感嘆詞的に使われ）意外な出来事や不幸な出来事を見た時、気の毒に思って発する言葉。
저렇다=状態、形、性質などが、話し手や聞き手から離れている対象と同じであることを表す形容詞。／（主に「저렇게」の形で使われ）先に言及された内容や状況がそのようであることを表す言葉。
저번=話している時点を基準に、その直前に過ぎ去った時や機会。
저분=話し手と聞き手から遠く離れている人を敬って指す言葉（「この方(이분)」、「その方(그분)」に対応する言葉）。
적=(動詞や形容詞、「이다」の連体形の後ろに使われ) 以前に、ある事があった時や機会。(主に「-したことがある/ない」の形で使われる。)／(「-を/る」の後ろに使われ) ある事が起こりそうな時や機会。／戦ったり、害そうとしたりする相手（敵）。／物事や状態に害となる対象。／競争関係にあり、勝たなければならない対象。
전공=ある分野を専門的に研究したり勉強したりすること。またはその分野。／大学などで学生が選択して集中的に履修する専門的な学問領域。
전국=一国全体の範囲（全国）。／国中のあらゆる場所（全国各地）。
전문=ある分野に相当な知識と経験を持ち、その仕事だけに集中的に従事すること。または、その分野。／ただ一つの事だけに力を注ぐこと。
전부=ある対象をなす一つひとつのものをすべて合わせたもの。全体。／（副詞的に使われ）残らず、すべて。／ある対象をなす一つひとつのものが漏れなくすべて集まった状態（全部 / すべて）。／ある事柄や状況において、最も重要であるか唯一の要素であることを表す言葉。
전쟁=国家と国家、または交戦団体の間で、武力を用いて争う状態。／（比喩的に）ある目的を達成したり、困難を克服したりするために激しく争ったり努力したりする状態。（例：受験戦争、交通戦争）
전철=電気鉄道の略称。電気を動力として列車が走れるように作った鉄道、またはその上を走る列車。主に都市内部や近隣都市間を繋ぐ交通手段。／(比喩的意味) 前の人がすでに歩んだ道や足跡。主に先人の失敗や過ちを繰り返すことを警戒する際に使われる。
전통=ある集団や共同体で過去から受け継がれ、現在まで伝わっている思想、慣習、行動様式などの系統。／古くから伝わってきた固有で高貴な精神や技術。／ある集団や共同体で過去から受け継がれ、現在まで伝わっている思想、習慣、行動様式などの系統。／ある分野や集団で長い間築き上げてきた固有の家風や特色。
전화기=音声を電気信号に変えて遠くに送り、受け取った電気信号を再び音声に再生して、遠く離れている人と通話できるように作った機械装置（電話機）。
전화번호=電話の利用者を識別して、電話をかけたり受けたりできるように付与された固有の番号。
전화하다=電話機を利用して相手に言葉を伝えたり、言葉を交わしたりする（電話する）。
점=成績や点数などを表す単位。／一定の基準に従って付けられた成績や数値を表す単位。／囲碁で地の数を数えたり、碁盤上の位置を表す単位。／小さく丸く現れる形(点)。／文字を書いたり絵を描いたりする際、筆やペンの先で記す印（例：句読点など）。／ある空間や時間の特定の場所や場面。／事物の属性や状態の一部分（例：長所、短所）。／成績や評価を数値で表した単位。
점수=試験や競技、評価などで実力を数値で表した成績。／物事や人に対する評価や価値を数値化したもの。／ビリヤードなどのゲームで獲得した得点の数。
점심때=昼食を食べる時(昼食時)。／昼の12時を前後する時間。
점심시간=昼食を食べる時間（昼食時間 / お昼休み）。／職場や学校などで昼食を食べるために決められた休憩時間（昼休み）。
접다=平らな物体や紙、布などを重ねたり曲げたりする（折る / 畳む）。／していた仕事や考えを途中でやめる（切り上げる / あきらめる）。／飛行機や扇子などの翼や骨組みをすぼめる（畳む / 閉じる）。／年齢、点数、価格などを実際より削ったり低くしたりする（まける / 譲る）。
접시=음식を入れるのに使う、平たくて平らな器。／(数量を表す言葉の後に使われ) お皿に盛られた料理を数える単位。
젓가락=食べ物を挟んで食べたり、物を挟んだりするのに使う道具。細長い木、鉄、プラスチックなどの棒二本で一対をなす（箸）。
정거장=バスや列車が乗客を乗せたり降ろしたりするために、決まって停車する場所（停留所 / 駅）。／（比喩的に）ある過程や目的地に到達する前に、しばらく立ち寄る場所。
정류장=バスやタクシーなどの乗り物が、人を乗せたり降ろしたりするために留まるように定められた場所（停留所 / 停留場）。
정문=建物の正面にある主な出입口（正門）。／ある場所や区域に入るための公式で最も大きな門。
정보=観察や測定を通じて得られたデータを、実際の課題解決や意思決定に役立つように整理した知識(情報)。／ある状況や事件に関する知らせや内容(情報)。
정부=一国の統治権を行使する中央機構。広義では立法、行政、司法のすべての組織を含むが、狭義では行政権を行使する行政府のみを指す。／政策を樹立・執行し、国家を管理する最高機関。
정신=肉体や物質に対立する魂や心。／物事を感じ、考え、判断する能力。またはそのような作用。／物事の根本的な意義や目的。または価値観や態度。／意識をしっかり持ったり集中したりする力。
정신없이=精神が一方に偏り、自分を忘れたり状況をまともに把握できないほど、ひどく忙しくて慌ただしい状態で。／気力や意識がないほど、非常に激しく。
정원=家の中に花や木を植え、丹精込めて手入れした庭や花壇。／美観や休息を目的として木を植えたり施設を配置して整えられた公共の場所。／集団や組織、施設などで法規や規定によって定められた人数。／車両、船、飛行機などに乗ることができるように定められた人数。
정치=国を治めること。国家の権力を行使して社会秩序を維持し、国民の利害関係を調整して政策を樹立する活動をいう。／個人や集団の間で利害関係が衝突する際、これを解決して合意を導き出す過程や技術。
정형외과=腕、足、腰などの骨や関節、筋肉といった運動器官の疾患や外傷を、手術的または非手術的な方法で治療する医学の一分野。または、その分野の診療を行う病院。
정확=正しくて確実で、間違いがないこと。対象の数値、情報、発音などが事実と食い違わず、ぴったり合っていること。
정확하다=正しくて確実だ。事実や基準にたがわず、ぴったり合っている(正確だ)。
제=「私の考え（제 생각）」が短くなった言葉。話し手が自分を低めて指す「저（私）」に主格助詞「가（が）」が結合したり、慣用的に自身の意見や判断を控えめに表現する時に使われる。／話し手が自分をへりくだって指す代名詞「저（私）」に助詞「가（が）」がつく時の形。（一人称代名詞）／「저의（私の）」の縮約形。話し手が自分をへりくだって指す時に使う連体詞的な形。
제대로=決められた規格や格式に合うように（正しく / きちんと）。／不足することなく十分に。／結果が満足できるほど正しく。
제주도=大韓民国の南西海上に位置する最大の島。行政区域上は済州特別自治道に属し、漢拏山(ハルラサン)を中心に独特な自然景観と文化を保っている国際的な観光名所である。／大韓民国の南西海上に位置する最大の島であり、広域地方自治体の一つ。漢拏山(ハルラサン)を中心に美しい自然景観を備え、世界的な観光地として有名である。
제품=原料を用いて品物を作ること。または、そのようにして作られた品物(製品)。
조건=ある事を成し遂げたり成立させたりするために備えるべき状態や要素（条件）。／[法律] 法律行為の効力の発生や消滅を将来の不確実な事実の成否に依存させる法律行為の付款。／一定の対価や報酬を望んで提示する要求事項。
조사=物の内容を明確に知るために、詳しく調べたり探したりすること。または、その結果。
조사하다=物事の内容を明確にするために、詳しく調べたり探したりする。／（警察や検察などが）犯罪の事実や経緯を明らかにするために、関係者や物を調べる。
조심=過ちや事故が起きないように、気を配り注意すること。／身なりや言葉遣いを慎み、警戒すること。
조카=兄弟や姉妹の息子、または娘のこと（甥・姪）。
존재=現実に実際に存在すること。または、その対象。／他と区별되는固有の実体や価値。／(哲学) 物事の本質に対し、その物事が実際に存在することを指す言葉。
졸다=しばらくの間、無意識のうちに軽く眠りに落ちる。しきりに目が閉じ、意識がぼんやりする状態をいう。／（チゲやスープなどの）液体が沸騰して量が減る。
졸업=学校で規定された教育課程をすべて終えること(卒業)。／ある事柄や分野で段階を終えて辞めたり、抜け出したりすることを比喩的にいう言葉。
종교=神や超自然的な絶対者を信じて崇め、それを通じて人間の生の究極的な意味を探求し、苦難を克服しようとする信念体系や活動。／上記のような信仰を共有する人々の集団や組織。
죄송하다=他人に対して犯した失礼や過ちについて、申し訳なく恐縮だ。
주무시다=「寝る」の尊敬語。目上の人や年配の人に対して使う。
주문=術法を使ったり、神秘的な力を借りるために唱える一定の文句（呪文）。／あることが叶うことを切に願う気持ちで、繰り返し言う言葉。／飲食店や商店などで、品物を買うために相手に品物の種類や数量などを求めること（注文）。／ある物事や条件が叶うように要求したり頼んだりすること（注文 / 要望）。／術を使ったり神霊に祈ったりする時に唱える文句（呪文）。
주민=特定の地域の中に住んでいる人（住民）。／国家や地方自治体の統治権、または行政権が及ぶ範囲内に居住する人。
주사=注射器を用いて液体の薬物を患者の体内に直接注入すること。
주소=人が住んでいたり、機関や団体などが位置している場所を行政区画や番号などで表した名称（住所）。／[コンピュータ] 情報が保存されている記憶装置の特定の部分を指す番号や名前（アドレス）。／[コンピュータ] インターネット上でウェブサイトや電子メールの場所を示す符号（アドレス）。
주스=果物や野菜から絞った汁。または、それを原料にして作った飲み物。
주요=中心となり、肝要であること。また、そのような状態。（主に「主要人物」、「主要事件」などのように名詞の前に使われ、その対象の重要性を示す。）
주일=(依存名詞) 日曜日から土曜日までの7日間を単位として数える言葉。主に「今週」「先週」「来週」などと共に使われ、特定の1週間の期間を表す。／今週。月曜日から日曜日までの7日間の期間を指す。／(キリスト教) 日曜日を指す言葉。
주장=自分の意見や見解を強く打ち出すこと。または、その意見や見解。／ある物事を重点的に打ち出すこと。
주장하다=自分の意見や見解を強く打ち出す（主張する）。／ある権利や資格などを自分のものだと主張する。／（主に法律的な文脈で）事実だと断定して言う。
주제=会話や文章、芸術作品などにおいて中心となる問題や核となる内容（主題 / テーマ）。／ある事柄や行動の対象となる中心的な素材。
주차=自動車などの車両を一定の場所に止めておくこと。
주차장=自動車を止めておくために設けられた場所（駐車場）。
주황색=赤と黄色の中間色。みかんやニンジンの表面のような色のこと。
죽음=生命の活動が完全に終わり、二度と生き返ることができない状態。死ぬこと。／(比喩的に) ある物事や現象がもはや存在しなくなったり、機能を喪失したりした状態。
줄다=物体の長さや広さ、体積などが本来より小さくなる。／数や分量、程度が以前より少なくなる。／力や気力、実力などが以前より劣るようになる。
줍다=床に落ちたり散らばったりしているものを拾い上げる。／他人が失くした物を拾って手に入れる。／道を歩いていて、捨てられた人や動物を連れて帰って世話をする。
중국=アジア東部にある国。世界で人口が最も多い国の一つであり、首都は北京（ベイジン）である。正式名称は中華人民共和国である。／東アジアに位置する国。世界で最も人口が多い国の一つであり、首都は北京である。正式名称は中華人民共和国。
중국어=中国人が使う言葉。または中国の標準語（中国語）。
중국집=中華料理を専門に作り、販売する飲食店（中華料理店）。
중요=貴重で大切であること。／ある事柄や物において、欠かせないほど重みがあり肝要であること。
중학생=中学校に通う生徒。小学校を卒業し、高校に入学する前の段階の教育課程を履修中の生徒を指す。
즉=前の言葉を別の言葉に換えて説明する時に使う言葉。「言い換えれば」、「すなわち」の意を表す。／前の内容が後ろの内容の理由や根拠になることを表す言葉。
즐거워하다=心や気分が非常に良く、満足している状態が表に現れる。（主に第三者の心理状態を表す時に使われる。）
지=(依存名詞) ある出来事が起きた時から今までの期間を表す言葉。主に「-ㄴ(은) 지」の形で使われる。
지각=定められた時刻より遅く出席したり到着したりすること（遅刻）。／物事の理や道理をわきまえる能力（知覚 / 分別）。／感覚器官を通じて対象を認識すること。またはその認識（知覚）。／地球の表面をなす固い層（地殻）。／物の道理をわきまえる能力や精神（分別）。／感覚器官を通じて外部の物事や現象を認識すること（知覚）。
지갑=お金、カード、身分証明書などを入れて持ち歩けるように、革や布などで作られた小さな小物。／（比喩的意味）個人が所有する経済的能力や資金の状態。
지구=一定の目的や特性に従って分けられた区域。行政的、経済的、軍事的な必要性によって区分された特定の範囲の土地。／人類が住んでいる太陽系の第三惑星。／世界や天下をひっくるめて言う言葉。
지나치다=一定の限度を超えて程度がはなはだしい（度を越している / 行き過ぎだ）。／ある場所を経て行ったり、通り過ぎたりする。／対象に対して細心の注意を払わずにそのままやり過ごす。／程度がひどすぎる。一定の限度を超える。／ある場所を経て行ったり、そのまま通り過ぎる。目的地に止まらずそのまま行く。／関心を払わずにそのまま見過ごす。注意深く見なかったり、無視したりする.
지난번=以前の時期や機会。すぐ前の回や時を指す言葉（前回 / 先日 / この間）。
지난주=今週のすぐ前の週（先週）。
지니다=物を身につけたり、体に持っていたりする。／ある形や状態、性質などを備えている。／考えや態度などを心の中に抱き続ける。
지루하다=状態や状況が同じように長く続き、退屈で嫌気がさす（退屈だ / つまらない）。
지식=ある対象について学んだり、実践を通して知ることになった明確な内容（知識）。／知っている内容や対象。またはその範囲。／[哲学] 主観が客観に対して持つ確実な認識。
지역=社会全体をある特徴で分けた一定の範囲の土地。一定の境界で区切られている地帯。または具体的な場所や範囲(地域 / エリア / 地方)。
지우개=文字や絵などを消すために使う道具。普通、ゴムやプラスチックなどで作られ、鉛筆で書いたものを消すものやボールペンやインクで書いたものを消すものなどがある(消しゴム)。／黒板に書いたチョークの文字を拭き取る道具(黒板消し)。
지우다=荷物などを人や動物の背中に負わせる（載せる）。／義務、責任、罪などを負わせる（課す）。／文字、絵、跡などを消す。／頭に残っている記憶や考えなどを消し去る。／付いたものや付着しているものを拭き取る。／名簿や名簿などから名前を消したり除外したりする。
지원=ある目標を達成できるように、金銭や物資、人力などを補って助けること。／(主に「生活費支援」のように使われ) 生計の維持に必要な費用を出すこと。／ある組織や事業、または困難な状況にある人を助けるために、物質的あるいは精神的な力を貸すこと。／ある組織に入ることを望んだり、ある事に志願して申し込むこと。
지하도=道路の下にトンネルを掘って作った道。主に歩行者が道路を横断したり、車両が通行できるように作られた通路を意味する(地下道)。
지하철역=地下鉄が停車し、乗客が乗り降りする場所（地下鉄駅）。
진하다=液体の濃度が高い。色合いや色が濃い。匂いや香りが強い。霧が立ち込めたり雲が立ち込めたりしている。感情や気運が強烈で深い。
질문하다=知らないことや疑わしい点について問い、答えを求めること（質問する）。
질서=混乱なく物事が正しい状態を維持するための順序、または前後関係。／社会共同体の中で円満な関係を維持するために守るべき道徳的・法的規則。／宇宙や自然の森羅万象が一定の法則に従って調和を保っている状態。
집단=複数が集まってできた一つの塊や群れ。／共通の目的や利益のために集まった人々の集まり。／[社会福祉] 社会事業の対象となる人々の集まり。
집들이=引越しをした後、家族や親戚、友人などを家に招いて料理をもてなす宴会（引っ越し祝い）。／新しい家へ引っ越すこと自体を指すこともある。
집안일=家の中で行われるあらゆる仕事。掃除、洗濯、料理、皿洗い、育児などをひっくるめていう言葉(家事)。
짜다=料理に塩気や醤油気が多く、味が濃い（しょっぱい / 塩辛い）。／（比喩的に）お金や物を使うのに物惜しみする（けちだ）。／点数や評価などを寛大に与えず、厳しくつける（辛口だ）。／押したりひねったりして、その中に入っている液体を外に出す(絞る)。／色々な材料を絡ませたり編んだりして物を作る(編む / 織る)。／計画や組織などを立てたり作ったりする(組む / 立てる)。／(料理の味が)塩分が多い(しょっぱい / 塩辛い)。／糸や紐などを縦横に編んで、布や網、籠などを作る。／機械、家具、建物などの構造物を作ったり備えたりする。／計画、組織、プログラムなどを立てたり構成したりする。／液体や汁を出すために、物体を強く押したりねじったりする。
짜증=気に入らなかったり面倒だったりして、むかむかとこみ上げてくる嫌気や怒り。
짬뽕=各種海産物や野菜を油で炒め、鶏や豚の骨で取っただし汁を加えて煮込んだ後、麺を入れて食べるピリ辛味の中華料理。／（比喩的に）異なるいくつかのものが入り混じっている状態を指す言葉。
찌개=土鍋や鍋に肉、野菜、魚介類などを入れ、調味料を加えて汁を少なめにして煮込んだ料理。スープ（クク）より汁が少なく具が多く、味が濃いのが特徴。
찌다=(肉が) 体に肉がついて体重が増える（太る）。／(天気が) 湿度と温度が高くて非常に蒸し暑い。／(食べ物を) 熱い湯気で蒸す。／熱い蒸気で食べ物を蒸したり、温めたりする。／天気が非常に暑く湿気が多くなり、まるで蒸し器の中にいるような状態になる。／肉がついて体が肥える。（主に「太る」の形で使われる）
차이=互いに食い違ったり同じでなかったりして異なること。または、その程度や状態。／二つ以上の対象や数値を比較した時に現れる間隔や開いた程度。
찬물=温度が低い冷たい水（対義語：お湯、熱い水）。／(比喩的) 盛り上がっている雰囲気や進行中の物事を急に台無しにする状況をいう言葉（主に「水を差す」の形で使われる）。
참외=ウリ科の一年草のつる植物。夏に黄色い花が咲き、茎には毛がある。／上の植物の果実。形は楕円形で、表面は黄色く白い縦縞がある。果肉は甘くシャキシャキしており、夏の代表的な果物の一つに数えられる。
채소=畑で栽培する農作物で、主にその葉や茎、実、根などを食用にする植物。「野菜」ともいう。
책임=引き受けて果たすべき任務や義務。／ある事の結果に対して、補償や制裁を受け入れなければならない状態。／法律的、あるいは道徳的に非難されるべき過ちや、それに対する処罰。
책장=本を載せたり入れたりするように作られた家具。普通、数段の棚で構成されている(本棚)。
천=(数量を表す冠形詞として)百の10倍になる数の。／(比喩的に) 非常に多い数の。／百の十倍にあたる数（千）。／聖数として、非常に多いことを比喩的に表す言葉。／糸で織ったもの。衣服や布団などの材料になるもの(布 / 生地)。
천만=(数量や程度が)非常に多いことを表す言葉。／(主に「-다행이다(幸いだ)」と共に使われ)思いがけない大きな幸運であることを表す言葉。／(否定語と共に使われ)到底そんなはずがないことを強調する言葉。／万の10倍になる数（一千万）。／非常に多い数。または、おびただしい程度。／万の10倍になる数の。／非常に多くの数の。／数の単位で、万の10倍になる数（一千万）。／「非常に多いこと」を比喩的に表す言葉。／（副詞的用法で「千万に（とんでもない）」の形で使われ）相手の褒め言葉や感謝、謝罪に対して謙虚に否定する意を表す言葉。
첫날=ある物事を始める一番最初の日。／新年の最初の日。（元日など）
청바지=丈夫な綿織物であるデニム(denim)で作られた青いズボン。もともとは作業着として考案されたが、現在は世界中で老若男女が好んで着る日常着となった(ジーンズ)。
청소하다=汚れたものや散らかったものを掃いたり拭いたりしてれいにすること。／社会の不正腐敗や悪の要素をきれいに取り除くこと。
체육관=運動競技や体力鍛錬ができるように施設を備えた屋内建物のこと(体育館)。
체크무늬=横線と縦線が一定の間隔で交差して作られた格子状の模様（チェック柄）。
초기=ある期間や事柄の始まりの時期や段階（初期）。／ある状態や現象が初めて現れ始める時（初期）。
초대=行事や集まりに人を招くこと（招待）。／食事や宴会などに客を丁寧に呼ぶこと（招待）。／ある職位や身分などに初めて任命されたり就任したりすること。またはその最初の代。／代々受け継がれてくる家系や団体などで、一番最初の代。
초대장=行事や集まりに人を招待するために送る文を書いた紙（招待状）。
초대하다=行事や集まりに来るよう請う（招待する / 招く）。／他人や外部の勢力を呼び入れる（招き入れる）。
초등학교=子供に基礎的な初等教育を施すための教育機関。大韓民国では満6歳から満12歳までの児童が通い、義務教育課程の第一段階である。（旧称：国民学校）
초등학생=小学校で勉強する学生。普通、満6歳から12歳までの子供を指す。
초록색=青色と黄色の間の中間色で、草の葉のような色（草緑色 / 緑色）。
초콜릿=カカオの実の種を炒って作った粉に、砂糖、牛乳、香料などを混ぜて固めた菓子。
추석=韓国固有の節句（名節）の一つ。旧暦8月15日で、新穀で料理を作り、先祖の墓参りをして茶礼（チャレ）を捧げる。「ハンガウィ」または「仲秋節」ともいう。
축구공=サッカーの試合をするときに使うボール。革や合成樹脂などで作られ、中に空気を入れて弾力を持たせる。
축하=他人の慶事に対し、喜びの気持ちを込めてお祝いの意を表すこと。または、そのような儀礼。
축하하다=他人のめでたい事に対して、喜びの気持ちを込めて挨拶する。または、その喜びを表す。
출구=中から外へ出るための通路(出口)。／危機や困難な状況から抜け出すための解決策や方策を比喩的に表す言葉(出口 / 活路)。
출근=一定の勤務地に仕事をしに行くこと（出勤）。
출발=ある場所に向かって出発すること。／ある物事を始めること。または、その始まり。／（運動競技などで）合図に従って走り出すこと。
출석=授業、集まり、行事などの場所に出向いて参加すること。／(主に学校や軍隊などで) 人数を確認するために名前を呼ぶこと。
출신=出生地や出身校、または以前就いていた職業や身分など、その人の経歴を表す背景。ある社会的地位や身分を持って世に出ること。
출입=ある場所に立ち入りすること（出入り）。／ある場所に通いながら交際すること。／金銭や品物が出たり入ったりすること（出納）。
출입국=国境を越えて他国へ出たり入ったりすること。／「出入国管理事務所」を略して言う言葉。
출장=職務を遂行するために、一時的に本来の勤務地を離れて他の場所へ行くこと(出張)。
출퇴근=職場へ行くことと、職場から家へ帰ることを合わせていう言葉（出退勤）。
춤추다=拍子やリズムに合わせて体をリズムに乗せて動かす(踊る / 舞う)。／(比喩的に) ある事物が風に揺れたり、激しく動いたりする。／(比喩的に) 他人のそそのかしや力によって、ある行動をする。
취미=専門的にすることではなく、楽しさを得るために継続する活動（趣味）。／美しい対象を鑑賞し理解する力。またはそのような鑑賞の境地。／物事や現象に対する個人的な好みや傾向。
취소=すでに決定した事項や約束、計画などをなくすこと。または、すでにした言葉や行動を取り消すこと。法律的に、いったん発生した法律行為の効力を遡及して消滅させること（取り消し / キャンセル）。
취직=一定の職に就き、職場に通うこと（就職）。
취하다=酒や薬物などの気運で意識が朦朧とし、体を支えられなくなる。／ある雰囲気や感情に深く入り込んだり、魂を奪われたりする。／乗り物酔いなどで頭がふらつき、胸が悪くなる。／自分のものにして持つ(取る / 得る)。／ある情報やニュース、態度などを選択して持つ(聞き入れる / 採る)。／体の姿勢を一定の形にする(とる)。／ある措置や行動を実行する(取る / 講じる)。／金や品物などを借りたり受け取ったりする(取る)。
치과=医学の一部門で、歯とその周囲組織および口腔内の疾患を治療する分野（歯科）。／歯の疾患を診療し、治療するための設備を備えた病院（歯科医院）。
치약=歯を磨く時に歯ブラシにつけて使うもの。通常、粘性のある半固体の形態であり、洗浄剤と研磨剤の成分が含まれていて、歯を清潔にし、口臭を除去して虫歯を予防する役割を果たす。
치킨=鶏肉に小麦粉などをまぶして油で揚げた料理。一般的に「フライドチキン」を略して呼ぶ言葉。／鶏肉を主材料として、味付けしたり焼いたりした料理を総称する言葉。
친절=人に対する態度が温かく、にこやかで優しいこと。または、そのような態度。
친절하다=接する態度が情深く、にこやかで優しい（親切だ）。
친하다=互いに付き合って情愛が深く、親しい。／ある物事や現象に頻繁に接しており、慣れている。
칠=七つの数量を表す言葉。後に続く名詞や単位名詞を修飾する。／(数詞) 六に一を足した数。性質や状態を表す冠形詞としても使われる(七 / なな)。／(名詞) アラビア数字の「7」のこと。
칠십=10の7倍になる数（七十）。／（数量を表す言葉の後に使われ）その数量が7倍であることを表す言葉（七十）。／10의 7배가 되는 수의. 後に続く名詞（主に数量を表す単位名詞）を修飾する(七十 / 七十の)。
칠판=教室や講堂などの前の壁に掛け、チョークやマーカーなどを使って文字を書いたり絵を描いたりして、学生に内容を伝える板（黒板）。
침실=家の中で眠るために用意された部屋（寝室）。
칫솔=歯を磨くのに使う道具。長い柄の先に硬い毛が植えられている。
칭찬=良い点や善くて立派な行いを高く評価して言うこと。またはその言葉（賞賛 / ほめ言葉）。
카레=インド由来の食べ物で、ウコンをはじめとする様々な香辛料を混ぜて作った黄色の粉や、それを入れて作った料理。肉や野菜などを一緒に炒めて水を注ぎ、煮込んだ後、ご飯やパンに添えて食べる。
카페=コーヒーや茶、飲料などを販売し、人々が座って休めるように整えられた西洋風の喫茶店。／インターネットポータルサイト内で、共通の関心事を持つ人々が集まって情報をやり取りしたり、会話を交わしたりするオンラインコミュニティ空間。
칼국수=小麦粉を練って薄く伸ばした後、包丁で細く切って作った麺。または、それをだし汁に入れて煮込んだ料理。
캐나다=北アメリカ大陸北部に位置する連邦国家。ロシアに次いで世界で2番目に面積が広く、首都はオタワである。英語を公用語とし、ケベック州など一部の地域ではフランス語も使用されている。／北アメリカ大陸北部に位置する連邦国家。ロシアに次いで世界で2番目に広い領土を持ち、首都はオタワである。豊富な天然資源と美しい自然景観で知られている。
커다랗다=大きさが非常に大きい。／規模や範囲、程度が非常に大きい。
커피숍=コーヒーや茶、飲料などを販売し、人々が座って会話を交わしたり休んだりできるように整えられた店（喫茶店 / カフェ）。
케이크=小麦粉、卵、砂糖、バターなどを混ぜて型に入れオーブンで焼いた後、生クリームや果物などで飾った西洋菓子。主に誕生日や記念日などのお祝いの席で好んで食べられる。
켤레=靴、靴下、足袋、手袋などのように、二つで一組になる物を数える単位。
코끼리=哺乳類ゾウ科に属する動物の総称。体が非常に大きく灰色で、長い鼻を自由に動かして手の役割を果たす。上顎の前歯2本が長く伸びて牙（象牙）になるのが特徴である。
콘서트=音楽を演奏したり歌を歌ったりするために開かれる公開的な集まりや公演（コンサート）。
콜라=コカの葉やコーラの実から抽出した原料に、カラメル色素と糖分を加えて作った炭酸飲料。黒い色をしており、シュワッとする清涼感が特徴である。
콧물=鼻の粘膜から分泌される、透明または粘り気のある液体（鼻水）。
크리스마스=イエス・キリストの降誕を記念するキリスト教の祝日。12月25日で、「聖誕節（ソンタンジョル）」とも呼ばれる。／宗教的な意味を超え、全世界で家族、恋人、友人たちとプレゼントを交換しながら楽しむ冬の祭りの日。
큰소리=声の大きさが大きいこと(大声)。／人の前や日常会話で堂々と話したり、偉そうに自慢したりする言葉(大きな口 / 豪語)。／怒って他人を叱ったり、強く抗議したりしてあげる声(怒鳴り声)。
킬로그램=質量(しつりょう)の単位。1キログラムは1グラムの1,000倍で、国際度量衡総会で定められた国際キログラム原器の質量に等しい。記号はkg。
탁구=長方形の木製のテーブルの中央にネットを張り、両側からラケットで軽くて丸いボールを打ち合い、勝敗を競う球技。「ピンポン」とも呼ばれる。
탕수육=牛肉や豚肉の切れ端に片栗粉をまぶして油で揚げた後、砂糖や酢などを入れて甘酸っぱく煮たあんかけソースを添えて食べる中華料理。
태국=東南アジアのインドシナ半島中央部に位置する国。首都はバンコクで、仏教国としてよく知られている。正式名称はタイ王国（Kingdom of Thailand）。
태권도=韓国固有の伝統武芸を基にしたスポーツ。主に手足を使って攻防を行い、身体の鍛錬と精神修養を目的とする。今日では世界的なスポーツへと発展し、オリンピックの正式種目に採用されている。
태극기=大韓民国の国旗。白地の中央に太極模様を描き、四隅に乾・坤・坎・離の四卦を描いたもの。
태풍=北太平洋西部で発生する熱帯低気圧のうち、中心付近の最大風速が毎秒17m以上の強い嵐を伴う気象現象。
택배=郵便物や荷物、商品などを要求された場所まで直接配送すること。／上記のような方式で配送された品物自体のこと。
터=家を建てた、または建てる予定の場所（敷地 / 跡）。／物事が行われる基礎や土台（基盤 / 土台）。／（主に「-은/는/을 터이다」の形で使われ）前の内容に対する予定、意志、推測を表す言葉。／ある場所が置かれている地形や状況。／(語尾「-ㄴ/은/는/던」の後に使われ) 置かれた立場や状況を表す言葉。／(語尾「-ㄹ/을」の後に使われ) 予定や推測、意志を表す言葉。主に「-ㄹ 터이다（〜するつもりだ／はずだ）」や「-ㄹ 터라」の形で使われる。／(語尾「-ㄴ/은/는」の後に使われ) 前の事実が後ろに来る事実の条件や理由になることを表す言葉。
터미널=バスや列車、船、飛行機などが路線の終点で乗客を乗せ降ろしし、車両を整備したり保管したりするために設けられた施設（ターミナル）。／コンピュータシステムで利用者がデータを入力したり、出力結果を確認したりできる端末機（ターミナル）。
터지다=中に入っているものが外に出たり、皮や包みが破れたりする。／穴が開いたり、裂けたりして破れる。／堪えていた感情や気運、声などが一気に強く出る。／戦争、事件、事故などが突然起きる。／皮膚や肉が割れる。
테니스=中央にネットを張り、ラケットを使ってボールを打ち合い勝敗を競う球技の一つ。軟式テニスに似ているが、より硬いボールを使用する。
테니스장=テニスができるように設備を整えてある場所（テニスコート）。
테이블=食事をしたり本を読んだりするなど、様々な用途に使うために作られた家具。主に板と脚でできている。「卓子（タクチャ）」や「床（サン）」と言い換えることもある。／[コンピュータ] データを一定の形式に従って、行と列の表の形式で並べたもの。
토끼=ウサギ科に属する哺乳動物の総称。耳が長く、後肢が前肢より長いため走るのが得意で、尻尾は短い。一般的に、温厚で賢い動物の象徴とされる。
토마토=ナス科の一年草、またはその果実。形は丸く、赤や黄色に熟して食用にする。ビタミンと無機質（ミネラル）が豊富な野菜である。
통신=郵便、電信、電話などの媒体を通じて消息や情報をやり取りすること(通信)。／コンピュータネットワークを通じてデータをやり取りすること。／新聞社や放送局にニュースや情報を送ること。
통일=分割されたものを合わせて一つにすること（統一）。／複数の要素が調和を成して、一つの体系を作ること（統一）。／支配的な一つの原則や秩序の下に集まること。
통장=金融機関で預金や積立の取引明細、残高などを記録して預金者に渡す帳簿（通帳）。／ある事実を記録したり証明したりするために作る手帳や帳簿。
통하다=(風や空気などが) 滞りなく流れたり出入りしたりする。／(電話・電気・水などが) つながって流れたり伝わったりする。／(言葉や意図、心などが) 相手に伝わって理解される。／(道や門が) どこかへつながる。／(ある名前や資格で) 世間に知られたり認められたりする.
통화=流通手段や支払い手段として機能する金銭や貨幣（例：ウォン、ドル、円など）。／電話で話をやり取りすること。／電話で言葉をやり取りすること。またはその話。
퇴근=一日の業務を終えて職場から退出したり、家に帰ること（退勤 / 仕事が終わること）。
퇴원=病院に入院して治療を受けていた患者が、病状が良くなったり治療が終わったりして病院を出ること。
투자=利益を得るために、ある事柄や事業に資本、時間、真心などを注ぎ込むこと（投資）。／国や企業などが生産能力を高めるために、工場、機械、設備などの実物資産を購入すること（投資）。
튀기다=熱い油の中に食べ物を入れて火を通す（揚げる）。／力を加えて急に弾いたり、跳ね上がらせたりする（弾く）。／水や粉などを四方に散らす（跳ね飛ばす）。／（主に「そろばん」や「計算機」と共に使われ）勘定をする。／力を加えて物体や液体のしずくなどを急に飛び散らせる。／油が沸いている鍋に食材を入れて火を通す（揚げる）。／指先で物体を力強くはじく。／（比喩的に）ある事柄や言葉によって周囲に被害や影響を与える。
튀김=魚、肉、野菜などの食材に小麦粉や片栗粉をまぶし、油に入れて揚げた料理。／油で揚げること。
트럭=主に荷物を運ぶのに使われる自動車。貨物自動車。
특별=普通とは異なり、差があること。または状態や性質が非常に際立っていること。／範囲や対象が狭く、限定されていること。
특별히=普通とは違って、非常に優れているさま。／他とはっきり区별されるように。／（否定語と共に使われ）平凡であること、普通であること。
특성=一定の物事や人のみが持っている特殊な性質や成分。他と区別される固有の特徴を指す。
특징=他のものと比較して、特に目立つ点(特徴)。／対象が本来持っている固有の姿や性質。
튼튼하다=人の体や動物の身体部位が強く、健康だ。／品物や構造物が壊れたり傷んだりしないほど固くて堅固だ。／考えや意志、組織の基礎などが揺らぐことなく確固としている。
티셔츠=襟（カラー）がなく、袖が短いか長い「T」の字の形のシャツ。主に綿生地で作られ、軽くて楽に着る上着。
파란색=1. 澄んだ空や深い海のような青い色。2. 光のスペクトルで、藍色と緑色の間に位置する色(青色 / ブルー)。
파랗다=澄んだ空や深い海のように、明るく鮮やかな青色を帯びている。／(顔色などが)恐怖や寒さなどのために、青白くなったり青みがかったりする。／芽や草の葉などが、瑞々しく青々とした色を帯びている。
파티=親睦を図ったり、祝ったりするために多くの人が集まる楽しい集まりや宴会（パーティー）。
판단=物事や状況に対して、論理や基準に従って何らかの決定を下すこと。また、善悪、是非、真偽などを区별して断定を下すこと。哲学では、対象に対してある断定を下す思考作用。
팔리다=品物が代金を受け取って他人に渡される。（「売る」の被動詞：売れる）。／（比喩的に）関心や心、注意などが他の場所に引きつけられる。／（比喩的に）名前や顔などが広く知れ渡る。
팔십=10의 8배가 되는 수의. 後の名詞を修飾して、その数量が80であることを表す。／10の8倍になる数。 (数詞)「80」を表す数量の名称。
편=(依存名詞) 汽車、飛行機、船などの交通手段が定期的に行き来する回数を表す単位。／詩、小説、論文などの文学作品や文章を数える単位。／映画、ドラマ、広告などの映像著作物を数える単位。／(空間や位置を表す言葉の後ろに使われ) 方向や側面を表す言葉。／(人を表す言葉の後ろに使われ) 味方や同じ類であることを表す言葉。／(ある傾向や性質を表す言葉の後ろに使われ) ある一方に偏っていることを表す言葉。
편리=利用するのに都合がよく、役に立つこと。また、その状態。／顧客やユーザーがサービスや物を使用する際、手間がかからず簡単で快適だと感じる状態。
편안=体や心が楽で穏やかなこと。心配事や障りがなく安らかなこと（平安 / 気楽）。
편의점=主に24時間営業し、客の便宜のために食料品、日用品、雑貨などを備えて販売する小規模な商店（コンビニエンスストア）。
편찮다=「痛む・具合が悪い」の尊敬語。主に目上の人や敬うべき対象の具合が悪かったり、病気になったりした時に使う。／（まれに）心や気分が良くなく、すっきりしない。
평가=物の価値や水準を評して決めること。または、その決定。／人の能力や業績などに対して価値や水準を付けること。／[経済] 品物の価値を推し量ること。
평일=一週間の中で土曜日と日曜日（週末）を除いた残りの日。通常、月曜日から金曜日までを指す。／特別な出来事や行事がない普通の日。
포도=ブドウ科の落葉広葉つる性植物に結ぶ実。形は円形や楕円形で、通常、紫がかった黒や緑色に熟す。甘みと酸味があり、主に生で食べたり、酒、ジュース、ジャムなどを作るのに使われる。
포장=品物を包んだりまとめたりすること。または、その品物を包むのに使う紙、布、箱などの材料（包装 / パッキング）。／外見をよく整えること。または、事実とは異なりよく見えるように飾ること（飾り立てる / 美化）。
포함하다=ある物事や現象の中に一緒に入っているようにすること。／ある範囲や構成要素の一部にすること。
표정=心の中の感情や状態が、顔の筋肉や目つきなどを通して表に現れた様子（表情）。／ある物事や現象が示す雰囲気や状態を比喩的にいう言葉。
표현=考えや感じなどを、言葉や身振り、形象などで表すこと。／ある物事や現象を一定の方法で表して見せること。／言葉や文章で自分の意思を伝える方式。
표현하다=考えや感じなどを言葉や身振り、形状などで表に出して表す。／ある事物を記号や数値などで表す。／芸術作品を通じて、作家の主観的な思想や感情を具現化する。
푹=ぐっすりと、または十分に休む様子。／液体や粉の中に深くはまったり、浸かったりする様子。／頭や腰などを深く下げる様子。／食べ物がとても柔らかく、またはどろどろになるまで煮えた様子。／穴が深く掘られたり、刺されたりした様子。
프라이팬=油を引いて食べ物を炒めたり、焼いたりするのに使う、浅くて平たい形の西洋式の調理器具。通常、長い取っ手がついている。
프랑스=西ヨーロッパにある共和国。ヨーロッパ大陸で領土が最も広く、首都はパリである。芸術、ファッション、美食文化が発達した国としてよく知られている。／欧州西部に位置する国。首都はパリで、芸術、美食、ファッションの中心地としてよく知られている。公式名称はフランス共和国である。
피곤=体や心が疲れ果てて、だるく辛い状態。／ある事に悩まされて嫌気がさしたり、苦しかったりする状態。
피곤하다=体や心が疲れて元気がなく、しんどい。／ある事柄や状況が難しくて煩わしく、対処するのが辛い。
피아노=鍵盤楽器の一つ。鍵盤を叩くと機械装置につながったハンマーが弦を打ち、音を出す楽器で、音域が非常に広く表現力が豊かなため、独奏や合奏、伴奏など多方面で広く使われる。
피자=イタリア由来の料理で、小麦粉の生地を薄く丸く伸ばし、その上にトマトソース、チーズ、肉、野菜などをのせてオーブンで焼いた食べ物。
피하다=引き受けなければならない仕事や、責任を負うべき状況から逃れようとしたり、免れようとしたりする(避ける / 回避する)。／出くわしたりぶつかったりしないように、体を動かしたり道を譲ったりする(よける / かわす)。／良くない状況や災難、寒さ、暑さなどを経験しないように、一時的に他の場所へ移動する(避ける / 避難する)。
피해=生命、身体、財産、名誉などに損害を受けること。またはその損害。
필통=鉛筆、ボールペン、消しゴムなどの筆記用具を入れて持ち歩いたり、机の上に置いて使う入れ物（筆箱）。
하늘색=晴れた昼の空のような淡い青色（水色 / 空色）。
하숙비=他人の家に泊まり、食事の提供を受ける対価として支払う金。
하숙집=一定の部屋代と食事代を払って滞在できるように設備を整えた家（下宿屋）。
하얀색=雪や牛乳の色のように明るくきれいな色。「白色(フェンセク)」と同じ意味で使われる。
학생증=学校で学生の身分を公式に証明するために発行するカード型の証明書（学生証）。
학원=知識、技術、芸能などを教える私設教育機関。学校教育の不足を補ったり、特定の分野の専門知識を習得するために利用される(学院 / 塾)。／(歴史的意味) 書院や書堂など、教育を目的に建てられた施設を総称する言葉。
한가하다=忙しくなくて、暇がある。／心にゆとりがあって、安らかだ。／物事が起きず、静かでひっそりとしている。
한강=大韓民国の京畿道とソウル特別市を経て西海（ソヘ）へと流れる川。朝鮮半島の中部地域を貫通し、韓国の歴史と経済成長の象徴とされている。／京畿道、江原道、忠清北道、ソウル特別市を経て黄海へと流れ込む韓国の代表的な川。／（比喩的に）非常に広くて深い流れ、または韓国の経済成長を象徴する言葉。
한계=物事や能力、責任などがこれ以上及ぶことのできない範囲や地点（限界）。／ある対象が実際に存在しうる最後の枠組みや境界。
한국=アジアの東側にある韓半島とその付属島嶼からなる国家。今日では通常「大韓民国」を略した言葉として使われる。／アジアの東側にある韓半島とその付属島嶼からなる国。「大韓民国」を略していう言葉。
한국말=韓国人が使う言葉。韓国語と同じ意味で使われるが、主に日常的な会話や口語体で多く使われる。
한국어=韓民族が主に使っている固有の言語。系統上はアルタイ語族に属するという説が有力であり、文字は世宗大王が創製した訓民正音（ハングル）を使用する。
한마디=短い言葉の一句。／短い言葉で簡単にする話。
한식=韓国固有の料理。または韓国式に作られた料理(韓国料理)。
한식집=韓国固有の料理や、韓国風に作られた料理を専門に販売する飲食店。
한옥=韓国固有の様式で建てられた家。西洋式の建物である洋屋（ヤンオク）と対比される概念で、主に木や石、瓦や藁などを使って建てられる。
한자=中国で作られ、今日まで使われている文字。一つ一つの文字が一定の意味と音を持っている表意文字である。／韓国語の語彙の相当部分を構成している基礎となる文字。
한잔=軽くお酒を一杯飲むこと。／お茶や飲み物などを一杯飲むこと。／(慣習的に) 親睦を深めたり話をしたりするために、お酒の席を設けること。
한턱=人に食事をご馳走すること。主に良いことがあった時にお祝いしたり、感謝を表したりするために食事代を支払う行為を指す。
한편=ある事柄に対して、別の側面を表す時に使う言葉（一方 / 片方）。／同じ仲間、または同じ味方（同等 / 味方）。／前の状況とは別の状況が同時に起きていることを表す時に使う言葉（一方で / その一方で）。／ある事柄の一側面、または一つの方向。／同じ味方、または同じ仲間。／(副詞的用法) ある事柄が進行すると同時に、別の側で起きる状況を表す時に使う言葉。
할인=決められた価格からいくらかを引くこと。または、その価格。一定の値から一定の比率を差し引くこと(割引)。
항공=空中を飛行すること。またはそれに関連する技術や産業。／飛行機を利用して人や貨物を輸送する交通手段。
항공권=飛行機に乗るために発行された乗車券や証書（航空券）。
해결하다=事件や問題、事柄などをうまく処理して終わらせる（解決する）。／もつれた感情や葛藤などを解いてなくす。／疑問や疑念などを解明して明らかにする。
해외여행=自分の国の境界の外に出る旅行。外国へ行く旅行を意味する。
핸드폰=手に持って持ち歩き、場所にこだわらずに使用できる無線移動電話機（英語の「handphone」に由来する外来語であり、標準語である「携帯電話」とともに日常で広く使われる）。
햄버거=丸いパンの間に、ひき肉のパティや野菜、ソースなどを挟んで作った西洋料理。
햇빛=日の光。太陽から発せられる光線。
행위=人が意志を持って行う行いや態度。／[法律] 法律的効果を発生させる原因となる人間の意識的な活動。
향하다=ある方向や場所に体や顔、視線などを向ける。／ある目的や目標に向かって進む。／ある対象に向かって心や視線が注がれる。
헬스클럽=健康増進や体力鍛錬を目的として、様々な運動器具を備え付けた施設。一般的に「ヘルス場（ジム）」とも呼ばれる。
현대=今の時代。通常、第二次世界大戦が終わった後から今までの時期を指す。／歴史的な区分において、近代の次の時代。／（一般的に）現在の時間の流れや、今日の文明の状態。
현상=人間が知覚できる物事の形や状態。／自然界や社会で起こるあらゆる状態や変化。／[哲学] 本質や実在の客観的な姿が感覚を通じて現れること。
현실=現在、実際に目の前に現れている事実や状態。／想像や空想、理想ではなく、実際に存在する客観的な状態や状況。
현장=物事が実際に起きたり進行したりしている場所。／建設、製造、サービスなどが実際に行われる作業現場。／犯罪や事故が発生したまさにその場。
형식=物事が表面に現れて見える形や構造。／ある物事を行う際に備えるべき一定の手続きや様式。／実利よりも見栄えに重点を置く態度や方式。
형태=物の外形や格好（形態 / 形）。／現象や事象が現れている一定の形や状態（形態 / 様相）。／[言語] 語節や単語の構成要素としての形（形態）。
호수=陸地に囲まれ、海とは離れている大きく深い水たまり。通常、川の水や雨水などが溜まって形成される(湖)。
호주=オセアニア大陸の大部分を占める国。正式名称はオーストラリア連邦(Commonwealth of Australia)で、首都はキャンベラである。
혹은=さもなければ。二つ以上の対象のうち、一つを選択する時に使う言葉(あるいは / または)。／時には。ある状況が交互に起きたり、複数の可能性があることを表す時に使う言葉(あるいは / 時には)。
홍차=茶の木の若葉を発酵させて緑色を抜き、乾燥させた茶葉。またはそれを淹れた水。淹れた色は赤く、香りが強い。
화가=絵を描くことを職業とする人。専門的に絵を描く芸術家（画家）。
화나다=嫌な目に遭ったり不当な扱いを受けたりした時、心の中で憤る感情が湧き上がること。
화내다=悪い感情や激しい気配を表に出して怒る。相手の過ちや気に入らない状況に対して不快な感情を表出する（怒る / 腹を立てる）。
화요일=一週間の七日のうち、月曜日の後、水曜日の前の日。五行の一つである火から名付けられた。 (火曜日)
확인하다=間違いなくそうであるか事実を確かめたり、調べたりすること。／態度や意思などを確実に認めたり、固く誓ったりすること。
환경=生物を取り巻いており、生物に直接的または間接的に影響を与える自然的な条件や現象（自然環境）。／人間が生活する上で影響を与える周囲の状況や都合（社会的・教育的環境）。／生物を取り巻いており、生物に直接、間接的に影響を与える自然的条件や状態。／人が生活する周囲の状態や条件。／社会的、心理的に人間の行動に影響を及ぼす周囲の事情や状況。
환영=来る人を喜びの気持ちで楽しく迎えること（歓迎）。
환전=種類の異なる貨幣を互いに交換したり、ある国の貨幣を他国の貨幣と交換すること（両替）。
활동=体を動かして行動すること。または、ある仕事の目的を果たすために元気に動くこと。／[生物] 生物が生命を維持するためにエネルギーを使って動くこと。
활발히=生き生きと力強く動き、活動する状態で。／勢いが強かったり元気が溢れたりして、動きが止まらない様子で。
회사원=一定の会社に所属し、報酬を得て働く人（会社員）。
회색=白と黒が混ざった色。灰の色と同じで、無彩色のひとつ。／どちらにも属さない中間的な性格や態度を比喩的に言う言葉。
회장=会や団体を代表し、その事務を総括する人（会長）。／一定の集まりの場所（会場）。
횡단보도=歩行者が道路を安全に横断できるように、路面に白い線で示された道（横断歩道）。
효과=ある目的のために取られた手段や行為によって現れる、やりがいのある結果（効果）。／[法律] ある行為や事実によって生じる法律上の結果。／[芸術] 演劇、映画、放送などで臨場感を高めるために演出される音や照明などの装置。
휴게실=職場、学校、病院などの公共施設で、しばらく滞在して休息が取れるように用意された部屋（休憩室）。
휴대폰=ユーザーが持ち歩き、場所にこだわらず電話をかけたり受けたりできるように作られた無線電話機。「ハンドフォン（携帯電話）」、「携帯電話」ともいう。
휴일=職場や学校などに行かずに休む日（休日 / 休みの日）。
휴지=使い終わって捨てる紙。または、不用になった紙(反故紙)。／トイレや日常生活で体を拭いたり、汚れを拭き取ったりするのに使う薄い紙(ティッシュ / トイレットペーパー)。
휴지통=古紙や使えなくなった物などのゴミを捨てる箱（ゴミ箱）。／(コンピュータ) 削除したファイルやフォルダが完全に削除される前に、一時的に保管される仮想の場所（ごみ箱）。
흐리다=液体の中に異物が混じって、澄んでいない状態になる(濁る)。／記憶や判断、精神状態などがはっきりせず、ぼんやりする(かすむ)。／言葉の語尾や態度をはっきりさせず、もごもごする(言葉を濁す)。／雰囲気や秩序を乱し、悪くする。／空に雲が多く、日光が遮られて明るくない（曇っている）。／液体などが澄んでおらず、濁っている。／記憶や精神、視力などがはっきりせず、ぼんやりしている。／言葉や態度、結びなどがはっきりしない。／色が濃くなく、淡い。
흔히=普通よりたびたび。または、日常茶飯事に。／状態や現象が珍しくなく、どこにでもあるように。
