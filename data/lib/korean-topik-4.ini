가까워지다=距離的に間隔が短くなる。／時間的にある時が近づいてくる。／関係が親密になる。／状態や特性がある基準にほぼ等しくなる。
가난=暮らし向きが豊かではなく、経済的に苦しい状態（貧乏 / 貧困）。／（比喩的に）ある物事や能力が十分でなかったり、足りなかったりする状態（乏しさ）。
가능=できること。または可能であること。／（主に「-이 가능하다」の形で使われ）ある事を成し遂げたり、状況を現実にできる状態。
가득하다=ある空間に物、人、光、音、においなどが充満している。／ある場所や雰囲気に、特定の気運や感情が強く満ちている。／決められた分量や範囲がいっぱいになったり、あふれそうだったりする。
가득히=量や数が決められた範囲や空間にいっぱい詰まっている状態で。／心や雰囲気などがある感情や状態で濃く漂っている状態で。
가로등=暗闇を照らし、安全な通行を助けるために道路に沿って設置された灯火（街灯）。
가로막다=前を横切ってふさぎ立ち、通過できないようにする。／物事や流れなどが円滑に進まないように妨害したり遮断したりする。／視界や展望が遮られて見えないようにする。
가르다=(鋭利な道具などを使って) 物体を二つ以上の断片や部分に分ける。／(勝敗や是非などを) 判断して決める。／(空気や波を) 突き抜けて進む。／(大勢の人が混じっている中から) 分かれさせたり、別に引き離したりする。
가만있다=何も言わずに黙っている。／動かなかったり、何の行動もせずにそのままにしている。／ある状態をそのまま維持したり、他人の事に干渉せずにいる。
가뭄=長い間雨が降らず、気象学的に水が不足している状態。／(比喩的に) ある事柄や現象が長い間起こらなかったり、必要な物や人が非常に少なくなったりした状態。
가사=歌の曲調に合わせて歌う言葉（歌詞）。
가슴속=胸の内側 (胸の中)。／心の奥底。表に出さない考えや感情を比喩的にいう言葉 (胸中 / 心中)。
가이드=旅行客や観光客に道を案内したり、遺跡や名所などについて説明したりする人(ガイド / 案内人)。／ある事柄を案内したり、指針となる冊子やマニュアル(ガイド / 手引書)。／ある目標や方向に導いてくれる役割や物。
가입=団体や組織に入るために構成員になること（加入）。／サービスや商品を利用するために契約を結び、名簿に名前を載せること（加入 / 申し込み）。
가입자=団体や組織に入ったり、サービスや施設などを利用するために契約を結んで登録した人（加入者）。
가져다주다=ある物を持って行って相手に渡す。／ある結果や現象を生じさせたり、至らせたりする。
가죽=動物の体を包んでいる皮。／動物の皮を剥いで加工した物。靴、服、鞄などの材料として使われる。／（比喩的に）人の体面や外見。
가짜=本物ではなく、本物のように見せかけたもの。模造品や偽造品のこと。／うわべだけそのように見せかけたり、事実でないことを事実であるかのように飾ること。
가톨릭=ローマ教皇を最高首長とし、キリストを救世主として信じるキリスト教の一教派。天主教（チョンジュギョ）とも呼ばれる。
각오=これから経験する困難なことに対して、心構えをしっかりすること。または、その心。
각자=それぞれの人がおのおの。／それぞれの個人。／各々の人。または、めいめい。（ある事や責任などを何人かで分担したり、一人ひとりが別々に行動したりすることを表す。）
간격=物体と物体の間の離れた距離（間隔）。／時間と時間の間の離れた時間（合間 / 間隔）。／人々の間の関係が疎遠になった程度や、水準の差（隔たり）。
간섭=直接的な関係のない人が他人の事に口出ししたり、権利を侵害すること（干渉）。／一国が他国の内政や外交に強制的に介入し、自国の意思を貫こうとする措置（干渉）。／二つ以上の波が重なり合う際、波の位相によって振幅が大きくなったり小さくなったりする現象（干渉）。
간신히=辛うじて、やっとのことで。（困難でつらい過程を経て、目的や結果に到達したことを表すときに使う。）
간접적=間に他の人や物、あるいは手段を介すること。／ある事に直接関与せず、影響を与えたり関係を持ったりすること。／間に他の人や物、または手段を介すること。また、そのような性質を帯びること（間接的）。
간판=機関、商店、営業所などで、名前や販売する商品、業種などを書いて人目に付くように掛けたり貼ったりする標識（看板）。／表向きに掲げる名目や肩書き。／（比喩的に）ある集団や分野を代表するにふさわしい優れた人や物（看板役 / 看板スター）。
간편하다=構成や手続きが複雑ではなく、簡単で便利だ。／体積や重さが小さく、扱ったり利用したりするのに楽だ。
간호=病気の人や怪我をした人のそばで、その人の世話をしたり介抱したりすること。
간혹=たまに、時たま。たまに一度ずつ。(空間的、または時間的な間隔がまばらな様子。)／いくらかの時間の合間をおいて、たまに。または、たまたま一度ずつ。
갇히다=人や動物がある空間に入れられ、外に出られなくなる。／ある境遇や状況、枠に縛られて制限を受ける。／雨、雪、霧などの気象現象によって、場所から離れられなくなる。
갈수록=時間が経つにつれて、状態や程度がよりひどくなったり増したりする様子。
갈증=喉が渇いて水を飲みたがる感じ（喉の渇き）。／何かを強く求めたり望んだりする状態を比喩的にいう言葉（渇望）。
감동적=心に深い感銘を与え、心を動かすこと。主に後ろに来る名詞を修飾し、ある対象や状況が大きな響きや感動を与える状態であることを表す。／心に深く感動を与えるようなもの。／(冠形詞的にも使われ) 心に深く感動を与える。
감상=主に芸術作品を理解し、楽しみ、評価すること。／物事や景色の美しさを吟味し、楽しむこと。
감상하다=芸術作品や景色などを心で感じ、楽しみながら理解する（鑑賞する）。／物事の価値や状態を調べて評価したり、味わったりする。
감소=量や数値が減ること。または、量や数値を減らすこと。
감히=恐れや困難を顧みず、大胆に。／（主に否定語や疑問文と共に使われ）身の程知らずに、生意気な振る舞いや言葉遣いをすることをいう言葉。
갑작스럽다=ある事が予想外に、思いがけず起こった状態にある。考える余裕もなく、急に起こった様子を表す（急だ / 突然だ）。
값싸다=物の価格が普通より低い（安い）。／（比喩的に）ある態度や物が品がなく、卑しい。
강당=学校や公共機関などで、大勢の人が集まって講義、記念式、公演などができるように広く作られた建物や部屋(講堂)。
강도=他人の物を奪うために暴行や脅迫をする泥棒。またはそのような行為。他人の財物を強取する犯罪を犯した人（強盗）。／力や作用の強さ。／物体の強度の程度。材料に荷重がかかった際、その材料が破壊されるまでの変形抵抗。
강사=学校、塾などで知識や技術を教える人。／大学で正教授や副教授などの正規教員ではなく、契約によって一定時間の講義を担当する人。（類義語：時間講師）／講演会や研修会などで講義を受け持つ人。
강수량=一定期間中、特定の場所に降った雨、雪、雹、霧などの量をすべて合わせたもの。通常、液体の水に換算して深さ(mm)で表す。
강조=ある部分を特に目立たせたり、強く主張すること。／言葉や文章で、特定の内容を読者の注意を引くために強調して表すこと。
갖가지=いろいろな形や種類（色とりどり / 様々）。
개구리=アカガエル科に属する両生類の総称。後ろ足が長くジャンプが得意で、「ケロケロ」と鳴く。卵から孵化し、オタマジャクシの時期を経て成体になる。／（比喩的意味）視野が狭く、世の中の情勢に疎い人を指す言葉。
개나리=オトギリソウ科の落葉広葉灌木。春に葉より先に黄色い花が枝ごとにびっしりと咲き、韓国のどこでもよく見られる代表的な春の花。／「レンギョウの花」の略語。
개다=衣類や布団などを重ねたり折りたたんだりして、きれいに整える（畳む）。／（天気が）曇ったり雨が降ったりしていた状態から晴れ上がる。／粉や塊に水や油などを加えて、つぶしながら混ぜ合わせる（練る）。／曇ったり雨が降ったりしていた天気が晴れる。／（比喩的に）憂鬱だったり息苦しかったりした心の状態が晴れやかで軽くなる。
개미=アリ科に属する昆虫を総称する言葉。主に地中や木の中に巣を作って住み、社会性が強く階級に分かれて集団生活をする。／(比喩的) 勤勉に働き、貯蓄する人を指す言葉。／(経済) 株式市場で、機関や外国人投資家に対して個人投資家を指す言葉。
개별=一つずつ離れている状態。全体や集団を構成する個々の物や人（個別）。
거들다=他人がすることを手伝って助ける。／他人が話している時にそばで言葉を添える。／ある状況や雰囲気をさらにひどくさせたり、あおったりする。
거짓=事実ではないことを事実であるかのように作り上げたこと（嘘 / 虚偽）。／表面上だけ体裁を整えた態度や心（偽り）。
거품=液体の中に空気や他の気体が入ってできた、白くて小さな粒（泡）。／表面だけが華やかで豊かに見えるが、中身や実際の価値がない状態の比喩（バブル）。／ひどく興奮したり緊張したりした時に口元にできる唾の泡。
걱정스럽다=見た目に心配なところがある。／心の一角に懸念や不安な感じがある。
건너=一定の間隔や距離を置いて向かい合っている向こう側。（例：道の向かい、川の向こう）／順序や段階などを経ずに飛び越えること。
건너오다=川や海、道路などの境界や遮るものを越えて、こちら側へ来る。／反対側や他の地域からこちら側へ移って来る。／便りや噂、品物などが伝わってこちら側へ届く。
건네다=物やお金などを他人に移し与える（渡す / 手渡す）。／他人に言葉を掛ける（話しかける）。／渡らせる。（ある境界や場所を横切って行かせる。）
건네주다=物を相手に渡したり移したりする。／お金や対価を相手に支払う。
건드리다=手や体、あるいは物などで何かに軽く触れたり、叩いたりすること。／相手を刺激したり気分を害したりして、心を不快にさせること。／ある事柄や問題を扱ったり、論じ始めたりすること。／ある対象に手をつけて状態を変化させたり、傷つけたりすること (いじる)。
건조=水気や湿気が乾いてなくなること。／天候や気候がひどく乾燥している状態。／態度や雰囲気が情緒に欠け、無機質で冷淡なこと。
겁나다=怖くなったり、恐ろしいという気持ちが生じる。／(副詞的に使われ) 水準や程度がはなはだしい。
게=甲殻類に属する動物。体は硬い殻で覆われており、5対の足があり、そのうちの第1対はハサミ脚である。横に歩くのが特徴で、味が良く食用として広く使われる(カニ)。
게시판=多くの人に知らせる内容を貼ったり掲示したりするために、壁や一定の場所に設置した板（掲示板）。／インターネットのホームページなどで、利用者が書き込みをしたり情報を共有したりできるように設けられた仮想の空間（掲示板 / BBS）。
겨울철=冬が続く間の時期。または、冬になった時(冬季 / 冬の時分)。
결승=運動競技などで最後の勝者を決めるために最後に行う試合（決勝）。
결심하다=することに対して、どのようにするか心を固く決める（決心する）。
경기장=運動競技を行うために必要な設備を備えた場所（主に屋内外の大規模な施設を意味する）。
경력=過去に経験してきた様々な事柄や足跡。／社会生活において、ある種のことを行ってきた経歴や期間。
경비=ある物事を行うのにかかる費用。／国家や団体などが組織を運営し、活動するのに必要な費用。
경제력=経済的な方面で発揮される威力や実力。個人、団体、国家などが財産を生産、流通、消費できる全般的な能力を意味する。
계획하다=これからすることの手順、方法、規模などをあらかじめ考えて立てる（計画する）。
고교=「高等学校」を略していう言葉。中学校の卒業者、またはそれと同等の学力があると認められた人に中等教育および基礎的な専門教育を施す機関を意味する。
고구마=ヒルガオ科の一年草の蔓性植物。またはその根。デンプンが多く味が甘いため、食用や工業用として広く用いられる。／（比喩的表現）もどかしい状況や会話が続くとき、喉が詰まるように感じる状態を指す新造語。
고급스럽다=物の品質や形、雰囲気などが高い水準や格式を備えている感じがある。
고모부=父の姉妹の夫（叔父・伯父）。
고소하다=炒ったごま、ごま油、ナッツ類などから漂う味やにおいのように、香ばしくて食欲をそそる感じがある。／憎い人が失敗したり災難に遭ったりするのを見て、胸がすいて面白い。
고속=物体が動く速度が非常に速いこと。または、その速度(高速)。／高い効率や速い処理を必要とする技術的な装置や状態を指す言葉(高速)。
고속도로=自動車が高速で安全に走行できるように設計された自動車専用道路。主要都市や地域間を迅速に結び、歩行者や二輪車の出入りが制限される（高速道路）。
고집=自分の意見を変えたり直したりせず、固く張り通すこと。また、そのような性質（意地 / 固執）。／ある状態が変わらず、そのまま続くこと。
고통스럽다=体や心が苦しく、痛い状態にある。／状況や境遇が耐え難いほど厳しく、苦しい。
곧다=曲がったり歪んだりせず、直線にまっすぐ伸びている。／心や態度、意志が正しく正直だ。／物や身体の部位がゆがまず、しゃんとしている。
곧잘=かなりの腕前で、または期待以上にそこそこ上手にする様子。／ある事がかなり頻繁に、またはよく起こる様子。
곧장=ある方向に曲がったり遠回りしたりせず、まっすぐに。／途中で他の場所に寄らずに、直接。／ある状態や行動が遅滞なく、すぐに。
골고루=複数が皆、差がなく似通っていたり等しかったりする様子(等しく / 均等に)。／食べ物を好き嫌いせず、色々な種類をあまねく食べる様子(バランスよく)。
골목길=大通りから入り、町の中をあちこち通じる狭い道（路地 / 横丁）。
골프=ゴルフクラブでゴルフボールを打ち、コース上にある穴（ホール）に入れる競技。参加者が各ホールを順番に回り、より少ない打数でボールを入れた人が勝利するスポーツ。
골프장=ゴルフの試合ができるように設備と施設を整えた場所。通常、広い平地や丘に芝生を植えて造成し、18の穴（ホール）を順番に回りながら競技を行う(ゴルフ場)。
곰=クマ科に属する捕食動物を総称する言葉。体格が大きく尾は短く、毛が密集して生えている。雑食性で、冬には穴の中で冬眠する。／愚鈍だったり、行動が遅い人をからかって言う言葉。
공공=国家や社会の構成員全体に広く関わること。／多くの人や団体に共同で属したり、利用されたりすること。
공연장=音楽、舞踊、演劇、映画などの公演が行えるよう設備を備えた場所（公演会場 / 劇場）。
공주=皇帝や王の嫡女（正室から生まれた娘）を指す言葉。／(比喩的に) 大切に育てられ、他人から特別扱いされることばかりを望む女性を指す言葉。／(比喩的に) 両親や周囲の人々から非常に愛され、大切にされている娘を指す言葉。
공통=二つ以上の対象が互いに等しく持っていたり、関連していたりすること（共通）。
공통점=二つ以上の人や物、現象などで互いに共通する点。
공해=産業や交通の発達に伴い、人間や生物が被る様々な被害。環境破壊、大気汚染、水質汚染、騒音、振動などがこれに該当する。／(比喩的に) 多くの人に不快感を与えたり、害を及ぼしたりする物や現象。
과외=定められた教育課程や業務以外の課程。／学校の授業以外に別途勉強を教えたり習ったりすること。（主に「課外授業」の略語として使われる。）
관계없이=ある状態や条件、時間、場所などに拘束されたり影響を受けたりしない状態で。／対象間の関連性がない状態で。
관람객=映画、演劇、スポーツ競技、展示会などを見物したり楽しんだりする人（観客 / 来場者）。
관심사=あることに心が惹かれ、注意を向けるようになる事柄や対象（関心事）。
광경=物事が起きている目の前の様子や場面。／景色や風景の中で、特に印象深かったり特徴的な様子。
괴로움=体や心が安らかではなく、苦しい状態や感じ（苦しみ / 辛さ）。／状況や条件が思わしくなく、経験することになる難しさや困難（苦労 / 悩み）。
괴롭히다=体や心が休まらず、苦痛を与える（苦しめる / いじめる）。／物事や状況が円滑に進まないように妨害したり、困難にさせたりする（困らせる / 悩ませる）。
교내=学校内。学校という空間的範囲の内部を意味する。
교대=ある職務や仕事をするために順序を変えること。または、その人(交代 / 交替)。／特定の位置や状態にある人や物が、他の人や物に入れ替わること。
교문=学校の正門。学校の出入り口となる門のこと。
교복=学生が学校で着るように定められた特定の様式の服（制服）。
교양=学問、知識、社会生活を基に養われる、高潔で円満な品性や知識。／社会生活を送る上で必要な一般的な知識と素養。
교육자=教えることを専門とする人。主に学校や教育機関で学生を指導し、正しい道へと導く教師、教授などを指す。
교재=学問や技術を教えたり学んだりするのに必要な材料。本、映像、道具など、学習を助けるすべての媒体を指す。
교체=ある人や物を他の人や物に変えること（交代 / 入れ替え / 交換）。／交代で仕事を受け持つこと（交代 / 交代勤務）。
교포=自分の国を離れて他の国に住んでいる同胞。（例：在日韓国人、在米韓国人など）
교훈=今後の行動や生活の指針となるような教えや悟り（教訓）。／学校や団体で行いの指針とするために定めた言葉（校訓 / 訓戒）。
구르다=車輪やボールのように丸い物体が回転しながら進む（転がる）。／体を曲げて地面につけ、回転しながら動く（転がる）。／地面に置かれた物体が片方に寄ったり、転がって移動する（転がる）。／（比喩的に）物事が円滑に進行したり運営されたりする（回る）。
구별=性質や種類によって差があること。または、その差に従って分けること。対象を他と分けて特徴を把握すること(区別 / 判別)。
구입=品物などを買い入れること（購入）。
국기=一国を象徴するために、その国の公式な標識として定めた旗。
국산=自分の国で生産すること。または、その品物(国産)。
권투=二人の人が革製のグローブをはめ, 定められた規則に従って拳で互いの体や顔を打ち合い、勝敗を競う格闘競技。「ボクシング(boxing)」とも呼ばれる。
귀가=家へ帰ること、または帰宅すること(帰宅)。
귀국=自分の国へ帰ること、または帰ってくること(帰国)。
귀중하다=品物や価値が非常に宝のようで、大切だ。／尊くて貴い。
규칙적=일정한 規則や秩序に従う様子。または、そのようなもの。／一定の規則や秩序に従うこと。／一定の時間間隔で繰り返されること。
그대=聞き手を敬って呼ぶ言葉。主に詩や歌の歌詞、手紙などの文어体（書き言葉）で相手を親しく呼んだり高めたりする時に使う。／夫婦の間で相手を敬って呼ぶ言葉。
그런대로=満足できるほどではないが、それなりに。または状態が悪くなく、ある程度まあまあに。
그리움=会いたかったり、見たいという切実な気持ち（恋しさ / 懐かしさ）。／ある対象へ向かう切なく切実な心。
그만하다=やっていたことを止めたり、中断したりする。／言っていたことや行動をこれ以上しない。／状態や水準がある程度に達し、それ以上進まない。／程度や水準がその程度に達している。（状態や分量が似ていることを表す時に使用）／状況や状態がその程度で十分だ、または適当だ。／それ以上続けずにやめる。
그제야=前述の内容がすべて成し遂げられてから、はじめて。／ある出来事があってから、ようやく。
그해=直前に話したその年。または、話しているまさにその年。
극복=悪条件や苦労の多い状態を乗り越えること。／(ある対象が) 欠点や不足している点などを直したり補ったりして克服すること。
근교=市街地の周辺や都市に近い近隣地域。（主に大都市に隣接し、都市の影響を強く受ける地域を指す。）
근래=近い過去から現在までの間。(類義語：最近、近頃)
긁다=爪や鋭い物の先で、床や表面をこする。／かゆいところを爪などでかく。／床にあるものを熊手や手などでかき集めたり、掘り出したりする.／人の気分を害したり、怒らせたりする。／（比喩的に）お金や財産を無理やり集めたり、奪い取ったりする。
금=黄金色に輝く貴金属の一つ。光沢があり、空気や水でも変質しないため、装飾品や貨幣の価値保存手段として広く使われる(金)。／黄色を帯びた貴重な金属という意味の「黄金」を縮めて言う言葉。／（比喩的に）非常に大切で貴重なものを例えて言う言葉。／線。 (境界を表したり、印を付けたりするために引くもの。)／物の表面に割れてできた隙間(ひび)。／市価や商品につけられた値段。(比喩的に水準や価値を意味することもある。)／木曜日と土曜日の間にある曜日。「金曜日」の略語。
금액=お金の額(金額)。
금연=健康や火災予防のため、タバコを吸うことを禁じること（禁煙）。／吸っていたタバコをやめること（禁煙）。
금지하다=法令や命令、規則などによって、ある行為をできないようにすること（禁止する）。
금하다=法律や規則である行為をしないように禁止する（禁じる）。／ある場所への出入りを阻止する。／感情や欲求などを抑える、または堪える。
급격히=変化の速度が非常に速く、その程度が激しいさま(急激に)。／状況や勢いなどが突然で激しいさま(急激に / 急に)。
급속히=非常に速く進行したり変化したりする様子（急速に）。
급히=行動や物事が非常に急いでいて速いさま（急いで / 速やかに）。
긋다=線や筋を引く。／マッチやライターなどに摩擦を起こして火を灯す。／数量や金額などを計算したり、決定したりする。／雨がしばらくやむ。（主に「雨をしのぐ」の形で使われ、雨を一時的に避けるという意味で使われる）／境界を明確に分けて区別する。
기념=優れた人物や特別な事件、業績などを忘れずに心に深く刻むこと。／ある出来事を祝ったり記憶したりするための行事や形式を整えること。／思い出として残すために、ある物や印を残すこと。
기다=赤ん坊や動物が腹を地面につけ、手足で体を移動させる（這う）。／虫などが床や物体の上を動いていく（這う）。／（比喩的に）相手の前で身動きが取れなかったり、ひどく屈従的な態度を取ったりする（へりくだる / ぺこぺこする）。／（比喩的に）速度が非常に遅く動く（のろのろ進む）。
기대다=体や物の重さを他のものに預けて支えるようにする。（例：壁にもたれる）／ある対象に頼ったり助けを得たりする。（例：両親に頼る）
기도=神や絶対的な存在に願いや感謝の気持ちを告げ、望みが叶うように祈ること。／ある事を成し遂げようと目論むこと。または、その計画や試み。
기독교=ナザレのイエスを救い主として信じ従う宗教。聖書を根本的な経典とし、大きくプロテスタント、カトリック、正教会などを総称する言葉。／(狭い意味で) カトリックと区別して「プロテスタント」のみを指して言う言葉。
기둥=建物で上部の重さを支えるために、垂直に高く立てた太くて長い木や石、鉄などの棒（柱）。／ある物事や組織の中心となる重要な役割や人物を比喩的にいう言葉。
기술자=技術に専門的な知識や技能を持っている人(技術者)。／特定の分野の機械や道具を扱うことに長けている人。
기여=役に立つように尽くすこと。主に肯定的な目的や結果に力を添えることを意味する。
기울다=斜めに片方へ低くなったり、寄ったりする。／太陽や月が沈む。／勢いや状態が以前より劣ったり、危うくなったりする（衰える）。／心や状況がある一方に傾く。
기원=物事や現象が初めて生じること。または、その根源。／[歴史] 人類や文明などが発生して始まった土台。
기적=常識的には到底起こり得ないと思われる奇妙なことが起こること。または、そのような現象。／宗教的信念に従い、神の力によって起こったと信じられる神秘的な現象。
긴장하다=心を引き締め、気を引き締める（緊張する）。／体の筋肉や神経が収縮して張り詰めた状態になる。／関係や情勢が穏やかでなく、争いが起きそうな状態になる。
길가=道の両側の縁(みちばた)。
길거리=1. 人が通る道の地面やその周辺。 2. 家の外の道の上。または市内の通り。
깔끔하다=身なりや格好が小綺麗で清潔だ。／仕事や手際などに無駄がなく、きっちりしていて手際よい。／性格や態度がはっきりしていて、さっぱりしている。／味がしつこくなく、さっぱりしている。
깨뜨리다=固い物体に衝撃を与えて、いくつかの破片に分かれるようにする。（「割る・壊す」を強調した表現）／雰囲気、約束、バランス、平和など、維持されるべき状態を壊したり破ったりする。／記録や成績などを超えて、新しい記録を打ち立てる。
깨어나다=眠りから覚めて正気に戻り、意識を回復する。／酒や薬の気運などが消えて、精神がはっきりする。／時代や状況に対して持っていた誤った考えや迷いから脱し、真理を悟るようになる。／冬眠していた動物や植物が活動を始める。
깨우다=眠っている状態から抜け出させる。（「寝る」の使役形）／知能、知恵、意識などを目覚めさせたり、悟らせたりする。
꺼지다=燃えていた火や光が消えたり、かすかになったりする。／作動していた機械や電気装置などが止まる。／中に入っていた空気やガスが抜け、体積が減ったり、くぼんだりする。／元気や勢いなどがくじけたり、なくなったりする/消える。
꼭대기=ある物事や物の一番上の部分(頂上 / てっぺん)。／ある程度や水準が最も高い状態を比喩的にいう言葉。
꼼꼼하다=隅々まで細かく、徹底している。物事の内容を一つ一つ細心の注意を払って確認する態度がある。
꼼짝=体をほんの少しでも動かす様子。主に「できない」、「しない」、「するな」などの否定語と共に使われ、行動の自由が完全に制限されたり固定された状態を表す。／ある力や脅威に押さえつけられ、身動きが取れなかったり反抗できなかったりする様子。／（比喩的に）物事や状況が少しも変動したり解決したりしない様子。
꼽히다=数や指の中に入って、明白に数えられる。／多くの人々によって優れたものとして指名されたり、認められたりする（指折りの、屈指の）。
꽃잎=花の中心部（雄しべと雌しべ）を包んでいる葉のような形の個々の破片。花を構成する最も華やかな部分である(花びら)。
꾸리다=荷物をまとめたり縛ったりして整理する。／家庭を築いたり、所帯を持ったりする。／組織を構成したり、計画を立てて運営していく。／苦しい状況を何とか維持しながら切り盛りしていく。
꾸중=目上の人が目下の人の過ちをたしなめること。またはその言葉（説教 / 叱責）。
꿀=蜜蜂が花の蜜を吸い取り、巣の中に蓄えた甘い液体（はちみつ）。／非常に甘いものや、貴重なものを比喩的にいう言葉。／(俗語・流行語) 少ない努力で大きな利益を得る状況を指す言葉。
꿈속=眠っている間に夢を見ている状態、またはその夢の内容の中。／（比喩的に）現実ではないかのように遠のいたり、うっとりしたりする状態。
끈=物を縛ったり、結んだり、掛けたりするために細くよった紐。／人と人の間の関係やつながりを比喩的にいう言葉。
끊기다=糸、紐、縄などが切れる。（「끊다（切る）」の被動詞）。／関係や縁がこれ以上続かなくなる。／電気、電話、インターネットなどの供給や信号が止まる。／言葉や流れ、文脈などが続かずに止まる。／足取りや連絡などが来なくなる。
끊어지다=糸、紐、縄などが切れて二つ（あるいは複数）に分かれる。／関係や縁がこれ以上続かずに終わる。／流れ、音、電気などが止まったり通じなくなったりする。／息が絶えて死ぬ。
끊임없다=絶え間ない。継続したり続いていたものが途切れない。状態や現象が止まらずに持続することをいう。
끌리다=床に触れたまま後ろについて動く（引きずられる）。／ある力や状態によって一定の方向に動かされる（引かれる）。／心や視線がある対象に向かう（惹かれる）。／ある事柄や状況が予定より長く続く（長引く）。
끌어당기다=物体や人などを自分のほうに近くに来るように引き寄せる。／人の心や関心、注意などを強く惹きつける。／仕事の期限や予定された時間を早める。／ある関係や仕事に他人を強引に引き込む。
끝없다=時間や空間の終わりがない（果てしない / 無限だ）。／状態や現象、または欲心や考えなどが絶えずに続く（絶え間ない / 尽きない）。
끝없이=終わりの見えないほど非常に遠かったり、長く続いたりする状態で。／考えや現象が絶えず、繰り返されたり続いたりする様子。
끼=朝、昼、晩のように、毎日決まった時間に食べる食事の回数を数える単位。／「끼니(食事/膳)」を短くした言葉。
끼어들다=列や隊列、あるいは何かの隙間に無理やり押し入る。／他人の会話や事に許可なく口を出したり参加したりする。／走行中の車が他の車線に急に割り込む。
나뉘다=一つだったものがいくつかの部分や破片に分かれる。（「나누다（分ける）」の被動詞）／一定の基準に従って種類や部類が区分される。／考えや意見、心などが一つにまとまらず、いくつかに分かれる。／計算の結果がある数で割り切れる。
나르다=物や人などを、ある場所から別の場所へ移す（運ぶ）。／考え나 ニュース、情報などを伝えたり広めたりする。
나물=人が食べられる草や木の葉などをひっくるめていう言葉(ナムル / 山菜 / 野菜)。／食用の草や木の葉をゆでたり炒めたり、または生で調味料と和えた料理。
나뭇잎=木についている葉。植物の養分を作り、呼吸作用をする器官。
나비=節足動物門昆虫綱チョウ目に属する昆虫の総称。体は頭、胸、腹の3つの部分に分かれ、華やかな2対の翅（はね）を持ち、主に昼間に活動して花の蜜を吸う(チョウ)。／一定の形や動きがチョウのはばたきに似ているものを比喩的にいう言葉。
나빠지다=健康、状態、気分、仲などが以前より良くない状態になる。／品行や性質などが良くない方へ変わる。
나아지다=病気や怪我などが治って健康が良くなる。／都合、状況、実力などが以前より良い状態になる。
낙엽=木の葉が枯れて落ちること。または、その落ちた葉。主に秋に起こる現象を指す。
난리=戦争や反乱などによって世の中が乱れ、秩序が混乱した状態。／大勢の人が一度に騒いだり入り混じったりして、非常に騒がしく無秩序な状態。／（比喩的に）とてつもない災難や大きな事故が発生した状況。
날카롭다=物の先端や刃が鋭くなっていて、何かを刺したり切ったりするのに適した状態だ。／気勢や雰囲気、声などが鋭く強烈だ。／観察力や批判、分析などが非常に正確で鋭い。／神経や感覚が過敏に尖っている。
남매=兄と妹、または姉と弟をあわせていう語（兄妹 / 姉弟）。
남북=南と北をあわせていう語。／朝鮮半島の南韓（韓国）と北韓（北朝鮮）をあわせていう語。
낭비=時間、金、情熱などを無駄にむやみに使うこと。またはエネルギーや資源などを節約せずに浪費すること。
낮추다=高さや水準、数値などを下に下げたり少なくしたりする。／態度や声などを謙虚にしたり小さくしたりする。／人の地位や価値を実際より低く評価する。
내달=今月のすぐ次の月（来月）。
내버리다=ゴミや不要な物を遠くに持っていって捨てる。／世話をせずにそのままにしておいたり、放り出したりする。／惜しい機会や価値のあるものを完全に失ったり、諦めたりする。
내보내다=中や中にあるものを外に出す。／人をある場所へ行かせたり、派遣したりする。／品物や商品を外に売ったり、運び出したりする。／ある組織や関係から去らせたり、追い出したりする。／放送や新聞などを通じて、ニュースや番組を広く知らせる。
내외=男性と女性を合わせていう言葉。（例：男女、男と女）／物の内側と外側。／夫と妻を合わせていう言葉。／ある数値や数量に少し足りないか、あるいは超える程度。（例：10名前後）／建物の内外をあわせていう語。／ある数量に少し足りないか、あるいは超える程度を表す語。／夫と妻をあわせていう語（夫妻 / 夫婦）。／物事の内外に絡んだ状況や条件。
내주다=(何かを他人に)外に出してやる(差し出す / 与える)。／(錠前や結び目などを)解いて開けてやる。／(お金や品物などを)お釣りを渡したり、支払ったりする。／(席や権利などを)他人に譲ったり貸したりする。
냉동=温度を下げて物を凍らせること。または、そのように凍った状態。主に食品の腐敗を防ぎ、長期保存するために用いられる方式。
넉넉하다=サイズや数量などが基準に満ちていても余りがある。／時間や空間、お金などが不足せず余裕がある。／気立てや性格が寛大で余裕がある。／暮らし向きが経済的に豊かである。
넓어지다=面積や幅、空間の大きさが以前より大きくなる。／範囲、勢力、知識、心の広さなどが以前より大きく、または豊かになる。／靴や服などが伸びて緩くなる。
넘겨주다=自分の権利、義務、品物、事業などを他人に移し与える（譲り渡す / 引き渡す）。／していた仕事を終えないまま、他の人に任せる（引き継ぐ）。／品物や対象を境界線の向こう側へ送る。
넘어뜨리다=立っている、または立てられている人や物を倒す。／（比喩的に）地位や権力を持つ人や団体を打ち負かしたり屈服させたりする。
넘어오다=(低い所から高い所を通って)こちらへ来る。塀や山などの障害物を越えてこちらに移ってくることを意味する。／(境界や線を)越えてこちらへ来る。国家、地域、または見えない境界線を通過してこちらへ移動することを意味する。／(権利、責任、所有権などが)他人からこちらへ移る。主権や物の持ち主が変わる状況を表す。／(相手の誘惑や説得に)屈服したり同意したりして心を入れ替える。誘惑に乗せられたり、相手の味方になったりすることを意味する。／(飲食物などが)逆流して口の外へ出ようとする。胃の調子が悪くて胃酸や食べたものが込み上げてくる状態を意味する。
네거리=四つの道が一つに交わる所。「サゴリ(四差路)」と同じ意味。
노랫소리=歌う音、または歌う声（歌声）。
노선=列車、自動車、飛行機などが定期的に行き来する決まった道（路線）。／個人や集団が追求する一定の方向や方針（路線 / ポリシー）。
녹다=氷や雪などが熱を受けて水になる（溶ける）。／固体の物質が熱や湿気を受けて液体のように柔らかくなったり、ほぐれたりする（とろける）。／砂糖や塩などの粉末が液体に混ざって溶ける（溶解する）。／（比喩的）緊張や寂しさ、怒りなどの感情が和らぐ。／（比喩的）ある雰囲気や環境に自然に溶け込む。
녹음=音を機械装置に記録して再び聞けるようにすること。または、そのように記録された音。／(比喩的に) ある事実や言葉をそのまま記録しておくことを指す言葉。
녹음하다=装置を用いて、音を機械的な方法で記録すること。
녹이다=固体状態の物質（氷、雪、金属など）に熱を加えて液体状態にする（溶かす）。／凍ったり冷え切ったりした体の一部を温めて、柔らかくする（温める / ほぐす）。／固まったものや凍りついた雰囲気、心などを柔らかく解きほぐす（和らげる / 溶かす）。
논리적=論理にかなっていること。または、論理的に妥当で体系的なこと。／論理にかなっていること。または、そのような性質を帯びていること。／言葉や文章の筋道が正しく、妥当であること。
놀리다=誰かの弱点や足りないところを捉えて笑いものにしたり、おどけて困らせたりする。／いたずらをして相手を怒らせたり、慌てさせたりする。／（物や身体の部位を）じっとさせずに動かしたり使ったりする。／（人手や機械などを）使わずに休ませておく。／(楽しく) 巧みに振る舞ったり、いたずらをしたりして楽しく過ごす。／他人をあざけったり、からかったりする。／機械や道具、体の一部などを止めずに動かし続ける。／仕事をさせずにそのままにしておく。
놀이터=子供たちが集まって遊べるように、遊具や施設を整えておいた場所(遊び場 / 公園)。／(比喩的に) ある活動を自由で楽しくできる空間や環境。
농사일=農業を営むことに関連した仕事。田畑を耕し種をまき、農作物を育てて収穫するなどのあらゆる労働を指す言葉。
놓아두다=ある物をある場所に置いておく。／ある状況や状態をそのまま維持したり、手を触れなかったりする。／人や動物をある場所に留まらせたり、自由にさせたりする。
놔두다=物などをある場所に置いた状態のままにしておく。（「놓아두다」の縮約形）／ある状況や状態を変化させずにそのまま維持する。／干渉しなかったり、放っておいたりする。
눈가=目の周り。または目の横の部分(目元 / 目尻)。
눈감다=眠ったり休息を取ったりするために目を閉じる。／亡くなって世を去る。／他人の過ちや欠点を見逃してやる。／ある事柄に対して関心を断ったり、知らないふりをしたりする (目をつぶる)。
눈동자=目の眼球の中央にある黒い部分（瞳孔）。／（比喩的に）目そのものを指す言葉。
눈뜨다=眠りから覚めて目を開ける。／見えなかった視力を回復する。／（比喩的に）ある事実や現象について悟ったり、知識や関心を持つようになる。
눈부시다=光がまぶしすぎて、まともに見ることができない。／対象の勢いや姿が非常に華やかで優れており、まともに見ることができないほどである。／発展や成果などが非常に驚かしく、立派である。
늘어놓다=品物を広い場所に並べる。／考えや言葉、言い訳などをよどみなく長々と続ける。／様々な項目や事実を順に並べる。
늘어서다=人や物が一列に長く並ぶ。／複数の物体がずらりと並んでいる。
늦어지다=決まった時より後に延びたり、時間が遅れたりする（遅れる / 遅くなる）。／速度が遅くなったり、進行が滞ったりする（鈍る / 遅くなる）。
다가서다=対象の横や前に近く寄って席を取る（近づく / 近寄る）。／ある事や目的に近づく（接近する）。／ある状態や時期に差し掛かる（臨박する / 迫る）。
다녀가다=ある場所に立ち寄ってから去る。主に家や事務室などの特定の場所を訪問して帰ることを意味する。
다행=思いがけないことで物事がうまく運んだり、良くない事態を免れたりして、運が良く喜ばしいこと。また、そのように思うこと。
다행히=思いがけず物事がうまく運び、運良く。
단단하다=物の形や構造が堅固で、力を加えても簡単に壊れたり崩れたりしない状態にある(固い / 頑丈だ)。／肌や筋肉などに弾力があって強い(引き締まっている)。／性格や決心、連帯感などが揺るぎなく、しっかりしていて強い(固い / 強固だ)。／仕事の締めくくりや処理に抜かりがなく、しっかりしている(抜け目がない)。
단독=一緒ではなく一人で、またはそれ一つだけ。／他のものと混ざったり、関連したりしていない状態。／[マスコミ] 他のメディアより先に、該当のメディアだけが単独で報じること。
단점=人や物、現象などが持っている欠点や足りない点。（対義語：長所）
닫히다=開いていた門、窓、蓋などが再び合わさったり、塞がったりする。（「닫다（閉める）」の被動詞）／固く決心したり緊張したりして、心の門が開かなくなる。／取引や営業、通行などが中断されたり、塞がったりする。
달래다=悲しんだり不満を抱いたりしている人、あるいはぐずる子供の機嫌を直してあげたり、心を落ち着かせたりする。／空腹、喉の渇き、痛み、寂しさなどの身体的・心理的な苦しみを抑えたり、一時的に忘れさせたりする。／物や状況を慎重に扱って、望ましい状態にする。
달려들다=誰かを脅かしたり害を与えたりしようと、非常に激しい勢いで近づく。／ある仕事や問題に非常に積極的で情熱的な態度で取り組む。／誰かに嬉しさを表したり、すがりついたりするために素早く近づいて身を寄せる。／(比喩的に) ある対象が別の対象に対して激しく向かっていく、あるいは集中する。
달빛=月から差し込む光（月光）。
담=家や一定の空間の周囲を仕切るために石、レンガ、土などで積み上げた施設物（塀 / 垣根）。／（比喩的に）関係を絶ったり疎通を妨げたりする心理的な障壁。／「次（タウム）」の縮約形で、ある順番のすぐ後ろ。または決められた時間より後の時。
담당자=ある仕事や事務を責任を持って引き受け、処理する人（担当者）。
답변=質問や問いに対して答えること。またはその答え。／法律や政治的な状況において、ある問いや論争に対して自身の意見や態度を明らかにすること。
당분간=これからしばらくの間。（副詞として、ある状態や状況がしばらく維持されることを表す時に使われる。）／しばらくの間。 (現在を基準に近い将来の一定期間を表す。)
대강=事のあらすじや重要な部分だけを要約したもの。または、細かい部分まで気にせず、大まかにまとめたり処理したりする様子。／1. 詳しくなく、基本的な部分やあらすじだけを抜き出す様子。 2. 物事の処理を丁寧に行わず、いい加減にする様子。 3. 量や程度がある水準にほぼ近い様子。 (大体 / おおよそ)
대낮=(比喩的に) 夜でも明かりが非常に明るく、昼間のような状態。
대다수=全体の中でほとんど大部分を占める数や量。
대도시=政治、経済、文化の中心地となる、規模が大きく人口の多い都市。
대략=詳しくなく、おおよそ。(大体 / おおよそ)／ほぼその程度の数量や水準に近い様子。(大凡 / 約)／詳しくない、基本的なあらすじや内容（大略 / 大まかな内容）。／正確ではないが、ほぼその程度に近い数値や程度（およそ / 約）。
대비=今後起こりうる困難な事柄や状況に対して、あらかじめ準備すること。またはその準備。／二つ以上の対象を互いに照らし合わせて比較すること。／二つ以上の色や形、性質などを照らし合わせて, その違いを際立たせること。またはそのような現象。特に色彩学において、隣接する色の影響で色の属性が異なって感じられる現象を指す(対比)。
대사=国家を代表して外国に派遣され、外交交渉を行ったり自国民を保護する任務を担う最高位の外交使節。／(比喩的に) ある重要な使命を帯びて派遣された人。／演劇や映画、ドラマなどで、俳優が観客に聞かせるために発する言葉。作品の中の人物たちがやり取りする会話や、独り言などを総称する言葉(台詞 / セリフ)。
대상자=ある事柄や行動の相手となる人（対象者）。／恩恵、補償、試験合格、調査などの範囲に含まれる人。
대여섯=五つか六つほどの数（五、六）。／五つか六つほどの数量を表す冠形詞（五、六個の / 五、六人の）。
대접=出迎えたり見送ったりして、客を迎え応対すること（もてなし / 接待）。／料理を準備して客に振る舞うこと（ご馳走）。／相手をある態度で扱うこと（待遇 / あしらい）。
대체=ある対象を別のものに替えること（代替）。／（経済）ある商品の価格変化が他の商品の需要に影響を与えたり、生産要素間の入れ替えが起こる現象。／元の計画や方策が実行不可能な時に用意する別の案。／一体全体。どうして。（主に疑問文に使われ、驚き、もどかしさ、問い詰める気持ちなどを表す時に使用する。）／要点だけを言えば。または、全般的に見て。
대학교수=大学で学問を教え、研究する人。一般的に助教授、副教授、正教授などを通称する。
대화하다=向かい合って言葉を交わす（対話する）。
더욱더=(副詞) 程度や水準が以前よりもずっとはなはだしく。「もっと、さらに(더욱)」を強調して言う語。
덮이다=「덮다（覆う）」の被動詞：物の表面が他の物体で覆われたり載せられたりする。／現象や気配が広がる：霧、雲、暗闇などが一定の空間に充満する。／事実や過ちが露呈しない：過ちや噂などが外部に知られないように隠される。
도둑=他人の物を盗んだり奪ったりする人。または、他人の物を盗む行為(泥棒 / 盗み)。
도리어=予想や期待、または一般的な常識とは反対に、あるいは異なって。（類義語：むしろ、かえって）／前の内容が後ろの内容に対して、反転のきっかけになることを表す時に使う言葉。
도마=大根の千切りや肉などを包丁で切ったり叩いたりする時に下に敷く、木やプラスチックなどで作られた板（まな板）。／(比喩的表現) ある物事や現象が批判や分析の対象になることを指す言葉。
도망=避けて逃げること（逃亡 / 逃げ出すこと）。／義務や責任などを避けて身を隠すこと。
도망가다=避けたり追われたりして、遠くへ逃げる。／（比喩的に）責任や義務を回避して退く。／物や動物がいた場所からなくなったり、消えたりする。
도망치다=避けたり追われたりして、遠くへ逃げる。／（比喩的に）苦しくて辛い状況から抜け出したり、責任を回避したりする。／閉じ込められていた場所からこっそり抜け出す。
도시락=外出したり野外活動をしたりする際、食事の代わりに容器に入れて持ち歩く食べ物（お弁当）。／食べ物を入れるのに使う小さな容器（弁当箱）。
도심=都市の中心部。商業、行政、文化施設が密集しており、流動人口が多い地域を指す。
도자기=粘土で形を作り、火で焼いて作った器や装飾品の総称。陶器と磁器を合わせた言葉。
도전=困難なことや記録更新などに正々堂々と立ち向かうこと。／戦いをあおったり仕掛けたりすること。／(比喩的に) 既存の権威や秩序などに反対して立ち向かうこと。
독하다=味や匂いなどの刺激が非常に強い。／勢いや性質が非常に強かったり激しかったりする。／心が寛大でなく、執念深くて強い。／薬品や化学物質の性質が強く、体に害があったり影響力が大きかったりする。
돌멩이=「石」を小さくて硬い塊として呼ぶ言葉。主に手に握れるほどの大きさを意味する。
동그라미=丸く描いた円の形。／ある対象が正解であること、または正しいことを示すために、その周囲に描く円形の印。
동부=ある地域や国の東の部分（東部）。／(地理的な固有名詞として使われる際) 東欧やアメリカ東部など、特定の地域の東側のエリア。
동아리=同じ志を持って集まり、共に活動する人々の集まり。（主に学校や職場内の学生の集まりや自治団体を指す言葉。）／同じ目的を持つ人々が仲間を組んだ群れ。
동의=ある意見や提案に対して賛成したり、同じ意見を持ったりすること。／他人の行為を承認したり許可したりすること。／法律的に、ある行為に対して承諾の意思表示をすること。
동창=同じ学校で一緒に勉強した人、または同じ学校を卒業した人(同窓生 / 同級生)。
동화책=子供のために童話（子供の心理に合わせて作られた話）を記した本。
되돌리다=時間や状態を以前に戻す：すでに過ぎ去った時間や以前の状態、状況などに再び戻るようにする。／元の持ち主や場所に戻す：借りたり持っていた物を、元あった場所や持ち主に再び返す。／方向を変えて戻らせる：行っていた道や流れを反対方向に変える。
되돌아가다=していたことを中断し、元いた場所や状態に再び行く。／行っていた道を引き返し、元の出発点に向かう。／(ある状態や過去の時点に)再び変わったり移ったりする。
되돌아오다=行った場所から元いた場所や出発した場所に再び戻ってくる。／ある状態や状況が以前の姿に再び回復したり変わったりする。／（手紙や品物などが）目的地に届かず、差出人に戻ってくる。／ある結果や影響が、原因を提供した人に再び戻る。
되살리다=死にかけていた命を再び生き返らせる。／失われたり薄れたりした記憶、感情、元気などを再び呼び起こしたり思い出させたりする。／古くなったり使えなくなったりした物や制度を再び使えるようにする。／消えかかっていた火種や勢いなどを再び強くする.
두께=厚さ。物体の上下の表面の間、または前後の表面の間の距離。／(比喩的に) ある物事や現象の深さや幅、または積み重なった程度をいう言葉。
두려워하다=未来に起こる状況や対象に対して、恐ろしかったり不安な気持ちを抱く。／ある結果が悪くなるのではないかと心配したり、慎重に考えたりする。
두리번거리다=何かを探したり伺ったりするために、頭をあち코ちとしきりに回して見る。
두어=二つほどの。あとに続く数量単位の名詞を修飾して、その数が大体二つ程度であることを表す。
둘러싸이다=ある物体の周囲が他の物や人に囲まれる。（「둘러싸다（囲む）」の被動詞）／ある環境や状況の中に置かれるようになる。／ある問題や事件の中心となり、論争や関心の対象になる。
뒤편=ある対象や建物の後ろの方向や場所(後ろ / 裏側)。／(比喩的に) 表に現れない裏面や背後(裏側 / 背景)。
뒷모습=人や物の後ろから見える姿。／ある事柄や事件の裏側に隠された姿や結末。
뒷문=建物の後ろ側にある門。正門や表門の反対側にある門を指す。／(比喩的に) 正当ではない手段や、正式な手続きを経ていない非公式なルート。
뒷산=家や村の後ろにある山。生活圏に隣接しており、散歩や軽い登山のなどのために頻繁に訪れる山。
들려주다=音や音楽、声などを他人が聞けるようにする（聞かせる / 聴かせる）。／話やニュース、情報などを人に話してやる（聞かせる / 語って聞かせる）。
등록금=学校や塾などの教育機関に学生として登録するために支払う金。授業料や入学金などをすべて含む概念。
등록증=特定の事実や権利関係を公式の帳簿（登録簿）に記録したことを証明する文書。
등산로=山に登るために作られた道 (登山道)。
따라다니다=ある人や動物の後を追い続けて移動する（つきまとう / ついて回る）。／ある事柄や現象が、他の事柄と常に一緒に起きたり、傍に留まったりする（つきまとう / 付随する）。／誰かのことを好きになったり関心を持ったりして、絶えず追いかけ回して求愛する（追いかけ回す）。
따라오다=先行する人や物の後に付いて来る(付いて来る / 追う)。／ある水準や状態に及んだり到達したりする(追いつく / 匹敵する)。／ある事や現象が他の事に続いて起こったり伴ったりする(伴う / ついてまわる)。
딱딱하다=物体の性質が固くて硬い。／態度や雰囲気、表情などが柔らかくなく、厳格だったり、よそよそしかったりする。／文章や声などにリズム感がなく、無味乾燥である。
땅바닥=地面。または地面の平らな部分。
땅속=地の底、または土の中。／比喩的に、人が死んで埋葬される場所を指す言葉。
땅콩=マメ科の一年草。またはその実。殻の中に通常2つの種子が入っており、油を絞ったり、炒めて間食として食べる。／(比喩的) サイズが非常に小さいか、可愛らしい対象を指す言葉.
때때로=一定の時間間隔を置いて、たまに（時々 / たまたま）。／状況によってその都度、または少なくない頻度で（折々に / 度々）。
땜=(依存名詞) 「때문(ため/せい)」の縮約形。ある事の原因や理由、根拠を表す。主に口語体で使われる。
떠나가다=ある場所から別の場所へ移動する。（特に、なじみのある場所や故郷を後にして遠くへ移ることを意味する。）／付き合っていた人や所属していた団体との関係を断ち、去る。／音が非常に大きく響き渡る。
떠나오다=住んでいた場所や生まれた場所（故郷）を後にして、別の場所へ移ってくる。／ある集団や組織、状態から抜け出して外へ出る。
뚜껑=器や箱などの上を覆うもの(蓋)。／ある物の外側を覆い隠す部分。／(比喩的) 進行中の事柄の結果や内容を明らかにすること。
뛰어내리다=高い所から低い所へ体を飛ばして降りる（飛び降りる）。／走っている車や船などから外へ体を投げ出して降りる（飛び降りる）。
뛰어다니다=あちこち忙しく走り回って移動する。／（主に家の中や一定の空間で）うれしくて、または急いでいて、激しく走って動く。／ある事を成し遂げるために、あちこち奔走する。
뜯다=くっついているものを剥がす、取り除く（封を切る）。／全体から一部をちぎり取る。／組み立てられた物を分解する。／楽器の弦を指で弾いて音を出す。／他人の金品を無理やり奪い取る（ゆする）。
뜰=家の前後にあったり、左右にあったりする空き地。草花を植えたり木を整えたりもして、庭（マ당）よりも少しこぢんまりとしていて、庭園のように整えられた空間を意味する。
뜻대로=自分の心や考え、または計画した通りに。
뜻밖=思いもよらなかったことや事実（意外 / 案外）。
뜻밖에=予想や期待とは違って。思いがけない状況が急に現れたり起こったりする時に使う言葉。
라이터=タバコを吸ったり火をつけたりするのに使う携帯用点火器具。オイルやガスを燃料として使い、指で火打ち石やボタンを押して火花を起こす。
레몬=ミカン科の常緑小高木、またはその実。楕円形で外皮は黄色く、果육は非常に酸っぱい。ビタミンCが豊富で、料理、飲料、香料の材料として広く使われる。
렌즈=光を屈折させて物体の像を結ばせる透明な物体。眼鏡、カメラ、望遠鏡などに使われる。／視力を矯正したり美容を目的として、黒目の部分に直接つけて使用するコンタクトレンズ。
로봇=自ら動いたり、操作によって複雑な動作を行う機械装置。人間の姿に似ていたり、人間の知能的な行動を模倣するものを含む。／子供たちが遊ぶロボットの形をしたおもちゃ。／（比喩的に）自分の意志がなく、他人に言われるがままに動く人。
마라톤=陸上競技のうち道路競技の一つ。42.195kmの距離を走る種目で、忍耐と根気が要求される代表的な有酸素運動である。／（比喩的に）あることを終えるのに非常に長い時間と多大な努力が必要な過程や活動を指す言葉。
마무리=物事の締めくくり。または、その締めくくりの部分。／物を作る際、仕上げをして完全なものにすること。
마사지=手や器具を使って体の筋肉を叩いたり揉んだりして、血行を良くし疲労を和らげること。「あんま」と言い換えられることもある。
마약=微量で強力な鎮痛作用と麻酔作用があり、使い続けると習慣性と耽溺性が生じ、使用を中断すると禁断症状を引き起こす物質。（例：阿片、モルヒネ、コカインなど）／（比喩的に）一度ハマると、なかなか抜け出しにくいことや物。
마음가짐=心をどのような状態に持ったり、引き締めたりする態度（心がけ / 覚悟 / 持ちよう）。
마음껏=心ゆくまで、存分に。
마음먹다=何かをしようと決心したり、心に決めたりする。／ある状態や態度を持つことに固く決心する。
마음씨=心遣いの態度や、きめの細かい性質。（主に他人への接し方や、物事を処理する際に表れる心の性質を意味する。）
마이크=音を電気信号に変えて増幅したり録音したりできるようにする装置。主に舞台公演、講演、放送などで声を大きく伝えるために使用される。（略語：マイクロホン）
마주치다=互いに正面から向き合う。（主に目や視線が合う時に使用）／偶然に会う。（道や場所で予期せず対면する時に使用）／物体や現象が互いにぶつかったり触れ合ったりする。（手のひらを打ち合わせたり、波が岩に当たったりする時など）／物事や状況が互いに重なったり直면したりする。
마찰=二つの物体が互いに触れ合ってこすれること。または、それによって生じる抵抗現象。／人と人、あるいは集団の間で意見が衝突したり、利害関係が絡み合って発生する葛藤や不和。
막내=兄弟や姉妹の中で、一番最後に生まれた人(末っ子)。／団体や組織、集団などで、年齢が一番若いか、入った順序が一番遅い人を比喩的にいう言葉(新入り / 最年少)。
막상=前に考えていたこととは違って、実際にその事態に直면した時に使う言葉（いざ、実際に）。
만만하다=性質や態度が穏やかで、扱いやすい。／対抗したり相手にするのに手ごろな状態にある。／（主に否定語と共に使われ）物事の性質や状況が容易ではない。
만점=規定されている点数の最高点。／ある対象や状態が非常に完璧で、申し分ないことを比喩的に表す言葉。
만족=心に満ち足りること。または、不足がなく十分なこと（満足）。／期待したり望んだりする程度に達して、不足がない状態。
만족스럽다=期待したり望んだりした通りになり、心に満ち足りた感じがある(満足だ / 満足らしい)。
만족하다=心に満ち足りている。（期待したり望んだりすることが叶い、不足がないと感じる。）／一定の数量や条件に不足がない。（数学や論理学などで、与えられた条件を満たす。）／期待したり望んだりしたことが叶い、心に満ち足りている（満足する）。／不足がなく十分である。
말투=話をするときの癖や身なり（話し方 / 言い回し）。／話をするときに感じられる独特の雰囲気や感じ。
맘=「마음（心）」を短くした言葉。人の考え、感情、意志、あるいは本性などを総称する。
망치다=壊したり、ひどく使えない状態にしたりする（台無しにする）。／物事や計画などを失敗させたり、台無しにしたりする。／体や性格、将来などを悪い状態にする。
맞은편=向かい側。反対側。
매=人や動物を叩く棒、またはそれで叩くこと（鞭 / お仕置き）。／（比喩的に）過ちに対して加えられる罰や批判。
매달다=ある物を別の場所に掛けて、下に垂れ下がるようにする（吊るす / 掛ける）。／ある事柄や人に、体や心を全面的に頼る（頼り切る / 依存する）。／（主に「-에 매달다」の形で使われ）ある条件や基準を付け加える。
머리칼=頭に生えている毛。（「머리카락」の略語：髪の毛）
먹고살다=生計を立てる。すなわち、死なずに生きていけるほどに食べ、経済活動を続けていく。／（比喩的に）ある仕事や手段を通じて経済的な収入を得て生活する。
먹이=動物が生存のために食べる食べ物(餌)。／(比喩的に)ある目的を達成するために利用される対象や犠牲。
먹히다=食べ物が口を通じて体の中に入れられる。（「食べる」の受身形）。／（ある存在が別の存在に）食われる、捕食される。／お金、時間、努力などが費やされる、かかる。／ある言葉や計画が相手に受け入れられたり、効果を発揮したりする。
멎다=続いていた動きや状態が止んだり終わったりする。（例：雨、風、雪、泣き声など）／機械や心臓などが作動を止める。／流れていた液体や波が止まる。
메우다=穴や窪みなどの空いている場所を埋める。／いっぱいに満たす。（空間や時間、不足している部分を埋めることを意味する）／穴が開いていたり、隙間があったりする場所を塞ぐ。
면담=特定のことについて直接会って話すこと。またはそのような対話。主に何らかの問題を解決したり情報を得たりするために、一対一で会って話をすること。
면적=平面や曲面の大きさ。（主に平方メートル($m^2$)、坪などで表される。）／一定の境界内の土地の広さ。
멸치=ニシン目カタクチイワシ科の海水魚。体は細長く、長さは10〜15cmほどである。背は暗青色、腹は銀白色を帯びている。韓国の全沿岸に分布し、主に乾燥させて食用にしたり、塩辛にしたり、出汁を取るのに使われる。(カタクチイワシ / アンチョビ)／(比喩的) 体格が非常に小さく痩せている人を低めて呼ぶ言葉。
명단=ある団体や組織に属している人、または特定の事柄に関わっている人々の名前を書き記したリスト（名簿）。
명확하다=名詞や事実、根拠などが非常に明白で確実だ。
몇십=十の数倍になる、漠然とした数の。（数量を表す言葉の前に使われる）／いくらもならない数の。（十単位の少ない数字を漠然と言う時に使われる）
모금=液体や気体などを口の中に一度含む分量を表す単位（口 / 服）。／寄付金や義援金などを集めること。（主に慈善事業や公共の目的のために行われる。）
모범=手本として学ぶに値する見本や標準（模範）。／（主に「模範になる」の形で使われ）他人の手本となるほど行動や品性が優れていること。
모여들다=方々から一箇所に群れをなして集まる。／(比喩的に) ある場所や対象に関心や力が集中する。
모집=ある目的のために、人や作品、物などを広く呼び集めること（募集）。
목록=ある物や人の名前などを一定の順序で書き留めた名簿。／本や書類などの内容を要約し、探しやすく並べて書き記したもの。／[経済] 財産や商品の詳細な内訳を記した記録。
몰려들다=人や動物、雲、波などが一箇所に群れをなして勢いよく入ってくる（押し寄せる / 集まる）。／ある事柄や現象が一気に押し寄せる（重なる）。
몰려오다=人や動物、雲、波などが一斉に群れをなして激しくやって来る。／ある考えや感情、気配などが一斉に強く現れる。
몸매=人の体の形や姿。主に外に現れる体格のバランスや美しさを指す時に使う。
몸무게=生物の体の重さ。主に人や動物の体重を指す言葉。
몸살=体がひどく疲れて起こる病気。主に手足が痛み、力が入らず、悪寒や発熱などの症状を伴う（疲れによる体調不良）。／あることをしたくてたまらない状態を比喩的に表す言葉。
몸짓=体を動かして表現する様子や態度。または、ある考えや感情を伝えるために手足や頭などを動かす動作。
몸통=人や動物の体で、頭、手足、尾を除いた中心となる部分（胴体 / 胴）。／機械、道具、またはある物体で最も中心となる大きな部分（本体 / 胴体）。／(比喩的に) ある事件や組織の背後にいる核となる勢力や中心人物（黒幕 / 首謀者）。
못되다=性質や品性が正しくなく、悪い。／態度が寛大でなく、非常に意地悪だ。／（事が）思い通りにいかなかったり、状態が良くなかったりする。
묘사=ある対象や物、現象などを言葉や文章で記述したり、絵などで描いて表現すること。／心の中で感じたことを芸術的な手段を借りて具現化すること。
무관심=ある対象に対して関心や興味が全くない状態。
무더위=湿度が高く、気温が非常に高くて蒸し暑い、耐え難い暑さ（蒸し暑さ / 猛暑）。
묵다=旅館、ホテルなど家以外の場所に滞在して夜を過ごす（泊まる）。／(古くなって) 新しさや新鮮な状態がなくなる。／ある状態が長く続く。／物や食べ物が作られてから長い時間が経つ。／ある状態や関係が長く続き、新しさがなくなる。／畑や田んぼなどが耕作されないまま長く放置される。／仕事や問題が解決されず、長く滞る。
묶이다=紐、縄、帯などが結ばれる。（「結ぶ」の被動詞）／人や物体が一定の場所を離れられないように固定されたり制限されたりする。／複数の人が関係や組織によって一つに合わされたり、緊密に連結されたりする。／お金や法令、制度などによって自由な活動や使用が制限される。
문화적=文化に関係したり、文化的な性格を帯びること、またはそのような。／文化に関するもの。または文化的な性格を帯びていること。
물러나다=進んでいた道から後ろへ移動したり、元いた場所から後ろへ下がったりする。／就いていた職位や座から離れる（退く）。／ある事から手を引いたり、関係を断ったりする。／ある状態が収まったり、退いたりする。
물질적=物質に関すること。または、品物や財物に関すること。／物質に関するもの。または、品物や財物に関するもの。／精神的なものと対照的に、形があったり経済的な価値があったりするもの。
미니=大きさや規模が普通のものより非常に小さいことを表す言葉。主に他の名詞の前に付き、「小さな」「短縮された」という意味を添える。
미만=定められた数や程度に満たないこと。また、そのような状態。（主に数量を表す言葉の後に使われ、その数より下であることを意味し、基準となる数値は含まない。）
미움=憎む心や感じ。または、憎む程度。（誰かや何かが嫌いであったり不快で、遠ざけたいと思う感情。）
미워하다=憎いと思う。対象が気に入らなかったり嫌いだったりして、避けたり遠ざけようとしたりする。／（主に子供や恋人の間で）愛嬌混じりの口調で、相手の行動に対する寂しさや不満を表す時に使われることもある。
미인=顔や体つきがとても美しい女性。／(比喩的に) 美しい対象や、士（ソンビ）が忠誠を尽くす王を指す言葉。
미팅=主に大学生や若い男女が、異性との出会いを目的に持つ集まり。／業務上の理由で複数の人が集まり、意見を交わす会議や面談。
미혼=まだ結婚していないこと。または、そのような人（未婚）。
밀리다=順番や期限が後ろに延びる。（処理すべき仕事やお金などが期日通りに行われず溜まる。）／力や勢力に圧倒されて後ろに下がる。／品物などが力によって別の方向に動く。／密度が高かったり人が多かったりして一箇所に集中する。（例：交通渋滞など）／遅れをとったり、残ったりする（たまる / 滞る）。／ある力によって一方へ動かされる（押される）。／順序や位置が後ろに下がる（下がる / 落ちる）。／きちんと処理されずにたまる（滞る / 溜まる）。
밉다=する行動や態度が気に入らず、気分を害したり嫌だったりする。／形や形像が見苦しいほど良くない。／(反語的に) 愛する気持ちが深く、かえって切なかったり寂しかったりする時に使う言葉。
밑바닥=物体や空間の下側になる底。／社会的地位や階級、または生活水準が最も低い状態。／物事の内部深くや心の奥底。／ある事柄の基礎や根拠となる部分。
바가지=夕顔の実(ふくべ)を半分に割って中身を書き出し作った器。水を汲んだり物を入れたりするのに使う。(今日ではプラスチック製のものも一般的に「パガジ」と呼ぶ。)／品物の定価よりはるかに高い値段を払わされること(ぼったくり)。／ひどく叱ったり小言を言ったりすること。
바구니=竹、ハギ、針金、プラスチックなどを編んで、物を入れられるように作った容器。
바닷물=海に蓄えられている水。塩味がし、潮汐現象によって高さが変化する(海水)。
바싹=水分が少しも残らず、完全にかわいた様子。／すぐ近くに寄り付いたり、きつく締めつけたりする様子。／すぐそばに寄って座ったり、歩み寄ったりする様子。／心がひどく焦せったり、縮まったりする様子。／ある行動や状態が非常に激しい様子。
바퀴=車、自動車、自転車などの下に付いていて、転がるように作られた丸い物（車輪 / タイヤ）。／周りを一回りする回数を表す単位（周 / 回）。／円を描いて一回転する回数を表す単位。（依存名詞）／一定の区間や周囲を最初から最後まで一周することを数える単位。（依存名詞）
박=一晩泊まって眠る回数を表す依存名詞。主に旅行や宿泊の期間を表現する時に使われる。
박스=紙、木、プラスチックなどで作られた四角い箱。物を入れたり運んだりするために使用される。
반기다=恋しかった人や嬉しい対象を喜んで迎える。／ある提案や状況、知らせなどを楽しく嬉しい気持ちで受け入れる。
반복하다=同じことを何度も繰り返す。
반성=自分の言動に対して過ちや足りない点がないか振り返ってみること。／自分の心や行動を深く省み、過ちを悔い改めること。
반죽=粉に水や油などを加えて練り合わせた状態、またはそうして作ったもの。／(比喩的に) 性格が穏やかで寛大であり、他人の話をよく受け入れる状態。
반짝이다=光が短い周期で強く出たり消えたりしながら輝く。／瞳が生き生きとして聡明に輝く。／考えやひらめきなどが急に浮かぶ。
받침=物の下に置いて、物を支えたり安定させたりする道具。（例：鍋敷き、コースター）／ある物体を下から支えたり補強したりする役割をする部分。／ハングルの子音が母音の下に付いて発音されるもの。（例：「강」における「ㅇ」）
발걸음=足を一歩ずつ運ぶ動き(歩み / 足運び)。／歩く様子やその音(足取り / 足音)。／ある場所へ行ったり来たりすること(足が向くこと / 訪れ)。／ある物事を進めていく過程や段階(歩み / ステップ)。
발길=前を向いて進んでいく足の動き。またはその方向(足取り / 歩み)。／人々の行き来や訪問。／足で歩いたり蹴ったりする力。
발끝=足のつま先。／(比喩的に) 非常に近い距離、またはごくわずかな差。／足の先を使って立ったり歩いたりする動作を意味する言葉。
발등=足の甲。足の裏の反対側で、足首から下の指の付け根までの部分を指す。／(比喩的意味) 物事が非常に差し迫った状態を表す時に使われる。
발목=足と脚がつながる骨の間接部位。または足首の骨がある細い部分（足首）。／（比喩的）ある事の進行や活動を妨げたり、引き止めたりする要素のこと。
발자국=足で踏んだ跡に残った形（足跡）。／足を一歩踏み出す歩幅、またはその歩数を数える単位（歩 / 足跡）。／足を踏み出す時に出る音（足音）。
밝혀내다=明らかになっていなかった事実、真実、原因などを研究したり調査して見つけ出す(解明する / 突き止める)。／隠されていた秘密や過ちなどをことごとく暴く(露呈させる)。
밤늦다=夜が更ける。時間的に夜のかなり遅い時に至る。
밤새=「밤 사이（夜の間）」の短縮形で、夜が過ぎる間を意味する。／夜が明けるまで眠らずに仕事をしたり、起きている状態を表す。
밤색=熟した栗の外皮のような暗い茶色（栗色）。／(比喩的に) 栗色の髪を持つ人、またはその髪色自体を指す言葉。
밤중=深い夜。（普通、夜中の12時前後を指す。）／夜が更けている間。
밥그릇=ご飯を盛る器（飯碗）。／（比喩的に）生計を維持する手段、または職業上の権限（飯の種）。
밥맛=食べ物を食べる時に口で感じる味。／食べ物を食べたいという欲求。（類義語：食欲、口に合う味）／(比喩的表現) 行動や外見が非常に見苦しかったり、鼻についたりする対象に対する不快な感じ。
밥솥=ご飯を炊くのに使う釜。以前は鋳鉄で作られた大釜（カマソッ）を主に使っていたが、現代では電気を利用して自動でご飯を炊く電気炊飯器や圧力炊飯器が一般的に使われている。
방면=ある中心地や目標に向かう方向（方面）。／ある一つの分野や範囲（分野 / 方面）。
방바닥=部屋の床。通常、床紙（チャンパンジ）などが貼られている場所を指す。
방송사=ラジオやテレビを通じてニュース、ドラマ、娯楽番組などの放送物を制作し、送出する事業体（放送局 / 放送社）。
방울=小さく丸く固まった液体の塊（しずく / 滴）。／中に硬い物が入っており、振ると音が鳴るように作られた金属製の器具（鈴）。／水滴のように小さくて丸い形を表す言葉。／液体が丸く固まった塊。または、それが滴り落ちる一つ一つの粒。／小さくて丸い金属体の中に玉が入っており、振ると音が鳴るように作られた物(鈴)。
방해=他人の仕事を干渉したり妨げたりして、物事が円滑に進まないようにすること。または、そのようなこと（妨害 / 邪魔）。
배꼽=おへそ。お腹の真ん中にあるくぼんだ所。胎児が母体から栄養を供給されていたへその緒が取れてできた痕跡。／（比喩的に）物事の中心、真ん中を指す言葉。／（慣用表現）「へそを掴む（腹を抱える）」のように使われ、大笑いする様子を表す。
배우자=夫婦の一方から見た他方の側。すなわち、夫には妻を、妻には夫を指す言葉（配偶者）。
배치=人や物などを一定の場所に割り当てて置いたり、設置したりすること。／[軍事] 軍隊や武器などを特定の地域や任務に応じて割り当てて定めること。／[行政] 人材を適材適所の部署や職位に任命して配置すること。
뱉다=口の中にある唾や食べ物、または痰などを外へ出す（吐き出す）。／抱いていた考えや言葉を外に出して言う（吐く / 口にする）。／他人のものを横取りしたが、やむを得ず返す（吐き出す）。
버섯=[植物] 菌類の胞子形成のための生殖器官を総称する言葉。普通、傘と柄の形をしており、湿気の多い場所で育つ。食用、薬用として使われることもあるが、毒があるものもある。(キノコ)
버튼=機械を作動させたり設定を変更したりするために、指で押すように作られた装置。（ボタン）／コンピュータの画面などで、マウスでクリックして特定のコマンドを実行するように作られたグラフィック要素。
번개=雲と雲、または雲と地面との間で起こる強力な電気放電現象。非常に明るい光が瞬間的に現れ、通常は雷鳴を伴う(稲妻 / 雷光)。／非常に素早く、速い様子を比喩的にいう言葉。／(俗語) インターネットコミュニティやSNSなどを通じて、事前に約束せず即座に会う集まりを意味する「稲妻オフ会（ボンゲ）」の略語。
번거롭다=することや手続きが複雑で面倒だ。／心身が乱れて苦しい。／辺りが混み合っていて落ち着かない。
번역=ある言語で書かれた文章や言葉を別の言語の文章に移すこと。または原文の意味を別の言語に変えて表現する作業やその結果物。
벌금=規則や法律に違反した際、処罰として支払わせる金銭。国家に納付する刑罰の一種。
벌떡=横になったり座ったりしていた状態から、急に勢いよく起き上がる様子。／後ろに急にひっくり返る様子。／心臓が激しく動悸したり、息が切れて胸が大きく波打つ様子。
벌레=昆虫をはじめ、這って動き回る小さな動物や下等動物を総称する言葉。／ある事に過度に熱中する人を比喩的に表す言葉。（例：勉強の虫、本の虫）／つまらない人や卑しい人を卑しめて呼ぶ言葉。
법적=法律に基づいたり、法律に関係すること。
베개=眠る時や横になる時、頭を支える道具（まくら）。
벤치=主に公園や運動場など屋外に設置された、数人が一緒に座れる長い椅子。／(スポーツ) 競技場の脇で選手やコーチ陣が座って待機する場所。
벨트=ズボンやスカートなどがずり落ちないように腰に巻く紐（ベルト / 腰帯）。／機械装置などで動力を伝達するために車輪に巻き付けて回す帯（ベルト）。／安全のために体を座席に固定する装置（シートベルト）。
벼=イネ目イネ科の一年草。茎は80〜120cmほどに育ち、葉は細長い。先端に穂がついて実（米）を結び、人類の主要な食糧作物の一つである。／まだ外皮（もみ殻）を剥いていない状態のイネの実。
변경=別のものに変えて新しく改めること。主に計画、決定、予定、体制などを変える時に使う。
변명=ある過ちや失敗に対して、その原因や事情を説明して理解を求めること（言い訳 / 弁明）。／物事の理非を判断し、道理を明らかにすること（弁明 / 釈明）。
별명=本名のほかに、特徴や性格に合わせて付けられた名前（あだ名 / ニックネーム）。／ある物事や現象を比喩的に呼ぶ名前。
별일=普段とは違う特別だったり、おかしな出来事。／事故や問題、あるいは心配になるような悪い出来事。
병들다=病気が体に生じる(病気になる / 病む)。／社会や精神状態などが非正常、あるいは堕落した状態になる(病む / 蝕まれる)。／(植物などが)枯れたり状態が悪くなったりする(病む)。
병실=病院で患者が滞在しながら治療を受けられるよう、ベッドなどの設備を備えた部屋（病室）。
보관=物を預かって、大切に管理すること。／（法律）法的手続きに従って押収した物件や書類などを、一定の場所に置いて管理すること。
보너스=定められた給与以外に特別に支給される給与（賞与 / ボーナス）。／ある事に付け加えられ、付随的に生じる利益や楽しみ。
보름=旧暦でその月の15日目（主に正月の大満月の日を指すこともある）。／一か月の半分である約15日間の期間。
보리=イネ目イネ科の一年草または二年草。茎には節があって中空であり、葉は細長い。穂は茎の先に付き、粒は食用やビールの原料などに使われる（麦／大麦）。／「麦」の粒。米と混ぜて飯を炊いたり、粉にしてパンや麺などを作るのに使われる。
보살피다=誠意を尽くして保護したり、面倒を見たりする（世話をする / 面倒を見る）。／状況や事情を細かく察する（気を配る / 目を配る）。
보상=他人に与えた損害を補うこと（補償 / 賠償）。／国や公共団体が適法な行為によって国民に与えた財産上の損失を補うために支払う金銭。／[心理] ある欠陥や劣等感を補うために、他の特性を強調したり発展させたりすること。／努力や苦労に対して、それに見合う対価を受け取ること。／他人にあたえた損害を補ったり、功労に対して一定の対価を提供すること。／国や団体が適法な行為によって個人に与えた財産上の損失を補填すること。／心理学で、自分の欠陥や劣等感を補うために、別の側面の能力を発達させること。
보수=建物や施設などの壊れた箇所を繕ったり直したりすること。／古くなったり傷んだりした部分を手入れして、元の状態に回復させること。／新しいことや変化を積極的に受け入れるより、伝統的な制度や慣習、価値観をそのまま保存し守ろうとすること。／古くなったり壊れたりしたものを手入れして直すこと。／(政治) 現状を維持し、急激な改革より漸進的な改善を好む政治的傾向。／仕事の対価として受け取る金銭や物品（報酬）。／感謝の気持ちに報いること（報恩）。
보안=安全を維持すること。またはそのような状態。社会の安寧と秩序を維持すること。情報の流出、破壊、侵入などを防ぐためにデータやシステムを保護すること(保安 / セキュリティ)。
보전=完全な状態で保護し維持すること。特に自然環境や文化財などを損傷しないよう、そのまま保つことをいう。
보조=足りないところを補って助けること、またはその助け。／主な事柄がうまく進むように助ける役割や機能。／経済的、あるいは物質的な支援を提供すること。
보존=よく保護し、しまっておいて残すこと。物事を元の状態のまま維持すること。生物の種や生態系が絶滅したり破壊されたりしないように維持すること。
복=人生で享受する大きな幸運と睦まじい幸せ。／天から授かった良い運勢。／キリスト教で、神の恵みによって享受する霊的な祝福と世俗的な福を総称する言葉。／人生で享受する大きな幸運と、むつまじい幸福。／儒教や民俗信仰で言われる、運が良いこと。／キリスト教やカトリックなど宗教的観点から、神が人間に授ける恵みや祝福。
복사=書類、絵、写真などを元の姿のまま写したり、機械（コピー機）を利用して同じように作ること（複写 / コピー）。／[コンピュータ] データの内容をそのまま読み取り、別の場所（メモリやファイルなど）に同じように保存すること（コピー）。
복사하다=書類や絵などの原本を機械などを利用して元の姿のまま写し取る（複写する / コピーする）。／（コンピュータ）ファイルやデータの内容を他の場所に同様に記憶させる（コピーする）。
본부=団体や機関の中心となる組織。または、その組織がある場所。／戦時や訓練時に指揮官が滞在し、指揮を執る場所。
본인=ある事柄の当事者、またはその事に直接関係のある人。／話し手が自分自身を指す言葉。（主に公の場や書類などで使われる）／ある事に直接関係があるか、該当するその人自身（本人）。／（代名詞的用法）話し手が自分自身を指す言葉。主に公式な場や文書などで格解を整えて使用する（私 / 本人）。
볼=人の顔で口の両側にある肉の多い部分。「頬（ほお）」より柔らかい感じを与える。／靴や靴下などの底の幅。
볼일=すべきこと。（主に個人的な事情や用務を指す言葉）／大小便をすること。（排泄作用を遠回しに言う言葉）
봉사=国家や社会、または他人のために、自分を顧みず力を尽くして励むこと。／[経済] 商業で、顧客に品物を安く売ったり、特別なサービスを提供したりすること。／[宗教] プロテスタントで、信者が教会内で職務を引き受けて働くこと。
봉지=紙やビニールなどで作られた、物を入れるための小さな袋。／（数量単位）物を袋に入れて、その量を数える単位。
뵈다=「보이다（見える）」の縮約形。目に写る、目に入る。／目上の人に会う（お目にかかる）。（主に「뵙다」の形で使われ、謙譲の意を表す）。／目上の人にお目にかかる。「より(見る)」の尊敬語(お目にかかる / 拝見する)。／(主に「ボイダ(見える)」の短縮形として使われ) 目に見える(見える)。
부끄러움=自らの行為や状態が堂々としておらず、他人に合わせる顔がないと感じる気持ち(恥ずかしさ / 羞恥心)。／内気で人の前に出るのをためらう心(恥ずかしさ / 照れ)。
부딪히다=何かが他のものに強く突き当たること。（主に「부딪다（ぶつける）」の被動形として使われる）／予想外の出来事や状況に直面するようになること。／人と人の間で意見の相違や葛藤が生じること。
부러워하다=他人の良い出来事や状態、または他人が持っている物や才能などが自分にもあることを願う気持ちを持つ（うらやむ / 羨ましがる）。
부러지다=硬い物体が外部の力を受けて折れ、二つになる。／気概や意志などが挫かれる。／(主に「딱」と共に使われ) 言葉や態度などがはっきりしていて断固としている。
부분적=全体の中の一部分にのみ該当したり、関係したりすること。／(冠形詞的用法としても使われ) 全体ではなく一部分に限定された。／全体のうちのある一部分だけに該当したり関係したりすること。
부상=体を傷つけること。または、その傷。
부서=機関、企業、団体などで、任務や編制に応じて分担された部門。または、その部門に属する人々の集団。
부서지다=固い物体が壊れて、バラバラになる。／液体や光などが強くぶつかって、粉々に散る。／希望や計画などが崩れて、駄目になる。／体の節々などがひどく殴られたり、つらい仕事をして激しく痛む。
부지런히=怠けることなく、粘り強く熱心に（勤勉に / せっせと）。
부채=手に持って仰ぎ, 風を起こす道具。一般的に竹の骨に紙や絹を貼って作る。／(比喩的に) ある事をさらにあおったり、けしかけたりする行為。
부친=他人に対して自分の父親を敬って言う語。
북=方位の一つ。羅針盤の針が指す磁北の方向を基準とし、地図の上の方を指す(北)。／「北韓（北朝鮮）」を略していう言葉。朝鮮半島の軍事境界線より北の地域を指す。／方位磁石の針が指す四つの基本方位の一つで、地図の上の方。／北韓（北朝鮮）を指す言葉。
분량=物の長さ、広さ、高さ、重さなどの程度。一定の量や数値。文書、本、演説などの長さや内容の量(分量 / 量)。
불꽃=火が燃える時に起こる熱い気配や光の筋(火花 / 火の粉 / 炎)。／(比喩的に) ある感情や情熱が急に激しく沸き起こること。／(比喩的に) 非常にきらりと光ったり、鋭い気配。
불어오다=風がある方向から吹いてくる。／(比喩的に) ある流行、雰囲気、変化などが現れ始めたり、伝わったりする。
불이익=利益にならないこと。または損をすること。主に権利や恵沢を受けられなかったり、害となる処遇を受ける状況を指す。
불평=気に入らなくて不満に思うこと。または、そのような気持ちを言葉や態度で表すこと（不平 / 文句）。／体の一部が痛かったり苦しかったりする状態。
불행=幸せでないこと。または、そのような状態。／運が悪いこと。または、心が痛み苦しい出来事。
붐비다=多くの人や車などが一箇所に集まり、非常に混雑している。
붙들다=人や物を手でぎゅっとつかむ。／去ろうとする人を引き止めたり、留まらせたりする。／ある事柄や対象に心や注意を集中させる。／人を捕らえて閉じ込めたり拘束したりする (捕まえる)。
붙잡히다=人や動物などが誰かによって手でぎゅっと掴まれる。／逃げられないように捕まえられたり、公権力などによって捕獲されたりする。（主に犯人、泥棒など）／ある事や人に縛られて、思い通りに動けなくなる。
비닐봉지=ビニールで作られた袋。物を入れたり保管したりするのに使う(ビニール袋)。
비만=太っていて体が肥えていること。または、体内に脂肪が正常な水準よりも多く蓄積されている状態（肥満）。
비명=驚いたり怖かったりする時、または痛かったり辛かったりする時に口から飛び出す鋭く大きな声（悲鳴）。／非常に苦しかったり悲惨な状況に置かれて泣き叫ぶ声。
비바람=雨と風を合わせた言葉。または、雨を伴う激しい風(雨風 / 風雨)。
비비다=二つの物体を互いにあててこする。／手で目や顔などをこする。／ご飯や材料などを均等に混ぜ合わせる。／困難な状況で粘り強く耐えたり、体当たりで過ごしたりする。
비상=思いがけない緊急事態が起こること。または、そのような状態。／平凡でなく、非常に優れていること。／例外的で一般的ではない状況。
비서=要職にある人に直属し、書類作成や日程管理、連絡業務などの事務を司る人。またはその職。／機密に属する重要な文書や書籍。
비웃다=ある人やその行動を馬鹿にして、意地悪い感じで笑う。／他人の意見や境遇を軽んじ、皮肉るような態度で笑う。
비키다=いた場所から横に移動して、道や席を譲る。／ぶつかったり鉢合わせしたりしないように、体や物をそっと動かす。／していた仕事や就いていたポストから退く。
비타민=動物の生理機能を調節するのに不可欠な有機化合物。体内で合成されないか、十分に作られないため、食物を通じて摂取しなければならず、不足すると特有の欠乏症が現れることがある。／（比喩的表現）生活に活力を与えたり、力になったりする存在や要素を指す言葉。
비판적=現象や物事の正誤を判断するさま（批判的）。／ある対象の誤りや欠点を指摘して否定的に評価するさま（批判的）。／現象や物事の正誤を見極めて判断すること。／ある事物の欠点や誤りを指摘し、否定的に論じること。
비행=空中を飛ぶこと。または、そのような移動。／航空機や宇宙船などを操縦して空を飛ぶこと。／[専門用語] 夜間飛行：夜間に行う飛行。／間違った行い。主に道徳的、法律的な基準から外れた悪い行いを意味する。特に、青少年にが社会規範に反する行動を犯すこと。(非行)
비행장=飛行機が離着陸し、駐機できるように設備を整えた広い場所。「空港」より包括的な意味で使われたり、軍用や簡易施設を意味したりすることもある。
빗물=空から降ってくる雨の水(雨水)。／雨が降ってたまったり流れたりする水(雨水)。
빗방울=雨となって滴り落ちる水玉（雨だれ / 雨粒）。
빚=人から借りて返さなければならないお金（借金）。／人から受けた恩恵や助け、または当然果たすべき義務を比喩的に言う言葉（恩義 / 負い目）。
빠뜨리다=水の中に落としたり、沈めたりする。（「빠지다（落ちる・浸かる）」の使役形）／ある深い穴や悪い状態、状況に陥らせる。／物をどこかに置いてきたり、失くしたりする。／順番や項目などで、誤って漏らしたり除外したりする。
빼놓다=あるべき場所に入れずに漏らす（抜かす / 書き漏らす）。／多くのものの中からあるものを除外する（除く / 除外する）。／別に取っておく（取り置いておく）。
빼앗기다=自分の物や権利、地位などを他人に無理やり出させられる。（「奪う」の受動詞）／時間、機会、視線、心などを他人に引きつけられたり、失ったりするようになる。／（一部の名詞と共に使われ）身体の一部や命を失うようになる。
빼앗다=他人の持っているものを無理やり自分のものにする（奪う / 取り上げる）。／他人の権利、資格、地位などを強制的に失わせる（剥奪する）。／他人の考えや心を一箇所に引きつける（魅了する / 虜にする）。／時間や機会などを失わせたり、占めたりする（奪う）。
뺏다=他人のものを無理やり自分のものにする。（「빼앗다」の短縮形）／他人の権利や資格などを強制的に失わせる。／他人の考えや心を惹きつける（奪う）。
뿌리치다=つかんだ手や物などを力強く振って振りほどく。／相手の提案、要求、好意などをきっぱりと断る（拒絶する）。／追いかけてくる人や障害物などを力を尽くして振り切る。
사과하다=自分の過ちを認め、許しを請う（謝罪する / お詫びする）。
사기=人を騙して錯誤に陥らせる欺瞞行為。主に財物や経済的利益を得るために他人を欺くことをいう(詐欺)。／意欲や自信などに満ち溢れ、くじけることのないたくましい気勢。主に軍隊やチーム、組織社会で何かを成し遂げようとする意志や勢いを指す(士気)。
사나이=元気でたくましい男（男、漢）。／（主に目下の人や格式を問わない関係で）「男」を指す言葉。
사냥=人が山や野に出て、鉄砲・弓・槍・網などで獣や鳥を捕らえること（狩り / ハンティング）。／猛獣が他の動物を食べるために追いかけたり捕まえたりする行為（狩り）。／（比喩的に）ある目的を達成するために人や物などを探しに出ること。
사들이다=品物や権利、土地などを買い取って自分のものにしたり、中に運び入れたりする。
사랑스럽다=姿や行動が愛らしさを感じるほど可愛い。
사망=人が死ぬこと。（死亡の知らせや行政上の手続きなどで主に使われる。）
사모님=先生の奥様を敬って呼ぶ言葉。／他人同士の間で, 中年以上の女性を敬って待遇して呼ぶ言葉。／目上の人の奥様を敬って呼ぶ言葉。
사무=職場で担当して処理する書類作成、記録、管理などの実務的な仕事。／機構の運営や行政的な手続きを執行する仕事。
사무소=事務を執り行う場所(事務所)。／国家機関や公共団体に属し、特定の事務を処理する機関。
사무직=企画、人事、会計、総務など、主に事務室の中で書類を扱ったり行政的な業務に従事する職種。または、そのような職種に従事する人（事務職）。
사상=歴史上（歴史の記録に現れていることに基づくこと）。
사소하다=取るに足りないほど小さかったり少なかったりする。重要ではなく、大したことではない(些細だ / わずかだ)。
사업가=経済的利益を目的として、企業や業者を専門的に運営し経営する人（実業家 / 起業家）。／ある事を計画して主導し、成果を収める人。
사업자=営利を目的として事業を経営する人、またはその主体。／経済活動を継続的に遂行するために、税務署に事業者登録を済ませた個人または法人。
사위=娘の夫(婿)。／(比喩的に)ある仕事を専任させたり任せたりするのに信頼できる人を比喩的にいう語。
사이좋다=仲が良く、互いに親しみ合っている。 (人間関係が円満で睦まじいことを意味する。)
사촌=親の兄弟や姉妹の子供。自分を基準に四親等にあたる親戚のこと(いとこ)。／(比喩的に) 非常に近くて親しい関係をいう言葉。
사춘기=肉体的、精神的に大人になっていく時期。性ホルモンの分泌が増加して二次性徴が現れ、情緒的に不安定で批判的・反抗的な傾向を帯びるようになる(思春期)。
사투리=ある地方だけで使われる、標準語ではない言葉（方言）。／話し方やイントネーションから感じられる、その地域特有の雰囲気。
사표=職場や務めている職責を辞めるという意思を記して提出する文書（辞表）。
사회생활=人間が社会の一員として共同生活を営んでいくこと。／主に学校教育を終えた後、職場などの共同体に所属して活動する経済および人間関係の活動を指す言葉。
사회자=会議、儀式、討論、公演などで、行事の進行を引き受けてリードしていく人（司会者）。
산속=山の内部。または、生い茂った木や岩などに囲まれた山の奥深い場所(山の中)。
살아나다=死ぬところだったが、一命を取り留める。／消えかかっていた火種や弱まっていた活気などが再び勢いづく。／沈滞していた雰囲気や経済、記憶などが再び活発になったり鮮明になったりする。／物の形や色などがはっきりと際立つようになる。
삼키다=食べ物などを口の中から喉を通して胃へ流し込む。／他人の物や財物を不当に自分のものにする。／表に出さず、心の中で抑えたり我慢したりする。／ある対象が別の対象を完全に覆ったり吸収したりする。
상관=二つ以上の対象が互いに関係を持つこと。または、その関係。／他人の事に関与したり、口を出したりすること。／（主に「関係ない」の形で使われ）対象がどうであれ、問題にならなかったり重要でなかったりすること。
상관없다=二つの対象や事実の間に何ら関係がない。／ある事柄や条件が問題にならなかったり、害にならなかったりする。
상관없이=ある対象や状況が他に影響を与えなかったり、それと関係がない状態で。／前の内容が後ろの事実に条件や制約にならないことを表す言葉。
상금=優れた成績を収めたり、功労があったりした人に褒美として与える金銭（賞金）。
상대편=立ち向かったり、比較の対象になったりする側。または、その側に属する人(相手 / 相手方)。／ある事柄や対象に対して向かい合っている側。
상류=川や流れの筋で、その源となる上の方の部分(上流)。／身分、財産、地位などが社会の高い階層に属すること。または、そのような階層(上流)。
상반기=一年を二つに分けた時の前の半年。通常1月から6月までの期間を指す。／ある一定の期間を二つに分けた時の前の期間。
상점=品物を売る店。商売をする家。
상쾌하다=感じが爽やかで清々しい。／心や気分が爽快で軽やかだ。
새기다=文字、絵、模様などを硬い物体の表面に彫る。／心の中に深く記憶して留めておく。／刺青（タトゥー）を体に描いたり入れたりする。／他国の言葉や難しい文章を分かりやすく解釈する（訳す）。
새로이=以前になかったことが初めて。／以前の状態や関係を捨てて、新しくやり直して。／既存のものとは異なり、新しい方式で。
새우=十脚目の甲殻類の総称。体は左右に平たく曲がっており、殻が硬く、泳いだり底を這ったりして移動する。世界中に広く分布し、食用として人気が高い(エビ)。
새우다=寝ずに夜を明かす。主に「夜を（밤을）」を目的語に取って使われる。
색다르다=普通の物とは違う特別な味や趣がある。／一般的なものと区別される独特な特色がある.
생기=生き生きとして力強い気運。活発で健康な気運が溢れる状態(生気 / 活気)。
생방송=放送局で番組を録画や録音せず、現場で起きている状況をリアルタイムで送り出し放映すること。または、その放送（生放送 / ライブ放送）。
생활환경=人間や生物が日常的に生きていく中で接する周辺のあらゆる条件や状態。自然的な条件だけでなく、社会的、経済的、文化的な条件を総称していう(生活環境)。
서늘하다=気温や物体の温度が心地よく、わずかに冷たい感じがある。（主に暑さが和らぎ涼しくなった時や、快適な状態を指す）／恐怖や驚きによって、背筋や胸の奥が急に冷たくなったように感じる。／態度が冷たく、厳しい。
서명=本人の名前を直接書いて本人であることを証明すること。または、その名前。／ある文書の内容に同意したり賛成したりするという意味で自分の名前を書き入れること。
서양인=西洋（欧米など）の国籍を持っていたり、その地域の系統の人種に属する人。東洋人に対する言葉。
서적=文字や絵を印刷して綴じたもの。「本」を丁寧にいう語。
서투르다=ある物事に慣れておらず、手際が悪くて下手だ（不慣れだ / 下手だ）。／言葉や行動が上手でなく、ぎこちない（ぎこちない / おぼつかない）。／物事や現象に対する知識や経験が足りない（疎い / 未熟だ）。
선전=主義や主張、物の存在や効能などを多くの人に広く知らせること。（広告、広報など）／根拠のない事実を広めて人々の判断に影響を与えること。
선진=発展の段階や水準が先行していること。または、そのような国家や社会。／ある分野で他人より先に進むこと。
설문=ある問題について問うこと。または、その問い。／統計調査や研究などのために、多くの人に特定のテーマに関する意見や実態を問うこと。
설사=仮にそうなるとしても、という意を表す副詞。普通、後には「～であっても」、「～だとしても」のような譲歩の表現が続く。／[医学] 腸の運動が速まったり、腸での水分吸収が十分に行われなかったりして、水分の多い便を出すこと。または、その便(下痢)。／[比喩] ある事柄や現象が、収拾がつかないほど次々とあふれ出ることを比喩的にいう語。
성공적=目的としたことを成し遂げたり、良い結果を得たりする状態にあるさま。／目的としたことを成し遂げたり、やりがいのある結果を得たりする状態にあること。
성별=男性と女性、または雄と雌の区別（性別）。
성인=成長して大人になった人。通常、法的に満19歳以上の男女を指す。（提示された意味：成長した成人女性）。
세련되다=言葉遣いや行動、姿などが不自然だったり野暮ったかったりせず、品があって現代的だ。／文章や芸術作品などの表現が磨かれ、滑らかで優れている。
세미나=特定のテーマに関心のある人々が集まり、発表や討論を行う研究集会や講習会。／大学などの教育機関で、指導教授の指導のもと、学生たちが共同で研究し討論する授業方式。
세제=衣類や食器、体などに付いた汚染物質を取り除くために使用する化学物質。物の汚れを洗い流したり拭き取ったりするのに使う物質で、石鹸や合成洗剤などを総称する言葉だ。
세트=複数の物が一つにまとめられ、一揃いになったもの（セット）。／映画や演劇、放送などで特定の場面を撮影するために作られた装置や場所（セット）。／テニスやバレーボールなどの競技で、試合全体を分ける単位（セット）。
소규모=制度や施設、行事などの規模が小さいこと。または、そのような規模。
소극적=自ら進んで行わず、他人に言われるがままにしたり、意気込みや勢いが衰えたりしている様子。／対象を積極的に変えようとせず、現状を維持しようとしたり、後ろに引いたりする様子。／自ら進んで状況を改善しようとする意志が足りず、気が進まないまま行動すること。／対象に対して肯定的であったり情熱的ではなく、現状を維持したり後ずさりしようとする態度を見せること。
소나기=急に激しく降り出し、すぐに止む雨（にわか雨 / 夕立）。／(比喩的に) 急に激しく起きて、すぐに収まる現象や事件。
소망=あることを願うこと。または、願って望むこと（望み / 願望）。
소매=上着の二つの腕を通す部分（袖）。／（比喩的に）事の糸口や、ある対象の端の部分。
소문나다=ある事実や噂が広く知れ渡る。または、ある特性や実力を備えていると世間に名が知られる。
소설가=小説を専門的に書く人。または、そのような職業に従事する人(小説家)。
소수=少ない数。（主に「～に過ぎない」と共に使われ、数量がいくらもいかないことを表す。）
소용=あることに使うこと。または、そのような用途や使い道。／（主に「～しても無駄だ」、「～は意味がない」などの形で使われ）何のかいも利益もないこと。
소용없다=何の足しにも利益にもならない。使うべき所に使い道がない（無駄だ / 役に立たない）。
소원=望み願うこと。または、その内容。
소중히=非常に貴重で、大切に。／真心を込めて大切に扱う様子。
소지품=持っている物。主に身につけていたり、手に持っていたりする物を指す。
소형=同種のものの中で、規模や大きさが小さいもの(小型)。／(主に「小型自動車」の略語として使われ) 排気量が少なくサイズの小さい車。
소화=摂取した食物を分解して、養分を吸収しやすい状態にすること。／学んだ知識や情報を十分に理解し、自分のものにすること。／与えられた業務や分量を責任を持ってこなすこと。／持っている商品や物資を市場で売って処分すること。
속상하다=仕事が思い通りにいかなかったり、気に入らなかったりして、心が痛み、苦しい。
속이다=他人をだまして、事実でないことを事実であるかのように信じ込ませる。／(主に「目」や「心」などを目的語にして) 自分の良心や本来の考えを隠したり否定したりする。／ある価値や品質、数量を実際より良く、あるいは多く偽って飾る。
손길=助けたり世話をしたりすること。または、そのような心や力(助けの手 / 差し伸べる手)。／何かを掴んだり触れたりする手の動き(手つき)。／ある事柄や現象が及ぼす影響や範囲(手)。
손등=手のひらの反対側にあたる手の表面(手の甲)。
손목=手首の下の部分で、手と腕がつながる細いくびれた部位。一般的に時計をしたりブレスレットをつけたりする場所だ。
손발=手と足を合わせていう語(手足)。／気が合って一緒に働く人を比喩的にいう語(右腕 / 息の合う仲)。
손뼉=手のひらの内側の面。／喜び、賛成、歓迎などを表したり、音を出したりするために両手のひらを打ち合わせる行為（拍手）。
손쉽다=物事を行うのが難しくなく、非常にたやすい。／力を入れずに、たやすく扱うことができる。
손잡이=器具や機械、ドアなどを手で持って操作できるように作られた部分。または、手が握れるように作られたものの一部(取っ手 / 持ち手 / ハンドル)。
손질=物をより見栄え良くしたり、使いやすくしたりするために整えること。／(比喩的に) 物事を完璧に仕上げるために、補足したり手直ししたりすること。／髪をカットしたり整えたりして形を作ること。
손톱=指先の背側に付いている硬くて薄い角質の層。指先を保護し、力を入れやすくする役割を果たす（爪）。
송아지=雌牛の子（子牛）。
송이=花や実などがひとかたまりになっているもの。／(依存名詞) 花や雪、キノコなどを数える単位。
쇠=鉄鉱石から抽出された硬い灰白色の鉱物質。人類が道具、武器、建築材料などで広く使用する金属を総称する(鉄 / 鋼)。／物を掛ける装置である「錠(物錠)」や、それを開ける「鍵」を総称する言葉。／牛の肉や脂などを略して言う言葉。（主に「牛肉（セゴギ）」、「牛脂（セギルム）」などの形で使われる）
쇼=見世物や娯楽を目的に人々に見せる演芸や演出（ショー）。／うわべだけをもっともらしく飾った行動や偽装された姿。
수고하다=仕事をしたり物事を行ったりするのに骨を折り、苦労する。主に相手の努力に対して慰めたり感謝したりする気持ちを表す時に使う。
수년=三、四年あるいは五、六年ほどになる数年。
수도꼭지=水道水を出したり止めたりするように調節する装置（蛇口）。
수돗물=水道施設を通じて供給される水。浄水場で綺麗にろ過され、管を通って各家庭や施設に届けられる(水道水)。
수동적=自ら動かず、他人の力によって動くこと。／自分の意志で事を進めるより、他人に言われるままにしたり、状況に流されて行動する性質を持っていること。／自ら動かず、他人の操縦や命令に従って動く。／自分の意志や主観がなく、状況に引きずられている姿勢や状態にある。
수만=万(まん)の数倍になる数の。（主に「数万ウォン」、「数万人」のように数量を表す名詞の前に使われ、その数が非常に多いことを表す。）／万の数倍になる数（数詞）。／（冠形詞として使われ）万の数倍になる数の。
수면=眠ること。普通、脳の活動が休み、意識が不鮮明になる状態をいう。
수명=人や生物が生きている期間(寿命)。／物や機械などが使用可能、または有効な期間(寿命 / 耐用年数)。
수백=百の数倍になる数。／（慣用的に）数が非常に多いことを表す言葉。／百の数倍になる数の。（数量がおよそ百単位で複数ある状態を表す冠形詞）
수시로=一定の時がなく、いつでもたびたび。（ある事柄が決まった規則なく頻繁に起こることを表す。）
수없이=数えきれないほど非常に多く。
수염=人の口の周りやあご、ほほに生える毛（ひげ）。／動物の口の周りに生えた長い毛（ひげ）。／麦などの粒の先に付いている細い毛（のぎ）。
수입품=外国から国内に買い入れてきた物品。（反対語：輸出品）
수입하다=他国から物品、技術、資源などを買い入れる（輸入する）。／外国の思想、文化、制度などを受け入れる（取り入れる）。
수집=趣味や研究、または特定の目的のために物や材料などを探し集めること。
수천=一千の数倍になる数（数千）。／（数量を表す言葉の前に使われ）数が非常に多いことを表す言葉（数千の）。／(冠形詞) 千の数倍になる数の。「数千名」「数千冊」のように使われ、数量が非常に多いことを表す。
수출하다=国内の商品や技術を外国に売って送り出す(輸出する)。／国内の文化、思想、制度などを外国に伝えたり紹介したりする。
수학=数量および空間の性質について研究する学問。算術、代数学、幾何学、解析学などが含まれる。／学問を修め、学ぶこと。／学校に通って勉強すること。
숙소=泊まるところ。または、そのような施設(宿 / 宿泊所)。
순간적=ごく短い時間の間に行われること。／ある感じや現象が持続せず、刹那に消えること。／ごく短い時間の間だけに起こるさま。または、そのようなもの。／刹那の瞬間に感じたり発生したりするさま。
순식간=目をごく短い時間まばたきしたり、息を一度ついたりするほどのごく短い間。
순위=ある基準に従って順々に決められた位置や序列。
순진하다=心が飾り気がなく真実で、お人よしだ。／世の中の事情に疎く、うぶだ。
술병=酒を入れる瓶（酒瓶）。／お酒を飲みすぎて生じた病気（二日酔いや体調不良）。
술자리=お酒を飲む場。または、お酒を飲む集まり。／お酒をもてなす場。
술잔=お酒を注いで飲むのに使う器（酒杯 / お猪口）。
스위치=電気回路を繋いだり遮단したりして、電灯や家電製品などをつけたり消したりする装置。／ある状態や態度を急に変えることを比喩的にいう言葉。
스튜디오=映画の撮影、ラジオ放送、レコードの録音などのために、特別な装置や設備を備えた部屋。／写真家が写真を撮るために用意した作業室。／芸術家たちが作品活動をするために使用する個人の作業空間。
슬쩍=人に見られないように素早く行動する様子（こっそり / さっと）。／力を入れずに軽く行動する様子（さらっと / 軽く）。／本心を隠して、それとなく、あるいは密かに行動する様子（さりげなく / 密かに）。／物事をいい加減にしたり、おざなりに済ませたりする様子（適当に / うやむやに）。
습기=湿り気があってじめじめした感じ（湿気）。／空気中に含まれている水蒸気（湿気）。
승객=船、飛行機、自動車、列車などの乗り物に乗る人。（運転士や乗務員を除いた人数を指す言葉）
승진=職位や等級が下から上へ上がること。主に職場や組織内で、より高い職務に就くことを意味する。
시금치=ヒユ科に属する一年草または二年草。高さは50センチほどで、葉は三角形である。根は赤く、葉は食用として広く使われる。／1の葉をゆでて調味料であえたナムルのおかず。
시도=あることを成し遂げるために計画したり、実際にやってみること(試み / 試図)。
시들다=(植物が) 生気がなくなり、葉や花が枯れて垂れ下がる。／(勢いや情熱などが) 以前より衰えたり、弱くなったりする。／(肌や顔が) つやがなくなり、やつれる。
시디=情報をデジタル信号として記録し、音声やデータなどを再生できるようにした円盤状の記憶媒体。「コンパクトディスク(CD)」を韓国語（ハングル）で表記した言葉。
시멘트=石灰石や粘土などを混ぜて焼いて作った粉末で, 水を混ぜると練り固まった状態になり, 時間が経つと石のように硬くなる建設資材。主に土목や建築工事でレンガを接着したりコンクリートを作ったりするのに使われる。
시야=目で見える範囲(視野)。／物事に対する見識や考えの広さ（比喩的な意味）。
시일=時間と月日を合わせていう語。あるいは、ある事をするのにかかる時間の長さや日数のこと。
시집=夫の家。または夫の家族が住む家。夫の家族や親戚をまとめて呼ぶ言葉。／複数の詩を一つにまとめて編んだ本（詩集）。
시집가다=女性が婚姻して夫の家に入る。または、結婚して家庭を築く。／（比喩的に）ある物が定位置を見つけたり、本来あるべき場所へ移されたりする。
시청률=ラジオやテレビ放送の番組をどれだけの人が視聴または聴取しているかを示す割合（視聴率）。
시합=運動や競技などで互いの技術や能力を競い、勝負を決めること（試合）。
식기=食べ物を盛る器。飯碗、汁椀、皿などの総称。
식욕=食物を食べたいと思う欲求（食欲）。
신기하다=信じられないほど非常に新しく、奇妙だ。／品物や超自然的な現象のように神秘的で妙だ。／新しくて奇妙だ。（信じられないほど一風変わっていたり、驚くべきだ。）／物事の展開が驚くほどうまく合致したり、妙だ。
신념=強く信じている心。または、その信じている内容。／ある思想や命題、考えなどを真実だと考え、疑わない心理的状態。
신문사=新聞を発行する会社や機関（新聞社）。
신문지=新聞を印刷する紙(新聞紙)。／すでに発行され、読み終わった後の新聞紙。物を包んだり湿気を取り除いたりするなど、日常生活の多様な用途で使われる。
신비=人の知恵では理解できないほど奥深く不思議なこと。または、宇宙や自然の秩序、あるいは宗教的現象などから感じられる驚異的で秘密めいた性質。
신사=品格が高く、礼儀正しくて教養のある男性。／男性を敬って呼ぶ言葉。（主に「淑女」と共に使われる）
신세=主に不幸であったり、哀れな境遇に置かれた人の様子や状態（身の上 / 境遇）。／他人に助けてもらったり、迷惑をかけたりすること（恩義 / 借りを負うこと）。
신세대=既成世代に比べて新しい考え方や感覚を持っている世代。／以前とは異なる新しい文化や価値観を享受し、社会の変化を主導する若年層。
신입생=学校に新しく入学したばかりの学生。
신제품=新しく作られた物品や製品（新製品）。
신청서=ある事柄を要請したり、願う内容を記して関係機関や団体に提出する書類（申込書 / 申請書）。
신혼부부=結婚して間もない夫と妻（新婚夫婦）。／（比喩的に）結婚を控えており、間もなく夫婦になる予定の男女。
실=裁縫をしたり布を織ったりするのに使う、細くて長い紐状の材料（糸）。／比喩的に、ある物事や現象が細くつながっている状態を指す言葉。
실감=実際にその状況や状態にいるような感じ。／外部の刺激や物事を現実のように生々しく感じる感覚（実感）。
실망=期待していた通りにならず、希望を失ったり心が痛んだりすること。
실은=表面に現れた現象や外見とは異なり、実際の事情や状態を表す時に使う言葉。「実は（サシルン）」の縮約形。
실장=各部署や機関、企業などで「室」の業務を総括し、責任を負う職位、またはその職位にある人。通常、部長と理事（役員）の間の役職として扱われることが多い。／病院、デザインセンター、企画室など、特定の専門部署の運営を管理する責任者。
실컷=心ゆくまで、存分に。／決められた限度や数値に達するほど十分に。
심리적=心の状態や現象に関連すること。／心理学の原理や理論に基づいたこと。／心の状態や現象に関係すること。（心理的な変化や精神的な作用に関連する性質を表す。）
심부름=他人から頼まれた用件や頼みを受けて、別の場所へ行って代わりにしてあげること（お使い）。／（比喩的に）ある目的や意図を伝えるために代わりに行うこと。
심판=裁判所が法律に基づき下す判決や決定（裁判 / 審판）。／神が人間の善悪を裁き、罰や福を与えること（裁き）。／スポーツの試合などで規則違反の有無や勝敗を決定すること。またはその役割を務める人（審判）。／大衆や歴史の流れによって是非が正されたり評価を受けたりすること（裁き / 審判）。
심해지다=状態や程度が以前より増したり、ひどくなったりする。（形容詞「シマダ（激しい）」に「-オジダ（〜くなる）」が付き、状態の変化を表す。）
싱싱하다=野菜、果物、魚などがしおれたり傷んだりせず、生き生きとしている。／人の姿や元気が活気に満ちていて、健やかだ。／ある記憶や考えなどが薄れず、はっきりしている。
싸구려=値段が非常に安い品物。または、そのような品物を売ること。／品質が低かったり粗末で価値が落ちる品物を俗っぽくいう言葉。
싼값=物の価値や普通の価格より安い価格（安値 / 格安）。
쌍=二つで一つを成すもの。（主に身体部位や物の対を指す時に使う）／一緒に行動したり関係を結んでいる二人。（夫婦や恋人など）／[依存名詞] 数量を表す際、二つを一単位として数える言葉。
쌍둥이=一人の母親から一度に生まれた二人の子供（双子）。／形が非常によく似ている二つの物や人を比喩的にいう言葉。
썩=水準や程度がはるかに優れているさま。（主に「上手だ」、「良い」などの形容詞や動詞の前で使われ、状態が非常に良いことを表す。）／期限や機会がはるか過ぎて。／迷わず一気に。
썰렁하다=気温が低く、体に鳥肌が立つほど冷え冷えとしている。／雰囲気や状況に温かみがなく、冷ややかでぎこちない。／冗談や話がつまらなくて、場を白けさせる。／広い空間に人が少なく、がらんとした感じがする。
쓰다듬다=手のひらでそっとさする、なでる。／（比喩的に）相手の心を慰めたり、なだめたりする。
쓸다=ほうきや手のひらなどで床にあるほこりやゴミを一つにまとめたり、取り除いたりする。／手や物体である表面を軽くこすりながら通り過ぎる（なでる）。／一度にさらっていったり、独占したりする。
쓸데없다=何の役にも立たない。または、何の利益もない。／甲斐がない。または、実質的な内容がない。／適切でない。または、不要である。
쓸쓸하다=孤独で物足りなく、悲しい感じがある。／周囲の雰囲気や状況が静まり返っていて物足りない。／天気や風などが冷たくてうそ寒い。
씌우다=頭に載せたり被せたりするようにする。（「쓰다（被る）」の使役動詞）／物の形の上や外側を覆って包むようにする。／罪、責任、不名誉などを負わせたり転嫁したりする。／眼鏡などを顔にかけさせる。
씨름=二人の人が相手のサッパ（まわし）を掴んで技術と力を競い、先に地面に倒した方が勝ちとなる韓国固有の民俗遊びであり、スポーツ競技（シルム / 韓国相撲）。／（比喩的に）ある難しい仕事や問題を解決するために、根気強く取り組み、力を尽くすこと。
씨앗=穀物や野菜、花などの植物から芽を出す根本となる粒（種子）。／（比喩的に）ある事柄や現象が生じる根源や原因。
씩씩하다=態度や気勢が堂々としていて活気に満ちている。／体が健康で力に溢れている。／困難を前にしても屈することなく強い。
아깝다=ある物や対象に価値があり、捨てたり使ってしまったりするのが惜しい。／人の才能や命などが失われるのが非常に悲しく、残念だ。／努力や時間を費やした割に結果が良くなく、虚脱感を覚えたり残念に思ったりする。
아뇨=相手の問いや期待、要請などに対して否定して答える時に使う言葉。「아니요(アニヨ)」の縮約形。
아니야=相手の問いや推測、または提案に対して否定したり同意しなかったりする時に使う言葉。／申し訳なさを表す相手に、その必要がないことを示して慰めたり安心させたりする時に使う言葉。／事実ではないことを確認したり訂正したりする時に使う言葉。
아랫사람=年齢や家系、職位、階級などが自分より下の人。または社会的地位や身分が自分より下の人(目下の人 / 部下)。
아무개=名前を直接明らかにしないか、名前を知らない時、ある人を指す代名詞。／(主に「아무개 씨(アムゲさん)」の形で使われ) 名前の代わりに使用され、具体的ではない対象を指す言葉。
아쉬움=未練が残って心残りな感じ（名残惜しさ）。／必要なものがなかったり足りなかったりして、切なくてやるせない気持ち（物足りなさ）。
아아=喜び、悲しみ、驚き、感動などの感情がこみ上げてきた時に出す声。／思いもよらなかったことを急に悟った時に出す声。／誰かを切実に呼んだり、何かを確認するために声を整える時に出す声。／ある事実を肯定したり納得したりする時に出す声。
아하=思いもよらなかったことを急に悟った時に出す声（あ、なるほど）。／相手の言葉に対して肯定したり、理解したりした時に出す声（ああ、そうか）。
악몽=恐ろしくて苦しい夢（悪夢）。／（比喩的に）忘れたいほど凄惨で苦しい記憶や状態。
악수=挨拶、感謝、和解、祝辞などを表すために、二人がそれぞれ右手を差し出して握り合うこと。／(比喩的に) 二つの陣営や人物が志を同じくして協力し合うことにしたことを指す言葉。
안기다=(「抱く」の受動詞) 両腕の中に抱かれる。／(ある義務や責任、損害などが) 他人によって任されたり負わされたりする。／(風や匂い、光などが) 懐や胸の方に押し寄せてくる。／「抱く」の使役形：他の人に腕の中に抱かせたり、ある物を懐に持たせたりする。／「抱く」の被動形：他の人の腕の中に入り、体が包まれる。／（比喩的に）ある責任や義務、損害などを他人に預けたり負わせたりする。
안내하다=ある場所に行ったり事情をよく知らない人に、その場所へ連れて行ってあげたり状況を説明してあげること（案内する）。／ある事柄や現象を理解するように導いたり、情報を提供したりすること（案内する / 手引する）。
안부=ある人が安らかに元気に過ごしているかについての知らせ、または状態。
안주=酒を飲む時に添えて食べる食べ物（おつまみ / 酒の肴）。
안팎=内と外を合わせた言葉（内外 / 表裏）。／（数量や数値の後に使われ）その数値より少し多いか少ない程度（〜前後 / 〜くらい）。／心の中と表に現れる姿（本音と建前 / 裏表）。
앉히다=人や動物をどこかに座らせる。（「앉다（座る）」の使役形）／ある職位や職務に就かせる。／物を一定の場所に置いたり設置したりする。／（料理などを）火にかけて調理し始める。
알아내다=知らない事実や情報、方法などを研究したり探したりして知るようになる。／隠された秘密や過ちなどを暴いて明らかにする。
알아주다=他人の事情や状況、心の価値などを理解し、認めてあげる。／ある対象の価値や能力を高く評価したり、認めたりする。
암=生体組織の内部で細胞が無制限に増殖して悪性腫瘍を引き起こす病気。周囲の組織に浸潤したり、他の臓器に転移したりして生命を脅かす(癌)。／(比喩的意味) 社会や団体の中で有害で致命的な悪影響を及ぼす要素や存在。
앞길=目の前に見える道。／これから生きていく道や将来を比喩的に言う言葉。
앞날=これからやってくる日。将来の時間や日々を意味する。／将来の状況や運命。主に個人や団体の未来を比喩的に表す言葉。
앞뒤=前の方と後ろの方を合わせた方向や位置。／物事の順序や順番。／物事の原因と結果、または前後の事情。／(比喩的に) 考えや行動が一貫していたり、道理にかなっている程度。
앞바다=陸地や島のすぐ前に広がる海。
액세서리=服の着こなしを引き立てるために、体に付けたり身に着けたりする装飾品。イヤリング、ネックレス、指輪、ブレスレットなどを指す。／機械や装置の機能を補完したり、使い勝手を良くするために付随的に付け加える物品。
야간=日が暮れて暗くなってから、翌日の日の出までの間。夜の時間帯。／(主に名詞の前で使われ) 夜間に行われたり、夜間に運営されたりするもの。
야단=非常に騒がしく、慌ただしく騒ぎ立てること（大騒ぎ / 大立ち回り）。／（主に「叱られる」「叱る」の形で使われ）過ちを叱責したり、叱られたりすること（お叱り / 説教）。／状況が大きくこじれたり、非常に困ったことになった状態（大変な事態 / 困ったこと）。
야외=城や町の外にある野原。／屋根や壁などで遮られていない、広々とした屋外の空間。
약점=足りなくて他人より劣っていたり, 人のあざけりを受けるような点（弱み / 短所）。／物事や品物において, 機能が不十分だったり、不備がある点（弱点 / 欠陥）。／他人に知られないように隠したい恥ずかしい点や過ち（弱み / 傷）。
양보하다=他人のために自分の利益や権利、順番などを譲ったり辞退したりする。／自分の意見を曲げて、他人の意見に従う。／道や通路を他人が先に通れるように空ける。
양심=物の価値を判断し、自分の行為に対して善悪や正誤の判断を下す道徳的な意識。／心に咎めを感じない、正直で正しい心。
어기다=命令、規則、約束、法律などを守らずに背く。／期限や時刻などを過ぎる。
어느덧=いつの間にか、早くも。（ある状態や状況が思ったより早く進んだことを表す。）
어때=形容詞「어떠하다（いかがだ・どうだ）」の短縮形で、状態、様子、性質などがどうであるか尋ねる時に使う。／相手に意見を聞いたり、提案をしたりする時に使う言葉。
어리석다=賢くなく、頭が鈍い。／状況判断が鈍かったり、言動が矛盾していたりして間違いが多い。
어린애=年齢の低い子供。「어린아이（子供）」の短縮形。／行動や考えが分別がなく、幼い人を比喩的にいう言葉。
어린이날=子供が正しく賢く、たくましく育つことができるよう、子供に対する愛と保護の精神を高めるために定められた日。大韓民国の法定公休日で、毎年5月5日である。（こどもの日）
어지럽다=周囲の物が回っているようで、気が遠くなり、体が支えにくい。／頭の中が混乱して、見当がつかない。／物や環境が秩序なく混ざり合っていたり、複雑だ。／世の中や社会が騒がしく、乱れている。
어쩐지=なぜか。なんとなく。はっきりした理由もなく。／(主に「-더라니」と共に使われ) 思った通り、案の定。やはり。
어찌나=後ろに来る言葉を強調し、程度が非常に甚だしいことを表す副詞。通常、後ろに「-ㄴ지」、「-ㄴ가」、「-게」などと一緒に使われ、原因や理由を表す。
어찌하다=どうにかしたり、ある態度を取ったりする。（主に「どうすることもできない」「どうにもできない」の形で使われ、前の状況や状態に対して方策がないことを表す。）／（疑問文で）理由や都合がどうであるか。
언덕=地面が周囲より高く盛り上がった場所。山より低くなだらかな地形をいう(丘 / 坂)。／頼れる対象や状況を比喩的にいう言葉。
얻어먹다=他人に乞い願って食べ物をもらったり食べたりする。／自分の費用をかけず、他人がご馳走してくれる食べ物を食べる。／(比喩的に) 他人から殴られたり、悪口を言われたりする。
엄숙하다=雰囲気や態度が礼儀正しく、重々しくて威厳がある。／むやみに扱えないほど、非常に大切で偉大だ。
업다=人や荷物などを背中に乗せる(負う / おんぶする)。／ある勢力や背景を土台にする(後ろ盾にする)。／(比喩的に) ある有利な条件や状況を利用する。
엉망=秩序や体系がなく、ひどく乱れた状態。／物事や状況がうまくいかず、台無しになった状態。／物や体などが汚れたり傷んだりして、見栄えが悪くなった状態。
엉터리=いい加減で理屈に合わない言葉や行動。または、そのようなことをする人。／中身がなく、お粗末だったり偽物だったりする物や状態。
엎드리다=腹を床につけて体を下に曲げたり、低く伏せたりする。／降伏したり、敬意を表したりするために体を低くして床につける。／(比喩的に) ある気配や勢力の前に屈服したり、姿を消したりする。
엔=(依存名詞) 日本の貨幣単位。記号は「¥」で表記する。
여=人の性別のうち、子供を産むことができる性を持つ人を指す言葉（女 / 女性）。／性別を区分する際、女性であることを示す接頭辞的な表現。
여가=仕事がなく余った時間。または、仕事の合間にしばらく休む時間。社会的義務や生存のための必須活動から離れ、自由に利用できる自分だけの時間。
여간=(主に「-지 않다（〜ではない）」、「-이 아니다（〜ではない）」などの否定語と共に使われ) 状態や程度が普通ではないことを表す言葉。「非常に」、「とても」の意味を強調する。／(否定語なしで使われる時) いくらかの程度や量。
여관=旅行客を宿泊させ、宿泊料を受け取る施設。ホテルよりは規模が小さく、施設が素朴な場合が多い(旅館)。
여대생=女子大学生の略語。大学に通う女子学生をいう言葉。
여럿=数や分量が少なくない状態や人。または、そのような群れ。
여름철=夏が続いている間の時期。または、夏の天気や状態。
여우=イヌ科の哺乳類。口先が尖っていて尾が長く、毛は赤みを帯びている。性質が非常に賢く狡猾で、説話や寓話の素材としてよく登場する(キツネ)。／(比喩的に) 表向きは愛想が良かったり従順な振りをしながら、裏では自分の利益をしっかり確保したり、知恵が回る人を指す言葉。
여쭈다=目上の人に挨拶をしたり、安否を伺う。／目上の人に、ある事柄について申し上げたり尋ねたりする（「묻다（尋ねる）」の尊敬語）。
역사상=歴史の流れの上や、歴史の記録に現れている範囲内。（韓国史を含め、過ぎ去った過去の記録上という意味で使われる。）
연간=一年間。一年の期間。
연관=二つ以上の人、物、現象などが互いに関係を結ぶこと。またはその関係(関連)。
연구실=学問や技術などを専門的に調査し、研究するために設けられた部屋（研究室）。／大学で教授が学問に精進したり、学生を指導したりするために使用する部屋。
연구원=ある分野について専門的に調査・研究する人（研究員）。／研究所や大学の研究機関などで働く職務や身分を持つ人。／ある分野の事柄を専門的に調査・研究する人。／研究所や学術団体などに所属し、研究業務を担当する職責、またはその職にある人。
연락하다=ある事実や知らせを伝えたり、互いに情報をやり取りしたりする。／ある物事や現象が互いにつながって通じる。
연령=人が世の中に生まれて生きてきた年数。（類義語：年、歳、年齢）。／ある生物や事物が存在してきた期間。
연설=大勢の前で自分の主張や見解を論理的に述べること（演説）。
연애=男女が互いに恋い慕い、愛し合うこと。／性的な魅力に惹かれ、互いに好きになる関係を結ぶこと。
연인=互いに愛し合う関係にある二人。または、愛を分かち合う相手（恋人）。
연장=時間、距離、長さなどを本来よりも長く延ばすこと。／ある物事の状態や現象が継続して続くこと。／[経済/労働] 定められた勤務時間以外に追加で仕事をすること(延長勤務)。
연주=楽器を奏でて曲を聴かせること(演奏)。
연하다=材質や物体が柔らかい：噛んだり触ったりするのに硬くなく、柔らかい。特に肉や野菜が噛むのに適しているほど柔らかい状態を指す。／色や味、香りなどが濃くない：濃度が低い、または色が薄い。／性質や態度が強くない：人の性格や態度が素直で柔らかい。
열기=熱い気運、または熱い空気(熱気)。／ある事に熱中したり興奮したりして高まった雰囲気や気運(熱気)。
열매=植物が花を咲かせた後に結ぶ、種が入っている部分。／(比喩的に) ある仕事の結果や結実。
열정=ある事に心と力を尽くして没두する熱い気概（情熱）。／ある対象や人に向かう、強烈で愛情に満ちた心。
염려하다=将来のことについて、苦しい気持ちで心配したり案じたりする。
엿보다=人に見られないようにこっそり、またはそっと見る(のぞき見る)。／機会や時期などを注意深くうかがい、探す(うかがう)。／表れた現象を通じて、本心や本質、未来の可能性などを推し量って知る(うかがい知る)。
영웅=知恵と才能に優れ、勇猛で、普通の人が成し遂げられないことをやり遂げる人。または、戦争や国家的な危機において功績を立て、大衆から崇められる人(英雄)。
영향력=ある物事や現象、人の行動や思考が、他の人や物事に変化を起こしたり作用を及ぼしたりする力。
예감=何かが起こる前にあらかじめ感じられる感覚。（主に）これから良くないことが起こりそうな不吉な予感。
예보=これから起こることをあらかじめ知らせること。またはその報道。主に気象状態の変化を事前に知らせることを意味する。
예비=万が一の事態に備えてあらかじめ用意すること。または、その用意(予備)。／物事を本格的に始める前の準備段階。
예선=本選に進む人やチームを選ぶためにあらかじめ行われる試験や試合（予選）。／（選挙などで）本選挙に出馬する候補をあらかじめ選ぶ手続き（予備選）。
예의=尊敬の意を表すために礼をもって示す言葉遣いや身だしなみ（礼儀）。／人が社会生活を営む上で守るべき道徳的基準や秩序。
오락=楽しみや面白さを感じるために行う様々な活動。（ゲーム、スポーツ、映画鑑賞など）／他人を楽しませるための演芸やショーなどの見世物。
오래도록=長い時間が経つまで。または、非常に長い間。
오로지=他のことは差し置いて、ただ一つのことにだけ集中するさま（ひたすら / もっぱら）。／ただそれだけであることを強調していう言葉（ただ / のみ）。
오르내리다=高いところに上がったり、低いところに下りたりする（上り下りする）。／物価、気温、成績などの数値や値が上がったり下がったりする。／人々の口に頻繁にのぼったり、話の種になったりする。／感情や考えが心の中で繰り返し現れる。
오른발=人や動物の体の右側にある足。
오리=カモ科の鳥の総称。体は平たく足は短く, 指の間に水かきがあって泳ぎが得意である。くちばしは広くて平たく, 家禽として飼われたり野生種も多い。
오페라=音楽を中心とした総合舞台芸術。独唱、重唱、合唱などの声楽と管弦楽演奏を基に、舞台装置、衣装、舞踊などが調和した演劇を指す。
옥수수=イネ科の一年草。またはその実。葉は長く先が垂れ下がり、実は細長い円柱形で粒がぎっしりと詰まっている。食用や家畜の飼料、工業用の原料として使われる。
온라인=コンピュータネットワークを通じて、データがリアルタイムでやり取りされている状態。／情報通信ネットワークを利用して行われる活動やサービス。
올라서다=低い場所から高い場所、あるいは装置の上へと足を踏み出しながら登る。／ある地位や水準、あるいは隊列に加わったり到達したりする。／舞台や壇上の上へと場所を移して立つ。
올려다보다=下から上の方に向かって見る。／地位や境遇などが自分より優れている人を、尊敬の念を持って仰ぎ見る。／(比喩的に) ある目標や基準を高く設定して見つめる。
옷차림=服を着た様子や身なり。
외갓집=母の実家。（母の両親や兄弟たちが住んでいる家を指す言葉）
외교관=国家を代表して外国に駐在し、自国の利益を保護し、当該国との友好関係を維持しながら交渉業務を遂行する公務員（外交官）。
외로움=一人になったり、頼るところがなくて寂しい感じや心の状態（孤独感 / 寂しさ）。
외모=人の外見。主に顔や体つき、服装などをひっくるめていう。
외삼촌=母親の男兄弟を指す言葉（母方の叔父）。
외할머니=母の母を指す言葉（外祖母 / おばあさん）。
왼발=人や動物の左足。／（比喩的に）物事を行う際、下手だったり慣れていなかったりする状態を指す言葉。
요=(冠形詞) 話し手に近いか、話し手が考えている対象を指す言葉。「이(この)」をもう少し口語的に強調して言う表現。／(冠形詞) 時間的に現在と非常に近い時を指す言葉。／(冠形詞) (俗っぽい、または可愛らしく言う言葉で) 目の前にある対象を指す時に使う言葉。／寝る時に床に敷いて体を支える寝具。（普通、綿を入れて作る。）
요새=1. 「ヨサイ（この間）」が縮まった言葉で、今から少し前までの近い過去を指す言葉。／2. 今現在を含めた、ごく近い時期を指す言葉（最近 / 近頃）。
욕실=体を洗ったり入浴したりできるように設備を整えた部屋(浴室 / お風呂場)。
용=想像上の動物で、体は蛇に似て鱗があり、角と爪を持つ霊妙な存在。雨や雲を司り、権威と瑞兆を象徴する(龍)。／王を象徴する言葉。／非常に優れた人物を比喩的にいう言葉。
용감하다=勇気があり、たくましく、恐れを知らない。主に危険や困難を前にしても屈しない態度を意味する。
용도=使われる場所、または使われる範囲。品物や資材などがある目的のために使用される状況や機能。
용서=犯した罪や過ちに対して、咎めたり罰したりせずに包み隠してやること（許し / 容赦）。／不当な、あるいは無礼な行動を寛大に受け入れること。
우수하다=多くのものの中で、優れた状態にある。実力、品質、成績などが基準よりはるかに高い、または良い。
우습다=笑いが出るほど面白い。／取るに足りない、または軽んじるに値する。／言動や状態がふさわしくなく、見ていて呆れる。
우아하다=高상하고気品があり美しい。主に姿、行動、雰囲気などの格調が高い時に使われる（優雅だ / 上品だ）。
우울하다=心配事があったり息苦しかったりして、心が晴れず沈んでいる。／天気や雰囲気などが暗くてどんよりしている Japan.／(心理学) 気分が晴れず活動が鈍り、悲しい状態にある。
우정=友だちの間の情愛。または、友だちの間の厚い情愛（友情）。
우편=手紙、書類、物品などを一定の体系に従って送り届ける制度、またはその対象物。郵便局を通じて便りを伝えたり品物を伝達すること(郵便)。
운전기사=自動車や列車などの乗り物を専門的に運転することを職業とする人（運転手）。
운전자=車や機械、飛行機などを動かして操る人（運転手 / 運転者）。
운행=決められた路線に沿って自動車、列車、船などが通ること。また、そのように走らせること。／宇宙の天体が軌道に沿って回ること。
울음소리=人や動物が悲しみや痛み、あるいは感情が込み上げて出す声。または獣や虫が鳴く特有の音（鳴き声）。
웃음소리=笑う時に口から出る音（笑い声）。
원서=入学、就職、免許試験などを申し込むために提出する書類。／ある事を切に願う内容を記して、官公庁や機関に出す文書。
원숭이=霊長目のうち類人猿を除いた動物の総称。顔は人に似ており、尾があって知能が高く、道具を使ったり社会生活を営んだりすることもある(サル)。／(比喩的に) 真似が上手な人や、芸達者な人を指す言葉。
월드컵=国際サッカー連盟(FIFA)が主催し、4年ごとに開催される世界サッカー選手権大会。／各競技種目別に世界最高の選手を決めるために開催される国際競技大会。
웨이터=ホテルやレストランなどの飲食店で、客の注文を取ったり料理を運んだりするサービスを提供する男性従業員。
웬만하다=程度や状況が標準に近いか、それより少し良い。／性格や態度が寛大で、気難しくない。／（否定語と共に使われ）かなりの程度に達する。
위로=温かい言葉や行動で苦しみを和らげたり、悲しみを慰めたりすること。
위험성=害や破滅が生じる恐れのある状態や性質（危険性）。
유리창=窓枠にガラスをはめ込んだ窓。内外が透けて見えるようにしながら、風や寒さを防ぐ役割をする。
유머=他人を笑わせたり楽しませたりする言葉や行動。滑稽、諧謔などと訳されることもあり、状況を機転を利かせて切り抜けたり、雰囲気を和らげたりする能力を意味する。
유산=亡くなった人が残した財産。／前世代の人が後世に残した土台や業績、または価値のある物事。／[医学] 妊娠中の胎児が生存可能な時期以前に母体外に出ること。
유적=先代の人類が後世に残した残滓。建物、墓、塔のように移動できない歴史的な跡を指す。／過去の事件や人物が残した跡。
유적지=遺跡が残っている場所。過去の歴史や文化的価値のある建物、古墳、遺物などが発見された場所を意味する。
유행하다=新しい様式や現象、思想などが社会に広く普及すること（流行する）。／伝染病などが広く蔓延すること（流行する / はやる）。
유형=性質や特徴などが共通なもの同士でまとめられた一つの型、または手本（タイプ / 類型）。／[心理] 人間の性格や身体的特徴などを一定の基準に従って分類した範疇（タイプ）。
육군=主に地上で戦闘を遂行するように組織され、訓練された軍隊（陸軍）。
육체적=体や体の機能に関係すること。（精神的なことと対比される概念。）／体や体の機能に関わること。精神的なものと対比される体の状態や作用を意味する。
으응=相手の呼びかけに答えたり、肯定の意を表したりする時に出す声。「うん（응）」より少し柔らかかったり、ためらったりする感じを与える。／ある事実を新しく悟ったり知ったりした時に出す声。／鼻歌を歌ったり、あくびをしながら体を伸ばしたりする時に出す声。／子供が甘えたり、だだをこねたりする時に出す声(ぐずる声)。
은=金属元素の一つ。光沢のある白い金属で、電気や熱をよく伝え、延性と展性に優れているため、装飾品や貨幣の材料として広く使われる。／金と対比される概念で、宝石やメダルの等級において二番目を意味することもある。
음력=月の満ち欠けの周期を基準に作った暦。太陽暦と対比される（太陰暦・旧暦）。
음식물=人が食べたり飲んだりすることができるすべての物資の総称。すなわち、食べ物と飲み物を合わせた言葉。／人が食べたり飲んだりするものの総称(飲食物 / 食べ物)。
음주=酒を飲むこと。また、飲酒運転を比喩的にいう言葉。
의류=衣類の種類を総称する言葉。着るものをひっくるめて言う。
의심=確信が持てず、信じられない気持ち。／あることが事実ではないかもしれないと思ったり、良くないことが起こるだろうと推측したりすること。／(法律) 犯罪の容疑があると思うこと。
이것저것=特に決まっていない、あれこれの物事（あれこれ / これこれ）。
이대로=状態や形が変わらず、今あるそのままの形や状態のように。
이런저런=状態、形、性質などが、あぁだったりこうだったりする様子。「このような」と「あのような」が合わさった言葉で、様々な種類の属性をひっくるめて指す(あれこれの / いろいろな)。
이력서=学歴、経歴、資格など、自分の経歴を記した文書（履歴書）。
이롭다=助けや利益になる点がある。特に健康、環境、状況などに肯定的な影響を与える状態を意味する。
이리저리=あちらこちらへ。／この方面あの方面へ、または、ああだこうだ。
이별=互いに離れ離れになること。主に恋人や家族など、親密な関係にある人同士が別れること。
이빨=「歯」を低めて言う言葉。／主に動物の歯を指す言葉。／のこぎり、くし、車輪などの刃や、山脈の尖った部分を比喩的に言う言葉。
이사하다=住んでいた場所を離れて、別の場所へ移る（引っ越す）。
이상적=考えうる限り最も完全で、望ましい状態にあること。／現実的な限界を脱し、最上の目標や価値を追求すること。／考えうる最も完全な状態にあるさま。／ある物事や現象が望ましく、満足できる状態にあるさま。
이용자=ある対象や施設、システムなどを必要に応じて使う人（利用者）。／特にコンピュータネットワークやインターネットサービスなどを定期的に利用する人。
이웃집=隣にある家（隣家 / お隣）。／近くに住む人の家を親しみを持って呼ぶ言葉。
이자=他人からお金を借りて使った代価として支払う一定の割合のお金（利子）。／預金や積立金などの金融商品にお金を預けたことに対して、金融機関が支払う報奨金（利息）。
이제야=話している今この時点になってようやく（ようやく / やっと）。／期待したり待っていたことが、遅まきながら実現したことを表す言葉。／以前の状況や事実を、今になってようやく悟ったり知ったりした時に使う言葉.
이해관계=互いに利益と損害が関わっている関係（利害関係）。／ある事柄や事件に対して利害を共にする人々 の間の関係。
이혼=夫婦が合意または裁判によって婚姻関係を法的に断つこと(離婚)。／結んでいた関係を完全に断ったり別れたりすることを比喩的にいう言葉。
익숙해지다=不慣れではない状態になる。あることを繰り返して上手になる（慣れる / 熟練する）。／ある対象をよく見たり経験したりして、不慣れではない状態になる（見慣れる / 慣れる）。
인간관계=人と人の間に結ばれる関係。または、それらの間の相互作用や絆（人間関係）。
인간성=人間としてのあり方や性質（人間性）。／人間が本来持っている特性。
인간적=人間らしい態度や品格があるさま。人の情や感情がこもっているさま。機械的・事務的ではなく、人間味が感じられるさま。／人間らしい味わいや性質があること。／人間の資格や権利に関する。
인공=人の力で何かをしたり作り出したりすること。（自然にできたものに対比される概念）／人の力や技術で自然現象を模倣したり変形させたりすること。
인상적=ある対象が心や記憶に残るほど、뚜렷하고 강렬한印象を与えるさま（主に後ろに来る名詞を修飾する連体詞として使われる）。／心や記憶に残るほど強い印象を与えること、またはその様子。
인쇄=文字や絵などを版に刻んでインクを塗り、紙や布などに刷り出すこと（印刷）。／コンピューターや機器の中のデジタル情報をプリンターなどの出力装置を通じて紙に写す作業（プリント）。
인원=団体や組織を構成する人の数（人員 / 人数）。／ある事に動員されたり参加したりする人の数（人員）。
인재=学識や能力に優れ、将来大きな仕事を成し遂げるにふさわしい人。または、ある分野で優れた能力を備え、その役割を立派に果たす人(人材)。
인터뷰=特定の目的を持って個人や集団に会い、対話を通じて情報を収集したり意見を聞いたりすること。／新聞や放送メディアなどで記事作成のために特定の人物と対談すること、またはその内容を記録した記事。／採用や入学などを目的として、志願者の資質を確認するために面接を行うこと。
인하=物価や家賃、利率などを下げること(引き下げ / 値下げ)。
일대=ある一定の地域全体。／ある対象や現象が及ぶ範囲全体。／非常に大きい、またははなはだしい。／ある時期や状況において、極めて重大で画期的な。
일등=等級や順位を付けたとき、最も高い第一の等級。／ある分野や実力において、最も優れた水準や人。
일상적=毎日繰り返される普通の時のようであること。／特別なことがなく、日々いつも起きる性質を持っていること。／毎日繰り返される普通の時のようであること（日常的）。／常に存在していて特別ではなく、平凡な性格を帯びていること（日常的）。
일생=生まれてから死ぬまでの間。（類義語：一生、生涯）
일손=仕事をするときの人の手。／仕事をする人。または、その人の力や労働力。
일시적=短い時間の間だけ維持されたり存在すること。または、状態や現象が長続きせず、しばらくの間だけ現れること。／一時的に起こる性質のもの。持続的ではなく、短い時間の間だけ維持される状態を表す。
일쑤=よくあること。(主に「-기가 일쑤이다」または「-기(가) 일쑤다」の形で使われ、否定的または望ましくない現象が頻繁に起こることを表す。)／よくそうなる状態。主に「-기(가) 일쑤이다」の形で使われ、否定的な状況や良くない状況が頻繁に繰り返されることを表す。
일일이=一つ一つすべて。／あれこれ詳しく。または、煩わしいほど詳細に。
일자리=生計を維持するために一定の報酬をもらってする仕事。または、その機会や地位(職 / 仕事口)。
일체=[名詞] すべてのもの。(主に「일체를」の形で使われ) 全部や全体を意味する。／[副詞] (主に禁止や否定の意味を表す言葉とともに使われ) 全く、一切、決して。／副詞：(主に否定を表す言葉と共に使われ)「全く」「少しも」「一切」の意味で、ある事を固く禁じたり、全くしないことを表す時に使う。
일치=二つ以上の対象が互いに食い違わず、同じであるか一つになること。／考え、主張、意見などが互いに同じであること。／計算や数値などが互いに合致すること。
일회용=一度だけ使って捨てるように作られたもの(使い捨て)。／(比喩的に)ある目的のために一時的にだけ使われて終わってしまうこと。
임무=任せられた責任や職務。ある目的を果たすために個人や集団が担当し、遂行すべき事柄（任務）。
입대=軍隊という組織に入ること。（反対語：除隊）
입력=コンピュータや装置などにデータや情報を入れること。／外部からエネルギーや信号がシステム内に入ってくること。／(比喩的に) ある事実や知識を記憶の中に刻み込むこと。
입맛=食べ物を食べる時に舌で感じる味に対する感覚。／食べ物を食べたいと思う欲求（食欲）。／ある物事や状況に対して感じる気分や好み。
입사=会社の社員となり、勤務を始めること(入社)。／会社の社員になり、会社に入ること。または会社に入るために受ける試験や手続き。
입원하다=病気を治すために、一定期間病院に入って留まること（入院する）。
입학하다=学生として勉強するために学校に入ること（入学する）。
입히다=人や動物に服を着せたり、身にまとわせたりする。（「着る」の使役動詞）／物体の表面に色、金属、膜などを塗ったり被せたりする。／（比喩的に）他人に損害や恩恵、傷などを負わせる。
자가용=個人が私的に使用するために所有している自動車（自家用車）。／官公庁や会社のような団体が所有せず、個人が所有して使用する物。
자격증=一定の資格を備えていることを証明する文書・証書（資格証明書）。
자꾸만=(副詞) 何度も繰り返して絶え間なく。／(副詞) 状態や行動が持続的に深まったり、うるさいほど続く様子。
자라나다=人や動物、植物などが生長して、その大きさが大きくなったり背が伸びたりする。／実力や勢い、思想などが大きくなったり発展したりする。／ある環境や状態の中で成長しながら時間を過ごす。
자매=女子の間の兄弟関係。姉と妹を合わせていう語（姉妹）。／（比喩的）同じ目的を持っていたり、密接な関係を結んでいる組織や団体（姉妹）。
자부심=自分自身や自分に関連することに対して、自ら価値や能力を信じて堂々とする気持ち（自負心 / プライド）。
자살=自ら自分の命を絶つこと(自殺)。
자세하다=内容や状態などが非常に詳細で徹底している。／外見や動作などが非常に几帳面で隙がない。
자신감=あることを自分の能力で十分にやり遂げられると信じる心（自信）。
자연히=無理に力を入れなくても自ずと。または、ある現象が道理や理屈に従って当然に。
자취=自炊すること。主に学校や職場の近くで部屋を借りて一人で暮らすことをいう。／1. 物が残した印や跡。 2. ある人が過去に住んでいたり留まっていた跡。 3. (主に「姿を消す」の形で) 対象の姿や消息。 4. 家を離れ、自分で炊事をして生活すること。
작성=書類や原稿などを作ること(作成)。
작아지다=物体の体積、大きさ、規模などが以前より縮小する。／音や力、勢力などが弱まったり低くなったりする.／態度や心が萎縮し、堂々とできなくなる。
잔디밭=芝生が敷かれている広い土地（芝生 / 芝生広場）。
잘나다=1. 外見が人より際立って美しい、または格好いい。／2. 才能、学識、地位などが人より優れている、または卓越している。／3. （反語的に）偉そうに振る舞い、非常に傲慢だ。
잘리다=物体が切られたり、斬られたりする。（「切る」の受動詞）／職場で解雇されたり、罷免されたりする。（俗語的な表現）／数量や定員などが制限され、除外される。
잘살다=経済的にゆとりがあり、豊かな状態で暮らす。／やりがいがあって楽しく暮らす。／(反語的に) 行動や状態が良くない。
잠그다=扉や蓋などが開かないように鍵をかけたり、かんぬきをかけたりする。／水やガスなどが出ないように、バルブや取っ手を回して止める。／服のボタンをかける。
잠자리=トンボ目に属する昆虫を総称する言葉。細長い体と二対の透明な網目状の羽を持ち、頭には大きな複眼がある。主に水辺や草むらで飛行し、他の小さな昆虫を捕らえて食べる。／眠るために横になっている場所、または眠ること。／夫婦が関係を結ぶことを遠回しに言う言葉。
잡아당기다=手や道具などで物をつかみ、自分の方へ強く引き寄せる（引く / 引っ張る）。／人や物の心や関心を強く惹きつける（惹きつける / 魅료する）。／予定された時間や期日を繰り上げる（早める / 繰り上げる）。
잡아먹다=動物や魚などを捕まえて食べる。／(比喩的に) ある対象が別の対象を圧倒したり、完全に占めたりする。／時間、お金、資源などを無駄に使ったり、多く消耗したりする。
장가=男が妻を迎えて結婚すること。／(比喩的に)男が結婚して家庭を築くこと全般を指す言葉。
장기간=ある一定の基準よりずっと長い期間。（ある状態や現象が長く続く時間的範囲を意味する。）
장기적=あることが長い期間にわたって行われること。／遠い将来を見通して立てる計画や目標に関すること。／ある事柄や現象が長い期間にわたって行われること。または、そのような性質のもの(長期的)。
장난=主に子供たちが楽しむためにする身振りや言葉、またはそのような事。相手を困らせたりだましたりする目的でする行い。または実質的な目的がなく、暇つぶしでする事。
장남=複数の息子の中で最初に生まれた息子（長男）。
장수=物を買って売ることを業とする人。（主に売る物の名前の後ろに付いて使われる。）／寿命が長く、長生きすること。／軍隊を率いて指揮する首領（将軍）。
장애인=身体の一部や精神機能に制約があり、日常生活や社会生活を送る上で長期にわたって不自由を感じる人。
장학금=勉強を奨励するために学生に補助するお金（奨学金）。
재능=あることをするのに必要な才能と能力。個人が持つ天賦の素質や、訓練を通じて得た能力を指す。
재다=物の長さや重さ、広さ、体積などを道具を使って数値で測定する（測る / 計る / 量る）。／前後の状況や利益などを細かく問い詰め、見極める（推し量る / 勘定する）。／偉そうに威張ったり、格好をつけたりする（気取る / 鼻にかける）。／銃や砲などに火薬や弾丸を詰め込む（装填する）。／肉などに調味料を入れて味が染み込むようにしたり、几帳面に積み重ねて置いたりする（漬け込む / 寝かせる）。
재빨리=動きや行動が非常に素早く、敏捷に。／ある状況や場所から、気づかれないほど素早く逃げ出したり、その場を離れたりする様子。
재생=生き返ること。死ぬ間際から再び息を吹き返すことを意味する。／古くなったり使えなくなったりした物を加工して再利用すること。資源を節約し環境を保護するために廃棄物を再び使用すること。／記録された音声や映像を再び聞こえるように、または見えるようにすること。テープ、CD、デジタルファイルなどに保存された情報を出力装置を通じて具現すること。／堕落したり荒んだりした生活を捨てて、新しい人生を始めること。
재주=何かをうまくこなすことができる、生まれつきの能力や技量。／物事を計画したり解決したりするための知恵や手段。
재학=学生の身分で学校に所属して勉強していること（在学）。
재활용=廃品や使い古した物を手入れして再び使用すること（再利用 / リサイクル）。／ゴミの中から資源として再利用できるものを選び出し、加工したり処理したりすること。
재활용품=再利用できるように加工したり処理したりできる品物。または、一度使用された後に再利用するために回収された品物（リサイクル品）。
쟤=「あの子」が縮まった言葉。話し手と聞き手から離れている人を低めて言ったり、親しみを込めて指したりする代名詞。
저러다=「あのようにする（저렇게 하다）」の縮約形。話し手や聞き手から離れている対象の行動や状態がどのようであるかを指す時に使う。／先に言及された行動や状態を指して言う時に使う。
저리=「あそこへ」の短縮形。話し手や聞き手から遠く離れている場所に向かう方向を表す。／「あのように」の短縮形。状態、模様、性質などがあのような状態であることを表す。
저마다=(名詞) 各々が別々に。または人々がそれぞれに。／(副詞) 各々が別々に。（主に文章の中で副詞的に使われる）／めいめいが、それぞれに。（副詞）／それぞれ異なった姿や特性を持っている様子。（副詞）
저자=本や論文などを書いた人。(類義語：書き手、筆者)
저축=節約して金銭や財物などを蓄えておくこと（貯蓄）。／金融機関にお金を預けること。または、そのお金（預金）。
적성=ある物事にふさわしい性質や適응能力。または、その事柄に対する学習能力や発展の可能性（適性）。
적응=ある状態や条件に合わせて変化したり、慣れたりすること（適応）。／[生物] 生物が周囲の環境に適合するように、体の形態や機能が変化する現象。
적히다=「적다（書く）」の受身形。線、文字、数字などが紙や平らな表面の上に書かれたり、記録されたりする。
전국적=全国的な規模であったり、全国にわたるもの。／全国家的な範囲にわたること。または、そのようなもの／こと。(名詞 / 冠形詞)
전기밥솥=電気をエネルギー源として使い、自動でご飯が炊けるように作った釜（電気炊飯器）。
전달=品物や品物などを目的の場所へ移し送ったり、渡したりすること。／考え、感情、知識、知らせなどを他人に知らせたり伝えたりすること。／エネルギーや刺激などが他の場所へ移って広まること。
전문적=ある特定の分野の知識や技術に基づいているさま。または、特定の分野において深い知識や経験を持っているさま（専門的）。／ある特定の分野に対する深い知識や技術に基づいていること。または、ある一つの分野だけに限定されたもの。
전문직=専門的な知識や技術が必要な職業。または、そのような職種に従事する人。
전설=古くから民間で見伝えられてきた話。通常、具体的な場所や事物、人物と結びついており、証拠物がある場合が多い(伝説)。／ある分野で非常に優れた、あるいは驚くべき業績を残し、代々人々の口にのぼる人や物を比喩的に言う言葉(伝説)。
전세=不動産の所有者に一定金額のお金（保証金）を預け、その不動産を一定期間借りて使う制度。またはそのお金。契約期間が終わると預けたお金は返還される（伝貰、チョンセ）。／車や船、飛行機などの乗り物を丸ごと借りること（貸し切り）。
전시=多くの人に見せるために物を並べること。または、特定の目的のために作品や商品などを陳列し、大衆が観覧できるようにすること。
전시장=芸術作品、製品、遺物など、様々な物を陳列して人々に披露する場所（展示場 / ギャラリー）。
전시회=芸術作品、遺物、製品、または特定の資料を一定の場所に並べて人々に披露する集まりや行事（展示会 / 展覧会）。
전용=特定の人数や機関、または特定の目的のためにのみ使用すること。／自分一人だけで独占的に使用すること。
전후=前と後ろ：空間的に前の方と後ろの方を合わせた言葉。／先と後：時間的に前の時と後の時を合わせた言葉。／前後の事情：ある出来事が起きた原因と結果、あるいはその出来事が進んでいる具体的な状況や様子。
절망=望める希望が完全に断たれること。または、そのような状態。
절약=むやみに使わず、大切に使うこと（お金、物、エネルギーなどを惜しんで使う行為）。／時間や労力を減らして、効率的に使用すること。
절약하다=物やエネルギー、時間、お金などを惜しんで使うこと（節約する）。
젊음=若くて元気が旺盛な状態。または、そのような時期（若さ / 青春）。／姿や雰囲気が活気に満ち、生き生きとしている状態。
점검=一つ一つ検査すること。または、そのような検査。／(機械や装置などの) 状態が正常であるかを確認するために、細かく調べること。
점원=商店で品物を売る仕事に従事する人（店員）。
점잖다=言動や態度が威厳に満ちていて、慎重だ。／品性が高潔で、品格がある。／（反語的に）表向きは上品ぶっているが、実際はそうではない。
정기적=一定の時間の間隔を置いて繰り返される状態や性質。／一定の間隔をおいて繰り返されるさま(定期的)。
정답=問いに対して正しく答えること。または、その答え。／形式や決まり文句のような正しい解決策や方法。
정반대=ある物の形、位置、方向、性質などが全く正反対になること。または、そのような関係。
정보화=情報を収集、加工、保存、流通させる活動が社会の中心になったり、知識と情報が社会のあらゆる分野で価値創出の核となる現象。／情報通信技術を活用して業務の効率を高めたり、社会システムを知能化する過程。
정상적=特別な変動や異常がなく、状態が正常であること。／状態や現象が一般的な基準や範囲から外れていないこと。／状態や状況が正しかったり、平凡な範囲内にあって、特別な異常や問題がない状態の。
정오=昼の十二時。太陽が南中する時を指す。／（比喩的に）物事の真っ盛りや絶頂期を指す言葉。
정장=格式を重んじる場に着ていく正式な服装。または、その服装をすること。
정지=行っていたことをやめたり、止まったりすること。／機械や自動車などが動かなくなること。または、そのようにすること。／権利や資格などの効力が一時的になくなること。
젖=哺乳類の雌が子を育てるために乳腺から分泌する、白く不透明な液体(乳 / 母乳)。／(比喩的に) 母親の世話や養育の恩恵を指す言葉。／母親の胸や乳房を指す言葉(おっぱい)。
제공=何かを差し出したり、供給したりすること(提供)。／(法律) 物件、権利、技術などを相手が利用できる状態に置くこと。
제시=ある意思や意見を言葉や文章で表して示すこと。／検査や参考のために物を差し出して見せること。／[心理] 学習課題や刺激を被験者に提示すること。
제안=案이나 意見を出すこと。または、その案や意見（提案）。
제자리=物が本来あった位置や、当然あるべき場所。／ある対象の状態や地位が向上せず、そのまま止まっている状態。
제출=案件や意見、書類などを出すこと（提出）。
조기=ある出来事が起こる時期より前の時期。または、早い時期。
조깅=健康維持のためにゆっくりと一定の速度で走る運動（ジョギング）。
조르다=誰かに何かをしてほしいとしつこく要求したり、買ってほしいとせがんだりする。／結び目や輪などをきつく締める。／首や腰などを力いっぱい押さえたり締めたりする。
조명=光を当てて明るくすること。または、その光。／演劇、映画、写真撮影などで、芸術的な効果を出すために光を調節して照らすこと。または、その装置。／（比喩的）ある物事や現象を一定の観点から考察すること。
조절=バランスが取れるように正したり、状況に合わせて整えること（調節 / 調整）。／機械や装置などが正常に作動するように状態を合わせること（調整）。／生態系や生理現象などが一定の状態を維持するようにすること（調節）。
조정=基準や状況に合わせて状態を正したり直したりすること（調整）。／紛争や葛藤がある状態で間に立ち、和解させたり合意を引き出したりすること（調停）。／機械や装置が正常に作動するように機能を適切に調節すること（調整 / チューニング）。
졸업생=학교や教育機関で規定の教育課程をすべて終えて卒業した人(卒業生)。
좁히다=面積や幅を狭くする。／範囲や限界を狭める。／距離や関係を縮める。
종교적=宗教に関係すること。／宗教の性格を帯びたり、宗教を基盤としたりすること。／宗教の性格を帯びること。
종종=時々、しばしば。 (頻度はそれほど高くはないが、繰り返される様子)／種々、色々な種類や様々な形。
좌석=人が座れるように用意された席。
주관적=個人の主観的な観点や考えに基づいたもの。／自分だけの見解や観点に基づいていること。または、客観的な事実や一般的な基準よりは個人の考え、感情、判断に重点を置くこと。
주름=皮膚や紙、布などが折れてできた筋（しわ）。／物の表面に現れた屈曲や波状の跡。／（比喩的に）ある出来事によって生じた複雑な状態や悪影響。
주문하다=飲食店や商店などに品物を送ってほしいと頼む(注文する)。／ある事柄や条件などをしてほしいと要求したり頼んだりする(注文する / 要望する)。
주방=食べ物を作ったり料理をしたりするのに必要な設備を備え付けた場所(台所 / キッチン / 厨房)。
죽=線や筋などを迷わず一気に引く様子。／大勢が順々に列を作って並んでいる様子。／液体や粉末などを一度にたくさん飲み込んだり注いだりする様子。／ある状態や行動が絶えずずっと続く様子 (ずっと / つらつら)。／穀物の粒が十分にふやけるように水をたくさん注ぎ、長く煮込んだ料理。消化に良いため、病人食や滋養食として主に利用される。／(比喩的に) 物事が台無しになったり、うまく進まなかったりする状態。／水分が多くてべたべた（ぐちゃぐちゃ）になった状態。
준비되다=必要なものが備わったり、用意されたりする。／ある事や状況を迎える準備が整った状態になる。
준비물=あることをするために、あらかじめ備えておくべき物（準備物 / 持ち物）。
줄거리=物事の核心となる重点的な内容。主に小説、映画、ドラマなどの全体的な内容を短く要約したものを指す(あらすじ / 筋)。／植物の茎や木の枝の本体。／何本も絡み合った糸や紐の束。
줄무늬=地に線が引かれている模様。横や縦、または対角線の方向に連続した線が現れる形を指す。
중단=取り組んでいたことを途中でやめること。または、進行していた状態や流れが途絶えること(中断 / 停止)。
중독=生体が食物や薬物の中の毒性により機能障害を起こすこと。／酒、麻薬などを継続的に使用し、それなしではいられない状態になること。／ある思想や物事に深くはまり込み、正常に物事を判断できなくなる状態。
중순=一ヶ月を十日ずつ三つに分けたうちの真ん中。普通、毎月11日から20日までの期間を指す。
중심지=ある活動や機能が集中している核心的な場所(中心地 / センター)。／交通、経済、文化などが周辺地域へと広がっていく基準となる場所。
중얼거리다=他人が聞き取れないほどの低い声で、一人で言葉を話し続ける。
즉석=ある事が起こったその場。または、延ばさずにその場ですぐに処理すること(即席 / その場)。
증세=病気を患っている時に現れる様々な状態や現象（症状）。／物事が進んでいく状況や状態。
지겹다=ある事柄や状態があまりにも長く繰り返され、嫌気がさして辛い。／同じ対象や状況に、嫌気がさすほど飽き飽きしてイライラする。
지극히=この上なく。至って。（主に状態や性質を表す形容詞の前で、その程度が非常に甚だしいことを表す。）
지금껏=話しているこの時点までずっと。（類義語：今まで、今に至るまで）
지급=(金銭や物品などを)定められたところに従って出すこと(支給)。／国や団体が権利者に金銭的な恩恵や対価を公式に伝えること。
지난날=過ぎ去った時。または、過去の日々。
지름길=遠回りせず、近道して行く道（近道）。／（比喩的）ある目的や結果に最も早く到達できる方法（近道）。
지저분하다=ある場所が整理されていなかったり、物が散らかっていたりして、見た目に見苦しい。／物や体などが垢で汚れたり不潔だったりして、きれいではない。／言葉や行動、仕事の処理などがさっぱりしておらず、だらしがない。
지진=地球内部のエネルギーが地表面に放出され、地面が揺れたり割れたりする現象（地震）。
직선=点と点を最短距離で結ぶまっすぐな線。曲がらずにまっすぐ伸びた線。／何の曲がりや屈曲もなく、まっすぐ伸びた道や状態を比喩的にいう言葉。
직장인=規則的に職場に通い、働く人。主に給与を受け取って生活するサラリーマン（給与生活者）を指す。
진달래=ツツジ科の落葉広葉灌木。春に葉よりも先にピンク色または淡い赤色の花が咲き、韓国全土の山野でよく見られる。花は食べることができるため「チャムコッ（真の花）」とも呼ばれる。／진달래（ツツジ）の花。
진동=物体が規則的に揺れたり響いたりすること（振動）。／音や光などが波動の形で伝わる現象。／（比喩的に）臭いが非常に強く漂うこと。
진로=前進する道（進路 / 前途）。／（比喩的に）今後の人生や事業、学業などで進むべき方向や目標（進路）。／船や飛行機などが進む経路（航로 / 進路）。
진심=偽りのない本当の心（真心 / 本心）。
진행자=ニュース、ラジオ、講演会、討論会などの番組や行事を担当し、進行する人（司会者 / 進行役）。
짐작=事情や都合などを推し量って考えること（推測 / 察し）。／見当をつけて推し量ってみること（目算 / 推量）。
집중적=一箇所や一つの事に全精魂や関心を注ぎ込むさま。／一箇所に力や関心を一気に集めること。／ある対象や物事に全力を尽くして没頭している状態。
짧아지다=物の長さや距離が以前より短くなる。／時間、期間、日の長さなどが以前より減って、その状態になる。／言葉や文章の分量が減る。
쫓겨나다=ある場所や組織から強制的に去ることになる。／仕事や職を失い、退くことになる。／家に住めなくなり、強制的に外へ追い出される。
쫓기다=誰かや何かに捕まらないよう、後をつけられたり追跡されたりする。（「追う」の受身形）／ある仕事や時間、状況などに追い詰められ、余裕のない状態になる。／ある場所から強制的に去らされたり、退かされたりする。
쭉=線や筋などを一気にまっすぐ引くさま。／腕や足、体などをまっすぐ伸ばすさま。／ためらわず一気に進んだり行動したりするさま。／水や空気などを一気に吸い込むさま.／大勢が列をなして並んでいるさま。／ある状態や行動が絶えずずっと続くさま。
찍히다=鋭い先が刺さったり、跡がついたりする。／判子や印鑑などが紙などに押されて跡が残る。／写真や映画の画面などに姿が映る。／誰かの不興を買ったり嫌われたりして、要注意人物として目をつけられる。／(足跡や模様などが) 床や布などに残る。
찢다=道具（カッター、ハサミなど）を使わず、手などで引っ張って物体をバラバラにしたり、裂いたりすること。／（比喩的に）鋭い音が耳を刺激したり、大きな痛みが心を苦しめたりすること。／筋肉や靭帯などを無理に伸ばして傷つけること。
찢어지다=物体が引っ張られたり、鋭いものに引っかかったりして、裂けたり破れたりする。／音が非常に高く鋭い。／貧困や苦痛などが非常に激しい。／（比喩的に）心や胸がひどく痛む。
차남=二番目の息子（次男）。
차마=恥ずかしかったり、気の毒に思ったりして、どうしても〜できない様子。主に後ろに「ない」、「できない」などの否定語が伴います。
차선=自動車が道路に沿って安全かつ秩序よく走行できるよう、道路に一定の幅で引かれた線(車線)。／飛行機の離着陸を助けるために滑走路に引かれた線。／最善ではないが、その次に良い選択や対策(次善)。
차이점=互いに食い違ったり異なる点（相違点 / 違い）。
차차=ある状態がいっぺんに変わらず、少しずつ漸進的に変化する様子（次第に / 段々）。／時間が経つにつれて。
차창=自動車や列車など、車のドアや壁にある窓（車窓）。
차츰=ある状態や程度が一度に押し寄せるのではなく、少しずつ日が経つにつれて増したり減ったりする様子。（類義語：次第に、徐々に）
착각=ある物事や現象を実際とは異なって誤って知覚したり考えたりすること。実際にはないものをあるものとして、あるいは事実とは異なって認識する心理的状態（錯覚 / 思い違い）。
참가=集まり、団体、行事、競技などの場に加わり、その事に携わること（参加）。
참석=集まりや会議などの場所に行き、同席すること(出席 / 参列)。
참석자=集まりや会議、行事などの場に直接出て参加した人（出席者 / 参加者）。
참조=ある事を処理したり、内容を理解するのに役立つような他の資料や事例を照らし合わせて見ること（参照）。
찻잔=お茶を入れて飲む小さな器。主に取っ手があり、受け皿と一緒に使われることもある(茶碗 / ティーカップ)。
창=空気や光が入るように壁や屋根に作られた開口部。通常、ガラスや格子を取り付けて開閉できるようにする（窓）。／（比喩的）世界と疎通したり、物事を見通したりする通路。／[コンピュータ] コンピュータ画面で実行中のプログラムや情報を表示する独立した四角い領域（ウィンドウ）。
창가=窓の近くや窓際の空間(窓際 / 窓辺)。
창구=外部の人を応対したり、書類などを受け取って処理したりする窓口。（銀行、役所、駅などに設置された施設）／何らかの事柄や情報をやり取りするために定められた連絡ルートや交渉の場。／比喩的に、ある目的を達成するための手段や通り道。
창작=新しい何かを初めて作り出すこと。または、その作品。／芸術的インスピレーションや技術を発揮して、文学や芸術作品などを独創的に作り出すこと。
찾아다니다=人や物、場所などを探してあちこち歩き回る。／ある目的を果たすために、あちこちを訪問したり調べたりしながら回る。
채널=テレビやラジオの放送周波数番号：放送局ごとに割り当てられた固有の番号や帯域を意味する。／情報や意思が伝達される経路：二つの対象の間で疎通や交流が行われる手段や通路を比喩的にいう言葉。
책가방=本やノート、筆記用具など勉強に必要な物を入れ、背負ったり手に持ったりして運べるように作られたカバン。
책임감=引き受けてやるべき任務や義務を重んじる心（責任感）。
챔피언=運動競技や競演大会などで実力が最も優れ、優勝した人やチーム(チャンピオン)。／特定の分野で最高の座に就いた人を比喩的にいう言葉。
천국=宗教で、死後に善なる魂が行って永遠の福を享受するという、甘美で平和な世界。（反対語：地獄）／苦しみや心配が全くなく、楽しさだけに満ちた場所を比喩的にいう言葉。
철=一年を気候の変化によって分けた四つの時のうちの一つの時期。季節。／ある事が行われたり、現象が起きたりする時や時期。／物事の道理を判断できる力や知恵。／周期表第8族に属する鉄族元素の一つ。人類が最も広く使用する金属で、磁性が強く硬いうえに加工しやすいため、各種の機械、道具、建築資材の主原料となる。元素記号はFe、原子番号は26である。／「鉄分」を指す言葉。体内で酸素を運搬するヘモグロビンの主要な構成成分である。／道理をわきまえることができる知恵や心の持ちよう。（主に「分別がつく」の形で使われる）／一年を気候の変化に従って分けた四つの時期（春、夏、秋、冬）。／ある物事や現象が盛んな時期、または一定の活動をする時期。
철도=レールを敷き、その上で車両を運行させて旅客や貨物を運送する設備および体系（鉄道）。／都市交通の円滑な疎通のために設置された都市鉄道や地下鉄を総称する言葉。
청하다=あることをしてくれるように頼んだり要求したりする。／人を来るように呼んだり招待したりする。／（眠りや休息などを）取ろうと試みたり、取ったりする。
체온=人や動物の体の温度（体温）。／（比喩的に）人から感じられる温かい情や気配。
체중=体の重さ(体重)。
체하다=食べた物がうまく消化されず胃に留まり、胸がむかむかしたり、ねじれるような症状が出ること（胃もたれする / 消化不良になる）。／前の言葉が意味する状態を表面上だけ繕う態度を表す言葉（～ふりをする）。／(動詞や形容詞の後で「-은/는/을 체하다」の構成で使われ) 前の言葉が表す状態を表面上、偽って装うことを表す言葉。「척하다」と同じ意味で使われる。
초밥=塩、酢、砂糖で味付けしたご飯を握り、その上に薄く切った魚介類、貝、卵、野菜などを載せたり、海苔で巻いたりして作る日本料理(寿司)。
초청=ある人を丁重に呼んで来てもらうこと（招待 / 招請）。
최고급=最も高い階級や等級（最高級）。／品質や施設などが最も優れた水準（最高級）。
최신=最も新しいこと。または、最新のもの。
최저=程度や水準が最も低いこと。またはその状態。／数値や価格などがどん底の状態。
추천=ある条件に適した対象を責任を持って紹介したり、その対象を選ぶよう勧めたりすること（推薦）。／特定の職務や役職に適した人物を紹介したり勧めたりすること。／良い本や品物、場所などを他人に勧めること。
추측=ある事実や状況を推し量って考えること（推測 / 推量）。
축소=数量、規模、範囲などを減らして小さくすること(縮小)。／(数学) 図形の各部分の長さを一定の割合で縮めること。または、そのように縮めた図形。
출국=自国の境界を越えて他国へ行くこと。または法律的に定められた手続きを終えて国家の領域外へ移動する行為(出国)。
출근하다=職場に業務をしに出かけること(出勤する)。
출입문=人が出入りできるように作られた門や扉（出入口）。
출판=文章、絵、楽譜などの著作物を印刷して本の形で世に出すこと（出版）。
충격적=心に非常に大きな刺激や感動を与えるようなもの（衝撃的）。／予期せぬ出来事によって精神的に大きな打撃を与えること（ショッキング）。／心に大きな響きを与えたり、驚かせたりするようなもの。／ある事件や現象が予想を大きく外れたり、非常に強烈で精神的に大きな刺激を与える状態。
충고=他人の欠点や過ちを心からいさめること。また、その言葉。
충돌=1. 互いにぶつかり合ったり、立ち向かったりすること。 2. 異なる物や人、勢力などがぶつかり合って問題を引き起こすこと。 3. 意見や利害関係などが一致せず、摩擦が生じること(衝突)。
취소하다=すでに発表した計画、約束、命令などを取り消したり、なくしたりする。／法律行為の効力を当事者の意思表示によって消滅させる。
취업=一定の職に就き、職場に出ること（就職 / 就業）。
취재=新聞、雑誌、放送などの記事や作品の材料を調査して得ること。
취향=やりたいという気持ちや欲求、またはそれが向かう方向。／ある対象に対して持つ心の傾向や好み。
치료하다=病気や怪我などを治す。／心理的な問題や精神的な障害を治して正常な状態に戻す。
친정=結婚した女性が本来生まれて育った家。（主に両親が住んでいる家を意味する。）／（比喩的に）ある人が以前所属して活動していた場所や、故郷のような組織。
카운터=店、銀行、ホテル、レストランなどで代金を支払ったり、注文や案内を受けたりする会計台や受付。／ボクシングやスポーツの試合で、相手の攻撃に合わせて打ち返す反撃。／数字を数える機械や装置。
칸=建物、棚、列車内などの空間を一定の規格で分けた区画。／紙や本の面に線を引いて作った空白の区画。／建物や部屋の広さを表す単位。
캄캄하다=光が全くなくて、非常に暗い。／希望や展望が全く見えず、行く先が真っ暗だ。／ある事実や消息について、全く知っていることがない。
캠퍼스=大学の校庭や学校の構内。／大学を中心に形成された教育環境や学院空間。
캠페인=社会的、政治的、あるいは商業的な目的を達成するために、組織的かつ継続的に行う活動（キャンペーン）。
커튼=窓に取り付けて光を遮ったり、外から中が見えないように防いだりする布(カーテン)。／舞台の前面に吊るし、舞台と客席の間を仕切る幕。
켜지다=灯火や電灯などの明かりがつく。／電気機器や装置などが作動し始める。／マッチやライターなどに火がつく。
코미디=人々を笑わせるために演劇、映画、放送などで演出される喜劇的な形式の芸術（コメディ）。／日常生活で起きるおかしくて諧謔的な事件や状況を比喩的にいう言葉。
코피=鼻の粘膜から出る血。主に打撃、疲労、乾燥した天候などによって発生する(鼻血)。
콩나물=大豆に水を与えて芽を出させたもの。また、それで和えたナムルやスープなどの料理。／(比喩的に) 狭い場所に多くの人がぎっしりと詰まっている状態を指す言葉。
크림=牛乳を遠心分離して得た脂肪分の豊富な白い液体。食用にされたりバターの原料になったりする。／化粧品や薬品などを塗りやすいように、油分と水分を混ぜて粘り気のある状態にした物質。／(比喩的に) ある事柄の最も核心的で精髄である部分。
큰길=人や車が多く通る幅の広い道（大通り）。／比喩的に、ある物事を行う上で最も正当で堂々とした道。
클럽=お酒を飲みながら音楽に合わせて踊れる施設を備えた娯楽施設（クラブ）。／趣味、スポーツ、社交など共通の目的を持つ人々が集まって作った団体や集まり。
키스=愛や尊敬の印として、相手の唇や手の甲、頬などに自分の唇を触れること。「口づけ」と言い換えて使われることもある。／(比喩的に) 物や現象が非常に近くに触れたり接触したりすることを指す言葉。
타고나다=性質、才能、運命などを生まれつき持っている。
타오르다=火の手が激しく上がったり燃え広がる。／(比喩的に) 感情や熱意などが強く沸き起こる。／(比喩的に) 日差しや夕焼けなどが強烈に照りつけたり赤く染まる。
탁자=食べ物を食べたり、物を置いたりする時に使う家具。普通は引き出しがなく、椅子とセットにすることもある（テーブル）。
탄생=人が生まれること。／貴い人物や偉大な業績、物、組織などが新しく生まれることを比喩的にいう語。
터널=道路、鉄道、水路などを通すために、地中や海底などを掘って作った通路（トンネル）。／（比喩的に）先が見えない、息苦しく苦痛な状況や時期。
텅=中が全くなく、がらんと空いている様子。／周囲に誰もいなくて、とても寂しく虚しい様子。
토하다=食べた物を口の外に吐き出す（吐く / 戻す）。／心の中に抱いていた事実や考えを包み隠さずすべて話す（打ち明ける / 吐露する）。／（比喩的に）あるものを外に噴き出したり出したりする（吐き出す）。
통과=ある場所や地点を経て通り過ぎること。／検査、審査、試験などに合格したり、基準を満たしてパスすること。／法案や案件などが会議で正式に可決されること。／（特殊）国境や税関などを合法的に越えて行くこと。
투표=選挙を行ったり可否を決定したりする際、決められた用紙に意思を表示して特定の場所に出すこと。賛成や反対の意思を票で表す行為。
틀림없이=少しの狂いもなく、あるいは疑う余地もなく確実に。
파리=フランスの首都であり、政治、経済、文化の中心地。セーヌ川流域に位置し、「芸術の都」や「花の都（光の都市）」という別称で世界中に広く知られている固有名詞。／[昆虫] ハエ目ハエ科に属する昆虫の総称。体に毛が多く、口は舐めるのに適しており、伝染病を媒介することもある。／[地名] フランスの首都。ヨーロッパの政治、経済、文化の中心地の一つである。
파출소=警察署の管轄下にあり、一定の区域内で警察事務を司る最も基礎的な機関（主に近所の治安維持、犯罪予防、事故の受付などの業務を遂行する）。
판사=裁判所で裁判を進行し、判決を下す公務員。法律に従って事件の是非や罪の有無を判断する職業を指す。
패션=特定の時期に流行する服装や装飾の形態や様式。／衣服、アクセサリー、化粧品など、人の外見を整えることに関連する産業や文化全般。
팩=顔や体に塗り、固まったら剥がしたり洗い流したりして肌を整える美容製品。／液体や物を一定量ずつ入れた容器や束（例：牛乳パック、タバコ1パック）。／コンピュータやゲーム機などに差し込んで使用するデータ保存装置や部品のセット。
팬티=下着の一つ。腰の下から脚の上部までを覆うように着る服で、主に肌に直接触れるように履く(パンツ / ショーツ)。
퍽=程度が普通をはるかに超えて。「非常に」、「かなり」、「実に」の意味を表す副詞。／状態や行動の程度が思ったより深い、または激しいことを表す言葉。
편견=公正さを欠き, 一方に偏った考えや見解(偏見)。
편의=都合がよくてたやすいこと。または、利用するのに近くて便利なこと。／ある物事をするのに有利な、あるいは適切な機会や事情。／他人の事情を考慮して便宜を図ること。
편히=体や心が苦しくなく、楽しく。／仕事をするのに易しく、便利に。／何の心配や障りもなく、安らかに。
평화롭다=村や心が心配事や災いがなく、静かで睦まじい状態にある。／戦争や紛争がなく、平穏な状態である。
폐지=実施してきた制度、法律、慣習などをやめたり、廃止したりすること。
포근하다=物や場所などが柔らかく暖かい感じがある。（特に寝床や服、天気などに使われる。）／心や雰囲気がゆったりとしていて、安らかで温かい。
포도주=ブドウの汁を発酵させて作った酒。色によって赤ワイン、白ワイン、ロゼワインなどに分かれる(ワイン / 葡萄酒)。
포스터=広告や宣伝、あるいはある内容を広く知らせるために壁や柱などに貼る大きな紙。絵や写真、文字などを調和よく配置して視覚的効果を高めたのが特徴である。
포크=先端が数股に分かれており、料理を刺して食べたり固定したりするのに用いる西洋式の食器（フォーク）。
포함=ある範囲や全体の中に一緒に入っていること、または入れること。／ある対象や現象を中に含んでいること。
표시=事項を知らせるために表に出して見せること。記号や文字などを使って表したり、感情や意思などを言葉、表情、態度などで表すこと（表示 / 表れ / 表明）。／印や文字などを使って、ある内容を外部に表し示すこと。／記号や装置などを使って、位置や状態を知らせること。
표시하다=しるしや記号などを付けて、ある対象を他と区別したり分かりやすく表したりする。／表面に表して見せる。／ある意思や感情を言葉、身振り、記号などで表す。／表に現して示すこと。／ある事項を知らせるために、点や線、文字などの符号を付けること。／考えや感情などを言葉や文章で表現すること。
표준=物事の程度や性格などを知るための根拠や基準。／物事や現象などが一般的で典型的なこと。／[言語] 一つの国で公用語として使う規範としての言葉。（例：標準語）
푸다=液体や粉、穀物、ご飯などを器に盛るために、おたまやしゃもじなどですくい出す。／中に入っている液体や粉を外に汲み出して空にする。
풍속=古くから社会に伝わってきた生活習慣や風習。／その時代の流行や社会的現象。
프린터=コンピューターやスマート機器などに保存されたテキストや画像データを、紙などの媒体に印刷して出力する装置（プリンター）。
플라스틱=熱や圧力を加えて成形できる高分子化合物を総称する言葉。軽く、硬くて腐らない特性があり、容器、器具、工業材料など、日常生活全般で広範囲に使用される。
필름=カメラや映画撮影機などに入れ、写真や画面を撮影するために使う感光材料。／物体の表面を薄く覆っている膜。／(比喩的表現) お酒に酔いすぎて記憶が途切れる現象を指す言葉。
필수=必ず必要であるか、しなければならないこと。または、そのような条件(必須)。
핑계=気が進まない自分をなだめようとしたり、過ちに対して責任を逃れようとして立てる口実。／あることをするために表向きに立てる口実。
하나하나=個々のすべての個体や要素。／一つずつ順番に。（主に「하나하나」の形で使われ、動作の細かさを表す）／数多い中から、それぞれの個体や全ての項目を一つずつ個別に指す様子(一つ一つ / 一々)。／ある事柄や対象を漏らさず、几帳面に処理したり確認したりする様子(一から十まで / 丁寧に)。
하느님=プロテスタントやカトリックなどのキリスト教で信奉される唯一神。宇宙の創造主であり、主権者を指す言葉。／（主に「神様、なんてことだ」などの表現で使われ）天にいると信じられている絶対的な存在。民間信仰における天神や上帝を意味することもある。
하도=あまりにも、ひどく。（ある状態や性質が普通の程度をはるかに超えている様子を表すときに使う。）
하품=あくび：眠い時や退屈な時、またはお腹がいっぱいの時に、口が自然に開いて深く息を吸い込み、吐き出す無意識的な呼吸動作。
학과=大学や専門学校などで、教育および研究の便宜のために区分された専攻分野の単位（学科）。／教授内容や学習内容に従って、系統的に分類して立てられた教科目単位（学科）。
학력=学校に通った経歴。またはその学校の卒業、修了、中退などの学業履歴。／社会的地位や職業的資格を評価する際に参考にする最終的な教育水準。
한결=普段よりずっと。 (副詞)／最初から最後まで変わらずに。 (副詞)
한국적=韓国ならではの固有の特徴や性質を持っていること。／韓国の伝統、文化、情緒などとよく調和していること。／韓国の固有な特性や情緒を持っている。
한낮=一日の真ん中。普通、太陽が真上に高く昇っている正午（昼の12時）前後を指す。／（比喩的に）ある事柄や現象が最も活발だったり、熟したりしている時期。
한눈=一目見て、すぐに気づいたり感じたりする目の様子。／しばらく他の場所を見る目。（主に「脇見をする」の形で使われ、注意を他にそらすことを意味する。）／一度に全体をすべて見渡す視界。
한문=漢字で書かれた文章。主に昔の東アジアで公用語として使われていた文章形式を指す。／教科の一つで、漢字と漢文の文章を学ぶ科目。
한밤중=深い夜。およそ真夜中（午前0時）を挟んだ時間帯のこと。
한순간=ごく短い時間。または、ある出来事が起きた直後の短い瞬間。
한여름=夏真っ盛り。通常、気温が最も高く蒸し暑い時期を指す。
한잔하다=軽くお酒を一杯飲む。／（比喩的に）お茶や飲み物などを一杯飲む。
한창=ある物事が最も活気があり、盛んに行われている様子。または、その真っ盛りな時期。／ある状態や現象が最も激しい時（真っ盛り、たけなわ）。／あることが最も活気があり、盛んに行われている時。または、そのさま。／ある状態が最も熟している時期。
한층=ある程度よりずっと、さらに。（副詞）／程度や水準が以前よりさらに深まったり高まったりした状態。
합격=試験、検査、審査などで、定められた格式や基準に達して選ばれること。／ある条件や要求に適合したり、気に入ったりすること。
합하다=二つ以上の数や量を一つにまとめて計算する。／複数の人の意思や力を一つに合わせる。／別々に離れていたものを一つに集めたり混ぜたりする。
해롭다=ためにならず、害になる状態にある。（主に健康、環境、精神、状況などに良くない影響を及ぼす時に使う。）
해설=ある問題や事件、現象などの内容や意味を分かりやすく解き明かして説明すること。または、その説明。／文学作品、芸術作品、試合状況などを観客や読者がよく理解できるように解説すること。
해소=難しい状況や良くない状態を解決してなくしてしまうこと。／積もっていた怨恨や感情などを晴らすこと。／団体や組織などを解散させたり、関係を絶ったりすること。
해안=海と陸が接するところ。またはその近くの土地(海岸)。
핸드백=主に女性が持ち物を入れて手に持ったり、肩にかけたりして持ち歩く小さなバッグ。
햇볕=日が照りつける熱い気配。（主に温かさや光の強さに焦点を当てる）
행운=よい運勢。または幸せな運。 (良いことが起きそうな肯定的な気運や機会を意味する。)
행하다=ある事や行動を実際に行う。／法令、規則、儀式などを実際に実施したり執り行ったりする。／道を行く。（文語的表現）
향수=体や服に振りかけて、良い香りを漂わせる化粧品。様々な花や植物などから抽出した香料をアルコールに混ぜて作る(香水)。／体や服に振りかけて、いい香りをさせる化粧品の一種（香水）。／故郷を懐かしむ気持ち（郷愁 / ホームシック）。
허락=願い出たことをするように許すこと(許諾 / 許可 / 許し)。／(法律) 法令によって禁止されている行為を、特定の場合に特定の人に対して解除してあげる行政処分。
허용=問題にせず、許して受け入れること。（ある事実や現象を認めたり容認したりすること。）／法や規則で禁止されていないこと。（範囲や限度内で認められること。）
헌=古くて使い古した。新品ではない。すでに使用したか、古くなって使い込まれた。
현관=建物の出入り口であり、室内外を連結する境界となる空間。主に靴を脱いだり客を迎えたりする場所を指す(玄関)。／(比喩的に)ある場所に入る入り口や始点。
현대인=今日（こんにち）の時代を生きている人。／現代的な考え方や生活様式を持っている人。
혜택=ありがたく施される恩恵や助け。または、それによって受ける利益。／自然や社会制度などから受ける助けや利益。
호박=ウリ科の一年草の蔓性植物。またはその実。実は食用で、大きく丸い形や細長い形をしており、熟すと黄色やオレンジ色を帯びる。／(比喩的意味) 不細工な顔を比喩的にいう言葉。
호선=地下鉄や電車などの路線を区分して、番号の後につけて呼ぶ言葉（～号線）。
호주머니=服の目立つところに物を入れられるように、布を当てて作った袋（ポケット）。
홈페이지=インターネット上で個人や団体が自己紹介をしたり、情報を提供するために作成した文書の集合体。一般的にウェブサイトのトップページを指すこともある。
홍수=雨が多く降り、河川の水が氾濫して周辺の土地を覆う現象（洪水）。／（比喩的に）物事が一度にたくさん溢れ出てくる状態。
화장지=主に体を拭いたり、汚れをきれいに片付けたりするのに使う薄い紙。ロール状やティッシュペーパーのように引き出して使うものなどがある(トイレットペーパー / ティッシュペーパー / 化粧紙)。
화재=火事、火災。人の意図に反して、または放火によって発生し、消火施設などを利用して消す必要のある燃焼現象を意味する。
확=風、におい、気配などが急に強く漂う様子。／火がぱっと燃え上がる様子。／態度や勢いなどが急に大きく変わる様子。／ある動作をためらわず一気に強く行う様子。／鳥肌や戦慄などが体に急に強く走る様子。
확신=固く信じること。また、その心。／ある事柄や事実が間違いないと自ら断定する心の状態。
확장=施設、勢力、規模、範囲などを増やして広げること。／[コンピュータ] ファイルの機能を追加したり、データの保存空間を広げたりすること。／[数学] 数の集合や概念の範囲を、より広い範囲に拡大すること。
환갑=人が生まれてから満60年になる年の誕生日。六十進法の干支（十干十二支）が一巡して、再び自分の生まれた年の干支に戻るという意味である。回甲（フェガプ）ともいう。
환율=自国の通貨と他国の通貨との交換比率。通常、外貨1単位に対する自国通貨の価値で表示される（為替レート）。
활기=生き生きとして活動的な気運。または力強く躍動感あふれる気運(活気)。
활용=ある対象が持っている能力や機能を十分に活かし、実効を上げること(活用)。／[言語] 動詞や形容詞のような用語の語幹に様々な語尾がつき、形態が変化すること(活用)。
활짝=口や門などを非常に気持ちよく、広く開ける様子。／花が実に見事に咲いている様子。／天気がとても晴れやかに晴れ渡った様子。／心や表情などが非常に明るく、晴れ晴れとした様子。
회화=会って互いに話をすること。また,その話。／外国語で言葉を交わすこと。または、そのような勉強。／線、色彩、明暗などを利用して平面上に形を描き出す芸術。（絵画）／線や色彩を使用して、平面上に形象を描き出す芸術的表現様式。絵画。／様々な線や色を使って、物の形や考え、感情などを平面に表したもの。
횟수=繰り返される事柄や現象が起こる回数。
효도=親に真心を込めてよく仕える道理。または、そのような行為(親孝行)。
효율적=投入した努力や費用に比べて得られる結果が大きいこと（効率的）。／エネルギーを浪費せず、目的を最もよく達成する方式のもの。／かけた努力や費用に比べて、得られる結果が大きいさま(効率的)。
후회=以前に自分が行ったことが間違っていたと考え、自らを責めたり、惜しんだりすること（後悔）。
후회하다=以前に犯した過ちや失敗について、後でその間違いに気づき、自ら責めたり惜しく思ったりすること(後悔する)。
흑백=黒と白を合わせていう語。／彩色がされず、黒と白だけでできている状態。／正しいことと間違っていること、または善と悪を比喩的にいう語。
흘러내리다=液体や粉状態の物質が、上から下へ続けて流れる。／髪の毛や服、物などが下の方へ垂れたり伸びたりする。／涙や汗などが頬や体を伝って下に落ちる。
흥미롭다=ある物事や現象に対して興味をそそられるところがある。つまり、心を惹きつける面白さや楽しさがある。
흥분=ある刺激を受けて感情が激しくこみ上げること。または、その感情。／[生物] 生体に刺激を与えたとき、エネルギーを放出しながら機能が活발になる現象。
희생=他人やある目的のために、自分の命、財産、名誉、利益などを惜しまず捧げたり捨てたりすること。／事故や災害などによって命を失ったり被害を受けたりすること。／[宗教] 天地神明や宗廟などの祭礼の際、供物として捧げる獣。
힘껏=力が及ぶ限り切実に、または強く。（あることをする際、自分が持っているすべての力を出し切る様子を表す。）
힘차다=力強く、勢いがある（例：声、足取り、元気など）。／作用する力が強い（例：水流、流れなど）。
