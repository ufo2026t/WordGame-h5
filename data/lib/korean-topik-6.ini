-가량=(数量を表す名詞や名詞句に付き)「くらい」、「ほど」の意味を添える接尾辞。
-스럽다=一部の名詞の後に付き、「そのような性質がある」という意味を加え、形容詞を作る接尾辞。対象が特定の属性や雰囲気を強く漂わせている時に使われる。
-짜리=(数量を表す名詞句の後ろに付き) そのくらいの価値を持つ品物であることを表す接尾辞。／(数量を表す名詞句の後ろに付き) そのくらいの長さや重さ、大きさなどを持つ品物であることを表す接尾辞。
가능해지다=あることが実現できるようになるか、あることができる状態に変わる。
가려지다=物体や光などが遮られて見えなくなる。／事実や本質などが他に覆われ、はっきりと現れなくなる。／正誤や勝敗などが判別される（見分けられる）。
가렵다=皮膚のある部分を掻きたくなるほど、ムズムズする感じがある（かゆい）。／あることがしたくてたまらない（うずうずする）。
가로수=街の美観を整えたり、保健衛生、日陰の提供などのために道路に沿って並べて植えられた木（街路樹）。
가스레인지=ガスを燃料にして火を出し、料理ができるように作った調理器具。
가습기=室内の湿度を調節するために、水を粒子状に放出して空気を潤す器具（加湿器）。
가입하다=団体や組織に構成員として入ること。／サービスや商品を利用するために契約を結び、登録すること。
가전제품=家庭で日常生活の便宜のために使用する電気機器。冷蔵庫、洗濯機、テレビ、掃除機などがこれに属する。
가정교사=一定の家庭に住み込み、または定期的に訪問して学生を教える先生（家庭教師）。
가정주부=外で職業を持たず、家庭内で家사労働や育児などの家事を専念する女性（専業主婦）。
간절하다=心や誠意が非常に極まっており, 真心がこもっている。／ある願いや欲求が切実である。
간지럽다=皮膚のどこかに何かが触れたり、触れたような感じがして、むずむずと妙な感じがする（くすぐったい）。／何かをしたくてたまらなかったり、ある状況が照れくさくて決まりが悪かったりする。／（比喩的に）他人の注目を浴びたり褒められたりして、気分が良くも照れくさい。
갈라지다=一つだった物体が割れたり、はじけたりして、いくつかの部分に分かれる。／道や茎などがいくつかの方向に分かれて伸びる。／人々の意見や考え、派閥などが一つにまとまらず、いくつかに分かれる。／声が澄んでいなくて、かすれたり荒くなったりする。
감상문=ある芸術作品を鑑賞したり、物事を見て感じたことや考えなどを書いた文章。（主に読書感想文や映画感想文などを指す。）
감소되다=量や数値が減るようになる。（ある現象や作用によって分量、数量、程度などが少なくなることを意味する。）
감수성=外部の刺激や影響を受け入れ、感じる性質や能力。／[心理] 外界の刺激を受け入れて認識する能力。／[生物] 生物が外部の条件や刺激に反応する性質。特に病原体や薬剤などに対して反応する程度をいう。
감정적=ある現象や事柄に対して起こる心や気分によるもの。／理性よりは感情に偏ったり、感情が豊かな性質を帯びること。
갑=物を入れるために紙、木、革などで作った小さな箱（ケース / 小箱）。／物を数える単位。主にタバコやマッチのように、箱に入った物の束を数える時に使う（箱 / パック）。
강변=川のほとりや、川に沿っている土地（川辺 / 川岸）。
강북=川の北側の地域。／韓国では特に、ソウル特別市の漢江の北側にある地域を指す言葉。
강원도=大韓民国の北東部に位置する道（行政区画）。東は東海に面し、西は京畿道、南は忠清北道と慶尚北道、北は軍事境界線を挟んで北韓（北朝鮮）の江原道と接している。太白山脈が南北に伸びており山岳地帯が多く、雪岳山や鏡浦台などの有名な観光地が多い。
강의실=大学や塾などで、講師が学生に講義をするために設けられた部屋（講義室 / 教室）。
강의하다=学問や技術の原理および内容を体系的に説明して教えること。主に大学や塾などの教育機関で、教授や講師が学生に知識を伝える際に用いられる。
개개인=一人一人の個別の人。「人ごとに」の意味を表す。
개방되다=門や通路などが開く。／禁止されていた場所への出入りが許可される。／思想、文化、経済体制などが外部と交流できるように自由になる（開放される）。
거래처=商業的な関係を結び、品物やサービスを売り買いする相手。または、そのような場所（取引先）。
거북이=[動物] カメ目に属する爬虫類の総称。体は硬い甲羅に覆われており、足の甲が低く歩みが遅いのが特徴である。海や川、陸に生息し、寿命が非常に長い。／[比喩] 行動や仕事の処理が非常に遅い人を比喩的にいう言葉。
거스름돈=品物を買った後、出したお金から代金を差し引いて戻ってくるお金（お釣り）。
건넌방=韓屋（ハノク）や伝統家屋で、アンバン（奥の間）から大庁（板の間）を挟んで向かい側にある部屋。／家の構造上、アンバン（奥の間）の向かい側に位置する部屋を指す言葉。
건널목=鉄道と道路が平面で交差する場所（線路の脇に設置され、人や車が渡れるようになっている場所）。／道を渡れるように地面に白い線で表示されている場所（一般的に「横断歩道」とも呼ばれる）。
건설되다=建物、施設、橋などが造られたり、建てられたりする。／国家や社会の組織、体制などが新しく作られる。
건전지=化学エネルギーを電気エネルギーに変換して電気を発生させる装置。主に日常生活で携帯用電子機器や玩具などの動力源として使われ、一度使って捨てる一次電池を指す。
건조하다=水気や湿気が乾いてなくなる(乾燥している / 乾いている)。／雰囲気や表現、性格などが情愛や愛嬌がなく、無愛想だ(無味乾燥だ / そっけない)。
걷기=地面に足を交互に付けて移動しながら動くこと。／健康を維持したり体力を鍛えたりするために、一定の距離を足で移動する運動。
검정색=光が全くない状態の色。炭や墨の色のように暗くて濃い色を意味する。
겉모습=外から見える物の形や人の姿。／本質や内面とは異なる、外側に現れた姿。
겨자=アブラナ科の一年草または二年草。花は黄色で、実は丸くて小さい。／カラシの種を乾燥させて粉にした香辛料。ツンとくる辛味があり、冷麺、刺身、肉料理などに添えて食べる。
결석하다=学校や会議など、定められた場所に出ないこと（欠席する）。
결혼식장=結婚式を挙げられるように施設を整えた場所。特に本文で提示された文脈に従い、青い芝生や花で飾られた屋外結婚式場を意味することもある。
겹치다=複数の物体が重なり合う。／ある事柄や現象が、同じような時間に一度に起こる。／複数の物や姿が互いにかみ合ったり、重複したりする。
경고하다=危険な事や誤った事などをあらかじめ知らせて注意を促す。／スポーツの試合などで、規則に違反した選手に制裁の意味で注意を与える。／法規の違反や不誠実な態度に対し、行政機関や組織が公式に注意を与える。
경기도=大韓民国の中西部に位置する道。朝鮮半島の中央部にあり、ソウル特別市と仁川広域市を囲んでいる。道庁所在地は水原市であり、北部地域の行政の利便性のために議政府市に北部庁舎を置いている。
경비실=建物や施設の保安を維持し管理するために警備員が詰める部屋。アパートやビルなどの入り口に設けられ、出入者の確認や宅配便の受領などの管理業務を行う場所(警備室)。
경상도=朝鮮時代における八道の一つで、韓半島の東南部に位置する地域。慶州（キョンジュ）と尚州（サンジュ）の頭文字を取って名付けられた。／現在の慶尚北道と慶尚南道、および大邱、釜山、蔚山広域市を総称して呼ぶ言葉。
경영하다=企業や事業などを計画的に管理し、運営する。／基礎を築き、物事を段取りして進めていく。／（修養や実践の意味で）心身を磨きながら人生を営んでいく。
경제학=人間の生活に必要な財やサービスを生産、分配、消費する活動に関連する法則や現象を研究する学問。／社会の希少な資源をいかに効率的に管理し配分するかを追究する社会科学の一分野。
계산대=店やレストランなどで代金を支払ったり、会計をしたりするために設けられた場所（レジ / 会計カウンター）。
계약금=契約を結ぶ際、契約の証拠として相手方に前もって支払う金(手付金 / 契約金)。
계약서=契約이 成立したことを証明するために作成する文書。取引条件、権利と義務などを詳細に記録する。
고구려=紀元前37年、朱蒙（チュモン）が鴨緑江の支流である佟佳江（トンガガン）流域に建てた古代国家。扶余（プヨ）から南下した流移民勢力と地元の土着勢力が結合して建国され、領土拡張と強力な軍事力を背景に満州と朝鮮半島北部を支配し、北東アジアの強者として君臨した。668年、羅唐連合軍によって滅亡した。
고등어=サバ科に属する海水魚。体は細長い紡錘形で、背側は青色に波模様があり、腹側は銀白色を帯びる。タンパク質と脂肪が豊富な代表的な青魚である。／(比喩的) 食卓によく上がる庶民的な食べ物や、親しみのある魚を指す言葉。
고마워하다=他人が施してくれた好意や助けに対して、心の中でありがたく思う。（主に三人称の主語と共に使われ、感謝の気持ちを表に出したり表現したりすることを表す。）
고무신=生ゴムを原料にして作った靴。韓国では主に伝統的な靴(ファシン)や唐鞋(タンヘ)の形を模して作ったものを意味し、丈夫で水に濡れないため、かつて広く履かれていた。／(比喩的表現) 軍隊に行ったボーイフレンドを待つガールフレンドを指す言葉。
골치=頭や頭の中を俗っぽくいう言葉。／解決しにくかったり、厄介なことを比喩的にいう言葉。
곱하다=ある数や量を指定された回数만큼繰り返し足す。（算術の掛け算をする。）／（比喩的に）ある状態や程度をはるかに激しくしたり、増やしたりする。
공공요금=国や地方自治体、あるいは公共団体が一般大衆に提供するサービスの対価として受け取る料金。電気代、水道代、ガス代、公共交通機関の料金などがこれに該当する。
공공장소=社会のすべての構成員が自由に利用したり出入りしたりできる場所。（例：公園、図書館、地下鉄の駅など）
공과금=国や公共団体が国民に課す税金や公的な負担金を総称する言葉。（例：電気料金、水道料金、ガス料金など）
공동체=生活や目的、運命などを共にする人々の集団。または、彼らが属する社会(共同体)。／[社会学] 血縁や地縁などをもとに自然に形成された人間関係の結合体。
공손하다=言葉遣いや行動などが礼儀正しく、謙虚だ。
공연되다=音楽、舞踊、演劇、映画などを多くの人の前で公開すること。（「公演する」の被動詞）
공연하다=音楽、舞踊、演劇などを多くの人の前で披露する（公演する / 上演する）。
공연히=何の理由や実益もなく。または、いたずらに虚しく(無駄に / わけもなく)。
공통되다=二つ以上のものの間で、あるものが他と変わらず同じである。
공통적=二つ以上の対象や現象の間に、互いに重なったり同じ性質を持ったりすること。
공항버스=空港と市内の主要地点の間を専門的に運行し、乗客と手荷物を運ぶバス（空港バス）。
과소비=収入이나 身の丈に合わず、過度に品物を買ったりお金をたくさん使ったりすること（過剰消費 / 浪費）。
관계없다=対象の間に互いに関係したり、影響を及ぼし合ったりすることがない（関係ない）。／ある物事に関与したり関連したりしていない。／問題にするほどのことではない（構わない）。
관계있다=二つ以上の対象が互いにつながっていたり, 密接に関連している。
관광버스=観光客を乗せて観光地を巡るために運行するバス（観光バス）。
교통수단=人や荷物を運ぶのに利用される道具や方法。（例：自動車、汽車、船、飛行機など）
교통편=自動車、列車、船、飛行機などのように、人や荷物を運ぶ手段や方法（交通の便 / 交通手段）。
구경거리=興味や関心を持って見るに値する見もの（見世物）。／人の笑いものになるような、恥ずかしい、あるいは可笑しな出来事。
구별되다=性質や種類によって違いが現れる。／対象の正体や特徴が他と明確に分かれる。
구부리다=まっすぐなものを曲げる。／体の一部を曲げる。主に腰、膝、指などを曲げる時に使う。／（比喩的に）他人の意志や気勢を挫く。
구분되다=あるものと他のものが性格や特性によって互いに違いが生じるように分かれる。
구세대=新しい世代と対比される前の世代。主に考え方や価値観、生活様式などが保守的、あるいは伝統的な前の世代を指す言葉。／すでに活動の全盛期が過ぎたり、社会の中心から退いたりした世代。
구수하다=麦茶や味噌汁のように、食べ物の味や匂いが食欲をそそるほど香ばしくて奥深い。／言葉や話などが素朴で情味があり、聞いていて心地よくて面白い。
구조대=災害、事故、緊急事態などが発生した際、人を救助し保護するために組織された団体や部隊(救助隊)。
구청=特別市や広域市の「区」の行政事務を司る役所（区役所）。
국가적=国の全体に関係したり、国を単位としたりするもの。／国の地位や利益に大きく影響を及ぼす重大な性質のもの。
국경일=国家の慶事の日を記念するために法律で定めて祝う日。大韓民国では三一節、制憲節、光復節、開天節、ハングル記念日を指す。
국내선=一つの国の境界内（国内）で運航する航空機路線（国内線）。
국내외=国内と国外をあわせていう言葉（国内外）。
국민적=国民全体に関係したり、国民全体の性格や態度を帯びていること。／国を構成する国民として備えるべき共通の性質や背景に基づいていること。
국사=自分の国の歴史。／（主に固有名詞のように使われ）わが国である大韓民国の歴史。
국제결혼=国籍や民族が異なる男女が結婚すること。または、そのような結婚。
국제선=国と国の間を定期的に往来する航空機や船の航路。／国際航路を運航する航空機や船。
국제적=複数の国にわたったり、関係したりすること（国際的）。／世界のすべての国に共通したり、影響を及ぼしたりすること（国際的）。
굳히다=柔らかいものやふわふわしたものを硬くしたり、固めたりする。（「固まる」の使役動詞）／考え、決心、態度などを揺るぎないよう確実に決める。／権力、勝勢、地位などを確実に手に入れ、変わらないようにする。／体の筋肉や表情などを緊張させて強張らせる。
귀가하다=家へ帰る、または帰ってくる。
귓속=耳の内側(耳の中)。／(比喩的に) 他人に聞こえないように秘密裏に伝える言葉の通路。
그간=ある時から別の時までの間。「その間（そのあいだ）」の意味を表す。
그때그때=物事が起きたり、機会が来たりするたびに、その都度すぐ。／決まった原則がなく、状況の変化に応じてその時々で。
그래프=数値や統計資料の変化の様相や関係を点、線、面などで表した図。／(数学) 関数や方程式の関係を平面や空間上に表した軌跡。
그래픽=絵や写真、図形などを総称する言葉。主に印刷、広告、映画、コンピューターゲームなどで視覚的な効果を出すために使用するイメージやデザイン技法を指す。／コンピューターを利用して生成、操作、展示されるイメージやデータを視覚的に表現したもの。
그러게=相手の言葉に対して強い肯定や同意を表す時に使う言葉。／相手の行動に対して、残念な気持ちや軽い責めの意味を込めて同調する時に使う言葉。（主に「그러게 말이야」の形で使われる）／相手の言葉に対して強い肯定や同意を表す言葉。主に相手の言ったことが正しいと思う時に使う。／相手の現在の状態や結果に対し、以前自分が忠告した通りにしなかったことを咎めたり、残念に思ったりして言う言葉。
그럭저럭=そうしているうちに、いつの間にか。／十分ではないが、それなりに。または、どうにか我慢できる程度に。
그럴듯하다=かなりその通りだと認められる。(言葉や考えなどが理にかなっている、または妥당である)／外見が立派だったり、水準がかなり高く見えたりする。
그렇게=「そうに、そのように」の縮約形。状態、形、性質などがそのようであるさま。／（副詞的に使われ）それほど、そんなに。または、非常に、とても。
그루=木を数える単位。／草や木などの下部、またはその切り株。／農作物を一年に何回植えて育てるかという回数を表す単位。
그리로=聞き手に近い場所、または聞き手が指し示す場所へ。（「그곳으로（その場所へ）」の縮約形）／先に言及した場所や、会話の対象となっている方向へ。／ある状態や結果に至る方向へ。
그리워하다=会いたかったり、会いたいという気持ちが切実だ。ある対象や場所、時期などが心に深く残り、また見たい、あるいは取り戻したいと思う。
그림책=絵より絵を中心に構成された本。主に子供を対象とするが、最近では全年齢層を対象とした芸術的な性格の本も含まれる。
그사이=少し前から今この瞬間までの短い間。／決められたある時から別の時までの間。
그전=すぐその前の時。／今からかなり前の時。
극작가=演劇の台本である戯曲を専門的に書く人（劇作家）。
금강산=江原道の淮陽郡、通川郡、高城郡にまたがる山。太白山脈の北部に位置し、景色が非常に優れており、韓国を代表する名山に数えられる。季節によって名前が変わり、春は金剛山（クムガンサン）、夏は蓬萊山（ポンネサン）、秋は楓嶽山（プンアクサン）、冬は皆骨山（ケゴルサン）と呼ばれる。
금고=お金や貴重品を盗難や火災から安全に保管するために丈夫に作られた箱や部屋（金庫）。／団体や機関のお金を保管し管理する場所（金庫）。／法定刑の一つ。刑務所に収容はするが、労役は科さない刑罰（禁錮）。
금메달=運動競技や競演大会などで1位になった人に与えられる、金で作られたメダル(金メダル)。／比喩的に、ある分野や競争において最高の成果を収めたことを指す言葉。
금지되다=法令や規則、または命令によってある行為ができなくなること（禁止される）。
급증하다=数量や程度がにわかに、かつ急激に増えること(急増する)。
기념일=お祝いしたり記念したりすべきことがあるとき、そのことを記憶するために決めた日（記念日）。
기념품=ある事件、行事、場所などを長く忘れずに覚えているために、大切に持っておいたり残しておいたりする品物（記念品）。
기념하다=優れた人物や特別な事件、業績などを忘れずに心に刻む。／ある出来事を祝ったり記憶したりするための行事や活動を行う。
기대되다=ある事が実現することを望んで待つようになる（期待される）。／今後の活躍や成果に対して、信頼や希望を抱くようになる。
기도하다=神령이나 仏などの絶対的な存在に、願いが叶うように祈る。／ある事を成し遂げようと目論んだり、計画したりする。
기막히다=呆れて物も言えない、あまりにも意外で当惑する。／言葉にできないほど素晴らしい、非常に優れている。／程度がはなはだしい、極限に達している。
기성=すでに成り立っていること。または、すでに出来上がっているもの(既成)。
기성세대=現在の社会の中心となって社会をリードしている年配の世代。すでに社会的に地歩を固め、慣習や秩序を形成した世代を指す。
기술하다=ある対象や現象をありのままに記録して述べる。
기억되다=以前の姿、事実、知識、経験などが頭の中に残ったり、再び思い浮かんだりする（記憶される / 覚えられる）。
기억력=以前の印象や経験を意識の中に留めておき、後でっ思い出す能力（記憶力）。
기업가=企業に資本を出し、経営を担う人。新しい事業を構想し、冒険的な試みを通じて価値を創出する起業家精神を持つ人。
기업인=企業を経営する人。または企業の経営に従事する人(実業家 / 企業家)。
기지개=腕や足を伸ばして体をほぐすこと。主に眠りから覚めた時や、同じ姿勢で長くいた後に疲れを癒やすために行う。／(比喩的に) 沈滞していた勢力や現象が再び活발に起こる状態を指す言葉。
기초적=あることの底辺や土台となること。／物事や現象の最も中心となり、根本となる性質を帯びること。
기호=ある意味を表すために使われる符号、文字、標識などの総称（記号）。／一定の体系の中で情報を伝達したり、約束された意味を表示したりする手段。
기혼=すでに結婚していること。または、そのような人（主に女性に使われるが、性別を問わず既婚の状態を意味することもある）。
긴장감=心を沸き立たせ、気を引き締める感じ（緊張感）。／互いの関係が急迫しており、争いや戦争が起きそうな雰囲気。
긴장되다=心や体が引き締まり、不安になったり慎重な状態になったりする（緊張する）。／関係や状況などが穏やかでなく、争いや事故が起きそうな状態になる（緊張が高まる）。
길어지다=物の長さや空間の距離が以前より大きくなる。／時間や期間が予定より延長されたり、より長く続いたりする。
김포공항=大韓民国ソウル特別市江西区に位置する国際空港。仁川国際空港の開港前まで大韓民国の玄関口の役割を果たしており、現在は主に国内線と日本、中国、台湾などの近隣諸国を結ぶ短距離国際線路線を運航している。
깊숙이=内側や中の方へ深く入り込んだ状態で。／表に現れないよう、奥深いところまで。／考えや程度が非常に深く。
까다롭다=条件や方法などが複雑で厳格なため、扱うのが容易ではない。／人の性質や好みなどが円満ではなく、非常に厳格であったり、一風変わっている。
까치=カラス科の鳥で、体長は45cmほど、翼は黒く腹は白い。韓国では古くから、朝にこの鳥が鳴くと喜ばしい客が来るという吉鳥とされてきた（カササギ）。／正月（ソルラル）の前日である「カササギ正月」を略していう言葉。
깍두기=大根を小さく角切りにして塩漬けにした後、唐辛子の粉、ニンニク、ネギ、塩辛などの薬味で和えたキムチ。／（比喩的に）どちらの側にも入れない人、または両方の側に属して一緒に遊ぶ人のこと。主に遊びで人数が合わない時、チーム分けをせずに参加させる人を指す。
깜깜하다=光が全くないか、非常に不足していて何も見えないほど暗い。／ある事実や消息について全く知っていることがない。／将来や状況に希望がなく、暗담(暗澹)としている。／記憶が全く思い出せず、うっすらとしている（おぼろげだ）。
깜박하다=灯火や光が一瞬暗くなってから再び明るくなる。または、そのようにさせる。／目が一瞬閉じてから開く。または、そのようにさせる（まばたく）。／記憶や考えなどが一時的に消える（うっかり忘れる）。
깡패=暴力を振るって乱暴を働き、不当な利益を得る集団や人（ごろつき / ヤクザ / 暴力団員）。／（比喩的な表現）特定の分野で圧倒的な実力や外見、特徴を持っており、他のものを圧倒する対象を指す言葉。
깨끗해지다=汚いものがなくなり、清らかになったり明るくなったりする。／心や態度に偽りや過ちがなく、純粋になる。／複雑だったり乱雑だったりした状態が整理され、こざっぱりする。
깨물다=歯で強く押さえたり、噛み切ったりする。／唇などを歯で強く噛む。／(主に「歯を食いしばる」の形で) 悔しさや怒り、または決意を固める気持ちを堪える。／飴や氷など硬いものを口の中で砕く。
깨소금=炒ったごまをすりつぶして塩を混ぜた調味料。香ばしい味を出すのに使われる。／（比喩的）他人の不幸を見て、非常にすっきりして面白いという意味で使われる言葉。／（比喩的）新婚夫婦や恋人同士の仲が非常に睦まじく、楽しそうな様子をいう言葉。
깨어지다=固い物体がぶつかったり落ちたりして、いくつかの破片になる（壊れる / 割れる）。／考え、計画、希望、関係などが果たせず、崩れたり損なわれたりする（壊れる / ダメになる）。／静寂や平和な状態が乱れる。／記録や限界などが塗り替えられる（破られる）。
껴안다=両腕を広げて胸の中にぴったりと引き寄せる（抱き締める）。／ある事柄や問題を回避せず、自分のこととして受け入れる。／(比喩的に) ある思想や態度、人などを包容する。
꼼꼼히=隙がなく、非常に細心で精密なさま。／物事の内容を一つひとつ詳しく調べる様子。
꽂히다=倒れないように刺さったり、立てられたりする（「刺す・挿す」の被動詞）。／視線や目がどこか一箇所に固定される。／ある物や人に心が強く惹かれたり、夢中になったりする。／音や矢などが目標物に正確に刺さったり、伝わったりする。
꽃꽂이=生け花や木の枝などを形を整えて、花瓶や器に綺麗にさすこと。または、そのように装飾したもの（生け花 / フラワーアレンジメント）。
꽃무늬=花の形をかたどった模様(花柄)。
꽃씨=花が咲き終わった後に結ばれる、花を咲かせる植物の種。
끌어안다=腕を広げて胸の中に広く入れたり、ぎゅっと抱きしめる。／ある事や問題を他人に押し付けず、自ら引き受ける。／他の人や思想を受け入れ、味方にしたり包容する。
끼이다=広まった隙間や狭い空間の間に挟まったり、はまったりする。／霧、煙、埃などの現象が空気中に広がったり、覆ったりする。／垢や苔などがこびりついたり、生じたりする.／ある状態や部類に含まれる。
끼치다=(心配や迷惑などを) 他人に与えたり、感じさせたりする。(主に否定的な影響を与える時に使う)／影響や害を及ぼす。／(主に「鳥肌(소름)」と共に使われ) 恐怖や寒さ、または気味の悪い感じなどで肌にぶつぶつができる(鳥肌が立つ)。／(におい、気配などが) 一気に強く感じられる。／(影響、害、恩恵などを) 他人に与えたり及ぼしたりする。
나누어지다=一つの全体がいくつかの部分や破片に分かれる。／複数の人に分け前が均等に配分される。／考えや意見、階層などが互いに異なるものに分かれる。／（数学）ある数が別の数で割り切れる。
나들이=家を離れ、近い場所にしばらく行ってくること（お出かけ / 外出）。／ある仕事や行事に参加するために外出すること。
나무라다=人の過ちや足りない点を指摘して叱ったり、咎めたりする。／ある対象の状態や品質に非の打ち所がなく、優れていることを表す。（主に「申し分ない」という形で使われる）
나이프=食卓で料理を切ったり、肉などを切る時に使う西洋式のナイフ。／一般的に物を削ったり切ったりするのに使う小さなナイフ。
낚시꾼=釣りを専門にしたり、好んで行う人（釣り人 / 釣り師）。／(比喩的) 人を誘い出して利益を得たり、ひどい目に合わせたりする人。
낚싯대=釣りに使う長い棒。先に釣り糸を結んで魚を釣る道具。
난처하다=どうすることもできない状況にあり、立場が困っている。
납득하다=他人の言葉や行動、状況などを十分に理解し、肯定すること。また、ある事実や理屈について心から受け入れること(納得する / 飲み込む)。
낮아지다=高い所から低い所へ位置が変わる（低くなる）。／数値、程度、水準、価値などが以前より減ったり悪くなったりする（低下する）。／音の調子や音調が下がる。／身分や地位などが下がる。
내려앉다=高い所から低い所や地面に降りてきて、席を占めて座る。／上部が重さや衝撃に耐えられず、下に崩れたり沈み込んだりする。／（霧、暗闇、静寂などが）周囲に立ち込めたり、広がったりする。／心や気分が落ち着いたり、静まったりする colors.
내성적=表に現さず、内省する性質を持つこと。主に心の働きや性格が活발ではなく、静かな状態を指す(内向的)。／表に出さず、内に秘めて整える性質を持っていること。主に心の働きや性格が自分の内部に向かう状態をいう(内向的 / 内性的)。
내세우다=人を外や前、あるいは舞台の上に出させる。／ある人を代表や責任者に任命したり推薦したりする。／自分の主張、意見、価値などを他人の前で明確に示したり強調したりする。／物や現象を表に見えるようにしたり、提示したりする。
내용물=ある品物や容器、箱などの気に入っているもの(中身 / 内容物)。／外見や形式に対応する実質的な中身(中身 / 実質)。
내적=物事の内部や内面に属すること。／人の精神や心の中で行われること。
내쫓다=の中にいる人や動物を外に強制的に出させる。／職場や組織、集団から強制的に退かせたり、権利を剥奪したりする。／ある考えや感情などを心の中から消し去る。
내후년=来年の次の年。つまり、今年から2年後の年を指す。
낼모레=明後日（あさって）。／ある事柄や時期がすぐ近くに迫っていることを比喩的に言う語。／[副詞] 明日の次の日。「내일모레(明日あさって)」の縮約形。／[副詞] ある決まった時や期限が非常に近いことを比喩的にいう語。
냇물=川を流れる水（川の水 / 渓流）。
냉방=機械装置を利用して室内の温度を低く維持すること。または、その温度。／火を焚かないため冷えきっている部屋。
냉정하다=考えや態度が感情に流されず、落ち着いていて客観的だ。／人の態度に温かい情がなく、冷たい。
너그럽다=心が広く寛大で、他人の過ちや欠点をよく理解し包容する状態だ。／性品や態度に余裕があり、穏やかだ。
넉=(数量を表す言葉の前に使われ)「4つ」の意を表す冠形詞。後に来る単位名詞が「月(달)」、「両(냥)」、「石(섬)」、「尺(자)」などの時に使われる。
네티즌=インターネット(Internet)と市民(Citizen)の合成語で、サイバー空間で活動し、情報をやり取りしたり意見を交わしたりする人々を指す言葉。（ネットユーザー）
노려보다=鋭い目つきで相手をにらみつける。／ある対象や機会を熱心に手に入れようと鋭く伺ったり、待ち構えたりする。
노선도=バス、地下鉄、列車などが通る経路を線で表した図（路線図）。
노약자=老人や体が弱い人のこと。通常、高齢者、子供、妊婦、障害者など、社会的保護が必要な人々を総称する。
노트북=持ち運びができるように小さくて軽く作られた個人用コンピュータ。「膝の上に置いて使える」という意味に由来する。／(主に北朝鮮や英語圏で) 筆記や記録のためのノート。
녹음기=音を記録して再生できるように作られた装置。音エネルギーを電気信号や磁気信号に変えて、テープ、ディスク、メモリチップなどに保存する(録音機 / レコーダー)。
놀이공원=様々なアトラクション、見世物、便宜施設などを備え、人々に楽しさを提供する広い公園（遊園地）。
농사짓다=田畑を耕し、種をまいて、穀物や野菜などを育てて収穫する仕事をする。／(比喩的に) ある仕事の基礎を固め、真心を込めて結果を得ようとする活動をする。
농장=土地を耕して農業を営むために必要な設備と規模を備えた場所。／大規模に家畜を育てたり植物を栽培したりする施設。
높임말=話し手が聞き手や話に出てくる対象を敬って使う言葉（敬語）。
눈병=目に生じるすべての病気を総称する言葉。結膜炎、ものもらい、白内障など、目に発生する疾患を広く指す(眼病 / 目の病気)。
눈사람=積もった雪を丸めて人の形に作ったもの。普通、大きな雪玉を二つ積み上げた後、木の枝やボタンなどを使って腕や目鼻立ちを表現する(雪だるま)。
눈싸움=雪を丸めて相手に投げながら遊ぶ冬の遊び（雪合戦）。／二人が向かい合って座り、瞬きをせずに長く耐える勝負（にらめっこ）。
눕히다=人や動物を床や平らな場所に体を預けるようにする。（「横たわる」の使役動詞）／立っている、または立てられている物体を横にする。
느긋하다=心に余裕があり、急がない状態にある。／性格や態度が快활で、さっぱりしていて寛大だ。
느끼하다=料理に油気が多く、口に合わない（胃にもたれる / 油っこい）。／態度や話し方、外見などがさっぱりしておらず、人を欺くような気配があって見ていて不快だ（嫌味な / 脂っこい）。／胃がむかつき、すっきりしない気分である（胸がやける）。
늘이다=元の長さより長く伸びるようにする（例：ゴム、飴細工など）。／線などを延長して長く続けさせる。／下へ長く垂れ下がるようにする。
능동적=自ら進んで動いたり作用したりすること。または、自分自身で決定して動いたり、他人より先に立って仕事を処理したりする性質があること（能動的）。
늦겨울=冬の終わり。通常、陽暦2月から3月初めまでの間を指す(晩冬)。
늦여름=夏の終わりごろ。普通8月下旬から9月初旬の間を指す(晩夏)。
늦추다=決められた時間を後回しにする（遅らせる / 延ばす）。／速度を落として遅くする（緩める）。／ぴんと張った緊張状態を緩める。
다리다=アイロンや熱した物などで、布地のしわを伸ばしたり折り目をつけたりする。
다리미=熱や蒸気を利用して服や布のしわを伸ばしたり、折り目をつけたりするのに使う道具（アイロン）。
다물다=広げた口を閉じる。／（比喩的に）言うべき状況で言わなかったり、秘密を守ったりする。／（驚きや感嘆などで）開いた口を落ち着かせて閉じる。
다양성=形、色、形態、様式などが色々と多い特性（多様性）。
다양해지다=形、色、形態、種類などが多様な状態になる。
다운로드=ネットワークに接続された遠隔コンピュータやサーバから、データやファイルを自分のコンピュータやモバイル機器などに転送すること。「ネリョパッキ（ダウンロード）」と浄化して使われることもある。
다툼=意見が合わず論争したり、怒ったりして争うこと（争い / 喧嘩）。／ある対象や目的を手に入れるために互いに競い合うこと（争い / 競争）。
다행스럽다=思いがけず物事がうまく運び、運が良い。／見ていて幸いなところがある。
단발머리=耳の下やうなじのあたりでそろえて切った髪型。または、そのような髪型をした人（ボブヘア / おかっぱ）。
단정하다=服装や身なりなどが清潔で整っている。／態度や行儀がしとやかで正しい。／姿や状態が乱れなく整っている。
달콤하다=味が心地よく甘い。／匂いが芳しくて気分が良い。／感じや雰囲気が非常に安らかで楽しい。
달하다=数量や数値、程度がある限界や水準に達する。／目的地にたどり着いたり、目標を成し遂げたりする。／（ある状態や状況が）極限に達する。
담백하다=食べ物の味がしつこくなく、さっぱりしていて軽い。／性格や気立てに欲がなく、さっぱりしている。／色やデザインなどが派手でなく地味で、目に心地よい。
닷새=五日間。 (5日)／毎月五日。 (五日)
대기하다=ある時や機会を待つ。／命令や合図が出るのを待ちながら、準備された状態でとどまる。
대입=「大学入学」を略していう言葉。大学に入るために受ける試験や、その過程をひっくるめて指す。／(数学・論理学) 式や文章の中で、文字や変数の代わりに数値や他の式を代入すること。
대접하다=出迎えたり見送ったりして、客をもてなす。／料理を準備して客に振る舞う。／相手を一定の態度で待遇する（扱う）。
대중가요=一般大衆が好んで歌い、聴く歌。流行歌とも呼ばれ、主にマスメディアを通じて普及し、時代を反映したり大衆の情緒を込めたりする音楽形式を指す。
대중적=多くの人々（大衆）が楽しんだり利用したりする性質を帯びること。／一般大衆の好みや水準に合うこと。
대청소=家の中や建物全体を隅々まで綺麗に掃除し、拭くこと。／社会の不正や古い制度などを一気にすっきりと整理することを比喩的にいう言葉。
대학로=ソウル特別市鍾路区鍾路5街から恵化洞ロータリーに至る道。かつてソウル大学があった場所で、現在は小劇場や公演会場が密集しており、韓国の演劇文化の中心地であり、若者の街として知られている。
대한민국=アジアの東側にある民主共和国。韓半島とその附属島嶼から成り、憲法上、国民が主権を持つ。（本辞典の意味のほかに、提示された文脈に応じて「大韓民国国民」を総称することもある。）／アジア北東部にある民主共和国。朝鮮半島とその付属島嶼から成り、1948年に政府が樹立された。略称は「韓国」である。
더더욱=「さらに、もっと、いっそう」を強調して言う語。水準や程度がすでに高い状態で、さらに激しくなることを表す。
더럽히다=清潔な物や場所を汚したり、不潔にしたりする。／名誉、名前、面目などを汚したり、傷つけたりする。／純潔や貞操を失わせる。
덕수궁=ソウル特別市中区貞洞にある朝鮮時代の王宮。本来は成宗の兄である月山大君の邸宅であったが、文禄・慶長の役の際に宣祖が仮の住まいとして使用し「慶運宮」と呼ばれ、後に高宗が移り住んだことで「徳寿宮」に名称が変わった。伝統的な木造建築と西洋式の石造建築が共存する独特な様式を呈している。
데치다=野菜や肉などを沸騰したお湯でさっとゆでる。（完全に火を通さず、表面だけを軽く加熱したり、しんなりさせたりすることを意味する。）
도무지=どうしても。いくらどうしても。（主に否定語と共に使われ）到底どうすることもできない、あるいは全く分からないことを表す言葉。／全く。あるいは、全然。（否定的な状況や状態を強調する時に使われる。）
도움말=ある事をするのに役立つように教えたり助言したりする言葉（助言 / アドバイス / ヒント）。／コンピュータープログラムやウェブサイトなどで、利用者の理解を助けるために機能や使い方を説明した内容（ヘルプ）。
도장=木、角、水晶、金属などに名前を彫り、個人や団体を証明するために使うもの（印鑑 / はんこ / 印章）。／書類や文書に印鑑を押した跡。／(比喩的) ある事実や約束を確定させることを意味する。
도쿄(동경)=日本の首都。日本列島の本州中央部、江戸時代以来、日本の政治、経済、文化の中心地であり、世界的な大都市である。
독감=インフルエンザウイルスによって引き起こされる、伝染性の強い急性呼吸器疾患。一般的な風邪よりも症状が重く、高熱、筋肉痛、悪寒などを伴う。
독립하다=他人に依存したり縛られたりせず、独り立ちすること。／一国が他国の統治や干渉から脱して主権を持つこと。／経済的、あるいは生活面で親や保護者から自立し、自ら生計を立てていくこと。／一つの団体や機関が上級機関から分離し、独自の権限を持つこと。
독신자=配偶者がおらず一人で暮らす人。（未婚、または離婚や死別後に一人で過ごす人を総称する。）
독일어=ドイツ、オーストリア、スイスの一部地域などで使われている、インド・ヨーロッパ語族のゲルマン語派に属する言語。
독창적=他人のものを模倣せず、自分一人の力で新しく作り出したもの（独創的）。／既存の方式や枠組みから外れ、独特で斬新な性質を持つこと。
돌려받다=貸していた物やお金などを再び手に入れるようになる（返してもらう / 取り戻す）。／譲っていた権利、資格、あるいは投入した真心などを再び取り戻すようになる。
돌려보내다=借りたり持っていたりした物を元の持ち主に再び返す。／人を元いた場所へ再び行かせたり、帰らせたりする。／届けられたり伝達されたりした物を受け取らずに送り返す。
동남아=アジアの東南部地域を指す言葉。ベトナム、タイ、インドネシア、フィリピンなどの国家が属している地域を意味する。
동대문시장=ソウル特別市鐘路区と中区にまたがる大規模な伝統市場および複合ショッピングモールの密集地域。衣類、生地、副資材などファッション関連品目の生産と流通が中心となる韓国最高のファッションの中心地である。
동서=東と西をあわせていう語（東西）。／東洋と西洋をあわせていう語（東洋と西洋）。／姉妹の夫同士、または兄弟の妻同士が互いを呼んだり指したりする言葉。
동서남북=東、西、南、北の四つの方向。すなわち、あらゆる方向や全世界を指す言葉。
동양인=アジア大陸の東部および南東部地域にルーツを持つ人々を総称する言葉。
동영상=コンピューターやテレビなどの画面を通じて動く画像や映像を意味する(動画)。／静止した写真や絵を連続的に見せることで、動いているように見せた映像作品。
동창회=同じ学校を卒業した人々が集まって親睦を深める集まり。または、その集まりの団体（同窓会）。
동호회=同じ趣味や目的を持つ人々が集まって作った集まり（同好会 / サークル / クラブ）。
되도록=事情が許す範囲内で、できるだけ。ある状態や行動を可能な限り最大限の程度にしようとする時に使う。
되돌아보다=首を回して後ろを見る(振り返る)。／過去の出来事を思い返し、顧みる(振り返る)。
되살아나다=失われた食欲、元気、感情などが再び湧き上がる。／死にかけていたり、しおれていたものが再び活気を帯びたり生き返ったりする。／忘れていた記憶や考えなどが再び思い浮かぶ。
되풀이=同じことや言葉を何度も繰り返すこと。
되풀이되다=同じ事や現象が何度も繰り返し起こる。／同じ言葉や動作が繰り返される。
두통약=頭痛の症状を和らげたり治療したりするために飲む薬（頭痛薬）。
뒤떨어지다=後ろに残されたり、隊列から遅れたりする。／実力や水準などが他の対象に比べて低い状態になる。／時代や流行、流れなどに合わず、遅れる（時代遅れになる）。
드나들다=人や車両、物などが、ある場所に出たり入ったりする。／ある場所に頻繁に行ったり、滞在したりする。／穴や隙間などを通して空気や光などが出入りする。
드라이=ヘアドライヤーを使って髪を乾かしたり、好みの形に整えたりすること。／「ドライクリーニング」の略語。水を使わず、有機溶剤を使って衣類を洗濯する方法。
드라이브=気分転換や見物のために、車に乗って走ること（ドライブ）。／球技（テニス、卓球、ゴルフなど）で、ボールに回転をかけて遠くへ飛ばす打ち方（ドライブ）。／コンピューターで補助記憶装置を駆動する装置（ドライブ）。／ある目標を達成するために、強力に推進する組織的な運動。
드라이어=電気を利用して温風や冷風を吹き出し、濡れた髪を乾かしたりヘアスタイルを整えたりするのに使う器具。「ヘアドライヤー」の略語。
드라이클리닝=水を使わず、有機溶剤を使用して衣類の汚れを落とす洗濯法。主に毛織物やシルクなど、水洗いすると変形しやすい衣類に使用される。
드러내다=隠れていた、あるいは見えなかったものを見えるようにする（さらけ出す / 表す）。／考え、感情、事実などを表に出す（示す / 表出する）。／（主に体つきや輪郭などを）はっきりと見えるようにする（露出する）。
드레스=西洋式の女性用の上着を総称する言葉。主に上衣と下衣が一つに繋がった形を指す。／演奏会、舞踏会、結婚式などの特別な行事や礼式で、格式を整えて着る華やかな女性服。
든든하다=心が満たされたようで虚しさがなく、力強くて不安がない（心強い）。／物や体格などが丈夫でがっしりしている。／食べた物が腹を十分に満たしてくれ、すぐにはお腹が空きそうにない。
들여놓다=外から中へ移し入れる（運び入れる）。／家具や家電製品などを新しく買ったりもらったりして家に備え置く。／ある事柄や状況に関わらせたり、足を踏み入れさせたりする。
들이마시다=息を体の中に吸い込む。／液体や気体などを口や鼻を通じて内部に吸い込む。
들이켜다=水や酒などの液体を一気に飲む。／空気や息を中へ強く吸い込む。
들키다=人に見られないようにしようとした事や、隠してきた事実が人に知られたり目に留まったりする（見つかる / ばれる）。
등록하다=記録や名簿に名前を載せること。／行政機関や公共団体に、一定の事項を法律的に記録し、届け出ること。／学校や塾などに籍を置いて勉強するために必要な手続きを済ませること。
등산복=山に登る時に着るのに便利なように作られた服。防風、防水、通気性などの機能性を備えているのが特徴である。
디지털=データを0と1という二進法の数値に置き換えて処理したり伝送したりする方式。／アナログと対比される概念で、情報を不連続な数字で表現する技術およびその方式を使用すること。
따님=他人の娘を敬って呼ぶ言葉（お嬢さん / お嬢様）。
따르릉=電話機や自転車、時計などのベルが鳴る音。またはその様子。
따스하다=暖かな気配がある。「따뜻하다(暖かい)」より柔らかく、情愛のある感じを与える。／心遣いや態度、雰囲気などが優しくて睦まじい。
따지다=物事の善悪や原因、理由などを明確にするために、細かく問いただしたり調べたりする。／数値や利益、計算などを細かく数えたり比較したりする。／関係や資格などを明らかにして区別する。
딸아이=自分の娘をへりくだって言う言葉（娘 / 愚娘）。／幼い娘をかわいがって呼ぶ言葉（娘っ子 / 幼い娘）。
떠들썩하다=雰囲気が非常に落ち着かず、騒がしい。／噂や評判などが世間に広まり、非常に騒がしい。
똑똑히=話し声や文字などがかすかではなく、非常にはっきりと。／意識や記憶、考えなどが鮮明で確実に。／物の形や姿がぼやけず、はっきりと。／正誤や事実かどうかが食い違うことなく明白に。
뚜렷하다=姿や形がぼんやりせず、非常に鮮明だ（はっきりしている）。／考えや記憶、意識などが非常に確実で明白だ。／ある現象や違いが、他と確然と区別できるほど強い。
뚫리다=穴が開く。（ある物体の表面を貫通して空きスペースができる。）／塞がっていたものが通じるようになる。（道、通路、詰まった状況などがすっきりと開ける。）／なす術もなくやられたり、限界が崩れたりする。（守備網や対策などが役割を果たせなくなる。）
뛰놀다=元気に走り回って楽しく遊ぶ。／(比喩的に) ある事物が躍動感をもって動いたり活躍したりする。
뛰어오르다=低い所から高い所へ身を躍らせて上がる。／床から体を上へ跳ね上がらせる。／物価や数値などが急激に大幅に上がる。
라운드=ボクシングやレスリングなどの試合で区切られた1回の時間（ラウンド）。／ゴルフ競技でコースを1周すること（ラウンド）。／複数の段階で進められる事柄や交渉の一段階、または番（ラウンド）。
라이벌=同じ分野でお互いに勝とうとしたり、追い抜こうとして競い合う対象。またはそのような関係。「競争者」や「ライバル」と純化して呼ぶこともある。
라인=線または紐：境界や区分を表す細い線。／生産工程：工場で製品を製造するために設備が配置された一連の過程。／系譜または人脈：政治、社会、組織内で共通の利害関係や背景をもとに形成された勢力や縁。／電話または通信網：通信接続のための回線。／シルエット：人の体つきや服の外観をなす線。
라켓=テニス、バドミントン、卓球、スカッシュなどの競技でボールやシャトルコックを打つために使用する打具。木や金属、炭素繊維などで作った枠にネットを張ったり、ラバーを貼ったりして作る。
레이저=[物理] 誘導放出による光の増幅現象を利用して得られる強力で単色性の光。または、その光を出す装置。直進性が強くエネルギー密度が非常に高いため、通信、医療、産業加工、武器など様々な分野で活用される。
레저=仕事や家事などの日常的な義務から離れ、休息、楽しさ、自己啓発のために自由に利用できる時間、またはそのような時間に行われる娯楽やスポーツ活動を意味する。
렌터카=一定の料金を払い、期間を決めて借りて使う乗用車。「ピリムチャ（借り物車）」と純化して呼ぶこともある。
로그인=コンピュータシステムやネットワーク、特定のウェブサイトなどに接続するために、ユーザーIDとパスワードを入力して使用権限を得る手続き。
로터리=交通が混雑する交差点で車両が円滑に通行できるよう、中央に円形の島を設けて車両が回って進むようにした円形交差点（ロータリー）。／国際的な親睦と社会奉仕を目的として組織された団体「ロータリークラブ」の略称。／機械装置などで回転式で作動する方式や部品。
리모컨=「リモートコントロール(remote control)」の略。テレビ、エアコン、オーディオなどの電子機器を離れた場所から操作できるようにした無線制御装置。
마땅히=理に照らしてみて当然に（当然 / 当たり前に）。／条件や状況に適切に（相応に / 適切に）。
마요네즈=卵黄、食用油、酢、塩、胡椒などを混ぜて作ったとろみのあるソース。主にサラダやサンドイッチなどに添えて食べる。
마우스=コンピュータやデジタル機器でカーソルを移動させたり、特定のコマンドを実行したりするために、手のひらに入れて操作する入力装置。
마크=ある対象を表記したり区別したりするために付ける記号、紋様、または跡。／スポーツの試合で相手選手を近くで防御したり監視したりすること。／商品の品質や商標を表す認証またはロゴ。
막대기=細くて長く、硬い木や竹、金属などの棒切れ。／(比喩的に) 非常に痩せていたり、体が硬い人を指す言葉。
막연하다=内容や対象がはっきりせず、ぼんやりしている。／将来や考えなどが、見通しがつかずはるか遠くに感じられる。
만세=願いや祝賀、歓呼の意を表すために、両手を高く上げて叫ぶ言葉（万歳）。／永遠に変わることのない長い年月。／(比喩的に) 物事が完全に終わってしまったり、希望がない状態を指す言葉。
만족감=期待したり望んだりした通りになり、心に満ち足りた感じ。
만화가=漫画を描くことを職業とする人(漫画家)。
만화책=絵と台詞、文章などを組み合わせて作った漫画が載っている本（漫画本）。
말끔히=塵一つなく、きれいでさっぱりしている様子。／未練や痕跡がなく、すっきりと。
말다툼=言葉で理非を問い詰めたり、相手の過ちを問い詰めたりする争い（口喧嘩）。
말하기=考えや感情を口に出して声で表現すること（話すこと / スピーキング）。／言語学習や評価において、口語を通じて意思を伝える能力を測定する領域。
망가지다=壊れたり傷んだりして使えなくなること。（例：機械、家具など）／体や心の状態、あるいは計画や状況などが悪くなり、まともに機能しなくなること。／（俗語）体面や魅力が損なわれたり、恥をかいたりする状態になること。
맞벌이=夫婦が共働きをすること。また、その仕事。
맞춤법=言葉を該当言語の規定に従って表記する方法。主に単語を書く際、字母の構成や分かち書きなどが定められた規則に従うようにする体系を意味する。
맞히다=問題に対する正解を正しく答える。（正解を当てる）／撃ったり投げたりした物体を目標物に当てる。（命中させる）／雪、雨、むちなどを体に直接浴びたり打たれたりするようにする。／針や注射などを体に打たせる。
매스컴=「マス・コミュニケーション（Mass Communication）」の略語で、新聞、放送、雑誌、映画などの大衆媒体を通じて、不特定多数の大衆に情報を伝達する社会的伝播現象や手段を指す言葉。
매운맛=唐辛子やニンニク、コショウなどのように、舌を刺すようでヒリヒリする味（辛味）。／（比喩的に）ひどく厳しい目に遭わせること。または、そのような経験。
매운탕=魚に粉唐辛子、コチュジャン、にんにく、ねぎなどの辛い調味料と、大根、春菊などの野菜を入れて辛口に煮込んだスープ料理。主にタイ、ニベなどの海水魚や、ナマズ、コウライケツギョなどの淡水魚が使われる。
머리말=本や論文などの書き物で、本文の前に書き、著者の意図や目的、謝辞などを記した文章。（序文 / まえがき）。／物事の始まりや、開始される部分。
머뭇거리다=言葉や行動を思い切ってできず、しきりにためらう。／物体や現象が前に進まず、一箇所でしきりに滞る（遅滞する）。
멀쩡하다=病気や怪我がなく、体が非常に丈夫だ（元気だ / 健康だ）。／意識がはっきりしていて、しっかりしている（正気だ）。／物が壊れたところがなく、完全な状態だ（無傷だ / そのままだ）。／見た目はもっともらしいが中身はそうでない、あるいは当然あるべき問題がないことへの疑念を表すときに使う。
멋대로=いかなる格式や規則にも縛られず、自分の思い通りに。／他人の立場や考えを考慮せず、自己中心的に。
멍멍=犬が吠える声を表す言葉（ワンワン）。／犬が吠える声を真似る言葉。
메뉴판=飲食店で客が料理を選択できるように、料理の名前や価格などを記した板や冊子（メニュー / お品書き）。
메모지=忘れてはいけない短い内容を書き留めておくために作られた紙（メモ用紙）。
멜로디=[音楽] 高低と長短のある音の流れがリズムと結合して現れる旋律。通常、音楽の3要素（リズム、メロディー、和声）の一つに数えられ、曲の主題となる調べを意味する。
면접관=面接試験で応募者に質問をして実力を試したり、人物などを評価する人（面接官）。
면허증=特定の仕事ができる資格や能力を備えていることを公式に証明する文書（免許証）。
명령어=[コンピュータ] コンピュータシステムやプログラムに特定の作業を実行するように指示する記号や文字列。／[言語] 他人に何かをさせたり、要求したりする内容を含んだ言葉。
모조리=一滴も漏らさず、すべて。（主に数量や対象を残さず合わせる時に使う。）
모집하다=人や物資などを一定の条件に従って集める(募集する)。
모퉁이=曲がって折れ曲がっている部分（曲がり角 / 角）。／辺鄙な場所や隅の方（外れ / 隅）。
목구멍=喉の入り口から食道と喉頭に至る通路のこと。／(比喩的に) 食べていくための生計の手段のこと。
목마르다=水分がなく口やのどが渇いて、水を飲みたい状態だ。／ある対象や物事を切に望んでいる状態を比喩的にいう言葉。
목적지=行く先として決めておいた場所（目的地 / 行き先）。／ある事や行動を通じて到達しようとする最終地点や目標（目的地 / ゴール）。
몰라보다=以前知っていた人や物を見ても、それが誰なのか、あるいは何なのかが分からない。／ある対象の価値や能力などをまともに把握したり評価したりできない。／（主に「몰라보게」の形で使われ）状態や姿が以前と比べて極端に変わる。
몰리다=物体や人、力などによって、隅の方や一定の方向に押しやられる。／ある状況や都合が良くない状態や境遇に陥る。／犯人や過ちを犯した人だと誤解されたり、指名されたりする。／ある時期や場所に、人・事・物などが一斉に集中する。
못나다=顔立ちが平凡でなく、見苦しい（不細工だ）。／性格や能力が足りなかったり、愚かだ。
무관심하다=ある事柄や人に対して、関心や興味がない（無関心だ）。
무관하다=関係がない。ある物事や現象が、他のものと何の関係もない状態を意味する。
무사하다=何の事故や障りがない。／大きな支障がなく平穏だ。
무사히=何の事故や差し支えもなく、平穏で安全に。
무서워하다=恐ろしいと感じる。ある対象や状況に対して恐怖を感じる（怖がる / 恐れる）。
무용가=舞踊を専門的にする人。または舞踊に優れた技量を持つ人（舞踊家 / ダンサー）。
무의미=何の意味や価値もないこと（無意味）。／言葉や文章の意味がはっきりしなかったり、理解できないこと。
무의미하다=何の意味や価値もない。／言葉や文の意味がまともに伝わらなかったり、要領を得なかったりする。
무책임=引き受けた仕事や義務を重要視せず、誠実に果たさないこと。また、そのような態度（無責任）。
무책임하다=引き受けた仕事や義務を疎かにしたり、全く顧みたりせず、責任感がない。
묵묵히=言葉なく、しっかりとした様子で。／何も言わず静かに。
문구=特定の考えや内容を表現するために書かれた文の節目（文句 / 文言）。／広告や宣伝などで人目を引くために短く強烈に作られたフレーズ（キャッチコピー / 文句）。
문구점=学用品、事務用品など、文字を書いたり事務作業をしたりするのに必要な品物を売る店（文房具店 / 文具店）。
문밖=門の外側。／家の中や特定の区域の外の世界を比喩的に言う言葉。／(歴史的意味) 都の城門の外。
문방구=学用品や事務用品などを売る店（文房具店）。／ノート、鉛筆、消しゴムなど、学校やオフィスで使う物の総称（主に「文具」と混用される）。
문제되다=ある事態や現象が批判や検討、論争の対象になる(問題になる)。／事故やトラブルが発生し、困った状態に陥る(支障をきたす)。
문학적=文学の性格を持っていたり、文学に関すること。／物事や現象を見る態度が情緒的で芸術的であること。
물들다=色が染み込んだり、移って付着したりする（染まる）。／ある環境や思想、習慣などに影響を受けて変わる（染まる / かぶれる）。
물러서다=両足を後ろに踏み出し、現在いる位置から後ろへ移動して立つ。／行っていた仕事や就いていた職位を辞めて退く。／相手の勢いに押されて屈したり、譲歩したりする。
물리다=口を開けて歯で噛まれる。主に犬や蛇などの動物に危害を加えられる場合を指す。／蚊や南京虫などの虫に刺されたり、針を刺されたりする。／出すべき金銭や物品を支払わせたり、責任を負わせたりする。
물소리=水が流れたり、落ちたり、波打ったりする時に出る音(水の音)。
뭉치다=散らばっている物体が一つに集まって塊になる。または、そのようにする。／多くの人の心や力が一つに合わさる。／筋肉などが硬くなる（こる）。
뭣=「무엇（何）」の縮約形。知らない事実や事物を指す代名詞。／はっきりと言い表せないある事柄や状況を指す言葉。／（反語的に使われ）大したことのない、または否定的な対象を指す言葉。
뮤지컬=歌、ダンス、演技、そして音楽が結合された総合舞台芸術の一形式。劇的な展開のために台詞だけでなく、歌とダンスが重要な比重を占める公演物（ミュージカル）。
미국인=アメリカの国籍を持つ人。またはアメリカ生まれの人。
미끄럽다=表面がつるつるしていて手が滑りやすかったり、足を踏み出した時にバランスを取りにくかったりする(滑りやすい)。／性質や態度がしっかりしておらず、人の目を欺いてごまかそうとするところがある(ずる賢い / 食えない)。
미성년자=満19歳に達していない人。法律的にまだ成人になっておらず、保護と指導が必要な人を指す。
미역=ワカメ科に属する褐藻類の海藻。体は葉、茎、根の区別がはっきりしており、長さは1〜2メートルほどで、食用として広く使われる。カルシウムとヨウ素が豊富で、特に産後の肥立ちや誕生日にスープにして食べる。
미용사=一定の資格を持ち、客の髪を整えたり、肌や爪などの手入れをすることを職業とする人（美容師）。
미장원=主に女性の髪を整えたり化粧をしたりするなど、外見を整えてくれる施設。「美容室（ミヨンシル）」と浄化して呼ぶこともある。
미지근하다=温度が冷たくもなく熱くもない。（主に液体や物体の温度を表す）／態度や性格、仕事の処理が断固としていなかったり徹底しておらず、はっきりしない。
민속놀이=古くから民間に伝わり、主に名節や祭りの時に楽しむ固有の遊び。（例：ユンノリ、板飛び、チェギチャギなど）
믿어지다=ある事実や言葉が本当だと思われたり, 確信が持てたりする。（「信じる」の受動形）／ある人や対象に対する信頼が生まれる。
바래다주다=行く人を一定の目的地まで送っていく。または、行く人を見送ってあげる。
바이러스=[生物] 細菌よりサイズがはるかに小さいため一般的な顕微鏡では見ることができず、生きた細胞内でのみ増殖できる非細胞性の感染症原因体。毒素という意味のラテン語「ビルス（virus）」に由来する。／[情報・通信] コンピュータのプログラムやデータファイルに侵入して、これらを破壊したり正常な作動を妨げたりする悪性コードやプログラム。
반대말=ある単語と意味が互いに正反対だったり、対立関係にある単語。「反意語」ともいう。
반대쪽=ある方向や位置から向かい側になる方（反対側）。／ある事柄や意見などが基準となるものと互いに逆らったり、食い違ったりする方。
반대편=ある方向や位置で、向かい側にあたる場所（反対側 / 向かい側）。／ある意見や立場と正反対になる側（反対側 / 反対派）。
반짝반짝=小さな光が次々と現れたり消えたりしながら、明るく輝く様子。／瞳が澄んでいて、生き生きとしている様子。／頭の中に考えがパッと浮かぶ様子。／物がとてもきれいで、つやつやと光沢がある様子 (ぴかぴか)。
반창고=傷口に塗る薬を固定したり、傷を保護するために、布や紙などに粘着剤を塗って作った医療用消耗品（絆創膏）。
발꿈치=足の後ろの下の部分（かかと）。
발달되다=身体や知能などが大きくなったり成熟したりする。／社会、経済、技術、文明などの水準がより高い状態に進んだり、規模が大きくなったりする。／筋肉や臓器などの機能が強くなったり、特定の器官がその役割を十分に果たせる状態になったりする。
발음하다=言葉の音を出す。子音や母音などを音声器官を通じて特定の音として表す(発音する)。
발전되다=より良く、より優れた状態や、高い段階へと進むようになる。（物事や状態の質的・量的向上）／ある事柄や事態の規模が大きくなったり、新しい局面に入ったりするようになる。（状況の変化や拡散）
발표회=研究結果や芸術作品、実力などを人前で初めて公開したり披露したりする集まり（発表会）。／作曲家や演奏家が自身の作品や演奏の実力を聴衆に披露する音楽公演（発表会 / リサイタル）。
밝아지다=光の量が多くなり、周囲が明るくなる。／顔色や表情、雰囲気などが楽しく活気に満ちたものに変わる。／知覚や知恵がつき、道理をよくわきまえるようになったり、視野が広がったりする。／文明や文化の水準が高くなる。
밟히다=「踏む（足を下に踏み出して押さえる）」の被動詞。足の下に置かれて踏まれる。／（比喩的に）他人に押さえつけられたり、見下されたりする。／対象が心や目に引っかかって何度も思い浮かぶ。
밤하늘=夜の空。主に月や星が浮かんでいる暗い状態の空を指す。
방송하다=ラジオやテレビを通じて、音声や映像を電波で送り出す（放送する）。／ある事実を広く知らせる。
방지하다=ある事柄や現象が起きないように防ぐ（防止する）。
배낭여행=必要な物品をバックパックに詰め、背負って出かける旅行。主に低費用で現地の文化を身近に体験したり、自由な日程を楽しんだりするために行く。
배추김치=塩漬けにした白菜に粉唐辛子、にんにく、ねぎ、塩辛などの薬味を和えて作った韓国の代表的な発酵食品。
배터리=電流を発生させて電気エネルギーを供給する装置。主に化学エネルギーを電気エネルギーに変換し、充電して再利用できる二次電池を含む。／(比喩的表現) 活動や生活の活力や原動力を指す言葉。
백두산=韓半島で最も高い山（海抜2,744m）。咸鏡南道と咸鏡北道、そして中国吉林省の境界に位置する休火山である。山頂に巨大な火口湖である「天池」があり、韓民族の霊山であり聖地とされる。
백색=白い色。雪やミルクの色のように明るくて清潔な色のこと。／(比喩的に) 純潔、平和、あるいは保守的、または反革命的な傾向を象徴する色。
백인=肌の色が白い人。人類を肌の色によって分ける際の一つの部類で、主にヨーロッパや北アメリカなどに居住する人種を指す(白人)。
백제=韓国の古代三国の一つで、紀元前18年に温祚（オンジョ）が漢江流域に建国し、660年に滅亡するまで輝かしい文化を花咲かせた国。／扶余（プヨ）系の遺民を中心に建国され、海上貿易と洗練された芸術文化を通じて古代日本の文化形成にも大きな影響を与えた。
번갈다=あることを一人が続けず、何人かが交代でする。／二つ以上の物事や現象が順々に代わりながら現れる。
번역하다=ある言語で書かれた文章を、別の言語の文章に移し替える（翻訳する）。
번호표=順番や順序を示す番号が書かれた紙や札。主に銀行、官公庁、食堂など待ち人数が多い場所で順番を決めるために使用する(整理券 / 番号札)。
번화하다=にぎやかで華やかだ。主に通りや地域に人が多く、商業施設が密集して活気に満ちた状態を意味する。
벗어나다=ある範囲や境界の外に出る。／拘束、規制、状況などから自由になったり解放されたりする。／定められた道、原則、予想などから外れる。
베란다=建物の上層階が下層階よりも面積が狭いために生じた、下層階の屋根部分にあたるスペース。一般的にバルコニーやテラスと混同されがちだが、下の階の屋根を活用した空間である点が特徴。／アパートなどの共同住宅で、居間や部屋の外側に付いている緩衝空間を総称する言葉。
베이징(북경)=中国の首都。華北平原の北端に位置し、中国の政治、文化、交通の中心地である。紫禁城、万里の長城など多くの歴史的遺跡がある古都である。
베풀다=行事を催す。 (主に宴会やパーティーなどを開く時に使う)／人に金品や助けを与え、恩恵を受けさせる。 (施す)／(稀に) 布団や敷物などを敷く。
벽시계=壁に掛けて使用する時計。主にサイズが大きく、インテリア小物としても活用される。
변덕스럽다=言葉や行動、感情などが二転三転し、頻繁に変わる様子がある（気まぐれだ / 変わりやすい）。
변신=体の形や形態を変えて、別の姿で現れること。／人が持っていた態度、性格、職業などを以前とは違うものに完全に変えることを比喩的にいう言葉。
변화되다=物の形、性質、状態などが以前とは異なって変わるようになる。（「変化する」の受動形）
별말씀=思いがけない言葉や不当な言葉。主に相手の褒め言葉や感謝、謝罪に対して、謙虚に遠慮したり否定したりする時に使う。／(主に「별말씀이 없으시다」の形で使われ) 特にこれ以上おっしゃる言葉がないこと。
병아리=鶏の雛。卵からかえって間もない幼い鶏を指す。／ある分野に入門したばかりで、知識や経験が少ない人を比喩的にいう言葉。／子供を可愛く呼ぶ言葉。主に黄色い服を着た幼稚園児たちを指す時に使われる。
보내오다=手紙、品物、連絡などを自分や自分のいる場所に送ってくれる。／ある目配せや態度、気持ちを自分に示す。
보름달=旧暦の十五日の夜に出る丸い形の月。月が太陽の反対側に位置し、地球から見たときに月の全面が明るく見える状態。望月（もちづき）ともいう。
보리차=皮付きの麦を炒って水に入れ、煮出した茶。韓国で喉の渇きを癒やすために、水の代わりに日常的に飲まれる伝統的なお茶。
보수적=新しいことや変化を積極的に受け入れるより、伝統的な慣習、制度、価値観をそのまま維持し守ろうとする傾向があること。／（主に冠形詞として使われ）態度や考えが急進的でなく、控えめで慎重なこと。
보완하다=足りない部分を補って完全なものにする(補完する / 補う)。
보자기=物を包んだり覆ったりするために作られた四角い布。／(比喩的に) ある事実や内容を隠したり、収めたりする手段を指す言葉。
보존하다=よく保護して維持し、残す。物事や状態が変わらないように元のまま守る。
보충하다=足りないものを補って埋める。／人員や物資が足りない分を補って充当する。
보행자=道を歩いていく人（歩行者）。
복사기=文字や絵、写真などを紙に元の姿のまま写し出す機械（コピー機）。／文字、絵、写真などを元の姿のまま紙に写し出す機械（コピー機）。
복숭아=桃の木の実。形は丸く、表面に細い毛があり、味は甘酸っぱい。水分が多く果肉が柔らかいため、夏の代表的な果物とされる。／(比喩的に) とても赤みがかってきれいな肌の色や顔を指す言葉。
복습하다=学んだ内容を復習し、身につける。
본=話し手と直接関連がある対象であることを表す言葉。（「이（この）」の意味で使われる指示冠詞。）／現在話題になっている、まさにその対象であることを表す言葉。
본사=複数の支店や支社がある企業の中心となる事務所（本社）。／新聞社や放送局などで、自社を指して言う言葉（本社 / 当社）。
볼거리=見せ物、見どころ、見物(みもの)。／「流行性耳下腺炎」を日常的にいう言葉。おたふく風邪。
봉사하다=国家や社会、または他人のために、自分の利害を顧みず力を尽くして励む。／品物を通常より安い価格で売ったり、サービスを無料で提供したりする。
부끄러워하다=はにかんだり、恥ずかしそうな態度を見せたりする（恥ずかしがる）。／良心に呵責を感じて、やましさを感じたり恥ずかしく思ったりする。
부담스럽다=ある義務や責任、あるいは他人の好意や関心が、心が休まらないほど重く感じられる。／状況や状態が手に負えず、心に圧迫感を与える。
부리다=おしゃれをしたり飾ったりして引き立たせる。自分の外見や身なりを華やかで洗練されたものに整える。
부수다=固い物体を叩いて壊したり、いくつかの破片にしたりする(壊す / 砕く)。／積んであったり組んであったりする物を崩したり倒したりする(壊す / 取り壊す)。／(比喩的に)希望、計画、雰囲気などを台無しにしたり壊したりする(壊す / 台無しにする)。
부재=ある場所にいないこと(不在)。／ある物事や現象があるべき場所にないこと(欠如 / 不在)。
부정확=正しくなかったり、不確かであったりすること。／(特に言語において) 発音や表現がはっきりせず、不明瞭であること。
부주의=ある事をするに当たって、心を配り注意しないこと（不注意）。
부피=立体が占める空間の大きさ(体積 / 嵩)。／表面に現れて見える物の大きさや量感(大きさ / ボリューム)。
분리하다=互いにくっついていたり混ざっていたりするものを、別々に引き離して分ける。／一つだった物事や現象を、別々のものに分断する。
분명해지다=姿や形がかすまず、はっきりする。／態度や意思、事実などが曖昧でなく、確実にあらわになる。
분실물=紛失物、忘れ物。持ち主以外の人が拾って保管していたり、遺失物センターなどに預けられたりしている物。
분주하다=ひどく忙しく、せわしく動き回る状態にある。または、いろいろな仕事が一度に重なり、気が遠くなるほど忙しい。
분필=石膏の粉などを固めて作った棒状の道具で、掲示板や黒板に文字を書いたり絵を描いたりするのに使われる（チョーク）。
불가능=あることが実現できなかったり、そうすることができなかったりすること（不可能）。
불규칙=規則や法則から外れており、一定でないこと。／(言語学) 単語の活用や変化が一般的な規則に従わず、例外的に変化する現象。
불균형=どちらか一方に傾いたり偏ったりして均等でない状態。数値や大きさ、力の関係などが合わず、釣り合いが取れていない状態（不均衡 / アンバランス）。
불만족=気に入らなくて満足できないこと。または、そのような状態。
불만족스럽다=気に入らなくて、満足できないところがある。（主に事物、状態、結果などに対して使われる。）／表情や態度などが、何か気に入らなかったり満足していなかったりする様子がある。
불완전=欠点や足りないところがなく、完全ではないこと。／備えるべきものがすべて備わっていない状態。
불완전하다=不十分であったり、完全ではなかったりする。備えるべき条件や要素が欠けていて欠陥がある(不完全だ)。
불충분=分量や程度が十分でなく、足りないこと。／ある基準や要求を満たせず、完璧でないこと。
불친절=人に接する態度が暖かくなかったり、親切ではなかったりすること（不親切）。／物事や説明などが丁寧ではなく、不誠実なこと（不親切）。
불평등=差別があって等しくないこと。権利、義務、資格などが一方に偏り、等しくない状態（不平等）。
불평등하다=差別があって均等ではない。権利、義務、待遇などがある一方に偏っており、平等ではない状態を意味する。
불필요=必要ではないこと。または、そのような状態(不必要)。
불필요하다=用がない、あるいは必ずしも必要ではない。あるべき場所にいなくてもよかったり、使い道がない(不必要だ / 無用だ)。
불확실=確実ではないこと。物事や現象、状態などがはっきりしなかったり、明確でなかったりする状態。
불확실하다=確実ではない。事実かどうかがはっきりしなかったり、頼りなかったりする。結果や将来がどうなるかわからない。
브랜드=事業者が自社の商品を他者の商品と区別するために使用する名称、記号、デザイン、またはこれらの組み合わせ。（商標）／ある製品やサービスに対して消費者が抱く信頼度、価値、イメージなどの総体的な印象。
비둘기=ハト目ハト科に属する鳥の総称。体は主に灰色で、くちばしは短く、足は赤い。平和の象徴ともされる。／(比喩的) 性質が穏やかで争いごとを嫌う人のこと。
비밀번호=機器やシステムの使用権がある人であることを確認するために、あらかじめ決めておいた暗号。数字や文字、記号などを組み合わせて作る。
비상구=火災や地震などの突然の事故が起きた際、急いで避難できるように設けられた出入り口（非常口）。
비틀거리다=体の重心が取れず、あちこち倒れそうに歩く（ふらつく / よろめく）。／（比喩的に）ある組織や状態が力を失い揺らぐ。
빈자리=人が座っておらず、空いている席。／ある職位や職務に人がいない状態（欠員）。／誰かが去った後に感じられる寂しさや不在の状態。
빗=髪の毛を整えたり手入れしたりするために使う道具。通常、細長い歯が密に並んでいる。(櫛 / くし)
빗줄기=雨が筋をなして激しく降る様子。または、その雨の筋。
빠짐없이=何一つ漏らしたり抜かしたりすることなく、すべて。(ある集まりや行事に全員参加したり、物品・内容などをすべて含んだりする状態を表す。)
빠트리다=液体の中に沈ませる。（「빠뜨리다」の複数標準語）／深い穴や沼のような場所に落ちるようにする。／困難な状態や悪い状況に陥らせる。／物をなくしたり、すべき事や対象を落としたり（漏らしたり）する。
빨개지다=恥ずかしさ、興奮、酔いなどのために顔や体の色が赤くなる。／ある物体の色が赤色に変わる。
사고방식=ある問題に対して考え、判断する際に個人や集団が共通して持つ態度や方式（思考方式 / 考え方）。
사교적=多くの人と親しく付き合い、打ち解ける性質を持っていること。後ろに来る名詞を修飾する連体詞として使われる (社交的)。／人と付き合うことが好きだったり、人とすぐに仲良くなったりする性質があること。／(冠形詞的用法) 多くの人と交わって付き合うことに関連した。
사로잡다=考えや心を一つのところにすっかり集中させる（魅료する / 心を奪う）。／人や獣を生きたまま捕まえる（生け捕る）。
사망하다=人が死ぬ。（主にニュース、新聞、公文書など、格式まった文脈で使われる。）
사슴=ウシ目シカ科の哺乳動物を総称する言葉。雄は通常、枝分かれした角があり、毛の色は茶色で体に白い斑点があることが多い。臆病で走る速度が速い。
사용료=施設、物、サービスなどを借りて使ったり利用したりする対価として支払う金。／特許権、著作権などの無形の権利を使用する対価として支払う費用。
사용법=品物や道具、施設などを使う方法や手順(使用法 / 使い方)。
사우나=蒸気浴や乾熱浴ができるように設備を整えた場所。または、そのような入浴方法。／フィンランドの伝統的な入浴法に由来するもので、熱い石に水をかけて発生する蒸気や高温の熱気を利用して汗を流す施設。
사이버=コンピュータネットワーク、特にインターネット上で構築される仮想空間の状態や、それに関連することを指す言葉。現実世界と対比されるデジタル上の活動領域を意味する。
사이사이=空間的に空いたあちこちの隙間。／時間的に、ある出来事が起こる合間合間の時。
사이트=[コンピュータ/情報通信] インターネット上で情報を提供したり共有したりするために構築された仮想の場所。一般的に「ウェブサイト」を略して呼ぶ言葉。／[その他] ある事件が発生した場所や、特定の目的のために指定された敷地。
사진관=一定の施設を備え、写真を撮ったり現像、印画などを専門的に行う所（写真館 / フォトスタジオ）。
사진첩=写真を保管するために、紙の束などに挟んだり貼ったりして作った本（アルバム）。
사회학=人間社会と人間の社会的行為、そして社会組織と構造の原理を研究する学問。社会的関係、制度、文化などが個人や集団に及ぼす影響を探求する。
산꼭대기=山の頂上やてっぺん。
산부인과=妊娠、分娩および婦人病を専門的に診療し治療する医学の一分科。／妊婦や患者を診療するために産婦人科の専門施設を備えた病院。
살찌다=人や動物の体に肉が多くなる（太る）。／（比喩的に）ある物の分量が多くなったり、状態が豊かになったりする（肥える / 豊かになる）。
삼가다=言葉や行動を慎んだり、控えたりする。／ある事柄や行為をしないように注意したり、避けたりする。
상담실=問題を解決するために話し合ったり、相談を専門に行ったりする部屋（相談室）。／企業や公共機関で顧客の不満や問い合わせ事項を受け付け、処理する部署や場所（カスタマーセンター / 相談窓口）。
상담원=専門的な知識や技術に基づき、他人の悩みを聞いて解決策を提示する人（相談員 / カウンセラー）。／企業や公共機関で顧客の問い合わせ、要請、不満事項などを受け付け、案内する人（オペレーター / カスタマーサービス担当者）。
상당수=少なくない数。ある程度に達するかなり多い数。
상징적=抽象的な物事や観念を具体的な物で表すこと。または、ある物事や現象が特定の意味を代表したり想起させたりする性質を帯びること（象徴的）。
새엄마=父が新しく迎えた妻を、子の立場から言ったり呼んだりする言葉（継母）。
색연필=黒鉛の代わりに色素が含まれた芯を入れて作った鉛筆。絵を描いたり、文字に色を付けたりする時に使う。
생=人が世に生まれて生きていく状態、またはその期間（生 / 人生）。／生きている命（生命）。／火を通していない、または加工していない状態（生）。
생김새=人や物の形や状態(顔つき / 顔立ち / 外見)。
생년월일=人が生まれた年と月と日を合わせていう語(生年月日)。
생머리=パーマをかけていない、本来の直毛。または、そのように整えた髪型（ストレートヘア）。
생생하다=枯れたり傷んだりしておらず、活力がある。／記憶や印象などが忘れられず、非常にはっきりしている。／声や姿などが力強く、活気がある。
생활수준=個人や家計、または社会集団が物質的・文化的欲求を満たすために享受する生活の質的な程度や状態(生活水準)。
서럽다=悔しくて悲しく、心が痛んで辛い（悲しい / 切ない）。
서명하다=本人の名前を直接書き入れる。主に契約や同意、確認を目的として文書や書類に自分の姓名を直接書くという意味で使われる。
서운하다=期待していた通りにならず、名残惜しくて寂しい。／もてなしや待遇が丁寧でなく、気分を害する。
석사=大学院の修士課程で規定の単位を修得し、論文審査やそれに準ずる試験に合格した人に授여される学位。または、そのような学位を持つ人(修士)。
선글라스=強い日差しや紫外線から目を保護するために色を入れた眼鏡。主に野外活動やおしゃれのために着用する(サングラス)。
선원=船に乗って船を操縦したり、その中の事務を担当したりする人。または船長を除いた船のすべての構成員を指す言葉（船員）。
설레다=心が浮き立ったり、嬉しくて期待に胸が膨らんだりして、どきどきする。／（比喩的に）ある対象や現象が期待感によって揺れ動く。
설립하다=機関、組織、施設などを新しく作って建てる。
설명서=物の使用方法、組み立て過程、製品の特徴や注意事項などを詳細に記した文や冊子（説明書 / 手引書）。
설문지=ある事実や現象に関する人々の意見や実態を調査するために、様々な質問事項を記した用紙（アンケート用紙）。
성경=宗教で神聖視する教えを記録した本。狭い意味ではキリスト教の「旧約」と「新約」を合わせた言葉。／聖人の教えや一生を記録した経典。
성적표=学校や教育機関などで学生の学業成績を記録し、学生や保護者に送る表（成績表 / 通知表）。
세계화=政治、経済、文化など社会の様々な分野で国家間の交流が活発になり、全世界が一つの共同体のように変化していく現象（グローバル化）。／企業やブランドなどが活動範囲を全世界に広げていく過程。
세상에=驚くべきことや思いがけないことに直面した時、あるいは呆れた状況で発する感嘆詞（なんてことだ / まあ）。／信じられないほど素晴らしいものや、とてつもないものを見た時に感嘆して言う言葉（なんて / まあ）。
세종대왕=朝鮮王朝第4代国王（在위1418〜1450）。姓は李（イ）、諱は祹（ド）、字は元正（ウォンジョン）。集賢殿を設置して学問を奨励し、1443年に韓国固有の文字である訓民正音を創製した。科学、経済、国防、芸術など多方面で輝かしい業績を残し、韓国史上最も尊敬される聖君として崇められている。
세탁물=洗濯するもの。または洗濯しておいたもの。主に服、布団、タオルなど洗濯が必要な繊維製品を指す。
섹시하다=外見や雰囲気、態度などが性的魅力があり、誘惑的だ。／知的であったり専門的な能力などが非常に魅力的で格好いい。
소개팅=未婚の男女が第三者の紹介で会うこと。主に一対一で会ってお互いを知っていく、気軽な見合い形式の出会いを指す。
소극장=規模の小さい劇場。主に客席数が少なく、舞台と客席の距離が近いため、俳優と観客が密接にコミュニケーションできる公演場を指す。
소금물=塩を水に溶かして塩味がするようにした水。主に食材を漬けたり、消毒、洗浄などの用途に使われる。
소독약=病原菌を殺して感染を防いだり、傷を治療したりするために塗ったりスプレーしたりする薬(消毒薬)。
소방관=火災を予防したり鎮圧したりし、事故や災難の現場で人を救助し、救急活動を専門とする公務員(消防士 / 消防官)。
소방서=火災を予防、警戒し、または鎮圧し、火災や災難その他の危急な状況での救助・救急活動を通じて国民の生命・身体および財産を保護する業務を担う行政機関。
소방차=火災を鎮圧したり人命を救助したりするために必要な装備を備えた特殊自動車。水タンク、ポンプ、はしごなどが設置されており、通常は赤色に塗られている。
소비하다=お金、物、時間、努力などを使ってなくす。／欲望を満たすために財産やサービスを消耗する。
소설책=事実または作家の想像力に基づき、虚構的に構成された物語である小説を印刷して綴じた本。
소아과=新生児から青少年までの疾病を専門的に診察・治療する医学の一分野。または、子供を診療するために病院内に設置された部署や個人医院（小児科）。
소요되다=ある事や目的を果たすために、時間・費用・物資などが使われる（所要される / かかる）。
소질=本来備わっている性質や素地。／ある分野の物事をうまくやり遂げられる基本的な能力や才能。
소홀하다=ある物事に精一杯取り組まなかったり、注意深く見守らなかったりして、真心が足りない。／人をもてなす態度が丁寧でなかったり、真心がなかったりする。
소홀히=大したことではないと考え、誠意を尽くさなかったり注意が足りなかったりするさま（おろそかに / 疎かに）。
소화하다=食べた食物を体内で吸収できる状態に分解する。／学んだ知識や情報などを十分に理解して自分のものにする。／与えられた業務、日程、物量などをこなしたり解決したりする。／ある役柄や服装などを自分なりのスタイルでうまく表現する。
속눈썹=まぶたの縁に生えている短い毛。ほこりや異物から目を保護する役割をし、外見的にも重要な部位である。
속삭이다=他人に聞き取られないように、小さな声で低く話す（ささやく）。／風の音や水の音などが、細く穏やかに聞こえる（そよぐ / さざめく）。／心の中でひそかにある考えを持つ。
손가방=手に持ったり手首にかけたりできるように作られた小さなバッグ。主に財布、化粧品、身の回り品などを入れるのに使われる。
손목시계=手首に巻くように作られた小さな時計（腕時計）。
손수=他人の力を借りず、自分の手で直接。
손실=減ったり失ったりすること。または、その失ったもの（損失 / 紛失）。／[経済] 支出した費用が収入より多く、財産上の利益を得られずにむしろ損をすること（損失）。
솜=綿花から得られる白くて柔らかい繊維。主に布団、服の裏地、クッションなどの詰め物として使われる(綿 / コットン)。／薬を塗ったり傷口を拭いたりする時に使う医療用の繊維の固まり(脱脂綿 / 綿棒の綿など)。
송별회=去る人を別れ惜しんで送り出すために催す集まり（送別会）。
쇼핑몰=さまざまな商品を売る商店が1か所に集まっている大規模な商店街の建物。／インターネット上で品物を売買できるように作られた仮想店舗。
쇼핑센터=様々な商品を売る商店が一堂に集まっている建物や区域。一般的に衣類、雑貨、食品など多様な品目を一箇所で購入できるように設計された大規模な商業施設を意味する。
수리비=故障したり破損したりした物を手入れして直すのにかかる費用（修理費）。
수리하다=故障したり古くなったりしたところを手入れして直す。
수면제=眠れない時に眠りにつくために飲む薬(睡眠薬)。
수수께끼=ある物事や現象について、直接名前を言わずに比喩や遠回しな言い方をして当てる遊び（なぞなぞ）。／ある物事や現象が複雑に絡み合っており、その内容や原因を簡単には知ることができないこと（謎）。
수수료=国や公共団体、または個人や企業が他人のために特定の事務を処理したり、施設を利用させたりした対価として受け取るお金。／売買や取引を仲介した対価として支払う費用。
수입되다=外国の物品、技術、文化などが国内に移し入れられる。／他国の制度や思想、学説などが導入されるようになる。
수컷=動物の中で卵を産まず、精子を作る生殖器官を持つ方。雌（メス）に対応する言葉。
수필=一定の形式に従わず、人生や自然、または日常生活での感じたことや体験を思いのままに自由に書いた散文形式の文章。「軽随筆（エッセイ）」と「重随筆」に分けられる。
숙박비=旅館やホテルなど、他人の家や施設で寝泊まりするのにかかる費用。
숨소리=呼吸する時に出る音(息遣い / 寝息)。
스무째=順番が20番目になる順序。／（主に「日」と共に使われ）一ヶ月の20日目の日。／(冠用詞) 順番が20番目になる。／一月の二十日目の日（二十日）。／順番や順序が20番目になること（二十番目）。
스커트=下半身に着用する女性用の上着（ボトムス）の一つ。腰から下に垂れ下がる形の衣類を指す（スカート）。
스타킹=主に女性が足に密着させて履く、細い糸で編んだ長い靴下。ナイロンやシルクなどの素材で作られ、長さに応じてパンティストッキング、ハイソックス（パンタロンストッキング）などに分けられる。
슬그머니=人の目を盗んで、こっそりと。／ある行動や状態を、隠密に、かつ自然に行う様子。／心の中でひそかに。または、本人が気づかないうちに少しずつ。
슬리퍼=かかとがなく前部だけが覆われていて, 履きやすく脱ぎやすい屋内・屋外用の軽い靴（スリッパ）。
습하다=空気や物などに湿気が多くてじめじめしている。
승리하다=戦争、競技、試合などで勝つ。／いかなる難関や誘惑、自分自身との戦いに打ち勝つ。
승무원=船、飛行機、列車などで運行に関わる業務に従事したり、乗客にサービスを提供したりする人（乗무員 / クルー）。
승차권=車に乗ることができる権利を証明する切符。（バス、汽車、電車などの交通手段を利用するために支払った対価の証票）
시나리오=映画やドラマを作るために、台詞、場面説明、人物描写などを書き留めた台本。／ある事件や出来事が起こりうる可能性をあらかじめ予想して立てた計画や状況設定。
시내버스=都市の中心部と郊外を結び、定められた路線に沿って市内区間を運行するバス（市内バス）。
시달리다=苦しみや煩わしさに悩まされる（悩まされる / 苦しめられる）。／ある仕事や状況のせいで、肉体的・精神的に疲れ果て、つらい状態に置かれる。／病気や寒さ、暑さなどの外部刺激によって、困難な状態を経験する。
시대적=その時代の特徴や性格に関連すること。／特定の時代の状況や流れを反映していること。
시디롬=コンピュータで情報を読み取るために使用される光学記憶装置の一種。大量のデータ、音声、映像などを保存でき、ユーザーが内容を修正したり削除したりすることはできず、読み取り専用であるという特徴がある。
시아버지=夫の父親を指す言葉（義父 / お義父さん）。
시외버스=都市と都市の間を運行したり、都市の境界の外に出る路線を定期的に運行するバス（市外バス）。
시험지=試験の問題を記したり、答えを書くように作られた紙（試験用紙）。
식당가=多くの食堂が一箇所に集まっている通りや地域（食堂街 / レストラン街）。／百貨店や大型ショッピングモールの内部で、複数の飲食店が密集している階や区域。
식사량=一食、または一定期間に食べる料理の分量（食事量）。
식생활=人が食べ物を食べて生きていく方式や、それに関連する生活のあらゆる様式。栄養を摂取するための摂食活動および食品の選択、調理、配膳などを含む文化的活動。
식중독=食物を摂取することで人体に有害な微生物や微生物が作り出した毒素によって発生する感染性または毒素型の疾患。
식품점=食料品を専門に売る店。主に肉類、野菜、果物、加工食品などの食べ物を販売する。
신나다=ある出来事に対して気分が非常に良くなり、興に乗る（うきうきする / 浮かれる）。／元気や熱意が引き出され、活発に動く。
신라=紀元前57年から西暦935年まで韓半島南東部で始まり、三国を統一した古代国家。朴赫居世（パク・ヒョッコセ）が建国し、慶州（キョンジュ）を首都として華やかな仏教文化と芸術を花開かせた。
신상품=新しく作られたり、市場に初めて出された商品（新商品）。
신설=設備、制度、機関などを新しく設置したり作ったりすること。
신속하다=仕事の処理や行動などが非常に速い。
신중하다=非常に慎重で落ち着いている。態度や振る舞いに疎かさがなく、細心だ（慎重だ）。
실망하다=期待していた通りにならず、希望を失ったり心が傷ついたりする（失望する / がっかりする）。
실용적=実際に使うのに有用であったり、価値があること。また、見栄えよりも実際の使い勝手を重視する性質を持っていること。／実際的な使い道があること。または、そのようなもの（実用的）。
심각해지다=状態や程度が非常に切박したり、危うい状態になる。／雰囲気や表情、考えが深く重大で真面目になる。
심지어=すでに何らかの状態が極限に達しているのに、その上にさらに加わること。「泣きっ面に蜂」あるいは「ひどい場合には～までも」の意味を表す。
싶어지다=(動詞や形容詞の後で「-고 싶어지다」の形で使われ) 前の言葉が表す行動をしたいという気持ちが生じたり、そのような状態になりたいという変化が起きたりすることを表す言葉。
싸이다=物が風呂敷、紙、包装紙などに入れられたり、包まれたりする。（「包む」の被動詞）／ある物体や雰囲気に取り囲まれる。／ある考えや感情にとらわれる。
싹=物事を残さず、すべて処理したりなくしたりする様子。／風が軽く一度吹く様子。／刃物やハサミなどで物を一気に快く切る様子。／態度や表情が急にがらりと変わる様子.
쑤시다=鋭い先で刺すような痛みが繰り返される。（主に筋肉や関節の痛みを表現する時に使う）／穴や隙間に指や細長い物を入れてかき回す。／他人をそそのかして、ある行動をさせる。
쑥스럽다=言動や様子が自然でなく、ぎこちない。／他人に接するのが恥ずかしく、面映ゆい。
아드님=他人の息子を敬って言う語（主に相手の息子を礼遇して呼ぶ時に使う）。／長男を敬って言う語。
아랫집=自分の家より下の階にある家。または、その家に住む人。／（比喩的に）ある基準より低い位置にある家。
아스팔트=石油蒸留の残留物として得られる黒色や暗褐色の粘り気のある固体、または半固体状態の炭化水素化合物。主に道路舗装用、防水、電気絶縁材料として使われ、比喩的に殺風景な都市環境を象徴することもある。
아시아=世界で最も広く、人口が多い大陸。地球の東半球の北東側に位置し、ヨーロッパやアフリカとつながっている。東は太平洋、南はインド洋、北は北極海に面している。／世界で最も広く、人口が多い大陸。ユーラシア大陸の東部を占め、東は太平洋、南はインド洋、北は北極海に面している。
아침밥=朝に食べるご飯。または朝食として食べる食べ物。
아침저녁=朝と晩（朝夕）。／朝から晩までの間。またはいつも、常に。
아프리카=アジアに次いで大きな大陸で、地中海、紅海、インド洋、大西洋に囲まれている。赤道が中央を横切り、サハラ砂漠をはじめとする広大な草原と多様な野生動物が生息する大陸である。／アジアとヨーロッパの南に位置する、世界で2番目に大きな大陸。人類の発祥の地として知られ、多様な民族と文化、膨大な自然資源を有している。
아홉째=(数詞) 順番が9番目になる順序。／(名詞) 日付を数える時、その月の9番目になる日。／(数詞) 順序が8番目の次になる順番。／(数詞) 日付を数える時、その月の九日。／(冠形詞) 順番が9番目になる。／(冠形詞) 日付が9日目である。
안과=目に生じる疾患を専門的に診療し、治療する医学の一分野。／目の病気を診察し、治療するために施設を整えた病院。
안내서=ある内容や使用方法などを教えるために作られた冊子や文書（案内書 / ガイドブック / 手引書）。
안내소=ある機関や場所で道や利用方法、あるいは関連情報を知らせるために設けられた場所(案内所)。
안내원=ある機関や場所で、訪問客に道を教えたり施設などについて説明したりする仕事を担当する人(案内係 / ガイド)。
안내판=ある事実や内容を知らせるために、特定の場所に設置された板。道案内や施設の場所、注意事項などが記されている(案内板)。
안동=慶尚北道の北部に位置する市。韓国の儒教文化の中心地としてよく知られており、河回村（ハフェマウル）や陶山書院（トサンソウォン）など、多くの文化遺산が保存されている都市である。／（歴史的地名）高麗時代や朝鮮時代に特定の地域を治めていた行政区域の名称。
안심하다=心配や憂いなく、心を楽に持つこと（安心する）。
안전띠=自動車や飛行機などの座席に座った人が、事故の際に体が放り出されるのを防ぐために体を固定するベルト。「シートベルト」ともいう。
안타까워하다=思い通りにいかなかったり、見ていて可哀想で心を痛め、もどかしく思う。
알레르기=ある外来物質に対して体の免疫体系が過敏に反応する状態。じんましん、かゆみ、鼻水、くしゃみなどの症状が現れる(アレルギー)。／(比喩的) ある物事や現象を生理的にひどく嫌うこと。
알루미늄=原子番号13番の金属元素。銀白色の軽くて柔らかい金属で、展延性に優れ、空気中で酸化皮膜を形成するため腐食しにくい。合金や包装材、建築資材など、多様な産業分野で広く使われている。
알아맞히다=問いや問題の答えを正しく答える。／目に見えない、あるいは知られていない対象、または未来のことを推測して当てる。
알차다=中身が詰まっている。／内容が充実していて実質的だ。／人の性情や出来栄えが正しく、しっかりしている。
알코올=[化学] 炭化水素の水素原子がヒドロキシ基(-OH)で置換された化合物を総称する言葉。／酒の主成分となる無色・無臭の可燃性液体。一般にエチルアルコール(エタノール)を指す。／酒を日常的に指す言葉。
암시=意図するところを直接表さず、暗に知らせること。またはその内容（暗示）。／[心理] ある感覚や考えが周囲の刺激によって知らず知らずのうちに生じること。
암컷=動物の性別のうち、卵を産んだり子を産んだりする側の性を持つ個体。
앞머리=額の上に垂れるように切った髪の毛（前髪）。／頭の前の方の部分。
앞문=建物の正面にある門（正門 / 表門）。／バスや電車などの乗り物で、運転席に近い方のドア。
애완동물=人がそばに置いて可愛がりながら飼う動物。（最近では家族の一員という意味を込めて「伴侶動物（ペット）」という用語がより多く使われる。）
야구장=野球の試合ができるように設備を整えた運動場（野球場）。
약수=薬効があるといわれる湧き水。一般的に体に良い鉱物質が溶け込んでおり、胃腸病や皮膚病などに効果があるといわれる。／薬を飲む時に飲む水。／(数学) ある数（整数）を割り切ることができる数（約数）。
약해지다=力や気力、勢力などが弱まったり足りなくなったりする。／覚悟や意志、性質などが固くなく、もろくなる。／健康状態や体の機能が悪くなる。
약혼녀=婚約した女性。結婚を約束した相手の女性を指す言葉。
약혼자=婚約をした男女の間で、相手を指す言葉。結婚することを正式に約束した人（婚約者）。
얄밉다=言葉や行動が非常に鼻についたり、憎らしい感じがある。（主に相手が抜け目なく振る舞ったり、自分が持っていないものを自慢したりする時に感じる軽い憎しみを表す）
양력=地球が太陽の周りを一周するのにかかる時間を一年と定めて作った暦。西洋から伝わった暦法であることから「新暦」とも呼ばれ、現在全世界で通用している方式である。
양상추=キク科の一年草または二年草。葉は広くて丸く、通常は何層にも重なって球状になる。主にサラダやサンドイッチなどの材料として使われ、シャキシャキとした食感が特徴である。
양주=西洋から伝わった酒。主にウィスキー、ブランデー、ジン、ウォッカなどの西洋式の蒸留酒を総称する。
어긋나다=骨が元の位置から外れたり、ねじれたりする。／かみ合っている状態が互いに一致せず、食い違う。／期待、計画、理屈、道理などが目的や基準から外れたり、食い違ったりする。／お互いの仲や関係が悪くなる。
어려워지다=ある事をするのが難しくなったり、より手間がかかる状態になる。／格式や礼儀を重んじるべき関係になったり、相手にするのが慎重になる。／暮らし向きや境遇が困窮し、貧しくなる。／内容や問題が理解しにくくなったり、複雑になったりする。
어려워하다=相手に対して気兼ねし、接しにくいと感じる。／ある物事や状況が大変だったり複雑だったりすると感じ、負担に思う。
어르신=他人の父親を高めて言う語。／年配の老人を敬って呼ぶ語。
어저께=今日のすぐ前の日。（類義語：昨日（어제））／すぐ少し前の過去。／今日のすぐ前の日に（昨日）。／（比喩的に）ごく近い過去に。
어쩌다가=思いがけない機会に、偶然に。／どのような理由や経緯で。「어쩌다가」は「어찌하다가」の縮約形。／ごく稀に。たまに。
어쩜=「おっとめ（어쩌면）」の縮約形。意外な事実に驚いたり、感心したりする時に使う言葉。／「おっち하면（어찌하면）」の縮約形。「どうすれば」の意味で、方法や方策を尋ねる時に使う言葉。
어차피=どうせ、どっちみち、いずれにせよ。（どうしても結果が変わらないことを表す言葉）／どうせ、せっかく。
억지로=できないことを無理に骨を折ってしたり、したくないことを強制的にしたりするさま(無理やり / 強引に)。
엇갈리다=あちこちで互いに行き違ったり、すれ違ったりする。／互いの方向や目的が合わず、会うことができない。／意見、考え、主張などが互いに一致せず、食い違う。／時間や順序がずれ、うまくかみ合わない。
에스컬레이터=階段状の足場が自動的に動き、人や物を上下に運ぶ装置。主に百貨店、地下鉄駅、空港などの公共施設に設置されている(エスカレーター)。
엔진=熱エネルギーや電気エネルギーを機械的な動力に変える装置。主に自動車、飛行機、船などの輸送手段を動かす核心機関を指す。（同意語：発動機）／（比喩的に）ある物事の発展や活動を可能にする核心的な原動力。
여군=女子で組織された軍隊。または軍隊に服務する女子軍人。
여덟째=順番が8番目になること。／(日付を数える時) 8日目。／(冠詞) 順番が8番目になる。／(数詞) 順番が8番目になること。／(冠形詞) 順番が8番目の。
여드름=主に思春期に顔、首、胸などの皮脂腺が発達した場所にできる小さな吹き出物。皮脂が外に排出されず毛穴に溜まって炎症が起きた状態を指す。
여름휴가=夏場に職場、学校、軍隊などの仕事から離れ、一定期間休むこと。通常、気温が高い7月末から8月初めに集中し、休息を取ったり旅行に出かけたりすることが多い（夏休み / 夏季休暇）。
여섯째=順番が6番目になる順序。／日付や期間を数える時、その順序が6番目になる日。／(数詞) 順序が6番目になること。／(名詞) 6人の子供のうち、6番目に生まれた子。／順番が6番目になることを表す言葉。（主に数量や順序を表す名詞の前に使われる。）
여왕=女性として君主の座にある人（女王）。／特定の分野や集団で最も優れているか、大きな影響力を持つ女性を比喩的にいう言葉。／ハチやアリなどの社会性昆虫の集団で産卵を担当する雌。
여유롭다=時間や空間、お金などが十分にあって余りがある（余裕がある）。／心の状態がゆったりとして安らかで、焦りがない（余裕がある）。
여전하다=形や状態が以前と変わりない。
여행가=旅行を専門的にしたり、旅行を非常に楽しむ人。または、あち코ちを広く渡り歩いて見聞を広め、それを記録したり伝えたりする人(旅行家)。
역사학=人間社会が歩んできた変遷の過程と過去の事実を研究し、体系化する学問（歴史学）。
연기되다=定められた日時や期限が後に延ばされる。
연기하다=定められた期限や時間を先に延ばす(延期する)。
연두색=えんどう豆の色のような淡い緑色。または、芽吹いたばかりの新芽のように爽やかで明るい緑色。
연상하다=ある物事や現象を見たり聞いたり考えたりする時、それに関連のある他の物事や現象を思い浮かべること。
연주회=大勢の前で楽器を演奏し、音楽を聴かせる集まりや行事（演奏会）。
연체료=借りた物を決められた期限内に返さなかったり、支払うべきお金を期限通りに払わなかったりした時に追加で払うお金（延滞料）。
연출하다=演劇、映画、放送などで脚本に基づき、俳優の演技、舞台装置、照明、音楽などを総合的に指導し、製作を総指揮する。／ある状況や雰囲気を意図的に作り出す。／表に現れる姿や態度を整えたり、表現したりする。
열쇠고리=鍵を一つにまとめて通したり、保管したりするために使用する輪の形の小物。最近では装飾用の人形や記念品などが付いた形態もよく使われる。
열중하다=一つの事に精神を注ぎ込み、集中する。
엷다=色が濃くない(薄い / 淡い)。／厚みが薄い。／密度や濃度が低い。／言葉や行動、感情などの程度が深くなく、軽い。
영남=韓国の鳥嶺（チョリョン：聞慶セジェ）以南の地域を指す言葉。現在の慶尚北道と慶尚南道一帯を合わせた地域を意味する。
영리하다=頭が良く、勘が鋭いため、対処や手際が良い（賢い / 利口だ）。
영양제=体の栄養を補給するために服用する薬や化合物。ビタミン、ミネラル、アミノ酸など不足している栄養素を集中的に供給し、健康増進を助ける（栄養剤 / サプリメント）。／植物の成長を助けるために土壌や葉に与える肥料や栄養成分を含んだ物質。
영화감독=映画制作の全過程を総括し指揮する人。シナリオの解釈、俳優の演技指導、撮影および編集などを監督して一つの映画作品を完成させる演出家を指す。
옆구리=人や動物の胴体の両側の肋骨の下の部分（わき腹）。／物体の両側面や横の部分を比喩的に言う言葉（わき / 側面）。
예고하다=これから起こることをあらかじめ知らせたり、公告したりする。／ある出来事の前兆や兆しをあらかじめ示す。
예매하다=車券や入場券などを使う前にあらかじめ買っておく。
예습하다=これから学ぶ内容をあらかじめ調べたり読んだりして勉強すること（予習する）。
예식장=結婚式やその他の様々な儀式を行えるように施設を整えた場所(結婚式場 / 式場)。
예약하다=席や部屋、物などを使用するためにあらかじめ約束すること。／ある事を将来に行うことをあらかじめ約束すること。
오락실=様々な娯楽機器を備え、料金を取って遊ばせる場所（ゲームセンター）。
오래오래=時間や期間が非常に長く久しい状態を強調して表す言葉。主に相手の長寿や幸せ、またはある状態が永遠に続くことを願う気持ちを込めて使われる。
오른편=基準となる人や物体の右の方向や側面。（「오른쪽（右側）」と同じ言葉）
오토바이=エンジンを搭載し、その動力で車輪が回転して動く二輪自動車。普通は自転車に似た構造を持つが、エンジンの力で走行し、サドルにまたがってハンドルにある変速機とブレーキで操縦する（オートバイ / バイク）。
옥상=屋根の上の部分。普通、平らに作られていて、人が上がったり物を置いたりできる空間を指す(屋上)。
온돌=いろり(焚き口)で火を焚き、その熱気が床下の煙道(ゴレ)を通ることで部屋を暖める韓国固有の暖房装置。
올가을=今年の秋。
왕비=王の妻。（正妃を指す言葉）。／ある分野で最も優れているか、あるいは美しい女性を比喩的にいう言葉。
외과=医学の一分野で、主に手術や機械的な処置を通じて、疾病や外傷を治療する分野（外科）。／病院で手術治療を専門とする部署。
외다=文章や言葉の内容を覚えて、そのまま口に出す（「외우다」の短縮形）。／神霊や仏に願いをかけたり、呪文や真言などを繰り返し唱える。
외숙모=母の兄弟（母方の伯父・叔父）の妻を指す言葉（義理の叔母）。
외아들=兄弟や姉妹がいない、たった一人の息子（一人息子）。
외제=外国で作られた品物。（反対語：国産）／外部で制作すること。またはその物。
외출복=外出する時に着る服。普段着やパジャマとは異なり、格式を整えたり人に見せたりするために着飾る服を指す。
외침=声を張り上げて叫ぶこと。または、その声（叫び / 叫び声）。／ある事柄に対して強く要求したり主張したりすること。または、その内容（叫び / 訴え）。／外敵の侵入（外侵）。
외할아버지=母の父を指す言葉（母方の祖父）。
요구르트=牛乳や山羊の乳などを殺菌して濃縮し、そこに乳酸菌を繁殖させて発酵させた食品。液体状やとろみのある半個体状があり、独特の酸味がある。
요리법=料理を作る方法や手順(レシピ)。
욕하다=他人の人格を無視する侮辱的な言葉を言ったり、呪いの言葉を吐いたりする（悪口を言う / 罵る）。／対象を激しく非難したり、けなしたりする（そしる / 誹謗する）。／（まれに）恥ずべき目に合わせたり、名誉を汚したりする（辱める）。
우기다=無理に意地を張って、自分の意見を頑固に主張する。／自分の意志を曲げず、最後まで主張し続ける。
우체통=人々が送る手紙やハガキを入れておけば、郵便局で回収していくように道端や公共の場所に設置された箱(郵便ポスト)。／各家庭の門や玄関に設置され、配達された郵便物を受け取れるように作られた箱(郵便受け)。
우편물=郵便局を通じて送る手紙や品物（郵便物）。
우편함=郵便物を入れたり受け取ったりするために、門や建物の入り口などに設置された箱（郵便受け / ポスト）。
우회전=車や人などが右に曲がること。または、その方向（右折）。
운동량=体を動かして運動をする量。／[物理] 物体の質量と速度の積で表される物理量。物体の運動状態を表す。
운동선수=運動競技に参加することを職業としたり、専門的に運動をしたりする人（アスリート / 運動選手）。
운전면허=一定の資格を備え、自動車やオートバイなどの車両を運転できるように行政機関が許可すること。または、その資格を証明する文書(運転免許)。
원만하다=性格や人品が円満で寛大だ。／状況や物事が難しいところがなく、円滑に解決される状態にある。／形が丸くて円満だ。
월세=家や部屋を借りる代価として、毎月支払うお金（月謝 / 家賃）。／毎月一定のお金を払って家や部屋を借りる賃貸借の形式（月極め）。
위반하다=法令、規則、約束、原則などを守らず、背くこと（違反する）。
위법=法令に背くこと。または、法令に触れること(違法)。
위원회=特定の目的や業務を遂行するために、複数の人が集まって協議し決定を下す合議制の機関または組織（委員会）。／行政機関や団体内で、特定の案件を審議したり調査したりするために構成された小規模の専門家集団。
위층=ある階より上にある階（上の階 / 上層）。／建物の中で、基準となる階のすぐ上の段階を指す言葉（上の階）。
윗몸=人の体で腰より上の部分。主に胸、背中、肩を含む上半身を指す。
유능하다=ある物事を成し遂げるだけの能力と手段がある。
유람선=川や海などの景色を鑑賞して楽しむために乗る船（遊覧船）。
유발하다=ある事件や現象、反応などを引き起こす。
유지되다=ある状態や状況が変わりなく継続していくこと（維持される）。
유창하다=言葉や文章に淀みがなく滑らかだ。／外国語の実力が優れており、母国語のように自然に使いこなす。
유치하다=水準が低かったり未熟で、子供っぽいところがある。／年齢が若くてまだ幼い。（主に考えや態度が成熟していないことを意味する）
육상=地球の表面で海を除いた陸の上(陸上)。／走り、跳び、投げなど、陸上で行われる各種の運動競技を総称する言葉（陸上競技）。
으레=言うまでもなく、当然。／決まって、いつも、または慣習的に。
은은하다=音が絶えそうに柔らかく、低い。／色や光が強くなく、見ていて柔らかい。／匂いや香りが濃くなく、ほのかだ。／考えや感情などが深く、じんわりと染み込んでいる。
은행나무=イチョウ科の落葉針葉高木。高さは40メートルほどまで成長し、葉は扇形で先が分かれている。雌雄異株で春に花が咲き、秋に「銀杏（ぎんなん）」と呼ばれる黄色い実がなる。／イチョウの木材。きめが細かく均一で柔らかく、弾力があるため、家具、彫刻、碁盤などの材料として使われる。
음악회=歌や楽器の演奏を聴衆に聴かせるために開く集まりや公演（音楽会 / コンサート）。
응급실=病院で急患のために24時間いつでも診療と処置ができるよう、施設を整えてある病室(救急室 / 救急外来)。
응답하다=呼びかけや問い、または外部の信号や刺激に対して, それに見合う答えや反応を示す。／起訴や請求などの法的追求、あるいは特定の要求に対して、自身の立場を明らかにしたり対応したりする。
의도적=ある目的や計画を持って、わざとすること（意図的）。
의무적=当然果たすべき義務として定められている。または、そのような性格を帯びている（義務的）。／当然果たすべき義務があること。または、そのような性格や態度を帯びていること。
이국적=他国の風俗や情緒、色彩などが強く感じられること。自国とは異なる、見慣れぬ神秘的な雰囲気があること(異国的)。／他国の風俗、様式、情緒などが漂っていること。またはそのようなもの(異国的 / エキゾチック)。
이기적=自分の利益だけを追求し、他人や社会の利益は顧みないこと。また、そのような性質を持っているさま（利己的）。／自分勝手な利益を優先して考え、行動する性質を持っているさま。
이다음=時間的にすぐ後に来る時や順序。（主に未来のある時点を指す）
이따금=時間的な間隔をおいて、たまに。 「時々」と似た意味で使われる。
이렇게=「이러하게（このように）」の縮約形。状態、模様、性質などがこのような方式で。／話し手に近い対象や状況が、これほどの程度で。
이론적=理屈や論理に基づいたもの。実践や実用とは対조的に、知識や原理自体を探求する性格のもの。
이른바=世間で言われている、またはいわゆるもの。（主に、ある対象を指すときに使われる。）
이름표=人の名前や物の名称を書いて、胸や物体につける札(名札 / ネームプレート)。
이만큼=距離、分量、程度などが、すでに知っているこの程度の水準である状態。／（副詞的用法で）距離、分量、程度などがこれほどの程度に。／程度や分量がこれくらいに。／状態や距離がこれくらいに。
이메일=インターネットや通信網を通じて手紙や文書、ファイルなどをやり取りするシステム、またはそのように送られた手紙（電子メール）。
이벤트=特定の目的を持って人を集めるために企画された行事や祭り（イベント / 催し）。／大衆の関心を引くために行われる広報活動や特別な出来事（キャンペーン / サプライズ）。／スポーツ競技や演奏会などの種目、またはプログラムの一単位（種目 / 試合）。
이비인후과=耳(耳)、鼻(鼻)、喉(咽喉)に生じる疾患を専門的に治療・手術する医学分野。または、その分野の患者を診療する病院。
이슬=空気中の水蒸気が夜の間に冷たくなった地面や物体の表面に結びついてできた水滴（露）。／（比喩的に）涙を指す言葉。／（比喩的に）はかない人生や、すぐに消えてしまう運名を指す言葉。
이어서=前の行動や状況が終わった直後に続いて。／途切れないように続けて。
이해력=物事の道理や状況、または言葉や文章の意味を悟って理解する能力。
인삼차=高麗人参を煮出したお湯、または水参や紅参を薄く切り、蜂蜜や砂糖に漬け込んでからお湯に溶かして飲む茶。
인쇄물=紙や布などに文字、絵、写真などを刷り出したもの。本、新聞、雑誌、チラシなどの総称。
인스턴트=準備や調理の過程が非常に簡単で、短時間で食べたり使用したりできるように加工された食品や物。／(比喩的に) 深い悩みや過程なしに、その場ですぐに簡単かつ迅速に行われること。
인종=身体上の特徴によって人間を分類した種類。主に肌の色、髪の形、骨格などによって黄白人種、白人種、黒人種などに分けられる(人種)。／(比喩的に) 特定の性質や特徴を持つ人々を卑しめて呼ぶ言葉。
인천공항=大韓民国京畿道仁川広域市中区雲西洞の永宗島と龍遊島の間を埋め立てて建設された、韓国最大規模の国際空港。韓国を代表する玄関口となる空港である。
일곱째=(冠用詞) 順番が七番目になる。／(数詞) 順番が7番目になる順序。(名詞) 7番目になる人や物、または日付を数える時の7日目。／(数詞) 順序が七番目になる順番。／(名詞) 日付や期間を数えるとき、その七番目にあたる日。
일교차=一日のうちの最高気温と最低気温の差。通常、昼と夜の温度変化を指す言葉。
일본인=日本国籍を持つ人、または日本民族に属する人。
일부분=ある場所や物、現象などを全体として見たとき、その中に含まれるある程度の分量や範囲。／全体を構成するいくつかの要素のうちの一つ。
일석이조=一石二鳥：一つの石を投げて二羽の鳥を捕らえるという意味で、同時に二つの利益を得ることのたとえ。
일시불=代金の全額を一度に支払うこと。また、そのお金(一括払い)。
일정표=これからやるべきことの計画や順序を、日付や時間別に記した表（日程表 / スケジュール表）。
임신부=子供を身ごもった女性。（「妊産婦」と混用されることもあるが、厳密には子供を身ごもった「妊婦」のみを指す言葉である。）
임신하다=子나子を孕む。受精卵が子宮内膜に着床し、胎児として発育する状態になる（妊娠する）。
입국=国境を越えて他国の領土内に入ること。（反対語：出国）
입력하다=コンピュータや機械装置などに必要な情報やデータを入れる。／(比喩的に) ある事実や知識などを頭の中に記憶したり、受け入れたりする。
입사하다=会社の社員として入ること(入社する)。
입장료=ある場所に入るために支払う料金（文化施設、遊園地、会場など）。
입학식=新入生が学校に入ることを祝し、許可するために執り行われる儀式（入学式）。
잊혀지다=記憶の中にあった事実や内容が思い出せなくなる。（「忘れる」の受動態である「忘れられる」に「～くなる・～くなる」がついた二重受動表現だが、日常生活で広く使われる。）／心に抱いていた人や物に対する考えや情が遠ざかる。
잊히다=知っていた内容や記憶が頭の中から消える。（「忘れる」の被動詞：忘れられる）。／記憶すべき人や物などが記憶の中に留まらず、去っていくようになる。
자살하다=自ら自分の命を絶つ。
자연현상=人の力が加わらず、自然界で自ずと起こるすべての状態や現象。（例：雨、風、地震、日食など）
자정=夜の12時を指す言葉。（午前0時）
자주색=赤と青が混ざったような、濃い紫色を帯びた色。（藍色を帯びた赤色 / 紫色）。
작곡가=音楽作品を作ることを専門とする人。旋律、和声、リズムなどを構成して楽譜に表す仕事をする(作曲家)。
작은딸=複数の娘のうち、末っ子の娘を指す言葉。／複数の娘のうち、長女ではない娘たちを指す言葉。
작은아들=何人かいる息子のうち、長男を除いた残りの息子（次男以下の息子）。／（主に会話や手紙で）自分の息子が複数いる場合、次男以下の息子をへりくだって呼ぶ言葉。
작은아버지=父の既婚の弟を指す言葉（叔父）。／（比喩的に）父の兄弟や同世代の親戚の中で、年下の人を親しみを持って呼ぶ言葉。
작은어머니=父の弟（小父）の妻を指す言葉。／結婚した義叔父（夫の叔父）の妻を指す言葉。
작은집=父の弟である叔父の家を指す言葉。／宗家（本家）に対して、そこから分かれた一族（分家）。／（比喩的に）妾の家を指す言葉。
잔디=イネ科の多年草。茎が地表を這って節から根を出し、地面を密に覆うため、庭園や墓地、運動場などに植えて手入れされる。
잔소리=不必要に細々としたことをあれこれ言うこと。または、その言葉（小言）。／他人の過ちや足りない点を叱ったり干渉したりする言葉。
잠바=ゆったりとして動きやすく作られた洋風の上着。運動や作業の時、または普段着として広く着られる。「ジャンパー(jumper)」の非標準語的な表記だが、日常生活でよく使われる。
잠수함=水中を潜航して航行したり、作戦活動を遂行できるように設計された軍艦。敵の艦船を攻撃するための魚雷やミサイルを備えている。
잠옷=寝る時に楽に着られるように作られた服（パジャマ / 寝巻き）。
잡수다=「食べる」の尊敬語。主語となる対象を敬って言う時に使う。／（主に「年（歳）」と共に使われ）「食べる（取る）」の尊敬語。年を一つ取ることを敬って言う言葉。
장단점=長所と短所を合わせていう語。良い点と悪い点。
장례=死者を送り出す礼を尽くした儀式。遺体を処理し、墓地に安置したり火葬したりするなどのすべての手続きを含む（葬儀 / 葬礼）。
장마철=夏場に数日間、雨が降り続く期間や時期（梅雨時 / 梅雨の時期）。
장모님=妻の母を高めて呼んだり指したりする言葉（お義母さん / 丈母）。
장미꽃=バラの木に咲く花。通常、赤、ピンク、白、黄色など色が多様で、香りが強く、茎に刺があるのが特徴である。
장사꾼=商売をする人を低めて言ったり、比喩的に言ったりする言葉（商人 / あきんど）。／利益を得ることだけに長けていて、手腕が良い人を皮肉って言う言葉。
장인=妻の父を指す言葉（反対語：丈母（チャンモ・義母））。／年下の人が、目上の男性を敬ってもてなして呼ぶ言葉。／芸術や技術の分野で長年従事し、その分野に精通している人（主に「職人精神」などの形で使われる）。
장차=将来、いつか。これから現れる未来のある時に。
장하다=成し遂げたことや態度が立派で感心し、称賛に値する。／気概や威厳が堂々としていて雄大である。
재떨이=吸い終わったタバコの灰を入れたり、吸い殻を捨てたりする器（灰皿）。
재밌다=楽しさや満足感を与える要素があり、興味がある。（「재미있다」の短縮形）
재학생=現在学校に籍を置いて勉強している学生（在学生）。
저렇게=「저러하게（あのように）」の縮約形。話し手からも聞き手からも遠くにある対象の状態、形、性質などがあのような方式で。
저렴하다=品物の値段や料金などが安い。
저만큼=(代名詞) あれくらいの数量や程度。／(副詞) あれくらいの程度で。または、あそこに見える場所までの距離くらいに。／あのように。あんなに。（離れている距離や、分量・水準があれと同じくらいの状態であることを表す）／あそこまで。（比較的遠く離れている、あの程度の距離まで）／あの人くらい。あの人ほど。（「저이（あの人）」に格助詞「만큼（〜くらい）」がついた形で、あの人と同じくらいという意味）
저편=話し手や聞き手から遠く離れている場所や方向。／一定の線や境界を中心にして、反対側。／（代名詞的用法）ある対象や集団を指して、そちら側であることを表す言葉。
전공하다=ある分野を専門的に研究したり学んだりする。主に大学以上の教育機関で、特定の学問や技術を集中的に勉強することを意味する。
전구=電流を通じて光を出すガラス球状の器具。エジソンによって発明され、内部にフィラメントが入っていたり、ガスが充填されていたりする（電球）。
전라도=韓国の南西部に位置する行政区域を総称する名称。朝鮮時代の八道の一つで、現在の全北特別自治道と全羅南道を合わせた地域を指す。「全州（チョンジュ）」の頭文字と「羅州（ナジュ）」の頭文字をとって命名された。
전선=戦争で敵軍と自軍が互いに向かい合って戦う線（戦闘が行われる最前線地帯）。／社会的運動や勢力争いにおいて、互いに対立する勢力の境界（政治、経済、理念的な対決構図）。／[気象] 性質の異なる二つの気団がぶつかって形成される境界面が地面と接する線（寒冷前線、温暖前線など）。
전시되다=多くの人に見せるために、物が並べられる（展示される）。
전시하다=多くの人に見せるために、品物を特定の場所に並べる（展示する）。／威力や勢いなどを、わざとあらわに見せる。
전자레인지=高周波を利用して食品の分子を振動させることで発生する摩擦熱により、食べ物を素早く手軽に温めたり調理したりする台所用家電製品（電子レンジ）。
전자사전=紙の辞書をデジタルデータに変換し、携帯用端末やソフトウェアの形にした装置またはプログラム。単語検索、発音再生、学習コンテンツなど多様な機能を提供する。
전주=大韓民国全北特別自治道の中央部にある市。全北特別自治道の道庁所在地であり、韓屋村やビビンバなど、伝統文化と食が有名な歴史都市である。
전통문화=ある集団や共同体の中で過去から伝わり、現在まで受け継がれている固有の文化。その社会の価値観、風習、芸術、宗教などが含まれる。
접어들다=ある状態や時期に本格的に入る。／特定の方向に曲がって入ったり、道の内側へ入ったりする。／一定の数値や数量に到達する。
정리되다=乱雑だったり無秩序な状態が、整然と正される。／不要なものが片付けられたり、一定の秩序に従って分類される。／関係や感情、問題などが締めくくられたり解決されたりする。／お金や借金などが清算されたり、計算が締めくくられたりする (整理される)。
정수기=物理的、化学的な方法を用いて水中の不純物を取り除き、きれいにし、飲料水を作る機械装置。
정신과=精神医学を専門的に扱う病院の一分野。心の病や精神疾患、行動障害などを診断し、治療する場所を指す。／（略語）「精神健康医学科」を日常的に縮めて呼ぶ言葉。
정신없다=何かに集中したり、ひどく忙しくて他のことを考える余裕がない。／周囲の状況があまりにも複雑だったり騒がしくて、気が動転してうろたえている状態だ。／気力や意識がはっきりせず、ぼんやりしている。
정육점=牛肉や豚肉などの肉類を専門に販売する店（精肉店 / 肉屋）。
정직하다=心に偽りや飾りがなく、正しくて真っ直ぐだ。
제과점=パン、菓子、ケーキなどを作って売る店（製パン店 / ベーカリー）。
제대하다=軍人が規定された服務期間を終えて軍隊から出ること（除隊する）。／疾病や事故などの理由により、服務期間を満たせずに軍隊を退くこと。
제도적=慣習、道徳、法律などの規範や体制に基づいた。／国家や社会の組織的な体系の中で行われる。
제삿날=祭祀(チェサ)を執り行う日（祭日 / 命日）。
제시간=決められた時間。遅れずに間に合う適切な時間。
제의하다=意見や案を出すこと（提案する / 提議する）。
조개=軟体動物門二枚貝類に属する動物を総称する言葉。体は柔らかく、普通2枚の硬い石灰質の殻（貝殻）に包まれている。カキ、アサリ、ハマグリ、ホタテガイなどがこれに属する。
조그마하다=物体の体格や大きさがかなり小さい。数量や水準、程度が低い、または小さい。音が低い、または小さい。
조선=1392年に李成桂が高麗を倒して建国した国。儒教を統治理念とし、1910年まで続いた（朝鮮王朝）。／古朝鮮、すなわち檀君が建てた韓国史上初の国家を指す言葉。／「朝鮮民主主義人民共和国」の略称。
조정하다=ある基準や実情に合わせて正したり整えたりする（調整する / 調える）。／互いに食い違う意見や利害関係を調和させる（仲裁する / 調整する）。／機械や装置などが正常に作動するように手入れする（調節する / 整備する）。
조화되다=互いによく調和し、矛盾や食い違いがなく均一になる。／考えや主張が互いに衝突せず、一つにまとまる。
존경하다=他人の人格、思想、行為などが立派で、敬い慕う（尊敬する）。
졸업식=学生が規定の教育課程をすべて終えたことを記念して、学校で執り行われる儀式。
좀처럼=(主に後に「않다（ない）」、「없다（ない）」、「모르다（知らない）」などの否定の言葉が来て) 状態や行動が変化したり発生したりすることが非常に難しいさま。
종소리=鐘を叩いて鳴らす音（鐘の音）。
종아리=膝から下の足首までの後ろの部分。筋肉がついていて厚みがあり、歩いたり走ったりする時に重要な役割を果たす（ふくらはぎ）。
종합하다=個別に散らばっている様々な成分や要素を一つにまとめ、体系的なものに合わせる。／様々な状況や現象を全体的に把握して結論を下す。
좋아=相手の提案や意見に対して賛成したり同意したりする時に出す言葉。／ある事柄や状況に満足している時に出す言葉。／何かを始めたり決心したりした時、自分自身を励ましながら出す言葉。
좌회전=車や人などが左に曲がること。または、その方向（左折）。
주거=一定の場所に留まって住むこと。または、その家。／法律的に人が居住する場所を指す言葉。
주름살=皮膚が老化したり筋肉が収縮したりして、肌にできる筋や線（しわ）。／布地や紙などが揉まれてできた筋や線。／（比喩的に）心の苦労や歳月の痕跡を指す言葉。
주유소=一定の施設を備え、自動車や機械などに燃料（ガソリン、軽油など）を補給する場所。
주차권=駐車場を利用できる権利を証明する券。／駐車料金を事前に支払ったこと、または免除されることを示す紙やカード。
주차료=自動車を一定の場所に止めておくことに対して支払う料金(駐車料金)。
주차하다=車をある場所に止めておく（駐車する）。
주한=外国の軍隊や外交官などが大韓民国に駐在すること。またはその状態。
줄넘기=なわの両端を手に持って回しながら、そのなわを飛び越える運動。またはそのような遊び（なわとび）。／なわとびの運動に使用するなわ。
중계방송=放送局の外の現場で起きている状況を有線や無線の電気通信設備を利用して放送局に送った後、それを再び一般の視聴者や聴取者に送る放送（中継放送）。
중고차=すでに他の人がしばらくの間使用した自動車（新車ではない自動車 / 中古車）。
중고품=すでに使用したか、古くなった品物。または新品ではない品物の総称。
중국인=中国の国籍を持つ人、または中国系の血を引く人の総称。
중년=人の一生で青年期と老年期の中間の段階。普通40代から50代の時期を指す。／[生物] 身体的機能が徐々に衰え始めるが、社会的には最も旺盛に活動する時期。
중단되다=していたことが途中で止まるようになる（中断される）。
중식=中国で発達した固有の料理。または中国料理。／昼食（お昼ご飯）の略語。／中国固有の料理、または中国式に作られた料理（中華料理）。／昼食。主に軍隊や職場などの団体生活で昼に食べる食事のこと。
중요시하다=ある物事や現象、考えなどを価値があり大切なものと見なし、特に重きを置く。
중형차=大きさや排気量が中間程度の自動車。普通、小型車と大型車の間の規格を備えた乗用車を指す。
증명서=ある事実や身分、資格などを公的に証明するために作成した文書（証明書）。
지도하다=ある目的や方向に他人を教え導くこと。／団体や組織の活動において中心となり、統率すること。
지리산=慶尚南道、全羅南道、全羅北道にまたがる山。高さ1,915mで白頭大幹の南端に位置し、1967年に大韓民国第1号の国立公園に指定された。天王峰、般若峰、老姑壇の3大主峰を含め、数多くの峰と深い渓谷を抱く民族の霊山である。
지워지다=書かれたり描かれたりした文字、絵、痕跡などがなくなり、見えなくなる。（表面のものが消える）／心の中の記憶や考えなどが忘れられたり消えたりする。（抽象的な対象が消える）／付着していた汚れやシミなどが拭き取られてなくなる。（汚染が除去される）
지하실=建物の床が地表面の下にある部屋。主に倉庫、ボイラー室、駐車場、または居住空間として使用される。
지혜롭다=物事の理をよく悟り、事物を正確に判断する能力がある。（考えや行動が賢明で明철である。）
진단서=医師が患者を診察または検査した結果に基づき、健康状態や病名、治療意見などを記録して証明する書類（診断書）。
진단하다=医師が患者の病状を判断する（診断する）。／物事や現象の状態を調べ、その実態や問題点を把握する。
진료=医師が患者を診察し、治療すること。
진실로=嘘偽りなく、本当に。心に何の仮面や飾りもなく、心から。
진실하다=嘘がなく正しくて誠実だ。言葉や態度に偽りがなく真実だ。
진정하다=嘘がなく、真実で誠実だ。／切実で心のこもった気持ちが強い。／ある物事や現象が上辺だけではなく、本質的で純粋な状態にある。
진찰=医師が患者の病状を調べ、点検すること。（主に「診察を受ける」、「診察をする」の形で使われる。）
진통=子を産む時に起こる腹部の痛み。子宮の収縮によって生じる(陣痛)。／物事が十分に熟し、結果が出る直前に経験する試練や困難を比喩的にいう語(産みの苦しみ)。
진통제=痛みの症状を和らげるために使用する薬(鎮痛剤)。
질적=性質や素地に関係するもの。または数量や大きさのような量的な側面ではなく、物事の価値や水準、属性に関係するもの(質的)。
집중하다=一箇所に集めること、または集まること。／精神や力を一箇所に注ぐこと。
짠맛=塩や醤油などの成分が含まれており、舌で感じられるしょっぱくて塩辛い感じ。／(比喩的に) けちで物惜しみする性質や態度を指す言葉。
쩔쩔매다=ある事柄や状況に対処しきれず、どうすればいいか分からず慌てて弱り果てる。／誰かに圧倒されたり押さえつけられたりして、身動きが取れずひどく苦労する。
쫓아가다=前を行く人や物の後を追う。／ある目的を果たすために急いで行く。／流行、大勢、または他人の意見や行動などにそのまま従う。／（水準や実力が）勝っている対象に追いつこうと努力する。
쫓아내다=人や動物などをある場所から外へ強制的に出させる(追い出す / 追い払う)。／務めていた職務やポストから退かせる(免職にする / 追い出す)。／雑念、眠気、恐怖などの心理状態を消し去ったり、退けたりする(払拭する / 追い払う)。
쫓아다니다=ある人や対象を追いかけたり、継続してついて行ったりする。／ある仕事や目的を果たすために、あちこち忙しく動き回る。／誰かに好意を持って求愛したり、付きまとって困らせたりする。
쫓아오다=ある対象を捕まえたり会ったりするために、後を急いで追う（追いかける）。／ある水準や状態に到達するために後を追う（追い上げる）。／3. (생각이나 상황이) 머릿속이나 신변に 계속 머물거나 따라다니다.／（考えや状況が）頭の中や身の回りにずっと留まったり付きまとったりする。
찌꺼기=液体が溢れたり抜け出したりした後、底に残ったもの（かす / 残りかす）。／使い道がなくて捨てられた残りのもの（くず / 廃棄物）。／(比喩的) 清らかでない、または純粋でない心の状態や物事の痕跡（わだかまり / 残滓）。
찌푸리다=顔の筋肉や眉間にひどくしわを寄せる。（主に気分が良くない時や痛みがある時、あるいは光がまぶしい時に見せる表情）／天気が曇ったり、今にも雨が降りそうに暗くなったりする。
찜질=温水や冷水、薬物などに浸した布や氷嚢、または熱く熱した砂や石などを患部に当てて病気を治す治療方法。／健康を増진したり疲労を回復したりするために、熱い部屋や施設で体を温めること。
찡그리다=目や鼻、口などをしかめたり、すぼめたりする。主に不快感、痛み、いら立ち、または日差しがまぶしい時に見せる表情だ。／（比喩的に）天気や状況などが険悪になったり、良くない方向へ変わったりする。
차도=自動車が通る道。歩도（人道）と区別され、車だけが通行できるように作られた道路の部分（車道）。
차로=自動車が通る道（車道）。／道路で白い線によって区別され、自動車が一列ずつ通るように作られた道（車線）。
차림표=食堂やカフェなどで、客が選べるように料理や飲み物の名前と価格を記した表。「メニュー(menu)」と同じ意味で使われる。
차비=バス、列車、タクシーなどの交通手段を利用する時に払うお金（交通費）。
차원=物事を考えたり観察したりする立場、あるいは物事のある水準や段階。／[数学/物理] 空間内の点の位置を表すのに必要な座標の数。（例：1次元、2次元、3次元）／ある事柄の水準が他と明確に区別される状態。
착각하다=ある物事や事実を実際とは異なって見たり考えたりすること（勘違いする / 錯覚する）。
찬성하다=ある意見や提案、計画などが良いと認め、それと志を同じくする（賛成する）。／会議や投票などで、案件に対して肯定的な意思を表示する（賛成する）。
참고=照らし合わせて考えること。または、調べて助けになるような材料にすること。
참고하다=調べて役に立つ材料にする。物事を行ったり調べたりする際、資料や事実などを照らし合わせたり補足したりする(参考にする / 参照する)。
창피=面目がつぶれるような事柄や欠点などのために、他人に合わせる顔がないほど恥ずかしいこと。
창피하다=面目が潰れるような出来事のせいで、他人に会うのが恥ずかしく、面目ない。
찾아뵙다=目上の人に会うために、その場所へ行く。（「찾아가다（訪ねていく）」の謙譲語・尊敬語）
채점=試験や検査などで成績をつけるために点数を計算して記すこと(採点)。／運動競技や審査などで一定の基準に従って点数を与えること。
채택=いくつかの意見や案の中から一つを選び取ること(採択)。／作品、法律、制度などを受け入れて使用することに決めること(採用)。
처방=[医学] 病気の症状に応じて薬を調合する方法や治療法を定めること。または、その内容を記した書類(処方箋)。／[比喩] ある問題や事態を解決するための対策を立てること。または、その対策。
처방전=医師が患者に薬を調剤したり、投薬するように指示する内容を記した文書(処方箋)。／(比喩的に)ある問題や現象を解決するための対策や方法(処方箋)。
처하다=ある境遇や立場に置かれる。／ある決定や処分を受ける。
천둥=雷鳴。雲の間で電気が放電される時に発生する非常に大きな音。一般的に稲妻（雷光）と共に現れる。
천사=宗教、特にキリスト教で神の意志を人間に伝え、人間を保護する霊的な存在。通常、翼がある姿で描写される。／性格が非常に良く、心の優しい人を比喩的にいう言葉。／可愛くて純粋な子供を比喩的にいう言葉。
천주교=イエス・キリストを救世主として信じ、教皇を首長とするキリスト教の一教派。聖母マリアを崇敬し、七つの秘跡（七聖事）を行うのが特徴である。（類義語：カトリック）
철학적=哲学の原理や方法で事物を観照したり思索すること。／根本的かつ普遍的な態度で事物の理を問い、深く考えること。
첨부=書類や文書などを本文の後ろに付け加えること(添付)。
첫눈=その年の冬に初めて降る雪（初雪）。／初めて見た時の感じや印象（主に「一目で」の形で使われる）。／その年の冬に初めて降る雪。／初めて見た時の感じや印象。
첫사랑=初めて感じた愛。または、その愛の対象（初恋）。
첫인상=ある人や物に初めて会った時に受ける印象（第一印象）。
청구서=他人に金銭や物品などを送るよう要求する内容を記した文書。主にサービス利用料や商品の代金を支払うよう要請する際に使用する（請求書）。
청소기=機械装置を利用して、ほこりやゴミを吸い込み、室内をきれいに掃除する道具（掃除機）。／ほこりやゴミを吸い込んだり拭き取ったりして、掃除をするために使う機械（掃除機）。
청혼=結婚を申し込むこと。または、その申し込み（プロポーズ）。
체계=一定の原理に従って、個々の要素がまとまりをもって組織され、統一された全体をなしている状態（体系）。／知識や学問の内容が一定の論理的順序に従って整理された構造。／組織や制度の整った形式。
체면=1. 他人に対して恥ずかしくない道理や面目。2. 社会的地位や身分に応じて当然備えるべき威信や自尊心。
체험하다=自ら経験して知るようになる。ある事柄や現場に直接参加して経験を得る。
초-=(一部の名詞の前に付き)「初めて」または「初期」の意味を添える接頭辞。
초가을=秋が始まりかけた頃。おおよそ9月初旬から中旬頃を指す(初秋)。／(提示された説明に従い)初秋に吹く涼しい風。
초겨울=冬が始まる頃。通常、陽暦11月下旬から12月初旬の間を指す(初冬)。／初冬に感じられる寒さ(初冬の寒さ)。
초급=学業、技術、能力などの段階や水準で、最も基礎となる低い段階。
초록=青色と黄色の間の中間色で、草の色や木の葉の色のように青みを帯びた色（緑 / 草色）。／（比喩的に）自然、環境保護、あるいは新鮮さを象徴する言葉。
초봄=早春。春が始まる初期の段階。／[比喩的な意味] 物事が始まったり、活気を帯び始めたりする初期の段階。
초상화=人の顔や姿を描いた絵。実物そっくりに描くことを原則とし、人物の外見だけでなく、性格や内面世界まで表現しようとするもの。
초순=一か月の初めの日から10日目までの間（上旬）。
초승달=旧暦の毎月一前後に昇る眉の形の月。右側に曲がった細い形が特徴である。
초조=物事が思い通りにいかなかったり, 悪い結果が出たりすることを心配して、いらいらして不安でたまらないこと（焦燥 / じれったさ）。
초조하다=もどかしかったり、気がかりで心がハラハラする。（心が不安で緊張した状態を表す。）
초청하다=ある人や団体を丁寧に招いて来てもらうこと。主に公式な行事、講演、公演、または特別な席に客として迎える時に使う。
촛불=ろうそくに火を灯して生じる炎。／ろうそくに火を灯して明るくする光。
최상=一番高いこと。または、一番上。／状態や水準などが申し分なく、最高であること。
최소=数量や程度が最も小さいこと。／一定の範囲内で最も小さい値。
최악=最も悪いこと。また、そのような状態（最低の段階や状態を意味する）。
최후=最後。一番終わり。または、命が絶える時（死）。
추가되다=後でさらに付け加えられる。すでにあるものに別のものが加わる。
추가하다=すでにあったり決まったりしているものに、後からさらに付け加える。
추천서=ある人を他人や機関に紹介し、その人の能力、品性、素質などを肯定的に評価して保証する文章（推薦状）。
추천하다=ある条件に適した対象を他人に紹介したり勧めたりすること。／ある人を特定の職位や役職に適していると他人に知らせること。
축구장=サッカーの試合ができるように設備を整えた広場や競技場（サッカー場）。
출근길=職場へ仕事に行く道。または、職場へ行く途中。
출발점=物理的にある場所へ向かって出発し始める地点（出発点 / 始点）。／ある事柄や現象が始まる部分やきっかけ（出発点 / 始まり）。
출석하다=授業、集まり、行事などの定められた場所に直接出向いて参加すること。
출현=現れていなかった現象や物体が現れること。／ある人が世の中に初めて姿を現すこと。／歴史的、社会的に新しい思想や勢力が形成されて現れること。
출현하다=現れなかった現象や物体が新しく現れること。／ある人が世の中に初めて姿を現したり、その場に現れること。
충돌하다=互いにぶつかり合ったり、突き当たったりすること（物理的な衝突）。／考え、立場、利害関係などが互いに一致せず、対립すること（抽象的な対立）。
충청도=大韓民国の中西部に位置する地方行政区画の一つ。朝鮮時代の八道の一つで、現在の忠清北道と忠清南道、大田広域市、世宗特別自治市を合わせた地域を指す。「忠州」と「清州」の頭文字をとって命名された。
취업난=不況や産業構造の変化などにより、求職者が職を得ることが非常に困難な社会現象。
측면=物の横の面(側面)。／ある事項や現象の一部分、または側面。あるいは物事を見る観点(側面 / 観点)。／[軍事] 隊形や陣形の左側、または右側の横方向(側面)。
치료제=病気や傷を治すために使われる薬。／(比喩的に) ある問題や悪い状況を解決したり取り除いたりする方法。
치수=衣類、靴、手袋などの大きさを表す数値（サイズ）。／物の長さ、幅、厚さなどの長さを測った数値（寸法）。
치아=口の中の上顎と下顎の歯槽に刺さっている、消化の第一段階である食べ物を噛む機能をする硬い組織。「歯」の専門的または格式張った表現。
친-=「直系血統の」または「親等（血縁）が近い」という意味を添える接頭辞。／（一部の名詞の前に付いて）「その国やその勢力と親しい」という意味を添える接頭辞。
친딸=自分が直接生んだ娘。（継娘や養女ではなく、血縁関係にある娘）／（比喩的に）血縁ではないが、実子のように大切にし、慈しみながら接する女の子。
친아들=自分が直接生んだ息子（実の息子）。／（比喩的に）血縁関係ではないが、実の息子のように親しく大切に接する対象。
친아버지=自分を生んでくれた実の父親を指す言葉（実父）。／(比喩的) 生みの親ではないが、それに準ずるほど親しく情深く接してくれる対象。
친어머니=自分を直接産んでくれた母親（実母）。
친언니=同じ両親から生まれた年上の女性のきょうだい(実の姉)。／(比喩的に) 血縁関係ではないが、それほど身近で親密に感じられ、実の姉妹のように接する年上の女性。
친오빠=同じ両親から生まれた、年上の男性を指す言葉（女性の妹が呼ぶ言葉）。／比喩的に、血縁関係ではないが、それほど近くて親密で、実の兄弟のように接する年上の男性を指す言葉。
친해지다=互いに付き合って情が深くなる。（ある対象と親密な関係になる / 仲良くなる）。／物事や現象が目や手に馴染んで慣れる。
칠하다=物の表面に色のついた液体（絵の具、ペンキ、油など）を塗る。／ある対象に色をつけたり、上塗りをしたりして飾る。
침착하다=行動や性格が浮ついておらず、落ち着いている。／ある事に直面した際、慌てずに平静さを保っている状態である。／表に現れず、深く沈んでいる。（主に雰囲気や色合いなどに用いられる）
칭찬하다=人の良い点やよくやったことなどを高く評価して言う(褒める / 賞賛する)。
캐릭터=小説、映画、演劇、漫画などの作品に登場する人物。その人物の性格、特徴、役割などを包括的に指す言葉。／独特な個性や性格。ある人だけが持つ固有の特質。／デザインや広告を目的として作られた象徴的な形状。特定の企業や商品を代表するために考案された絵やイメージ。
커트=美容や理髪で、はさみやかみそりなどで髪を切ること。また、そのようにした髪型。／スポーツの試合（テニス、卓球など）で、ボールに逆回転を与えて削るように打つ打法。／映画や映像の編集で、場面と場面を区切ったりつなげたりする単位。
컨디션=体や心の健康状態。主にその日の元気や活動能力を指す言葉。／周囲の状況や条件。
케첩=トマトを主原料とし、砂糖、酢、塩、香辛料などを加えて煮詰めた洋風ソース。主に揚げ物や肉料理に添えて食べる。
코끝=鼻の最先端の部分(鼻先)。／(比喩的に) ごく近い距離や目の前を指す言葉(鼻先 / 目と鼻の先)。
코스모스=「名詞」 『植物』 キク科の一年草。高さは1.5~2メートルほどで、葉は羽状に細かく裂ける。6~10月に淡紅色、白色、赤色などの花が枝先に咲き、秋を象徴する代表的な花である。／「名詞」 秩序と調和を持つ宇宙。混沌を意味する「カオス(Chaos)」の対義語である。
코치=運動競技で選手の技術を指導し、訓練を担当する人。／ある分野の知識や経験を持つ人が、他人に技術や助言を提供して目標達成を助けること、またはその役割をする人。／(稀に) 大型バスや鉄道の客車を意味することもある。
콘도=「コンドミニアム(condominium)」の略称。観光地やリゾート地に建てられた宿泊施設で、キッチン設備を備えて自炊が可能であり、会員権を持つ人々が共同で利用したり一般人が宿泊したりできる施設。
콜록콜록=胸の奥から響き出る咳の音、またはその様子。主に風邪を引いたり、気管支の状態が良くない時に出る音を表す。
콧노래=口を閉じたまま鼻だけで出す音で歌う歌。主に気分が良い時に口ずさむ音を指す(鼻歌)。
쾌적하다=気分や体の状態が爽やかで清潔で、心地よい。主に空気、環境、場所などが清潔で涼しく、気持ちの良い状態を表す。
쿠데타=武力で政権を奪う非合法的な行動。主に軍隊など国家内の強力な物理力を持つ集団が、既存の統治体制を崩壊させ政権を掌握することを指す。
쿠폰=商品の価格を割引したり、特定のサービスを無料で受けられるように発行された証書や券。／一定回数利用すると無料進呈や特典を与えるために、スタンプを押したり穴を開けたりするカード。
쿨쿨=ぐっすり眠って大きく息を弾ませる音。またはその様子。
큰돈=額の多いお金。価値が非常に高い、かなりの分量の資金。
큰딸=複数の娘の中で一番目に生まれた娘（長女）。
큰아버지=父の兄を指す言葉。／親戚の中で親と同世代であり、父よりも年上の男性を親しみを込めて呼ぶ言葉。
큰어머니=父の兄の妻（伯母）を指す言葉。また、親と同列の親族の女性の中で、父の兄の妻にあたる人を指す言葉。
큰절=冠婚葬祭や目上の人に会う際に行う丁重なお辞儀（クンジョル）。（男性は両手を額の高さまで上げてから床につき、体を曲げて拝礼し、女性は両手を肩の高さまで上げた後、膝をついて座り、頭を下げて拝礼する。）
큰집=宗家（チョンガ）、すなわち行列が最も高い宗孫が住む家。／伯父（父の兄）の家を指す言葉。／（俗語）刑務所を比喩的にいう言葉。
클래식=西洋の古典音楽。主に18世紀から19世紀にかけて完成された伝統的な音楽形式を指す。／流行に左右されず、長い間変わることなく愛され続ける典型的な様式やスタイル。
타인=自分以外のほかの人。／法律的に当事者以外の人。
타자기=文字のキーを叩いて紙に文字を印字する機械（タイプライター）。
탁=強く叩いたり打ったりする音。またはその様子。／詰まっていたものが急にすっきりと開く様子。／気力や勢いが急に挫けたり止まったりする様子。／火や光が急に明るく点る様子。／ある物を急に強く置いたり投げたりする様子。
탈출=ある拘束や制約、危険な状況などから抜け出すこと。／ある場所や状態から外へ出ること。
탈출하다=拘束や制約、危険な状況などから抜け出し、外に出る（脱出する）。／ある状態や境遇から完全に抜け出す。
탑승=飛行機、船、車などの乗り物に乗ること。
탑승객=飛行機、船、列車などの乗り物に乗って旅行する客（主に飛行機の乗客を指す）。
테러=政治的な目的や相手に恐怖を植え付けるために暴力を使う行為。またはその手段。／（比喩的に）相手に大きな衝撃、不快感、または身体的な脅威を与える行為を指す言葉。
토론자=討論に参加して自分の意見を述べたり、相手の意見に対して反論したりする人（討論者 / パネリスト）。
토론하다=ある問題について、多くの人が各自の意見を主張し, その正否を問いながら議論すること（討論する）。
토론회=ある問題について、多くの人がそれぞれの意見を出し合って議論する集まり（討論会）。
토의=ある問題について検討し協議すること。または、複数の人が集まってある主題について互いの意見を交わし検討すること（討議）。
통일하다=分かれたものを一つに合わせる（統一する）。／体系や形式を一つに一致させる（統一する）。／散らばった国家や勢力を一つに集めて統治する（統一する）。
통통하다=肉がほどよくついて、体つきが可愛らしくふっくらしている状態だ。／物の体積がほどよく厚みがあったり、ふくらんでいたりする。
통행=人や車などが通りや道を行き来すること。／一定の区域や門を通り過ぎたり、出入りしたりすること。／（主に「禁止」と共に使われ）特定の場所を通りかかる行為を妨げること。
퇴원하다=病院に入院して治療を受けていた患者が病院から出ること(退院する)。
퇴직=現職から退くこと。職場や職業を辞めて退くこと。（主に定年や個人的な理由で仕事を終えることを指す。）
퇴직금=労働者が一定期間勤労を提供し、職場を辞める際、使用者が労働者に支払う給与や一時金（退職金）。
특급=特別な級。または、最も高い級(特級)。／「特急列車」を略していう言葉。一般の列車より速度が速く、設備のよい列車のこと(特急)。
특기=他人が持っていない特別な技術や特技。／特別に記すこと。または、その記録。
특수성=一般的なものとは異なる、その対象だけが持っている固有の性質や特徴。
특정=特別に指定されていたり, はっきりと区別されていること。／数多くのものの中から、ある一つを指し示すこと。
튼튼히=物体や構造物が簡単に揺れたり壊れたりしないように、固く、がっしりとした状態で。／体に病気がなく健康で、元気がみなぎっている状態で。／考えや組織、基盤などが揺らぐことなく、確固として充実している様子で。
틈틈이=暇があるたびに。（時間的な余裕ができるたびに度々。）／物の間や隙間ごとに。
파괴=打ち壊したり、砕いたりして崩すこと。／組織、秩序、関係などを壊してなくしてしまうこと。／環境や生態系などを損なわせ、元の状態を失わせること.
파랑=澄んだ空や深い海のように、明るく鮮やかな青色。／光のスペクトルで藍色と緑の間の色。
파마=薬品や熱を利用して髪の毛をカールさせたり, 逆に真っ直ぐに伸ばしてその状態が長く維持されるようにする髪型, またはそのこと。
파트너=何かを一緒にする相棒や相手。／ダンス、スポーツ競技、ゲームなどでチームを組んで活動する人。／ビジネスや事業上の協力関係にある人または企業。／人生を共にする配偶者や恋人。
판매되다=商品や品物などが一定の対価を受け取って売れる。
판매자=商品やサービスを対価を受け取って他人に売る人、または団体（販売者 / 売り手）。
팔꿈치=腕の上腕と前腕がつながる関節の外側の部分（ひじ）。
팝송=英米圏を中心とした西欧の大衆歌謡。主に英語を歌詞とするポピュラー音楽を指す言葉。
패스트푸드=注文するとすぐに出てくる手軽な食べ物。ハンバーガー、ピザ、フライドチキンなどが代表的で、調理時間が短く持ち運びが簡単だという特徴がある。
팩스=文字、絵、図表などの静止画像を電気信号に変えて電話線を通じて伝送し、受信側でこれを再び元の形に復元して紙に印刷する装置、またはその方式。（ファクシミリの略語）／ファックスを通じてやり取りする文書や内容物。
팩시밀리=文字、絵、図表などの静止画像を電気信号に変えて電話線を通じて伝送し、受信側で再び元の形通りにコピーし出す通信装置。またはその方法。（略して「ファックス」ともいう。）
페이지=本や帳簿などの片面。または、その面を表す数字。／ある出来事や歴史の一時期、または局面を比喩的にいう言葉。／コンピュータ用語で、メモリ管理やウェブブラウザの画面単位を表す言葉。
페인트=物体の表面に塗って色を出したり、腐敗を防いだりする化学物質。顔料を油や樹脂などと混ぜて作る(ペイント / 塗料)。
편식=食べ物をバランスよく食べず、自分の好きなものだけを選んで食べること（偏食）。
펼치다=畳まれていたものや巻かれていたものを広く広げる。（例：本、翼、傘など）／考えや計画、夢などを表に現したり進めたりする。／前を塞いでいるものを押し開ける。／ある状態や景色が広く繰り広げられる。
평등=権利、義務、資格などが偏ることなく、すべての人に均等に適用される状態(平等)。／差別なく同等な待遇を受ける状態。
평양=北朝鮮の首都。大同江の下流に位置し、朝鮮半島で最も古い都市の一つで、高句麗の首都でもあった。北朝鮮の政治、経済、文化の中心地である。
포기=やっていたことを途中でやめてしまうこと（放棄 / 断念）。／自分の権利や資格、品物などを捨てて持たないこと（放棄）。／植物の根を単位とした草や木の個体（株）。
포인트=話や文章、ある物事において最も重要な部分（要点 / 核心）。／試合、試験、または商取引などで得た点数や蓄積された数値（ポイント / 得点）。／特定の場所や目標となる地点（ポイント / 地点）。／ファッションやインテリアなどで目を引くために付け加えた強調要素（アクセント / ワンポイント）。／文字や印刷物の大きさを表す単位（ポイント）。
포장마차=天幕（テント）を張って雨風を防げるように作った馬車。／通りや空き地にテントを張り、簡易施設を整えて食べ物を売る場所。主に夜間に酒類やおつまみ、軽食（粉食）などを販売する。
포장지=物を包んだり、まとめたりするのに使う紙(包装紙 / ラッピングペーパー)。
폭발=中に蓄積されていた圧力やエネルギーが急激に噴き出すこと。または、それに伴い音と共に破壊的な力が放出されること。／抑えられていた感情が一気に強く噴き出すこと。／ある現象や状態が急激に勢いよく起きたり、増えたりすること。
폭설=急にたくさん降る雪(大雪 / 豪雪)。
폭우=突然激しく降り注ぐ激しい雨。短時間、狭い地域に集中的に降る雨を指す(豪雨 / 大雨)。
폭포=高い崖や険しい場所から水の塊が真っ逆さまに流れ落ちること。また、その水（滝）。
표준어=一国で共通に使うために規範として定めた言葉。韓国では「教養のある人々が幅広く使う現代のソウル言葉」を原則とする。／情報伝達の効率性を高め、国民間の円滑なコミュニケーションのために人為的に確立された言語体系。
표지=本や雑誌などの表面を包んでいる厚紙や革、布。内容を保護し、題名や著者などを表す(表紙)。／ある事物を他のものと区別したり、何かを知らせるために立てたり貼ったりする印(標識 / 目印)。
표지판=ある事実を知らせるために、一定の記号、文字、絵などを描いて路傍や壁などに立てたり貼ったりした板（標識板 / 看板）。
풍기다=匂いが風に乗って漂う。または、匂いを広く漂わせる。／ある雰囲気や気配、印象などが外に現れる。
풍선=ゴムやビニールなどの袋に空気や軽い気体（ヘリウムなど）を入れて膨らませたもの。主に装飾用や玩具として使われる。／（比喩的意味）外見は立派だが中身がなく、すぐに破裂したり消えたりしそうな状態を指す言葉。
피디=放送局やプロダクションで番組の企画、制作、演出を総括する人。英語の「Producer」または「Program Director」の略語。
피망=ナス科の一年草、またはその果実。トウガラシの一種で辛味がほとんどなく甘みがあり、シャキシャキとした食感が特徴である。形は丸くてふっくらしており、普通は緑色や赤色を帯びている。
피부병=皮膚に生じる病気の総称。湿疹、アトピー、水虫、ニキビなど、皮膚組織に異常が生じるあらゆる疾患を含む。
피서=暑さを避けて涼しい場所へ移ること。または、そのこと(避暑)。
필기=講義、講演、会議などの内容を文字に書き取ること。／実技試験や面接試験ではなく、筆記で行う試験。（筆記試験の略語）
필수품=日常生活を送ったり、ある仕事をするのに欠かせない、必ず必要な物。
하나님=1. [キリスト教] 宇宙を創造し主宰する、全知全能で愛が無限な唯一神。／2. [一般] 天地万物を司る絶対的な存在を敬っていう語。
하반기=一年の半分、後半の半年間のこと。普通7月から12月までを指す(下半期)。
하숙=一定の下宿代と食費を払って他人の家に滞在し、寝起きすること。または、そのような家。
하순=一ヶ月を十日ずつ三つに分けたうち、二十日からその月の末日までの期間（下旬）。
하양=白い色、またはその物体。雪や牛乳の色のように明るく清らかな色を指す。
하차=乗っていた車や汽車、飛行機などから降りること。／ある仕事や計画、役職などから途中で辞めたり退いたりすることを比喩的にいう言葉。
학교생활=学生として学校で勉強したり活動したりして過ごす生活（学校生活）。
학문=ある分野を体系的に学んだり研究したりすること。または、その知識。／真理を探究して得た知識の体系。
학위=一定のレベルの学術的成就を成し遂げた人に、大学や大学院で授与する称号（学士、修士、博士などがある）。
학점=大学や専門学校などで履修すべき講義時間数を示す単位（単位）。／教科目の履修程度や成績を示す点数（成績 / 評価）。
한구석=隅っこのある一箇所。／心の一部分を比喩的にいう言葉。
한국인=大韓民国の国籍を持つ人。または韓民族の血統と文化を受け継いだ人を総称する言葉(韓国人)。
한글날=世宗大王が訓民正音（ハングル）を創製して世に公布したことを記念し、固有の文字であるハングルの優秀性を称えるための祝日。日付は10月9日である。
한데=いくつかのものが一箇所に。または、一塊になって。／家の外や露天（野外）。
한라산=済州島の中央部にそびえる死火山。高さは1,947.2メートルで韓国で最も高い山であり、山頂には火口湖の白鹿潭（ペンノクタム）がある。多様な植生が分布しており学術的価値が高く、国立公園に指定されている。
한반도=アジア大陸の東端から南へ突き出た半島。西は黄海、東は日本海（東海）、南は南海に面しており、現在は大韓民国と朝鮮民主主義人民共和国が位置している。
한정하다=数量、範囲、期間などを一定の限度内に定めたり、その限度を超えないように制限すること。
한평생=生まれてから死ぬまでの間（一生 / 生涯）。
한하다=数量、範囲、期間などがある限界にとどまる。／ある条件や状況に局限される。（主に「〜に限って」の形で使われる）／心の中に恨みや心残りが残る。
할부=品物の代金やお金を一括で支払わず、数回に分けて支払う方式。またはそのような条件(分割払い / 割賦)。
할인점=流通段階を短縮したり、大量に商品を買い入れたりすることで、消費者に対して市場価格より安い価格で商品を販売する大規模な商店（ディスカウントストア）。
함께하다=経験や活動、考えなどを他の人と共にする。／ある出来事や現象が同時に起きたり、添えられたりする。／生死や運命を共にする。
합격자=試験、検査、審査などに合格して資格を得たり、選抜されたりした人（合格者）。
합격하다=試験、検査、審査などで、定められた基準や形式に適合して通過すること。
합계=二つ以上の数や量をすべて合わせた計算。または、そのように計算して出た数値(合計)。
합의=二つ以上の意見が一致すること。またはその意見。／法律的な意味で、二人以上の義務や権利に関する意思表示が一致すること。
항공기=空気の作用（浮力や揚力）を受けて空中を飛ぶことができる機器を総称する言葉。飛行機、ヘリコプター、飛行船、滑空機などがこれに属する。
항공료=飛行機に乗って旅行したり、荷物を送ったりする際に支払う運賃や料金（航空運賃 / 航空料金）。
항공편=飛行機が旅客や貨物を載せて定期的に行き来する路線、またはその運航計画。／郵便物や品物を飛行機で送ること。
해결책=ある事件や問題などを解決するための方法や計画（解決策）。
해답=質問や疑問、または数学の問題などを解いて出した答え。／ある困難な状況や問題を解決するための手段。
해돋이=太陽が昇り始めること。またはその現象。（類義語：日出）
해방=拘束や抑圧、負担などから解放され、自由な状態になること。／一民族が他民族の支配から脱して独立を迎えること。
해변=海と陸が接する場所のふち。主に砂浜や砂利場が広がっている所を意味する。
해산물=海から取れる産物の総称。魚、貝、ワカメ、海苔などを含む。
해소하다=困難な状況や良くない状態を解消してなくしてしまうこと。／ある団体や組織などを解散してなくすこと。／積もり積もった怨恨や感情などを晴らすこと。
해치다=人の体や生命、心などに害を与える。／状態や性質などを悪くしたり、損傷させたりする。／物や環境、雰囲気などを壊したり、台無しにしたりする。
햄=豚の後ろ足の肉を塩漬けにして燻製にしたり、茹でたりして作った加工食品。／広い意味では、豚肉や他の肉類を細かく砕いて味付けした後、ケーシングに入れて加工した食品を総称する。
행사장=集会や儀式、公演、展示などの行事が行われる場所（会場）。
행정=国家や公共団体が法令に従い、実際に国家目的を達成するために行う統治作用。／行政事務を司る機関や組織。
향상되다=実力、水準、技術などが以前より向上したり高まったりする。
허락하다=願い出たことをするように聞き入れる（許す / 許可する）。／（主に「許す限り」の形で使われ）ある条件や状況を可能にする。
허리띠=ズボンやスカートがずり落ちないように腰に締める紐や革の帯。（類義語：ベルト）／（比喩的に）質素な生活をしたり、経済的に節約する態度。
허벅지=人の足で、膝の上から骨盤の下までの肉の厚い部分（太もも）。
험하다=地形や道が平坦ではなく、傾斜が急で岩が多く、通りにくい。／物事の状況や将来が順調ではなく、苦労が多い。／顔つきや言葉遣い、態度などが荒くて険しい。／天気が雨風が強かったり嵐になったりするなど、ひどく悪い。
헤엄치다=人や魚などが水中で手足やひれを動かして前に進む。／(比喩的に) ある雰囲気や状態に深く浸ったり、自由に遊び回ったりする。
현관문=建物の入り口である玄関にあるドア。外部と内部をつなぐ最初の一番目のドアを指す(玄関ドア)。
협조=力を貸して助けること（協力 / 援助）。／ある目的を果たすために、互いに心と力を合わせること（協力 / 協調）。
형수=男性が自分の兄の妻を指したり呼んだりする言葉（義姉 / 兄嫁）。
형식적=実質がなく、うわべや手続きだけに重点を置くこと。／一定の形式や体系を備えている様子。
호감=ある対象や人に対して抱く良い感情。または、その対象が与える感じの良い印象。
호남=韓国の錦江（クムガン）以南の地域を指す言葉。主に全北特別自治道と全羅南道を合わせた名称。／（歴史的意味）湖（堤川の義林池、または金堤の碧骨堤）の西側の地域という意味に由来する地名。
호두=クルミの木の実。殻は硬く、中身は脂肪分が多くて香ばしい味がし、食用や薬材として使われる。
호르몬=動物の内分泌腺から分泌され、血液を通じて体内の特定の器官に運ばれ、その器官の機能を調節したり代謝を助けたりする化学物質。／植物の体内で生成され、茎や根の成長、開花、結実などを調節する物質。
혼내다=過ちを犯した人に厳しく叱ったり、罰を与えたりする（叱る / 懲らしめる）。／ひどい目に合わせたり、激しく叩いたりする（ひどい目に遭わせる / 痛めつける）。
혼잣말=相手がいないところで自分一人でする言葉（独り言）。
홀수=2で割り切れない整数。1、3、5、7、9などがこれに該当し、「偶数」の反対語である。
화장대=化粧をしたり髪を整えたりできるように鏡が付いており、化粧品や道具などを置いたり収納したりできるように作られた家具（化粧台 / ドレッサー）。
화창하다=天気が晴れて穏やかで、活気がある。主に春や秋の暖かく明るい天気を形容する時に使う。
화폐=商品の交換、価値の尺度、支払いの手段、および価値貯蔵の手段として社会的に通用する媒介物。紙幣や硬貨などを総称する言葉。／実物がなく、情報通信網を通じて電子的な形で流通する電子マネーを含めて指す言葉.
화해=争いや喧嘩をやめ、互いに許し合って仲良く過ごすこと。／葛藤状態にある両者が譲歩し、紛争を終わらせること。
확대=形や規模などを元より大きく広げること（拡大）。／勢力や範囲、権力などをより広げたり大きくしたりすること（拡大 / 拡張）。
확립하다=体系、見解、組織などがしっかりと立つ。または、それをしっかりと打ち立てる（確立する）。
확산=散らばって広く伝わること。／(物理/化学) 濃度が高い方から低い方へ分子が移動し、濃度が均일になる現象。／(社会) 新しい文化要素や知識、情報などが連鎖的な接触を通じて伝わり、広まっていく現象。
확신하다=強く信じる。または、正しいと断定する。
환불=支払済みの代金を返却すること。またはそのお金。主に商品を返品したりサービスを利用しなくなったりした際に使われる。
환상=1. 現実にはないものをあるかのように感じる精神現象。 2. 事実でないことを事実だと信じたり、現実的に可能性のないことを望んだりする状態。 3. 考えや態度が現実とかけ離れている状態。
환상적=現実では起こり得ない、奇抜で非現実的な感じや雰囲気があること。／現実の範囲を超え、夢や想像の世界のように美しく素晴らしいこと。／(文学) 超自然的な要素や幻想を素材とした小説や芸術作品の性格。／現実には存在しない幻想や空想のような感じを与えること。／非常に美しかったり立派だったりして、まるで夢の中で見たかのように奇異でうっとりするほど素晴らしいこと。
환승역=二つ以上の路線が互いに交差し、別の路線に乗り換えられるように作られた駅（換乗駅 / 乗り換え駅）。
환영하다=来る人を喜んで迎える（歓迎する）。／ある事柄や現象を好意的に受け入れる（歓迎する）。
환영회=新しい人を迎えるために開く集まり(歓迎会)。
활동적=体を動かして活発に行動するさま。／ある事柄の普及や発展のために尽력して動くさま。／体を動かしてすることに元気で熱心なこと。／一定の目的を達成するために活発に動くこと。
활발해지다=生き生きとして力強く、元気が溢れる状態になる。／活動や現象が前よりもさらに勢いよく盛んに起こる。
회담=二人以上の人が一箇所に集まり、ある問題を解決したり論의したりするために公式に対話すること。またはその集まり(会談)。
회복되다=健康状態が良くなる：病気や怪我などで悪化した体の状態が、本来の健康な状態に戻る。／元の状態に戻る：下락したり悪化したりした経済、関係、名誉、気力などが再び良い状態に戻る。／失ったものを再び取り戻す：権利や資格、機能などを再び保有するようになる。
회비=集まりや団体の運営および活動に必要な費用に充てるため、その構成員たちが分担して出す金（会費）。
회식=大勢の人が集まって一緒に食事をすること。または、職場や団体などで団結を目的に構成員が集まって食事をする公式的な集まり（会食 / 飲み会）。
회의실=数人が何らかの案件を議論したり協議したりするために集まれるように設けられた部屋（会議室）。
회전=物体がある線や点を中心にして回ること。／一定の範囲内で順次に移りながら回ること。／資金や物資などが運用されて回ること。／頭の回転や状況に対処する能力が発揮されること。
효도하다=親に真心を込めて仕える。子として親に対して当然守るべき道義を尽くす（親孝行する）。
후식=食事を終えた後にお口直しとして食べる食べ物。果物、菓子、お茶、アイスクリームなどがある。（類義語：デザート）
후추=コショウの実を乾燥させて粉末にした調味料。特有のピリッとした味と香りがあり、肉や魚の臭みを取り、料理の風味を引き立てるのに広く使われる。
후회스럽다=以前の過ちを悟り、自らを責めたり惜しんだりする気持ちがある。過去の選択や行動が間違っていたと感じ、心が晴れず残念だ。
휴가철=職場や学校などで仕事を休み、休息を取る時期や時（休暇シーズン / 休暇時）。
휴대=ある物を手に持ったり、身につけて持ち歩くこと。／手軽に持ち運べる便利な状態。
휴양지=安らかに休みながら心身を整えるのに適した場所。主に景色が美しかったり空気が澄んでいたりする場所に作られている（休養地 / リゾート地）。
휴학=学生が病気やその他のやむを得ない事由により、学校の許可を得て一定期間授業を休むこと(休学)。
흐려지다=天候や光などが晴れやかでなくなる。／液体の中に異物が混じり、透明でなくなる。／記憶、意識、視力などがはっきりしなくなる。／言葉の末尾や態度などがはっきりせず、曖昧になる。／社会秩序や雰囲気などが乱れる。
흡수=内側や外側から液体、気体、光、音などを吸い込むこと（吸収）。／ある物事や勢力などを自分のものにして合わせること（吸収 / 合併）。／知識や技術などを学んで自分のものにすること（吸収 / 習得）。
흥분하다=ある刺激を受けて感情が高ぶったり、心がうきうきしたりする。／生物体の組織や細胞が外部の刺激に反応して、通常より活発に活動する。
희망자=あることをすることを望んだり、希望したりする人（希望者）。
희망하다=将来、何か良い結果が現れることを願ったり期待したりすること。／あることを成し遂げたり、したいと思ったりすること。
희생자=事故や災難、戦争などの不幸な出来事によって命を落としたり、被害を受けたりした人（犠牲者 / 被害者）。／他人やある目的のために自分を捧げたり、不利益を被ったりした人（犠牲者）。
희생하다=他人やある目的のために、自分の命・財産・名誉・利益などを惜しまず捧げたり捨てたりする。／事故や災難などによって命を失ったり、被害を受けたりする。
힘겹다=ある事をやり遂げるのが非常に難しい、または手に余る。／力が足りなくて何かをするのがひどく大変だ。
힘들어하다=ある仕事をするのが難しい、または辛いと感じる。／心が痛かったり苦しかったりして、耐えるのが難しく感じる。／境遇が困窮していたり事情が良くなかったりして、過ごすのが辛い。
